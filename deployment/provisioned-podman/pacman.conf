# Candidate policy: reconcile against the exact donor before build admission.
# A stricter donor policy must not be silently weakened to this candidate.
[options]
Architecture = x86_64
GPGDir = /etc/pacman.d/gnupg/
CacheDir = /var/cache/pacman/pkg/
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Required

[core]
Server = file:///opt/fsgg/acquired/repositories/core/os/x86_64

[extra]
Server = file:///opt/fsgg/acquired/repositories/extra/os/x86_64
