# Cross-repo guard on `registry = manifest = bytes` (.github#247, ADR-0017).
#
# `registry/skills.yml` declares, per row, the `source:` SKILL.md it was reconciled from and that
# body's `sha256:`. Every changelog entry restates the invariant; NOTHING enforced it. Each producer
# repo drift-guards its own manifest against its own bodies, which is internally consistent while
# being wrong — so a producer could merge a body change and this registry silently went stale. It had,
# for 14 of 32 rows, before this gate existed (see the 2026-07-08 changelog entry).
#
# The check needs the producer BODIES, which live in other repos, so it checks them out (public, no
# token) into a throwaway `.repos/` and runs `scripts/fsgg-skill-registry-check` over it. That is why
# this is a separate workflow rather than a step in coherence.yml.
#
# Triggers matter here more than usual: a producer merge staleness this registry WITHOUT any .github
# PR, so PR-only would never fire. Hence `schedule` — the same reasoning as `fsgg-sdd validate`'s
# scheduled deep check. `push: main` catches a bad reconcile immediately.
#
# This is the DETECTION half of the pair. Its RESPONSE twin is `skill-registry-autofix.yml`
# (.github#299): on the same schedule it runs `--write` and opens a standing re-digest PR, so a
# detected drift no longer waits for a human to run the reconcile by hand.
name: skill-registry-coherence

# THE FILTER CARRIES TWO SUBJECTS, BECAUSE THIS WORKFLOW RUNS TWO GATES (.github#1606).
#
# The trigger set below was authored around the ORIGINAL subject — the `registry/skills.yml`
# reconcile — and the `generate-driver-manifest --check` step was added later without widening it.
# This is the only workflow anywhere that runs that check, and its filter named NONE of the check's
# inputs and NEITHER of its outputs. So the manifest went stale in silence and the red surfaced on
# an unrelated PR: `edc8404b` staled it by editing `.claude/skills/pnext-item/references/`, ran four
# workflows and none of them asked; the failure then landed on #1590, which touches no skill at all
# and merely happened to match `registry/skills.yml`. The repair PR #1605 had the mirror-image blind
# spot — it regenerated the manifest and did not run the gate it was repairing, because neither
# output path was in the filter either.
#
# The second subject below is MEASURED from the emitter rather than restated from the issue, and the
# measurement is wider than the report was. `generate-driver-manifest --check` reads:
#   * ALL THREE skill roots — `validate_catalog()` walks `SKILL_ROOTS` and compares the three
#     directory manifests for byte identity, so a `.codex/skills/**`-only edit fails `--check` while
#     changing no output. `.codex` was in neither the issue nor any filter that runs the check.
#   * `tests/skill-registry/catalog-triggers.json` — already selected by `tests/skill-registry/**`.
#   * `registry/repos.yml` — `build_kit_manifest()` derives the coordination-kit rows from its `kit:`
#     section, so adding or removing a `kind: skill` row restales that manifest with no skill edit.
# and it WRITES `registry/driver-skill-manifest.json` and `registry/coordination-kit-skill-manifest.json`,
# which are here for the #1605 direction: a PR that FIXES a stale manifest must run the gate too.
#
# The list is not maintained by memory. `scripts/generate-driver-manifest` declares its surface as
# `PATHS_SUBJECT`, and `tests/skill-registry/run.sh` asserts that BOTH copies below select every
# entry of it — so widening what the emitter walks reds this filter until it is widened to match.
# #1639 made `check-paths-coherence.py` rule (c) recognize extensionless Python gates by shebang, so
# that general linkage now guards this filter too. The fixture retains its historical `edc8404b`
# regression, which is narrower than rule (c)'s declaration-level guarantee.
on:
  pull_request:
    paths:
      - "registry/skills.yml"
      - "scripts/fsgg-skill-registry-check"
      - "tests/skill-registry/**"
      - ".github/workflows/skill-registry-coherence.yml"
      # `generate-driver-manifest --check`'s inputs …
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "registry/repos.yml"
      - "scripts/generate-driver-manifest"
      # … and its outputs.
      - "registry/driver-skill-manifest.json"
      - "registry/coordination-kit-skill-manifest.json"
  push:
    branches: [main]
    paths:
      - "registry/skills.yml"
      - "scripts/fsgg-skill-registry-check"
      - "tests/skill-registry/**"
      - ".github/workflows/skill-registry-coherence.yml"
      # `generate-driver-manifest --check`'s inputs …
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "registry/repos.yml"
      - "scripts/generate-driver-manifest"
      # … and its outputs.
      - "registry/driver-skill-manifest.json"
      - "registry/coordination-kit-skill-manifest.json"
  # A producer body change stales the registry with no .github commit — only the schedule catches it.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Named distinctly: `coherence.yml` already contributes a check called `contract-coherence /
  # coherence`, and a bare `coherence` next to it is unreadable in the PR checks list.
  registry-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The driver-manifest gate checks its projection producer first.  Projections read typed
      # coordination facts, so build that source engine before either generator can claim current.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build the coord engine for projection freshness
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      - uses: ./.github/actions/setup-policy-python

      # The producer repos, at `main` — the bodies whose digests the registry declares. Public, so
      # the default GITHUB_TOKEN suffices.
      #
      # THE LIST IS DERIVED, NOT TYPED HERE (.github#2547). It used to be a literal
      # `for repo in FS.GG.SDD FS.GG.Rendering FS.GG.Game`, and FS.GG.Templates — a rostered repo
      # shipping a producer manifest that declares six `scope: product` skills — was simply not in
      # it. Every arm of the reconcile then ran GREEN over a producer set that excluded it: its
      # manifest was reconciled against nothing, and `declared-completeness`, the arm that caught
      # `fs-gg-feedback-report` twelve minutes after it shipped, had no way to report six rows that
      # were missing from a producer it could not see. A hardcoded clone loop is not a detail of
      # this workflow; it is the population every check below quantifies over.
      #
      # `--producers` prints the FS-GG repositories `registry/repos.yml` rosters, and the reconcile's
      # own `roster_reachable` arm reds if any of them is absent from `--repos-root`. So the loop and
      # the gate cannot drift: the gate fails on exactly the set this step failed to produce, rather
      # than silently agreeing with it. Rostered repos that carry no manifest (FS.GG.Governance,
      # FS.GG.Audio, FS.GG.Net today) are cloned and skipped — cheap, and the alternative is asking
      # the question by not asking it.
      #
      # `.github` is ALSO a producer now (ADR-0054): it authors its own `scope: driver` skills and
      # emits registry/driver-skill-manifest.json. But it is not a REMOTE to clone — it is THIS
      # checkout — so it is made reachable under the same --repos-root the others use with a symlink,
      # NOT a network fetch. The reconcile reads specific files (the manifest + each source SKILL.md)
      # and lists one level of --repos-root; it never walks the tree, so the symlink pointing back at
      # the workspace (which contains .repos) cannot recurse it. The registry names `.github` by its
      # `source:` prefix, so a missing .repos/.github would be a fail-closed `manifest-found` finding.
      - name: Check out the producer repos
        run: |
          set -euo pipefail
          mkdir -p .repos
          # An unreadable roster exits 2 here rather than yielding an empty list, so this loop can
          # never clone nothing and leave every check below green over an empty world.
          producers="$(python scripts/fsgg-skill-registry-check --producers)"
          echo "rostered producers (registry/repos.yml):"; echo "$producers"
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            # `.github` is a producer of its own driver/operator skills (ADR-0054), but it is THIS
            # checkout — link it rather than cloning a second copy of main, which would reconcile
            # the workspace's skills.yml against main's driver manifest instead of this tree's.
            if [ "$repo" = ".github" ]; then
              ln -s "$GITHUB_WORKSPACE" .repos/.github
              echo "linked .github (this checkout) @ $(git rev-parse --short HEAD)"
              continue
            fi
            git clone --depth 1 --filter=blob:none \
              "https://github.com/FS-GG/$repo.git" ".repos/$repo"
            echo "cloned $repo @ $(git -C ".repos/$repo" rev-parse --short HEAD)"
          done <<< "$producers"

      # THE MERGE BASE'S registry — and ONLY on a pull request (#422).
      #
      # A PR is judged on what IT did; `main` and the schedule are judged on the world. Those are
      # different questions, and collapsing them jammed the fabric shut: a judgement finding
      # cannot be fixed mechanically, so once one exists it
      # stands until a human lands a multi-repo change — and with one all-or-nothing verdict it sat on
      # the autofix bot's own PR, failing it for the very findings the bot had correctly refused to
      # touch. The bot ran daily, reconciled the digests, opened its PR, and the PR could never be
      # green. Eight stale digests accumulated behind it, and #595 sat open and permanently red.
      #
      # `git fetch` of the base SHA, not `origin/main`: a PR is merged against the base it was opened
      # from, and reading today's `main` would let a change that landed *after* this PR branched be
      # attributed to it — a finding somebody else introduced, failing somebody else's PR.
      - name: The merge base's registry (pull requests only)
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/baseline-skills.yml"

          # EVERY FAILURE HERE FALLS BACK TO THE ABSOLUTE VERDICT, NAMED — never to a red PR nobody can
          # act on. A force-pushed base, or a SHA that has been garbage-collected, would otherwise kill
          # this step under `set -e` and fail the PR with a bare `git` error for a reason that has
          # nothing to do with its contents. That is how an operator learns to ignore a gate, and it is
          # the same care the `--baseline-registry` error path already takes.
          if ! git fetch --depth 1 origin "$BASE_SHA" 2>/dev/null; then
            echo "::warning::could not fetch the merge base ${BASE_SHA:0:12} (force-pushed? gc'd?)."
            echo "::warning::Falling back to the ABSOLUTE verdict — this PR is judged on the whole world."
            exit 0
          fi

          # A base that does not carry the registry at all is a legitimate answer — the file is new in
          # this PR, so EVERY finding in it is genuinely introduced here. Emit nothing and let the
          # absolute verdict apply, rather than inventing an empty baseline that would excuse them.
          if git cat-file -e "$BASE_SHA:registry/skills.yml" 2>/dev/null; then
            git show "$BASE_SHA:registry/skills.yml" > "$out"
            echo "path=$out" >> "$GITHUB_OUTPUT"
            echo "baseline: registry/skills.yml @ ${BASE_SHA:0:12}"
          else
            echo "baseline: the merge base has no registry/skills.yml — every finding is NEW here."
          fi

      # On `main` and on the schedule, BASELINE is empty and the verdict is ABSOLUTE: any finding is
      # red. That is what keeps a standing judgement finding visible instead of forgiven.
      #
      # The path travels through `env:`, never `${{ }}` interpolated into the shell — the fixture next
      # door already asserts that of the autofix workflow's stamp, and a value spliced into a `run:`
      # body is one edit away from being a value somebody else controls.
      # .github's OWN driver skill-manifest must be current with the authored SKILL.md bodies it
      # digests (ADR-0054) — the producer-emitter half of `registry = manifest = bytes` for the driver
      # class. This is the regeneration gate rostered in scripts/generated-paths (so verify-paths
      # subtracts the artifact); the reconcile below is the consumer half.
      - name: Driver skill-manifest is current
        run: python scripts/generate-driver-manifest --check

      - name: Assert registry = manifest = bytes
        env:
          BASELINE: ${{ steps.baseline.outputs.path }}
        run: |
          set -euo pipefail
          if [ -n "$BASELINE" ]; then
            python scripts/fsgg-skill-registry-check --repos-root .repos --baseline-registry "$BASELINE"
          else
            python scripts/fsgg-skill-registry-check --repos-root .repos
          fi

  # The tool's own fixture — offline, temp registry + temp producer trees. Proves it catches a stale
  # digest, a missing source, a diverged predicate, and a malformed digest, and that `--write`
  # rewrites only the stale sha256. Mirrors surface-impact-selftest.yml.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run the skill-registry fixture
        run: bash tests/skill-registry/run.sh
