# Cross-repo guard on `registry = manifest = bytes` (.github#247, ADR-0017).
#
# `registry/skills.yml` declares, per row, the `source:` SKILL.md it was reconciled from and that
# body's `sha256:`. Every changelog entry restates the invariant; NOTHING enforced it. Each producer
# repo drift-guards its own manifest against its own bodies, which is internally consistent while
# being wrong — so a producer could merge a body change and this registry silently went stale. It had,
# for 14 of 32 rows, before this gate existed (see the 2026-07-08 changelog entry).
#
# The check needs the producer BODIES, which live in other repos, so it checks them out (public, no
# token) into a throwaway `.repos/` and runs `scripts/fsgg-skill-registry-check` over it. That is why
# this is a separate workflow rather than a step in coherence.yml.
#
# Triggers matter here more than usual: a producer merge staleness this registry WITHOUT any .github
# PR, so PR-only would never fire. Hence `schedule` — the same reasoning as `fsgg-sdd validate`'s
# scheduled deep check. `push: main` catches a bad reconcile immediately.
#
# This is the DETECTION half of the pair. Its RESPONSE twin is `skill-registry-autofix.yml`
# (.github#299): on the same schedule it runs `--write` and opens a standing re-digest PR, so a
# detected drift no longer waits for a human to run the reconcile by hand.
name: skill-registry-coherence

on:
  pull_request:
    paths:
      - "registry/skills.yml"
      - "scripts/fsgg-skill-registry-check"
      - "tests/skill-registry/**"
      - ".github/workflows/skill-registry-coherence.yml"
  push:
    branches: [main]
    paths:
      - "registry/skills.yml"
      - "scripts/fsgg-skill-registry-check"
      - ".github/workflows/skill-registry-coherence.yml"
  # A producer body change stales the registry with no .github commit — only the schedule catches it.
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Named distinctly: `coherence.yml` already contributes a check called `contract-coherence /
  # coherence`, and a bare `coherence` next to it is unreadable in the PR checks list.
  registry-coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      # The producer repos, at `main` — the bodies whose digests the registry declares. Public, so
      # the default GITHUB_TOKEN suffices. Paths mirror the `source:` prefixes in skills.yml.
      - name: Check out the producer repos
        run: |
          set -euo pipefail
          mkdir -p .repos
          for repo in FS.GG.SDD FS.GG.Rendering FS.GG.Game; do
            git clone --depth 1 --filter=blob:none \
              "https://github.com/FS-GG/$repo.git" ".repos/$repo"
            echo "cloned $repo @ $(git -C ".repos/$repo" rev-parse --short HEAD)"
          done

      # THE MERGE BASE'S registry — and ONLY on a pull request (#422).
      #
      # A PR is judged on what IT did; `main` and the schedule are judged on the world. Those are
      # different questions, and collapsing them jammed the fabric shut: a `frozen-mirror` divergence
      # cannot be fixed from this repo (the mirror lives in FS.GG.Rendering), so once one exists it
      # stands until a human lands a multi-repo change — and with one all-or-nothing verdict it sat on
      # the autofix bot's own PR, failing it for the very findings the bot had correctly refused to
      # touch. The bot ran daily, reconciled the digests, opened its PR, and the PR could never be
      # green. Eight stale digests accumulated behind it, and #595 sat open and permanently red.
      #
      # `git fetch` of the base SHA, not `origin/main`: a PR is merged against the base it was opened
      # from, and reading today's `main` would let a change that landed *after* this PR branched be
      # attributed to it — a finding somebody else introduced, failing somebody else's PR.
      - name: The merge base's registry (pull requests only)
        if: github.event_name == 'pull_request'
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --depth 1 origin "$BASE_SHA"
          # A base that does not carry the registry at all is a legitimate answer — the file is new in
          # this PR, so EVERY finding in it is genuinely introduced here. Emit nothing and let the
          # absolute verdict apply, rather than inventing an empty baseline that would excuse them.
          if git cat-file -e "$BASE_SHA:registry/skills.yml" 2>/dev/null; then
            git show "$BASE_SHA:registry/skills.yml" > /tmp/baseline-skills.yml
            echo "path=/tmp/baseline-skills.yml" >> "$GITHUB_OUTPUT"
            echo "baseline: registry/skills.yml @ ${BASE_SHA:0:12}"
          else
            echo "baseline: the merge base has no registry/skills.yml — every finding is NEW here."
          fi

      # On `main` and on the schedule, `--baseline-registry` is absent and the verdict is ABSOLUTE:
      # any finding is red. That is what keeps a standing frozen-mirror visible instead of forgiven.
      - name: Assert registry = manifest = bytes
        run: |
          python scripts/fsgg-skill-registry-check --repos-root .repos \
            ${{ steps.baseline.outputs.path && format('--baseline-registry {0}', steps.baseline.outputs.path) || '' }}

  # The tool's own fixture — offline, temp registry + temp producer trees. Proves it catches a stale
  # digest, a missing source, a diverged frozen mirror, and a malformed digest, and that `--write`
  # rewrites only the stale sha256. Mirrors surface-impact-selftest.yml.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run the skill-registry fixture
        run: bash tests/skill-registry/run.sh
