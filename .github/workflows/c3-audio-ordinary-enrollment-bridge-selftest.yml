name: C3 Audio ordinary enrollment bridge self-test

on:
  pull_request:
    paths:
      - ".github/workflows/c3-audio-ordinary-enrollment-bridge.yml"
      - ".github/workflows/c3-audio-ordinary-enrollment-bridge-selftest.yml"
      - "tools/c3-audio-ordinary-enrollment-bridge.py"
      - "tools/c3-audio-ordinary-enrollment-submit.py"
      - "tests/c3-audio-ordinary-enrollment-bridge/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/c3-audio-ordinary-enrollment-bridge.yml"
      - ".github/workflows/c3-audio-ordinary-enrollment-bridge-selftest.yml"
      - "tools/c3-audio-ordinary-enrollment-bridge.py"
      - "tools/c3-audio-ordinary-enrollment-submit.py"
      - "tests/c3-audio-ordinary-enrollment-bridge/**"

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: c3-audio-ordinary-enrollment-bridge-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    name: c3-audio-ordinary-enrollment-bridge-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise bridge and submission refusal controls
        run: |
          python3 tests/c3-audio-ordinary-enrollment-bridge/run.py
          python3 tests/c3-audio-ordinary-enrollment-bridge/submit.py
