name: Coordinate board lifecycle projection

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, reopened, edited, synchronize, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # NEITHER check_suite NOR workflow_run IS HERE (round-2 review repair, .github#2264 PR #2271).
  #
  # check_suite: types: [completed] was REMOVED, not fixed — GitHub's docs are explicit: "this event
  # does not trigger workflows if the check suite was created by GitHub Actions." This repo's CI is
  # entirely GitHub Actions, so every check_suite on every commit here is Actions-authored, and this
  # trigger could never once have fired. It was dead on arrival, silently, alongside the workflow_run
  # defect below — the same "mechanism present, nothing executing it" shape `rook-b01d` found in the
  # code layer, one layer up in the workflow layer.
  #
  # workflow_run: types: [completed] was REMOVED, not repaired with a `workflows:` list. It requires
  # one (its absence is what made this whole file fail to parse and start — GitHub scheduled ZERO jobs
  # for it, invisible to `check-runs`, only visible via `gh run list`/the runs API). Naming this repo's
  # CI workflows just to make the parse succeed would need updating on every future CI workflow
  # add/rename — a maintenance burden with no compensating value: `pull_request: [synchronize]` already
  # fires a reconcile pass on every push (CI may still be running then; `PullRequest.ReviewOrCiActive`
  # reads the live PR/CI state at THAT reconcile pass, not the triggering payload), and the hourly
  # `schedule` below is exactly the "scheduled reconciliation fallback" AC-2 asks for — it closes the
  # gap between a push-triggered pass and CI's actual completion within the hour, which is the same
  # bound the item accepts everywhere else it is not itself the live event.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

# .github#2361 (measured residual of #2352): a REPO-WIDE group is what actually manufactures the
# cancellations, not the job-level `if` above. GitHub Actions holds at most one RUNNING and one
# PENDING run per concurrency group; a newer run for that same group evicts the pending one — this
# happens BEFORE any job's `if` is evaluated, and it happens regardless of `cancel-in-progress`
# (that setting only governs whether a newer run may cancel a currently-RUNNING one; it has no
# bearing on the single-pending-slot eviction, which GitHub applies unconditionally). Measured:
# 22/37 issue_comment-triggered runs cancelled, and separately a `pull_request` run cancelled by
# unrelated issue_comment traffic silently blocked PR #2383 (`reconcile` context went MISSING, not
# red — see the issue's evidence comments).
#
# `${{ github.repository }}` alone puts EVERY event this workflow answers to — every marker/receipt
# comment on every open issue and PR, every `issues`/`pull_request`/`pull_request_review` event, the
# hourly `schedule`, every `workflow_dispatch` — into that one shared group. A `drive-board` wave
# generates dozens of `issue_comment` events spread across many DIFFERENT issues/PRs in the same few
# minutes; none of that traffic is related to any other item, yet it all contends for the same one
# pending slot.
#
# Keying the group by the issue/PR the event actually targets removes that unrelated contention:
# comments on issue #A no longer evict a pending run for PR #B. `pull_request`/`pull_request_review`
# carry `github.event.pull_request.number`; `issues`/`issue_comment` carry `github.event.issue.number`
# (which equals the PR number when the comment is ON a PR, so a PR's own review-marker traffic stays
# correctly serialized with that PR's own push-triggered runs — only truly UNRELATED issues/PRs are
# separated). `schedule`/`workflow_dispatch` carry neither, so they fall back to one fixed literal
# group shared only among themselves (unaffected by any issue/PR traffic, and still serialized
# against each other so two full-board scans never overlap).
#
# `cancel-in-progress: false` is UNCHANGED and must stay false: `src/FS.GG.Coord.Core/Landable.fs:56-59`
# (`#698`) requires that a run which starts is allowed to finish rather than being killed mid-scan by
# a newer trigger — this fix narrows WHO contends for the slot, not whether an in-progress run may be
# cancelled by a legitimate successor in its own, now-narrower group.
concurrency:
  group: >-
    coord-board-reconcile-${{ github.repository }}-${{ github.event.pull_request.number ||
    github.event.issue.number || 'periodic' }}
  cancel-in-progress: false

jobs:
  # .github#2354: this job id/name is deliberately left as the bare `reconcile` — no override. This
  # is the ONE job of the three that branch protection's required `reconcile` context actually means
  # (`architecture-map.yml` and `feed-autofix.yml` each carry their own unrelated `reconcile` job id;
  # #2354 gave THOSE two a disambiguating job-level `name:` instead, rather than renaming this one and
  # having to re-point `branches/main/protection`'s required-status-check list to match). If this job
  # is ever renamed, branch protection's required context MUST be updated in the same change, or the
  # required check silently stops being satisfiable by real board reconciliation.
  reconcile:
    # .github#2352 AC-1: the protocol's OWN comments are the dominant source of `issue_comment` volume —
    # delivery-route receipts, obligation declarations/receipts, independent-review markers, host
    # acceptance markers, and (heaviest of all) the claim marker, which is EDITED on every lease
    # heartbeat/renewal rather than posted once. A single item moving through review posts a dozen or
    # more of these, and every one used to schedule a full ~2000-item board scan. Every machine comment
    # this protocol posts carries a leading `<!-- fsgg:...` marker line (SKILL.md's own vocabulary for
    # them), so that prefix is the exact, already-load-bearing signal to filter on — not a heuristic
    # invented for this fix. A genuine HUMAN issue/PR comment (no marker) still schedules a reconcile;
    # only the trigger is filtered, never the `issues`/`pull_request`/`pull_request_review`/`schedule`/
    # `workflow_dispatch` paths below, which this condition does not touch.
    #
    # GitHub evaluates `issue_comment.deleted` with the deleted comment's own `comment.body` still
    # present in the payload, so the same prefix check covers created/edited/deleted uniformly.
    if: >-
      github.event_name != 'issue_comment' ||
      !startsWith(github.event.comment.body, '<!-- fsgg:')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ADR-0040 Phase C/D: `scripts/fsgg-coord` is the §4.4 shim, which EXECS a compiled
      # `fsgg-coord-engine` rather than being the engine itself. `.github` never restores it from the
      # feed (ADR-0034 §4.3), so a runner that only calls the shim without building first gets
      # "no fsgg-coord engine found" (exit 69) — exactly the round-2 review repair on this workflow:
      # the `on:` block fix alone got a job scheduled, and this is what the job then hit. Mirrors
      # `touch-set-drift.yml`'s established build-then-run wiring, the one other workflow that
      # executes the client on a runner rather than only referencing it in a comment or path filter.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build the engine (the shim execs it, ADR-0040 D.2)
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # THE HAPPY PATH (round 2, second repair): the maintainer granted `fs-gg-cross-repo-dispatch`
      # (provisioned .github#21, secrets FSGG_DISPATCH_APP_ID/FSGG_DISPATCH_APP_PRIVATE_KEY) Organization
      # permissions -> Projects: Read and write. The default GITHUB_TOKEN still cannot see an org-owned
      # Projects v2 board (that limit is GitHub's, not this installation's) — an App installation token
      # can, so this mints one rather than trying to reconfigure GITHUB_TOKEN, matching the shape
      # `release-coord-engine.yml`/`kit-auto-publish.yml`/`skill-registry-autofix.yml`/
      # `permission-coherence.yml`/`dashboard-tick-selftest.yml` already use for this same App elsewhere
      # in this repo, rather than inventing a sixth pattern.
      #
      # `permission-organization-projects: write` is also the VERIFICATION, not just the request:
      # `actions/create-github-app-token` refuses to mint when the installation lacks a requested scope
      # (.github#1930), so a green mint step IS proof the grant landed — no separate assertion needed.
      # `permission-issues`/`permission-pull-requests` are requested explicitly alongside it because this
      # action grants ONLY the permissions named, never the installation's full grant by default omission
      # (unlike the no-`permission-*` mints elsewhere in this repo that push commits as the App and want
      # everything) — reconcile posts issue comments (the watermark/done-receipt markers) and reads PR
      # facts (landable, head sha), so both are real, not defensive over-asks.
      - name: Mint an installation token with Projects v2 access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          owner: FS-GG
          permission-organization-projects: write
          permission-issues: write
          permission-pull-requests: read

      # ExitNoVerdict (4) mapped to ::warning:: + exit 0 (round-2 review repair, .github#2264 PR #2271),
      # in the style `coherence.yml`'s roster-closure step already established for the identical shape.
      # KEPT even though the mint above now supplies a working credential in normal operation: a token
      # can be revoked, rotated, or fail transiently, and "could not reach the board" must never render
      # as "reached it, nothing to do" (.github#1611/#1582 — an unattended gate that is always red trains
      # a reader to ignore red as effectively as one that silently never runs; #266's converse applies to
      # a vacuous green too). `Client.boardUnreachable` (`.github#2264` round 2) is what makes `reconcile`
      # emit 4 — a distinguishing, tested classification, not a blanket "any error is soft" — SPECIFICALLY
      # for "the board itself could not be resolved", never for "reached the board, nothing to reconcile"
      # (still exit 0, a real success) and never for a genuine finding (still exit 1/3, still fails the
      # step).
      #
      # `--worker coord-board-reconcile`: `--apply` attributes every board write it makes (ADR-0027), and
      # with a real Projects v2 credential now reachable this run genuinely reached that code path for the
      # first time and refused for want of one (`could not derive a worker id: no --worker, no
      # $FSGG_WORKER, and no agent session`). A FIXED id is the right answer here, not a minted per-run
      # one: this job is a mechanical, rule-derived projection with no judgement calls to attribute to an
      # individual, and `concurrency: cancel-in-progress: false` above already serialises every run of
      # this workflow onto one queue — so unlike a human/agent worker there is no fan-out for a shared id
      # to double-claim across.
      # .github#2352 AC-3: read a REST budget reserve and DEFER rather than compete for what is left.
      # `/rate_limit` is documented by GitHub to cost nothing against `core` itself, so this check is
      # free even on every run where the reserve turns out fine. A full reconcile of this repo's
      # ~2000-item board is the single most expensive read this fleet's automation makes; refusing to
      # START one below a comfortable floor is cheaper than starting one and running the budget to zero
      # mid-scan, which is the exact shape .github#2352 observed (`gh run view 31429893232 --log-failed`
      # → `budget EXHAUSTED … core`, exit 75). RESERVE is a floor, not a precisely tuned constant — it
      # only has to be comfortably above what a single `claim`/`take` needs so a worker never finds the
      # tank empty because this job ran first.
      - name: Check REST budget before scanning
        id: budget
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set +e
          remaining="$(curl -sS --max-time 10 --retry 2 -H "Authorization: Bearer ${GITHUB_TOKEN}" -H "Accept: application/vnd.github+json" https://api.github.com/rate_limit | jq -r '.resources.core.remaining // empty')"
          reserve=750
          {
            echo "remaining=${remaining}"
            echo "reserve=${reserve}"
          } >> "$GITHUB_OUTPUT"
          if [ -z "$remaining" ]; then
            echo "defer_reason=could not read the REST budget reserve before scanning (rate_limit read failed or returned no core.remaining)" >> "$GITHUB_OUTPUT"
            echo "defer=true" >> "$GITHUB_OUTPUT"
          elif [ "$remaining" -lt "$reserve" ]; then
            echo "defer_reason=REST core budget is low (${remaining} remaining, reserve is ${reserve}) before this run's own scan would even start" >> "$GITHUB_OUTPUT"
            echo "defer=true" >> "$GITHUB_OUTPUT"
          else
            echo "defer=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Defer — REST budget reserve not met
        if: steps.budget.outputs.defer == 'true'
        env:
          FSGG_LIFECYCLE_EVENT: ${{ github.event_name }}
        run: |
          observed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          printf '### Coordination lifecycle reconciliation\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- trigger: `%s`\n- observed-at: `%s`\n- result: DEFERRED — %s\n' \
            "$FSGG_LIFECYCLE_EVENT" "$observed_at" "${{ steps.budget.outputs.defer_reason }}" >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::coord-board-reconcile: NO VERDICT, not a pass — ${{ steps.budget.outputs.defer_reason }}. Deferring rather than competing for what is left; the hourly schedule and the next admitted trigger will retry. This is not the same as reaching the board and finding it correct, and it is not the same as a genuine finding. See .github#2352."

      # ExitNoVerdict (4) mapped to ::warning:: + exit 0 (round-2 review repair, .github#2264 PR #2271),
      # in the style `coherence.yml`'s roster-closure step already established for the identical shape.
      # KEPT even though the mint above now supplies a working credential in normal operation: a token
      # can be revoked, rotated, or fail transiently, and "could not reach the board" must never render
      # as "reached it, nothing to do" (.github#1611/#1582 — an unattended gate that is always red trains
      # a reader to ignore red as effectively as one that silently never runs; #266's converse applies to
      # a vacuous green too). `Client.boardUnreachable` (`.github#2264` round 2) is what makes `reconcile`
      # emit 4 — a distinguishing, tested classification, not a blanket "any error is soft" — SPECIFICALLY
      # for "the board itself could not be resolved", never for "reached the board, nothing to reconcile"
      # (still exit 0, a real success) and never for a genuine finding (still exit 1/3, still fails the
      # step).
      #
      # EX_RATE (75) mapped the same way (.github#2352, AC-2): this repo's own round-2 decision on #2264
      # was "make the board-credential gap a distinguishable no-verdict, not a permanent red", and a
      # budget exhaustion is the identical shape — transient, environmental, self-inflicted, and it means
      # the reconcile DID NOT RUN, which is never the same claim as "ran, and the board is wrong"
      # (.github#1611/#1582). The pre-flight check above already defers most of these before they start;
      # this is the residual case where the budget was fine at the check and ran out mid-scan anyway.
      #
      # `--worker coord-board-reconcile`: `--apply` attributes every board write it makes (ADR-0027), and
      # with a real Projects v2 credential now reachable this run genuinely reached that code path for the
      # first time and refused for want of one (`could not derive a worker id: no --worker, no
      # $FSGG_WORKER, and no agent session`). A FIXED id is the right answer here, not a minted per-run
      # one: this job is a mechanical, rule-derived projection with no judgement calls to attribute to an
      # individual, and `concurrency: cancel-in-progress: false` above already serialises every run of
      # this workflow onto one queue — so unlike a human/agent worker there is no fan-out for a shared id
      # to double-claim across.
      - name: Reconcile lifecycle projection
        if: steps.budget.outputs.defer != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
          FSGG_LIFECYCLE_EVENT: ${{ github.event_name }}
          FSGG_LIFECYCLE_EVENT_AT: ${{ github.event.repository.updated_at || github.run_started_at }}
        run: |
          set +e
          result="$(scripts/fsgg-coord reconcile --repo FS-GG/.github --apply --json --worker coord-board-reconcile)"
          rc=$?
          set -e
          observed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          printf '### Coordination lifecycle reconciliation\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- trigger: `%s`\n- observed-at: `%s`\n- exit: `%s`\n- result: `%s`\n' "$FSGG_LIFECYCLE_EVENT" "$observed_at" "$rc" "$result" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$result"
          if [ "$rc" -eq 4 ]; then
            echo "::warning::coord-board-reconcile: NO VERDICT, not a pass — the Coordination Projects v2 board itself could not be resolved. The mint step above requests Projects v2 access from the fs-gg-cross-repo-dispatch App and normally supplies a working credential (the grant landed, .github#2332); this path firing anyway means that credential could not reach the board right now — revoked, rotated, or a transient failure — not a structural gap. Distinct from a real success (reached the board, nothing to reconcile, which stays exit 0) and from a real finding (which still fails this step). See the engine's own diagnostic on stdout above, and .github#2332 for the credential's history."
            exit 0
          fi
          if [ "$rc" -eq 75 ]; then
            echo "::warning::coord-board-reconcile: NO VERDICT, not a pass — this run's own REST budget (core) was exhausted DURING the scan, after the pre-flight reserve check passed. A budget exhaustion means the reconcile did not run to completion, which is not the same as the board being wrong — .github#2264's round-2 principle applies identically to a budget gap. Distinct from a real success (exit 0) and from a genuine finding (still exit 1/3, which still fails this step). See .github#2352."
            exit 0
          fi
          exit "$rc"
