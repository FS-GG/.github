name: Retired board lifecycle projection diagnostic

# ADR-0091 retired the legacy automatic v1 board projection writer. This manual diagnostic is
# deliberately credential-free and does not inspect or mutate board state. It is not a replacement
# V2 projection writer and must never become a required reconciliation status context.
on:
  workflow_dispatch:

permissions: {}

jobs:
  retired-board-projection-diagnostic:
    name: Retired board projection diagnostic (manual only)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Report the retired boundary
        run: echo "retired under ADR-0091; board state not evaluated; V2 projection writer not activated"
