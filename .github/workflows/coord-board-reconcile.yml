name: Coordinate board lifecycle projection

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, reopened, edited, synchronize, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # NEITHER check_suite NOR workflow_run IS HERE (round-2 review repair, .github#2264 PR #2271).
  #
  # check_suite: types: [completed] was REMOVED, not fixed — GitHub's docs are explicit: "this event
  # does not trigger workflows if the check suite was created by GitHub Actions." This repo's CI is
  # entirely GitHub Actions, so every check_suite on every commit here is Actions-authored, and this
  # trigger could never once have fired. It was dead on arrival, silently, alongside the workflow_run
  # defect below — the same "mechanism present, nothing executing it" shape `rook-b01d` found in the
  # code layer, one layer up in the workflow layer.
  #
  # workflow_run: types: [completed] was REMOVED, not repaired with a `workflows:` list. It requires
  # one (its absence is what made this whole file fail to parse and start — GitHub scheduled ZERO jobs
  # for it, invisible to `check-runs`, only visible via `gh run list`/the runs API). Naming this repo's
  # CI workflows just to make the parse succeed would need updating on every future CI workflow
  # add/rename — a maintenance burden with no compensating value: `pull_request: [synchronize]` already
  # fires a reconcile pass on every push (CI may still be running then; `PullRequest.ReviewOrCiActive`
  # reads the live PR/CI state at THAT reconcile pass, not the triggering payload), and the hourly
  # `schedule` below is exactly the "scheduled reconciliation fallback" AC-2 asks for — it closes the
  # gap between a push-triggered pass and CI's actual completion within the hour, which is the same
  # bound the item accepts everywhere else it is not itself the live event.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coord-board-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ADR-0040 Phase C/D: `scripts/fsgg-coord` is the §4.4 shim, which EXECS a compiled
      # `fsgg-coord-engine` rather than being the engine itself. `.github` never restores it from the
      # feed (ADR-0034 §4.3), so a runner that only calls the shim without building first gets
      # "no fsgg-coord engine found" (exit 69) — exactly the round-2 review repair on this workflow:
      # the `on:` block fix alone got a job scheduled, and this is what the job then hit. Mirrors
      # `touch-set-drift.yml`'s established build-then-run wiring, the one other workflow that
      # executes the client on a runner rather than only referencing it in a comment or path filter.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build the engine (the shim execs it, ADR-0040 D.2)
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # THE HAPPY PATH (round 2, second repair): the maintainer granted `fs-gg-cross-repo-dispatch`
      # (provisioned .github#21, secrets FSGG_DISPATCH_APP_ID/FSGG_DISPATCH_APP_PRIVATE_KEY) Organization
      # permissions -> Projects: Read and write. The default GITHUB_TOKEN still cannot see an org-owned
      # Projects v2 board (that limit is GitHub's, not this installation's) — an App installation token
      # can, so this mints one rather than trying to reconfigure GITHUB_TOKEN, matching the shape
      # `release-coord-engine.yml`/`kit-auto-publish.yml`/`skill-registry-autofix.yml`/
      # `permission-coherence.yml`/`dashboard-tick-selftest.yml` already use for this same App elsewhere
      # in this repo, rather than inventing a sixth pattern.
      #
      # `permission-organization-projects: write` is also the VERIFICATION, not just the request:
      # `actions/create-github-app-token` refuses to mint when the installation lacks a requested scope
      # (.github#1930), so a green mint step IS proof the grant landed — no separate assertion needed.
      # `permission-issues`/`permission-pull-requests` are requested explicitly alongside it because this
      # action grants ONLY the permissions named, never the installation's full grant by default omission
      # (unlike the no-`permission-*` mints elsewhere in this repo that push commits as the App and want
      # everything) — reconcile posts issue comments (the watermark/done-receipt markers) and reads PR
      # facts (landable, head sha), so both are real, not defensive over-asks.
      - name: Mint an installation token with Projects v2 access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          owner: FS-GG
          permission-organization-projects: write
          permission-issues: write
          permission-pull-requests: read

      # ExitNoVerdict (4) mapped to ::warning:: + exit 0 (round-2 review repair, .github#2264 PR #2271),
      # in the style `coherence.yml`'s roster-closure step already established for the identical shape.
      # KEPT even though the mint above now supplies a working credential in normal operation: a token
      # can be revoked, rotated, or fail transiently, and "could not reach the board" must never render
      # as "reached it, nothing to do" (.github#1611/#1582 — an unattended gate that is always red trains
      # a reader to ignore red as effectively as one that silently never runs; #266's converse applies to
      # a vacuous green too). `Client.boardUnreachable` (`.github#2264` round 2) is what makes `reconcile`
      # emit 4 — a distinguishing, tested classification, not a blanket "any error is soft" — SPECIFICALLY
      # for "the board itself could not be resolved", never for "reached the board, nothing to reconcile"
      # (still exit 0, a real success) and never for a genuine finding (still exit 1/3, still fails the
      # step).
      #
      # `--worker coord-board-reconcile`: `--apply` attributes every board write it makes (ADR-0027), and
      # with a real Projects v2 credential now reachable this run genuinely reached that code path for the
      # first time and refused for want of one (`could not derive a worker id: no --worker, no
      # $FSGG_WORKER, and no agent session`). A FIXED id is the right answer here, not a minted per-run
      # one: this job is a mechanical, rule-derived projection with no judgement calls to attribute to an
      # individual, and `concurrency: cancel-in-progress: false` above already serialises every run of
      # this workflow onto one queue — so unlike a human/agent worker there is no fan-out for a shared id
      # to double-claim across.
      - name: Reconcile lifecycle projection
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
          FSGG_LIFECYCLE_EVENT: ${{ github.event_name }}
          FSGG_LIFECYCLE_EVENT_AT: ${{ github.event.repository.updated_at || github.run_started_at }}
        run: |
          set +e
          result="$(scripts/fsgg-coord reconcile --repo FS-GG/.github --apply --json --worker coord-board-reconcile)"
          rc=$?
          set -e
          observed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          printf '### Coordination lifecycle reconciliation\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- trigger: `%s`\n- observed-at: `%s`\n- exit: `%s`\n- result: `%s`\n' "$FSGG_LIFECYCLE_EVENT" "$observed_at" "$rc" "$result" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$result"
          if [ "$rc" -eq 4 ]; then
            echo "::warning::coord-board-reconcile: NO VERDICT, not a pass — the Coordination Projects v2 board itself could not be resolved. The mint step above requests Projects v2 access from the fs-gg-cross-repo-dispatch App and normally supplies a working credential (the grant landed, .github#2332); this path firing anyway means that credential could not reach the board right now — revoked, rotated, or a transient failure — not a structural gap. Distinct from a real success (reached the board, nothing to reconcile, which stays exit 0) and from a real finding (which still fails this step). See the engine's own diagnostic on stdout above, and .github#2332 for the credential's history."
            exit 0
          fi
          exit "$rc"
