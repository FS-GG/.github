name: Coordinate board lifecycle projection

on:
  issue_comment:
    types: [created, edited, deleted]
  issues:
    types: [opened, edited, closed, reopened]
  pull_request:
    types: [opened, reopened, edited, synchronize, closed]
  pull_request_review:
    types: [submitted, edited, dismissed]
  # NEITHER check_suite NOR workflow_run IS HERE (round-2 review repair, .github#2264 PR #2271).
  #
  # check_suite: types: [completed] was REMOVED, not fixed — GitHub's docs are explicit: "this event
  # does not trigger workflows if the check suite was created by GitHub Actions." This repo's CI is
  # entirely GitHub Actions, so every check_suite on every commit here is Actions-authored, and this
  # trigger could never once have fired. It was dead on arrival, silently, alongside the workflow_run
  # defect below — the same "mechanism present, nothing executing it" shape `rook-b01d` found in the
  # code layer, one layer up in the workflow layer.
  #
  # workflow_run: types: [completed] was REMOVED, not repaired with a `workflows:` list. It requires
  # one (its absence is what made this whole file fail to parse and start — GitHub scheduled ZERO jobs
  # for it, invisible to `check-runs`, only visible via `gh run list`/the runs API). Naming this repo's
  # CI workflows just to make the parse succeed would need updating on every future CI workflow
  # add/rename — a maintenance burden with no compensating value: `pull_request: [synchronize]` already
  # fires a reconcile pass on every push (CI may still be running then; `PullRequest.ReviewOrCiActive`
  # reads the live PR/CI state at THAT reconcile pass, not the triggering payload), and the hourly
  # `schedule` below is exactly the "scheduled reconciliation fallback" AC-2 asks for — it closes the
  # gap between a push-triggered pass and CI's actual completion within the hour, which is the same
  # bound the item accepts everywhere else it is not itself the live event.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: read
  repository-projects: write

concurrency:
  group: coord-board-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # ADR-0040 Phase C/D: `scripts/fsgg-coord` is the §4.4 shim, which EXECS a compiled
      # `fsgg-coord-engine` rather than being the engine itself. `.github` never restores it from the
      # feed (ADR-0034 §4.3), so a runner that only calls the shim without building first gets
      # "no fsgg-coord engine found" (exit 69) — exactly the round-2 review repair on this workflow:
      # the `on:` block fix alone got a job scheduled, and this is what the job then hit. Mirrors
      # `touch-set-drift.yml`'s established build-then-run wiring, the one other workflow that
      # executes the client on a runner rather than only referencing it in a comment or path filter.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Build the engine (the shim execs it, ADR-0040 D.2)
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # ExitNoVerdict (4) mapped to ::warning:: + exit 0 (round-2 review repair, .github#2264 PR #2271),
      # in the style `coherence.yml`'s roster-closure step already established for the identical shape:
      # a Projects v2 credential gap this repo does not have the org-level access to close (.github#2332
      # tracks the remedy). `Client.boardUnreachable` (`.github#2264` round 2) is what makes `reconcile`
      # emit 4 — a distinguishing, tested classification, not a blanket "any error is soft" — SPECIFICALLY
      # for "the board itself could not be resolved", never for "reached the board, nothing to reconcile"
      # (still exit 0, a real success — .github#1611/#1582: collapsing the two would make this an
      # unattended gate that is always green regardless of whether it ever actually looked, which is the
      # exact failure #266 names) and never for a genuine finding (still exit 1/3, still fails the step).
      # An hourly gate that is ALWAYS red until an org admin acts trains a reader to ignore red as
      # effectively as a gate that silently never runs at all — the shape this whole round started from.
      - name: Reconcile lifecycle projection
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
          FSGG_LIFECYCLE_EVENT: ${{ github.event_name }}
          FSGG_LIFECYCLE_EVENT_AT: ${{ github.event.repository.updated_at || github.run_started_at }}
        run: |
          set +e
          result="$(scripts/fsgg-coord reconcile --repo FS-GG/.github --apply --json)"
          rc=$?
          set -e
          observed_at="$(date --utc +%Y-%m-%dT%H:%M:%SZ)"
          printf '### Coordination lifecycle reconciliation\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf -- '- trigger: `%s`\n- observed-at: `%s`\n- exit: `%s`\n- result: `%s`\n' "$FSGG_LIFECYCLE_EVENT" "$observed_at" "$rc" "$result" >> "$GITHUB_STEP_SUMMARY"
          printf '%s\n' "$result"
          if [ "$rc" -eq 4 ]; then
            echo "::warning::coord-board-reconcile: NO VERDICT, not a pass — the Coordination Projects v2 board itself could not be resolved (a credential/visibility gap: this workflow's GITHUB_TOKEN cannot see org-owned Projects v2 boards). Distinct from a real success (reached the board, nothing to reconcile, which stays exit 0) and from a real finding (which still fails this step). The remedy is org-level and is tracked at .github#2332, not fixable from this repo's tree. See the engine's own diagnostic on stdout above."
            exit 0
          fi
          exit "$rc"
