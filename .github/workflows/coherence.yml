# FS-GG/.github's own contract-coherence gate (#18).
#
# .github OWNS the registry and the shared build config, so it is not a build-config
# *consumer* (check-build-config: false). This gate proves its own registry is SCHEMA-VALID. The
# four product repos call the same reusable workflow with check-build-config: true (their CI adopts
# it as an H3 follow-up).
#
# IT NO LONGER PROVES THE fsgg-contracts PIN AGAINST FS.GG.SDD, and that is deliberate (.github#741).
# The reusable contract-coherence.yml used to assert `registry.version == FS.GG.SDD@main`'s Contracts
# SOURCE — an assertion this repo cannot fix from a caller's PR, and which therefore wedged all six
# repos on any Contracts bump (no PR spans both repos; FS.GG.SDD#432). That assertion now lives in
# source-coherence.yml, where a red reds only `.github` — the repo that owns the registry.
#
# THAT IS THIS FILE'S OWN ESTABLISHED PATTERN, not a new idea: the `projection` job below already
# runs here rather than in the reusable workflow, for the same reason and in the same words — it is
# a .github-INTERNAL invariant. registry-vs-SDD-source is one too; it was simply in the wrong place.
# source-coherence.yml is NOT called from here: it carries its own path-filtered triggers plus the
# daily schedule that is the only way to see SDD bump a version without touching a file in this repo.
name: coherence

# `pull_request.types` names `edited` explicitly (.github#2488), on top of the three GitHub defaults
# `opened`/`synchronize`/`reopened` a bare `pull_request:` would otherwise fall back to. `claim-generation`
# (below) reads `Client.ensureAuthorization`'s `fsgg:pr-authorization` marker, which a worker's own live
# `delivery <ref> --pr N` call PATCHes into the PR body FROM OUTSIDE THIS WORKFLOW (see that job's comment
# for why the write cannot happen IN CI) — a PATCH is edited, never a push, so without `edited` in this
# list nothing ever re-evaluates the gate against a marker such a call just wrote, and every `item/<n>-*`
# PR the fleet opens stays fenced on the `opened` event's ALREADY-STALE `github.event.pull_request.body`
# forever (measured: five for five real PRs, #2488's evidence table). The other jobs below re-run on a
# body edit too as a result — accepted, not free, and bounded to the rare case of an actual PR edit
# (human or a worker's own authorization call), not every push.
#
# THERE IS DELIBERATELY NO `schedule:` HERE, AND THE ATTEMPT TO ADD ONE IS WORTH RECORDING
# (.github#2656). `claim-generation` fences a merge on a claim whose LEASE EXPIRES, and a lease
# expiring is not an event — it is the passage of time, so none of the four `pull_request` types above
# re-evaluates it. A cron is the only Actions trigger that is a function of time, so the first draft of
# `.github#2656` put one in THIS file and had the three jobs that do not want it decline with
# `if: github.event_name != 'schedule'`. `scripts/check-required-contexts.py` refused that outright:
# a required context whose every producer carries a job-level `if:` it cannot PROVE runs on a normal
# pull request is a context that may silently never report, and its allowlist of provable conditions is
# intentionally narrow. The gate was right, and the refusal is the design note: a trigger three of the
# four jobs must opt out of does not belong on the workflow they share. The sweep lives in
# `.github/workflows/claim-freshness-sweep.yml`, on its own cron, with its own `checks: write`.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read   # the reusable gate restores the typed fsgg-sdd validator from the org feed;
                   # a called workflow's GITHUB_TOKEN scopes are capped by the caller, so grant it here.
  issues: read     # claim-generation (below) reads fsgg:claim marker comments on the item the PR's
                   # branch names — a valid GITHUB_TOKEN scope, unlike `administration` (.github#2342).

jobs:
  contract-coherence:
    uses: ./.github/workflows/contract-coherence.yml
    with:
      check-build-config: false
      # .github IS the registry + scripts authority, so validate THIS checkout (the commit under
      # test) rather than the published main — otherwise a PR that adds/edits the registry or the
      # validator script is gated against the stale main copy (and the bootstrapping PR that first
      # introduces the validator can't pass at all). Consumer repos keep the `main` default.
      github-ref: ${{ github.sha }}

  # Projection gate (#128 / review H4). The registry ↔ docs/registry/compatibility.md coherence
  # is a .github-INTERNAL invariant (both files live here), so it runs in this self-gate rather
  # than the reusable contract-coherence.yml that the four product repos call. It converts the
  # recurring "coherence id shipped but never projected" / "contract row went stale" drift class
  # into a red check. Pure-stdlib + PyYAML; no network, no feed token.
  projection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Assert compatibility.md projects the registry
        run: python scripts/check-projection.py registry/dependencies.yml docs/registry/compatibility.md

  # Closed-world gate (#269 / epic #266 instance (c)). Every org fabric iterates registry/repos.yml,
  # so a repo absent from it silently receives nothing — and no other gate can report the absence:
  # coordination-coherence exits 0 for a non-receiver, and repos-audit only iterates repos that are
  # already rostered. FS.GG.Audio sat outside the roster for weeks on exactly that blind spot.
  #
  # Lives in this self-gate (not the reusable contract-coherence.yml the product repos call) for the
  # same reason `projection` does: both registries live HERE, so this is a .github-internal invariant.
  # It runs on every PR and every push to main, which is what makes "add a repo to dependencies.yml
  # without rostering it" a red check. Pure-stdlib + PyYAML for directions A/B; direction C shells
  # out to `gh api graphql` (already on every GitHub-hosted runner).
  #
  # THREE directions, one job, one step for the live half (`.github#2206`). A BOARD-present repo can
  # go unrostered exactly the way an org-present one can (FS.GG.Audio's shape, one population over) —
  # and worse, a repo the Coordination board names can be USER-owned, which direction B's org
  # enumeration can never see at all (`EHotwagner/rogue3`, `EHotwagner/S.I.R.`). Direction C reads the
  # board's own item set directly, so it is not subject to that blind spot.
  roster-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python

      # The fixture first: it proves the gate still FAILS on each fails-open trap (empty listing,
      # narrow listing, unreachable listing, stale exemption, an unreadable/empty board). A gate whose
      # own tests have gone vacuous is this epic's defect class, one level up — cf. SDD's C6 smoke,
      # whose "malformed registry ⇒ exit 1" leg had stopped testing its own claim.
      - name: Run the roster-closure fixture
        run: bash tests/roster-closure/run.sh

      # Then the real thing, against the live org AND the live Coordination board — one invocation,
      # because directions A/B/C share this script's one exit-code contract and this step's existing
      # exit-3-is-a-warning / exit-1-fails treatment already covers all three without change.
      #
      # ORG (B): the run-scoped GITHUB_TOKEN resolves the PUBLIC listing (a fork PR's read-only token
      # does too), which proves the public world closed — but it CANNOT read the org's private-repo
      # count, so it cannot rule out an unrostered PRIVATE repo (#1154). Give this step a token with
      # organization read to turn that no-verdict into a real verdict.
      #
      # BOARD (C): `gh api graphql` needs a credential with Projects (v2) read on the FS-GG org, which
      # the default GITHUB_TOKEN does not carry (`project-field-options.yml`'s own comment records the
      # same limit: "no Projects credential, so the live form cannot run"). Until this step is handed
      # such a credential, direction C's live half reports exit 3 — NO VERDICT, "could not read the
      # Coordination board" — which is the fail-closed answer AC-4 requires, not a silent skip: it is
      # named on stdout, and it is warned rather than swallowed, exactly like org closure's own
      # private-repo gap. `tests/roster-closure/run.sh` already proves direction C's violation and
      # no-verdict paths offline via `--board-json`, so this step's only remaining job is to run the
      # live read and report whichever of the three outcomes it reaches.
      #
      # Neither gap is new here: BOTH are the same "could not look" the #1154 gap already established
      # for direction B, now also true of direction C for the same reason (a narrower credential than
      # the claim being checked). A real open-world finding (exit 1) — org OR board — still fails hard.
      #
      # DECISION (.github#2332), stated plainly rather than as a hedged possibility: under this job's
      # current `secrets.GITHUB_TOKEN`, BOTH directions ALWAYS no-verdict in CI today — this is the
      # settled, observed behavior on every run, not something that "can" happen. The org's full CI
      # credential inventory (`grep -rhoE "secrets\.[A-Z0-9_]+" .github/workflows/*.yml`) is exactly
      # FSGG_DISPATCH_APP_ID/_PRIVATE_KEY (dispatch-only, #21), GITHUB_TOKEN, and NUGET_USER — none
      # scoped for organization read or Projects (v2) read, so no swap to an existing secret can fix
      # this. Provisioning a PAT or GitHub App token with those scopes is an org-admin action,
      # escalated to the maintainer rather than done here. Until it lands, decision (b) is the standing
      # design for both directions: wired, correctly fail-closed to a no-verdict, with the mechanism's
      # real violation-catching value realized by periodic manual/PAT-backed invocation outside this
      # job (the same shape that found #2206's two repositories). See ADR-0019 §1's 2026-08-11
      # amendment for the full record.
      - name: Assert the org and board roster is closed (dependencies.yml + live org + live board)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          python scripts/check-roster-closure.py --org FS-GG
          rc=$?
          set -e
          if [ "$rc" -eq 3 ]; then
            echo "::warning::roster-closure: NO VERDICT on at least one direction — either the run-scoped token cannot enumerate the whole org (it cannot read the org's private-repo count, #1154), or it cannot read the live Coordination board (no Projects v2 read credential). See stdout above for which. A real open-world finding (exit 1) still fails this step."
            exit 0
          fi
          exit "$rc"

  # Merge fence, slice 1 (.github#2342 — slice 1 of .github#1858's replacement-plan step 2, "fence
  # merges"; design gate .github#2210,
  # docs/reports/2026-08-04-github-native-executor-fencing-design.md). Reads the LIVE `fsgg:claim`
  # generation for the item this PR's own branch (`item/<n>-*`) declares it delivers, and compares it
  # against an explicit `fsgg:pr-authorization` marker in the PR body. See
  # scripts/check-claim-generation.py's own docstring for the four diagnoses this gate distinguishes
  # (missing / stale / mismatched / unreadable) and for exactly how this slice is narrower than the
  # full design (it does not yet ground the marker against a merge election — that is a later slice,
  # out of this item's `Paths:`).
  #
  # ARMED, AND MERGE-BLOCKING TODAY (armed by .github#1858; this paragraph restored by .github#2526).
  # `claim-generation` IS one of `main`'s required status checks, so a red verdict here BLOCKS the merge.
  # Read live on 2026-08-13:
  #
  #   $ gh api repos/FS-GG/.github/branches/main/protection \
  #       --jq '.required_status_checks.contexts'
  #   ["contract-coherence / coherence","projection","roster-closure","drift","reconcile",
  #    "claim-generation"]
  #
  # HOW IT GOT THERE, AS HISTORY (.github#2342 AC6). This job shipped OBSERVE-ONLY, and nothing in this
  # file adds a context to branch protection — arming is a deliberate, separate, administrative action,
  # correctly deferred at the time until design slice 3 (`delivery` writing the marker automatically) had
  # landed and a full claim-lease window had passed with zero unmarked in-flight `item/<n>-*` pull
  # requests (design doc §9.1's migration sequence). Slice 3 landed (.github#2395), the window passed,
  # and an admin ran the `PUT` that arming needs, alongside this repo's five other contexts:
  #
  #   gh api -X PUT repos/FS-GG/.github/branches/main/protection/required_status_checks/contexts \
  #     -f "contexts[]=contract-coherence / coherence" -f "contexts[]=projection" \
  #     -f "contexts[]=roster-closure" -f "contexts[]=drift" -f "contexts[]=reconcile" \
  #     -f "contexts[]=claim-generation"
  #
  # The armed state is a fact about the BRANCH, not about this file, which is why this comment — and the
  # live read above — is the only place it can be recorded here.
  #
  # THIS JOB'S RED WAS BLOCKING BEFORE THAT, THROUGH A DIFFERENT DOOR (.github#2373). While branch
  # protection still did not enforce it, `scripts/fsgg-coord landable`, the merge gate `pnext-item` names
  # as authoritative, scored every LIVE check-run unconditionally and did not know this one was meant to
  # be advisory, so a FINDING here (the ordinary shape for a PR opened before its worker knew to write the
  # `fsgg:pr-authorization` marker) read `landable` RED anyway — reproduced live across three PRs in one
  # wave. #2373's repair was a NAMED exemption for this check in `Landable.fs` (`advisoryCheckNames`), and
  # this paragraph used to instruct that BOTH that name and this comment's deferral be removed in the same
  # change that armed the job. NEITHER REMOVAL IS OUTSTANDING, AND NO NAME REMAINS TO REMOVE: .github#2517
  # deleted that literal and made `Landable.fs`'s advisory set the DERIVED COMPLEMENT of the base branch's
  # own required contexts (`Landable.advisoryFrom`). `claim-generation` is in that required set, so the
  # engine's own rollup now scores it `Blocking` as well — the two subsystems agree by construction rather
  # than by remembering to edit them together, and arming or disarming this job needs no source edit here.
  #
  # No `paths:` filter — inherited from this workflow's own `on:` above, which is deliberately
  # unfiltered (.github#1508: a required context must report on EVERY pull request, and GitHub never
  # skips a path-filtered required check — it never creates the check run at all, so branch protection
  # waits forever). This job decides its own applicability from the BRANCH SHAPE
  # (`item/<n>-*`) rather than from a trigger filter, so an unrelated PR still gets a real `success`.
  #
  # DOES NOT SELF-HEAL ITS OWN MARKER IN CI, AND THAT IS A DELIBERATE, MEASURED CHOICE (.github#2488
  # round 1 repair). An earlier draft of this job ran `who --json` here to find the live claim holder,
  # then re-invoked `delivery <ref> --pr N` under that identity to PATCH the body. Both calls' FIRST
  # action is a live Coordination Projects (v2) board bootstrap (`Board.bootstrapCached`,
  # `src/FS.GG.Coord.GitHub/Board.fs`) — and this org's CI credential inventory does not carry that
  # read. This is not a bug this job could route around: `roster-closure`, three blocks above in this
  # SAME file, and `docs/adr/0019-org-repo-roster-registry-and-coordination-kit.md`'s 2026-08-11
  # amendment (`.github#2332`) already record it as an ACCEPTED org decision — `FSGG_DISPATCH_APP_ID`/
  # `_PRIVATE_KEY`, `GITHUB_TOKEN`, and `NUGET_USER` are this org's whole CI credential inventory, and
  # NONE of them carries organization or Projects (v2) read. A self-heal step built on either call
  # would red identically to a missing one, every time, under any credential already available here —
  # measured live: `who --json` failed `not found: no Projects v2 board titled 'Coordination' in
  # FS-GG` on this PR's own first head (`da310d55`, run 31655633573/job 94309337287).
  #
  # ITS GREEN IS PERISHABLE, AND SOMETHING ELSE HAS TO NOTICE (.github#2656). What this job asserts is
  # "at the instant it ran, the item was held under generation G" — and the claim lease it read expires.
  # None of this workflow's triggers fires on that expiry, so a green computed before a lapse stays
  # green with nothing to re-compute it, and branch protection (the only fence on a merge made from the
  # GitHub UI or a bare `gh pr merge`, since `delivery --apply` re-reads the winning claim itself) would
  # admit the merge on a lapsed premise. `.github#2571`'s chain came within one ordering of showing that
  # live: the lease lapsed mid-review and was caught ONLY because it lapsed BEFORE `pnext-item` §6's
  # `delivery` call rather than after this job went green.
  #
  # `.github/workflows/claim-freshness-sweep.yml` is what notices. On its own cron it re-runs THIS
  # script over every open `item/<n>-*` PR and publishes a fresh `claim-generation` check run when this
  # job's green has stopped being true — so a revoked green blocks the merge exactly as this job's own
  # red would. It only ever REVOKES: it cannot turn this check green, deliberately, because clearing a
  # required merge gate should not be something a cron can do with no repository event behind it. Every
  # OK this job prints now carries the instant it stops being true (`verdict-expires-at=`), derived from
  # the winning claim marker's own `lease=`.
  #
  # THE EMISSION POINT, NAMED (.github#2488 AC2) AND WHERE IT ACTUALLY LIVES: `Client.ensureAuthorization`,
  # reached through a plain LIVE `delivery <ref> --pr N` status read — no `--apply`, so it can never merge
  # or close anything (see that function's own doc comment in `Client.fs`). That call is NOT made from
  # this workflow; it is made from a WORKER's own shell, which already holds a working board/GitHub
  # credential (the same one every other coordination-engine command in that worker's session uses) —
  # exactly the credential this job's own token cannot be given under the accepted decision above. The
  # `edited` type this workflow's `on:` block now carries exists FOR that external write: a worker's
  # `delivery` call PATCHes the PR body from outside this job entirely, and `edited` is what makes THIS
  # job re-evaluate against it, automatically, with no human intervention and no close/reopen — see the
  # `on:` block's own comment for the "why `edited`" half of this story.
  claim-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python

      - name: Run the claim-generation fixture (no network)
        run: bash tests/claim-generation/run.sh

      # The body AND the branch name go through the ENVIRONMENT, never interpolated into a `run:`
      # block. Both are attacker-controlled text — closing-keywords.yml states the same rule for the
      # PR body, and a branch name can carry shell metacharacters just as readily as a body can.
      - name: Assert the live claim generation authorizes this merge
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          rc=0
          out="$(python scripts/check-claim-generation.py \
                   --repo "${{ github.repository }}" --head-ref "$HEAD_REF" --head-sha "$HEAD_SHA" \
                   --body pr-body.md 2>&1)" || rc=$?
          [ -z "$out" ] || printf '%s\n' "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # One named step per exit code — "I could not check" must never be mistaken for "I checked, and
      # it's fine" (#266). The exit code is the contract; nothing here greps the gate's prose.
      - name: 'OK: authorization is current, or this PR does not deliver a board item'
        if: ${{ !cancelled() && steps.check.outputs.rc == '0' }}
        run: |
          echo "claim-generation: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 'FINDING: missing, stale, expired, or mismatched claim-generation authorization'
        if: ${{ !cancelled() && steps.check.outputs.rc == '1' }}
        run: |
          {
            echo "### claim-generation: this PR's authorization does not name the current live claim"
            echo
            echo 'See the job log above for which of the four — missing, stale, expired, or mismatched'
            echo '— and why. This check is REQUIRED on `main` (.github#1858 armed it), so this red BLOCKS'
            echo 'the merge; see scripts/check-claim-generation.py for the `fsgg:pr-authorization` marker'
            echo 'a PR body needs to carry, and `pnext-item` §6 for the `delivery` call that writes it.'
            echo
            echo '`[expired]` is the one that is NOT a lost race (.github#2656): the claim marker is'
            echo 'still there and still names its holder, and the lease simply ran out. `heartbeat`'
            echo 'renews the SAME generation, and this check goes green again without re-authorizing.'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=claim-generation: authorization is missing, stale, expired, or mismatched::See the job log for which, and why."
          exit 1

      - name: 'NO VERDICT (retryable): the live claim state could not be read'
        if: ${{ !cancelled() && steps.check.outputs.rc == '2' }}
        run: |
          echo "::error title=claim-generation: no verdict (retryable)::A rate limit or outage kept this job from reading the live claim state (#266: a failed read is never a pass). Re-run the job."
          exit 1

      - name: 'NO VERDICT (permanent): a permission or input failure'
        if: ${{ !cancelled() && steps.check.outputs.rc == '3' }}
        run: |
          echo "::error title=claim-generation: no verdict (permanent)::See the job log — a credential problem or an unusable input kept this job from establishing a verdict. Retrying will not help."
          exit 1

      - name: 'INCONCLUSIVE: the gate produced no exit code this workflow understands'
        if: ${{ !cancelled() && !contains(fromJSON('["0","1","2","3"]'), steps.check.outputs.rc) }}
        run: |
          echo "::error title=claim-generation: inconclusive::check-claim-generation.py exited ${{ steps.check.outputs.rc }}, which this workflow does not classify. Treating as a failure."
          exit 1
