name: Callable isolated operation plan

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact protected operation phase
        required: true
        type: choice
        options: [creation, identity-bound-operation]
      creation_receipt_artifact_id:
        description: Creation receipt artifact id; required only for identity-bound-operation
        required: false
        type: string
      creation_receipt_run_id:
        description: Creation receipt run id; required only for identity-bound-operation
        required: false
        type: string
      creation_receipt_run_attempt:
        description: Creation receipt run attempt; required only for identity-bound-operation
        required: false
        type: string
      creation_receipt_artifact_sha256:
        description: Creation receipt archive SHA-256; required only for identity-bound-operation
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: callable-isolated-operation-plan-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  plan:
    name: callable-isolated-operation-plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out exact authority source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out exact reviewed Coordination source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FS-GG/FS.GG.Coordination
          ref: 8e5ce4cc9aa3e1d2e200d0dc6b1812ec12ae2bce
          fetch-depth: 1
          persist-credentials: false
          path: coordination
      - name: Build the immutable phase plan
        env:
          CREATION_RECEIPT_ARTIFACT_ID: ${{ inputs.creation_receipt_artifact_id }}
          CREATION_RECEIPT_ARTIFACT_SHA256: ${{ inputs.creation_receipt_artifact_sha256 }}
          CREATION_RECEIPT_RUN_ID: ${{ inputs.creation_receipt_run_id }}
          CREATION_RECEIPT_RUN_ATTEMPT: ${{ inputs.creation_receipt_run_attempt }}
          GH_TOKEN: ${{ github.token }}
          PHASE: ${{ inputs.phase }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'FS-GG/.github'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git -C coordination rev-parse HEAD)" = '8e5ce4cc9aa3e1d2e200d0dc6b1812ec12ae2bce'
          test "$(sha256sum coordination/eng/callable-cli-isolated-operation-contract.json | cut -d ' ' -f 1)" = '39a2a28a5b084881ff6d2e6cfccc24bc4f02128b9b4ed16b49edf12ce926ef9f'
          if [ "$PHASE" = creation ]; then
            test -z "$CREATION_RECEIPT_RUN_ID$CREATION_RECEIPT_RUN_ATTEMPT$CREATION_RECEIPT_ARTIFACT_ID$CREATION_RECEIPT_ARTIFACT_SHA256"
            python3 coordination/eng/callable-cli-isolated-operation.py prepare-create \
              --output "$RUNNER_TEMP/callable-isolated-operation-plan.json"
          else
            [[ "$CREATION_RECEIPT_ARTIFACT_ID" =~ ^[1-9][0-9]*$ ]]
            [[ "$CREATION_RECEIPT_RUN_ID" =~ ^[1-9][0-9]*$ && "$CREATION_RECEIPT_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
            [[ "$CREATION_RECEIPT_ARTIFACT_SHA256" =~ ^[0-9a-f]{64}$ ]]
            receipt_artifact="$(gh api "repos/FS-GG/.github/actions/artifacts/$CREATION_RECEIPT_ARTIFACT_ID")"
            receipt_run="$(gh api "repos/FS-GG/.github/actions/runs/$CREATION_RECEIPT_RUN_ID")"
            test "$(jq -r .id <<<"$receipt_artifact")" = "$CREATION_RECEIPT_ARTIFACT_ID"
            test "$(jq -r .name <<<"$receipt_artifact")" = "callable-isolated-operation-creation-receipt-$CREATION_RECEIPT_RUN_ID-$CREATION_RECEIPT_RUN_ATTEMPT"
            test "$(jq -r .workflow_run.id <<<"$receipt_artifact")" = "$CREATION_RECEIPT_RUN_ID"
            test "$(jq -r .digest <<<"$receipt_artifact")" = "sha256:$CREATION_RECEIPT_ARTIFACT_SHA256"
            test "$(jq -r .expired <<<"$receipt_artifact")" = false
            test "$(jq -r .run_attempt <<<"$receipt_run")" = "$CREATION_RECEIPT_RUN_ATTEMPT"
            test "$(jq -r .conclusion <<<"$receipt_run")" = success
            test "$(jq -r .path <<<"$receipt_run")" = .github/workflows/callable-isolated-operation-execute.yml
            test "$(jq -r .head_sha <<<"$receipt_run")" = "$GITHUB_SHA"
            gh api "repos/FS-GG/.github/actions/artifacts/$CREATION_RECEIPT_ARTIFACT_ID/zip" > "$RUNNER_TEMP/creation-receipt.zip"
            test "$(sha256sum "$RUNNER_TEMP/creation-receipt.zip" | cut -d ' ' -f 1)" = "$CREATION_RECEIPT_ARTIFACT_SHA256"
            python3 tools/callable-isolated-operation-artifact.py extract \
              --archive "$RUNNER_TEMP/creation-receipt.zip" \
              --member callable-isolated-operation-creation-receipt.json \
              --output "$RUNNER_TEMP/callable-isolated-operation-creation-receipt.json"
            python3 coordination/eng/callable-cli-isolated-operation.py prepare-operation \
              --creation-receipt "$RUNNER_TEMP/callable-isolated-operation-creation-receipt.json" \
              --output "$RUNNER_TEMP/callable-isolated-operation-plan.json"
          fi
      - name: Retain exact plan bytes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callable-isolated-operation-plan-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/callable-isolated-operation-plan.json
          retention-days: 30
          if-no-files-found: error
