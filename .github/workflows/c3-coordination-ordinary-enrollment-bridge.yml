name: C3 Coordination ordinary-v2 sealed enrollment bridge

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: c3-coordination-ordinary-enrollment-bridge
  cancel-in-progress: false

jobs:
  seal:
    name: Seal existing custody only for Coordination ordinary-v2
    if: >-
      github.repository == 'FS-GG/.github' &&
      github.repository_id == '1269292704' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    environment: ordinary-v2
    timeout-minutes: 5
    steps:
      - name: Check out the exact protected-main workflow source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install the runner LibSodium runtime
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libsodium23
      - name: Verify source custody and seal the fixed Coordination payloads
        shell: bash
        env:
          V2_ORDINARY_APP_ID: ${{ secrets.V2_ORDINARY_APP_ID }}
          V2_ORDINARY_APP_PRIVATE_KEY: ${{ secrets.V2_ORDINARY_APP_PRIVATE_KEY }}
          V2_ORDINARY_AUTHORIZER_PRIVATE_KEY: ${{ secrets.V2_ORDINARY_AUTHORIZER_PRIVATE_KEY }}
        run: python3 tools/c3-coordination-ordinary-enrollment-bridge.py "$RUNNER_TEMP/c3-coordination-ordinary-enrollment-ciphertexts.json"
      - name: Retain only destination-key-encrypted payloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: c3-coordination-ordinary-enrollment-ciphertexts-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/c3-coordination-ordinary-enrollment-ciphertexts.json
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: false
