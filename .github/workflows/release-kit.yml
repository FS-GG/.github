name: release-kit

# Publishes FS.GG.Kit — the coordination kit as one versioned artifact (ADR-0062, .github#1262) — to the
# org GitHub Packages feed and (dormant, see below) nuget.org. `.github` does not normally own a release
# workflow; this is the THIRD exception, on the same grounds as release-coord-engine.yml and
# release-new-sdd-workspace.yml: the artifact lives here, so its publish does too (ADR-0039 §5).
#
# WHY THIS PUBLISH IS LOAD-BEARING. Slice 1 (.github#1274) stood up the producer; nothing consumes it until
# it is on a feed. Once published, a receiver references FS.GG.Kit at a pinned version and picks up kit
# changes through the existing Renovate + dispatch fabric instead of N byte-copy sync PRs — the whole point
# of ADR-0062. So this workflow is the distribution path the migration's remaining slices depend on.
#
# NUGET.ORG IS NOT OPTIONAL FOR REACH. Five of the six receiver repos restore FS.GG.* from PUBLIC nuget.org
# (the org GitHub Packages feed needs a credential even to read; they do not configure one — ADR-0039). A
# kit that exists only on the org feed cannot be consumed by most of the fleet, exactly as it cannot for the
# coordination engine. So this dual-publishes (ADR-0012 org feed + nuget.org; ADR-0013 OIDC Trusted
# Publishing, no stored key), the byte-identical .nupkg, no re-pack.
#
# Version is the EVALUATED csproj <Version> (msbuild -getProperty), never a grep and never pinned in this
# header. A tag is a COHERENCE CHECK against it — and, since .github#1772, ALSO the ref the fleet resolves
# a bump-shape rule from, which is why it is a precondition below rather than decoration. The kit ships
# STABLE (no
# -preview): the shared Renovate preset sets ignoreUnstable=true, so a prerelease would be invisible to the
# fabric that is supposed to carry it — refuse rather than ship it silently.
#
# Release by pushing a tag `kit/v<version>` matching the csproj <Version>; or run manually
# (workflow_dispatch) with publish=true. A manual run with publish=false is a pack-only dry run.
#
# EITHER WAY THE TAG MUST EXIST AND MUST POINT AT THE COMMIT BEING PACKED (.github#1772). A manual
# publish used to need no tag, and 0.1.0 and 0.4.0 shipped without one. The receiver-side
# `kit-bump-shape` reporter now resolves the rule it runs from `kit/v<the version the receiver pins>`
# — that is how its verdict became a pure function of the receiver's tree instead of the hub's moving
# `main` (ADR-0067 §2, #1584) — so an untagged published version is one whose bump PRs can only be
# refused. The check is in "Resolve version + publish decision" below.
#
# AND THE TAG IS GUARDED AFTER PUBLICATION TOO (.github#1784). This gate is publish-time only, and a
# tag is a mutable ref: deleted or force-moved a minute later, it silently recreates the very defect
# #1772 closed and nothing here would ever look again. Two things close that. A repository TAG RULESET
# — `kit-release-tags-are-immutable`, over `refs/tags/kit/v*`, rules deletion + non_fast_forward +
# update, zero bypass actors — refuses the mutation at the source. And `kit-published-coherence`'s
# `--tag-arm` re-checks, on main and on a schedule, that every version nuget.org serves still has a
# tag resolving to the commit recorded in that version's published `.nuspec` (`<repository
# commit=...>`) — the ruleset is itself a mutable setting, so the detection is what proves it is
# still there. 0.1.0 and 0.4.0 were tagged retroactively from exactly that binding; see those tag
# objects, which state what they assert and on what evidence.
#
# ⚠ THE nuget.org POLICY IS BOUND TO BOTH THIS WORKFLOW'S FILENAME AND THE PACKAGE ID. An org-owner must
# create a Trusted Publishing policy for: Repository Owner `FS-GG` · Repository `.github` · Workflow file
# `release-kit.yml` · package `FS.GG.Kit`, and `vars.NUGET_ORG_PUBLISH` must be `true` (it already is — the
# coord engine relies on it; check-publish-flags.py asserts it). Renaming either afterwards invalidates the
# token exchange (see .github#624). Until the policy exists, NuGet/login fail-closes with a 401 — the correct
# direction: never a silent no-op, never a half-published set.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THIS RELEASE DOES NOT `repository_dispatch`, AND THAT PART IS DECIDED (.github#1776).
#
# Neither this workflow nor release-coord-engine.yml calls `dispatch-sender.yml`. #1776 asked whether
# they should, and the answer is NO — but only about that MECHANISM. The push half #1776 was filed
# about is real and still missing; it simply does not live at `repository_dispatch`. Read both halves
# below before concluding anything from the first. This is the record #1776 AC1 asked for, written
# here because a reader of this file is the one who will wonder; release-coord-engine.yml states the
# same decision and points back at this block.
#
# WHY NOT `repository_dispatch` — two independent reasons, each measured 2026-07-29 against every
# receiver's DEFAULT BRANCH through the API, not a local clone:
#
#   1. NOTHING ON THE RECEIVING END LISTENS. Across all seven `receives: coordination-kit` +
#      `kit-delivery: package` rows (`repos.sh list --receives coordination-kit --kit-delivery
#      package`), exactly TWO carry `on: repository_dispatch` at all — FS.GG.SDD
#      (`composition-registry-updated`) and FS.GG.Templates (`fs-gg-ui-template-released`) — and
#      neither names the kit or the engine. FS.GG.Rendering's `template-dispatch.yml` matches a grep
#      for the word but is a SENDER, not a listener. So a dispatch added here would POST to seven
#      repos, take a 204 from each, and change nothing: a mechanism reporting success over a subject
#      that does not exist, which is epic #266's signature and strictly worse than the silence it
#      would replace. Nothing re-checks this premise — filed as .github#1919.
#
#   2. RENOVATE IS NOT REACHABLE BY DISPATCH. It is the hosted Mend App, not a self-hosted runner —
#      `renovatebot/github-action` and `renovate/renovate` match NOTHING in any workflow of this repo
#      or of the seven receivers. `repository_dispatch` starts a workflow in the TARGET repo; it has
#      no way to make the App re-scan. For a dispatch to move a pin, each receiver would need its own
#      dispatch-triggered workflow that edits the pin and opens the PR — the FS.GG.Templates
#      `upstream-bump.yml` pattern, authored seven times, duplicating what the App already does.
#
# BUT THE GAP #1776 NAMED IS REAL, AND IT IS NOT ANSWERED HERE. Do not read the paragraph above as
# "delivery is fine". Measured the same morning: FS.GG.Kit 0.21.0 (published 05:28:30Z) was offered
# by Renovate at FS.GG.Templates#334, FS.GG.Audio#223 and FS.GG.Game#537 — three of seven, at 21, 24
# and 63 minutes — while FS.GG.Rendering and FS.GG.Net sat pinned at 0.18.0 with FOUR versions
# published above them, each held behind an UNTICKED checkbox in its own Dependency Dashboard. From
# FS.GG.Net#36's `## Rate-Limited` section, and FS.GG.Rendering#14 carries the kit line alone:
#
#        - [ ] <!-- unlimit-branch=renovate/fs.gg.coord.cli-0.x -->chore(deps): update dependency
#              fs.gg.coord.cli to v0.15.0
#        - [ ] <!-- unlimit-branch=renovate/fs.gg.kit-0.x -->chore(deps): update dependency
#              fs.gg.kit to 0.21.0
#
# That is a human ticking a box in another repo, exactly as #1776 said, and `scripts/repos-audit.sh`
# (the #1768 sweep) records it happening by hand on 2026-07-28 and names the tick as the repair. So
# the push half is warranted. Its mechanism is the DASHBOARD, not a dispatch: ticking one of those
# boxes is a `PATCH .../issues/<n>` the hub can make with the App credential and NO receiver-side
# workflow at all — and the hub already performs the READ half of it, in
# `scripts/check-pin-coherence.py` (which finds each receiver's dashboard by title and parses its
# body) under `pin-coherence.yml`, which grants `issues: read` for exactly that. That work is
# .github#1923, and it is BUILT: see "THE PUSH HALF" in the steps below, scripts/dashboard-tick.py,
# and dashboard-tick-selftest.yml, which asserts the App's `issues: write` grant on its own schedule.
#
# WHAT THIS RECORD DOES NOT CLAIM, AND CANNOT SEE (#1776 AC5).
#
#   • #1776 AC4 (a release that notifies nobody must be REPORTED, mutation-proven) is DISCHARGED as
#     of .github#1923, and by the job below rather than by this block: the push half exits non-zero
#     when it reaches zero receivers, when a write is refused, and when a `PATCH` returns 200 and
#     changes nothing, and tests/dashboard-tick/run.sh drives all three legs against a fake API. This
#     paragraph used to say AC4 was deferred; it is not any more, and the mechanism is the DASHBOARD
#     TICK described below, never the `repository_dispatch` the paragraph above refuses.
#   • It CANNOT see whether Renovate ran and chose to do nothing. A push that fires and a Renovate
#     run that then does nothing are different failures, and only the second is #1768's subject. The
#     latencies above bound DELIVERY; they say nothing about when the bot woke up.
#   • The three-of-seven figure is one morning, not a rate. It was enough to refuse the
#     `repository_dispatch` design and establish #1923's dashboard-tick work; it is not a measurement
#     of how often a receiver is held, which nothing currently trends.
#
# THE CREDENTIAL IS NOT WHAT BLOCKS ANY OF THIS (#1776 AC3). The `fs-gg-cross-repo-dispatch` App and
# its org secrets were provisioned by .github#21, which is closed, and four workflows in this repo
# mint tokens from them today. Which SCOPES that installation carries is mechanised by
# permission-coherence.yml (#2242): PRs compare every `permission-*` App-token input to its pinned,
# reviewed grant inventory, and its scheduled credentialed arm compares that inventory to GitHub's
# live installation record. A missing grant is therefore a red pre-merge check, not a second prose
# assertion here or a runtime 422 after publication has begun.
# ─────────────────────────────────────────────────────────────────────────────────────────────────

on:
  push:
    tags: ['kit/v*']
  workflow_dispatch:
    inputs:
      publish:
        description: "Push to the feeds (false = pack-only dry run)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-kit-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack & publish FS.GG.Kit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.repository == 'FS-GG/.github'
    # Least-privilege: only this job gains packages: write, and the push uses the run-scoped GITHUB_TOKEN,
    # never a PAT. id-token: write mints the GitHub OIDC token for nuget.org Trusted Publishing (ADR-0013).
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Resolve version + publish decision
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DISPATCH_PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          proj=src/FS.GG.Kit/FS.GG.Kit.csproj
          version="$(dotnet msbuild "$proj" -getProperty:Version | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::could not read <Version> from $proj (build defect); refusing to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # A `-preview` kit would be INVISIBLE to the shared Renovate preset (ignoreUnstable: true), so
          # receivers would never be bumped — defeating the point of shipping it as a package. Refuse.
          case "$version" in
            *-*) echo "::error::version '$version' is a prerelease. The org's Renovate preset sets ignoreUnstable=true, so receivers would never see it. Publish a stable 0.x version."; exit 1 ;;
          esac

          # SIBLING-TAG PRECONDITION (.github#2409 DEC-004). FS.GG.Kit, FS.GG.Drivers and coord-engine
          # are a coherent set (.github#2402, $(FsggCoherentSetVersion)): their <Version> values can no
          # longer diverge, but before this the RELEASE EVENTS still could — nothing stopped a
          # maintainer tagging `kit/v$version` alone. This closes that: refuse to publish unless BOTH
          # siblings' own tags, at this SAME version, already resolve to this SAME commit. Two existing,
          # independently-triggered workflows (release-drivers.yml, release-coord-engine.yml) tag and
          # publish their own package the same way; pushing all three tags in one `git push` (or in any
          # order before this job's precondition runs) is what "one shared trigger" means here — no new
          # tag namespace, no renamed workflow, so nuget.org's per-filename OIDC policy binding and the
          # kit-bump-shape reporter's `kit/v<pin>` resolution (both load-bearing, see header) are
          # untouched.
          check_sibling_tag() {
            local sibling_tag="$1"
            local tagged
            tagged="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                        "refs/tags/$sibling_tag" "refs/tags/$sibling_tag^{}" \
                      | awk -v p="refs/tags/$sibling_tag^{}" -v b="refs/tags/$sibling_tag" \
                          '$2==p {peeled=$1} $2==b {plain=$1} END {print (length(peeled) ? peeled : plain)}')"
            if [ -z "$tagged" ]; then
              echo "::error::refusing to publish FS.GG.Kit $version: sibling tag $sibling_tag does not exist yet. FS.GG.Kit, FS.GG.Drivers and coord-engine are a coherent set (.github#2402) and release together (.github#2409) — push all three tags (kit/v$version, drivers/v$version, coord-engine/v$version) at the same commit."
              exit 1
            fi
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::refusing to publish FS.GG.Kit $version: sibling tag $sibling_tag points at $tagged, not the commit being packed ($GITHUB_SHA). All three coherent-set tags must name the same commit."
              exit 1
            fi
          }
          check_sibling_tag "drivers/v$version"
          check_sibling_tag "coord-engine/v$version"

          if [ "$EVENT" = "push" ]; then
            # The tag is a coherence check against the evaluated version, never the source of truth.
            tag_version="${REF#kit/v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag $REF ($tag_version) does not match csproj <Version> ($version)."
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
          elif [ "$DISPATCH_PUBLISH" = "true" ]; then
            # EVERY PUBLISHED VERSION MUST NAME AN IMMUTABLE HUB COMMIT (.github#1772).
            #
            # A tag-push release gets this for free; a manual publish did not, and two versions in
            # this package's history (0.1.0 and 0.4.0) shipped with no `kit/v*` tag at all — since
            # closed by .github#1784, which tagged both at the commits their published nuspecs name,
            # so every version on the feed now has one. That was harmless
            # while the tag was decoration. It is not any more: the receiver-side `kit-bump-shape`
            # reporter resolves the rule it runs from `kit/v<the version the receiver pins>`, so a
            # published version with no tag is a version whose bump PRs can only be REFUSED — the
            # ADR-0067 §2 alternative being to read the hub's moving `main`, which is exactly the
            # #1584 defect #1772 closed.
            #
            # So the tag is now a PRECONDITION of publishing, not a way of triggering it, and it must
            # point at the commit being packed — a tag on some other commit would resolve the rule out
            # of a tree that is not this release. Fail closed and name the remedy; a publish that
            # skipped this would ship a version the fleet cannot pin a rule to, and nothing downstream
            # could tell that from a tag someone simply forgot.
            tag="kit/v$version"
            tagged="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                        "refs/tags/$tag" "refs/tags/$tag^{}" \
                      | awk -v p="refs/tags/$tag^{}" -v b="refs/tags/$tag" \
                          '$2==p {peeled=$1} $2==b {plain=$1} END {print (length(peeled) ? peeled : plain)}')"
            if [ -z "$tagged" ]; then
              echo "::error::refusing to publish FS.GG.Kit $version: no tag $tag exists. Every published version must name an immutable hub commit (.github#1772) — the kit-bump-shape reporter resolves its rule from kit/v<pin>. Push the tag instead: \`git tag $tag $GITHUB_SHA && git push origin $tag\` (which also releases)."
              exit 1
            fi
            if [ "$tagged" != "$GITHUB_SHA" ]; then
              echo "::error::refusing to publish FS.GG.Kit $version: $tag points at $tagged, not the commit being packed ($GITHUB_SHA). The tag is what the fleet resolves the kit-bump-shape rule from, so it must be this tree."
              exit 1
            fi
            echo "push=true" >> "$GITHUB_OUTPUT"
          else
            echo "push=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore (locked)
        run: dotnet restore src/FS.GG.Kit/FS.GG.Kit.csproj --locked-mode

      # THE KIT IS NEVER PUBLISHED UNVERIFIED. verify-package.sh is the kit's gate: it proves the packed set
      # is derived from registry/repos.yml (digests == repos.lock, count == registry rows), packs every
      # member, materializes the skills/client/manifest onto disk, and fails loud on a tampered file. A
      # publish that skipped it would ship the package without the evidence that it works.
      - name: Verify — derive, pack, materialize, fail-loud
        run: bash src/FS.GG.Kit/verify-package.sh

      - name: Use saga-prepared package (publish) or pack locally (dry run)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          if [ "${{ steps.v.outputs.push }}" = true ]; then
            gh release download "coherent-set/v$VERSION" --repo "$GITHUB_REPOSITORY" \
              --pattern "FS.GG.Kit.$VERSION.nupkg" --pattern release-manifest.json --dir artifacts/packages
            python3 scripts/release-saga.py assert-artifacts --manifest artifacts/packages/release-manifest.json --package FS.GG.Kit
          else
            dotnet pack src/FS.GG.Kit/FS.GG.Kit.csproj -c Release -o artifacts/packages
          fi

      # A PACKAGE THAT PACKS BUT DOES NOT MATERIALIZE FROM A REAL RESTORE is the failure mode here. The gate
      # above invokes the materialize target directly; this drives it the way a receiver will — a throwaway
      # consumer with a real PackageReference, so NuGet's auto-import of build/FS.GG.Kit.{props,targets} and
      # the on-build materialize are exercised end to end against the actual .nupkg.
      - name: Smoke — a real consumer restores the package and gets the skills on disk
        run: |
          set -euo pipefail
          work="$(mktemp -d)"; recv="$work/recv"; mkdir -p "$recv"
          # ABSOLUTE source path, and it has to be: a NuGet source in a config resolves RELATIVE TO THAT
          # FILE. --configfile makes NuGet use ONLY this file, so the runner's global packageSourceMapping
          # cannot filter the local feed out (the reason a naive local-feed restore 404s).
          cat > "$work/isolated.config" <<CFG
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear /><add key="local" value="${{ github.workspace }}/artifacts/packages" /></packageSources>
          </configuration>
          CFG
          cat > "$work/Consumer.csproj" <<CSPROJ
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <EnableDefaultCompileItems>false</EnableDefaultCompileItems>
              <IncludeBuildOutput>false</IncludeBuildOutput>
              <FsggKitReceiverRoot>$recv</FsggKitReceiverRoot>
            </PropertyGroup>
            <ItemGroup>
              <PackageReference Include="FS.GG.Kit" Version="${{ steps.v.outputs.version }}" />
            </ItemGroup>
          </Project>
          CSPROJ
          dotnet restore "$work/Consumer.csproj" --configfile "$work/isolated.config"
          dotnet build   "$work/Consumer.csproj" -c Release --no-restore
          for root in .claude/skills .agents/skills; do
            for s in cross-repo-coordination intra-repo-parallel-work check-board pnext-item; do
              [ -f "$recv/$root/$s/SKILL.md" ] || { echo "::error::packaged kit did not materialize $root/$s/SKILL.md from a real restore"; exit 1; }
            done
          done
          [ -x "$recv/scripts/fsgg-coord" ] || { echo "::error::packaged kit did not materialize an executable scripts/fsgg-coord"; exit 1; }
          echo "packaged kit: a real consumer restore materialized every skill + the executable client" >> "$GITHUB_STEP_SUMMARY"

      - name: Push to org GitHub Packages feed
        if: steps.v.outputs.push == 'true'
        run: |
          dotnet nuget push "artifacts/packages/FS.GG.Kit.*.nupkg" \
            --source https://nuget.pkg.github.com/FS-GG/index.json \
            --api-key ${{ secrets.GITHUB_TOKEN }} \
            --skip-duplicate

      # nuget.org dual-publish (ADR-0012/0013). Gated on vars.NUGET_ORG_PUBLISH so org-feed releases keep
      # working until an org-owner creates the Trusted Publishing policy for THIS workflow + FS.GG.Kit (see
      # the header). Pushes the BYTE-IDENTICAL org-feed .nupkg, no re-pack.
      - name: NuGet login (OIDC → short-lived key)
        if: steps.v.outputs.push == 'true' && vars.NUGET_ORG_PUBLISH == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push byte-identical package to nuget.org
        if: steps.v.outputs.push == 'true' && vars.NUGET_ORG_PUBLISH == 'true'
        run: |
          dotnet nuget push "artifacts/packages/FS.GG.Kit.*.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      # ─────────────────────────────────────────────────────────────────────────────────────────
      # THE PUSH HALF (.github#1923). Read the header block above first: this is NOT a
      # `repository_dispatch`, and the reasons it is not are measured there.
      #
      # A publish that nobody hears about has not been delivered. Renovate is the only thing that
      # moves a receiver's pin, and it holds bumps behind two states that need a HUMAN TO TICK A BOX
      # in another repo — a rate-limited branch, or a repo it has simply not re-extracted since. Both
      # were live on 2026-07-29 with FS.GG.Kit four versions ahead of two receivers. The tick is a
      # `PATCH .../issues/<n>` on the receiver's Dependency Dashboard, and it needs no receiver-side
      # workflow at all.
      #
      # WHY IT IS AFTER THE PUSHES AND NOT `continue-on-error`. Telling the fleet is part of
      # releasing, not a courtesy after it: #1923 AC4 requires that a release reaching ZERO receivers
      # go RED, and a step that swallows its own failure is the no-op-reporting-success shape epic
      # #266 refuses. It is gated on `push == 'true'` so a pack-only dry run tells nobody, which is
      # correct — nothing was published.
      #
      # The token is the org dispatch App, NOT `GITHUB_TOKEN`: this writes to other repositories, and
      # the run-scoped token's authority stops at this one. `issues: write` on that installation is
      # asserted independently, and on a schedule, by dashboard-tick-selftest.yml.
      - name: Mint the cross-repo token the push half writes with
        id: tick-token
        if: steps.v.outputs.push == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          # No `repositories:` — see dashboard-tick-selftest.yml. The subject set is the ROSTER, read
          # by the script; a list here could only be a second, drifting copy of it.
          owner: FS-GG
          permission-issues: write

      - name: Tell every kit receiver the release exists
        if: steps.v.outputs.push == 'true'
        env:
          DASHBOARD_TICK_TOKEN: ${{ steps.tick-token.outputs.token }}
          # Through `env:`, not spliced into the `run:` body — the same discipline the version step
          # above uses, and the reason is that a `${{ }}` inside shell is substituted before bash
          # ever parses the line.
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set +eu
          python3 scripts/dashboard-tick.py --package FS.GG.Kit --version "$VERSION"
          rc=$?
          set -eu
          # Classify by EXIT CODE, never by prose (#335). Every non-zero is red; they are separate
          # arms so the operator reads the right sentence, which is the whole point of the script
          # having four codes instead of two.
          #   2 — a receiver could not be GRADED. "I could not tell them" must never wear the same
          #       green as "I told them" (#266).
          #   3 — nothing was ATTEMPTED: the roster would not read, or the credential was empty. Not
          #       the same event as a refused write, and folding it into that arm names a cause that
          #       did not happen.
          case "$rc" in
            0) echo "delivery: every kit receiver was reached." >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::error title=release-kit: delivery not verified::At least one receiver could not be graded. The kit IS published; some receivers may not have been told. See the job log." ; exit 1 ;;
            3) echo "::error title=release-kit: delivery never ran::scripts/dashboard-tick.py exited 3 — a permanent no-verdict (the roster would not read, or the credential was empty). NOTHING was attempted, so no receiver was told. The kit IS published." ; exit 1 ;;
            *) echo "::error title=release-kit: the release told nobody, or a write was refused::scripts/dashboard-tick.py exited $rc. The kit IS published — this is a DELIVERY failure, not a publish failure." ; exit 1 ;;
          esac
      # ─────────────────────────────────────────────────────────────────────────────────────────

      # `always()`: the publish is the thing this summary reports, and a DELIVERY failure above must
      # not suppress the record that the package went to the feeds. The two facts are separate and
      # the operator needs both.
      - name: Summary
        if: always()
        run: |
          {
            echo "### FS.GG.Kit ${{ steps.v.outputs.version }}"
            if [ "${{ steps.v.outputs.push }}" = "true" ]; then
              echo "Published \`FS.GG.Kit\` **${{ steps.v.outputs.version }}** to the org feed."
            else
              echo "Pack-only dry run — nothing pushed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
