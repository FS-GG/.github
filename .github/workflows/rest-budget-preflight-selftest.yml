name: rest-budget-preflight-selftest

# The REST-budget preflight belonged to the retired automatic v1 writer. This fixture proves the
# active manual diagnostic contains no REST/budget behavior and retains an explicit historical
# active-writer negative; it does not skip or report the old writer as successful.
on:
  pull_request:
    paths:
      - "tests/rest-budget-preflight/**"
      - ".github/workflows/coord-board-reconcile.yml"
      - "scripts/check-reconcile-concurrency-scope.py"
      - ".github/workflows/rest-budget-preflight-selftest.yml"
  push:
    branches: [main]
    paths:
      - "tests/rest-budget-preflight/**"
      - ".github/workflows/coord-board-reconcile.yml"
      - "scripts/check-reconcile-concurrency-scope.py"
      - ".github/workflows/rest-budget-preflight-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: rest-budget-preflight-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Prove REST-budget behavior retired with the legacy writer
        run: bash tests/rest-budget-preflight/run.sh
