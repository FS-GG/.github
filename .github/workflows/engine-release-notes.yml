name: engine-release-notes

# Directory.Build.props IS AN OPERAND OF THIS GATE, NOT A NEIGHBOUR OF IT (.github#2512). The engine
# project's <Version> is `$(FsggCoherentSetVersion)`, declared in Directory.Build.props — so a bump
# lives THERE, and until this filter selected it, a version-only PR ran none of this. PR #2507 did
# exactly that: it moved the scalar 0.50.4 -> 0.50.5 and touched no other path below, so this gate
# stayed silent and `check-engine-release-notes` first spoke inside `release-coord-engine`, after
# FS.GG.Kit 0.50.5 and FS.GG.Drivers 0.50.5 had already published. 0.50.5 is a permanent
# two-of-three set because of it. `scripts/check-engine-release-notes.py` declares the same pair in
# its PATHS_SUBJECT, and check-paths-coherence rule (c) keeps these two lists from drifting apart
# again.
#
# THE SIBLING PROJECTS AND THE COHERENT-SET DECLARATION ARE OPERANDS TOO, FOR THE SAME REASON ONE
# LINK FURTHER OUT (.github#2579). This gate now also refuses a `PackageReleaseNotes` longer than
# nuget.org's limit, for EVERY member of the coherent set — and the membership is declared in
# `scripts/check-coherent-set-version.py`'s `PROJECTS`. Only FS.GG.Coord.Cli carries notes today, so
# the only way a sibling gains any is a pull request editing its own `.csproj`; if this filter did
# not select those files, that PR would run none of this and the refusal would first speak at
# release time — which is precisely where it is too late, because the three release workflows run in
# parallel on the three sibling tag pushes and the siblings publish first. That is the 0.52.0 shape.
# `tests/engine-release-notes/run.sh` asserts the whole chain mechanically: every `PROJECTS` entry
# is in PATHS_SUBJECT, and every PATHS_SUBJECT entry is in BOTH filters below.
on:
  pull_request:
    paths:
      - "Directory.Build.props"
      - "src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj"
      - "src/FS.GG.Kit/FS.GG.Kit.csproj"
      - "src/FS.GG.Drivers/FS.GG.Drivers.csproj"
      - "scripts/check-coherent-set-version.py"
      - "scripts/check-engine-release-notes.py"
      - "tests/engine-release-notes/**"
      - ".github/workflows/engine-release-notes.yml"
      - ".github/workflows/release-coord-engine.yml"
  push:
    branches: [main]
    paths:
      - "Directory.Build.props"
      - "src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj"
      - "src/FS.GG.Kit/FS.GG.Kit.csproj"
      - "src/FS.GG.Drivers/FS.GG.Drivers.csproj"
      - "scripts/check-coherent-set-version.py"
      - "scripts/check-engine-release-notes.py"
      - "tests/engine-release-notes/**"
      - ".github/workflows/engine-release-notes.yml"
      - ".github/workflows/release-coord-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: engine-release-notes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Prove the checker rejects stale and unreadable notes
        run: bash tests/engine-release-notes/run.sh
      - name: Require this package's notes to announce this version
        run: python3 scripts/check-engine-release-notes.py
