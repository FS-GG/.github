name: release-telemetry-host

# GS2-08.9 retired this direct release path. Manual execution retains source-bound build and
# offline package qualification only. No credential, artifact upload, tag, feed, or release edge
# remains in the workflow.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Exact commit to qualify
        required: true
        type: string

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify retired telemetry host release locally
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Bind the local qualification to the requested source
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$SOURCE_SHA" ]
      - name: Restore, test, and pack locally
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj --locked-mode
          dotnet test tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj -c Release --no-restore
          mkdir -p artifacts/telemetry-host
          dotnet pack src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj -c Release --no-restore -o artifacts/telemetry-host
          package="$(find artifacts/telemetry-host -maxdepth 1 -name 'FS.GG.Telemetry.Host.*.nupkg' -print -quit)"
          [ -n "$package" ]
          bash tests/standalone-telemetry-host-package/run.sh "$package" artifacts/telemetry-host/package-evidence.json
      - name: Report the sealed route
        run: echo 'Legacy telemetry-host publication is sealed; qualification artifacts remain runner-local.'
