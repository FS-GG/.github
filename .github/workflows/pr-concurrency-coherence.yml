permissions:
  contents: read

concurrency:
  group: pr-concurrency-coherence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pr-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run the pr-concurrency fixture (no network)
        run: bash tests/pr-concurrency/run.sh
      - name: Assert the governed workflows declare PR-keyed concurrency
        run: python scripts/check-pr-concurrency.py --root .
