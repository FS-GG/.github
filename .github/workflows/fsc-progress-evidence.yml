# Focused source-only qualification for the FSC baselines and local V2 progress renderer.
# Direct suite invocations are intentional: scripts/test derives CI wiring from these commands.
name: fsc-progress-evidence

on:
  pull_request:
    paths:
      - "docs/reports/2026-09-25-fsc-00-executable-census.md"
      - "docs/reports/2026-09-25-fsc-02-telemetry-closure.md"
      - "scripts/check-fsc02-telemetry-closure.py"
      - "scripts/fsc-census.py"
      - "scripts/v2-progress/**"
      - "src/FS.GG.V2.Progress/**"
      - "tests/FS.GG.V2.Progress.Tests/**"
      - "tests/v2-progress/**"
      - "tests/fsc-census/**"
      - "tests/fsc02-telemetry-closure/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/fsc-progress-evidence.yml"
  push:
    branches: [main]
    paths:
      - "docs/reports/2026-09-25-fsc-00-executable-census.md"
      - "docs/reports/2026-09-25-fsc-02-telemetry-closure.md"
      - "scripts/check-fsc02-telemetry-closure.py"
      - "scripts/fsc-census.py"
      - "scripts/v2-progress/**"
      - "src/FS.GG.V2.Progress/**"
      - "tests/FS.GG.V2.Progress.Tests/**"
      - "tests/v2-progress/**"
      - "tests/fsc-census/**"
      - "tests/fsc02-telemetry-closure/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/fsc-progress-evidence.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: fsc-progress-evidence-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: ./.github/actions/setup-policy-python

      - name: Restore the renderer tests from committed locks
        run: dotnet restore tests/FS.GG.V2.Progress.Tests/FS.GG.V2.Progress.Tests.fsproj --locked-mode

      - name: Build the renderer tests
        run: dotnet build tests/FS.GG.V2.Progress.Tests/FS.GG.V2.Progress.Tests.fsproj --configuration Release --no-restore

      - name: Exercise the renderer contract
        run: dotnet test tests/FS.GG.V2.Progress.Tests/FS.GG.V2.Progress.Tests.fsproj --configuration Release --no-build --logger "console;verbosity=normal"

      - name: Exercise offline collector and actual FSharp adapter
        run: python3 tests/v2-progress/run.py --render

      - name: Exercise the FSC-00 census controls
        run: python3 tests/fsc-census/run.py

      - name: Exercise the FSC-02 telemetry closure controls
        run: python3 tests/fsc02-telemetry-closure/run.py
