name: Callable isolated operation authorization

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact protected operation phase
        required: true
        type: choice
        options:
          - creation
          - identity-bound-operation
      plan_seal:
        description: SHA-256 seal of the prepared Coordination plan
        required: true
        type: string
      contract_sha256:
        description: Exact reviewed Coordination contract SHA-256
        required: true
        type: string
      source_sha256:
        description: Exact reviewed Coordination operator SHA-256
        required: true
        type: string
      coordination_revision:
        description: Exact merged Coordination source revision
        required: true
        type: string
      dotgithub_revision:
        description: Exact main revision containing this workflow
        required: true
        type: string
      environment_id:
        description: Observed protected environment id; evidence only
        required: true
        type: string
      credential_bindings_json:
        description: Exact seven-role App and installation identities; evidence only, never credentials
        required: true
        type: string
      grant_lifetime_minutes:
        description: Grant lifetime from 1 through 120 minutes
        required: true
        default: 60
        type: number

permissions:
  contents: read

concurrency:
  group: callable-isolated-operation-authorize-${{ inputs.phase }}
  cancel-in-progress: false

jobs:
  authorize:
    name: callable-isolated-operation-authorize
    environment: callable-isolated-operation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact reviewed authority source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Validate bindings and materialize the unavailable grant preparation
        env:
          CONTRACT_SHA256: ${{ inputs.contract_sha256 }}
          COORDINATION_REVISION: ${{ inputs.coordination_revision }}
          CREDENTIAL_BINDINGS_JSON: ${{ inputs.credential_bindings_json }}
          DOTGITHUB_REVISION: ${{ inputs.dotgithub_revision }}
          ENVIRONMENT_ID: ${{ inputs.environment_id }}
          LIFETIME_MINUTES: ${{ inputs.grant_lifetime_minutes }}
          PHASE: ${{ inputs.phase }}
          PLAN_SEAL: ${{ inputs.plan_seal }}
          SOURCE_SHA256: ${{ inputs.source_sha256 }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'FS-GG/.github'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$GITHUB_SHA" = "$DOTGITHUB_REVISION"
          workflow_sha256="$(sha256sum .github/workflows/callable-isolated-operation-authorize.yml | cut -d ' ' -f 1)"
          approved_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python3 tools/callable-isolated-operation-grant.py \
            --phase "$PHASE" \
            --plan-seal "$PLAN_SEAL" \
            --contract-sha256 "$CONTRACT_SHA256" \
            --source-sha256 "$SOURCE_SHA256" \
            --coordination-revision "$COORDINATION_REVISION" \
            --grant-repository "$GITHUB_REPOSITORY" \
            --grant-event "$GITHUB_EVENT_NAME" \
            --grant-ref "$GITHUB_REF" \
            --workflow-revision "$GITHUB_SHA" \
            --workflow-sha256 "$workflow_sha256" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --environment-id "$ENVIRONMENT_ID" \
            --credential-bindings-json "$CREDENTIAL_BINDINGS_JSON" \
            --approved-at "$approved_at" \
            --lifetime-minutes "$LIFETIME_MINUTES" \
            --output "$RUNNER_TEMP/callable-isolated-operation-grant.json"
      - name: Retain the reviewed prepared-not-authorized grant input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callable-isolated-operation-grant-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/callable-isolated-operation-grant.json
          retention-days: 1
          if-no-files-found: error
