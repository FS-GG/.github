# GS2-08.9 retirement boundary. The qualification now exercises the ref policy against a local bare
# repository. It never mints a token, addresses github.com, or changes the protected authority ref.
name: GitHub Substrate v2 authority qualification (local only)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise journal CAS and immutable terminal policy locally
        run: bash tests/gs2-08-9-dispatch-repair/local-authority-qualification.sh
