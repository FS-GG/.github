name: policy-checker-inventory

on:
  pull_request:
    paths:
      - ".github/actions/setup-policy-python/**"
      - ".github/workflows/**"
      - "scripts/check-*"
      - "scripts/policy-checkers.json"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/actions/setup-policy-python/**"
      - ".github/workflows/**"
      - "scripts/check-*"
      - "scripts/policy-checkers.json"
      - "tests/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: policy-checker-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # This workflow is the smoke test for the shared bootstrap itself: any pin/action regression
      # fails before the inventory can report green.
      - uses: ./.github/actions/setup-policy-python
      - name: Prove the inventory gate rejects incomplete ownership
        run: python scripts/check-policy-checker-inventory.py --self-test
      - name: Require an owner and exercised fixture for every large checker
        run: python scripts/check-policy-checker-inventory.py
