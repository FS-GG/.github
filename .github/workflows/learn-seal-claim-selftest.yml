# Gates for the LEARN input sealing, claim and admission tooling (deployment/learn-finite-profile/seal), Refs #4647.
#
# Drives the library functions the root CLI calls against temporary trees: manifest identity, quiesce proof, seal and
# copy verification, write-path guards, the O_EXCL claim, void corroboration, supersede of a consumed claim and the
# admission pins. stdlib only; no credential, no network, no container, no root.
#
# The two `paths:` lists are identical on purpose; `check-paths-coherence.py` rule (a) reds a divergence.
name: learn-seal-claim-selftest

on:
  pull_request:
    paths:
      - "deployment/learn-finite-profile/seal/**"
      - "tests/learn-seal-claim/**"
      - ".github/workflows/learn-seal-claim-selftest.yml"
  push:
    branches: [main]
    paths:
      - "deployment/learn-finite-profile/seal/**"
      - "tests/learn-seal-claim/**"
      - ".github/workflows/learn-seal-claim-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: learn-seal-claim-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run the seal and claim gates
        run: python3 tests/learn-seal-claim/run.py

      # The same suite again with an artificial 12 s delay after the vectors' frozen `now` is taken: a vector that reads the wall clock fails here.
      - name: Run the seal and claim gates under an artificial delay
        env:
          LEARN_SEAL_TEST_DELAY_S: "12"
        run: python3 tests/learn-seal-claim/run.py
