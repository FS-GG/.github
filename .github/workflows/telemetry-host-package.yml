name: telemetry-host-package

on:
  workflow_dispatch:
    inputs:
      learn_native_preflight:
        description: Separately admitted read-only privileged provider observation
        required: true
        default: false
        type: boolean
      learn_native_fixture:
        description: Separately admitted protected-main native custody fixture
        required: true
        default: false
        type: boolean
      learn_native_source:
        description: Exact protected source commit selected by root admission
        required: false
        type: string
      learn_native_admission_sha256:
        description: Existing root native operation admission join (not authority by itself)
        required: false
        type: string
      learn_native_profile_sha256:
        description: Existing root native resource and capability profile join
        required: false
        type: string
  pull_request:
    paths:
      - "src/FS.GG.Telemetry.Host/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fs"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fsi"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tests/FS.GG.Telemetry.Tests/**"
      - "tests/FS.GG.Telemetry.Dashboard.Tests/**"
      - "tests/FS.GG.Telemetry.Browser.Tests/**"
      - "tests/standalone-telemetry-host-package/**"
      - "tests/telemetry-host-release/**"
      - "scripts/telemetry-host-release.py"
      - "scripts/telemetry-host-successor-*.py"
      - "scripts/telemetry_host_successor_*.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_journal.py"
      - "tests/telemetry-host-successor/**"
      - "deployment/telemetry-collector/host-binding/**"
      - "deployment/telemetry-collector/host-attempt/**"
      - "deployment/telemetry-collector/qualify_native_container.py"
      - "deployment/telemetry-collector/private-native-qualification.yml.in"
      - "tests/telemetry-collector-container/test_private_native_qualification.py"
      - "deployment/telemetry-collector/persistent/v3/**"
      - "tests/telemetry-collector-persistent-v3/**"
      - "tests/telemetry-collector-persistent-v3-image-closure/**"
      - "tests/telemetry-host-inactive-preparation/**"
      - "docs/roadmaps/learn-c2-persistent-receiver-v3.md"
      - "docs/roadmaps/2026-10-01-typed-administrative-fsharp-quint.md"
      - ".github/workflows/release-telemetry-host-successor-*.yml"
      - ".github/workflows/telemetry-host-package.yml"
      - ".github/workflows/release-telemetry-host.yml"
  push:
    branches: [main]
    paths:
      - "src/FS.GG.Telemetry.Host/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fs"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fsi"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tests/FS.GG.Telemetry.Tests/**"
      - "tests/FS.GG.Telemetry.Dashboard.Tests/**"
      - "tests/FS.GG.Telemetry.Browser.Tests/**"
      - "tests/standalone-telemetry-host-package/**"
      - "tests/telemetry-host-release/**"
      - "scripts/telemetry-host-release.py"
      - "scripts/telemetry-host-successor-*.py"
      - "scripts/telemetry_host_successor_*.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_journal.py"
      - "tests/telemetry-host-successor/**"
      - "deployment/telemetry-collector/host-binding/**"
      - "deployment/telemetry-collector/host-attempt/**"
      - "deployment/telemetry-collector/qualify_native_container.py"
      - "deployment/telemetry-collector/private-native-qualification.yml.in"
      - "tests/telemetry-collector-container/test_private_native_qualification.py"
      - "deployment/telemetry-collector/persistent/v3/**"
      - "tests/telemetry-collector-persistent-v3/**"
      - "tests/telemetry-collector-persistent-v3-image-closure/**"
      - "tests/telemetry-host-inactive-preparation/**"
      - "docs/roadmaps/learn-c2-persistent-receiver-v3.md"
      - "docs/roadmaps/2026-10-01-typed-administrative-fsharp-quint.md"
      - ".github/workflows/release-telemetry-host-successor-*.yml"
      - ".github/workflows/telemetry-host-package.yml"
      - ".github/workflows/release-telemetry-host.yml"

permissions:
  contents: read

concurrency:
  group: telemetry-host-package-${{ (inputs.learn_native_fixture || inputs.learn_native_preflight) && 'native' || 'source' }}-${{ github.ref }}
  cancel-in-progress: ${{ !(inputs.learn_native_fixture || inputs.learn_native_preflight) }}

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # Explicit existing GitHub-hosted provider trust selection. The native job
      # tuple must match; these constants do not authenticate newly hashed tools.
      # Closed ordinary-source candidates during the hosted image rollout.
      # Every actual selected image still needs its own fresh complete census.
      FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE_20261012: 7e7dc1bcc0ef464e5e315a2b4c33609590c6cffe
      FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE_20261018: b4067e48bd9bd803e958bfe1503ea0a06a3a127f
    steps:
      - uses: actions/checkout@v7
      - name: Retain the image SDK tree before exact SDK setup
        env:
          HOSTED_RUNNER_CUSTODY: ${{ runner.environment }}
        run: |
          set -euo pipefail
          # BEGIN hosted runner SDK isolation
          sdk_isolation_refuse() { printf 'hosted-sdk-isolation-refused stage=%s\n' "$1" >&2; exit 1; }
          test "$HOSTED_RUNNER_CUSTODY" = github-hosted || sdk_isolation_refuse runner-environment
          [[ "$GITHUB_RUN_ID" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_ATTEMPT" =~ ^[1-9][0-9]*$ ]] || sdk_isolation_refuse run-identity
          sdk_root=/usr/share/dotnet
          retained_sdk="${sdk_root}-preinstalled-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -d "$sdk_root" && test ! -L "$sdk_root" || sdk_isolation_refuse source-type
          test "$(readlink -f -- "$sdk_root")" = "$sdk_root" || sdk_isolation_refuse source-placement
          test ! -e "$retained_sdk" && test ! -L "$retained_sdk" || sdk_isolation_refuse destination-present
          original_identity="$(stat -c '%d:%i' -- "$sdk_root")" || sdk_isolation_refuse source-stat
          source_device="$(stat -c %d -- "$sdk_root")" || sdk_isolation_refuse source-device
          parent_device="$(stat -c %d -- /usr/share)" || sdk_isolation_refuse parent-device
          test "$source_device" = "$parent_device" || sdk_isolation_refuse different-filesystem
          sudo mv --no-clobber -T -- "$sdk_root" "$retained_sdk" || sdk_isolation_refuse retain-rename
          test ! -e "$sdk_root" && test ! -L "$sdk_root" || sdk_isolation_refuse source-still-present
          test -d "$retained_sdk" && test ! -L "$retained_sdk" || sdk_isolation_refuse retained-type
          test "$(stat -c '%d:%i' -- "$retained_sdk")" = "$original_identity" || sdk_isolation_refuse retained-identity
          printf 'hosted-sdk-isolation retained=%s identity=%s active-root=%s\n' "$retained_sdk" "$original_identity" "$sdk_root"
          # END hosted runner SDK isolation
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        env:
          DOTNET_INSTALL_DIR: /usr/share/dotnet
        with:
          dotnet-version: 10.0.401
      - name: Refuse stale Host schema candidate and verifier bindings early
        if: ${{ !(inputs.learn_native_fixture || inputs.learn_native_preflight) }}
        run: |
          set -euo pipefail
          python3 tests/telemetry-host-successor/run.py
          bash tests/telemetry-host-release/run.sh
      - name: Test passive Host HTTP authority before expensive qualification
        if: ${{ !(inputs.learn_native_fixture || inputs.learn_native_preflight) }}
        timeout-minutes: 5
        run: |
          set -euo pipefail
          dotnet restore tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj --locked-mode
          dotnet test tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj -c Release --no-restore --filter "FullyQualifiedName~HostPassiveReceiptTests|FullyQualifiedName~HostSchemaProfileTests|FullyQualifiedName~RemoteTelemetryTests.protected native collector resolves durable dispatch and replays retained envelope" --blame --logger "console;verbosity=normal" --logger "trx;LogFileName=host-passive.trx" --results-directory "$RUNNER_TEMP/host-passive"
          python3 scripts/read-trx-count.py "$RUNNER_TEMP/host-passive/host-passive.trx" --minimum 4 --label "passive Host HTTP" --summary-file "$GITHUB_STEP_SUMMARY"
      - name: Retain passive Host HTTP diagnostics
        if: ${{ always() && !(inputs.learn_native_fixture || inputs.learn_native_preflight) }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telemetry-host-passive-tests-${{ github.sha }}
          path: ${{ runner.temp }}/host-passive/
          if-no-files-found: warn
          retention-days: 7
      - name: Qualify the typed HOST binding and private template
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/host-binding-nuget
          HOSTED_RUNNER_CUSTODY: ${{ runner.environment }}
          FSGG_LEARN_NATIVE_PREFLIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.learn_native_preflight && 'true' || 'false' }}
          FSGG_LEARN_NATIVE_FIXTURE: ${{ github.event_name == 'workflow_dispatch' && inputs.learn_native_fixture && 'true' || 'false' }}
          FSGG_LEARN_NATIVE_SOURCE: ${{ inputs.learn_native_source }}
          FSGG_LEARN_NATIVE_ADMISSION_SHA256: ${{ inputs.learn_native_admission_sha256 }}
          FSGG_LEARN_NATIVE_PROFILE_SHA256: ${{ inputs.learn_native_profile_sha256 }}
        run: |
          set -euo pipefail
          ImageOS="${ImageOS:?native hosted image OS required}"
          ImageVersion="${ImageVersion:?native hosted image version required}"
          if test "$FSGG_LEARN_NATIVE_PREFLIGHT" = true; then
            test "$FSGG_LEARN_NATIVE_FIXTURE" = false
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$FSGG_LEARN_NATIVE_SOURCE" = "$GITHUB_SHA"
            [[ "$FSGG_LEARN_NATIVE_ADMISSION_SHA256" =~ ^[a-f0-9]{64}$ ]]
            [[ "$FSGG_LEARN_NATIVE_PROFILE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            # Root must separately admit this exact protected read-only effect.
            # Valid digests do not supply privilege, delegation or custody.
          fi
          if test "$FSGG_LEARN_NATIVE_FIXTURE" = true; then
            test "$GITHUB_EVENT_NAME" = workflow_dispatch
            test "$GITHUB_REF" = refs/heads/main
            test "$FSGG_LEARN_NATIVE_SOURCE" = "$GITHUB_SHA"
            [[ "$FSGG_LEARN_NATIVE_ADMISSION_SHA256" =~ ^[a-f0-9]{64}$ ]]
            [[ "$FSGG_LEARN_NATIVE_PROFILE_SHA256" =~ ^[a-f0-9]{64}$ ]]
            test "$FSGG_LEARN_NATIVE_PREFLIGHT" = false
            # Read-only early eligibility; the fixed root controller obtains
            # fresh actual handles in one invocation after source compilation.
            # No env FD or historical provider observation is a capability.
            test -x /usr/bin/sudo
            test "$(stat -c %u -- /usr/bin/sudo)" -eq 0
            test -d /sys/fs/cgroup/system.slice
            grep -Fx domain /sys/fs/cgroup/system.slice/cgroup.type
            for controller in cpu memory pids; do
              grep -Eq "(^| )${controller}( |$)" /sys/fs/cgroup/system.slice/cgroup.subtree_control
            done
          fi
          if test "$FSGG_LEARN_NATIVE_FIXTURE" = true; then
            # Only the already-validated fixed hex metadata can cross steps.
            printf 'FSGG_LEARN_NATIVE_FIXTURE=true\nFSGG_LEARN_NATIVE_ADMISSION_SHA256=%s\nFSGG_LEARN_NATIVE_PROFILE_SHA256=%s\n' "$FSGG_LEARN_NATIVE_ADMISSION_SHA256" "$FSGG_LEARN_NATIVE_PROFILE_SHA256" >> "$GITHUB_ENV"
          else
            # Unused dispatch strings never enter the environment file.
            printf 'FSGG_LEARN_NATIVE_FIXTURE=false\nFSGG_LEARN_NATIVE_ADMISSION_SHA256=\nFSGG_LEARN_NATIVE_PROFILE_SHA256=\n' >> "$GITHUB_ENV"
          fi
          case "$ImageVersion" in
            20261012.334.1)
              export FSGG_LEARN_CUSTODY_CORE_IMAGE_VERSION=20261012.334.1
              export FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE="$FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE_20261012"
              test "$FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE" = 7e7dc1bcc0ef464e5e315a2b4c33609590c6cffe
              ;;
            20261018.339.1)
              export FSGG_LEARN_CUSTODY_CORE_IMAGE_VERSION=20261018.339.1
              export FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE="$FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE_20261018"
              test "$FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE" = b4067e48bd9bd803e958bfe1503ea0a06a3a127f
              ;;
            *) echo "Unadmitted hosted image: $ImageVersion" >&2; exit 1 ;;
          esac
          printf 'custody-core provider=%s os=%s arch=%s image-os=%s actual-image=%s selected-image=%s source=%s\n' "$HOSTED_RUNNER_CUSTODY" "$RUNNER_OS" "$RUNNER_ARCH" "$ImageOS" "$ImageVersion" "$FSGG_LEARN_CUSTODY_CORE_IMAGE_VERSION" "$FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE"
          test "$GITHUB_ACTIONS" = true
          test "$HOSTED_RUNNER_CUSTODY" = github-hosted
          test "$RUNNER_ENVIRONMENT" = github-hosted
          test "$RUNNER_OS" = Linux
          test "$RUNNER_ARCH" = X64
          test "$ImageOS" = ubuntu24
          test "$ImageVersion" = "$FSGG_LEARN_CUSTODY_CORE_IMAGE_VERSION"
          # Each case independently checks its root-selected source above.
          # Later steps start fresh shells; hand off only the validated literal tuple.
          printf 'FSGG_LEARN_CUSTODY_CORE_IMAGE_VERSION=%s\nFSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE=%s\n' "$FSGG_LEARN_CUSTODY_CORE_IMAGE_VERSION" "$FSGG_LEARN_CUSTODY_CORE_IMAGE_SOURCE" >> "$GITHUB_ENV"
          # No package installation or compiler probe. Existing trusted image
          # readers bind provisioned package/file/ELF/search inputs. Root source
          # admission owns outer resources and actual descendant retirement.
          timeout --kill-after=15s 45s /usr/bin/python3 -I -S -c '
          import hashlib,pathlib
          with pathlib.Path("tests/telemetry-collector-persistent-v3-image-closure/native-preflight/toolchain_census.py").open("rb") as stream: source=stream.read(65537)
          if len(source)>65536 or hashlib.sha256(source).hexdigest()!="ea37894bc20851a632e251ca173495c33b3230b1048bf5c96d77d8ca8d694af9":
              raise RuntimeError("custody-census-source-refused")
          exec(compile(source,"<pinned-existing-census>","exec"))
          '
          # BEGIN hosted runner SDK custody normalization
          sdk_refuse() {
            printf 'hosted-sdk-guard-refused stage=%s\n' "$1" >&2
            exit 1
          }
          sdk_path_guard() {
            local stage="$1" path="$2" uid mode
            uid="$(stat -c %u -- "$path")" || sdk_refuse "$stage-stat"
            mode="$(stat -c %a -- "$path")" || sdk_refuse "$stage-stat"
            printf 'hosted-sdk-guard stage=%s path=%s uid=%s mode=%s\n' "$stage" "$path" "$uid" "$mode"
            test "$uid" = 0 || sdk_refuse "$stage-owner"
            test "$((8#$mode & 022))" = 0 || sdk_refuse "$stage-mode"
          }
          test "$HOSTED_RUNNER_CUSTODY" = github-hosted || sdk_refuse runner-environment
          test "$DOTNET_ROOT" = /usr/share/dotnet || sdk_refuse dotnet-root-environment
          sdk_root="$(readlink -f -- "$DOTNET_ROOT")" || sdk_refuse dotnet-root-resolve
          resolved_dotnet="$(readlink -f -- /usr/bin/dotnet)" || sdk_refuse usr-bin-dotnet-resolve
          path_dotnet="$(readlink -f -- "$(command -v dotnet)")" || sdk_refuse path-dotnet-resolve
          printf 'hosted-sdk-placement sdk-root=%s resolved-dotnet=%s path-dotnet=%s\n' "$sdk_root" "$resolved_dotnet" "$path_dotnet"
          test "$sdk_root" = /usr/share/dotnet || sdk_refuse dotnet-root-placement
          test "$resolved_dotnet" = "$sdk_root/dotnet" || sdk_refuse usr-bin-dotnet-placement
          test "$path_dotnet" = "$resolved_dotnet" || sdk_refuse path-dotnet-placement
          sdk_version_evidence="$(umask 077; mktemp -d "$RUNNER_TEMP/host-binding-sdk-version.XXXXXX")" || sdk_refuse version-evidence-directory
          if "$resolved_dotnet" --version >"$sdk_version_evidence/stdout" 2>"$sdk_version_evidence/stderr"; then
            sdk_version_exit=0
          else
            sdk_version_exit=$?
          fi
          printf '%s\n' "$sdk_version_exit" >"$sdk_version_evidence/exit"
          printf 'hosted-sdk-version-evidence path=%s exit=%s\n' "$sdk_version_evidence" "$sdk_version_exit"
          test "$sdk_version_exit" = 0 && test "$(cat "$sdk_version_evidence/stdout")" = 10.0.401 || sdk_refuse dotnet-version-before-normalization
          sudo chown -hR root:root -- "$sdk_root" || sdk_refuse dotnet-tree-chown
          sudo chmod -R go-w -- "$sdk_root" || sdk_refuse dotnet-tree-chmod
          usr_share_uid="$(stat -c %u -- /usr/share)" || sdk_refuse usr-share-stat-before-normalization
          usr_share_mode="$(stat -c %a -- /usr/share)" || sdk_refuse usr-share-stat-before-normalization
          printf 'hosted-sdk-ancestor-normalize path=/usr/share uid=%s mode-before=%s\n' "$usr_share_uid" "$usr_share_mode"
          test "$usr_share_uid" = 0 || sdk_refuse usr-share-owner-before-normalization
          sudo chmod go-w -- /usr/share || sdk_refuse usr-share-chmod
          invalid_sdk_entry="$(find "$sdk_root" -xdev \( ! -uid 0 -o \( ! -type l -a -perm /022 \) \) -print -quit)" || sdk_refuse dotnet-tree-scan
          if test -n "$invalid_sdk_entry"; then
            printf '%s\n' hosted-sdk-custody-refused >&2
            sdk_refuse dotnet-tree-custody
          fi
          sdk_path_guard resolved-dotnet "$resolved_dotnet"
          sdk_path_guard dotnet-root "$sdk_root"
          sdk_path_guard usr-share /usr/share
          sdk_path_guard usr /usr
          sdk_path_guard filesystem-root /
          # END hosted runner SDK custody normalization
          test "$(dotnet --version)" = 10.0.401 || sdk_refuse path-dotnet-version-after-normalization
          test "$(/usr/bin/dotnet --version)" = 10.0.401 || sdk_refuse usr-bin-dotnet-version-after-normalization
          test "$(readlink -f "$(command -v dotnet)")" = "$(readlink -f /usr/bin/dotnet)" || sdk_refuse dotnet-selection-after-normalization
          python3 -c 'import yaml; print(yaml.__version__)' > "$RUNNER_TEMP/host-binding-pyyaml-version.txt" || sdk_refuse pyyaml-import
          if test "$FSGG_LEARN_NATIVE_PREFLIGHT" = true; then
            /usr/bin/python3 -I -S - <<'PY'
          import hashlib, json, os, pathlib, time
          inputs={"literal": {"bytes": 6982, "path": "tests/telemetry-collector-persistent-v3-image-closure/native-preflight/privileged_observation.py", "sha256": "46018b4c1b192bb42d99d1d079c313c17ad5712e71a44ee75c9c7e3ad8aaef6a"}, "parser": {"bytes": 4033, "path": "tests/telemetry-collector-persistent-v3-image-closure/native-preflight/observation_parser.py", "sha256": "09aa78d5aaf2746de4368307c210ddb1a65531ef89eeaea74d4c2d98ae8459c7"}, "runner": {"bytes": 63010, "path": "tests/telemetry-collector-persistent-v3-image-closure/native-preflight/owned_install_guards.py", "sha256": "20bb67be5004feb023499b7393f4352602010ddfb1e61eef086ec7e0496a5fc0"}}
          selected={}
          workspace=pathlib.Path(os.environ['GITHUB_WORKSPACE'])
          for name,row in inputs.items():
              with (workspace/row['path']).open('rb') as stream:
                  value=stream.read(row['bytes']+1)
              if len(value)!=row['bytes'] or hashlib.sha256(value).hexdigest()!=row['sha256']:
                  raise RuntimeError('observation-input-byte-selection:'+name)
              selected[name]=value
          runner={'__name__':'accepted_owner_runner_inner_join'}
          parser={'__name__':'observation_evidence_parser'}
          exec(compile(selected['runner'],'<accepted-owner-runner-inner-join>','exec'),runner)
          exec(compile(selected['parser'],'<observation-evidence-parser>','exec'),parser)
          destination=pathlib.Path(os.environ['RUNNER_TEMP'])/'learn-native-observation-evidence'
          destination.mkdir(mode=0o700)
          output=destination/'original-command.log'
          original_boot=time.clock_gettime_ns(time.CLOCK_BOOTTIME)
          original_deadline=time.monotonic()+15
          original_boot_deadline=original_boot+15000000000
          observed={}
          def control(event,child,leader,known):
              if event=='before-success':
                  with output.open('rb') as stream: raw=stream.read(65537)
                  observed.update(parser['validate_observation'](raw,original_boot,original_boot_deadline))
          argv=['/usr/bin/sudo','-n','--','/usr/bin/timeout','--kill-after=5s','15s',
                '/usr/bin/python3','-I','-S','-c',selected['literal'].decode('utf-8','strict')]
          result=runner['run'](argv,os.environ['GITHUB_WORKSPACE'],
              {'PATH':'/usr/bin:/bin','LC_ALL':'C','LANG':'C'},original_deadline,5,
              134217728,str(output),output_cap=65536,control=control)
          evidence={'schema':'fsgg.learn.native-readonly-observation/1',
              'source':os.environ['GITHUB_SHA'],'run':os.environ['GITHUB_RUN_ID'],
              'attempt':os.environ['GITHUB_RUN_ATTEMPT'],'image':os.environ['ImageVersion'],
              'admissionJoin':os.environ['FSGG_LEARN_NATIVE_ADMISSION_SHA256'],
              'profileJoin':os.environ['FSGG_LEARN_NATIVE_PROFILE_SHA256'],
              'inputs':{k:{'sha256':v['sha256'],'bytes':v['bytes']} for k,v in inputs.items()},
              'observation':observed,'runnerResult':result,
              'scope':'read-only facts; no exclusive delegation or fixture custody authority',
              'wholePrivilegedWrapperRetirement':'UNKNOWN',
              'fixtureExecuted':False,'hardFixtureQuotasAppliedToWrappers':False}
          encoded=json.dumps(evidence,sort_keys=True).encode()
          if len(encoded)>131072: raise RuntimeError('observation-evidence-bound')
          (destination/'observation.json').write_bytes(encoded)
          print('OBSERVED read-only privileged provider facts; native fixture remains held')
          PY
          fi
          # Compile current LEARN F# source before costly fixture/model work.
          # One original 120s envelope covers locked restore plus build; this
          # gate invokes no console, C controls or privileged native fixture.
          timeout --kill-after=15s 120s /usr/bin/bash -c '
            set -euo pipefail
            export DOTNET_CLI_DO_NOT_USE_MSBUILD_SERVER=1 MSBUILDDISABLENODEREUSE=1
            project=tests/telemetry-collector-persistent-v3-image-closure/PersistentV3.ImageClosure.Tests.fsproj
            /usr/bin/dotnet restore "$project" --locked-mode --disable-build-servers -m:1 /nodeReuse:false
            /usr/bin/dotnet build "$project" --no-restore --disable-build-servers -m:1 /nodeReuse:false -p:UseSharedCompilation=false
          '
          /usr/bin/dotnet restore deployment/telemetry-collector/host-binding/tests/HostBinding.Tests.fsproj --locked-mode
          /usr/bin/dotnet test deployment/telemetry-collector/host-binding/tests/HostBinding.Tests.fsproj \
