name: telemetry-host-package

on:
  pull_request:
    paths:
      - "src/FS.GG.Telemetry.Host/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fs"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fsi"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tests/FS.GG.Telemetry.Tests/**"
      - "tests/FS.GG.Telemetry.Dashboard.Tests/**"
      - "tests/FS.GG.Telemetry.Browser.Tests/**"
      - "tests/standalone-telemetry-host-package/**"
      - "tests/telemetry-host-release/**"
      - "scripts/telemetry-host-release.py"
      - "scripts/telemetry-host-successor-*.py"
      - "scripts/telemetry_host_successor_*.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_journal.py"
      - "tests/telemetry-host-successor/**"
      - "deployment/telemetry-collector/host-binding/**"
      - "deployment/telemetry-collector/host-attempt/**"
      - "deployment/telemetry-collector/qualify_native_container.py"
      - "deployment/telemetry-collector/private-native-qualification.yml.in"
      - "tests/telemetry-collector-container/test_private_native_qualification.py"
      - "deployment/telemetry-collector/persistent/v3/**"
      - "tests/telemetry-collector-persistent-v3/**"
      - "docs/roadmaps/learn-c2-persistent-receiver-v3.md"
      - "docs/roadmaps/2026-10-01-typed-administrative-fsharp-quint.md"
      - ".github/workflows/release-telemetry-host-successor-*.yml"
      - ".github/workflows/telemetry-host-package.yml"
      - ".github/workflows/release-telemetry-host.yml"
  push:
    branches: [main]
    paths:
      - "src/FS.GG.Telemetry.Host/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fs"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fsi"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tests/FS.GG.Telemetry.Tests/**"
      - "tests/FS.GG.Telemetry.Dashboard.Tests/**"
      - "tests/FS.GG.Telemetry.Browser.Tests/**"
      - "tests/standalone-telemetry-host-package/**"
      - "tests/telemetry-host-release/**"
      - "scripts/telemetry-host-release.py"
      - "scripts/telemetry-host-successor-*.py"
      - "scripts/telemetry_host_successor_*.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_journal.py"
      - "tests/telemetry-host-successor/**"
      - "deployment/telemetry-collector/host-binding/**"
      - "deployment/telemetry-collector/host-attempt/**"
      - "deployment/telemetry-collector/qualify_native_container.py"
      - "deployment/telemetry-collector/private-native-qualification.yml.in"
      - "tests/telemetry-collector-container/test_private_native_qualification.py"
      - "deployment/telemetry-collector/persistent/v3/**"
      - "tests/telemetry-collector-persistent-v3/**"
      - "docs/roadmaps/learn-c2-persistent-receiver-v3.md"
      - "docs/roadmaps/2026-10-01-typed-administrative-fsharp-quint.md"
      - ".github/workflows/release-telemetry-host-successor-*.yml"
      - ".github/workflows/telemetry-host-package.yml"
      - ".github/workflows/release-telemetry-host.yml"

permissions:
  contents: read

concurrency:
  group: telemetry-host-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
      - name: Qualify the typed HOST binding and private template
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/host-binding-nuget
          HOSTED_RUNNER_CUSTODY: ${{ runner.environment }}
        run: |
          set -euo pipefail
          # BEGIN hosted runner SDK custody normalization
          sdk_refuse() {
            printf 'hosted-sdk-guard-refused stage=%s\n' "$1" >&2
            exit 1
          }
          sdk_path_guard() {
            local stage="$1" path="$2" uid mode
            uid="$(stat -c %u -- "$path")" || sdk_refuse "$stage-stat"
            mode="$(stat -c %a -- "$path")" || sdk_refuse "$stage-stat"
            printf 'hosted-sdk-guard stage=%s path=%s uid=%s mode=%s\n' "$stage" "$path" "$uid" "$mode"
            test "$uid" = 0 || sdk_refuse "$stage-owner"
            test "$((8#$mode & 022))" = 0 || sdk_refuse "$stage-mode"
          }
          test "$HOSTED_RUNNER_CUSTODY" = github-hosted || sdk_refuse runner-environment
          test "$DOTNET_ROOT" = /usr/share/dotnet || sdk_refuse dotnet-root-environment
          sdk_root="$(readlink -f -- "$DOTNET_ROOT")" || sdk_refuse dotnet-root-resolve
          resolved_dotnet="$(readlink -f -- /usr/bin/dotnet)" || sdk_refuse usr-bin-dotnet-resolve
          path_dotnet="$(readlink -f -- "$(command -v dotnet)")" || sdk_refuse path-dotnet-resolve
          printf 'hosted-sdk-placement sdk-root=%s resolved-dotnet=%s path-dotnet=%s\n' "$sdk_root" "$resolved_dotnet" "$path_dotnet"
          test "$sdk_root" = /usr/share/dotnet || sdk_refuse dotnet-root-placement
          test "$resolved_dotnet" = "$sdk_root/dotnet" || sdk_refuse usr-bin-dotnet-placement
          test "$path_dotnet" = "$resolved_dotnet" || sdk_refuse path-dotnet-placement
          test "$("$resolved_dotnet" --version)" = 10.0.401 || sdk_refuse dotnet-version-before-normalization
          sudo chown -hR root:root -- "$sdk_root" || sdk_refuse dotnet-tree-chown
          sudo chmod -R go-w -- "$sdk_root" || sdk_refuse dotnet-tree-chmod
          usr_share_uid="$(stat -c %u -- /usr/share)" || sdk_refuse usr-share-stat-before-normalization
          usr_share_mode="$(stat -c %a -- /usr/share)" || sdk_refuse usr-share-stat-before-normalization
          printf 'hosted-sdk-ancestor-normalize path=/usr/share uid=%s mode-before=%s\n' "$usr_share_uid" "$usr_share_mode"
          test "$usr_share_uid" = 0 || sdk_refuse usr-share-owner-before-normalization
          sudo chmod go-w -- /usr/share || sdk_refuse usr-share-chmod
          invalid_sdk_entry="$(find "$sdk_root" -xdev \( ! -uid 0 -o \( ! -type l -a -perm /022 \) \) -print -quit)" || sdk_refuse dotnet-tree-scan
          if test -n "$invalid_sdk_entry"; then
            printf '%s\n' hosted-sdk-custody-refused >&2
            sdk_refuse dotnet-tree-custody
          fi
          sdk_path_guard resolved-dotnet "$resolved_dotnet"
          sdk_path_guard dotnet-root "$sdk_root"
          sdk_path_guard usr-share /usr/share
          sdk_path_guard usr /usr
          sdk_path_guard filesystem-root /
          # END hosted runner SDK custody normalization
          test "$(dotnet --version)" = 10.0.401 || sdk_refuse path-dotnet-version-after-normalization
          test "$(/usr/bin/dotnet --version)" = 10.0.401 || sdk_refuse usr-bin-dotnet-version-after-normalization
          test "$(readlink -f "$(command -v dotnet)")" = "$(readlink -f /usr/bin/dotnet)" || sdk_refuse dotnet-selection-after-normalization
          python3 -c 'import yaml; print(yaml.__version__)' > "$RUNNER_TEMP/host-binding-pyyaml-version.txt" || sdk_refuse pyyaml-import
          /usr/bin/dotnet restore deployment/telemetry-collector/host-binding/tests/HostBinding.Tests.fsproj --locked-mode
          /usr/bin/dotnet test deployment/telemetry-collector/host-binding/tests/HostBinding.Tests.fsproj \
            --configuration Release --no-restore --logger "trx;LogFileName=host-binding.trx" \
            --results-directory "$RUNNER_TEMP/host-binding-results"
          python3 - "$RUNNER_TEMP/host-binding-results/host-binding.trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          counters = ET.parse(sys.argv[1]).getroot().find('.//{*}Counters')
          assert counters is not None
          assert (counters.get('total'), counters.get('executed'), counters.get('passed'), counters.get('failed')) == ('26', '26', '26', '0')
          PY
          python3 -m unittest tests/telemetry-collector-container/test_private_native_qualification.py \
            2>&1 | tee "$RUNNER_TEMP/host-binding-python-tests.log"
          grep -F 'Ran 38 tests' "$RUNNER_TEMP/host-binding-python-tests.log"
          grep -F 'OK' "$RUNNER_TEMP/host-binding-python-tests.log"
          ! grep -F 'skipped=' "$RUNNER_TEMP/host-binding-python-tests.log"
      - name: Check out the exact published HOST recipe for attempt-producer tests
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FS-GG/.github
          ref: 8ad0da67004d670c6803f34755dfe759a7fc84e7
          path: .host-attempt-recipe-8ad
          persist-credentials: false
      - name: Qualify the typed HOST attempt producer and canonical lifecycle
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/host-attempt-nuget
          HOST_ATTEMPT_RECIPE_ROOT: ${{ github.workspace }}/.host-attempt-recipe-8ad
          HOST_ATTEMPT_BINDING_DLL: ${{ runner.temp }}/host-attempt-binding/bin/HostBinding/release/HostBinding.dll
          HOST_ATTEMPT_PRODUCER_DLL: ${{ runner.temp }}/host-attempt-tests/bin/HostAttempt/release/HostAttempt.dll
          HOST_ATTEMPT_MUTATED_PRODUCER_DLL: ${{ runner.temp }}/host-attempt-mutated/bin/HostAttempt/release/HostAttempt.dll
          HOST_ATTEMPT_TEST_LOADED_DLL: ${{ runner.temp }}/host-attempt-tests/bin/HostAttempt.Tests/release/HostAttempt.dll
          HOST_ATTEMPT_SOURCE_PINS: ${{ runner.temp }}/host-attempt-source-pins.json
          HOST_ATTEMPT_ITF_ROOT: ${{ runner.temp }}/host-attempt-itf
          HOST_ATTEMPT_ACQUIRED_TRACE_OUTPUT: ${{ runner.temp }}/host-attempt-acquired-state.json
          HOST_ATTEMPT_QUINT_ROOT: ${{ runner.temp }}/host-attempt-quint
        run: |
          set -euo pipefail
          mkdir -p "$HOST_ATTEMPT_ITF_ROOT" "$HOST_ATTEMPT_QUINT_ROOT/archives" "$HOST_ATTEMPT_QUINT_ROOT/home"
          /usr/bin/dotnet restore "$HOST_ATTEMPT_RECIPE_ROOT/deployment/telemetry-collector/host-binding/HostBinding.fsproj" \
            --locked-mode --artifacts-path "$RUNNER_TEMP/host-attempt-binding"
          /usr/bin/dotnet build "$HOST_ATTEMPT_RECIPE_ROOT/deployment/telemetry-collector/host-binding/HostBinding.fsproj" \
            -c Release --no-restore --artifacts-path "$RUNNER_TEMP/host-attempt-binding"
          python3 - "$HOST_ATTEMPT_RECIPE_ROOT" "$HOST_ATTEMPT_SOURCE_PINS" <<'PY'
          import hashlib, json, pathlib, sys
          root, output = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          native = root / 'deployment/telemetry-collector'
          names = ['qualify_native.py','native_producer_support.py','native-operation-v1.json','native-producer-config.toml']
          output.write_text(json.dumps({name: hashlib.sha256((native/name).read_bytes()).hexdigest() for name in names}, sort_keys=True, separators=(',',':'))+'\n')
          PY
          /usr/bin/dotnet restore deployment/telemetry-collector/host-attempt/tests/HostAttempt.Tests.fsproj \
            --locked-mode --artifacts-path "$RUNNER_TEMP/host-attempt-tests"
          /usr/bin/dotnet build deployment/telemetry-collector/host-attempt/tests/HostAttempt.Tests.fsproj \
            -c Release --no-restore --artifacts-path "$RUNNER_TEMP/host-attempt-tests"
          /usr/bin/dotnet restore deployment/telemetry-collector/host-attempt/HostAttempt.fsproj \
            --locked-mode --artifacts-path "$RUNNER_TEMP/host-attempt-mutated"
          /usr/bin/dotnet build deployment/telemetry-collector/host-attempt/HostAttempt.fsproj \
            -c Release --no-restore --artifacts-path "$RUNNER_TEMP/host-attempt-mutated" \
            -p:DefineConstants=HOST_ATTEMPT_REMOVE_PROVIDER_IDENTITY_GUARD
          cp -- "$HOST_ATTEMPT_PRODUCER_DLL" "$HOST_ATTEMPT_TEST_LOADED_DLL"
          test "$(sha256sum -- "$HOST_ATTEMPT_PRODUCER_DLL" | cut -d' ' -f1)" = "$(sha256sum -- "$HOST_ATTEMPT_TEST_LOADED_DLL" | cut -d' ' -f1)"
          /usr/bin/dotnet test deployment/telemetry-collector/host-attempt/tests/HostAttempt.Tests.fsproj \
            -c Release --no-build --artifacts-path "$RUNNER_TEMP/host-attempt-tests" \
            --logger "trx;LogFileName=host-attempt.trx" --results-directory "$RUNNER_TEMP/host-attempt-results"
          python3 - "$RUNNER_TEMP/host-attempt-results/host-attempt.trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          counters = ET.parse(sys.argv[1]).getroot().find('.//{*}Counters')
          assert counters is not None
          assert (counters.get('total'), counters.get('executed'), counters.get('passed'), counters.get('failed')) == ('40','40','40','0')
          PY
          python3 -m unittest discover -s deployment/telemetry-collector/host-attempt/tests -p test_transport.py 2>&1 | tee "$RUNNER_TEMP/host-attempt-transport.log"
          grep -F 'Ran 16 tests' "$RUNNER_TEMP/host-attempt-transport.log"
          python3 -m unittest discover -s deployment/telemetry-collector/host-attempt/tests -p test_cli_controls.py 2>&1 | tee "$RUNNER_TEMP/host-attempt-cli.log"
          grep -F 'Ran 5 tests' "$RUNNER_TEMP/host-attempt-cli.log"
          ! grep -F 'skipped=' "$RUNNER_TEMP/host-attempt-transport.log" "$RUNNER_TEMP/host-attempt-cli.log"
          quint_url="$(jq -r .quintDownload docs/quint/toolchain.json)"
          quint_sha512="$(jq -r .quintArchiveSha512 docs/quint/toolchain.json)"
          quint_version="$(jq -r .quintVersion docs/quint/toolchain.json)"
          test "$quint_version" = 0.32.0
          quint_archive="$HOST_ATTEMPT_QUINT_ROOT/archives/quint-$quint_version.tgz"
          curl --fail --location --silent --show-error "$quint_url" --output "$quint_archive"
          printf '%s  %s\n' "$quint_sha512" "$quint_archive" | sha512sum --check --status
          export npm_config_cache="$HOST_ATTEMPT_QUINT_ROOT/npm" QUINT_HOME="$HOST_ATTEMPT_QUINT_ROOT/home"
          quint() { npm exec --yes --package="$quint_archive" -- quint "$@"; }
          quint typecheck deployment/telemetry-collector/host-attempt/HostAttempt.qnt
          quint test deployment/telemetry-collector/host-attempt/HostAttempt_test.qnt \
            --backend typescript --match '^(success|earlyAdmission|stickyLateAck|lostDispatch|ambiguity|candidateNotOwned|cancellationUnknown|deadlineUnknown|secretOnlyCleanup|successThenDeadline|refusedOwnedCancellation|falseOwnershipRefusal)$'
          quint run deployment/telemetry-collector/host-attempt/HostAttempt.qnt --backend typescript --main HostAttempt \
            --max-samples 5000 --max-steps 30 --n-threads 1 --seed 20261004 --invariant allInvariants
          for item in 'success successStep 16' 'ambiguous ambiguityStep 11' 'lost lostStep 10' 'sticky stickyStep 5' 'deadline deadlineStep 20' 'refused-owned-cancel refusedOwnedCancelStep 16' 'false-ownership falseOwnershipStep 13'; do
            set -- $item
            quint run deployment/telemetry-collector/host-attempt/HostAttempt.qnt --backend typescript --main HostAttempt --step "$2" \
              --max-samples 1 --max-steps "$3" --seed 1 --out-itf "$HOST_ATTEMPT_ITF_ROOT/$1-{seq}.itf.json" --verbosity 0
          done
          /usr/bin/dotnet restore deployment/telemetry-collector/host-attempt/correspondence/HostAttempt.Correspondence.fsproj \
            --locked-mode --artifacts-path "$RUNNER_TEMP/host-attempt-correspondence"
          /usr/bin/dotnet build deployment/telemetry-collector/host-attempt/correspondence/HostAttempt.Correspondence.fsproj \
            -c Release --no-restore --artifacts-path "$RUNNER_TEMP/host-attempt-correspondence"
          correspondence_loaded="$RUNNER_TEMP/host-attempt-correspondence/bin/HostAttempt.Correspondence/release/HostAttempt.dll"
          cp -- "$HOST_ATTEMPT_PRODUCER_DLL" "$correspondence_loaded"
          test "$(sha256sum -- "$HOST_ATTEMPT_PRODUCER_DLL" | cut -d' ' -f1)" = "$(sha256sum -- "$correspondence_loaded" | cut -d' ' -f1)"
          HOST_ATTEMPT_MODEL="$GITHUB_WORKSPACE/deployment/telemetry-collector/host-attempt/HostAttempt.qnt" \
          HOST_ATTEMPT_PROFILE="$HOST_ATTEMPT_RECIPE_ROOT/deployment/telemetry-collector/native-operation-v1.json" \
          HOST_ATTEMPT_ADAPTER="$GITHUB_WORKSPACE/deployment/telemetry-collector/host-attempt/host_attempt_transport.py" \
          HOST_ATTEMPT_PRODUCTION_DLL="$HOST_ATTEMPT_PRODUCER_DLL" \
          HOST_ATTEMPT_ACQUIRED_STATE="$HOST_ATTEMPT_ACQUIRED_TRACE_OUTPUT" \
          HOST_ATTEMPT_QUINT_TOOL="$quint_archive" \
            /usr/bin/dotnet "$RUNNER_TEMP/host-attempt-correspondence/bin/HostAttempt.Correspondence/release/HostAttempt.Correspondence.dll"
      - name: Refuse malformed Host release effect policy before costly qualification
        run: |
          set -euo pipefail
          python3 tests/release-successor-execution/run.py
          python3 tests/release-successor-journal/run.py
          python3 tests/telemetry-host-successor/run.py
      - name: Restore the locked host closure
        run: |
          dotnet restore src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Dashboard.Tests/FS.GG.Telemetry.Dashboard.Tests.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Browser.Tests/FS.GG.Telemetry.Browser.Tests.fsproj --locked-mode
      - name: Qualify the inactive persistent v3 preparation chain
        env:
          FSGG_C2_MANAGER_EXE: ${{ runner.temp }}/c2-manager/TelemetryHostManager
          FSGG_C2_PREPARATION_EXE: ${{ runner.temp }}/c2-preparation/PersistentV3.Preparation
          FSGG_C2_TEST_EXE: ${{ runner.temp }}/c2-preparation/PersistentV3.Preparation.Tests
        run: |
          set -euo pipefail
          manager_revision=e6f6631a2166f9d73639b1cbb96953ee3a768530
          manager_tree=9059c91396cc2963d15037867cde9a5a3cf1c9ba
          manager_source="$RUNNER_TEMP/c2-coordination-source"
          manager_project="$manager_source/eng/telemetry-host-manager/TelemetryHostManager.fsproj"
          manager_packages="$RUNNER_TEMP/c2-manager-nuget"
          preparation_packages="$RUNNER_TEMP/c2-preparation-nuget"

          test -n "$FSGG_C2_MANAGER_EXE"
          test -n "$FSGG_C2_PREPARATION_EXE"
          git init --quiet "$manager_source"
          git -C "$manager_source" remote add origin https://github.com/FS-GG/FS.GG.Coordination.git
          timeout 60s git -C "$manager_source" fetch --depth=1 --no-tags origin "$manager_revision"
          git -C "$manager_source" checkout --quiet --detach FETCH_HEAD
          test "$(git -C "$manager_source" rev-parse HEAD)" = "$manager_revision"
          test "$(git -C "$manager_source" rev-parse 'HEAD^{tree}')" = "$manager_tree"

          /usr/bin/dotnet restore "$manager_project" --locked-mode --packages "$manager_packages" \
            --artifacts-path "$RUNNER_TEMP/c2-manager-artifacts"
          /usr/bin/dotnet publish "$manager_project" --configuration Release --no-restore \
            --output "$RUNNER_TEMP/c2-manager" \
            --artifacts-path "$RUNNER_TEMP/c2-manager-artifacts" -m:1
          /usr/bin/dotnet restore tests/telemetry-collector-persistent-v3/PersistentV3.Preparation.Tests.fsproj \
            --locked-mode --packages "$preparation_packages" \
            --artifacts-path "$RUNNER_TEMP/c2-preparation-artifacts"
          /usr/bin/dotnet publish tests/telemetry-collector-persistent-v3/PersistentV3.Preparation.Tests.fsproj \
            --configuration Release --no-restore --output "$RUNNER_TEMP/c2-preparation" \
            --artifacts-path "$RUNNER_TEMP/c2-preparation-artifacts" -m:1

          test -x "$FSGG_C2_MANAGER_EXE"
          test -x "$FSGG_C2_PREPARATION_EXE"
          test -x "$FSGG_C2_TEST_EXE"
          bash tests/telemetry-collector-persistent-v3/run.sh
          /usr/bin/dotnet test tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj \
            --configuration Release --no-restore -m:1 \
            --filter 'DisplayName~protected native collector resolves durable dispatch'
      - name: Test the host, projection, and browser boundaries
        env:
          FSGG_RUN_REAL_BROWSER: "1"
        run: |
          cd tests/FS.GG.Telemetry.Browser.Tests || exit 2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          cd ../.. || exit 2
          dotnet test tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj -c Release --no-restore
          dotnet test tests/FS.GG.Telemetry.Dashboard.Tests/FS.GG.Telemetry.Dashboard.Tests.fsproj -c Release --no-restore
          (cd tests/FS.GG.Telemetry.Dashboard.Tests && npm ci --ignore-scripts && npm run test:browser -- --reporter=line)
          dotnet test tests/FS.GG.Telemetry.Browser.Tests/FS.GG.Telemetry.Browser.Tests.fsproj -c Release --no-restore
      - name: Pack twice from independent clean source roots
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/telemetry-host-pack-a" "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/telemetry-host-pack-b" "$GITHUB_SHA"
          for root in "$RUNNER_TEMP/telemetry-host-pack-a" "$RUNNER_TEMP/telemetry-host-pack-b"; do
            dotnet restore "$root/src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj" --locked-mode
            output="artifacts/$(basename "$root")"
            mkdir -p "$output"
            dotnet pack "$root/src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj" -c Release --no-restore -o "$GITHUB_WORKSPACE/$output"
          done
      - name: Bind and compare normalized producer payloads
        run: |
          version="$(dotnet msbuild src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj -getProperty:Version | tr -d '[:space:]')"
          package_a="artifacts/telemetry-host-pack-a/FS.GG.Telemetry.Host.$version.nupkg"
          package_b="artifacts/telemetry-host-pack-b/FS.GG.Telemetry.Host.$version.nupkg"
          python3 scripts/telemetry-host-release.py prepare --package "$package_a" \
            --lock src/FS.GG.Telemetry.Host/packages.lock.json \
            --assets src/FS.GG.Telemetry.Dashboard/Assets --source-sha "$GITHUB_SHA" \
            --version "$version" --tag "telemetry-host/v$version" --output artifacts/telemetry-host-manifest.json
          python3 scripts/telemetry-host-release.py verify --manifest artifacts/telemetry-host-manifest.json --package "$package_a"
          python3 scripts/telemetry-host-release.py verify --manifest artifacts/telemetry-host-manifest.json --package "$package_b" --payload-only
          bash tests/standalone-telemetry-host-package/run.sh "$package_a" artifacts/telemetry-host-package-evidence.json
          bash tests/telemetry-host-release/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telemetry-host-candidate-${{ github.sha }}
          path: |
            artifacts/telemetry-host-pack-a/FS.GG.Telemetry.Host.*.nupkg
            artifacts/telemetry-host-manifest.json
            artifacts/telemetry-host-package-evidence.json
          if-no-files-found: error
          retention-days: 14
