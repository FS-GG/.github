name: telemetry-host-package

on:
  pull_request:
    paths:
      - "src/FS.GG.Telemetry.Host/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fs"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fsi"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tests/FS.GG.Telemetry.Tests/**"
      - "tests/FS.GG.Telemetry.Dashboard.Tests/**"
      - "tests/FS.GG.Telemetry.Browser.Tests/**"
      - "tests/standalone-telemetry-host-package/**"
      - "tests/telemetry-host-release/**"
      - "scripts/telemetry-host-release.py"
      - "scripts/telemetry-host-successor-*.py"
      - "scripts/telemetry_host_successor_*.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_journal.py"
      - "tests/telemetry-host-successor/**"
      - "deployment/telemetry-collector/host-binding/**"
      - "deployment/telemetry-collector/qualify_native_container.py"
      - "deployment/telemetry-collector/private-native-qualification.yml.in"
      - "tests/telemetry-collector-container/test_private_native_qualification.py"
      - "docs/roadmaps/2026-10-01-typed-administrative-fsharp-quint.md"
      - ".github/workflows/release-telemetry-host-successor-*.yml"
      - ".github/workflows/telemetry-host-package.yml"
      - ".github/workflows/release-telemetry-host.yml"
  push:
    branches: [main]
    paths:
      - "src/FS.GG.Telemetry.Host/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fs"
      - "src/FS.GG.Coord.Cli/TelemetryStoreApplication.fsi"
      - "Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - "tests/FS.GG.Telemetry.Tests/**"
      - "tests/FS.GG.Telemetry.Dashboard.Tests/**"
      - "tests/FS.GG.Telemetry.Browser.Tests/**"
      - "tests/standalone-telemetry-host-package/**"
      - "tests/telemetry-host-release/**"
      - "scripts/telemetry-host-release.py"
      - "scripts/telemetry-host-successor-*.py"
      - "scripts/telemetry_host_successor_*.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_journal.py"
      - "tests/telemetry-host-successor/**"
      - "deployment/telemetry-collector/host-binding/**"
      - "deployment/telemetry-collector/qualify_native_container.py"
      - "deployment/telemetry-collector/private-native-qualification.yml.in"
      - "tests/telemetry-collector-container/test_private_native_qualification.py"
      - "docs/roadmaps/2026-10-01-typed-administrative-fsharp-quint.md"
      - ".github/workflows/release-telemetry-host-successor-*.yml"
      - ".github/workflows/telemetry-host-package.yml"
      - ".github/workflows/release-telemetry-host.yml"

permissions:
  contents: read

concurrency:
  group: telemetry-host-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.401
      - name: Qualify the typed HOST binding and private template
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/host-binding-nuget
          HOSTED_RUNNER_CUSTODY: ${{ runner.environment }}
        run: |
          set -euo pipefail
          # BEGIN hosted runner SDK custody normalization
          test "$HOSTED_RUNNER_CUSTODY" = github-hosted
          test "$DOTNET_ROOT" = /usr/share/dotnet
          sdk_root="$(readlink -f -- "$DOTNET_ROOT")"
          resolved_dotnet="$(readlink -f -- /usr/bin/dotnet)"
          test "$sdk_root" = /usr/share/dotnet
          test "$resolved_dotnet" = "$sdk_root/dotnet"
          test "$(readlink -f -- "$(command -v dotnet)")" = "$resolved_dotnet"
          test "$("$resolved_dotnet" --version)" = 10.0.401
          sudo chown -hR root:root -- "$sdk_root"
          sudo chmod -R go-w -- "$sdk_root"
          test -z "$(find "$sdk_root" -xdev \( ! -uid 0 -o -perm /022 \) -print -quit)"
          custody_path="$resolved_dotnet"
          while true; do
            test "$(stat -c %u -- "$custody_path")" = 0
            custody_mode="$(stat -c %a -- "$custody_path")"
            test "$((8#$custody_mode & 022))" = 0
            test "$custody_path" = / && break
            custody_path="$(dirname -- "$custody_path")"
          done
          # END hosted runner SDK custody normalization
          test "$(dotnet --version)" = 10.0.401
          test "$(/usr/bin/dotnet --version)" = 10.0.401
          test "$(readlink -f "$(command -v dotnet)")" = "$(readlink -f /usr/bin/dotnet)"
          python3 -c 'import yaml; print(yaml.__version__)' > "$RUNNER_TEMP/host-binding-pyyaml-version.txt"
          /usr/bin/dotnet restore deployment/telemetry-collector/host-binding/tests/HostBinding.Tests.fsproj --locked-mode
          /usr/bin/dotnet test deployment/telemetry-collector/host-binding/tests/HostBinding.Tests.fsproj \
            --configuration Release --no-restore --logger "trx;LogFileName=host-binding.trx" \
            --results-directory "$RUNNER_TEMP/host-binding-results"
          python3 - "$RUNNER_TEMP/host-binding-results/host-binding.trx" <<'PY'
          import sys, xml.etree.ElementTree as ET
          counters = ET.parse(sys.argv[1]).getroot().find('.//{*}Counters')
          assert counters is not None
          assert (counters.get('total'), counters.get('executed'), counters.get('passed'), counters.get('failed')) == ('26', '26', '26', '0')
          PY
          python3 -m unittest tests/telemetry-collector-container/test_private_native_qualification.py \
            2>&1 | tee "$RUNNER_TEMP/host-binding-python-tests.log"
          grep -F 'Ran 38 tests' "$RUNNER_TEMP/host-binding-python-tests.log"
          grep -F 'OK' "$RUNNER_TEMP/host-binding-python-tests.log"
          ! grep -F 'skipped=' "$RUNNER_TEMP/host-binding-python-tests.log"
      - name: Refuse malformed Host release effect policy before costly qualification
        run: |
          set -euo pipefail
          python3 tests/release-successor-execution/run.py
          python3 tests/release-successor-journal/run.py
          python3 tests/telemetry-host-successor/run.py
      - name: Restore the locked host closure
        run: |
          dotnet restore src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Dashboard.Tests/FS.GG.Telemetry.Dashboard.Tests.fsproj --locked-mode
          dotnet restore tests/FS.GG.Telemetry.Browser.Tests/FS.GG.Telemetry.Browser.Tests.fsproj --locked-mode
      - name: Test the host, projection, and browser boundaries
        env:
          FSGG_RUN_REAL_BROWSER: "1"
        run: |
          cd tests/FS.GG.Telemetry.Browser.Tests || exit 2
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
          cd ../.. || exit 2
          dotnet test tests/FS.GG.Telemetry.Tests/FS.GG.Telemetry.Tests.fsproj -c Release --no-restore
          dotnet test tests/FS.GG.Telemetry.Dashboard.Tests/FS.GG.Telemetry.Dashboard.Tests.fsproj -c Release --no-restore
          (cd tests/FS.GG.Telemetry.Dashboard.Tests && npm ci --ignore-scripts && npm run test:browser -- --reporter=line)
          dotnet test tests/FS.GG.Telemetry.Browser.Tests/FS.GG.Telemetry.Browser.Tests.fsproj -c Release --no-restore
      - name: Pack twice from independent clean source roots
        run: |
          set -euo pipefail
          git worktree add --detach "$RUNNER_TEMP/telemetry-host-pack-a" "$GITHUB_SHA"
          git worktree add --detach "$RUNNER_TEMP/telemetry-host-pack-b" "$GITHUB_SHA"
          for root in "$RUNNER_TEMP/telemetry-host-pack-a" "$RUNNER_TEMP/telemetry-host-pack-b"; do
            dotnet restore "$root/src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj" --locked-mode
            output="artifacts/$(basename "$root")"
            mkdir -p "$output"
            dotnet pack "$root/src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj" -c Release --no-restore -o "$GITHUB_WORKSPACE/$output"
          done
      - name: Bind and compare normalized producer payloads
        run: |
          version="$(dotnet msbuild src/FS.GG.Telemetry.Host/FS.GG.Telemetry.Host.fsproj -getProperty:Version | tr -d '[:space:]')"
          package_a="artifacts/telemetry-host-pack-a/FS.GG.Telemetry.Host.$version.nupkg"
          package_b="artifacts/telemetry-host-pack-b/FS.GG.Telemetry.Host.$version.nupkg"
          python3 scripts/telemetry-host-release.py prepare --package "$package_a" \
            --lock src/FS.GG.Telemetry.Host/packages.lock.json \
            --assets src/FS.GG.Telemetry.Dashboard/Assets --source-sha "$GITHUB_SHA" \
            --version "$version" --tag "telemetry-host/v$version" --output artifacts/telemetry-host-manifest.json
          python3 scripts/telemetry-host-release.py verify --manifest artifacts/telemetry-host-manifest.json --package "$package_a"
          python3 scripts/telemetry-host-release.py verify --manifest artifacts/telemetry-host-manifest.json --package "$package_b" --payload-only
          bash tests/standalone-telemetry-host-package/run.sh "$package_a" artifacts/telemetry-host-package-evidence.json
          bash tests/telemetry-host-release/run.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: telemetry-host-candidate-${{ github.sha }}
          path: |
            artifacts/telemetry-host-pack-a/FS.GG.Telemetry.Host.*.nupkg
            artifacts/telemetry-host-manifest.json
            artifacts/telemetry-host-package-evidence.json
          if-no-files-found: error
          retention-days: 14
