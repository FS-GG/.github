# Prove the Done-retention archiver's guards can say NO (#5119; it replaced the Project 1 sweeper of .github#2420).
#
# `scripts/coord-board-archive.py` ARCHIVES CARDS OFF THE COORDINATION BOARD, so the property under test is not
# "does it archive" but "does it refuse everything it must refuse". `tests/coord-board-archive/run.sh` drives the
# pure planner directly and the IO through a recording `gh` stub (no board, no token, no network), and every guard
# has a negative case:
#
#   * only Done cards over a terminal issue or PR with a readable close time rank; drift, drafts, unreadable or
#     already-archived cards stay visible with a reason;
#   * the newest 200 by close time stay, ties broken independently of connection order;
#   * a partial, over-limit (500 items) or erroring read refuses without archiving anything;
#   * dry run by default; --execute needs the exact project id, a bound and the enrollment binding;
#   * each card gets a preimage re-read, one send and a readback; an uncertain send is recorded, never resent, and
#     stops the run; custody is private (0600) and records enrolled rows.
#
# No schedule: the subject is entirely git-tracked files in this repo, so nothing external can stale it
# between pushes — the same reasoning coherent-set-version.yml gives for the same shape.
#
# The `paths:` lists on pull_request and push are IDENTICAL and must stay so — check-paths-coherence.py
# (.github#899) fails this workflow if they drift.
name: coord-board-archive-selftest

on:
  pull_request:
    paths:
      - "scripts/coord-board-archive.py"
      - "tests/coord-board-archive/**"
      - ".github/workflows/coord-board-archive.yml"
      - ".github/workflows/coord-board-archive-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/coord-board-archive.py"
      - "tests/coord-board-archive/**"
      - ".github/workflows/coord-board-archive.yml"
      - ".github/workflows/coord-board-archive-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coord-board-archive-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Prove every archive guard can say NO
        run: bash tests/coord-board-archive/run.sh
