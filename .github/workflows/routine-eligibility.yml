name: routine-eligibility

# Security boundary: pull_request_target loads this workflow definition from the
# default branch. Candidate bytes are fetched only as Git objects for an exact
# base..head diff; no candidate revision is checked out, sourced, imported, or run.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  routine-eligibility:
    name: routine-eligibility
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate with the PR base's policy and validator
        shell: bash
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          case "$PR_NUMBER" in
            ''|*[!0-9]*) echo "routine-eligibility: invalid PR number" >&2; exit 1 ;;
          esac

          inspect="$RUNNER_TEMP/routine-eligibility-repository"
          trusted="$RUNNER_TEMP/routine-eligibility-base"
          mkdir -p "$inspect" "$trusted/lib"
          git -C "$inspect" init -q
          git -C "$inspect" remote add origin "https://github.com/$REPOSITORY.git"
          git -C "$inspect" fetch --quiet --no-tags --depth=1 origin \
            "+refs/heads/${BASE_REF}:refs/remotes/origin/routine-base" \
            "+refs/pull/${PR_NUMBER}/head:refs/remotes/origin/routine-head"

          observed_base="$(git -C "$inspect" rev-parse refs/remotes/origin/routine-base)"
          observed_head="$(git -C "$inspect" rev-parse refs/remotes/origin/routine-head)"
          test "$observed_base" = "$BASE_SHA" || {
            echo "routine-eligibility: fetched base $observed_base differs from event base $BASE_SHA" >&2
            exit 1
          }
          test "$observed_head" = "$HEAD_SHA" || {
            echo "routine-eligibility: fetched head $observed_head differs from event head $HEAD_SHA" >&2
            exit 1
          }

          # The fixture is also loaded from the exact base. This literal command
          # keeps the repository's deterministic test selector wired without ever
          # running a candidate-side test script or workflow definition.
          selftest="$RUNNER_TEMP/routine-eligibility-selftest"
          mkdir -p "$selftest/.github/workflows" "$selftest/tests/routine-eligibility"
          git -C "$inspect" show "$BASE_SHA:.github/workflows/routine-eligibility.yml" > \
            "$selftest/.github/workflows/routine-eligibility.yml"
          git -C "$inspect" show "$BASE_SHA:tests/routine-eligibility/run.sh" > \
            "$selftest/tests/routine-eligibility/run.sh"
          cd "$selftest"
          bash tests/routine-eligibility/run.sh

          case "$HEAD_REF" in
            routine/*) ;;
            *)
              echo "routine-eligibility: not applicable to non-routine branch $HEAD_REF"
              exit 0
              ;;
          esac

          # Both executable files come from the exact PR base. The candidate can
          # replace or delete either path without influencing this invocation.
          git -C "$inspect" show "$BASE_SHA:scripts/check-claim-generation.py" > "$trusted/check-claim-generation.py"
          git -C "$inspect" show "$BASE_SHA:scripts/lib/gate.py" > "$trusted/lib/gate.py"
          printf '%s' "$PR_BODY" > "$trusted/pr-body.md"

          cd "$inspect"
          python3 "$trusted/check-claim-generation.py" \
            --repo "$REPOSITORY" \
            --head-ref "$HEAD_REF" \
            --head-sha "$HEAD_SHA" \
            --base-sha "$BASE_SHA" \
            --routine-policy-ref "$BASE_SHA" \
            --body "$trusted/pr-body.md"
