name: Atlas knowledge
on:
  pull_request:
    paths:
      - 'docs/atlas/**'
      - '.agents/skills/atlas/**'
      - '.claude/skills/atlas/**'
      - 'tests/atlas/**'
      - '.fsgg/atlas.json'
      - '.fsgg/agents.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'src/FS.GG.Drivers/workspace-inventory.json'
      - 'src/FS.GG.Drivers/stage-drivers.py'
      - '.agents/skills/agent-handoff/**'
      - '.agents/skills/continue-from-handoff/**'
      - '.agents/skills/stop-with-handoff/**'
      - '.claude/skills/agent-handoff/**'
      - '.claude/skills/continue-from-handoff/**'
      - '.claude/skills/stop-with-handoff/**'
      - '.github/workflows/atlas.yml'
  push:
    branches: [main]
    paths:
      - 'docs/atlas/**'
      - '.agents/skills/atlas/**'
      - '.claude/skills/atlas/**'
      - 'tests/atlas/**'
      - '.fsgg/atlas.json'
      - '.fsgg/agents.yml'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'src/FS.GG.Drivers/workspace-inventory.json'
      - 'src/FS.GG.Drivers/stage-drivers.py'
      - '.agents/skills/agent-handoff/**'
      - '.agents/skills/continue-from-handoff/**'
      - '.agents/skills/stop-with-handoff/**'
      - '.claude/skills/agent-handoff/**'
      - '.claude/skills/continue-from-handoff/**'
      - '.claude/skills/stop-with-handoff/**'
      - '.github/workflows/atlas.yml'
permissions:
  contents: read
# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: atlas-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  atlas:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate knowledge, history, guidance and actual SQLite retrieval
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          if [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$BASE_SHA" != 0000000000000000000000000000000000000000 ]]; then
            python3 tests/atlas/check.py --baseline "$BASE_SHA"
          else
            python3 tests/atlas/check.py
          fi
