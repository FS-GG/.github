# Reusable Renovate lockfile-sync (FS-GG/.github#145, epic #16 Pillar 4).
#
# The gap this closes is org-wide: every FS-GG consumer's gate.yml enforces
# `dotnet restore --locked-mode` against a committed packages.lock.json (Feature 211,
# FR-002 / board .github#7), but nothing REGENERATES those lockfiles when a dependency
# version moves. Renovate edits the central PackageVersion (Directory.Packages.local.props)
# without running restore, so every referenced-package Renovate NuGet PR fails the gate with
# NU1004 (`Lock file [old,) != central [new,)`) until a human runs --force-evaluate by hand.
# This job does that automatically and pushes the freshened lockfiles back to the PR branch —
# the .github#6 "auto-PR" half made real.
#
# FS.GG.Rendering proved this in FS.GG.Rendering#61 (merged 2026-07-03) as a repo-local
# workflow; this is that workflow promoted into the shared preset (alongside coherence.yml,
# contract-coherence.yml, dispatch-sender.yml) so SDD / Governance / Templates adopt it with a
# ~10-line `on: pull_request` caller and Rendering repoints its local copy here.
#
# Re-trigger mechanics (carried over from #61, already validated): the commit is authored with
# the org `fs-gg-cross-repo-dispatch` GitHub *App* installation token, NOT GITHUB_TOKEN.
# App-token pushes DO re-run `on: pull_request` workflows, so the caller's gate re-evaluates the
# freshened lockfile; GITHUB_TOKEN pushes would not. Self-limiting: the second pass finds no
# drift -> no commit -> no push, so there is no loop.
#
# Restore mirrors gate.yml: setup-dotnet + `dotnet restore --force-evaluate`. A repo that builds
# its org packages from source or a local feed (SDD / Rendering) needs no NuGet auth; a pure
# CONSUMER of a token-gated org-feed package (Governance → FS.GG.Contracts) 401s anonymously, so
# the FS-GG nuget.config credential placeholders are wired from the run-scoped GITHUB_TOKEN
# (packages:read) — see the Regenerate step. A consuming caller must also grant `packages: read`.
#
# PREREQUISITES per adopting repo (both org-admin, both fail visibly if missing):
#   1. The fs-gg-cross-repo-dispatch App (repository_selection: selected) must include the repo
#      with `contents: write` — else the push 403s.
#   2. The org Actions secrets FSGG_DISPATCH_APP_ID / _PRIVATE_KEY must be visible to the repo
#      (selected-repos list) — else `secrets.app-id` resolves empty and the token step fails.
#
# "Both fail visibly" was true only of the SYMPTOM, never of the CAUSE, and this header is where the
# gap started (.github#482, epic #266). It told adopters to "confirm before relying on this" without
# saying how, and asserted the check needed org-admin — so nobody ever ran it. Both claims were wrong:
#
#   * `required: true` on a workflow_call secret means PROVIDED, not NON-EMPTY. A caller forwarding
#     `${{ secrets.FSGG_DISPATCH_APP_ID }}` for a secret the repo cannot see passes the EMPTY STRING
#     and satisfies `required`. Nothing downstream noticed until create-github-app-token failed — deep
#     inside somebody's unrelated dependency-bump PR, naming neither the secret nor the App.
#   * Prerequisite 2 is READABLE WITHOUT `admin:org`:
#         GET /repos/{owner}/{repo}/actions/organization-secrets      (needs only `repo` scope)
#     It lists the org secrets shared with a repo, values not revealed. It was believed unverifiable,
#     so six adopters went unaudited and TWO of them were never provisioned at all: FS.GG.Game (live
#     — Renovate onboarded, so its next renovate/* PR fails) and FS.GG.Audio (inert — Renovate not yet
#     onboarded). Provisioning for both is .github#468.
#
# The `preflight` job below now asserts prerequisite 2 in the RECEIVER's own context, on every call.
# That is the only place with the credentials to see it: this repo's CI holds a GITHUB_TOKEN scoped to
# `.github` alone and CANNOT read another repo's secrets — an org-wide gate here would have needed a
# new org-provisioned PAT, i.e. the fix for the provisioning problem would itself have needed
# provisioning. Checking where the workflow already runs needs no token and no new grant at all.
#
#   * Prerequisite 1 is ALSO checkable, and this header used to say it was not (.github#522):
#         GET /installation/repositories      (with an OWNER-scoped App installation token)
#     The old claim — "enumerating an installation's selected repos needs a token no CI job here
#     holds" — was simply false. CI holds the App private key; it is what mints the token. #514
#     measured it in about two seconds. The claim was never tested, and being written down is what
#     stopped anyone from testing it: a gate that documents its own blind spot as a law of nature
#     acquires a blind spot nobody audits. That is #482's mistake, one prerequisite over, in the very
#     header that narrates #482.
#
#     The fallback it offered — "the two are provisioned in the same admin pass, so asserting 2
#     catches both real cases" — is a CORRELATION, not a check, and it breaks on any sender-or-mixed
#     role repo: `.github` passes prerequisite 2 NECESSARILY (it must hold the secrets to mint tokens
#     for OTHER repos) while telling you nothing about whether it is itself a TARGET in the
#     installation. So a repo de-scoped from the App sailed through preflight green and died later at
#     the push, with a 403 inside somebody's unrelated dependency-bump PR — naming neither the App nor
#     the repo. Exactly the failure preflight exists to abolish.
#
# The `preflight` job below now asserts BOTH prerequisites in the RECEIVER's own context, on every
# call. Prerequisite 2 costs no token (Actions decides `!= ''` before the step runs); prerequisite 1
# costs one owner-scoped mint and one API call. The mint is OWNER-scoped on purpose — it succeeds
# whatever the repo selection is, so the token is not the assertion and a de-scoped repo gets an
# unambiguous "you are not in the list" instead of an ambiguous failed mint.
#
# Rendering, SDD, Governance and Templates are confirmed on prerequisite 2 (verified 2026-07-11 via
# the endpoint above); Rendering and Governance are additionally proven on 1 (they have actually
# pushed). A new adopter no longer needs to remember any of this: preflight tells it.
name: lockfile-sync

on:
  workflow_call:
    inputs:
      restore-target:
        description: >-
          Solution/project to restore (e.g. FS.GG.SDD.slnx). Leave empty to restore whatever
          `dotnet restore` resolves in the working directory (single solution/project only).
        type: string
        default: ""
      dotnet-version:
        description: "SDK to install — must match the caller's gate.yml (Feature 211 uses 10.0.x)."
        type: string
        default: "10.0.x"
      working-directory:
        description: "Directory to run the restore from, relative to the repo root."
        type: string
        default: "."
    secrets:
      app-id:
        description: "GitHub App id (org fs-gg-cross-repo-dispatch App; provisioned by .github#21)."
        required: true
      app-private-key:
        description: "GitHub App private key (PEM) for the same App."
        required: true

# The App installation token performs the git WRITE (contents:write on the repo). The run-scoped
# GITHUB_TOKEN stays read-only for git, but carries `packages: read` so it can authenticate the
# org NuGet feed for pure consumers (see the Regenerate step). A consuming caller must also grant
# `packages: read`, or the effective (intersected) token won't have it.
permissions:
  contents: read
  packages: read

jobs:
  # Can this repo actually AUTHENTICATE? (.github#482, epic #266 — "a gate that cannot fail on its
  # subject is not a gate".)
  #
  # Runs on EVERY call, deliberately UNGATED. `sync` only fires on renovate/* branches, so gating this
  # the same way would mean an unprovisioned repo learns it is unprovisioned at the worst possible
  # moment — inside a dependency-bump PR it did not open, from an opaque create-github-app-token
  # error. Running it on every call turns "is this repo provisioned?" into a continuously-checked
  # invariant that is answered on the FIRST PR after adoption, months before Renovate is onboarded.
  #
  # PREREQUISITE 2 costs no token at all: emptiness is decided by Actions' `!= ''` BEFORE the step
  # runs, so that leg needs neither the secret values nor a checkout nor an API call. PREREQUISITE 1
  # costs one owner-scoped App-token mint and one `GET /installation/repositories` (~2s, .github#522);
  # it runs only when prerequisite 2 HOLDS, because under a missing secret a failed mint says nothing
  # about the installation and would blame the App for a secrets gap.
  #
  # Either way the check lives HERE, in the receiver, rather than in a coherence gate in `.github` —
  # this repo's CI holds a GITHUB_TOKEN scoped to `.github` alone and literally cannot read
  # FS.GG.Game's secrets. Checking where the workflow already runs needs no new org grant.
  #
  # Severity is deliberately split, because blast radius matters: a repo that is unprovisioned but not
  # about to sync gets a WARNING (visible, non-blocking — it must not red an unrelated PR over a
  # latent problem), while one that is unprovisioned AND about to sync gets a hard ERROR (the run was
  # going to fail regardless; this only decides whether it fails legibly). Both name the repo, the
  # secret and the fix. Neither can be skipped into green: this job has no `if:`, and `sync` `needs:`
  # it — see tests/dispatch-preflight, which asserts exactly that.
  preflight:
    name: Preflight — dispatch App secrets resolve
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Assert the dispatch App secrets are visible to this repo
        id: secrets
        env:
          # BOOLEANS ONLY. The secret values are never put in the environment, never interpolated
          # into the script, and never printed — Actions evaluates `!= ''` before the step runs, so
          # all this job ever sees is the string "true" or "false". (The org's uniform anti-injection
          # pattern, and here it also means an unprovisioned repo leaks nothing by running the check.)
          HAS_APP_ID: ${{ secrets.app-id != '' }}
          HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
          # Is the PR head in THIS repo? On a fork it is not, and that changes what the emptiness of
          # the two booleans above MEANS — see the fork guard at the top of the script.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The same condition that gates `sync`. Duplicated ON PURPOSE: `sync`'s `if:` remains the
          # single ENFORCEMENT point — it is the security boundary (never auto-commit to a fork head)
          # and must stay readable in place, not hidden behind a job output. This copy only chooses
          # error-vs-warning, so the worst a drift could do is misgrade a message while `sync`'s own
          # `if:` still gates the push. tests/dispatch-preflight asserts the two stay identical.
          WOULD_SYNC: >-
            ${{ startsWith(github.event.pull_request.head.ref, 'renovate/') &&
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -eu

          # FORK HEADS ARE UNKNOWABLE, NOT UNPROVISIONED — and conflating the two would make this gate
          # a liar on its very first day.
          #
          # GitHub passes NO secrets but GITHUB_TOKEN to a workflow triggered by `pull_request` from a
          # fork. So on a fork PR both booleans above are `false` BY DESIGN, in every repo, including
          # the four that are demonstrably provisioned. Checking them here would annotate every fork PR
          # against FS.GG.Rendering — 4 green pushes to its name — with "is not provisioned ... it will
          # fail the first renovate/* PR that opens", and every clause of that would be false.
          #
          # This is NOT a fail-open. `sync` requires `head.repo.full_name == github.repository` (it
          # never auto-commits to an untrusted head), so on a fork head there is no push to gate and
          # nothing this job could protect. It reports what it knows — nothing — and says why.
          # `can_mint` tells the prerequisite-1 steps below whether minting is even POSSIBLE here. It is
          # false on a fork (no secrets by design) and false when the secrets are missing (already
          # reported, in this step, with the fix) — in both cases a mint would fail for a reason that is
          # not prerequisite 1, and reporting it as one would blame the App installation for a secrets
          # problem. Only when prerequisite 2 HOLDS is a failed mint evidence about prerequisite 1.
          if [ "$SAME_REPO" != 'true' ]; then
            echo "can_mint=false" >> "$GITHUB_OUTPUT"
            echo "not evaluated: this PR's head is not in $GITHUB_REPOSITORY (a fork)."
            echo
            echo "GitHub withholds secrets from workflows triggered from a fork, so the dispatch App"
            echo "secrets are empty here BY DESIGN and say nothing about whether this repo is"
            echo "provisioned. sync does not run on a fork head either, so there is nothing to gate."
            exit 0
          fi

          missing=''
          [ "$HAS_APP_ID" = 'true' ]  || missing="$missing FSGG_DISPATCH_APP_ID"
          [ "$HAS_APP_KEY" = 'true' ] || missing="$missing FSGG_DISPATCH_APP_PRIVATE_KEY"

          if [ -z "$missing" ]; then
            echo "can_mint=true" >> "$GITHUB_OUTPUT"
            echo "ok: the fs-gg-cross-repo-dispatch App secrets resolve in $GITHUB_REPOSITORY."
            exit 0
          fi

          echo "can_mint=false" >> "$GITHUB_OUTPUT"

          # `required: true` on a workflow_call secret means PROVIDED, not NON-EMPTY: a caller
          # forwarding a secret its repo cannot see passes the empty string and satisfies `required`.
          # This is the only place that difference is observable before it becomes a mystery failure.
          echo "$GITHUB_REPOSITORY cannot see:$missing"
          echo
          echo "The org Actions secret(s) above are not shared with this repository, so the caller"
          echo "forwarded an empty string. create-github-app-token will fail with an empty app-id."
          echo
          echo "FIX (org-admin, ~2 min — tracked by FS-GG/.github#468):"
          echo "  1. Org Settings -> Secrets and variables -> Actions: add $GITHUB_REPOSITORY to the"
          echo "     selected-repositories list for BOTH FSGG_DISPATCH_APP_ID and _PRIVATE_KEY."
          echo "  2. Add $GITHUB_REPOSITORY to the fs-gg-cross-repo-dispatch App installation with"
          echo "     contents: write, or the push will 403 even once the token mints."
          echo
          echo "VERIFY (needs only \`repo\` scope — NOT admin:org, despite what this was long assumed"
          echo "to require):"
          echo "  gh api repos/$GITHUB_REPOSITORY/actions/organization-secrets --jq .total_count"
          echo "  # want 2, not 0"

          summary="$GITHUB_REPOSITORY is not provisioned for lockfile-sync: cannot see$missing."
          fix="Add it to the secrets' selected-repositories list + the fs-gg-cross-repo-dispatch App installation (FS-GG/.github#468)."

          if [ "$WOULD_SYNC" = 'true' ]; then
            echo "::error title=lockfile-sync is not provisioned in this repo::$summary This renovate/* PR needs it NOW and the token step would have failed opaquely. $fix"
            exit 1
          fi

          echo "::warning title=lockfile-sync will fail on the next renovate/* PR::$summary It is not blocking THIS PR (sync only runs on renovate/* branches), but it will fail the first one that opens. $fix"
          exit 0

      # --- PREREQUISITE 1: is this repo actually IN the App installation? (.github#522) -------------
      #
      # The header used to assert this was "NOT statically checkable — enumerating an installation's
      # selected repos needs a token no CI job here holds". That is false, and the token is right
      # there: `secrets.app-private-key` is what mints one.
      #
      # The mint below is OWNER-scoped (`owner:`, and deliberately NO `repositories:`), which succeeds
      # regardless of which repos are selected — so the token itself is not the assertion. That matters:
      # a repo-scoped mint would simply FAIL for a de-scoped repo, and a failed mint is an ambiguous
      # signal (bad key? wrong app-id? clock skew?). An owner-scoped mint that then ENUMERATES the
      # installation gives an unambiguous, positive answer: the repo is in the list, or it is not.
      - name: Mint an owner-scoped token (succeeds whatever the repo selection is)
        id: install-token
        if: steps.secrets.outputs.can_mint == 'true'
        continue-on-error: true          # a failed mint is reported by the NEXT step, with a cause
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}
          owner: ${{ github.repository_owner }}

      - name: Assert this repo is in the fs-gg-cross-repo-dispatch App installation
        id: installation
        if: steps.secrets.outputs.can_mint == 'true'
        env:
          # Not a secret: an installation token, minted seconds ago, scoped to reading the installation.
          GH_TOKEN: ${{ steps.install-token.outputs.token }}
          WOULD_SYNC: >-
            ${{ startsWith(github.event.pull_request.head.ref, 'renovate/') &&
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -eu

          fix="Add $GITHUB_REPOSITORY to the fs-gg-cross-repo-dispatch App installation with contents: write (Org Settings -> GitHub Apps -> Configure -> Repository access)."

          # A mint that failed under a HOLDING prerequisite 2 is itself a finding — the secrets are
          # visible, so the key/app-id are the ones this org provisioned, and they still would not mint.
          # Do not swallow it: an empty token here would make the enumeration below fail with a 401 that
          # reads like a network blip.
          #
          # This is the step the `continue-on-error` on the mint hands control to, so it is where the
          # gate must NOT fail open. Same split-severity rule as everywhere else in this job: a
          # renovate/* PR needs the token NOW and would die at `sync`'s own mint, so RED it; an
          # unrelated PR gets a loud warning rather than a block it cannot act on. What must never
          # happen is a silent pass, which is what an unconditional `exit 0` here would be.
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "could not mint an owner-scoped App token, even though both secrets resolve."
            echo "That is not a prerequisite-1 answer — it means the App id / private key this org"
            echo "shared with $GITHUB_REPOSITORY do not mint against ${GITHUB_REPOSITORY%%/*}."
            summary="The App secrets resolve in $GITHUB_REPOSITORY but minting an owner-scoped token FAILED, so sync would die at its own token step. Check FSGG_DISPATCH_APP_ID / _PRIVATE_KEY against the fs-gg-cross-repo-dispatch App."
            if [ "$WOULD_SYNC" = 'true' ]; then
              echo "::error title=lockfile-sync: the dispatch App token would not mint::$summary This renovate/* PR needs it NOW."
              exit 1
            fi
            echo "::warning title=lockfile-sync: the dispatch App token would not mint::$summary Not blocking THIS PR, but the first renovate/* PR will fail."
            exit 0
          fi

          # THE CHECK. `GET /installation/repositories` enumerates exactly the repos the installation
          # selected — the list an org admin ticks. --paginate because `repository_selection: selected`
          # has no size guarantee, and a repo missing only because it sat on page 2 would be the same
          # fail-open one layer down.
          if ! repos="$(gh api /installation/repositories --paginate --jq '.repositories[].full_name' 2>&1)"; then
            echo "could not enumerate the App installation: $repos"
            echo "::warning title=lockfile-sync: could not verify the App installation::GET /installation/repositories failed in $GITHUB_REPOSITORY. This is a no-verdict, not a pass — prerequisite 1 is unchecked on this run."
            exit 0
          fi

          if printf '%s\n' "$repos" | grep -qxF "$GITHUB_REPOSITORY"; then
            echo "ok: $GITHUB_REPOSITORY is in the fs-gg-cross-repo-dispatch App installation."
            exit 0
          fi

          echo "$GITHUB_REPOSITORY is NOT in the fs-gg-cross-repo-dispatch App installation."
          echo
          echo "The installation currently selects:"
          printf '%s\n' "$repos" | sed 's/^/  /'
          echo
          echo "So the App secrets resolve (prerequisite 2 passed, above) but the App cannot push here:"
          echo "the token step will mint a token with no access to $GITHUB_REPOSITORY, and the push 403s."
          echo
          echo "FIX (org-admin, ~1 min):"
          echo "  $fix"

          summary="$GITHUB_REPOSITORY can see the App secrets but is NOT in the fs-gg-cross-repo-dispatch App installation, so a sync push would 403."

          # Same split-severity rule as prerequisite 2, and for the same reason: a repo that is not
          # about to sync must not have an unrelated PR redded over an adoption gap it can fix at
          # leisure — but a renovate/* PR needs this NOW and would otherwise die opaquely at the push.
          if [ "$WOULD_SYNC" = 'true' ]; then
            echo "::error title=lockfile-sync: this repo is not in the dispatch App installation::$summary This renovate/* PR needs it NOW. $fix"
            exit 1
          fi

          echo "::warning title=lockfile-sync will 403 on the next renovate/* PR::$summary It is not blocking THIS PR (sync only runs on renovate/* branches), but the first one that opens will 403 on the push. $fix"
          exit 0

  sync:
    name: Sync packages.lock.json
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The gate above must have passed. Without this, an unprovisioned repo would still reach the
    # token step and fail there — with the opaque error preflight exists to replace.
    needs: preflight
    # Renovate branches only, same-repo only (never fork PRs — a fork push would 403, and we
    # never want to auto-commit to an untrusted head). Evaluated in the caller's event context.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Mint App installation token (contents:write on this repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # --force-evaluate rewrites every packages.lock.json to match the bumped central graph.
      # RESTORE_TARGET is env-passed, never interpolated into the run script — the org's uniform
      # anti-injection pattern (cf. contract-coherence.yml / architecture-map.yml).
      #
      # Feed auth: a pure CONSUMER of an org-feed package (e.g. FS.GG.Governance consuming the
      # PUBLIC-but-token-gated FS.GG.Contracts) 401s on an anonymous restore, so the FS-GG
      # nuget.config credential placeholders (`%FSGG_PACKAGES_ACTOR%` / `%FSGG_PACKAGES_READ_TOKEN%`)
      # must be wired. Use the run-scoped GITHUB_TOKEN (packages:read) — NOT the App token: the App
      # installation token is scoped to this repo's install and 403s reading a package OWNED by
      # another repo (FS.GG.SDD), whereas GITHUB_TOKEN reads a public org package cross-repo (exactly
      # as the caller's gate.yml does). Harmless for repos that build the package from source or a
      # local feed (SDD / Rendering), whose nuget.config never references these vars.
      # THE REGENERATION MUST BE COLD, OR IT WRITES A HASH NO FRESH CLONE CAN RESTORE (#429).
      #
      # `--force-evaluate` does NOT hash the package it downloads. It copies `contentHash`
      # verbatim out of the INSTALLED package's `.nupkg.metadata`, which NuGet writes once, at
      # install time. So a package folder populated by an EARLIER, different restore carries that
      # restore's hash forever, and this workflow would commit it — leaving consumers with a lock
      # file no cold clone can restore, while the gate stays green against the same warm copy. The
      # generator and the enforcer would compare a record against a record and never contact a feed.
      # SDD's locked-restore action fixed the ENFORCEMENT half; this is the GENERATION half.
      #
      # CORRECTION (ADR-0032, #471): this comment used to say "populated BEFORE a package was
      # re-published". FSharp.Core 10.1.301 was NEVER re-published — the SDK bundles a DIFFERENT
      # .nupkg (…/sdk/10.0.301/FSharp/library-packs/, 3,051,664 B) than nuget.org serves
      # (3,066,660 B) at the same id+version, so the hash depends on WHICH SOURCE resolved it, not
      # on WHEN. Cold restores are still right — a warm folder is a genuine fail-open, and #460's
      # fixture proves it against a real restore — but COLD IS NOT HERMETIC: `library-packs` is an
      # MSBuild-injected local folder source that a fresh NUGET_PACKAGES does not bypass.
      #
      # THE SOURCE IS NOW MADE DETERMINISTIC — BUT NOT HERE (.github#473). ADR-0032 §2 is implemented
      # in the org-shared build config (dist/dotnet/Directory.Build.props →
      # DisableImplicitLibraryPacksFolder), which each repo picks up via sync-build-config.sh. That
      # placement is deliberate and this workflow MUST NOT second-guess it by passing
      # `-p:DisableImplicitLibraryPacksFolder=true` on the restore below:
      #
      #   This workflow GENERATES the lock; the caller's own gate.yml ENFORCES it, restoring with the
      #   caller's Directory.Build.props. Forcing the property here would decouple the two. In a repo
      #   that has not yet synced the shared config we would generate nuget.org's `excLf2zM…` and hand
      #   it to a CI that still resolves `library-packs` and expects `FwQFuqOA…` — failing locked
      #   restore on a CORRECT lock file. That is the exact fail-closed ADR-0032 §3 warns about, and
      #   what blocked #429's repair for a day. Generator and enforcer must read the SAME build config,
      #   so the property comes from the repo, and the sync + the re-pin land in ONE PR.
      #
      # THAT RULE OUTLIVES THE ROLLOUT, so do not "simplify" it away now that every repo has adopted
      # (#504). It is what keeps generator and enforcer reading one config; forcing the property here
      # would re-introduce the decoupling for the next repo that onboards before it syncs, and would
      # ALSO mask the regression the step below now fails on — this job would silently generate the
      # right hash for a repo whose own gate expects the wrong one.
      #
      # Which source actually served each package is asserted by the step after this one (ADR-0032 §4).
      # Since #504 that step is FAIL-CLOSED: every repo has synced, so a `library-packs` resolution is
      # a regression rather than a not-yet-adopted state.
      #
      # Verified by falsification (#429): plant a stale `contentHash` in a package's
      # `.nupkg.metadata` and `--force-evaluate` writes THAT hash into packages.lock.json;
      # restore into an empty NUGET_PACKAGES and it writes the hash the feed actually serves.
      # Neither the `.nupkg` bytes nor the `.nupkg.sha512` sidecar affect the value — do not
      # try to "fix" a lock file by pasting a package's published hash (that sidecar is the
      # catalog `packageHash`, a THIRD value, and committing it fails the gate too).
      #
      # NOTE: NUGET_PACKAGES relocates the global-packages folder but NOT the HTTP cache, which
      # will happily replay stale .nupkg bytes. Clearing it is load-bearing, not belt-and-braces.
      - name: Regenerate lockfiles (cold)
        working-directory: ${{ inputs.working-directory }}
        env:
          RESTORE_TARGET: ${{ inputs.restore-target }}
          FSGG_PACKAGES_ACTOR: ${{ github.actor }}
          FSGG_PACKAGES_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NUGET_PACKAGES="$(mktemp -d)"
          export NUGET_PACKAGES
          dotnet nuget locals http-cache --clear

          if [ -n "$RESTORE_TARGET" ]; then
            dotnet restore "$RESTORE_TARGET" --force-evaluate
          else
            dotnet restore --force-evaluate
          fi

          # Hand the (still cold) package folder to the source report below. Each installed package's
          # .nupkg.metadata records the source that served it — the one variable `contentHash` actually
          # depends on. Exported rather than re-derived so the report reads the SAME folder this restore
          # wrote; `mktemp -d` above stays exactly as it is (tests/lockfile-cold LEG 4 asserts it by name).
          echo "NUGET_PACKAGES=$NUGET_PACKAGES" >> "$GITHUB_ENV"

      # ADR-0032 §4: "say which source a hash came from". NU1403 is indistinguishable from a corrupt
      # local cache and invites the wrong repair (pasting in the .nupkg.sha512 sidecar, which fails
      # too) — so name the SOURCE, because that, not time, is the variable a contentHash depends on.
      #
      # FAIL-CLOSED SINCE #504. This step was ADVISORY for exactly as long as that was the honest
      # setting: while some repo had not yet synced the shared build config, a `library-packs`
      # resolution was CORRECT and self-consistent there (it generated FwQFuqOA… here and validated
      # FwQFuqOA… in its own gate), so failing it would have redded an unrelated dependency-bump PR
      # over an adoption that repo had not been asked to make — the same fail-closed-on-a-correct-lock
      # -file that blocked #429's repair for a day.
      #
      # That condition is now discharged. Every F# repo in the org (SDD, Rendering, Governance, Game,
      # Audio) carries DisableImplicitLibraryPacksFolder and commits nuget.org's excLf2zM…; Templates
      # has no packages at all (its lock is `"net10.0": {}`), so it resolves nothing and passes
      # trivially. There is no repo left for which resolving from the SDK's bundled folder is correct.
      # A library-packs resolution is therefore no longer a not-yet-adopted state to report — it is a
      # REGRESSION (the shared config was un-synced, or an SDK shipped a new injected source), and the
      # lock file this job is about to COMMIT would be machine-dependent. Reporting that and exiting 0
      # would push the bad lock anyway.
      - name: Report which source served each package (ADR-0032)
        working-directory: ${{ inputs.working-directory }}
        run: |
          # `-e` IS ON HERE WHETHER OR NOT THIS LINE SAYS SO. This step declares no `shell:`, so GitHub
          # runs it under its default `bash -e {0}`. This line used to read `set -uo pipefail` — errexit
          # deliberately omitted — and that omission did nothing except mislead every subsequent reader
          # about which options were actually in force. Name it, and let the one command whose failure is
          # EXPECTED say so at the point it happens (see the grep below). (#639)
          set -euo pipefail

          # NO EVIDENCE IS NOT A PASS. While this step merely reported, exiting 0 here was harmless.
          # Now that it GATES the commit below, an empty NUGET_PACKAGES means the one artifact this
          # check reads does not exist — so it cannot see its subject, and a check that cannot fail on
          # its subject is not a check (the fails-open class, epic #266). The restore step exports this
          # unconditionally, so an absence here means the restore step no longer works the way this one
          # assumes; that is a defect in the workflow, not a quiet green.
          if [ -z "${NUGET_PACKAGES:-}" ] || [ ! -d "${NUGET_PACKAGES:-}" ]; then
            echo "::error title=lockfile-sync: the ADR-0032 source check has no evidence to read::The restore step did not export a NUGET_PACKAGES folder, so this gate cannot tell which source served each package — and it must not pass without knowing. Check the 'Regenerate lockfiles (cold)' step above."
            exit 1
          fi

          echo "Packages by the source that served them:"
          find "$NUGET_PACKAGES" -name '.nupkg.metadata' -exec jq -r '.source // "unknown"' {} + \
            2>/dev/null | sort | uniq -c | sort -rn | sed 's/^/  /'
          echo

          # An SDK-bundled folder source (…/FSharp/library-packs) is the one that makes a lock file
          # machine-dependent: it ships a DIFFERENT .nupkg than nuget.org at the same id+version, and a
          # local folder source BEATS nuget.org when both are offered.
          #
          # NO MATCH IS THE PASS, AND `grep` REPORTS IT AS A FAILURE. `grep -l` exits 1 when nothing
          # matches — which here is the ADR-0032 invariant HOLDING. That "failure" is the success signal,
          # and with errexit on (it always was — see the `set` line) it killed the step outright, before
          # the `-z` test below could read the empty result it had just computed correctly. The `ok:`
          # branch was unreachable: a repo went red precisely for ADOPTING ADR-0032, and its Renovate and
          # lockfile PRs stopped landing behind it (#639).
          #
          # So READ the exit code instead of letting it kill us — all three of them:
          #     0  a library-packs resolution exists  -> the regression handled below
          #     1  no match                           -> THE PASS
          #   >=2  grep itself failed                 -> we cannot see our subject: FAIL CLOSED (#266)
          #
          # And this is why the `find … | xargs grep` that used to be here is GONE rather than patched.
          # `xargs` collapses grep's 1 (no match — the PASS) and its >=2 (grep could not READ) into one
          # 123, so the obvious repair — tolerate the 123 — would rest this step's entire verdict on an
          # exit code that means two opposite things. Be precise: that repair is not broken TODAY, because
          # a folder this step cannot read also breaks the `jq` inventory above and dies there. But that
          # is an accident of ORDERING, stated nowhere and asserted by nothing, and it evaporates the day
          # someone treats a step called "report" as cosmetic. A gate should not owe its fail-closed
          # property to an unrelated line that happens to run first. Read grep's own exit code, here.
          rc=0
          hits="$(grep -rlF --include='.nupkg.metadata' 'library-packs' "$NUGET_PACKAGES" 2>/dev/null)" || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "::error title=lockfile-sync: the ADR-0032 source check could not read its evidence::grep exited $rc while scanning \$NUGET_PACKAGES for library-packs resolutions. The gate cannot tell which source served each package, and it must not pass without knowing (FS-GG/.github#266)."
            exit 1
          fi

          served_by_sdk="$(
            printf '%s\n' "$hits" \
              | while IFS= read -r m; do
                  [ -n "$m" ] || continue
                  v="$(basename "$(dirname "$m")")"
                  p="$(basename "$(dirname "$(dirname "$m")")")"
                  printf '%s %s\n' "$p" "$v"
                done | sort
          )"

          if [ -z "$served_by_sdk" ]; then
            echo "ok: no package was served by an SDK-bundled folder source."
            echo "Every contentHash written above is a function of (id, version) alone, so this lock"
            echo "file regenerates byte-identically on any machine — the ADR-0032 invariant."
            exit 0
          fi

          echo "$served_by_sdk" | sed 's/^/  /'
          echo
          echo "The package(s) above were served by the SDK's bundled library-packs folder, NOT by a"
          echo "feed. Their contentHash is a function of the SDK PATCH LEVEL, so this lock file will not"
          echo "regenerate byte-identically on a machine with a different SDK — or on any machine whose"
          echo "NuGet config excludes that folder (a packageSourceMapping does). That is the ADR-0032"
          echo "defect: same id, same version, two different .nupkg files, two different hashes."
          echo
          echo "This is now a REGRESSION, not a not-yet-adopted state: every F# repo in the org carries"
          echo "DisableImplicitLibraryPacksFolder and commits nuget.org's hash (FS-GG/.github#504). This"
          echo "job was about to COMMIT the machine-dependent lock above, so it stops instead."
          echo
          echo "FIX (one PR, and the ORDER matters — ADR-0032 §3):"
          echo "  1. Re-sync the org-shared build config:  scripts/sync-build-config.sh <this repo>"
          echo "     dist/dotnet/Directory.Build.props sets DisableImplicitLibraryPacksFolder=true,"
          echo "     which REMOVES that source, so FSharp.Core resolves from nuget.org everywhere."
          echo "     Confirm it survived: grep -r DisableImplicitLibraryPacksFolder Directory.Build.props"
          echo "  2. Regenerate the lock IN THE SAME PR (cold):  dotnet restore --force-evaluate"
          echo "     Re-pinning ahead of the sync fails locked restore on a CORRECT lock file."

          echo "::error title=lock file is not machine-independent (ADR-0032)::$GITHUB_REPOSITORY resolved at least one package from the SDK's library-packs folder, so the lock file this job would have committed depends on the SDK patch level. Every F# repo has adopted DisableImplicitLibraryPacksFolder (FS-GG/.github#504), so this is a regression — most likely the shared build config was un-synced. Re-sync it and regenerate the lock in the SAME PR."
          exit 1

      - name: Commit and push if changed
        working-directory: ${{ inputs.working-directory }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*packages.lock.json')" ]; then
            echo "No lockfile drift — nothing to sync."
            exit 0
          fi
          # The App pushed this branch, so the App authors the commit. GitHub links a bot commit to its
          # account ONLY via `<BOT_USER_ID>+<slug>[bot]@users.noreply.github.com`, and BOT_USER_ID is the
          # id of the `[bot]` USER (`gh api users/fs-gg-cross-repo-dispatch%5Bbot%5D` -> 297630107), NOT
          # the App id. This used the App id, so every lockfile-sync commit has an UNLINKED author — and
          # because the App id is a secret, Actions masks it to `***` in the log, so the wrong value did
          # not even look wrong. #514 fixed the identical bug in skill-registry-autofix.yml and named
          # this file as still carrying it (.github#522). Literal, because no step output carries it.
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "297630107+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -- '*packages.lock.json'
          git commit -m 'chore: sync packages.lock.json (dotnet restore --force-evaluate)'
          git push
