# GS2-08.9 retirement boundary. This reusable route now checks the committed lock files in locked
# mode. Regeneration remains an explicit local repair; Actions receives no App secret and never pushes.
name: lockfile-sync (validation only)

on:
  workflow_call:
    inputs:
      restore-target:
        description: "Solution/project to restore; empty lets dotnet select the local project."
        type: string
        default: ""
      dotnet-version:
        description: "SDK to install."
        type: string
        default: "10.0.x"
      working-directory:
        description: "Restore directory relative to the repository root."
        type: string
        default: "."
    secrets:
      app-id:
        description: "Deprecated and unused; retained temporarily for caller compatibility."
        required: false
      app-private-key:
        description: "Deprecated and unused; retained temporarily for caller compatibility."
        required: false

permissions:
  contents: read
  packages: read

jobs:
  validate:
    name: Committed lockfile restore validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore against the committed lock files
        working-directory: ${{ inputs.working-directory }}
        env:
          RESTORE_TARGET: ${{ inputs.restore-target }}
          FSGG_PACKAGES_ACTOR: ${{ github.actor }}
          FSGG_PACKAGES_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -n "$RESTORE_TARGET" ]; then
            dotnet restore "$RESTORE_TARGET" --locked-mode
          else
            dotnet restore --locked-mode
          fi
          git diff --exit-code -- '**/packages.lock.json'
