# Reusable Renovate lockfile-sync (FS-GG/.github#145, epic #16 Pillar 4).
#
# The gap this closes is org-wide: every FS-GG consumer's gate.yml enforces
# `dotnet restore --locked-mode` against a committed packages.lock.json (Feature 211,
# FR-002 / board .github#7), but nothing REGENERATES those lockfiles when a dependency
# version moves. Renovate edits the central PackageVersion (Directory.Packages.local.props)
# without running restore, so every referenced-package Renovate NuGet PR fails the gate with
# NU1004 (`Lock file [old,) != central [new,)`) until a human runs --force-evaluate by hand.
# This job does that automatically and pushes the freshened lockfiles back to the PR branch —
# the .github#6 "auto-PR" half made real.
#
# FS.GG.Rendering proved this in FS.GG.Rendering#61 (merged 2026-07-03) as a repo-local
# workflow; this is that workflow promoted into the shared preset (alongside coherence.yml,
# contract-coherence.yml, dispatch-sender.yml) so SDD / Governance / Templates adopt it with a
# ~10-line `on: pull_request` caller and Rendering repoints its local copy here.
#
# Re-trigger mechanics (carried over from #61, already validated): the commit is authored with
# the org `fs-gg-cross-repo-dispatch` GitHub *App* installation token, NOT GITHUB_TOKEN.
# App-token pushes DO re-run `on: pull_request` workflows, so the caller's gate re-evaluates the
# freshened lockfile; GITHUB_TOKEN pushes would not. Self-limiting: the second pass finds no
# drift -> no commit -> no push, so there is no loop.
#
# Restore mirrors gate.yml: setup-dotnet + `dotnet restore --force-evaluate`. A repo that builds
# its org packages from source or a local feed (SDD / Rendering) needs no NuGet auth; a pure
# CONSUMER of a token-gated org-feed package (Governance → FS.GG.Contracts) 401s anonymously, so
# the FS-GG nuget.config credential placeholders are wired from the run-scoped GITHUB_TOKEN
# (packages:read) — see the Regenerate step. A consuming caller must also grant `packages: read`.
#
# PREREQUISITES per adopting repo (both org-admin, both fail visibly if missing):
#   1. The fs-gg-cross-repo-dispatch App (repository_selection: selected) must include the repo
#      with `contents: write` — else the push 403s.
#   2. The org Actions secrets FSGG_DISPATCH_APP_ID / _PRIVATE_KEY must be visible to the repo
#      (selected-repos list) — else `secrets.app-id` resolves empty and the token step fails.
#
# "Both fail visibly" was true only of the SYMPTOM, never of the CAUSE, and this header is where the
# gap started (.github#482, epic #266). It told adopters to "confirm before relying on this" without
# saying how, and asserted the check needed org-admin — so nobody ever ran it. Both claims were wrong:
#
#   * `required: true` on a workflow_call secret means PROVIDED, not NON-EMPTY. A caller forwarding
#     `${{ secrets.FSGG_DISPATCH_APP_ID }}` for a secret the repo cannot see passes the EMPTY STRING
#     and satisfies `required`. Nothing downstream noticed until create-github-app-token failed — deep
#     inside somebody's unrelated dependency-bump PR, naming neither the secret nor the App.
#   * Prerequisite 2 is READABLE WITHOUT `admin:org`:
#         GET /repos/{owner}/{repo}/actions/organization-secrets      (needs only `repo` scope)
#     It lists the org secrets shared with a repo, values not revealed. It was believed unverifiable,
#     so six adopters went unaudited and TWO of them were never provisioned at all: FS.GG.Game (live
#     — Renovate onboarded, so its next renovate/* PR fails) and FS.GG.Audio (inert — Renovate not yet
#     onboarded). Provisioning for both is .github#468.
#
# The `preflight` job below now asserts prerequisite 2 in the RECEIVER's own context, on every call.
# That is the only place with the credentials to see it: this repo's CI holds a GITHUB_TOKEN scoped to
# `.github` alone and CANNOT read another repo's secrets — an org-wide gate here would have needed a
# new org-provisioned PAT, i.e. the fix for the provisioning problem would itself have needed
# provisioning. Checking where the workflow already runs needs no token and no new grant at all.
#
# Prerequisite 1 (App installation) is NOT statically checkable — enumerating an installation's
# selected repos needs a token no CI job here holds. It fails at the token step or 403s on the push,
# and the two are provisioned in the same admin pass, so asserting 2 catches both real cases.
#
# Rendering, SDD, Governance and Templates are confirmed on prerequisite 2 (verified 2026-07-11 via
# the endpoint above); Rendering and Governance are additionally proven on 1 (they have actually
# pushed). A new adopter no longer needs to remember any of this: preflight tells it.
name: lockfile-sync

on:
  workflow_call:
    inputs:
      restore-target:
        description: >-
          Solution/project to restore (e.g. FS.GG.SDD.slnx). Leave empty to restore whatever
          `dotnet restore` resolves in the working directory (single solution/project only).
        type: string
        default: ""
      dotnet-version:
        description: "SDK to install — must match the caller's gate.yml (Feature 211 uses 10.0.x)."
        type: string
        default: "10.0.x"
      working-directory:
        description: "Directory to run the restore from, relative to the repo root."
        type: string
        default: "."
    secrets:
      app-id:
        description: "GitHub App id (org fs-gg-cross-repo-dispatch App; provisioned by .github#21)."
        required: true
      app-private-key:
        description: "GitHub App private key (PEM) for the same App."
        required: true

# The App installation token performs the git WRITE (contents:write on the repo). The run-scoped
# GITHUB_TOKEN stays read-only for git, but carries `packages: read` so it can authenticate the
# org NuGet feed for pure consumers (see the Regenerate step). A consuming caller must also grant
# `packages: read`, or the effective (intersected) token won't have it.
permissions:
  contents: read
  packages: read

jobs:
  # Can this repo actually AUTHENTICATE? (.github#482, epic #266 — "a gate that cannot fail on its
  # subject is not a gate".)
  #
  # Runs on EVERY call, deliberately UNGATED. `sync` only fires on renovate/* branches, so gating this
  # the same way would mean an unprovisioned repo learns it is unprovisioned at the worst possible
  # moment — inside a dependency-bump PR it did not open, from an opaque create-github-app-token
  # error. Running it on every call turns "is this repo provisioned?" into a continuously-checked
  # invariant that is answered on the FIRST PR after adoption, months before Renovate is onboarded.
  #
  # It costs one ~5s runner and no token: emptiness is decided by Actions' `!= ''` BEFORE the step
  # runs, so the job needs neither the secret values nor a checkout nor an API call. That is the whole
  # reason the check lives here rather than in a coherence gate in .github — this repo's CI holds a
  # GITHUB_TOKEN scoped to `.github` alone and literally cannot read FS.GG.Game's secrets.
  #
  # Severity is deliberately split, because blast radius matters: a repo that is unprovisioned but not
  # about to sync gets a WARNING (visible, non-blocking — it must not red an unrelated PR over a
  # latent problem), while one that is unprovisioned AND about to sync gets a hard ERROR (the run was
  # going to fail regardless; this only decides whether it fails legibly). Both name the repo, the
  # secret and the fix. Neither can be skipped into green: this job has no `if:`, and `sync` `needs:`
  # it — see tests/dispatch-preflight, which asserts exactly that.
  preflight:
    name: Preflight — dispatch App secrets resolve
    runs-on: ubuntu-latest
    steps:
      - name: Assert the dispatch App secrets are visible to this repo
        env:
          # BOOLEANS ONLY. The secret values are never put in the environment, never interpolated
          # into the script, and never printed — Actions evaluates `!= ''` before the step runs, so
          # all this job ever sees is the string "true" or "false". (The org's uniform anti-injection
          # pattern, and here it also means an unprovisioned repo leaks nothing by running the check.)
          HAS_APP_ID: ${{ secrets.app-id != '' }}
          HAS_APP_KEY: ${{ secrets.app-private-key != '' }}
          # Is the PR head in THIS repo? On a fork it is not, and that changes what the emptiness of
          # the two booleans above MEANS — see the fork guard at the top of the script.
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # The same condition that gates `sync`. Duplicated ON PURPOSE: `sync`'s `if:` remains the
          # single ENFORCEMENT point — it is the security boundary (never auto-commit to a fork head)
          # and must stay readable in place, not hidden behind a job output. This copy only chooses
          # error-vs-warning, so the worst a drift could do is misgrade a message while `sync`'s own
          # `if:` still gates the push. tests/dispatch-preflight asserts the two stay identical.
          WOULD_SYNC: >-
            ${{ startsWith(github.event.pull_request.head.ref, 'renovate/') &&
            github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          set -eu

          # FORK HEADS ARE UNKNOWABLE, NOT UNPROVISIONED — and conflating the two would make this gate
          # a liar on its very first day.
          #
          # GitHub passes NO secrets but GITHUB_TOKEN to a workflow triggered by `pull_request` from a
          # fork. So on a fork PR both booleans above are `false` BY DESIGN, in every repo, including
          # the four that are demonstrably provisioned. Checking them here would annotate every fork PR
          # against FS.GG.Rendering — 4 green pushes to its name — with "is not provisioned ... it will
          # fail the first renovate/* PR that opens", and every clause of that would be false.
          #
          # This is NOT a fail-open. `sync` requires `head.repo.full_name == github.repository` (it
          # never auto-commits to an untrusted head), so on a fork head there is no push to gate and
          # nothing this job could protect. It reports what it knows — nothing — and says why.
          if [ "$SAME_REPO" != 'true' ]; then
            echo "not evaluated: this PR's head is not in $GITHUB_REPOSITORY (a fork)."
            echo
            echo "GitHub withholds secrets from workflows triggered from a fork, so the dispatch App"
            echo "secrets are empty here BY DESIGN and say nothing about whether this repo is"
            echo "provisioned. sync does not run on a fork head either, so there is nothing to gate."
            exit 0
          fi

          missing=''
          [ "$HAS_APP_ID" = 'true' ]  || missing="$missing FSGG_DISPATCH_APP_ID"
          [ "$HAS_APP_KEY" = 'true' ] || missing="$missing FSGG_DISPATCH_APP_PRIVATE_KEY"

          if [ -z "$missing" ]; then
            echo "ok: the fs-gg-cross-repo-dispatch App secrets resolve in $GITHUB_REPOSITORY."
            exit 0
          fi

          # `required: true` on a workflow_call secret means PROVIDED, not NON-EMPTY: a caller
          # forwarding a secret its repo cannot see passes the empty string and satisfies `required`.
          # This is the only place that difference is observable before it becomes a mystery failure.
          echo "$GITHUB_REPOSITORY cannot see:$missing"
          echo
          echo "The org Actions secret(s) above are not shared with this repository, so the caller"
          echo "forwarded an empty string. create-github-app-token will fail with an empty app-id."
          echo
          echo "FIX (org-admin, ~2 min — tracked by FS-GG/.github#468):"
          echo "  1. Org Settings -> Secrets and variables -> Actions: add $GITHUB_REPOSITORY to the"
          echo "     selected-repositories list for BOTH FSGG_DISPATCH_APP_ID and _PRIVATE_KEY."
          echo "  2. Add $GITHUB_REPOSITORY to the fs-gg-cross-repo-dispatch App installation with"
          echo "     contents: write, or the push will 403 even once the token mints."
          echo
          echo "VERIFY (needs only \`repo\` scope — NOT admin:org, despite what this was long assumed"
          echo "to require):"
          echo "  gh api repos/$GITHUB_REPOSITORY/actions/organization-secrets --jq .total_count"
          echo "  # want 2, not 0"

          summary="$GITHUB_REPOSITORY is not provisioned for lockfile-sync: cannot see$missing."
          fix="Add it to the secrets' selected-repositories list + the fs-gg-cross-repo-dispatch App installation (FS-GG/.github#468)."

          if [ "$WOULD_SYNC" = 'true' ]; then
            echo "::error title=lockfile-sync is not provisioned in this repo::$summary This renovate/* PR needs it NOW and the token step would have failed opaquely. $fix"
            exit 1
          fi

          echo "::warning title=lockfile-sync will fail on the next renovate/* PR::$summary It is not blocking THIS PR (sync only runs on renovate/* branches), but it will fail the first one that opens. $fix"
          exit 0

  sync:
    name: Sync packages.lock.json
    runs-on: ubuntu-latest
    # The gate above must have passed. Without this, an unprovisioned repo would still reach the
    # token step and fail there — with the opaque error preflight exists to replace.
    needs: preflight
    # Renovate branches only, same-repo only (never fork PRs — a fork push would 403, and we
    # never want to auto-commit to an untrusted head). Evaluated in the caller's event context.
    if: >-
      startsWith(github.event.pull_request.head.ref, 'renovate/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Mint App installation token (contents:write on this repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Checkout PR branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # --force-evaluate rewrites every packages.lock.json to match the bumped central graph.
      # RESTORE_TARGET is env-passed, never interpolated into the run script — the org's uniform
      # anti-injection pattern (cf. contract-coherence.yml / architecture-map.yml).
      #
      # Feed auth: a pure CONSUMER of an org-feed package (e.g. FS.GG.Governance consuming the
      # PUBLIC-but-token-gated FS.GG.Contracts) 401s on an anonymous restore, so the FS-GG
      # nuget.config credential placeholders (`%FSGG_PACKAGES_ACTOR%` / `%FSGG_PACKAGES_READ_TOKEN%`)
      # must be wired. Use the run-scoped GITHUB_TOKEN (packages:read) — NOT the App token: the App
      # installation token is scoped to this repo's install and 403s reading a package OWNED by
      # another repo (FS.GG.SDD), whereas GITHUB_TOKEN reads a public org package cross-repo (exactly
      # as the caller's gate.yml does). Harmless for repos that build the package from source or a
      # local feed (SDD / Rendering), whose nuget.config never references these vars.
      # THE REGENERATION MUST BE COLD, OR IT WRITES A HASH NO FRESH CLONE CAN RESTORE (#429).
      #
      # `--force-evaluate` does NOT hash the package it downloads. It copies `contentHash`
      # verbatim out of the INSTALLED package's `.nupkg.metadata`, which NuGet writes once, at
      # install time. So a package folder populated by an EARLIER, different restore carries that
      # restore's hash forever, and this workflow would commit it — leaving consumers with a lock
      # file no cold clone can restore, while the gate stays green against the same warm copy. The
      # generator and the enforcer would compare a record against a record and never contact a feed.
      # SDD's locked-restore action fixed the ENFORCEMENT half; this is the GENERATION half.
      #
      # CORRECTION (ADR-0032, #471): this comment used to say "populated BEFORE a package was
      # re-published". FSharp.Core 10.1.301 was NEVER re-published — the SDK bundles a DIFFERENT
      # .nupkg (…/sdk/10.0.301/FSharp/library-packs/, 3,051,664 B) than nuget.org serves
      # (3,066,660 B) at the same id+version, so the hash depends on WHICH SOURCE resolved it, not
      # on WHEN. Cold restores are still right — a warm folder is a genuine fail-open, and #460's
      # fixture proves it against a real restore — but COLD IS NOT HERMETIC: `library-packs` is an
      # MSBuild-injected local folder source that a fresh NUGET_PACKAGES does not bypass. Making the
      # SOURCE deterministic is ADR-0032's decision, and it is not implemented here yet.
      #
      # Verified by falsification (#429): plant a stale `contentHash` in a package's
      # `.nupkg.metadata` and `--force-evaluate` writes THAT hash into packages.lock.json;
      # restore into an empty NUGET_PACKAGES and it writes the hash the feed actually serves.
      # Neither the `.nupkg` bytes nor the `.nupkg.sha512` sidecar affect the value — do not
      # try to "fix" a lock file by pasting a package's published hash (that sidecar is the
      # catalog `packageHash`, a THIRD value, and committing it fails the gate too).
      #
      # NOTE: NUGET_PACKAGES relocates the global-packages folder but NOT the HTTP cache, which
      # will happily replay stale .nupkg bytes. Clearing it is load-bearing, not belt-and-braces.
      - name: Regenerate lockfiles (cold)
        working-directory: ${{ inputs.working-directory }}
        env:
          RESTORE_TARGET: ${{ inputs.restore-target }}
          FSGG_PACKAGES_ACTOR: ${{ github.actor }}
          FSGG_PACKAGES_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          NUGET_PACKAGES="$(mktemp -d)"
          export NUGET_PACKAGES
          dotnet nuget locals http-cache --clear

          if [ -n "$RESTORE_TARGET" ]; then
            dotnet restore "$RESTORE_TARGET" --force-evaluate
          else
            dotnet restore --force-evaluate
          fi

      - name: Commit and push if changed
        working-directory: ${{ inputs.working-directory }}
        env:
          APP_ID: ${{ secrets.app-id }}
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- '*packages.lock.json')" ]; then
            echo "No lockfile drift — nothing to sync."
            exit 0
          fi
          git config user.name  'fsgg-dispatch[bot]'
          git config user.email "${APP_ID}+fsgg-dispatch[bot]@users.noreply.github.com"
          git add -- '*packages.lock.json'
          git commit -m 'chore: sync packages.lock.json (dotnet restore --force-evaluate)'
          git push
