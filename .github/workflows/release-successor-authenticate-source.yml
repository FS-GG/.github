name: release-successor-authenticate-source

# Ordinary source validation only; the selected protected authentication job
# remains unconditionally inactive in its separate workflow.
on:
  pull_request:
    paths:
      - '.github/workflows/release-successor-authenticate.yml'
      - '.github/workflows/release-successor-authenticate-source.yml'
      - '.github/actions/setup-policy-python/**'
      - 'scripts/check-release-successor-authenticate.py'
      - 'tests/release-successor-authenticate/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-successor-authenticate.yml'
      - '.github/workflows/release-successor-authenticate-source.yml'
      - '.github/actions/setup-policy-python/**'
      - 'scripts/check-release-successor-authenticate.py'
      - 'tests/release-successor-authenticate/**'

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: release-successor-authenticate-source-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  inert-source-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: ./.github/actions/setup-policy-python
      - name: Check inactive policy and rejection controls without native execution
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python3 scripts/check-release-successor-authenticate.py
          python3 tests/release-successor-authenticate/run.py
