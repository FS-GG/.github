# scheduled-engine-provisioning — a workflow that only a clock or a button can start must build the
# coordination engine before it runs it (Refs #4730, main health).
#
# `coord-board-archive` and `projects-audit` failed on every scheduled run from 2026-08-16 with
# `fsgg-coord: no fsgg-coord engine found` (exit 69): commit 77938c5a moved their reads onto the
# typed engine and gave neither a build step. A workflow with a pull_request or push trigger fails
# that omission on the PR that introduces it; one with only `schedule` / `workflow_dispatch` is merged
# green and stays red for months. This gate reads the tree and refuses exactly that shape.
#
# STATIC, like timeout-coherence: it examines only workflows and scripts in this repository, so
# `paths:` sees every change that could falsify it and a nightly re-run would prove nothing.
name: scheduled-engine-provisioning

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/scheduled-engine-provisioning/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/scheduled-engine-provisioning/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-engine-provisioning-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline, and first: prove the gate can still say NO before believing it when it says yes.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run the scheduled-engine-provisioning fixture (no network)
        run: bash tests/scheduled-engine-provisioning/run.sh

  provisioned:
    runs-on: ubuntu-latest
    needs: fixture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python

      - name: Assert every schedule-only job that runs the engine builds it first
        id: check
        run: |
          rc=0
          out="$(python scripts/check-scheduled-engine-provisioning.py --root . 2>&1)" || rc=$?
          [ -z "$out" ] || printf '%s\n' "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: 'OK: every engine-running schedule-only job builds the engine'
        if: ${{ !cancelled() && steps.check.outputs.rc == '0' }}
        run: |
          echo "scheduled-engine-provisioning: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 'FINDING: a schedule-only job runs the engine without building it'
        if: ${{ !cancelled() && steps.check.outputs.rc == '1' }}
        run: |
          {
            echo "### scheduled-engine-provisioning: a job runs the engine without building it"
            echo
            echo "A workflow with no pull_request or push trigger runs \`scripts/fsgg-coord\` (directly or"
            echo "through a script) with no earlier step that builds the engine. On a hosted runner that"
            echo "exits 69 (\`no fsgg-coord engine found\`) on every scheduled run. The log names the file,"
            echo "job and step. Add \`actions/setup-dotnet\` and a \`dotnet build\` of"
            echo "\`src/FS.GG.Coord.Cli\` before it, as \`repos-audit.yml\` does."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=scheduled-engine-provisioning: engine not built::A schedule-only job runs the coordination engine without building it. See the job log."
          exit 1

      - name: 'NO VERDICT (permanent): a file a human must fix'
        if: ${{ !cancelled() && steps.check.outputs.rc == '3' }}
        run: |
          echo "::error title=scheduled-engine-provisioning: no verdict::A workflow would not parse or the audit examined nothing. See the job log."
          exit 1

      - name: 'INCONCLUSIVE: the gate produced no exit code this workflow understands'
        if: ${{ !cancelled() && !contains(fromJSON('["0","1","3"]'), steps.check.outputs.rc) }}
        run: |
          echo "::error title=scheduled-engine-provisioning: inconclusive::check-scheduled-engine-provisioning.py exited ${{ steps.check.outputs.rc }}, which this workflow does not classify."
          exit 1
