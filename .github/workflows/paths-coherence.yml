# paths-coherence — a workflow's two `paths:` copies must agree.
#
# .github#880, epic #266 (gates that fail open). Nearly every workflow here duplicates its `paths:`
# list verbatim between `pull_request` and `push`. Nothing read both copies, so when one was edited
# and the other was not, the gate kept passing its own tests and simply stopped running on `main`.
# Green, and wrong.
#
# Two had already drifted when this gate landed: `adr-coherence.yml` (the push copy omitted
# `tests/adr-coherence/**` and its own workflow file) and `skill-registry-coherence.yml` (omitted
# `tests/skill-registry/**`). Both are repaired in the same change that adds this gate — a gate
# landing red is a gate people learn to ignore.
#
# It is the FIFTH instance of the class (#332, #334, #508, and those two). Each earlier one was
# repaired by hand, one workflow wide, because there was no gate on the gates' own triggers — so the
# class regenerated faster than it was repaired. pnext-item §4: if a fix keeps regenerating the same
# finding, the finding is not the bug; the thing that regenerates it is.
#
# No `schedule:`, for the same reason as recipe-pagination: this gate's subject is entirely this
# repo's own tree, so nothing can stale it between pushes. A nightly run would burn minutes
# re-proving a pure function of files that did not change.
#
# This workflow's own `paths:` copies are identical, and this gate audits itself — the first thing it
# would catch is its own drift.
name: paths-coherence

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "scripts/check-paths-coherence.py"
      - "tests/paths-coherence/**"
      # The PROJECT GRAPH is an input to rule (b) as surely as the workflows are (#930): a
      # `ProjectReference` added here changes which filters are complete, so a PR that adds one
      # and no more must re-run this gate. Omitting these is sub-class (b) of the very class the
      # gate now checks — the filter and its copy agreeing perfectly about the wrong set.
      # Kept in step with PROJECT_GLOBS in the gate.
      - "**/*.fsproj"
      - "**/*.csproj"
      - "**/*.vbproj"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/check-paths-coherence.py"
      - "tests/paths-coherence/**"
      # The PROJECT GRAPH is an input to rule (b) as surely as the workflows are (#930): a
      # `ProjectReference` added here changes which filters are complete, so a PR that adds one
      # and no more must re-run this gate. Omitting these is sub-class (b) of the very class the
      # gate now checks — the filter and its copy agreeing perfectly about the wrong set.
      # Kept in step with PROJECT_GLOBS in the gate.
      - "**/*.fsproj"
      - "**/*.csproj"
      - "**/*.vbproj"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: paths-coherence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline, and first: prove the gate can still say NO before believing it when it says yes. The
  # fixture's last leg runs the gate against this working tree's real workflows, so a fixture that
  # passes on synthetic YAML while the shipped workflows drift is not a state this job can reach.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run the paths-coherence fixture (no network)
        run: bash tests/paths-coherence/run.sh

  coherent:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: fixture
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Assert every workflow's pull_request/push paths agree
        id: check
        run: |
          rc=0
          out="$(python scripts/check-paths-coherence.py --root . 2>&1)" || rc=$?
          [ -z "$out" ] || printf '%s\n' "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # One named step per exit code: "I could not check" must never be mistaken for "I checked, and
      # it's fine" (#266). The exit code is the contract; nothing here greps the gate's prose.
      #
      # There is deliberately no rc=2 ("no verdict, retryable") step: this gate is pure and offline —
      # it reads files, makes no network call, and has no condition a re-run could resolve. An rc=2
      # would mean the gate grew a failure mode nobody classified, and it lands in the INCONCLUSIVE
      # step below, which fails. That is intended, not a gap.
      - name: 'OK: every workflow''s paths copies agree'
        if: ${{ !cancelled() && steps.check.outputs.rc == '0' }}
        run: |
          echo "paths-coherence: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 'FINDING: a workflow''s paths copies have drifted'
        if: ${{ !cancelled() && steps.check.outputs.rc == '1' }}
        run: |
          {
            echo "### paths-coherence: a workflow's \`paths:\` copies disagree"
            echo
            echo 'A workflow duplicates its `paths:` list between `pull_request` and `push`. When the'
            echo "copies drift, the gate still passes its own tests and simply **stops running on**"
            echo '`main` — it goes green because it never ran. See the log for the workflow and the'
            echo "exact patterns one copy omits."
            echo
            echo '**Fix:** make the two lists identical. Diverging on purpose? Say so, and sign it:'
            echo '`# paths-coherence: allow-divergence — <why>`'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=paths-coherence: a workflow's paths copies have drifted::One trigger's paths list omits patterns the other declares; the gate will not run on main. See the job log."
          exit 1

      - name: 'NO VERDICT (permanent): a workflow could not be read, or NOTHING was audited'
        if: ${{ !cancelled() && steps.check.outputs.rc == '3' }}
        run: |
          {
            echo "### paths-coherence: no verdict"
            echo
            echo "A workflow would not parse, declared a filter shape this gate cannot compare"
            echo '(`paths-ignore:`, or a negated `!` pattern, both of which make set-equality unsound),'
            echo "or the audit found **zero** workflows declaring both filters. This repo has ~30, so"
            echo "zero means the trigger reader is broken — and examining nothing is a failure to"
            echo "audit, not a clean audit (#266). Retrying will not help; fix the reader or the file."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=paths-coherence: no verdict (permanent)::The gate could not run against a valid subject, or audited nothing. See the job log."
          exit 1

      - name: 'INCONCLUSIVE: the gate produced no exit code this workflow understands'
        if: ${{ !cancelled() && !contains(fromJSON('["0","1","3"]'), steps.check.outputs.rc) }}
        run: |
          echo "::error title=paths-coherence: inconclusive::check-paths-coherence.py exited ${{ steps.check.outputs.rc }}, which this workflow does not classify. Treating as a failure."
          exit 1
