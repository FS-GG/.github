# kit-bump-shape — is an FS.GG.Kit bump PR the mechanical, automergeable shape?
#
# .github#1693, a premise correction for #1587. #1587 makes automerge safe by proving the class of
# change per-PR instead of trusting the author: a bump may touch only the pin and what the
# materializer produces. It measured that class against a world that ended when 0.14.0 retired
# `.codex/skills` (#1636) and 0.15.0 added a view-root disposition (#1696) — after which every
# receiver's bump carries DELETIONS under roots that are not in `FsggKitSkillRoots`, and a guard
# reading only that property refuses the one bump that carries the retirement, on all seven.
#
# THIS WORKFLOW IS THE RULE'S OWN FIXTURE, NOT THE RECEIVER-SIDE CHECK. The verdict belongs on a
# receiver's bump PR, where the diff and the restored target package both exist. THE PRODUCER THAT
# PUTS IT THERE NOW EXISTS (#1713): the `bump-shape` job in `.github/workflows/kit-materialize.yml`,
# which all seven receivers already call, reporting the context `materialize / kit-bump-shape`.
#
# THAT CONTEXT IS REQUIRED IN NO REPOSITORY, DELIBERATELY. #1587's automerge was re-scoped on
# 2026-07-28 — the producer keeps its priority as a defect and automerge is re-decided once the
# producer has run over real fan-outs — so what ships is a REPORTER, and arming it is a later,
# separate decision (#1712 AC2 is discharged by that change, not by this one). What this repo can
# prove, offline and with no credential, is that the rule admits the measured shape, REFUSES a
# contaminated one, and separates the third class (#1726) from both. That is what runs below.
#
# AND IT PROVES IT FOR ALL SEVEN RECEIVERS, NOT THE ONE THE ITEM WAS FILED FROM (#1726 AC 5). The
# fixture judges a bump under each receiver's OWN declaration — its pin location, its build-config
# disposition, and the live/view/retired roots it evaluates — because the ground moved under this rule
# without the rule changing: ADR-0067 §9 phase 4 turned `.agents/skills` from a LIVE root into a VIEW
# root on every receiver, so an arm that no tree could reach became the arm every tree evaluates.
# The roster and the kit's row set are DERIVED there rather than restated, which is why this filter
# now names `registry/repos.yml` and `scripts/sync-build-config.sh` below.
#
# No `schedule:`: the subject is entirely in this tree, so nothing can stale it between pushes.
name: kit-bump-shape

on:
  pull_request:
    paths:
      - "scripts/check-kit-bump-shape.py"
      - "tests/kit-bump-shape/**"
      - ".github/workflows/kit-bump-shape.yml"
      # The RECEIVER-SIDE PRODUCER (#1713) lives in kit-materialize.yml, and two of the legs below
      # read that file: the context name it publishes, and the fact that its job carries no `if:`.
      # Without this entry a rename or a gate on that job would land with this fixture never running.
      - ".github/workflows/kit-materialize.yml"
      - "src/FS.GG.Kit/build/**"
      # #1726 AC 5's fleet legs DERIVE the receiver roster and the kit's row set rather than restating
      # them, so these two files are inputs to the fixture's answer in the same way `build/**` is.
      # The roster half is the one that bites: an EIGHTH `receives: coordination-kit` repo, or a
      # receiver leaving the fabric, reds the both-ways cross-check between the derived roster and the
      # measured pin table — correctly, because nothing has measured where the newcomer pins. Without
      # these entries that red lands on `main` unseen and then appears on the next unrelated pull
      # request that happens to touch this rule, which is the false accusation this org refuses
      # (#238). The `receives:` rows are also where `FsggKitMaterializeBuildConfig` is read from, and
      # `sync-build-config.sh`'s FILES set is where the build-config destinations come from — the two
      # facts the audio/net pin-ground legs stand on.
      - "registry/repos.yml"
      - "scripts/sync-build-config.sh"
  push:
    branches: [main]
    paths:
      - "scripts/check-kit-bump-shape.py"
      - "tests/kit-bump-shape/**"
      - ".github/workflows/kit-bump-shape.yml"
      # The RECEIVER-SIDE PRODUCER (#1713) lives in kit-materialize.yml, and two of the legs below
      # read that file: the context name it publishes, and the fact that its job carries no `if:`.
      # Without this entry a rename or a gate on that job would land with this fixture never running.
      - ".github/workflows/kit-materialize.yml"
      - "src/FS.GG.Kit/build/**"
      # #1726 AC 5's fleet legs DERIVE the receiver roster and the kit's row set rather than restating
      # them, so these two files are inputs to the fixture's answer in the same way `build/**` is.
      # The roster half is the one that bites: an EIGHTH `receives: coordination-kit` repo, or a
      # receiver leaving the fabric, reds the both-ways cross-check between the derived roster and the
      # measured pin table — correctly, because nothing has measured where the newcomer pins. Without
      # these entries that red lands on `main` unseen and then appears on the next unrelated pull
      # request that happens to touch this rule, which is the false accusation this org refuses
      # (#238). The `receives:` rows are also where `FsggKitMaterializeBuildConfig` is read from, and
      # `sync-build-config.sh`'s FILES set is where the build-config destinations come from — the two
      # facts the audio/net pin-ground legs stand on.
      - "registry/repos.yml"
      - "scripts/sync-build-config.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-bump-shape-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # `src/FS.GG.Kit/build/**` is in the filter because the admissible class is a DERIVATION of what
  # `FS.GG.Kit.targets` does — the managed-skill-directory sweep, the retired-root sweep, and the
  # view-root sweep. A change to the materializer that adds a fourth thing it can write or remove
  # makes this gate's answer wrong without touching either file it lives in, so it re-runs here.
  fixture:
    name: Prove the shape rule admits the measured bump and refuses a contaminated one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # No pip install and no dotnet: the gate is stdlib-only and its three inputs are files. A
      # guard that needed a restore to decide a diff's shape would be a guard that fails open on a
      # runner with no network.
      - name: Run the kit-bump-shape fixture (no network, no dotnet)
        run: bash tests/kit-bump-shape/run.sh
