name: release-saga-prepare

# Preparation is intentionally separate from publishing. It packs every coherent-set member once,
# validates those exact archives against both feeds' constraints, and places the immutable inputs in
# a draft release. The three package-owning workflows retain their existing Trusted Publishing
# identities and consume these bytes.
#
# WHO STARTS PUBLISHING — BOTH ANSWERS, BECAUSE ASSUMING ONE COST A WHOLE RELEASE (.github#2654).
# Publishing starts when all three tags — `kit/v<version>`, `drivers/v<version>`,
# `coord-engine/v<version>` — exist at one commit. TWO actors push them:
#
#   * an OPERATOR, via `workflow_dispatch` here followed by the `git push` this workflow's own step
#     summary prints; and
#   * `.github/workflows/kit-auto-publish.yml`, automatically, with no operator involved, on any
#     merge whose `<Version>` is the next patch above both feed frontiers (.github#2442).
#
# This header used to state only the first, in the words "Publishing starts only when an operator
# pushes all three tags." That sentence was already false when it was written: `kit-auto-publish`
# has pushed the trio unattended since .github#2495. Nothing joined the two rails, so the FIRST
# patch line to fire after the saga landed — `0.58.1` at `a415652f` — tagged three namespaces and
# published nothing: all three release workflows died on
# `gh release download "coherent-set/v0.58.1" ... release not found`, because the release this
# workflow creates had never been prepared. The join is the `workflow_call` trigger below:
# `kit-auto-publish` now CALLS this workflow and pushes its tags only if that call succeeded, so the
# bytes always exist before the tags that start consuming them.
#
# Preparation itself publishes nothing and is reversible: it creates a DRAFT release. The
# irreversible edge is still, and only, the tag push.
on:
  workflow_dispatch:
  # Called by kit-auto-publish.yml before it pushes the coherent-set tags. Do NOT remove this
  # trigger without also removing that call: the caller's tag job `needs:` the calling job, so
  # losing this trigger fails the run rather than silently tagging without bytes — but the failure
  # would be a broken workflow reference rather than the fail-closed refusal it should be.
  workflow_call:
    inputs:
      source-sha:
        description: >-
          The exact commit to pack, preflight and bind the manifest to. Every published version must
          name the immutable commit its coherent-set tags name (.github#1772, .github#2409 DEC-004),
          and `release-saga-ci.sh init` asserts the manifest's `sourceSha` equals the tag's commit —
          so this is not the caller's head by default. On kit-auto-publish's `tagSiblings` repair
          path the two genuinely differ: the existing `kit/v<version>` tag names a commit `main` may
          have moved past, and packing at the caller's head would produce a manifest every release
          workflow then refuses. Empty falls back to `github.sha`, which is what the operator
          `workflow_dispatch` path wants.
        type: string
        required: false
        default: ""

permissions:
  contents: write
  packages: read

# The one commit this whole run is bound to. Read once, here, so no step can silently reach for
# `$GITHUB_SHA` again: under `workflow_call`, `github.sha` is the CALLER's head, which is not
# necessarily the commit whose tags will consume these bytes.
env:
  FSGG_SOURCE_SHA: ${{ inputs.source-sha != '' && inputs.source-sha || github.sha }}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # `actions/checkout` does not move `$GITHUB_SHA`; it only moves the working tree. Both
          # halves matter — the tree decides what is packed, `FSGG_SOURCE_SHA` decides what the
          # manifest and the draft release are bound to — so they are set from one expression.
          ref: ${{ inputs.source-sha != '' && inputs.source-sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Resolve authoritative stable predecessor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          predecessor_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[] | select(.tagName | startswith("coherent-set/v"))][0].tagName // ""')"
          [ -n "$predecessor_tag" ] \
            || { echo "::error::no published coherent-set stable-channel receipt exists"; exit 1; }
          mkdir -p artifacts/predecessor
          gh release download "$predecessor_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern stable-channel.json --dir artifacts/predecessor
          predecessor_source="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$predecessor_tag" "refs/tags/$predecessor_tag^{}" \
            | awk -v p="refs/tags/$predecessor_tag^{}" -v b="refs/tags/$predecessor_tag" \
                '$2==p {peeled=$1} $2==b {plain=$1} END {print (length(peeled) ? peeled : plain)}')"
          [ -n "$predecessor_source" ] \
            || { echo "::error::cannot resolve source for $predecessor_tag"; exit 1; }
          python3 scripts/release-saga.py predecessor \
            --channel artifacts/predecessor/stable-channel.json \
            --release-tag "$predecessor_tag" --tag-source "$predecessor_source" \
            > artifacts/predecessor/identity.json
      - name: Resolve stable coherent-set version
        id: version
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj -getProperty:Version | tr -d '[:space:]')"
          case "$version" in ''|*-*) echo "::error::a non-empty stable version is required"; exit 1;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and test release source
        run: |
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet test tests/FS.GG.Coord.Core.Tests/FS.GG.Coord.Core.Tests.fsproj -c Release
          dotnet test tests/FS.GG.Coord.Cli.Tests/FS.GG.Coord.Cli.Tests.fsproj -c Release
          dotnet test tests/FS.GG.Coord.Cli.Lifecycle.Tests/FS.GG.Coord.Cli.Lifecycle.Tests.fsproj -c Release
      - name: Pack coherent set exactly once
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          dotnet pack src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj -c Release --no-restore -o artifacts/packages
          dotnet pack src/FS.GG.Kit/FS.GG.Kit.csproj -c Release -o artifacts/packages
          dotnet pack src/FS.GG.Drivers/FS.GG.Drivers.csproj -c Release -o artifacts/packages
      - name: Create and preflight durable release manifest
        run: |
          set -euo pipefail
          python3 scripts/release-saga.py prepare \
            --release-id "github:${{ steps.version.outputs.version }}" \
            --version "${{ steps.version.outputs.version }}" --source-sha "$FSGG_SOURCE_SHA" \
            --policy-version release-saga/1 \
            --previous-channel artifacts/predecessor/stable-channel.json --artifact-dir artifacts/packages \
            --expected-package FS.GG.Coord.Cli --expected-package FS.GG.Kit \
            --expected-package FS.GG.Drivers --output artifacts/packages/release-manifest.json
          python3 scripts/release-saga.py preflight --manifest artifacts/packages/release-manifest.json --feed both
      - name: Revalidate predecessor before draft mutation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current_tag="$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
            --json tagName --jq '[.[] | select(.tagName | startswith("coherent-set/v"))][0].tagName // ""')"
          [ -n "$current_tag" ] \
            || { echo "::error::the promoted coherent-set predecessor became unreadable"; exit 1; }
          current_dir="$(mktemp -d)"
          trap 'rm -rf "$current_dir"' EXIT
          gh release download "$current_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern stable-channel.json --dir "$current_dir"
          current_source="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
            "refs/tags/$current_tag" "refs/tags/$current_tag^{}" \
            | awk -v p="refs/tags/$current_tag^{}" -v b="refs/tags/$current_tag" \
                '$2==p {peeled=$1} $2==b {plain=$1} END {print (length(peeled) ? peeled : plain)}')"
          [ -n "$current_source" ] \
            || { echo "::error::cannot re-resolve source for $current_tag"; exit 1; }
          python3 scripts/release-saga.py predecessor --channel "$current_dir/stable-channel.json" \
            --release-tag "$current_tag" --tag-source "$current_source" > "$current_dir/identity.json"
          cmp artifacts/predecessor/identity.json "$current_dir/identity.json" \
            || { echo "::error::stable predecessor moved during preparation; discard these packed bytes and retry"; exit 1; }
      - name: Create immutable draft release inputs
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="coherent-set/v$VERSION"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # A draft already exists, so an earlier run of this workflow got this far and something
            # after it did not — a rejected tag push, a failed App-token mint, a runner fault. Resume
            # against the STORED bytes: they are what the three release workflows download, and once
            # the release is published they are immutable.
            #
            # THIS COMPARISON MAY NOT BE OVER RAW BYTES OR `contentId` (.github#2664). `dotnet pack`
            # mints a fresh core-properties part per invocation (.github#2240), so a re-pack of an
            # identical tree yields different archive bytes, a different `artifact.size`, and
            # therefore a different `contentId` — every time, by construction. This branch used to
            # assert exactly that, so it could only ever fail, and under `set -e` it failed the job.
            # Harmless while preparation was `workflow_dispatch`-only; not harmless since
            # `kit-auto-publish` began calling this workflow on its hourly `schedule`, where a draft
            # left behind by one partial run reddened every subsequent run until a human deleted it.
            # `assert-reusable` compares descriptor identity and the PAYLOAD of both archive sets —
            # the archive with the core-properties part, and the `_rels/.rels` relationship naming
            # it, normalized out — and names the archive entries that genuinely differ when they do.
            #
            # THAT IS NOT "STABLE ACROSS RE-PACKS", AND THIS COMMENT MUST NOT CLAIM IT IS. The
            # normalization removes the instability that was GUARANTEED on every re-pack. A residual
            # one remains (.github#2688), in the packed CONTENT rather than in the OPC envelope, and
            # only in `FS.GG.Coord.Cli`: the F# compiler emits ten closure classes named `contains@1` and
            # disambiguates them with a numeric suffix, and which class wins which suffix can change
            # between compiles of one unchanged tree. Two `-1`/`-2` swaps in the `#Strings` heap are
            # the whole payload — 22 bytes over a 1,079,296-byte assembly — and the MVID and PE
            # TimeDateStamp then follow, because a deterministic build derives them from content.
            #
            # IT IS RARE, AND ABSENCE IS NOT STABILITY. Independent review of .github#2664 measured
            # two distinct payloads across three clean builds; five further clean builds produced one.
            # `FS.GG.Kit` and `FS.GG.Drivers` did not reproduce it at all. A green re-prepare is
            # therefore no evidence that the next one is green.
            #
            # So this branch can still refuse, INTERMITTENTLY, naming
            # `tools/net10.0/any/fsgg-coord-engine.dll`. That is a true statement about the bytes,
            # diagnosed by name — not the .github#2664 wedge, which asserted a difference that could
            # never be absent and so could never pass. Removing the residual refusal means build
            # determinism for that one project, or a reuse policy that tolerates it: a different root
            # cause, outside .github#2664's declared paths, tracked at .github#2688 against
            # `src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj`. Until that lands, an operator who hits the
            # intermittent refusal should read the named entry as REAL and check it there, not
            # re-run this workflow hoping for a different sample.
            mkdir -p /tmp/prior
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir /tmp/prior
            python3 scripts/release-saga.py assert-reusable \
              --stored /tmp/prior/release-manifest.json \
              --candidate artifacts/packages/release-manifest.json
            # The stored manifest and archives — not this run's throwaway re-pack — are what the tags
            # will consume, so make them this run's outputs too. Otherwise the uploaded artifact and
            # the draft would name different `contentId`s for one release, which is the confusion
            # this branch exists to prevent.
            cp /tmp/prior/release-manifest.json /tmp/prior/*.nupkg artifacts/packages/
            echo "Existing draft already holds an equivalent coherent set; no asset was replaced."
          else
            gh release create "$tag" --repo "$GITHUB_REPOSITORY" --target "$FSGG_SOURCE_SHA" --draft \
              --title "FS.GG coherent set $VERSION (publishing)" \
              --notes "Prepared content-addressed release. This remains draft until both feeds serve all three manifest-bound artifacts."
            gh release upload "$tag" --repo "$GITHUB_REPOSITORY" artifacts/packages/*.nupkg artifacts/packages/release-manifest.json
          fi
          # Printed for the OPERATOR path. When kit-auto-publish called this workflow it pushes the
          # same three refs at the same commit itself, in one `--atomic` push, as its next job.
          {
            echo 'Preparation complete. To start the irreversible phase, push these three refs together:'
            echo "git tag kit/v$VERSION $FSGG_SOURCE_SHA"
            echo "git tag drivers/v$VERSION $FSGG_SOURCE_SHA"
            echo "git tag coord-engine/v$VERSION $FSGG_SOURCE_SHA"
            echo "git push origin kit/v$VERSION drivers/v$VERSION coord-engine/v$VERSION"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: coherent-set-${{ steps.version.outputs.version }}
          path: artifacts/packages/
          if-no-files-found: error
          retention-days: 90
