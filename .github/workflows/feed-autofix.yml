# GS2-08.9 retirement boundary. Detection and the offline mutation fixture remain; the scheduled
# route has no App credential and cannot edit the registry, push, open a PR, or create an issue.
name: feed-autofix (audit only)

on:
  schedule:
    - cron: "47 6 * * *"
  repository_dispatch:
    types: [fs-gg-ui-template-released]
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/feed-autofix"
      - "scripts/fsgg_feed.py"
      - "scripts/registry_packages.py"
      - "tests/feed-autofix/**"
      - ".github/workflows/feed-autofix.yml"

permissions:
  contents: read
  packages: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run offline refusal and reconciliation fixtures
        run: bash tests/feed-autofix/run.sh

  audit:
    if: github.event_name != 'pull_request'
    needs: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Inspect the live feed without changing the checkout or provider
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/feed-autofix registry/dependencies.yml --json > report.json || rc=$?
          cat report.json
          git diff --exit-code
          case "$rc" in
            0) echo "Feed audit is coherent." ;;
            1) echo "::warning::Feed audit found drift; GS2-08.9 has disabled automatic repair." ;;
            *) echo "::error::Feed audit could not classify its subject (exit $rc)."; exit "$rc" ;;
          esac
