# GS2-08.9 retirement boundary. Detection and the offline mutation fixture remain; the scheduled
# route has no App credential and cannot edit the registry, push, open a PR, or create an issue.
name: feed-autofix (audit only)

on:
  schedule:
    - cron: "47 6 * * *"
  repository_dispatch:
    types: [fs-gg-ui-template-released]
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/feed-autofix"
      - "scripts/fsgg_feed.py"
      - "scripts/registry_packages.py"
      - "tests/feed-autofix/**"
      - ".github/workflows/feed-autofix.yml"

permissions:
  contents: read
  packages: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: feed-autofix-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run offline refusal and reconciliation fixtures
        run: bash tests/feed-autofix/run.sh

  audit:
    if: github.event_name != 'pull_request'
    needs: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Inspect the live feed without changing the checkout or provider
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          python scripts/feed-autofix registry/dependencies.yml --json > report.json || rc=$?
          cat report.json
          git diff --exit-code
          case "$rc" in
            0) echo "Feed audit is coherent." ;;
            1) echo "::warning::Feed audit found drift; GS2-08.9 has disabled automatic repair." ;;
            *) echo "::error::Feed audit could not classify its subject (exit $rc)."; exit "$rc" ;;
          esac
