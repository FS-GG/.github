# Gates for the LEARN pod operator gate layer (deployment/learn-finite-profile/pod-operator), Refs #4647.
#
# Drives main() through its gates with injected dependencies against temporary fixtures: the shared lock, symmetric exclusion, custody, the
# acknowledgement gate, the admission reader (vectors A01 to A18 against the original and the verbatim copy), the claim verification, the nonce, and
# the marker and inputMounted ordering. It also compares the verbatim blocks with their originals, so the suite reads the claim tooling, operator r6
# and the claim tooling's README. stdlib only; no credential, no network, no container, no root, no systemd.
#
# The two `paths:` lists are identical on purpose; `check-paths-coherence.py` rule (a) reds a divergence.
name: learn-pod-operator-selftest

on:
  pull_request:
    paths:
      - "deployment/learn-finite-profile/pod-operator/**"
      - "deployment/learn-finite-profile/seal/**"
      - "deployment/learn-finite-profile/operator/**"
      - "tests/learn-pod-operator/**"
      - ".github/workflows/learn-pod-operator-selftest.yml"
  push:
    branches: [main]
    paths:
      - "deployment/learn-finite-profile/pod-operator/**"
      - "deployment/learn-finite-profile/seal/**"
      - "deployment/learn-finite-profile/operator/**"
      - "tests/learn-pod-operator/**"
      - ".github/workflows/learn-pod-operator-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded one. The key falls back to `github.sha`
# for push / workflow_dispatch so each keeps its own group and `cancel-in-progress` is false there.
concurrency:
  group: learn-pod-operator-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run the pod operator gate-layer gates
        run: python3 tests/learn-pod-operator/run.py
