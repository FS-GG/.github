# coord-github — FS.GG.Coord.GitHub, the impure edge (ADR-0034 §4.1, built by ADR-0040 Phase A).
#
# THE HALF THAT WAS NEVER PORTED, AND WHERE THE BUGS STILL ARE.
#
# ADR-0034 moved the DECISION to a typed core and stopped there. The core is pure — it cannot fail open,
# because it cannot read anything — and that is precisely why none of epic #266's remaining children live
# in it. They live out here, in the layer that talks to GitHub: a claim scan that reads a truncated page as
# an empty lock (#461); a rate-limited item lookup reported as "not on board", with a remediation that
# CREATES A DUPLICATE (#421); a board write promised to a queue that could never replay it (#510). Every one
# is an IO or write-path defect, and every one survived the flip untouched.
#
# THE TESTS ARE FAILURE-LEG TESTS, AND THAT IS THE POINT. A happy-path test passes against the broken code
# and proves nothing — that is #266's whole lesson. So almost every assertion in this suite asserts a
# REFUSAL: that a malformed page is an error and not an empty lock, that an exhausted budget is not an
# absent item, that a MERGED pull request is not an abandoned one. The bug was never that the good path
# failed.
#
# WHY THIS GATE IS SEPARATE FROM coord-core. The core's suite proves the RULES still hold. This one proves
# the EDGE still refuses. They fail for different reasons and they are read by different people, and
# collapsing them would mean a broken adapter and a broken rule print the same red.
name: coord-github

on:
  pull_request:
    paths:
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "tests/FS.GG.Coord.GitHub.Tests/**"
      - "tests/coord-board-v2-projection/**"
      - "tests/coord-board-tend-mutation/**"
      - "tests/coord-constructor-identity-mutation/**"
      - "tests/coord-board-v2-cli-join/**"
      - ".github/workflows/coord-board-v2-refresh.yml"
      - "tests/producer-fence-attacks/**"
      # tests/producer-fence-attacks/run.py byte-pins every file below (external-route-evidence.json, the
      # census documents, the GS2-08.9 dispositions, the write fixture). Editing one without this job
      # running leaves main red at the next unrelated push (#4965 changed kit-materialize.yml unseen).
      # tools/routine-delivery.py and scripts/NewSddWorkspace/Program.fs are deliberately NOT listed:
      # under ADR-0091 run.py treats both as historical-only (HISTORICAL_ONLY_SOURCE_HASHES, and the
      # `validate_historical_only_source` skip before the current-bytes comparison) and never hashes them.
      - ".github/workflows/dispatch-sender.yml"
      - ".github/workflows/feed-autofix.yml"
      - ".github/workflows/fsgg-dispatch-broker.yml"
      - ".github/workflows/github-substrate-v2-authority-qualification.yml"
      - ".github/workflows/kit-auto-publish.yml"
      - ".github/workflows/kit-materialize.yml"
      - ".github/workflows/lockfile-sync.yml"
      - ".github/workflows/release-coord-engine.yml"
      - ".github/workflows/release-drivers.yml"
      - ".github/workflows/release-kit.yml"
      - ".github/workflows/release-new-sdd-workspace.yml"
      - ".github/workflows/release-saga-prepare.yml"
      - ".github/workflows/release-saga-start.yml"
      - ".github/workflows/release-telemetry-host.yml"
      - ".github/workflows/skill-registry-autofix.yml"
      - ".github/workflows/skillmirror-redrive.yml"
      - ".github/workflows/touch-set-drift.yml"
      - "scripts/release-saga-ci.sh"
      - "scripts/release-saga-promote-release.sh"
      - "docs/coordination/v1-writer-census.json"
      - "docs/coordination/v1-writer-receiver-census.json"
      - "docs/reports/gs2-08-9-release-route-dispositions.json"
      - "tests/coord-engine-e2e/writes.sh"
      - "tests/coord-engine-e2e/stateful_server.py"
      - "src/FS.GG.Coord.Core/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/coord-github.yml"
  push:
    branches: [main]
    paths:
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "tests/FS.GG.Coord.GitHub.Tests/**"
      - "tests/coord-board-v2-projection/**"
      - "tests/coord-board-tend-mutation/**"
      - "tests/coord-constructor-identity-mutation/**"
      - "tests/coord-board-v2-cli-join/**"
      - ".github/workflows/coord-board-v2-refresh.yml"
      - "tests/producer-fence-attacks/**"
      # tests/producer-fence-attacks/run.py byte-pins every file below (external-route-evidence.json, the
      # census documents, the GS2-08.9 dispositions, the write fixture). Editing one without this job
      # running leaves main red at the next unrelated push (#4965 changed kit-materialize.yml unseen).
      # tools/routine-delivery.py and scripts/NewSddWorkspace/Program.fs are deliberately NOT listed:
      # under ADR-0091 run.py treats both as historical-only (HISTORICAL_ONLY_SOURCE_HASHES, and the
      # `validate_historical_only_source` skip before the current-bytes comparison) and never hashes them.
      - ".github/workflows/dispatch-sender.yml"
      - ".github/workflows/feed-autofix.yml"
      - ".github/workflows/fsgg-dispatch-broker.yml"
      - ".github/workflows/github-substrate-v2-authority-qualification.yml"
      - ".github/workflows/kit-auto-publish.yml"
      - ".github/workflows/kit-materialize.yml"
      - ".github/workflows/lockfile-sync.yml"
      - ".github/workflows/release-coord-engine.yml"
      - ".github/workflows/release-drivers.yml"
      - ".github/workflows/release-kit.yml"
      - ".github/workflows/release-new-sdd-workspace.yml"
      - ".github/workflows/release-saga-prepare.yml"
      - ".github/workflows/release-saga-start.yml"
      - ".github/workflows/release-telemetry-host.yml"
      - ".github/workflows/skill-registry-autofix.yml"
      - ".github/workflows/skillmirror-redrive.yml"
      - ".github/workflows/touch-set-drift.yml"
      - "scripts/release-saga-ci.sh"
      - "scripts/release-saga-promote-release.sh"
      - "docs/coordination/v1-writer-census.json"
      - "docs/coordination/v1-writer-receiver-census.json"
      - "docs/reports/gs2-08-9-release-route-dispositions.json"
      - "tests/coord-engine-e2e/writes.sh"
      - "tests/coord-engine-e2e/stateful_server.py"
      - "src/FS.GG.Coord.Core/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/coord-github.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coord-github-${{ github.ref }}
  cancel-in-progress: true

jobs:
  edge:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Locked restore, like every other project in the org. A silent version SUBSTITUTION fails here
      # rather than quietly changing what the tests ran against (ADR-0006; NU1603/NU1608 are errors).
      - name: Restore (locked)
        run: |
          dotnet restore tests/FS.GG.Coord.GitHub.Tests/FS.GG.Coord.GitHub.Tests.fsproj --locked-mode
          dotnet restore tests/coord-board-v2-projection/coord-board-v2-projection.fsproj --locked-mode
          dotnet restore tests/coord-board-v2-cli-join/coord-board-v2-cli-join.fsproj --locked-mode

      - name: Build
        run: |
          dotnet build tests/FS.GG.Coord.GitHub.Tests/FS.GG.Coord.GitHub.Tests.fsproj --no-restore -c Release
          dotnet build tests/coord-board-v2-projection/coord-board-v2-projection.fsproj --no-restore -c Release
          dotnet build tests/coord-board-v2-cli-join/coord-board-v2-cli-join.fsproj --no-restore -c Release

      # Every failure here is a refusal the org paid for once already.
      - name: Test — the edge must refuse
        run: |
          dotnet test tests/FS.GG.Coord.GitHub.Tests/FS.GG.Coord.GitHub.Tests.fsproj --no-build -c Release --logger "console;verbosity=normal"
          dotnet test tests/coord-board-v2-projection/coord-board-v2-projection.fsproj --no-build -c Release --logger "console;verbosity=normal"
          dotnet test tests/coord-board-v2-cli-join/coord-board-v2-cli-join.fsproj --no-build -c Release --logger "console;verbosity=normal"

      # The board-tend derivation mutation matrix (#5136 phase 2 PR 2) is still runnable: every leg's `find` still
      # matches V2Tend.fs. Runs no mutation; the sweep itself is on demand.
      - name: The board-tend mutation matrix is still runnable
        run: bash tests/coord-board-tend-mutation/run.sh

      # The #5113 constructor-identity mutation legs mutate V2ConstructorClosure.fs, V2Preflight.fs and
      # V2EnrollmentCommands.fs by exact source text. This checks, in seconds, that every leg still matches; it runs no
      # mutation. The sweep itself is on demand: scripts/gate-mutate.py --specs tests/coord-constructor-identity-mutation/specs.yml
      - name: Constructor-identity mutation matrix is runnable
        run: bash tests/coord-constructor-identity-mutation/run.sh

      - name: Verify GS2-08.6 producer attack oracle
        run: |
          dotnet test tests/FS.GG.Coord.GitHub.Tests/FS.GG.Coord.GitHub.Tests.fsproj --no-build -c Release \
            --filter FullyQualifiedName~ProducerFence \
            --logger "trx;LogFileName=producer-fence-attacks.trx" \
            --results-directory "$RUNNER_TEMP/producer-fence-attacks"
          python3 tests/producer-fence-attacks/run.py \
            --trx "$RUNNER_TEMP/producer-fence-attacks/producer-fence-attacks.trx" \
            --test-assembly tests/FS.GG.Coord.GitHub.Tests/bin/Release/net10.0/FS.GG.Coord.GitHub.Tests.dll \
            --product-assembly src/FS.GG.Coord.GitHub/bin/Release/net10.0/FS.GG.Coord.GitHub.dll \
            --source-head "${{ github.event.pull_request.head.sha || github.sha }}"
          python3 tests/producer-fence-attacks/selftest.py
          python3 tests/producer-fence-attacks/probe_legacy.py --verify

      # A SUITE THAT CANNOT FAIL IS NOT A SUITE (#266, #436). A misconfigured runner that discovers
      # nothing exits 0, and this gate would then go green over an adapter nobody tested — which is epic
      # #266's exact shape, in the layer whose entire purpose is to end it. Assert a floor.
      - name: Non-vacuity — the run must have executed tests
        run: |
          set -euo pipefail
          out="$(dotnet test tests/FS.GG.Coord.GitHub.Tests/FS.GG.Coord.GitHub.Tests.fsproj --no-build -c Release 2>&1)"
          printf '%s\n' "$out"
          passed="$(printf '%s' "$out" | grep -oE 'Passed:[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)"
          if [ "${passed:-0}" -lt 155 ]; then
            echo "::error title=coord-github: the suite audited nothing::Only ${passed:-0} tests ran. The edge's incident log is ~164 assertions, INCLUDING the real HttpTransport against a live HttpListener (pagination, ETag/304, typed GraphQL, status classification), the scan's cursor loop and cache codec, and the done-stamp's GraphQL read. A runner that discovers nothing exits 0, and a green gate over an untested adapter is exactly the fail-open this layer exists to end (#266)."
            exit 1
          fi
          echo "coord-github: $passed test(s) passed" >> "$GITHUB_STEP_SUMMARY"
