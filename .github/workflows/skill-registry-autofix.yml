# GS2-08.9 retirement boundary. The former scheduled registry writer is retained as an offline
# regression suite. It receives no App credential and has no provider mutation step.
name: skill-registry-autofix (validation only)

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fsgg-skill-registry-check"
      - "tests/skill-registry/**"
      - ".github/workflows/skill-registry-autofix.yml"

permissions:
  contents: read

jobs:
  validate:
    name: Skill registry offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run registry fixtures without writing the registry
        run: bash tests/skill-registry/run.sh
      - name: Assert the validation checkout stayed unchanged
        run: git diff --exit-code
