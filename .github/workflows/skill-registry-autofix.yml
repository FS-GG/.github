# The RESPONSE half of `registry = manifest = bytes` (.github#299, ADR-0017, epic #266).
#
# `skill-registry-coherence.yml` is the DETECTION half: its `schedule:` catches a producer that
# merged a SKILL.md body change and left `registry/skills.yml` stale, because the producer's own
# drift-guard stays green (it is internally consistent) while THIS registry silently falls behind.
# Detection is sound — it caught the drift at #288, #297, and #308. What was missing was RESPONSE:
# nothing turned "a producer moved a body" into "a `.github` PR re-digesting the row exists". Each
# stale row waited for the next unrelated `.github` PR (or the nightly detection) to trip the gate,
# and was then reconciled BY HAND. The count of manual sweeps (#288 → #297 → #308) grew rather than
# converged. This workflow closes that edge: it runs the reconcile the humans were running, and
# opens the PR they were opening.
#
# WHY POLL, NOT DISPATCH. #299 sketches two shapes: a `repository_dispatch` from each producer on a
# skill-body merge, or a scheduled auto-PR here that polls. The issue says to "cost the simple
# version first" — and the simple version is the only one that lives entirely in `.github`. Dispatch
# would mean editing four producer repos' workflows; polling reuses the producer checkout the
# detection job already does. Detection already polls on `schedule:`; this is its auto-PR twin, run
# 25 minutes later so a body merged overnight is both detected AND has a reconcile PR by morning.
#
# WHAT IT WILL AND WON'T RECONCILE. `--write` is self-limiting to the MECHANICAL cases — it rewrites
# a stale `sha256:` / `materializes-when:` verbatim from the manifest, and appends a missing row
# only when exactly one manifest derives its `source:`. It then RE-CHECKS and refuses to touch the
# JUDGEMENT cases: a vanished source, a frozen-mirror divergence (#295 — two repos disagree on who
# owns a body), contradictory predicates, or a row two manifests declare (#298 — needs an owner
# call). Those it leaves as findings and exits non-zero. Auto-resolving either would re-introduce
# the fail-open shape of #266 INSIDE the fix for it — so this workflow carries them into the PR body
# as "still needs a human", never silently resolves them.
#
# THE PR's OWN CHECKS RUN, SO A STALE SNAPSHOT GOES RED BY ITSELF (#514, completing #425). The branch
# is pushed with the org `fs-gg-cross-repo-dispatch` App token, exactly as `lockfile-sync.yml` does
# and for exactly this reason: an App-token push DOES re-trigger `on: pull_request`, so
# `skill-registry-coherence` evaluates the very PR that exists to satisfy it.
#
# It used to be pushed with the run-scoped GITHUB_TOKEN, whose pushes deliberately do NOT re-trigger
# `on: pull_request` (GitHub's recursion guard) — so the gate never ran on the standing PR and
# NOTHING COULD CONTRADICT IT once it rotted. #425 measured the cost: PR #414 was cut at 08:25Z, two
# producer merges landed behind it, and merging it would have left `main` RED while its body
# asserted, in the present tense, that it had reconciled the registry. A reviewer could not tell.
#
# #425 landed the LEGIBILITY half — the body carries its own PROVENANCE (the producer commits each
# digest was taken at, see the stamp step) and its own VERDICT (whether merging it actually greens
# the gate). That made the decay visible but could not abolish it: the body could describe its own
# staleness and nothing could contradict it. This is the STRUCTURAL half. A standing PR whose
# producers have moved past its stamp now simply goes red, with no human comparing SHAs by hand.
#
# THE PRECONDITION WAS MEASURED, NOT ASSUMED (#514). "Is the App installed on `.github` ITSELF with
# contents: write?" was the open question, and a wrong guess would 403 and leave the org with NO
# response half — strictly worse than a decaying one. Settled empirically: minting an org-scoped App
# token and calling `GET /installation/repositories` enumerates the installation, which contains all
# seven repos INCLUDING `.github`; and a `.github`-scoped mint requesting contents + pull_requests
# write succeeds, which the access-token API permits only when the installation actually holds them.
#
# Note the trap that reasoning avoids: the org secrets being visible to `.github` does NOT imply the
# installation includes it. `.github` is the SENDER — it necessarily holds those secrets to mint
# tokens for OTHER repos — so secret visibility says nothing about whether it is itself a TARGET.
#
# The push MUST NOT revert to `github.token`: that would fail the gate OPEN again, silently and
# exactly as before, so tests/skill-registry case 31 asserts structurally that it does not.
#
# ONE STANDING PR. The reconcile is pushed to a fixed branch, so a second run force-updates the same
# branch and the same open PR rather than opening a pile of them. A run that finds nothing stale
# opens nothing — and RETIRES an open standing PR, whose diff is by then provably obsolete (see the
# retire step; an obsolete reconcile does not sit there looking mergeable).
#
# CLEAN REPOS-ROOT. `fsgg-skill-registry-check` reads EVERY directory under `--repos-root` as a
# producer, so a stray checkout there corrupts the findings (a developer's in-flight `git worktree`s
# are the classic trap). CI is clean by construction: `.repos` holds exactly the freshly-cloned
# canonical producers and nothing else — the same guarantee `skill-registry-coherence.yml` relies on.
name: skill-registry-autofix

on:
  # Detection runs at 17 6; this runs 25 min later so a nightly-detected drift also gets its PR.
  schedule:
    - cron: "42 6 * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Reconcile and print the diff + PR body, but do NOT push a branch or open a PR."
        type: boolean
        default: false

# The reconcile branch is pushed, and the standing PR opened/updated, with the APP token (see header)
# — never with the run-scoped GITHUB_TOKEN, whose pushes would not re-trigger the PR's own checks. So
# GITHUB_TOKEN is left with only what the steps that still use it actually need: reading this repo,
# and closing/commenting on the standing PR when a reconcile is retired. `contents: write` is
# deliberately NOT granted — the push has no GITHUB_TOKEN fallback to silently succeed through.
permissions:
  contents: read
  pull-requests: write

concurrency:
  # Never let two runs (a schedule and a manual dispatch) race on the standing branch.
  group: skill-registry-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/skill-registry-autofix
      REGISTRY: registry/skills.yml
    steps:
      # Minted BEFORE the checkout, because the checkout is what persists it as the git credential —
      # which is what makes the reconcile push below an App-token push, and therefore what makes the
      # PR's own `skill-registry-coherence` job run. Scope defaults to THIS repository (FS-GG/.github),
      # which is exactly what is needed and what #514 proved the installation grants.
      #
      # If the App is ever de-scoped from `.github`, this step fails LOUDLY here — at the top of the
      # run, naming the App — rather than 403-ing deep in the push, or (worse) quietly falling back to
      # a GITHUB_TOKEN push that would re-open the exact fail-open this workflow closes.
      - name: Mint the cross-repo-dispatch App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      # The producer bodies whose digests the registry declares, at `main`. Public, so the default
      # token suffices. `.repos` holds ONLY these — the clean root the check requires (see header).
      #
      # The producer set is DERIVED from the registry's own `source:` prefixes, not hardcoded: a new
      # skill-producing repo starts being fetched the moment its first row lands, with nothing to keep
      # in sync by hand. (Detection hardcodes the list; here the reconcile must not silently skip a
      # producer the registry already names.)
      #
      # Blobless but NOT `--depth 1` (unlike detection, which only runs the check): the PR body names
      # the producer commit/PR that MOVED each body, which needs real history — on a depth-1 clone
      # `git log -- <path>` can only see the tip and would mislabel every row with the same HEAD.
      # `--filter=blob:none` keeps it cheap: all commits/trees, blobs fetched lazily (none needed for
      # `git log`; the body bytes the check hashes are the only blobs pulled).
      - name: Check out the producer repos
        run: |
          set -euo pipefail
          mkdir -p .repos
          producers="$(python -c "import yaml; print('\n'.join(sorted({r['source'].split('/')[0] for r in yaml.safe_load(open('registry/skills.yml'))['skills']})))")"
          echo "producers named by registry/skills.yml:"; echo "$producers"
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            git clone --filter=blob:none \
              "https://github.com/FS-GG/$repo.git" ".repos/$repo"
            echo "cloned $repo @ $(git -C ".repos/$repo" rev-parse --short HEAD)"
          done <<< "$producers"

      # THE STAMP (#425). Every digest this run writes is a pure function of these commits, so the PR
      # body has to name them: without the stamp, "is this reconcile still current?" is unanswerable
      # from the PR itself, and #414 sat for hours looking correct while two producer merges had moved
      # past it. Captured HERE, immediately after the clone, so it is the commit actually reconciled
      # from and not a re-read that could race a producer merging mid-run.
      - name: Stamp the producer commits this reconcile is computed from
        run: |
          set -euo pipefail
          for d in .repos/*/; do
            repo="$(basename "$d")"
            printf '%s\t%s\n' "$repo" "$(git -C "$d" rev-parse HEAD)"
          done | python -c 'import json,sys; print(json.dumps(dict(l.split("\t") for l in sys.stdin.read().splitlines() if l), sort_keys=True))' > producers.json
          echo "stamp: $(cat producers.json)"

      # Snapshot the findings BEFORE writing — the PR body names each reconciled row and, best
      # effort, the producer commit that last moved its body (the research a human did by hand).
      - name: Snapshot findings
        run: python scripts/fsgg-skill-registry-check --repos-root .repos --json > findings.before.json || true

      - name: Reconcile in place
        # `--write` exits non-zero when JUDGEMENT cases remain (see header) — expected, and it must
        # NOT fail the job, because the mechanical reconcile is still worth a PR. `|| true` swallows
        # that exit; the decision to act is made on the git diff in the next step, not this code.
        run: python scripts/fsgg-skill-registry-check --write --repos-root .repos || true

      - name: Decide whether anything changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- "$REGISTRY"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "skill-registry-autofix: registry already coherent with the producer manifests — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "skill-registry-autofix: reconciled rows in $REGISTRY:"
            git --no-pager diff --stat -- "$REGISTRY"
          fi

      # The stamp the PREVIOUS run left on the standing PR, so the new body can say "this supersedes
      # a snapshot built at <older commits>" rather than silently replacing it. Best-effort by design
      # (`|| true`, `{}` on a miss): this only enriches the body, and a failure to read the old PR must
      # never starve a genuine reconcile of its new one.
      - name: Recover the standing PR's previous stamp
        id: prev
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh pr list --state open`, NOT `gh pr view "$BRANCH"` — `view` happily resolves a CLOSED PR
          # for the branch, and the retire step leaves exactly that behind. Reading a retired PR's stamp
          # would brand the NEXT, freshly-opened PR as "superseding a stale snapshot" that was already
          # closed. Same lookup the open/update step uses, so the two cannot disagree about which PR is
          # the standing one.
          stamp='{}'
          if gh pr list --head "$BRANCH" --state open --json body --jq '.[0].body // empty' > prev-body.md 2>/dev/null; then
            stamp="$(python scripts/skill-registry-autofix-body --read-stamp prev-body.md || echo '{}')"
          fi
          echo "prev-stamp: $stamp"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # Build the PR body from the pre-write findings + the producer stamp. The composer is a real,
      # tested script (tests/skill-registry) rather than an inline heredoc, because the body is the
      # artifact that LIED in #425 — it asserted currency it could not have — and an untestable fix to
      # a misleading artifact is not much of a fix. It now carries its own provenance and its own
      # verdict, and it is deterministic: `--now` / `--run-url` are injected, never read from a clock.
      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        env:
          # Through the ENVIRONMENT, never `${{ }}` inside the script. This value is recovered from the
          # standing PR's BODY, which anyone with write access can edit, and `${{ }}` is substituted
          # textually BEFORE bash parses the line — so a single quote in the stamp would close the
          # quoted argument and run the rest as commands, in a job holding `contents: write`.
          # `json.dumps` escapes `"` and `\`, but NOT `'`, so it is no defence. An env var is never
          # re-parsed as shell, which ends the whole class.
          PREV_STAMP: ${{ steps.prev.outputs.stamp }}
        run: |
          set -euo pipefail
          python scripts/skill-registry-autofix-body \
            --findings findings.before.json \
            --registry "$REGISTRY" \
            --repos-root .repos \
            --producers "$(cat producers.json)" \
            --prev-producers "$PREV_STAMP" \
            --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > pr-body.md
          echo "----- PR body -----"
          cat pr-body.md

      # BOTH the push and the `gh pr create`/`edit` use the APP token (#514). The push is what decides
      # whether `skill-registry-coherence` re-runs on the PR — a `github.token` push is swallowed by
      # GitHub's recursion guard and the gate never evaluates its own subject. The `gh` calls use it
      # too, so the standing PR is OPENED BY the identity that pushed it rather than by two different
      # actors. `git push` needs no explicit credential: the checkout persisted this token.
      - name: Open or update the standing PR
        if: steps.diff.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "${{ secrets.FSGG_DISPATCH_APP_ID }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add -- "$REGISTRY"
          git commit -m "registry: auto-reconcile skill-registry against producer manifests (.github#299)"
          # Plain --force: this branch is bot-owned and nobody else writes it, and the `concurrency`
          # group already serializes runs — so there is no lost-update to guard against, while
          # --force-with-lease would misfire on the first push (no remote-tracking ref to compare).
          git push --force origin "$BRANCH"

          # One standing PR: reuse the open one if present, else open it.
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          title="registry: re-digest stale skill rows (auto)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file pr-body.md
            echo "updated standing PR #$existing"
          else
            gh pr create --base main --head "$BRANCH" --title "$title" --body-file pr-body.md \
              --label bug
            echo "opened standing PR on $BRANCH"
          fi

      # IS THE REGISTRY ACTUALLY COHERENT, OR DID THE RECONCILE JUST FAIL? `changed == 'false'` alone
      # cannot tell you. `Reconcile in place` ends in `|| true`, which swallows EVERY non-zero exit —
      # not only the expected "judgement cases remain", but a genuine crash (an unparseable registry, a
      # corrupt producer clone, an import error). A crash leaves the registry untouched, which produces
      # an empty diff, which is byte-for-byte the same signal as "nothing needed reconciling".
      #
      # Retiring a PR on that signal would close a NEEDED reconcile and comment that the registry is
      # coherent — a destructive act justified by a state nothing verified. That is precisely the
      # epic-#266 fail-open this workflow exists to remove, so it must not be reintroduced in the fix
      # for it. Demand POSITIVE evidence instead: a read-only check that exits 0 (zero findings).
      # A crash and a residual finding both exit non-zero, and both correctly withhold the retire.
      - name: Prove the registry is coherent (not merely un-diffed)
        id: coherent
        if: steps.diff.outputs.changed == 'false'
        run: |
          set -uo pipefail
          if python scripts/fsgg-skill-registry-check --repos-root .repos > coherence.txt 2>&1; then
            echo "coherent=true" >> "$GITHUB_OUTPUT"
            echo "registry is coherent with the producer manifests — a standing PR, if any, is obsolete."
          else
            echo "coherent=false" >> "$GITHUB_OUTPUT"
            echo "NOT retiring: the reconcile produced no diff, but the registry is NOT coherent."
            echo "Either judgement cases remain, or the check itself failed. Either way the empty diff"
            echo "is not evidence of coherence, and closing a standing PR on it would destroy a needed"
            echo "reconcile. Output follows:"
            cat coherence.txt
          fi

      # RETIRE A RECONCILE THAT IS NO LONGER TRUE (#425). If the registry is genuinely coherent, the
      # old behaviour was to touch nothing — which QUIETLY LEFT ANY OPEN STANDING PR IN PLACE, still
      # proposing yesterday's rewrite of rows that are correct on `main` today (someone reconciled by
      # hand, or a producer moved back). That PR is not merely stale, it is INVERTED: merging it would
      # write superseded digests over a coherent registry and RED the very gate it claims to green.
      #
      # Closing (not merging, not silently deleting) keeps the trail: the next run re-opens a fresh one
      # the moment there is genuinely something to reconcile. Gated on the PROOF above, never on the
      # bare absence of a diff.
      - name: Retire the standing PR when the reconcile is empty
        if: steps.diff.outputs.changed == 'false' && steps.coherent.outputs.coherent == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          if [ -z "$existing" ]; then
            echo "no standing PR open — nothing to retire."
            exit 0
          fi
          cat > retire-comment.md <<'EOF'
          Retired by `skill-registry-autofix`: `registry/skills.yml` is now **coherent with the
          producer manifests**, so this reconcile no longer applies.

          Its diff was computed against producer commits that `main` has since moved past (or the rows
          were reconciled by hand). **Merging it would have written superseded digests over a coherent
          registry** — i.e. it would have RED the gate it was opened to green. That is the decay
          .github#425 is about, and closing it is the response.

          A fresh standing PR opens automatically the next time there is genuinely something to
          reconcile.
          EOF
          gh pr close "$existing" --comment "$(cat retire-comment.md)"
          echo "retired obsolete standing PR #$existing"

      # Say what actually happened, not what usually happens. With `changed == 'false'` the compose step
      # was SKIPPED, so claiming a body was "composed above" would be one more piece of status text
      # asserting work that never ran — the exact failure this PR is removing from the PR body.
      - name: Dry-run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "dry-run: reconcile computed and PR body composed above; branch/PR NOT touched."
          elif [ "${{ steps.coherent.outputs.coherent }}" = "true" ]; then
            echo "dry-run: registry is coherent; a real run would RETIRE any open standing PR. Nothing composed."
          else
            echo "dry-run: no reconcile diff, and coherence NOT proven — a real run would touch nothing."
            echo "dry-run: (an empty diff with a failing check is not evidence the registry is clean.)"
          fi
