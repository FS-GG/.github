# GS2-08.9 retirement boundary. The former scheduled registry writer is retained as an offline
# regression suite. It receives no App credential and has no provider mutation step.
name: skill-registry-autofix (validation only)

on:
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/fsgg-skill-registry-check"
      - "tests/skill-registry/**"
      - ".github/workflows/skill-registry-autofix.yml"

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: skill-registry-autofix-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Skill registry offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run registry fixtures without writing the registry
        run: bash tests/skill-registry/run.sh
      - name: Assert the validation checkout stayed unchanged
        run: git diff --exit-code
