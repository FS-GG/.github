# The RESPONSE half of `registry = manifest = bytes` (.github#299, ADR-0017, epic #266).
#
# `skill-registry-coherence.yml` is the DETECTION half: its `schedule:` catches a producer that
# merged a SKILL.md body change and left `registry/skills.yml` stale, because the producer's own
# drift-guard stays green (it is internally consistent) while THIS registry silently falls behind.
# Detection is sound — it caught the drift at #288, #297, and #308. What was missing was RESPONSE:
# nothing turned "a producer moved a body" into "a `.github` PR re-digesting the row exists". Each
# stale row waited for the next unrelated `.github` PR (or the nightly detection) to trip the gate,
# and was then reconciled BY HAND. The count of manual sweeps (#288 → #297 → #308) grew rather than
# converged. This workflow closes that edge: it runs the reconcile the humans were running, and
# opens the PR they were opening.
#
# WHY POLL, NOT DISPATCH. #299 sketches two shapes: a `repository_dispatch` from each producer on a
# skill-body merge, or a scheduled auto-PR here that polls. The issue says to "cost the simple
# version first" — and the simple version is the only one that lives entirely in `.github`. Dispatch
# would mean editing four producer repos' workflows; polling reuses the producer checkout the
# detection job already does. Detection already polls on `schedule:`; this is its auto-PR twin. It
# runs HOURLY (.github#1207) so a body merged at 10:00 is reconciled by ~10:42, not left stale until
# the next 06:42 nightly run — the staleness window #299/#1207 costed, cut from ~24h to ~1h. At the
# 06:xx hour it still lands 25 min after the nightly detection, so a nightly-detected drift also gets
# its PR.
#
# WHAT IT WILL AND WON'T RECONCILE. `--write` is self-limiting to the MECHANICAL cases — it rewrites
# a stale `sha256:` / `materializes-when:` verbatim from the manifest, and adds a missing row
# only when exactly one manifest derives its `source:`. It then RE-CHECKS and refuses to touch the
# JUDGEMENT cases: a vanished source, a frozen-mirror divergence (#295 — two repos disagree on who
# owns a body), contradictory predicates, or a row two manifests declare (#298 — needs an owner
# call). Those it leaves as findings and exits non-zero. Auto-resolving either would re-introduce
# the fail-open shape of #266 INSIDE the fix for it — so this workflow carries them into the PR body
# as "still needs a human", never silently resolves them.
#
# A FULL SWEEP, NOT A HALF ONE (.github#299/#1200). `--write --now` (the invocation below) FINISHES the
# reconcile it used to leave half-done for a human: a new row is HOMED beside its (owner, predicate)
# siblings instead of dropped in the tail under a "re-home and annotate these" note — the manual step
# that produced #1198 — and `updated:` + a dated `skills.CHANGELOG.md` entry are written in the same
# pass. It still homes only what it can PROVE (a row with no sibling falls back to the tail append), so
# the judgement-case discipline above is unchanged; the housekeeping is what stops being the operator's.
#
# THE PR's OWN CHECKS RUN, SO A STALE SNAPSHOT GOES RED BY ITSELF (#514, completing #425). The branch
# is pushed with the org `fs-gg-cross-repo-dispatch` App token, exactly as `lockfile-sync.yml` does
# and for exactly this reason: an App-token push DOES re-trigger `on: pull_request`, so
# `skill-registry-coherence` evaluates the very PR that exists to satisfy it.
#
# It used to be pushed with the run-scoped GITHUB_TOKEN, whose pushes deliberately do NOT re-trigger
# `on: pull_request` (GitHub's recursion guard) — so the gate never ran on the standing PR and
# NOTHING COULD CONTRADICT IT once it rotted. #425 measured the cost: PR #414 was cut at 08:25Z, two
# producer merges landed behind it, and merging it would have left `main` RED while its body
# asserted, in the present tense, that it had reconciled the registry. A reviewer could not tell.
#
# #425 landed the LEGIBILITY half — the body carries its own PROVENANCE (the producer commits each
# digest was taken at, see the stamp step) and its own VERDICT (whether merging it actually greens
# the gate). That made the decay visible but could not abolish it: the body could describe its own
# staleness and nothing could contradict it. This is the STRUCTURAL half. A standing PR whose
# producers have moved past its stamp now simply goes red, with no human comparing SHAs by hand.
#
# THE PRECONDITION WAS MEASURED, NOT ASSUMED (#514). "Is the App installed on `.github` ITSELF with
# contents: write?" was the open question, and a wrong guess would 403 and leave the org with NO
# response half — strictly worse than a decaying one. Settled empirically: minting an org-scoped App
# token and calling `GET /installation/repositories` enumerates the installation, which contains all
# seven repos INCLUDING `.github`; and a `.github`-scoped mint requesting contents + pull_requests
# write succeeds, which the access-token API permits only when the installation actually holds them.
#
# Note the trap that reasoning avoids: the org secrets being visible to `.github` does NOT imply the
# installation includes it. `.github` is the SENDER — it necessarily holds those secrets to mint
# tokens for OTHER repos — so secret visibility says nothing about whether it is itself a TARGET.
#
# The push MUST NOT revert to `github.token`: that would fail the gate OPEN again, silently and
# exactly as before, so tests/skill-registry case 31 asserts structurally that it does not.
#
# ONE STANDING PR. The reconcile is pushed to a fixed branch, so a second run force-updates the same
# branch and the same open PR rather than opening a pile of them. A run that finds nothing stale
# opens nothing — and RETIRES an open standing PR, whose diff is by then provably obsolete (see the
# retire step; an obsolete reconcile does not sit there looking mergeable).
#
# AND IT MERGES ITS OWN PR (#642). A green PR that nobody merges lands nothing. #640 fixed the reason
# the standing PR could never go green — its own coherence check was failed by the judgement findings
# the bot correctly REFUSES to touch — and the result was #595: green, correct, and sitting there for
# days while `main` stayed red on the eight stale digests it had already fixed. The bot was an
# ornament; #640 only made it a green one. This is the step that lands it.
#
# WHY NOT `gh pr merge --auto`, WHICH IS WHAT THE OTHER TWO PROPAGATION ARMS DO. Because it cannot
# work here, and the second reason is the serious one:
#
#   1. `.github` has `allow_auto_merge: false`, so `--auto` fails outright. A verbatim copy of the
#      propagate arm would take its `autoMergeAllowed != true` branch and exit 1 EVERY DAY, telling a
#      human to flip a repo setting — a new permanently-red check, which is the exact thing the
#      comment it was copied from says trains everyone to ignore checks.
#
#   2. `registry-coherence` — the check that decides whether this PR is CORRECT — is NOT required on
#      `main` (the required set is `contract-coherence / coherence`, `projection`, `roster-closure`,
#      `drift`, `reconcile`). Native auto-merge waits for REQUIRED checks and merges straight past a
#      red non-required one. So `--auto` would ignore the single signal that separates a good
#      reconcile from a poisonous one: a red `registry-coherence` means the snapshot is OBSOLETE, and
#      merging it writes superseded digests over the registry and REDs the gate it was opened to
#      green. Arming `--auto` would not fix the bot — it would AUTOMATE the #425 inversion.
#
# NOR CAN `registry-coherence` SIMPLY BE MADE REQUIRED. Its verdict is a function of OTHER repos'
# `main`s, so requiring it would let a producer's skill-body merge turn every open `.github` PR red
# and block the repo until the next hourly (:42) run landed — an external repo's merge deadlocking this
# one's, the hazard `check-required-contexts.py` (#549) exists to document. It stays non-required,
# which means native auto-merge can never be safe on this PR.
#
# So the merge is GATED and DIRECT, and the gate is strictly STRONGER than `--auto`: it refuses on a
# red NON-required check, on a PR with ZERO checks (#606 — "CI never started" and "everything passed"
# are the same empty set), and on a `registry-coherence` that did not report at all (an absent subject
# reads exactly like a passing one). Branch protection still applies underneath — a direct merge is
# refused by GitHub exactly as `--auto` would be — so this ADDS a gate rather than routing around one.
# `scripts/fsgg-coord landable --wait --require registry-coherence --sha <head>` decides it (#737). A
# merge is the other branch here that DESTROYS state — it lands a commit on `main` — so the decision may
# not live in an inline block nothing can test. It USED to be a local script for exactly that reason;
# it is now the org's ONE merge gate, because a local script is a COPY, and this rollup has been wrong
# four times in five copies (#547, #606, #698, #710, #720) with every fix editing a copy. `--require` is
# what makes calling it strictly stronger than `--auto` rather than weaker: it asserts the non-required
# check BY NAME, which is the one thing native auto-merge structurally cannot do.
#
# MERGE AND RETIRE CANNOT RACE, AND NOT BY LUCK. Merge hangs off `changed == 'true'`, retire off
# `changed == 'false'` — mutually exclusive branches of one boolean, so no run takes both, and the
# `concurrency` group serialises runs so no two can interleave. A PR the gate MERGED is closed, so no
# later run can retire it; a PR a later run RETIRES has an empty diff, which is exactly the state in
# which the merge gate is never consulted. Case 31 pins that structurally.
#
# CLEAN REPOS-ROOT. `fsgg-skill-registry-check` reads EVERY directory under `--repos-root` as a
# producer, so a stray checkout there corrupts the findings (a developer's in-flight `git worktree`s
# are the classic trap). CI is clean by construction: `.repos` holds exactly the freshly-cloned
# canonical producers and nothing else — the same guarantee `skill-registry-coherence.yml` relies on.
name: skill-registry-autofix

on:
  # HOURLY (.github#1207): runs at :42 every hour, so a producer's skill-body merge is reconciled
  # within ~1h instead of waiting for the next 06:42 nightly run — the staleness window #299/#1207
  # costed, cut from ~24h to ~1h. Detection (`skill-registry-coherence`) still runs daily at 17 6; at
  # that hour this still lands 25 min later, so a nightly-detected drift also gets its PR — but the
  # window no longer WAITS on detection to shrink.
  schedule:
    - cron: "42 * * * *"
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Reconcile and print the diff + PR body, but do NOT push a branch or open a PR."
        type: boolean
        default: false

# The reconcile branch is pushed, and the standing PR opened/updated, with the APP token (see header)
# — never with the run-scoped GITHUB_TOKEN, whose pushes would not re-trigger the PR's own checks. So
# GITHUB_TOKEN is left with only what the steps that still use it actually need: reading this repo,
# reading this repo's workflow RUNS (the merge gate's supersession evidence, #700), and
# closing/commenting on the standing PR when a reconcile is retired. `contents: write` is
# deliberately NOT granted — the push has no GITHUB_TOKEN fallback to silently succeed through.
permissions:
  contents: read
  pull-requests: write
  # `actions: read` is what `GET /actions/runs` costs, and it is the evidence the merge gate needs to
  # tell a SUPERSEDED check run from a RED one (#700). It is granted HERE, to GITHUB_TOKEN, rather than
  # leaned on from the App token the rest of this job uses — deliberately. The App's installation
  # permissions are configured OUTSIDE this repo and cannot be asserted from inside it, so if the App
  # happened to lack Actions:read the read would 403, the payload would be empty, nothing would be
  # dropped, and the gate would go straight back to refusing the bot's own PR — the fix would be an
  # ornament, and a silent one. A scope this FILE grants is a scope this file can prove. It is read-only
  # and grants no new write: the rule above — that no step here can quietly fall back to a GITHUB_TOKEN
  # push — still holds.
  actions: read
  # `checks: read` is what `GET /commits/{sha}/check-runs` costs. The merge gate USED to make that read
  # with the App token; since #737 it runs entirely under GITHUB_TOKEN (`fsgg-coord landable` takes one
  # token for all three of its reads), so the scope moves here — which is the rationale directly above,
  # applied to the read it had not yet reached rather than bent around. EVERY read the gate makes is now
  # scoped by a grant in this block. Read-only: the App token remains the only thing that can write, and
  # the merge is the only write.
  checks: read

concurrency:
  # Never let two runs (a schedule and a manual dispatch) race on the standing branch.
  group: skill-registry-autofix
  cancel-in-progress: false

jobs:
  autofix:
    runs-on: ubuntu-latest
    # 15 before #642. The job now waits for the standing PR's own checks before merging it (~90s
    # measured, ~8 min ceiling), so the old bound would have killed the run mid-gate — and a job
    # cancelled after the push but before the verdict leaves the PR open and unjudged, which is the
    # state this change exists to end. Sized to the work, not rounded up: the ceiling
    # `check-workflow-timeouts.py` enforces is 60.
    timeout-minutes: 25
    env:
      BRANCH: bot/skill-registry-autofix
      REGISTRY: registry/skills.yml
      CHANGELOG: registry/skills.CHANGELOG.md
    steps:
      # Minted BEFORE the checkout, because the checkout is what persists it as the git credential —
      # which is what makes the reconcile push below an App-token push, and therefore what makes the
      # PR's own `skill-registry-coherence` job run. Scope defaults to THIS repository (FS-GG/.github),
      # which is exactly what is needed and what #514 proved the installation grants.
      #
      # If the App is ever de-scoped from `.github`, this step fails LOUDLY here — at the top of the
      # run, naming the App — rather than 403-ing deep in the push, or (worse) quietly falling back to
      # a GITHUB_TOKEN push that would re-open the exact fail-open this workflow closes.
      - name: Mint the cross-repo-dispatch App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      # THE MERGE GATE IS `scripts/fsgg-coord landable` (#737), and in `.github` the shim resolves the
      # engine from a REPO-LOCAL RELEASE BUILD — this repo builds coord from source and never from the
      # feed, so that fixing coord never requires publishing coord (ADR-0034 §4.3). The shim does not
      # build; it expects the binary to be there, and says so if it is not. So: build it, here, once.
      #
      # This costs the daily bot ~1 min and buys the end of a five-copy duplication that produced five
      # bugs. If the build fails the gate step cannot run, `$GITHUB_OUTPUT` gets no `merge` key, and
      # nothing is merged — the same fail-closed direction as every other way this gate can die.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the coord engine (the merge gate)
        run: |
          set -euo pipefail
          # --locked-mode: a silent version SUBSTITUTION fails here rather than quietly changing what the
          # gate is (ADR-0006) — this binary decides whether a commit lands on `main`.
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # The producer bodies whose digests the registry declares, at `main`. Public, so the default
      # token suffices. `.repos` holds ONLY these — the clean root the check requires (see header).
      #
      # The producer set is DERIVED from the registry's own `source:` prefixes, not hardcoded: a new
      # skill-producing repo starts being fetched the moment its first row lands, with nothing to keep
      # in sync by hand. (Detection hardcodes the list; here the reconcile must not silently skip a
      # producer the registry already names.)
      #
      # Blobless but NOT `--depth 1` (unlike detection, which only runs the check): the PR body names
      # the producer commit/PR that MOVED each body, which needs real history — on a depth-1 clone
      # `git log -- <path>` can only see the tip and would mislabel every row with the same HEAD.
      # `--filter=blob:none` keeps it cheap: all commits/trees, blobs fetched lazily (none needed for
      # `git log`; the body bytes the check hashes are the only blobs pulled).
      - name: Check out the producer repos
        run: |
          set -euo pipefail
          mkdir -p .repos
          producers="$(python -c "import yaml; print('\n'.join(sorted({r['source'].split('/')[0] for r in yaml.safe_load(open('registry/skills.yml'))['skills']})))")"
          echo "producers named by registry/skills.yml:"; echo "$producers"
          while IFS= read -r repo; do
            [ -n "$repo" ] || continue
            git clone --filter=blob:none \
              "https://github.com/FS-GG/$repo.git" ".repos/$repo"
            echo "cloned $repo @ $(git -C ".repos/$repo" rev-parse --short HEAD)"
          done <<< "$producers"

      # THE STAMP (#425). Every digest this run writes is a pure function of these commits, so the PR
      # body has to name them: without the stamp, "is this reconcile still current?" is unanswerable
      # from the PR itself, and #414 sat for hours looking correct while two producer merges had moved
      # past it. Captured HERE, immediately after the clone, so it is the commit actually reconciled
      # from and not a re-read that could race a producer merging mid-run.
      - name: Stamp the producer commits this reconcile is computed from
        run: |
          set -euo pipefail
          for d in .repos/*/; do
            repo="$(basename "$d")"
            printf '%s\t%s\n' "$repo" "$(git -C "$d" rev-parse HEAD)"
          done | python -c 'import json,sys; print(json.dumps(dict(l.split("\t") for l in sys.stdin.read().splitlines() if l), sort_keys=True))' > producers.json
          echo "stamp: $(cat producers.json)"

      # Snapshot the findings BEFORE writing — the PR body names each reconciled row and, best
      # effort, the producer commit that last moved its body (the research a human did by hand).
      - name: Snapshot findings
        run: python scripts/fsgg-skill-registry-check --repos-root .repos --json > findings.before.json || true

      - name: Reconcile in place
        # `--write` exits non-zero when JUDGEMENT cases remain (see header) — expected, and it must
        # NOT fail the job, because the mechanical reconcile is still worth a PR. `|| true` swallows
        # that exit; the decision to act is made on the git diff in the next step, not this code.
        #
        # `--now` makes `--write` FINISH the reconcile (.github#299/#1200): it HOMES each new row beside
        # its siblings instead of leaving it in the tail for a hand re-home (the #1198 toil), bumps
        # `updated:`, and prepends a dated `$CHANGELOG` entry — the two steps this bot used to only print
        # a reminder for. The date is injected here (not read by the tool) so the reconcile is
        # deterministic; both steps are no-ops when nothing was reconciled.
        run: python scripts/fsgg-skill-registry-check --write --repos-root .repos --now "$(date -u +%Y-%m-%d)" || true

      - name: Decide whether anything changed
        id: diff
        run: |
          set -euo pipefail
          if git diff --quiet -- "$REGISTRY"; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "skill-registry-autofix: registry already coherent with the producer manifests — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "skill-registry-autofix: reconciled rows in $REGISTRY:"
            git --no-pager diff --stat -- "$REGISTRY"
          fi

      # The stamp the PREVIOUS run left on the standing PR, so the new body can say "this supersedes
      # a snapshot built at <older commits>" rather than silently replacing it. Best-effort by design
      # (`|| true`, `{}` on a miss): this only enriches the body, and a failure to read the old PR must
      # never starve a genuine reconcile of its new one.
      - name: Recover the standing PR's previous stamp
        id: prev
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # `gh pr list --state open`, NOT `gh pr view "$BRANCH"` — `view` happily resolves a CLOSED PR
          # for the branch, and the retire step leaves exactly that behind. Reading a retired PR's stamp
          # would brand the NEXT, freshly-opened PR as "superseding a stale snapshot" that was already
          # closed. Same lookup the open/update step uses, so the two cannot disagree about which PR is
          # the standing one.
          stamp='{}'
          if gh pr list --head "$BRANCH" --state open --json body --jq '.[0].body // empty' > prev-body.md 2>/dev/null; then
            stamp="$(python scripts/skill-registry-autofix-body --read-stamp prev-body.md || echo '{}')"
          fi
          echo "prev-stamp: $stamp"
          echo "stamp=$stamp" >> "$GITHUB_OUTPUT"

      # Build the PR body from the pre-write findings + the producer stamp. The composer is a real,
      # tested script (tests/skill-registry) rather than an inline heredoc, because the body is the
      # artifact that LIED in #425 — it asserted currency it could not have — and an untestable fix to
      # a misleading artifact is not much of a fix. It now carries its own provenance and its own
      # verdict, and it is deterministic: `--now` / `--run-url` are injected, never read from a clock.
      - name: Compose PR body
        if: steps.diff.outputs.changed == 'true'
        env:
          # Through the ENVIRONMENT, never `${{ }}` inside the script. This value is recovered from the
          # standing PR's BODY, which anyone with write access can edit, and `${{ }}` is substituted
          # textually BEFORE bash parses the line — so a single quote in the stamp would close the
          # quoted argument and run the rest as commands, in a job holding `contents: write`.
          # `json.dumps` escapes `"` and `\`, but NOT `'`, so it is no defence. An env var is never
          # re-parsed as shell, which ends the whole class.
          PREV_STAMP: ${{ steps.prev.outputs.stamp }}
        run: |
          set -euo pipefail
          python scripts/skill-registry-autofix-body \
            --findings findings.before.json \
            --registry "$REGISTRY" \
            --repos-root .repos \
            --producers "$(cat producers.json)" \
            --prev-producers "$PREV_STAMP" \
            --now "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            > pr-body.md
          echo "----- PR body -----"
          cat pr-body.md

      # BOTH the push and the `gh pr create`/`edit` use the APP token (#514). The push is what decides
      # whether `skill-registry-coherence` re-runs on the PR — a `github.token` push is swallowed by
      # GitHub's recursion guard and the gate never evaluates its own subject. The `gh` calls use it
      # too, so the standing PR is OPENED BY the identity that pushed it rather than by two different
      # actors. `git push` needs no explicit credential: the checkout persisted this token.
      - name: Open or update the standing PR
        id: pr
        if: steps.diff.outputs.changed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # The App pushed this branch, so the App authors the commit. GitHub links a bot commit to its
          # account ONLY via `<BOT_USER_ID>+<slug>[bot]@users.noreply.github.com` — and BOT_USER_ID is
          # the id of the `[bot]` USER (`gh api users/fs-gg-cross-repo-dispatch%5Bbot%5D` -> 297630107),
          # NOT the App id. Using the App id (as lockfile-sync.yml does) yields an unlinked author, and
          # since the App id is a secret it is masked to `***` in the log, so the wrong value does not
          # even look wrong. Literal, because no step output carries it.
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "297630107+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          # $CHANGELOG (and the `updated:` bump inside $REGISTRY) is written by `--write --now` above;
          # stage it too, so the reconcile PR carries its own changelog entry rather than owing one.
          git add -- "$REGISTRY" "$CHANGELOG"
          git commit -m "registry: auto-reconcile skill-registry against producer manifests (.github#299)"
          # Plain --force: this branch is bot-owned and nobody else writes it, and the `concurrency`
          # group already serializes runs — so there is no lost-update to guard against, while
          # --force-with-lease would misfire on the first push (no remote-tracking ref to compare).
          git push --force origin "$BRANCH"

          # One standing PR: reuse the open one if present, else open it.
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          title="registry: re-digest stale skill rows (auto)"
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title "$title" --body-file pr-body.md
            pr="$existing"
            echo "updated standing PR #$pr"
          else
            # Take the number from create's own URL — re-listing can miss a just-created PR.
            url="$(gh pr create --base main --head "$BRANCH" --title "$title" --body-file pr-body.md \
                     --label bug)"
            pr="${url##*/}"
            echo "opened standing PR #$pr on $BRANCH"
          fi
          # Anything non-numeric is "no PR", never an arg to a later `gh` call.
          case "$pr" in ''|*[!0-9]*) echo "::error::could not determine the standing PR number." >&2; exit 1 ;; esac
          echo "number=$pr" >> "$GITHUB_OUTPUT"
          # The SHA the checks will report against. Read from the LOCAL branch we just pushed, not
          # from the API: the PR object's head SHA is eventually-consistent right after a force-push,
          # and gating on a stale SHA would read the PREVIOUS commit's (green) checks and merge a
          # commit nothing ever checked.
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # IS THE STANDING PR LANDABLE? — ASKED OF THE TOOL, NOT RE-DERIVED HERE (#737, #724).
      #
      # This step WAS ~90 lines: a check-runs wait loop with a stable-count guard, a workflow-runs read for
      # supersession evidence, a `mergeStateStatus` poll, and a tested Python gate to judge the three
      # payloads. It was CORRECT. It was also the FIFTH COPY of a rollup that has been wrong four times
      # (#547 unpaginated, #606 zero-checks-is-green, #698 superseded-reads-as-red, #710 THIS bot reading
      # its own superseded runs, #720 `pr_landable`), and every one of those fixes edited a copy. #724 put
      # the logic in ONE tested place — eleven legs in the engine's corpus, plus unit tests over the pure
      # scorer — and made a copy unwritable in a RECIPE. This was the last copy anywhere, and the reason it
      # outlived the others is that it needed two things the command could not do. It can now:
      #
      #   --require registry-coherence   THE ASSERTION THIS BOT EXISTS FOR. `registry-coherence` decides
      #                                  whether the reconcile is CORRECT, and it is NOT a required check
      #                                  on `main` — nor may it become one: its verdict is a function of
      #                                  OTHER repos' `main`s, so requiring it would let a producer's merge
      #                                  block every open PR here until the next hourly (:42) run (#549). So
      #                                  nothing but this flag will ever look at it, and an ABSENT check
      #                                  reads exactly like a passing one to any "is anything red?" rollup
      #                                  (#606). A renamed job or a narrowed `paths:` filter would
      #                                  otherwise green this PR having verified nothing.
      #
      #   --sha "$SHA"                   THE HEAD WE MEAN. `steps.pr.outputs.sha` is `git rev-parse HEAD`
      #                                  of the branch we just FORCE-PUSHED, deliberately not read from the
      #                                  API: `pulls/{n}` is eventually consistent, so for a moment it
      #                                  still names the PREVIOUS commit — whose checks are green and are
      #                                  not about the code that would be merged. Handing `landable` the PR
      #                                  number alone would restore exactly that hazard. It refuses
      #                                  (`pending`) until GitHub agrees the PR's head is the commit we
      #                                  pushed.
      #
      # WHAT WAS DROPPED, AND WHY IT IS SAFE. The old gate also required `mergeStateStatus` ∈ {CLEAN,
      # HAS_HOOKS}. `landable` asserts REST `mergeable` instead, and the delta is covered:
      #   * DIRTY (conflicted) -> `landable` returns `conflicted`, immediately and by name.
      #   * UNKNOWN            -> `landable` returns `unknown` (fail-closed), after its own lazy re-read.
      #   * UNSTABLE ("something is red") -> `landable`'s rollup is STRICTLY STRONGER: it scores workflow
      #     runs UNIONED with check-runs, so it sees a `startup_failure` run that makes no check-run at all.
      #   * BLOCKED (a required check or review missing) -> GitHub REFUSES the merge below, authoritatively,
      #     and that refusal is already a hard error this workflow must not route around. We lose a tidier
      #     message, not a gate.
      #   * BEHIND -> merging a green, non-conflicted, behind-`main` branch is normal, and branch protection
      #     refuses it anyway if the repo demands an up-to-date branch.
      # It is also why the gate stays REST-only: `mergeStateStatus` is GraphQL, and `landable` is the
      # command every worker recipe calls on a budget that is routinely exhausted (#587/#528).
      #
      # THE TOKEN, WHICH IS THE OTHER REASON THIS WAITED. The old step split its reads across two tokens:
      # the App token for check-runs and `gh pr view`, and GITHUB_TOKEN for `actions/runs` — because that
      # read needs `Actions: read`, a scope THIS FILE grants and can therefore prove, where the App's
      # installation permissions are configured outside this repo and cannot be asserted from inside it.
      # `landable` takes ONE token, so the choice had to be made rather than assumed: it is GITHUB_TOKEN,
      # which strengthens that rationale rather than bending it. Every read the gate makes is now scoped by
      # a grant in the permissions block above — `actions: read` (runs), `checks: read` (check-runs),
      # `pull-requests: write` (the PR). It is read-only; the App token is still the only thing that can
      # write, and it is used for exactly one thing below: the merge.
      #
      # FAIL-CLOSED BY CONSTRUCTION, unchanged: if this step dies, `$GITHUB_OUTPUT` gets no `merge` key, the
      # merge step's `if` cannot match, and nothing is merged.
      - name: Is the standing PR landable?
        id: merge-gate
        if: steps.pr.outputs.number != ''
        env:
          # The read-only token, for EVERY read — see above. `landable` prefers GITHUB_TOKEN over GH_TOKEN,
          # and no App token is in scope here, so it cannot silently pick one up.
          GITHUB_TOKEN: ${{ github.token }}
          # Through the ENVIRONMENT, never `${{ }}` inside the script: this workflow's standing rule, because
          # `${{ }}` is substituted textually BEFORE bash parses the line.
          PR: ${{ steps.pr.outputs.number }}
          SHA: ${{ steps.pr.outputs.sha }}
        run: |
          set -uo pipefail
          # `|| rc=$?`: a non-zero exit means "do not merge", which is a NORMAL outcome (pending checks on a
          # slow day), not an error. The decision is the exit code — 0 green, 7 pending, 3 red/conflicted,
          # 4 unknown — and only 0 merges. `--tries 24 --interval 20` is the ~8 min ceiling the old loop
          # had: measured, `.github`'s PR checks complete in ~90s, so this is slack, not an expectation.
          # Running out is not a failure — tomorrow's run re-pushes and re-gates. Latency is not a failure
          # mode; merging early is.
          rc=0
          scripts/fsgg-coord landable "$PR" \
            --repo "$GITHUB_REPOSITORY" \
            --wait --tries 24 --interval 20 \
            --require registry-coherence \
            --sha "$SHA" || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "merge=true" >> "$GITHUB_OUTPUT"
            echo "landable: GREEN — every check on $SHA passed, including \`registry-coherence\` (which is"
            echo "not a required check, so nothing else would ever have looked at it). Safe to land."
          else
            echo "merge=false" >> "$GITHUB_OUTPUT"
            echo "::warning::not merging standing PR #$PR: \`landable\` exited $rc (0=green 7=pending 3=red/conflicted 4=unknown). Its reason is above."
          fi

      # LAND IT. The App token merges, for the same reason it pushed (#514): GITHUB_TOKEN is held at
      # `contents: read` precisely so no step here can quietly fall back to it.
      #
      # This is a DIRECT merge, not `--auto`, and the header says why at length: `registry-coherence`
      # is not a required check, so native auto-merge would land this PR while the one check that can
      # prove it obsolete is RED. Branch protection still gates this merge exactly as it would gate an
      # auto-merge — GitHub refuses it if a required check is unsatisfied — so the gate above ADDS a
      # constraint (no red non-required check, no absent subject) rather than removing one.
      - name: Merge the standing PR
        if: steps.diff.outputs.changed == 'true' && steps.merge-gate.outputs.merge == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail
          if ! gh pr merge "$PR" --squash --delete-branch=false; then
            echo "::error::#$PR is green on every check, but GitHub refused the merge. The reconcile will" >&2
            echo "::error::NOT land without a human. If that is a branch-protection refusal, it is" >&2
            echo "::error::authoritative — do not route around it." >&2
            echo "::error::A BLOCKED PR reaches here rather than being refused by the gate: since #737 the" >&2
            echo "::error::gate asserts REST \`mergeable\` (via \`fsgg-coord landable\`) and not GraphQL" >&2
            echo "::error::\`mergeStateStatus\`, so 'a required check or review is missing' is GitHub's" >&2
            echo "::error::verdict to give, here, and it just gave it. Read what it said." >&2
            exit 1
          fi
          echo "Merged standing PR #$PR — the registry on \`main\` is now reconciled."

      # FAILING TO LAND IT IS AN ERROR, NOT A WARNING — the rule both other propagation arms state in
      # their own comments, and the one #642 quotes:
      #
      #   "the PR would sit exactly as before, and a green propagate run would report that the kit had
      #    been propagated when it had not. That is the fails-open shape #266 exists to kill."
      #
      # It applies here verbatim. A run that reconciles the registry, pushes the branch, and then does
      # NOT land it has left `main` exactly as stale as it found it — so a GREEN run would assert work
      # it did not do, which is the defect this whole workflow exists to remove, reappearing in the step
      # that reports on it. Red, and say which of the gate's refusals it was.
      #
      # This deliberately reds on "checks were still pending after ~8 minutes" too. That is not a false
      # alarm: measured, they complete in ~90s, so exhausting five times that slack means CI got slow or
      # the checks are not scheduling — and either way the reconcile did not land, which is the fact the
      # run has to carry. A daily bot that runs, succeeds, and achieves nothing is epic #416.
      - name: The reconcile did not land
        if: steps.diff.outputs.changed == 'true' && steps.pr.outputs.number != '' && steps.merge-gate.outputs.merge != 'true'
        env:
          PR: ${{ steps.pr.outputs.number }}
        run: |
          echo "::error::Standing PR #$PR was NOT merged — the gate's reason is printed above." >&2
          echo "::error::The registry on \`main\` is STILL STALE: this run reconciled it, opened the PR," >&2
          echo "::error::and did not land it. That is the whole job, unfinished — not a warning." >&2
          echo "::error::The next scheduled run re-pushes the branch and re-gates it, but if this keeps" >&2
          echo "::error::failing, LOOK: a red \`registry-coherence\` means the snapshot is obsolete (#425)." >&2
          exit 1

      # IS THIS RECONCILE FINISHED, OR DID IT JUST FAIL? `changed == 'false'` alone cannot tell you.
      # `Reconcile in place` ends in `|| true`, which swallows EVERY non-zero exit — not only the
      # expected "judgement cases remain", but a genuine crash (an unparseable registry, a corrupt
      # producer clone, an import error). A crash leaves the registry untouched, which produces an
      # empty diff, which is byte-for-byte the same signal as "nothing needed reconciling". Retiring a
      # PR on that would close a NEEDED reconcile while commenting that all is well — the epic-#266
      # fail-open, inside the fix for it. So the retire demands POSITIVE evidence. It always did.
      #
      # IT DEMANDED THE WRONG EVIDENCE (#537). The old gate required FULL COHERENCE — the check exits
      # 0, i.e. zero findings. But `--write` deliberately REFUSES judgement cases (a frozen-mirror
      # divergence, a row two manifests declare, a vanished source), and must keep refusing them for
      # the same #266 reason. So while any judgement case is outstanding the registry can never be
      # fully coherent, `coherent` can never be true, and the retire can NEVER FIRE — however obsolete
      # the standing PR has become. The two are not independent: a judgement case is exactly the state
      # in which the mechanical rows keep churning underneath it, which is exactly when standing PRs go
      # obsolete. The guard was disabled in precisely the situation that produces the thing it guards
      # against, and it showed — #414 and #521 both went obsolete under an outstanding judgement case,
      # and both had to be closed BY HAND.
      #
      # The right question is not "is the registry coherent?" but "IS THIS RECONCILE FINISHED?" — is
      # anything left that `--write` would have done and didn't? That is what makes the standing PR
      # obsolete, and it can be true while a human still owes the registry a judgement call.
      #
      # `skill-registry-retire-gate` decides it, and refuses on three distinct failures rather than
      # one: the check CRASHED (no parseable findings — its exit code cannot tell a crash from a
      # finding, since both are 1), the check was BLINDED (a `manifest-found` finding: a producer
      # clone that could not be read is the #425 fail-open wearing a finding's clothes, and a naive
      # "only judgement cases left?" test would wave it through), or something MECHANICAL is still
      # standing after an empty diff (the write did not take). It is a script, not an inline block,
      # because a retire is the one branch here that DESTROYS state and so must be driven over its
      # full truth table by tests/skill-registry — the same reason `dispatch-preflight` is a script.
      - name: Decide whether the reconcile is finished (not merely un-diffed)
        id: settled
        if: steps.diff.outputs.changed == 'false'
        run: |
          set -uo pipefail
          # `|| true`: a non-zero exit here means "findings exist", which is the NORMAL case and is
          # not an error. The gate reads the payload, never the exit code — that is its whole point.
          python scripts/fsgg-skill-registry-check --repos-root .repos --json > findings.after.json 2>check-stderr.txt || true
          # If the gate itself dies, $GITHUB_OUTPUT gets no `settled` key, the retire's `if` cannot
          # match, and nothing is retired. Fail-closed by construction.
          python scripts/skill-registry-retire-gate \
            --findings findings.after.json \
            --note-file retire-note.md >> "$GITHUB_OUTPUT"
          echo "--- coherence check stderr (empty unless it crashed) ---"
          cat check-stderr.txt

      # RETIRE A RECONCILE THAT IS NO LONGER TRUE (#425). If the registry is genuinely coherent, the
      # old behaviour was to touch nothing — which QUIETLY LEFT ANY OPEN STANDING PR IN PLACE, still
      # proposing yesterday's rewrite of rows that are correct on `main` today (someone reconciled by
      # hand, or a producer moved back). That PR is not merely stale, it is INVERTED: merging it would
      # write superseded digests over a coherent registry and RED the very gate it claims to green.
      #
      # Closing (not merging, not silently deleting) keeps the trail: the next run re-opens a fresh one
      # the moment there is genuinely something to reconcile. Gated on the PROOF above, never on the
      # bare absence of a diff.
      #
      # The comment must NOT claim the registry is coherent (#537). It is retired because this
      # RECONCILE is finished — which is a different fact, and is the only one established. Judgement
      # cases may well be outstanding; `retire-note.md` names them, so the close reads as "this
      # snapshot is obsolete, and here is what a human still owes the registry" rather than as an
      # all-clear the gate never gave. Asserting a coherence nobody proved is the #425 defect exactly.
      - name: Retire the standing PR when the reconcile is finished
        if: steps.diff.outputs.changed == 'false' && steps.settled.outputs.settled == 'true' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ github.token }}
          RESIDUAL: ${{ steps.settled.outputs.residual }}
        run: |
          set -euo pipefail
          existing="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number' || true)"
          if [ -z "$existing" ]; then
            echo "no standing PR open — nothing to retire."
            exit 0
          fi
          cat > retire-comment.md <<'EOF'
          Retired by `skill-registry-autofix`: **this reconcile is finished** — a fresh run has
          nothing left to write — so its diff no longer applies.

          Its diff was computed against producer commits that `main` has since moved past (or the rows
          were reconciled by hand). **Merging it would have written superseded digests over the current
          registry** — i.e. it would have RED the gate it was opened to green. That is the decay
          .github#425 is about, and closing it is the response.
          EOF
          # Never "the registry is coherent": with judgement cases outstanding that is false, and the
          # old comment said it anyway. Say only what the gate proved.
          cat retire-note.md >> retire-comment.md
          cat >> retire-comment.md <<'EOF'

          A fresh standing PR opens automatically the next time there is genuinely something to
          reconcile.
          EOF
          gh pr close "$existing" --comment "$(cat retire-comment.md)"
          echo "retired obsolete standing PR #$existing (residual judgement cases: ${RESIDUAL})"

      # Say what actually happened, not what usually happens. With `changed == 'false'` the compose step
      # was SKIPPED, so claiming a body was "composed above" would be one more piece of status text
      # asserting work that never ran — the exact failure this PR is removing from the PR body.
      - name: Dry-run notice
        if: github.event_name == 'workflow_dispatch' && inputs.dry-run == true
        run: |
          if [ "${{ steps.diff.outputs.changed }}" = "true" ]; then
            echo "dry-run: reconcile computed and PR body composed above; branch/PR NOT touched."
            echo "dry-run: a real run would push it, WAIT for the PR's own checks, and merge it only if"
            echo "dry-run: every one of them is green — including \`registry-coherence\`, which is not a"
            echo "dry-run: required check and which native auto-merge would ignore (#642)."
          elif [ "${{ steps.settled.outputs.settled }}" = "true" ]; then
            echo "dry-run: the reconcile is FINISHED (${{ steps.settled.outputs.residual }} judgement case(s) outstanding, which no"
            echo "dry-run: reconcile can resolve) — a real run would RETIRE any open standing PR. Nothing composed."
          else
            echo "dry-run: no reconcile diff, and the reconcile is NOT proven finished — a real run would touch nothing."
            echo "dry-run: (an empty diff from a crashed or blinded check is not evidence of anything.)"
          fi
