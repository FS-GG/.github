# Reusable cross-repo contract-coherence gate (FS-GG/.github#18, epic #16 Pillar 3).
#
# Every FS-GG repo's CI calls this via `workflow_call`. It enforces three things:
#   1. The org registry (FS-GG/.github registry/dependencies.yml) is schema-valid — validated by
#      the TYPED Fsgg.Registry validator (`fsgg-sdd registry validate`) shipped in FS.GG.Contracts
#      via the FS.GG.SDD.Cli tool (SDD#26; 4-segment version grammar fixed in SDD#32 / CLI 0.2.1).
#      The pin tracks the newest published CLI (0.9.0) — see the install step.
#   2. The calling repo's org-shared .NET build config matches the canonical source of truth
#      (shared-build-config@1.0.0) via scripts/sync-build-config.sh --check.
#   3. The build-config source .props are well-formed XML (guards the .github#29 defect class).
#
# EVERY ASSERTION HERE IS A PURE FUNCTION OF COMMITTED FILES, AND THAT IS THE LOAD-BEARING PROPERTY
# (.github#741). This workflow is REUSABLE: six repos call it, so anything it asserts, it asserts as
# a REQUIRED check on every one of their PRs. A failure here is `enforce_admins`-level — not even an
# admin merges past it. So the only safe subject for this gate is state the caller's own PR can fix.
#
# IT USED TO ASSERT A FOURTH THING, AND THAT ONE COULD NOT BE FIXED BY THE CALLER. It checked out
# FS-GG/FS.GG.SDD@main, read `FS.GG.Contracts.fsproj <Version>`, and asserted by strict string
# equality that the registry's `fsgg-contracts` pin equalled it — calling an UNRELEASED BRANCH, in
# its own error message, "the actual FS.GG.Contracts package version". Two defects, one line:
#
#   * IT WEDGED THE ORG ON A BUMP. The assertion coupled `FS-GG/.github@main`'s registry to
#     `FS-GG/FS.GG.SDD@main`'s source, and NO PR SPANS BOTH REPOS. Bump SDD first and every caller
#     goes red the instant it merges; advance the registry first and every `.github` PR wedges
#     instead. There was no landing order without a red window, and SDD calls this workflow too —
#     so a bare source bump wedged SDD's OWN merges (FS.GG.SDD#432).
#   * IT WAS VACUOUSLY GREEN. `main` is not a release and a source tree is not a package. When
#     SDD#426 grew the Contracts public surface under an unchanged `2.0.0`, the `.nupkg` on the feed
#     and the source labelled `2.0.0` became different artifacts — and this gate printed
#     `ok: ... == actual package version == 2.0.0`. Epic #266's signature: a confident verdict about
#     a subject the code could not see.
#
# THE COUPLING DID NOT GO AWAY — IT MOVED TO WHERE IT CANNOT WEDGE ANYONE (source-coherence.yml,
# `.github`-local: path-filtered PR + push + daily schedule, the shape feed-coherence.yml already
# uses). Registry-vs-reality is asserted there, against the two subjects that are real: SDD's source
# (source-coherence.yml) and the live feed (feed-coherence.yml). A red there reds `.github@main`,
# which is the repo that owns the registry and can actually fix it. DO NOT ADD AN ASSERTION BACK
# HERE THAT DEPENDS ON ANOTHER REPO'S MUTABLE `main`, OR ON THE NETWORK BEYOND THIS RUN'S OWN
# RESTORE — a NuGet outage must not be able to wedge six repos' PRs.
#
# The registry + scripts are sourced from FS-GG/.github (public). The typed validator is restored as
# a .NET tool from the org GitHub Packages feed, so every caller MUST grant `packages: read` (the
# run-scoped GITHUB_TOKEN then authenticates the NuGet restore — public package, but the feed still
# requires a token). This is the .github#49 swap from the scripts/validate-registry.py stand-in to
# the typed CLI, which flips coherence id `registry-validator-typed` → coherent:true; it is
# unblocked because the H4 feed/App-token provisioning (#21) is closed. See
# docs/coordination/README.md and ADR-0001.
name: contract-coherence

on:
  workflow_call:
    inputs:
      repo-path:
        description: "Path within the caller's checkout to drift-check (build config)."
        type: string
        default: "."
      check-build-config:
        description: "Run the shared-build-config drift gate against the caller. Set false for repos that are not consumers (e.g. .github itself)."
        type: boolean
        default: true
      github-ref:
        description: "Ref of FS-GG/.github to source the registry + scripts from."
        type: string
        default: "main"
      # `contracts-ref` was REMOVED in .github#741 along with the SDD-source assertion it fed. No
      # caller passed it, so its removal is not a breaking input change — verified at the time
      # against every call site in the org: SDD, Rendering, Governance and Game pass no `with:` at
      # all; Audio (gate.yml) and Templates (composition.yml, NOT gate.yml) pass only
      # `check-build-config: false`; .github's own coherence.yml passes `github-ref`.
      # Do not reinstate it: an input naming another repo's ref is the shape of the coupling this
      # gate is no longer allowed to have — see the header.

permissions:
  contents: read
  packages: read   # restore the typed fsgg-sdd validator (FS.GG.SDD.Cli) from the org feed

jobs:
  coherence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7
        with:
          path: caller

      - name: Checkout FS-GG/.github (registry + scripts authority)
        uses: actions/checkout@v7
        with:
          repository: FS-GG/.github
          ref: ${{ inputs.github-ref }}
          path: dotgithub

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # NOTE: no PyYAML install. It existed ONLY for the removed fsgg-contracts pin assertion
      # (.github#741); the one remaining Python step parses XML with the stdlib. Do not re-add it
      # "just in case" — an unused install is a dependency nobody is watching.

      - name: Set up .NET (for the typed fsgg-sdd validator)
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Install the typed registry validator (fsgg-sdd CLI)
        shell: bash
        env:
          # Public package, but the GitHub Packages NuGet feed still requires a token to restore.
          # Provisioning blocker #21 is closed, so the run-scoped GITHUB_TOKEN (packages: read)
          # resolves FS.GG.SDD.Cli from the org feed. Both values are env-passed (never interpolated
          # into the run script) — the org's uniform anti-injection pattern (cf. architecture-map.yml).
          NUGET_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          dotnet nuget add source "https://nuget.pkg.github.com/FS-GG/index.json" \
            --name fsgg --username "$ACTOR" --password "$NUGET_TOKEN" \
            --store-password-in-clear-text
          # Pin == newest published FS.GG.SDD.Cli on the org feed. Coupled so it can't silently
          # freeze (the .github#127/H2 defect: pin sat at 0.2.1 while the org shipped 0.5.0, so
          # additive-tolerance degraded the typed gate toward a YAML-parses check).
          #
          # H2 RECURRED, and .github#263 found why: `.github`'s own renovate.json carried no feed
          # `hostRules` token, so Renovate could not enumerate FS.GG.* versions here and never
          # opened a bump PR — the pin sat at 0.5.0 while the org shipped 0.6.0, 0.7.0 and 0.8.0.
          #
          # AND THEN IT FROZE TWICE MORE. This block used to end "The token is now in place ... so
          # this literal is bot-managed again, and no longer a release-runbook chore." BOTH HALVES OF
          # THAT ARE NOW FALSE, and saying so here is the point (.github#885):
          #
          #   * THE TOKEN IS GONE, and it was never needed. #576/#735 established that all 32 FS.GG.*
          #     packages are PUBLIC on nuget.org, anonymously readable, at the same newest version. The
          #     `hostRules` block was pointing Renovate at the one registry that needs a credential —
          #     a Mend App Secret that never resolved — and a 401 on a datasource is not an error, it
          #     is an EMPTY VERSION LIST. So the bot detected the dep, enumerated nothing, and opened
          #     nothing. `default.json` now routes FS.GG.* to nuget.org, needing no credential at all.
          #     (CI's restore above is a DIFFERENT mechanism on a different credential — GITHUB_TOKEN
          #     with `packages: read`, against GitHub Packages — and is untouched by that.)
          #
          #   * THE LITERAL IS NOT BOT-MANAGED. That routing fix landed 2026-07-14 and the pin did NOT
          #     bump in the days since, while Renovate ran and correctly DETECTED it (Dependency
          #     Dashboard #54, under `regex`, naming this file). Why is unresolved and is tracked in
          #     .github#576 — which stays OPEN. Every cause the config commits to in writing has been
          #     ruled out; no root cause is named, because asserting an unverified one is exactly the
          #     defect this family keeps repeating.
          #
          # This literal was hand-advanced at 0.2.1 (#127), 0.5.0 (#263), 0.9.0 (#566) and 0.10.0
          # (#885), and froze again after each of the first three. TREAT A RED PIN GATE AS THE SIGNAL
          # IT IS: report the freeze on #576. Do not hand-advance it a sixth time on the assumption
          # that someone once decided this is bot-managed — this comment is what that assumption was
          # made of, and it was wrong for two of the four freezes.
          #
          # pin-coherence.yml gates both halves daily: that this literal equals feed-newest, and that
          # the bot is still configured to keep it there. If the annotation below is reworded or moved,
          # or the pin is deleted, pin-coherence.yml fails — it is named in that gate's REQUIRED_PINS.
          # Do not "fix" a red pin gate by deleting it.
          #
          # ADVANCED 0.12.0 → 0.13.0 (.github#1114, SDD#508 step 3) — and this is NOT the sixth
          # hand-advance the warning above forbids. That warning is about advancing the pin to GREEN a
          # frozen-bot gate (#576) on the false belief it is bot-managed. This advance is the ADR-0037
          # step-2 obligation: the schemaVersion 1→2 bump in registry/dependencies.yml makes `consumers`
          # "required, may be empty", and only FS.GG.SDD.Cli 0.13.0 (SDD#516, three-state validator)
          # ACCEPTS the resulting `consumers: []` — 0.12.0 refuses it (MissingField), measured. The pin
          # is coupled to the schema, so it moves WITH the schema. #576 (bot freeze) stays open and
          # unrelated; a red pin gate absent a schema bump is still a #576 report, not a hand-advance.
          #
          # ADVANCED 0.13.0 → 0.17.0 (.github#1230, ADR-0054 step 2), THEN 0.17.0 → 0.18.x (ADR-0057
          # step 2): 0.18.x teaches Fsgg.Registry the `operator` token (0.17.0 REJECTS a `scope:
          # operator` row exactly as 0.15.0 rejected `driver`), paired with the skills.yml `schemaVersion`
          # 2→3 + `skill-registry.version` 2→3 bump. Until FS.GG.SDD publishes 0.18.x this install FAILS
          # (version not on the feed) — this flip is BLOCKED on that publish by design (ADR-0037 order).
          # Neither advance is the sixth hand-advance the warning above forbids, on the same grounds as
          # the 0.13.0 advance:
          # it is the ADR-0037 step-2 obligation coupled to a schema bump, not a bid to GREEN #576.
          # registry/skills.yml grows a third `skill-registry` class — a `.github`-authored, product-
          # materialized `scope: driver` row (`workRoadmap`, ADR-0054/#1224) — and pays the OWED
          # skills.yml `schemaVersion` 1→2 + `skill-registry.version` 1→2 bump (the `mirrored` debt,
          # #658/#686). Only FS.GG.SDD.Cli 0.17.0 (SDD#595) teaches Fsgg.Registry the driver vocabulary:
          # 0.15.0 REJECTS a `scope: driver` row (`unknown 'scope': 'driver' (expected 'process' or
          # 'product')`), 0.17.0 ACCEPTS it (`… 'process', 'product', or 'driver'`) — measured. Per
          # ADR-0037 §3 the new validator still accepts skills.yml AS IT STOOD (schemaVersion 1 +
          # `mirrored`), verified before this flip. 0.17.0 is feed-newest (the combined SDD#595 release
          # also carrying Contracts 4.0.0), so pin == newest and pin-coherence stays green.
          # `versioning=loose`, NOT the manager default `nuget`, and this token is load-bearing (#576).
          # Under nuget versioning a BARE literal is a RANGE, not a peg: `0.14.0` parses as `>=0.14.0`,
          # which the newest release ALWAYS satisfies. So Renovate resolved currentVersion to the newest,
          # found the constraint already met, and proposed NOTHING — measured against renovate@latest
          # --platform=local: currentValue 0.10.0 -> currentVersion 0.13.0, updates: []. That, not the
          # credential/route/casing this file's comments chased, is why the pin froze at every hand-advance
          # (#127/#263/#566/#886): bump the floor to newest and `>=newest` is trivially satisfied again.
          # `loose` treats the literal as a single version (and tolerates SDD's 4-segment grammar, which
          # strict semver rejects), so 0.13.0 -> 0.14.0 is a real update the bot will open. Do NOT drop
          # this token back to the default without re-reading #576.
          #
          # KEEP the annotation below immediately above the pin, with NO comment between the two. The org
          # preset's customManager captures the version within {0,1} lines of the annotation, so a comment
          # in that gap shadows the pin with a version-shaped literal from the prose — the `0.14.0` above
          # was captured in place of the real pin until this block was moved above the annotation (#1236).
          # renovate: datasource=nuget depName=FS.GG.SDD.Cli versioning=loose
          dotnet tool install --global FS.GG.SDD.Cli --version 0.18.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Assert build-config source .props are well-formed XML
        shell: bash
        run: |
          # Source-of-truth guard (.github#29): a malformed-but-verbatim .props passes the
          # byte-for-byte drift check yet breaks every adopter's restore (MSB4024). Catch it
          # at the source on every coherence run, for every caller.
          set -euo pipefail
          for f in dotgithub/dist/dotnet/*.props; do
            [ -f "$f" ] || continue
            python -c 'import sys,xml.dom.minidom; xml.dom.minidom.parse(sys.argv[1])' "$f"
            echo "ok (well-formed): $f"
          done

      - name: Validate registry schema (typed Fsgg.Registry validator)
        shell: bash
        run: |
          # Schema authority: FS.GG.Contracts' typed RegistryDocument.load + validateDocument
          # (SDD#26), shipped in the fsgg-sdd CLI. Replaces the scripts/validate-registry.py
          # stand-in (.github#49 → coherence id registry-validator-typed: coherent:true). The
          # 4-segment version grammar (e.g. governance-reference-gate-set 1.2.1.1, ADR-0007) is
          # accepted as of CLI 0.2.1 (SDD#32).
          fsgg-sdd registry validate dotgithub/registry/dependencies.yml --text

      - name: Build-config drift gate
        if: ${{ inputs.check-build-config }}
        shell: bash
        run: |
          bash dotgithub/scripts/sync-build-config.sh --check "caller/${{ inputs.repo-path }}"
