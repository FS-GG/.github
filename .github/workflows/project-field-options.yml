name: project-field-options

# The two path lists below are duplicated verbatim; keep them identical.  Both include the two F#
# sources this job actually reads, not just the tool and its docs:
#   * RepoScope.fs — the Repo Scope check scrapes `RepoScope.resolve` on EVERY run, including the
#     offline `--schema` one, so before this was listed an Options.fs edit could red this workflow
#     without ever triggering it (.github#1588).
#   * Types.fs — the `Phase` check reads the engine's closed union and its wire renderer directly,
#     while the `Class` check compares a three-value transcription from `ItemClass`.  This trigger
#     puts both gates in front of whoever edits either vocabulary.
on:
  pull_request:
    paths:
      - "registry/repos.yml"
      - "scripts/project-field-options"
      - "docs/coordination/board-schema.md"
      - "docs/coordination/board-schema-snapshots/**"
      - ".claude/skills/cross-repo-coordination/SKILL.md"
      - ".agents/skills/cross-repo-coordination/SKILL.md"
      - "src/FS.GG.Coord.Core/RepoScope.fs"
      - "src/FS.GG.Coord.Core/Types.fs"
      - "tests/project-field-options/**"
      - ".github/workflows/project-field-options.yml"
  push:
    branches: [main]
    paths:
      - "registry/repos.yml"
      - "scripts/project-field-options"
      - "docs/coordination/board-schema.md"
      - "docs/coordination/board-schema-snapshots/**"
      - ".claude/skills/cross-repo-coordination/SKILL.md"
      - ".agents/skills/cross-repo-coordination/SKILL.md"
      - "src/FS.GG.Coord.Core/RepoScope.fs"
      - "src/FS.GG.Coord.Core/Types.fs"
      - "tests/project-field-options/**"
      - ".github/workflows/project-field-options.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: project-field-options-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Exercise guarded migration and recovery
        run: bash tests/project-field-options/run.sh
      - name: Check roster against documented Repo Scope schema
        run: scripts/project-field-options check --schema docs/coordination/board-schema.md
      # `--schema` is not a convenience here: this job has `permissions: contents: read` and no
      # Projects credential, so the live form cannot run.  The offline form is the only one CI can
      # execute, and it is enough — the drift being gated is between two files in this checkout.
      - name: Check documented Class schema against the closed ItemClass vocabulary
        run: scripts/project-field-options check --field Class --schema docs/coordination/board-schema.md
      - name: Check documented Kind schema against the closed ItemKind vocabulary
        run: scripts/project-field-options check --field Kind --schema docs/coordination/board-schema.md
      - name: Check documented Severity schema against the closed ordered vocabulary
        run: scripts/project-field-options check --field Severity --schema docs/coordination/board-schema.md
      - name: Check documented Phase schema against the engine Phase vocabulary
        run: scripts/project-field-options check --field Phase --schema docs/coordination/board-schema.md
