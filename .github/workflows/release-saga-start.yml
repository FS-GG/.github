name: release-saga-start

# The operator-facing entry point for the .github coherent set. This workflow owns the causal edge
# that prose used to leave to an operator: prepared immutable bytes MUST exist before any component
# publisher starts. Fresh publication and partial recovery deliberately enter through the same graph.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact 40-character source commit; empty means the selected ref's commit"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      # Draft releases are intentionally visible only to tokens with push-level repository access.
      # Read-only inspection mistakes an existing draft for an absent release and needlessly enters
      # preparation, even though preparation's byte-equivalence check still prevents replacement.
      contents: write
    outputs:
      action: ${{ steps.state.outputs.action }}
      source-sha: ${{ steps.state.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Resolve durable saga state
        id: state
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ inputs.source_sha != '' && inputs.source_sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::source_sha must resolve to an exact 40-character lowercase commit"; exit 1; }
          version="$(dotnet msbuild src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj -getProperty:Version | tr -d '[:space:]')"
          case "$version" in ''|*-*) echo "::error::a non-empty stable version is required"; exit 1;; esac
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          tag="coherent-set/v$version"
          if ! release="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft 2>/dev/null)"; then
            echo "action=prepare" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          # Identity verification is deliberately also a byte-identity verification. The manifest's
          # package paths are relative to its directory, so every manifest-bound package must be
          # present even when the release is already promoted and this run will only return complete.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern release-manifest.json --pattern "*.nupkg" --dir "$work"
          if jq -e '.descriptor.bridgeQualification != null' "$work/release-manifest.json" >/dev/null; then
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
              --pattern gs2-08-7-bridge-qualification.json --dir "$work"
          fi
          python3 scripts/release-saga.py assert-identity \
            --manifest "$work/release-manifest.json" --release-id "github:$version" \
            --version "$version" --source-sha "$SOURCE_SHA" --policy-version release-saga/1
          if [ "$(jq -r '.isDraft' <<< "$release")" = true ]; then
            echo "action=resume" >> "$GITHUB_OUTPUT"
          else
            echo "action=complete" >> "$GITHUB_OUTPUT"
          fi

  prepare:
    needs: inspect
    if: needs.inspect.outputs.action == 'prepare'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/release-saga-prepare.yml
    with:
      source-sha: ${{ needs.inspect.outputs.source-sha }}

  start-publishers:
    needs: [inspect, prepare]
    # `always()` is required only because `prepare` is deliberately skipped for a stored draft.
    # The explicit state/result conjunction is the safety property: fresh state cannot reach a tag
    # write unless preparation succeeded, while recovery never re-packs authoritative stored bytes.
    if: >-
      always() && !cancelled() &&
      (needs.inspect.outputs.action == 'resume' ||
       (needs.inspect.outputs.action == 'prepare' && needs.prepare.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.inspect.outputs.source-sha }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Atomically tag fresh members and exact-source resume existing members
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ needs.inspect.outputs.source-sha }}
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] \
            || { echo "::error::source_sha must resolve to an exact 40-character lowercase commit"; exit 1; }
          git cat-file -e "$SOURCE_SHA^{commit}"
          version="$(dotnet msbuild src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj -getProperty:Version | tr -d '[:space:]')"
          case "$version" in ''|*-*) echo "::error::a non-empty stable version is required"; exit 1;; esac

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          push_refs=()
          existing_tags=0
          classify() {
            local tag="$1" tagged
            tagged="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
              "refs/tags/$tag" "refs/tags/$tag^{}" \
              | awk -v p="refs/tags/$tag^{}" -v b="refs/tags/$tag" \
                  '$2==p {peeled=$1} $2==b {plain=$1} END {print (length(peeled) ? peeled : plain)}')"
            if [ -z "$tagged" ]; then
              git tag -a "$tag" "$SOURCE_SHA" -m "Publish FS.GG coherent set $version from prepared source $SOURCE_SHA"
              push_refs+=("refs/tags/$tag")
            elif [ "$tagged" = "$SOURCE_SHA" ]; then
              existing_tags=$((existing_tags + 1))
            else
              echo "::error::$tag names $tagged, not prepared source $SOURCE_SHA"
              exit 1
            fi
          }

          classify "kit/v$version"
          classify "drivers/v$version"
          classify "coord-engine/v$version"

          # GITHUB_TOKEN supplies contents:write to the checkout and the atomic push. GitHub deliberately
          # suppresses push-triggered workflows for tags created by this token, so the push only establishes
          # all absent immutable identities as one state transition; explicit dispatch below starts work.
          if [ "${#push_refs[@]}" -gt 0 ]; then
            git push --atomic origin "${push_refs[@]}"
          fi

          # workflow_dispatch and repository_dispatch are the documented recursion exceptions for
          # GITHUB_TOKEN. Dispatch every component exactly once after fresh and recovery tag validation;
          # each publisher remains exact-source bound and idempotently resumes its durable journal.
          for workflow in release-kit.yml release-drivers.yml release-coord-engine.yml; do
            gh workflow run "$workflow" --repo "$GITHUB_REPOSITORY" --ref main \
              -f source_sha="$SOURCE_SHA"
          done
          gh api --method POST \
            "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=release-saga-reconcile \
            -F "client_payload[source_sha]=$SOURCE_SHA"

          {
            echo "### Coherent-set publishers started"
            echo "- Version: $version"
            echo "- Prepared source: $SOURCE_SHA"
            echo "- Fresh immutable tags: ${#push_refs[@]}"
            echo "- Existing exact-source tags: $existing_tags"
            echo "- Explicit publisher dispatches: 3"
          } >> "$GITHUB_STEP_SUMMARY"
