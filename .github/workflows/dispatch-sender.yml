# GS2-08.9 retirement boundary.
#
# This reusable workflow deliberately has no credential use and no remote effect. It preserves the
# useful payload/target validation for callers that still resolve the current workflow revision. The
# optional secret declarations are an input-compatibility shim for existing callers and are never read. A
# caller pinned to an older commit resolves those historical bytes instead; disabling that capability
# requires revoking the shared dispatch App credentials/installation outside this repository.
name: dispatch-sender (retired writer; validation only)

on:
  workflow_call:
    inputs:
      target-repo:
        description: "owner/name that would have received the repository_dispatch."
        type: string
        required: true
      event-type:
        description: "repository_dispatch event_type to validate."
        type: string
        required: true
      version:
        description: "Version that would have been advertised."
        type: string
        required: true
      payload:
        description: "Optional extra JSON object to validate."
        type: string
        default: "{}"
    secrets:
      app-id:
        description: "Deprecated and unused; retained temporarily for caller compatibility."
        required: false
      app-private-key:
        description: "Deprecated and unused; retained temporarily for caller compatibility."
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Retired dispatch request validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the retired dispatch request locally
        shell: bash
        env:
          TARGET: ${{ inputs.target-repo }}
          EVENT_TYPE: ${{ inputs.event-type }}
          VERSION: ${{ inputs.version }}
          PAYLOAD: ${{ inputs.payload }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$EVENT_TYPE" =~ ^[A-Za-z0-9_.-]+$ ]]
          [ -n "$VERSION" ]
          jq -e 'type == "object"' <<<"$PAYLOAD" >/dev/null
          jq -n \
            --arg event_type "$EVENT_TYPE" \
            --arg version "$VERSION" \
            --arg target "$TARGET" \
            --argjson extra "$PAYLOAD" \
            '{target:$target,event_type:$event_type,client_payload:({version:$version}+$extra)}'
          echo "GS2-08.9: validated only; no token was minted and no repository_dispatch was sent."
