name: release-successor-publish

# Single-operator publication for the selected current coherent source, with separate
# fixed historical recovery/install-only routes. Their original version/journal bindings
# remain unchanged; current source preparation grants no publication effect.
on:
  workflow_dispatch:
    inputs:
      install_release_suspension:
        description: Install only the fixed source-owned suspension; never publishes
        required: true
        default: false
        type: boolean
      expected_authority_main:
        description: Exact reviewed Authority parent, only for install-only selection
        required: false
        default: ''
        type: string
      candidate_run_id:
        description: Successful first-attempt candidate workflow run ID
        required: false
        default: ''
        type: string
      candidate_artifact_id:
        description: Exact retained Actions candidate artifact ID
        required: false
        default: ''
        type: string
      candidate_archive_sha256:
        description: SHA-256 of the raw Actions artifact archive
        required: false
        default: ''
        type: string
      publish:
        description: Publish only after exact source and effect admission; bounded recovery also requires true
        required: true
        default: false
        type: boolean

      continue_original_0104_checkpoint:
        description: One-use fixed original .104 checkpoint remainder; no package sends
        required: true
        default: false
        type: boolean

      qualify_original_tag_authentication_only:
        description: Inactive source-prepared authentication-only route; acquires no credentials
        required: true
        default: false
        type: boolean

      suspended_0103_successor:
        description: Literal .104/utel-rel-22 only, requiring the installed release-specific .103 suspension
        required: true
        default: false
        type: boolean

      original_0103_candidate:
        description: Select only the accepted original .103 candidate on a compatible descendant publisher
        required: true
        default: false
        type: boolean

      recover_original_0103_tag_intent:
        description: Fixed original generation2 tag intent; matched settlement or approved create only, incomplete checkpoint
        required: true
        default: false
        type: boolean

      recovery_checkpoint:
        description: Recover the retained journal19 candidate for at most four advances; checkpoint is incomplete
        required: true
        default: false
        type: boolean

      repeat_original_nuget_kit_intent:
        description: Explicit original Kit intent repeat under uncertainty; at most one nuget.org send, incomplete checkpoint
        required: true
        default: false
        type: boolean

      recover_original_runtime_intent:
        description: Fixed original generation26 runtime intent; one original-byte upload or matched settlement, incomplete checkpoint
        required: true
        default: false
        type: boolean

      recover_original_successor_checkpoint:
        description: Bounded original .102 journal20 continuation; no resend of an unresolved intent
        required: true
        default: false
        type: boolean
      expected_checkpoint:
        description: Exact admitted generation, logicalHead and stateSHA256 JSON for selected .102 or .104 continuation
        required: false
        default: ''
        type: string

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && github.actor == 'EHotwagner' && inputs.install_release_suspension != true
    runs-on: ubuntu-latest
    environment: release-successor
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire org publication writer lock
        uses: ./.github/actions/publication-writer-lock
        with:
          max-wait-minutes: 30
      - name: Validate the complete selected mode before any credential exchange
        env:
          FSGG_RELEASE_INPUTS: ${{ toJSON(inputs) }}
        run: python3 scripts/release-successor-publish.py --check-workflow-inputs
      - name: Read the installed release suspension before any credential exchange
        if: inputs.qualify_original_tag_authentication_only != true
        env:
          GH_TOKEN: ${{ github.token }}
          CONTINUE_ORIGINAL_0104_CHECKPOINT: ${{ inputs.continue_original_0104_checkpoint }}
          SUSPENDED_0103_SUCCESSOR: ${{ inputs.suspended_0103_successor }}
          ORIGINAL_0103_CANDIDATE: ${{ inputs.original_0103_candidate }}
          RECOVER_ORIGINAL_0103_TAG_INTENT: ${{ inputs.recover_original_0103_tag_intent }}
          RECOVERY_CHECKPOINT: ${{ inputs.recovery_checkpoint }}
          REPEAT_ORIGINAL_NUGET_KIT_INTENT: ${{ inputs.repeat_original_nuget_kit_intent }}
          RECOVER_ORIGINAL_RUNTIME_INTENT: ${{ inputs.recover_original_runtime_intent }}
          RECOVER_ORIGINAL_SUCCESSOR_CHECKPOINT: ${{ inputs.recover_original_successor_checkpoint }}
        run: |
          set -euo pipefail
          profile=()
          if test "$CONTINUE_ORIGINAL_0104_CHECKPOINT" = true; then profile+=(--continue-original-0104-checkpoint); fi
          if test "$SUSPENDED_0103_SUCCESSOR" = true; then profile+=(--suspended-0103-successor); fi
          if test "$ORIGINAL_0103_CANDIDATE" = true; then profile+=(--original-0103-candidate); fi
          if test "$RECOVER_ORIGINAL_0103_TAG_INTENT" = true; then profile+=(--recover-original-0103-tag-intent); fi
          if test "$RECOVERY_CHECKPOINT" = true; then profile+=(--recovery-checkpoint); fi
          if test "$REPEAT_ORIGINAL_NUGET_KIT_INTENT" = true; then profile+=(--repeat-original-nuget-kit-intent); fi
          if test "$RECOVER_ORIGINAL_RUNTIME_INTENT" = true; then profile+=(--recover-original-runtime-intent); fi
          if test "$RECOVER_ORIGINAL_SUCCESSOR_CHECKPOINT" = true; then profile+=(--recover-original-successor-checkpoint); fi
          python3 scripts/release-successor-publish.py --check-release-suspension "${profile[@]}"
      - uses: actions/setup-dotnet@v6
        if: inputs.qualify_original_tag_authentication_only != true
        with:
          global-json-file: global.json
      - name: Qualify successor effect ordering and protected journal locally
        if: inputs.qualify_original_tag_authentication_only != true
        run: |
          set -euo pipefail
          python3 tests/release-successor-execution/run.py
          python3 tests/release-successor-journal/run.py
          python3 tests/release-successor-live/run.py
          python3 tests/release-successor-recovery/run.py
          python3 tests/release-successor-authentication/run.py --current-source-suspension
      - name: Select the inactive authentication-only route before credential acquisition
        if: inputs.qualify_original_tag_authentication_only == true
        run: |
          set -euo pipefail
          python3 scripts/release-successor-publish.py \
            --qualify-original-tag-authentication-only \
            --result-path "$RUNNER_TEMP/release-successor-result.json"
      - name: Refuse the inert original-tag factory before any credential exchange
        if: inputs.recover_original_0103_tag_intent == true
        run: |
          set -euo pipefail
          python3 scripts/release-successor-publish.py \
            --refuse-original-tag-factory-inactive \
            --result-path "$RUNNER_TEMP/release-successor-result.json"
      - name: Mint the ordinary protected-journal writer token
        if: inputs.qualify_original_tag_authentication_only != true
        id: ledger
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.FSGG_ORDINARY_LEDGER_APP_ID }}
          private-key: ${{ secrets.FSGG_ORDINARY_LEDGER_APP_PRIVATE_KEY }}
          owner: FS-GG
          repositories: FS.GG.Coordination.Authority
          permission-contents: write
      - name: Bind the proved installation
        if: inputs.qualify_original_tag_authentication_only != true
        env:
          ACTUAL_INSTALLATION_ID: ${{ steps.ledger.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.FSGG_ORDINARY_LEDGER_INSTALLATION_ID }}
        run: test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"
      - name: Exchange nuget.org trusted publishing identity
        if: inputs.qualify_original_tag_authentication_only != true && inputs.continue_original_0104_checkpoint != true
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Paradigma11
      - name: Run the selected exact-candidate publication or bounded recovery profile
        if: inputs.qualify_original_tag_authentication_only != true
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
          ORDINARY_LEDGER_TOKEN: ${{ steps.ledger.outputs.token }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          PUBLISH: ${{ inputs.publish }}
          CONTINUE_ORIGINAL_0104_CHECKPOINT: ${{ inputs.continue_original_0104_checkpoint }}
          SUSPENDED_0103_SUCCESSOR: ${{ inputs.suspended_0103_successor }}
          ORIGINAL_0103_CANDIDATE: ${{ inputs.original_0103_candidate }}
          RECOVER_ORIGINAL_0103_TAG_INTENT: ${{ inputs.recover_original_0103_tag_intent }}
          RECOVERY_CHECKPOINT: ${{ inputs.recovery_checkpoint }}
          REPEAT_ORIGINAL_NUGET_KIT_INTENT: ${{ inputs.repeat_original_nuget_kit_intent }}
          RECOVER_ORIGINAL_RUNTIME_INTENT: ${{ inputs.recover_original_runtime_intent }}
          RECOVER_ORIGINAL_SUCCESSOR_CHECKPOINT: ${{ inputs.recover_original_successor_checkpoint }}
          EXPECTED_CHECKPOINT: ${{ inputs.expected_checkpoint }}
        run: |
          set -euo pipefail
          mode=--preflight-only
          if test "$PUBLISH" = true; then mode=--publish; fi
          profile=()
          if test "$SUSPENDED_0103_SUCCESSOR" = true; then
            profile+=(--suspended-0103-successor)
          fi
          if test "$RECOVER_ORIGINAL_0103_TAG_INTENT" = true; then
            profile+=(--recover-original-0103-tag-intent)
          fi
          if test "$ORIGINAL_0103_CANDIDATE" = true; then
            profile+=(--original-0103-candidate)
          fi
          if test "$RECOVERY_CHECKPOINT" = true; then
            profile+=(--recovery-checkpoint)
          fi
          if test "$REPEAT_ORIGINAL_NUGET_KIT_INTENT" = true; then
            profile+=(--repeat-original-nuget-kit-intent)
          fi
          if test "$RECOVER_ORIGINAL_RUNTIME_INTENT" = true; then
            profile+=(--recover-original-runtime-intent)
          fi
          checkpoint=()
          if test "$CONTINUE_ORIGINAL_0104_CHECKPOINT" = true; then
            profile+=(--continue-original-0104-checkpoint)
            checkpoint=(--expected-checkpoint "$EXPECTED_CHECKPOINT")
          elif test "$RECOVER_ORIGINAL_SUCCESSOR_CHECKPOINT" = true; then
            profile+=(--recover-original-successor-checkpoint)
            checkpoint=(--expected-checkpoint "$EXPECTED_CHECKPOINT")
          elif test -n "$EXPECTED_CHECKPOINT"; then
            echo 'Expected checkpoint requires a selected continuation.' >&2
            exit 1
          fi
          python3 scripts/release-successor-publish.py \
            "$mode" "${profile[@]}" "${checkpoint[@]}" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --workdir "$RUNNER_TEMP/release-successor" \
            --result-path "$RUNNER_TEMP/release-successor-result.json"
      - name: Retain the exact bounded result, including failures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-successor-result
          path: |
            ${{ runner.temp }}/release-successor-result.json
            ${{ runner.temp }}/release-successor-result-kit-repeat-attempt.json
            ${{ runner.temp }}/release-successor-result-runtime-recovery-attempt.json
            ${{ runner.temp }}/release-successor-result-original-tag-attempt.json
            ${{ runner.temp }}/release-successor-result-continuation-*.json
          if-no-files-found: error
      - name: Report the actual publication disposition
        if: steps.publication.outcome == 'success'
        env:
          DISPOSITION: ${{ steps.publication.outputs.disposition }}
          PUBLICATION_COMPLETE: ${{ steps.publication.outputs.publication_complete }}
        run: |
          printf 'Publication disposition: %s; publicationComplete=%s\n' "$DISPOSITION" "$PUBLICATION_COMPLETE" >> "$GITHUB_STEP_SUMMARY"
          if test "$DISPOSITION" = checkpoint; then
            echo 'Bounded recovery checkpoint retained. Publication and receiver acceptance remain incomplete.' >> "$GITHUB_STEP_SUMMARY"
          fi

  install-suspension:
    if: inputs.install_release_suspension == true
    runs-on: ubuntu-latest
    environment: release-successor
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    env:
      FSGG_RELEASE_INPUTS: ${{ toJSON(inputs) }}
      GH_TOKEN: ${{ github.token }}
      ORDINARY_LEDGER_APP_ID: ${{ vars.FSGG_ORDINARY_LEDGER_APP_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Acquire org publication writer lock
        uses: ./.github/actions/publication-writer-lock
        with:
          max-wait-minutes: 5
      - name: Validate the complete install-only selection before issuer access
        run: python3 scripts/release-successor-publish.py --check-workflow-inputs
      - name: Prepare the fixed suspension and authenticate native owner and Authority state
        id: prepared
        run: python3 scripts/release-successor-publish.py --prepare-hosted-release-suspension
      - name: Mint only the existing ordinary Authority writer
        id: ledger
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.FSGG_ORDINARY_LEDGER_APP_ID }}
          private-key: ${{ secrets.FSGG_ORDINARY_LEDGER_APP_PRIVATE_KEY }}
          owner: FS-GG
          repositories: FS.GG.Coordination.Authority
          permission-contents: write
      - name: Install only the prepared source-owned suspension
        env:
          ORDINARY_LEDGER_TOKEN: ${{ steps.ledger.outputs.token }}
          ACTUAL_INSTALLATION_ID: ${{ steps.ledger.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.FSGG_ORDINARY_LEDGER_INSTALLATION_ID }}
          PREPARED_SHA256: ${{ steps.prepared.outputs.prepared_sha256 }}
        run: |
          set -euo pipefail
          python3 scripts/release-successor-publish.py --install-hosted-release-suspension \
            --prepared-sha256 "$PREPARED_SHA256"
      - name: Retain the explicit install-only result independently of success
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-successor-result
          path: ${{ runner.temp }}/release-successor-result.json
          if-no-files-found: error
