name: release-new-sdd-workspace-successor-candidate

# Fresh Creator021 release qualification reuses genuine promoted110 dependency bytes.
# Candidate evidence never grants effects; the current publisher independently authenticates it.
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: read
concurrency:
  group: release-new-sdd-workspace-successor-candidate
  cancel-in-progress: false
jobs:
  candidate:
    name: new-sdd-workspace-021-release-candidate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Refuse missing promoted dependency pin before SDK or graph qualification
        run: python3 scripts/creator-current-coord-dependencies.py preflight
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Bind exact protected source and unused version
        env:
          SOURCE_SHA: ${{ github.sha }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = FS-GG/.github
          test "$GITHUB_EVENT_NAME" = workflow_dispatch
          test "$GITHUB_REF" = refs/heads/main
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          python3 scripts/new_sdd_workspace_successor_admission.py
          version="$(dotnet msbuild scripts/NewSddWorkspace/NewSddWorkspace.fsproj -getProperty:Version | tr -d '[:space:]')"
          test "$version" = 0.21.0
          test -z "$(git ls-remote --tags origin refs/tags/new-sdd-workspace/v0.21.0)"
          response="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            https://api.nuget.org/v3-flatcontainer/fs.gg.newsddworkspace/0.21.0/fs.gg.newsddworkspace.0.21.0.nupkg)"
          test "$response" = 404
          response="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            -u "$GITHUB_ACTOR:$GITHUB_TOKEN" \
            https://nuget.pkg.github.com/FS-GG/download/fs.gg.newsddworkspace/0.21.0/fs.gg.newsddworkspace.0.21.0.nupkg)"
          test "$response" = 404
      - name: Refuse mismatched Creator profiles before costly graph qualification
        run: python3 tests/new-sdd-workspace-successor/run.py
      - name: Acquire verified promoted originals into fresh isolated checkouts
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/creator021-published-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          test ! -e "$work"
          mkdir -m 700 "$work"
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$work/creator"
          git -C "$work/creator" checkout --detach "$GITHUB_SHA"
          producer_sha="$(python3 -c 'import json; print(json.load(open("scripts/creator021-coord-dependencies.json"))["sourceSha"])')"
          git clone --no-hardlinks --no-checkout "$GITHUB_WORKSPACE" "$work/producer"
          git -C "$work/producer" checkout --detach "$producer_sha"
          python3 "$work/creator/scripts/creator-current-coord-dependencies.py" acquire --package "$work/producer.nupkg"
          python3 "$work/creator/scripts/creator-current-coord-dependencies.py" stage \
            --producer-source "$work/producer" --dependencies "$work/dependencies" --package "$work/producer.nupkg"
          echo "CREATOR_PUBLISHED_ROOT=$work" >> "$GITHUB_ENV"
      - name: Qualify wizard published dependency mode and pack same output
        env:
          FSGG_CREATOR_DEPENDENCY_MODE: published-dependency
        run: |
          set -euo pipefail
          work="$CREATOR_PUBLISHED_ROOT"
          export FSGG_CREATOR_PRODUCER_SOURCE="$work/producer"
          export FSGG_CREATOR_DEPENDENCIES="$work/dependencies"
          export FSGG_CREATOR_CALLER_ROOT="$GITHUB_WORKSPACE"
          export FSGG_CREATOR_SOURCE_ARTIFACTS="$work/fixture-state"
          bash "$work/creator/tests/new-sdd-workspace/run.sh"
          output="$work/creator/scripts/NewSddWorkspace/bin/Release/net10.0"
          dotnet fsi --lib:"$output" --reference:"$output/new-sdd-workspace.dll" \
            --reference:"$output/fsgg-coord-engine.dll" --reference:"$output/FS.GG.Coord.GitHub.dll" \
            --reference:"$output/FS.GG.Coord.Core.dll" --exec "$work/creator/tests/new-sdd-workspace/product-board.fsx"
          mkdir -p artifacts/new-sdd-workspace
          dotnet pack "$work/creator/scripts/NewSddWorkspace/NewSddWorkspace.fsproj" -c Release --no-build \
            -p:FsggCurrentCoordDependencies=true -p:BuildProjectReferences=false \
            -p:CompileUsingReferenceAssemblies=false \
            -p:FsggFrozenCoordSource="$work/producer" -p:FsggFrozenCoordDependencies="$work/dependencies" \
            -p:RepositoryCommit="$GITHUB_SHA" -o "$GITHUB_WORKSPACE/artifacts/new-sdd-workspace"
          package=artifacts/new-sdd-workspace/FS.GG.NewSddWorkspace.0.21.0.nupkg
          manifest=artifacts/new-sdd-workspace/manifest.json
          python3 scripts/new-sdd-workspace-release.py prepare --package "$package" \
            --source-sha "$GITHUB_SHA" --version 0.21.0 --tag new-sdd-workspace/v0.21.0 --output "$manifest"
          python3 scripts/new-sdd-workspace-release.py verify --manifest "$manifest" --package "$package"
          python3 tests/new-sdd-workspace-successor/run.py --release-qualification-021 --board-package "$package" \
            --source-sha "$GITHUB_SHA" --release-manifest "$manifest" \
            --published-coord-dependencies "$work/dependencies" --published-coord-source "$work/producer" \
            --creator-source "$work/creator" > artifacts/new-sdd-workspace/package-evidence.json
      - name: Refuse determining source changes before retaining candidate
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/new_sdd_workspace_successor_admission.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: new-sdd-workspace-successor-candidate-${{ github.sha }}-${{ github.run_id }}
          path: |
            artifacts/new-sdd-workspace/FS.GG.NewSddWorkspace.0.21.0.nupkg
            artifacts/new-sdd-workspace/manifest.json
            artifacts/new-sdd-workspace/package-evidence.json
          if-no-files-found: error
          retention-days: 90
