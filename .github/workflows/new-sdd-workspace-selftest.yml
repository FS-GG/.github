# Self-test for `parse` in scripts/NewSddWorkspace/Program.fs — the new-sdd-workspace CLI arg parser.
#
# Runs tests/new-sdd-workspace/run.sh, which builds the REAL CLI and drives it end-to-end, reading the
# parse result off main's exit-code contract (exit 2 = rejected, exit 127 = accepted → fsgg-sdd
# preflight). It pins the .github#388 grammar: --profile/--ref no longer swallow a following flag as a
# value, and an unknown --profile is refused on the CLI path. `parse` is pure and was previously
# untested; this guards it the same way the other *-selftest workflows guard their scripts.
#
# It also became the gate that PROVES the scaffolder's locked restore (#609). Until .github consumed
# the build config it authors, this project had no packages.lock.json at all — so the org's
# lockfile-restore-enforcement rule (ADR-0006) simply did not reach the tool that scaffolds every FS-GG
# workspace: a silent version substitution in it would have failed nothing. It has a lock now, and the
# inherited RestoreLockedMode arms it here. Hence the build config in the trigger list, both halves of
# it: the root Directory.Build.props IMPORTS dist/dotnet/Directory.Build.props, so an edit to the
# org-shared file changes this build.
name: new-sdd-workspace-selftest

on:
  pull_request:
    paths:
      - "scripts/NewSddWorkspace/**"
      - "scripts/creator-current-coord-dependencies.*"
      - "scripts/creator_source_qualification.py"
      - "scripts/creator-frozen-coord-dependencies.*"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "tests/new-sdd-workspace/**"
      - "tests/new-sdd-workspace-successor/**"
      - "tests/release-effect-sealing/**"
      - "tests/release-successor-execution/**"
      - "tests/release-successor-journal/**"
      - "scripts/new-sdd-workspace-*.py"
      - "scripts/new_sdd_workspace_successor_*.py"
      - "scripts/release_successor_*.py"
      - ".github/workflows/release-new-sdd-workspace*.yml"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/new-sdd-workspace-selftest.yml"
      - "work/2968-new-sdd-workspace-0-10-1-release/**"
      - "readiness/2968-new-sdd-workspace-0-10-1-release/**"
  push:
    branches: [main]
    paths:
      - "scripts/NewSddWorkspace/**"
      - "scripts/creator-current-coord-dependencies.*"
      - "scripts/creator_source_qualification.py"
      - "scripts/creator-frozen-coord-dependencies.*"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "src/FS.GG.Telemetry.Client/**"
      - "src/FS.GG.Telemetry.Contracts/**"
      - "src/FS.GG.Telemetry.Dashboard/**"
      - "src/FS.GG.Telemetry.Store/**"
      - "tests/new-sdd-workspace/**"
      - "tests/new-sdd-workspace-successor/**"
      - "tests/release-effect-sealing/**"
      - "tests/release-successor-execution/**"
      - "tests/release-successor-journal/**"
      - "scripts/new-sdd-workspace-*.py"
      - "scripts/new_sdd_workspace_successor_*.py"
      - "scripts/release_successor_*.py"
      - ".github/workflows/release-new-sdd-workspace*.yml"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/new-sdd-workspace-selftest.yml"
      - "work/2968-new-sdd-workspace-0-10-1-release/**"
      - "readiness/2968-new-sdd-workspace-0-10-1-release/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run the new-sdd-workspace parse fixture
        run: |
          python3 tests/new-sdd-workspace-successor/run.py WizardReleaseTests.test_current_source_flows_keep_one_isolated_producer
          export FSGG_CREATOR_SOURCE_ARTIFACTS="$RUNNER_TEMP/creator023-source-build-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          echo "FSGG_CREATOR_SOURCE_ARTIFACTS=$FSGG_CREATOR_SOURCE_ARTIFACTS" >> "$GITHUB_ENV"
          bash tests/new-sdd-workspace/run.sh

      - name: Qualify the compiled product binding and complete driver materialization
        run: |
          dotnet fsi --lib:"$FSGG_CREATOR_SOURCE_ARTIFACTS/bin/NewSddWorkspace/release/" \
            --reference:"$FSGG_CREATOR_SOURCE_ARTIFACTS/bin/NewSddWorkspace/release/new-sdd-workspace.dll" \
            --reference:"$FSGG_CREATOR_SOURCE_ARTIFACTS/bin/NewSddWorkspace/release/fsgg-coord-engine.dll" \
            --reference:"$FSGG_CREATOR_SOURCE_ARTIFACTS/bin/NewSddWorkspace/release/FS.GG.Coord.GitHub.dll" \
            --reference:"$FSGG_CREATOR_SOURCE_ARTIFACTS/bin/NewSddWorkspace/release/FS.GG.Coord.Core.dll" \
            --exec tests/new-sdd-workspace/product-board.fsx

      - name: Qualify Creator 0.23 normal-source package closure
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          package_dir="$RUNNER_TEMP/creator023-source-qualification"
          mkdir "$package_dir"
          dotnet pack scripts/NewSddWorkspace/NewSddWorkspace.fsproj -c Release --no-build \
            --artifacts-path "$FSGG_CREATOR_SOURCE_ARTIFACTS" \
            -p:RepositoryCommit="$SOURCE_SHA" -o "$package_dir"
          package="$package_dir/FS.GG.NewSddWorkspace.0.23.0.nupkg"
          manifest="$package_dir/manifest.json"
          python3 scripts/new-sdd-workspace-release.py prepare --package "$package" \
            --source-sha "$SOURCE_SHA" --version 0.23.0 \
            --tag new-sdd-workspace/v0.23.0 --output "$manifest"
          python3 scripts/new-sdd-workspace-release.py verify --manifest "$manifest" --package "$package"
          python3 tests/new-sdd-workspace-successor/run.py --source-qualification-023 \
            --board-package "$package" --source-sha "$SOURCE_SHA" --release-manifest "$manifest" \
            --build-artifacts "$FSGG_CREATOR_SOURCE_ARTIFACTS" \
            > "$package_dir/package-evidence.json"

      - name: Qualify Wizard successor identity, effect ordering and legacy seals
        run: |
          set -euo pipefail
          python3 tests/new-sdd-workspace-successor/run.py
          python3 tests/release-successor-execution/run.py
          python3 tests/release-successor-journal/run.py
          python3 tests/release-effect-sealing/run.py
          python3 -B tests/new-sdd-workspace/knowledge-console-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-public-receivers.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-fable-game-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-fable-game-complete-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-fable-game-legacy-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-fable-game-provider-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-fable-game-player-provider-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-fable-game-complete-provider-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-wizard-bindings-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-retained-upgrade-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-retained-adoption-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-rendering-routes-public.py --source-controls
          python3 -B tests/new-sdd-workspace/knowledge-wizard-default-rows-public.py --source-controls
          python3 tests/new-sdd-workspace/knowledge-creation.py \
            --wizard /pure-control --sdd-cli /pure-control --insufficient-cli /pure-control \
            --providers /pure-control --workspace-package /pure-control \
            --rendering-package /pure-control --report /pure-control --source-controls

      # This is a one-release refusal gate. Keep it reachable when its own
      # SDD/evidence changes, but do not make a completed 0.10.1 release block
      # unrelated future scaffolder work after the candidate becomes present.
      - name: Detect the 0.10.1 release-preparation subject
        id: release_subject
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$(git merge-base "origin/$PR_BASE" HEAD)"
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(work/2968-new-sdd-workspace-0-10-1-release/verify-release-preparation.sh \
            --release-subject-changed . "$base" HEAD)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Prove release-preflight refusal controls
        if: steps.release_subject.outputs.run == 'true'
        run: |
          set -euo pipefail
          actual="$(mktemp)"
          work/2968-new-sdd-workspace-0-10-1-release/verify-release-preparation-selftest.sh > "$actual"
          diff -u readiness/2968-new-sdd-workspace-0-10-1-release/release-preflight-selftest.junit.xml "$actual"

      - name: Run reproducible 0.10.1 release preflight
        if: steps.release_subject.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(mktemp)"
          work/2968-new-sdd-workspace-0-10-1-release/verify-release-preparation.sh > "$actual"
          diff -u readiness/2968-new-sdd-workspace-0-10-1-release/release-preflight.json "$actual"
