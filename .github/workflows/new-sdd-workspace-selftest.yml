# Self-test for `parse` in scripts/NewSddWorkspace/Program.fs — the new-sdd-workspace CLI arg parser.
#
# Runs tests/new-sdd-workspace/run.sh, which builds the REAL CLI and drives it end-to-end, reading the
# parse result off main's exit-code contract (exit 2 = rejected, exit 127 = accepted → fsgg-sdd
# preflight). It pins the .github#388 grammar: --profile/--ref no longer swallow a following flag as a
# value, and an unknown --profile is refused on the CLI path. `parse` is pure and was previously
# untested; this guards it the same way the other *-selftest workflows guard their scripts.
#
# It also became the gate that PROVES the scaffolder's locked restore (#609). Until .github consumed
# the build config it authors, this project had no packages.lock.json at all — so the org's
# lockfile-restore-enforcement rule (ADR-0006) simply did not reach the tool that scaffolds every FS-GG
# workspace: a silent version substitution in it would have failed nothing. It has a lock now, and the
# inherited RestoreLockedMode arms it here. Hence the build config in the trigger list, both halves of
# it: the root Directory.Build.props IMPORTS dist/dotnet/Directory.Build.props, so an edit to the
# org-shared file changes this build.
name: new-sdd-workspace-selftest

on:
  pull_request:
    paths:
      - "scripts/NewSddWorkspace/**"
      - "tests/new-sdd-workspace/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/new-sdd-workspace-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/NewSddWorkspace/**"
      - "tests/new-sdd-workspace/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/new-sdd-workspace-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Run the new-sdd-workspace parse fixture
        run: bash tests/new-sdd-workspace/run.sh
