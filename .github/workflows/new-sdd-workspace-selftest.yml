# Self-test for `parse` in scripts/NewSddWorkspace/Program.fs — the new-sdd-workspace CLI arg parser.
#
# Runs tests/new-sdd-workspace/run.sh, which builds the REAL CLI and drives it end-to-end, reading the
# parse result off main's exit-code contract (exit 2 = rejected, exit 127 = accepted → fsgg-sdd
# preflight). It pins the .github#388 grammar: --profile/--ref no longer swallow a following flag as a
# value, and an unknown --profile is refused on the CLI path. `parse` is pure and was previously
# untested; this guards it the same way the other *-selftest workflows guard their scripts.
#
# It also became the gate that PROVES the scaffolder's locked restore (#609). Until .github consumed
# the build config it authors, this project had no packages.lock.json at all — so the org's
# lockfile-restore-enforcement rule (ADR-0006) simply did not reach the tool that scaffolds every FS-GG
# workspace: a silent version substitution in it would have failed nothing. It has a lock now, and the
# inherited RestoreLockedMode arms it here. Hence the build config in the trigger list, both halves of
# it: the root Directory.Build.props IMPORTS dist/dotnet/Directory.Build.props, so an edit to the
# org-shared file changes this build.
name: new-sdd-workspace-selftest

on:
  pull_request:
    paths:
      - "scripts/NewSddWorkspace/**"
      - "tests/new-sdd-workspace/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/new-sdd-workspace-selftest.yml"
      - "work/2968-new-sdd-workspace-0-10-1-release/**"
      - "readiness/2968-new-sdd-workspace-0-10-1-release/**"
  push:
    branches: [main]
    paths:
      - "scripts/NewSddWorkspace/**"
      - "tests/new-sdd-workspace/**"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - ".github/workflows/new-sdd-workspace-selftest.yml"
      - "work/2968-new-sdd-workspace-0-10-1-release/**"
      - "readiness/2968-new-sdd-workspace-0-10-1-release/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  parse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run the new-sdd-workspace parse fixture
        run: bash tests/new-sdd-workspace/run.sh

      # This is a one-release refusal gate. Keep it reachable when its own
      # SDD/evidence changes, but do not make a completed 0.10.1 release block
      # unrelated future scaffolder work after the candidate becomes present.
      - name: Detect the 0.10.1 release-preparation subject
        id: release_subject
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.base_ref }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = pull_request ]; then
            base="$(git merge-base "origin/$PR_BASE" HEAD)"
          elif [ "$EVENT_NAME" = push ] && git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            base="$PUSH_BEFORE"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          run="$(work/2968-new-sdd-workspace-0-10-1-release/verify-release-preparation.sh \
            --release-subject-changed . "$base" HEAD)"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - name: Prove release-preflight refusal controls
        if: steps.release_subject.outputs.run == 'true'
        run: |
          set -euo pipefail
          actual="$(mktemp)"
          work/2968-new-sdd-workspace-0-10-1-release/verify-release-preparation-selftest.sh > "$actual"
          diff -u readiness/2968-new-sdd-workspace-0-10-1-release/release-preflight-selftest.junit.xml "$actual"

      - name: Run reproducible 0.10.1 release preflight
        if: steps.release_subject.outputs.run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          actual="$(mktemp)"
          work/2968-new-sdd-workspace-0-10-1-release/verify-release-preparation.sh > "$actual"
          diff -u readiness/2968-new-sdd-workspace-0-10-1-release/release-preflight.json "$actual"
