# closing-keywords — a PR body must not CLOSE an issue it says it does NOT close.
#
# .github#643, epic #266. GitHub scans a PR body for `close|closes|closed|fix|fixes|fixed|resolve|
# resolves|resolved` followed by an issue ref and links the two. It does not parse the sentence:
# `does not close #422` contains `close #422`, and the negation is invisible to it.
#
# PR #640 said "**It does not close #422.**" and, on merge, closed #422 — after which the Projects
# auto-workflow stamped the item **Done**. An open, unfinished, explicitly-not-done item was closed
# and stamped, with its three acceptance criteria unmet, and the only thing that caught it was a
# worker re-reading the `release` output and disbelieving it. There is no second line of defence:
# `done --flip` cannot help, because the work WAS merged — it just did not finish the item.
#
# The subjects of this gate are the PR BODY and the branch's COMMIT MESSAGES (#684) — not the tree —
# so there is deliberately NO `paths:` filter: any PR can carry a negated keyword, including one that
# touches no file this gate knows about. It runs on `edited` (the body changed) and on `synchronize`
# (the commits changed, AND so the check is present on the head SHA the merge gate reads — a check
# that is not on the head SHA is a check the merge gate cannot see).
#
# Both subjects, because they are different texts with different powers, and only one of them closes:
# `squash_merge_commit_message` is COMMIT_MESSAGES here, so the squash message is built from the
# commit messages and the PR body is merely a proxy — exact only on a single-commit branch. A keyword
# in a non-final commit closes an issue that never appears in the body the gate used to read (#684).
#
# No `schedule:`: the subject is a pull request. There is nothing to re-prove between pushes.
name: closing-keywords

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: closing-keywords-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline, and first: prove the gate can still say NO before believing it when it says yes. The
  # fixture's leg 1 is the real #640 sentence, so a gate that stops catching the bug it was written
  # for cannot reach the job below.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      # No pip install: the gate is stdlib-only (re, pathlib) on purpose. A lint that reads a PR body
      # should not need a dependency, and a dependency is one more thing that can fail open on a runner.
      - name: Run the closing-keywords fixture (no network)
        run: bash tests/closing-keywords/run.sh

  # Named for what it asserts, not for what it reads. A check run takes the JOB's id as its name, and
  # in a list of twenty-odd checks a bare `body` says nothing about what went wrong — the same
  # unreadability `skill-registry-coherence` renamed its job to avoid.
  declared-closes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: fixture
    if: github.event_name == 'pull_request'
    steps:
      # fetch-depth: 0 — the gate's PRIMARY subject is the branch's COMMIT MESSAGES (#684), and a
      # shallow clone cannot reach the base commit to enumerate them. A depth that cannot see the
      # base would yield an empty range, and an empty range read as "nothing to audit" is the exact
      # fail-open this gate exists to close. The gate refuses an empty subject for the same reason.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      # THE TEXT THAT ACTUALLY CLOSES. `squash_merge_commit_message` is COMMIT_MESSAGES on this repo,
      # so the squash message is built from the branch's commit messages, concatenated — NOT from the
      # PR body. The body is only a proxy for it, and an exact one solely on a single-commit branch
      # (which is what pnext-item §5's `git log -1 --format=%b` happens to produce). On a two-commit
      # branch a closing keyword in the FIRST commit reaches the squash message and closes an issue
      # while never appearing in the body — green gate, closed issue (#684).
      #
      # `git cat-file -e` first: an unreachable base must fail LOUD here. If it silently produced an
      # empty range instead, the gate would be handed an empty subject — and "I read no commits" must
      # never be able to look like "I read the commits and they were clean" (#266).
      - name: Collect the commit messages that become the squash message
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git cat-file -e "$BASE^{commit}"
          git cat-file -e "$HEAD^{commit}"
          git log --format=%B "$BASE".."$HEAD" > commit-messages.txt
          echo "collected $(git rev-list --count "$BASE".."$HEAD") commit message(s)"

      # The body goes through the ENVIRONMENT, never interpolated into the shell. A PR body is
      # attacker-controlled text: `${{ github.event.pull_request.body }}` pasted into a `run:` block
      # is a script-injection sink, and this body is, by construction, full of backticks and quotes.
      # The commit messages are read from the tree by git, so they never transit the shell at all.
      - name: Assert the merge closes nothing the PR did not declare
        id: check
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s' "$PR_BODY" > pr-body.md
          rc=0
          out="$(python scripts/check-closing-keywords.py \
                   --commits commit-messages.txt --body pr-body.md 2>&1)" || rc=$?
          [ -z "$out" ] || printf '%s\n' "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # One named step per exit code: "I could not check" must never be mistaken for "I checked, and
      # it's fine" (#266). The exit code is the contract; nothing here greps the gate's prose.
      #
      # There is deliberately no rc=2 ("no verdict, retryable"): the gate is pure and offline — it
      # reads text, makes no network call, and has no condition a re-run could resolve. An rc=2 would
      # mean it grew a failure mode nobody classified, and it lands in INCONCLUSIVE below, which fails.
      - name: 'OK: the merge closes only what this PR means to close'
        if: ${{ !cancelled() && steps.check.outputs.rc == '0' }}
        run: |
          echo "closing-keywords: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 'FINDING: this PR closes an issue it did not declare'
        if: ${{ !cancelled() && steps.check.outputs.rc == '1' }}
        run: |
          {
            echo "### closing-keywords: this PR will close an issue it did not declare"
            echo
            echo 'GitHub scans for `close|closes|closed|fix|fixes|fixed|resolve|resolves|resolved`'
            echo 'followed by an issue ref, and links the two. **It does not parse the sentence.**'
            echo 'A body saying it does *not* close an issue closes it anyway — the negation is'
            echo 'invisible to the parser (#643), and so is a past tense, a quotation or a deferral.'
            echo
            echo '**And code is NOT a defence (#683).** The markdown parser skips code, but what'
            echo 'actually CLOSES the issue on a squash merge is the **commit message**, and that is'
            echo 'plain text — backticks and fences are ordinary characters in it. A keyword in a'
            echo 'fence closes the issue just as dead as one in prose. This is how #422 came to be'
            echo 'closed a second time, by the very PR that shipped this gate.'
            echo
            echo '**Check WHICH subject the finding names (#684).** This gate reads two texts:'
            echo 'the **commit messages**, which are concatenated into the squash message and are'
            echo 'what actually closes; and the **PR body**, which is what records the PR'"'"'s link.'
            echo 'A finding in the body you can fix by editing the body. A finding in the commit'
            echo 'messages you cannot — the body is not that text. **Rewrite the branch**'
            echo '(`git commit --amend`, or a rebase) and force-push, or the merge will close it.'
            echo
            echo '**Fix the text, not the gate.** Declare what you close on a line of its own:'
            echo
            echo '> `Closes #123.`'
            echo
            echo 'and everywhere else deny the parser its binding — reword the verb (**does NOT'
            echo 'complete**, *addresses*, *supersedes*), drop the verb (`Refs #123.`), or quote the'
            echo 'number without its `#`. A newline does **not** help: whitespace is whitespace.'
            echo
            echo "See the job log for the line and the reference."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=closing-keywords: the body closes an issue it did not declare::GitHub does not read the word \"not\", and code is not a defence — the squash commit message is plain text. See the job log."
          exit 1

      - name: 'NO VERDICT (permanent): a subject could not be read'
        if: ${{ !cancelled() && steps.check.outputs.rc == '3' }}
        run: |
          {
            echo "### closing-keywords: no verdict"
            echo
            echo "The gate was handed a subject it could not read — no PR body, or no commit messages"
            echo "(an EMPTY commit-message file counts: every PR has at least one commit, so empty"
            echo "means the rev range or the clone depth is broken, not that the branch is clean)."
            echo
            echo "Examining nothing is a failure to audit, not a clean audit (#266): if the event"
            echo "payload stops carrying the body, or the base commit stops being reachable, every PR"
            echo "would read as clean and this gate would go green while the silent closes went on"
            echo "happening. Retrying will not help — fix the wiring."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=closing-keywords: no verdict (permanent)::The gate could not read one of its subjects. See the job log."
          exit 1

      - name: 'INCONCLUSIVE: the gate produced no exit code this workflow understands'
        if: ${{ !cancelled() && !contains(fromJSON('["0","1","3"]'), steps.check.outputs.rc) }}
        run: |
          echo "::error title=closing-keywords: inconclusive::check-closing-keywords.py exited ${{ steps.check.outputs.rc }}, which this workflow does not classify. Treating as a failure."
          exit 1
