name: release-saga-tooling

on:
  pull_request:
    paths:
      - "scripts/release-saga.py"
      - "scripts/release_successor_admission.py"
      - "scripts/release_successor_journal.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_provider.py"
      - "scripts/release_successor_auth_consumer.py"
      - "scripts/release-successor-publish.py"
      - "scripts/release-successor-artifact.py"
      - "scripts/release_source_closure.py"
      - "scripts/release-saga-ci.sh"
      - "tests/release-saga/**"
      - "tests/release-successor-recovery/**"
      - "tests/release-successor-live/**"
      - "tests/release-successor-execution/**"
      - "tests/release-successor-authentication/**"
      - "tests/release-successor-artifact/**"
      - "tests/release-source-closure/**"
      - ".github/workflows/release-successor-candidate.yml"
      - ".github/workflows/release-telemetry-host-successor-candidate.yml"
      - "tests/bridge-release/**"
      - "tests/bridge-package/**"
      - "tests/bridge-receivers/**"
      - "docs/reports/gs2-08-8-bridge-adoption.json"
      - "dist/dotnet/.config/dotnet-tools.json"
      - "evidence/gs2-08-7/**"
      - ".github/workflows/release-successor-publish.yml"
      - ".github/workflows/release-saga-tooling.yml"
      - ".github/workflows/release-saga-prepare.yml"
      - ".github/workflows/release-saga-start.yml"
      - ".github/workflows/release-saga-promote.yml"
      - ".github/workflows/release-coord-engine.yml"
      - ".github/workflows/release-kit.yml"
      - ".github/workflows/release-drivers.yml"
  push:
    branches: [main]
    paths:
      - "scripts/release-saga.py"
      - "scripts/release_successor_admission.py"
      - "scripts/release_successor_journal.py"
      - "scripts/release_successor_execution.py"
      - "scripts/release_successor_provider.py"
      - "scripts/release_successor_auth_consumer.py"
      - "scripts/release-successor-publish.py"
      - "scripts/release-successor-artifact.py"
      - "scripts/release_source_closure.py"
      - "scripts/release-saga-ci.sh"
      - "tests/release-saga/**"
      - "tests/release-successor-recovery/**"
      - "tests/release-successor-live/**"
      - "tests/release-successor-execution/**"
      - "tests/release-successor-authentication/**"
      - "tests/release-successor-artifact/**"
      - "tests/release-source-closure/**"
      - ".github/workflows/release-successor-candidate.yml"
      - ".github/workflows/release-telemetry-host-successor-candidate.yml"
      - "tests/bridge-release/**"
      - "tests/bridge-package/**"
      - "tests/bridge-receivers/**"
      - "docs/reports/gs2-08-8-bridge-adoption.json"
      - "dist/dotnet/.config/dotnet-tools.json"
      - "evidence/gs2-08-7/**"
      - ".github/workflows/release-successor-publish.yml"
      - ".github/workflows/release-saga-tooling.yml"
      - ".github/workflows/release-saga-prepare.yml"
      - ".github/workflows/release-saga-start.yml"
      - ".github/workflows/release-saga-promote.yml"
      - ".github/workflows/release-coord-engine.yml"
      - ".github/workflows/release-kit.yml"
      - ".github/workflows/release-drivers.yml"

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: release-saga-tooling-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  release-saga-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Exercise forced mid-publish recovery
        run: bash tests/release-saga/run.sh
      - name: Prove successor admission and fake-provider recovery
        run: python3 tests/release-successor-execution/run.py
      - name: Prove protected suspension installation and ordinary forward recovery
        run: python3 tests/release-successor-recovery/run.py
      - name: Prove inert original-tag authentication factory and inactive selection
        run: python3 tests/release-successor-authentication/run.py --current-source-suspension
      - name: Prove retained candidate identity and extraction
        run: python3 tests/release-successor-artifact/run.py
      - name: Prove pinned release sources tolerate main moves only outside their closure
        run: python3 tests/release-source-closure/run.py
      - name: Exercise immutable GS2-08.7 bridge and GS2-08.8 receiver
        run: |
          set -euo pipefail
          bridge=3adada5a9738464291088830c47a30a3a8fc9561
          receiver=85a70e9a30e5e6a471d61afddb06f7f597d020ce
          historical="$(mktemp -d)"
          cleanup() {
            if [ -d "$historical/source" ]; then
              git worktree remove --force "$historical/source"
            fi
            rmdir "$historical"
          }
          trap cleanup EXIT
          git worktree add --detach "$historical/source" "$bridge"
          (cd "$historical/source" && python3 tests/bridge-release/run.py)
          git worktree remove --force "$historical/source"
          git worktree add --detach "$historical/source" "$receiver"
          (cd "$historical/source" && bash tests/bridge-receivers/run.sh)
