name: release-saga-tooling

on:
  pull_request:
    paths:
      - "scripts/release-saga.py"
      - "scripts/release-saga-ci.sh"
      - "tests/release-saga/**"
      - "tests/bridge-release/**"
      - "tests/bridge-package/**"
      - "tests/bridge-receivers/**"
      - "docs/reports/gs2-08-8-bridge-adoption.json"
      - "dist/dotnet/.config/dotnet-tools.json"
      - "evidence/gs2-08-7/**"
      - ".github/workflows/release-saga-tooling.yml"
      - ".github/workflows/release-saga-prepare.yml"
      - ".github/workflows/release-saga-start.yml"
      - ".github/workflows/release-saga-promote.yml"
      - ".github/workflows/release-coord-engine.yml"
      - ".github/workflows/release-kit.yml"
      - ".github/workflows/release-drivers.yml"
  push:
    branches: [main]
    paths:
      - "scripts/release-saga.py"
      - "scripts/release-saga-ci.sh"
      - "tests/release-saga/**"
      - "tests/bridge-release/**"
      - "tests/bridge-package/**"
      - "tests/bridge-receivers/**"
      - "docs/reports/gs2-08-8-bridge-adoption.json"
      - "dist/dotnet/.config/dotnet-tools.json"
      - "evidence/gs2-08-7/**"
      - ".github/workflows/release-saga-tooling.yml"
      - ".github/workflows/release-saga-prepare.yml"
      - ".github/workflows/release-saga-start.yml"
      - ".github/workflows/release-saga-promote.yml"
      - ".github/workflows/release-coord-engine.yml"
      - ".github/workflows/release-kit.yml"
      - ".github/workflows/release-drivers.yml"

permissions:
  contents: read

jobs:
  release-saga-tooling:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Exercise forced mid-publish recovery
        run: bash tests/release-saga/run.sh
      - name: Exercise immutable GS2-08.7 bridge and GS2-08.8 receiver
        run: |
          set -euo pipefail
          bridge=3adada5a9738464291088830c47a30a3a8fc9561
          receiver=85a70e9a30e5e6a471d61afddb06f7f597d020ce
          historical="$(mktemp -d)"
          cleanup() {
            if [ -d "$historical/source" ]; then
              git worktree remove --force "$historical/source"
            fi
            rmdir "$historical"
          }
          trap cleanup EXIT
          git worktree add --detach "$historical/source" "$bridge"
          python3 "$historical/source/tests/bridge-release/run.py"
          git worktree remove --force "$historical/source"
          git worktree add --detach "$historical/source" "$receiver"
          bash "$historical/source/tests/bridge-receivers/run.sh"
