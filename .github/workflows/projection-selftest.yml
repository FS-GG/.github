# Self-test for the projection gate (scripts/check-projection.py) — .github#268, epic #266.
#
# coherence.yml already RUNS the gate against the real registry + projection on every PR. That
# proves the current files are coherent; it does not prove the gate can still SAY NO. The gate
# spent months reporting green on a stale row because it matched version literals by substring
# (`0.4.0` ⊂ `0.4.0-preview.1`) — a check that cannot fail is indistinguishable from no check.
#
# tests/projection/run.sh pins the failure legs: it asserts each drift class is RED, and for the
# four substring regressions it additionally re-runs the OLD assertion to prove the case was GREEN
# before — so a case that stops discriminating is itself a test failure, rather than quietly
# becoming a tautology (the vacuous-failure-leg trap from FS.GG.SDD#299).
#
# Mirrors repos-registry-selftest.yml / skill-union-selftest.yml. Pure-stdlib + PyYAML, no network.
name: projection-selftest

on:
  pull_request:
    paths:
      - "scripts/check-projection.py"
      - "tests/projection/**"
      - ".github/workflows/projection-selftest.yml"
      # the fixture's last case gates the REAL files, so an edit to either re-runs it
      - "registry/dependencies.yml"
      - "docs/registry/compatibility.md"
  push:
    branches: [main]
    paths:
      - "scripts/check-projection.py"
      - "tests/projection/**"
      - ".github/workflows/projection-selftest.yml"
      - "registry/dependencies.yml"
      - "docs/registry/compatibility.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml
      - name: Run the projection fixture
        run: bash tests/projection/run.sh
