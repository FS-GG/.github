# Unified semantic gate for the synchronized FS-GG skill catalog (.github#1415).
name: skill-quality

on:
  pull_request:
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "docs/coordination/**"
      - "registry/skills.yml"
      - "registry/repos.yml"
      - "registry/*skill-manifest.json"
      - "requirements-test.txt"
      - "scripts/build-gate-engine"
      - "scripts/check-skill-quality"
      - "scripts/check-skill-quality.py"
      - "scripts/generate-driver-manifest"
      - "scripts/generate-projections"
      - "scripts/test"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      # .github#2725 — `FS.GG.Coord.Cli` now ProjectReferences the CLI kernel, so a change under
      # `src/FS.GG.Coord.Cli.Kernel/**` changes what this workflow builds. Without this entry the
      # workflow would not start on such a change and would be green by absence (#266) — which is
      # exactly what `scripts/check-paths-coherence.py` rule (b) refuses.
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "tests/FS.GG.Coord.Cli.Tests/**"
      # .github#2725 — the kernel suite. It is a SEPARATE assembly with its own 179 tests, and
      # `dotnet test` on the CLI suite does not run one of them, so a workflow that started only on
      # the CLI suite would report green over a kernel change it never executed.
      - "tests/FS.GG.Coord.Cli.Kernel.Tests/**"
      - "tests/FS.GG.Coord.Cli.BoardOps.Tests/**"
      - "tests/skill-quality/**"
      - "tests/skill-registry/catalog-triggers.json"
      - ".github/workflows/skill-quality.yml"
  push:
    branches: [main]
    paths:
      - ".claude/agents/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "docs/coordination/**"
      - "registry/skills.yml"
      - "registry/repos.yml"
      - "registry/*skill-manifest.json"
      - "requirements-test.txt"
      - "scripts/build-gate-engine"
      - "scripts/check-skill-quality"
      - "scripts/check-skill-quality.py"
      - "scripts/generate-driver-manifest"
      - "scripts/generate-projections"
      - "scripts/test"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Cli.Lifecycle/**"
      # .github#2725 — `FS.GG.Coord.Cli` now ProjectReferences the CLI kernel, so a change under
      # `src/FS.GG.Coord.Cli.Kernel/**` changes what this workflow builds. Without this entry the
      # workflow would not start on such a change and would be green by absence (#266) — which is
      # exactly what `scripts/check-paths-coherence.py` rule (b) refuses.
      - "src/FS.GG.Coord.Cli.Kernel/**"
      - "src/FS.GG.Coord.Cli.BoardOps/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "tests/FS.GG.Coord.Cli.Tests/**"
      # .github#2725 — the kernel suite. It is a SEPARATE assembly with its own 179 tests, and
      # `dotnet test` on the CLI suite does not run one of them, so a workflow that started only on
      # the CLI suite would report green over a kernel change it never executed.
      - "tests/FS.GG.Coord.Cli.Kernel.Tests/**"
      - "tests/FS.GG.Coord.Cli.BoardOps.Tests/**"
      - "tests/skill-quality/**"
      - "tests/skill-registry/catalog-triggers.json"
      - ".github/workflows/skill-quality.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semantic-skill-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - name: Provision pinned test dependencies
        run: python3 -m pip install -r requirements-test.txt
      - name: Validate semantic skill quality and its rejection paths
        run: bash tests/skill-quality/run.sh
