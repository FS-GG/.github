name: Protected intake preflight self-test

on:
  pull_request:
    paths:
      - ".github/workflows/protected-intake-preflight.yml"
      - ".github/workflows/protected-intake-preflight-selftest.yml"
      - "policy/protected-intake-authority-candidate.json"
      - "policy/protected-intake-preflight.json"
      - "tools/protected-intake-preflight.py"
      - "tests/protected-intake-preflight/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/protected-intake-preflight.yml"
      - ".github/workflows/protected-intake-preflight-selftest.yml"
      - "policy/protected-intake-authority-candidate.json"
      - "policy/protected-intake-preflight.json"
      - "tools/protected-intake-preflight.py"
      - "tests/protected-intake-preflight/**"

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: protected-intake-preflight-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    name: protected-intake-preflight-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise source-only intake refusal controls
        run: bash tests/protected-intake-preflight/run.sh
