name: routine-eligibility-selftest

on:
  pull_request:
    paths:
      - .github/workflows/routine-eligibility.yml
      - .github/workflows/routine-eligibility-selftest.yml
      - scripts/check-routine-eligibility-envelope.py
      - scripts/check-claim-generation.py
      - tools/routine-delivery.py
      - tools/pr-lane-admission.py
      - tests/routine-eligibility/**
      - scripts/routine-closure.py
      - tests/routine-closure/**

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: routine-eligibility-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  routine-eligibility-fixture:
    name: routine-eligibility-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the unprivileged security fixture
        run: bash tests/routine-eligibility/run.sh
      - name: Exercise the receiver closure applier and drift check (.github#5202)
        run: bash tests/routine-closure/run.sh
