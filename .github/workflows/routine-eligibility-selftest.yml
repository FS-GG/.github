name: routine-eligibility-selftest

on:
  pull_request:
    paths:
      - .github/workflows/routine-eligibility.yml
      - .github/workflows/routine-eligibility-selftest.yml
      - scripts/check-routine-eligibility-envelope.py
      - tests/routine-eligibility/**

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: routine-eligibility-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  routine-eligibility-fixture:
    name: routine-eligibility-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Exercise the unprivileged security fixture
        run: bash tests/routine-eligibility/run.sh
