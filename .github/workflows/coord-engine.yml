# coord-engine — the typed engine's executable edge (ADR-0034; ADR-0040 Phase D).
#
# Phase 1 built a pure core that nothing consumed. Phase 2 gave it a mouth. Phase D made `scripts/fsgg-coord`
# BE it (the ADR-0034 §4.4 shim execs the compiled `fsgg-coord-engine`), and D.4 deleted the bash monolith
# and the shadow that stood the two engines side by side — there is one engine now, so there is nothing to
# shadow. What remains is the gate that proves the ONE engine works: it reads its own board over HTTP, its
# write commands land over a real lock, and it returns the answer the shell corpus CERTIFIES — the corpus's
# own contract, with no bash in the pipeline.
#
# WHAT THIS GATE IS ACTUALLY FOR, and it is not "does the engine compile".
#
# It holds the engine to the certified corpus (`tests/coord-engine-parity/`, ~445 assertions across all 27
# cases) and to the wire-contract unit suite — and it refuses to pass VACUOUSLY (#266, #436): a runner that
# discovers nothing exits 0, so the non-vacuity step asserts a floor of tests actually ran. A green gate
# over an untested fail-open surface is the exact bug this engine exists to end.
#
# The build config is in the trigger list, and BOTH halves of it are (#609): the root
# Directory.Build.props IMPORTS dist/dotnet/Directory.Build.props, which is what sets RestoreLockedMode
# and the ADR-0032 lock-hash fix behind this job's locked restore. An edit to the org-shared file
# changes this build, so it must be able to re-run this gate.
name: coord-engine

on:
  pull_request:
    paths:
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "tests/FS.GG.Coord.Cli.Tests/**"
      - "tests/coord-engine-e2e/**"
      - "tests/coord-engine-parity/**"
      - "tests/coord-engine-mutation/**"
      - "tests/coord-engine-replay/**"
      - "scripts/fsgg-coord"
      - "scripts/record-board-fixture.py"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/coord-engine.yml"
  push:
    branches: [main]
    paths:
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.GitHub/**"
      - "tests/FS.GG.Coord.Cli.Tests/**"
      - "tests/coord-engine-e2e/**"
      - "tests/coord-engine-parity/**"
      - "tests/coord-engine-mutation/**"
      - "tests/coord-engine-replay/**"
      - "scripts/fsgg-coord"
      - "scripts/record-board-fixture.py"
      - "Directory.Build.props"
      - "dist/dotnet/Directory.Build.props"
      - "Directory.Packages.props"
      - "global.json"
      - ".github/workflows/coord-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coord-engine-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Install the pinned SDD provider validator
        run: |
          set -euo pipefail
          # renovate: datasource=nuget depName=FS.GG.SDD.Cli versioning=loose
          dotnet tool install --global FS.GG.SDD.Cli --version 1.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      # Locked restore. A silent version SUBSTITUTION fails here rather than quietly changing what the
      # tests ran against (ADR-0006).
      - name: Restore (locked)
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet restore tests/FS.GG.Coord.Cli.Tests/FS.GG.Coord.Cli.Tests.fsproj --locked-mode

      - name: Build the engine
        run: dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # THE BINARY, END TO END, OVER HTTP — hermetically. Every other test drives the engine through
      # `Fake.Recorder` or a snapshot on stdin; this one runs the COMPILED binary against a fixture GitHub
      # (a stdlib http.server, no network, no token) via the configurable API base (ADR-0040 C1) and proves
      # `scan | decide` returns the right verdict. It was proven once by hand against the live board, which
      # CI cannot reach; this is that proof made a gate. If the engine could not talk HTTP at all, this is
      # the only step that would notice.
      - name: The engine reads its own board — scan | decide, over HTTP, hermetic
        run: bash tests/coord-engine-e2e/run.sh

      # THE WRITE COMMANDS, over HTTP, against a STATEFUL fixture. The claim CAS is a read-modify-reread,
      # so this drives `claim`/`heartbeat`/`release`/`set-field`/`child`/`say`/`widen`/`done` as real CLI
      # commands against a server that remembers what they posted — a green is a green over a real lock, not
      # a canned answer. This is the surface the shim (ADR-0034 §4.4) execs in place of bash.
      - name: The engine's write commands land — the CAS and the capability-typed writes
        run: bash tests/coord-engine-e2e/writes.sh

      # PARITY — the first slice of the Phase-D corpus-through-shim gate. The compiled engine, over HTTP,
      # must return the answer the SHELL CORPUS certifies for bash on the same board (case 22:
      # batch → ["FS.GG.SDD#70","FS.GG.SDD#74"]). This turns "the engine is modelled on bash's output" into
      # "the engine produces bash's certified output", with no bash in the pipeline. The golden is the
      # corpus's own contract, so the two cannot drift.
      - name: Parity — the engine matches the corpus's certified batch answer
        run: bash tests/coord-engine-parity/run.sh

      # RECORDED-BOARD REPLAY (.github#2401). Every fixture above is HAND-AUTHORED — it encodes its
      # author's belief about what GitHub returns, which is exactly the blind spot for the
      # lifecycle/projection defect class (.github#2384, .github#2394): those bugs are about the engine
      # meeting a board state its author never pictured, not about mishandling a response it expected.
      # This leg drives the compiled engine against a RECORDED transcript instead
      # (`tests/coord-engine-replay/`, `scripts/record-board-fixture.py`) and includes a fixture that
      # reproduces the wrong half of .github#2216's tabulated verdict deterministically, marked
      # expected-fail and tracked at .github#2384 — the leg proves the instrument catches the class
      # without also fixing the projection here.
      - name: Recorded-board replay — the engine reproduces facts it was actually asked, not invented ones
        run: bash tests/coord-engine-replay/run.sh

      # CAN THE #1794 MUTATION MATRIX STILL BE RUN? (.github#1825) — seconds, not the ~50 minutes the
      # matrix itself costs. `tests/coord-engine-mutation/specs.yml` mutates guards by EXACT SOURCE TEXT,
      # so any edit to `Reads.fs`/`Client.fs`/`Scan.fs`/`Transport.fs` can leave a leg matching nothing —
      # and a leg that matches nothing grades NOT MEASURED, silently, to whoever eventually runs the sweep.
      # This says so on the PR that moved the source, while the author is still holding it. It runs NO
      # mutation: green here means the matrix is RUNNABLE, never that any guard was measured (#266).
      # The name is QUOTED because it contains `#`, which starts a YAML comment. Unquoted, this step was
      # literally named "The" — caught by parsing the file rather than by reading it.
      - name: "The #1794 mutation matrix is still runnable — every leg's anchor still matches"
        run: bash tests/coord-engine-mutation/run.sh

      # SHIM PARITY (ADR-0040 Phase D.2). The same corpus, re-decided through `scripts/fsgg-coord` —
      # which the swap cut down to the ~40-line ADR-0034 §4.4 resolver that REPLACED the ~7,000-line bash
      # (deleted in D.4 — this shim is the only `scripts/fsgg-coord` there is). It re-runs the parity
      # corpus with the engine indirected through the shim (a shim that dropped an arg, swallowed output,
      # or mangled an exit code would red one of the 445), and proves the shim resolves the engine or
      # REFUSES — never the silent no-op (#266) that is the whole reason the bash grew a resolver.
      - name: Shim parity — the corpus is green THROUGH the ADR-0034 §4.4 shim
        run: bash tests/coord-engine-parity/shim.sh

      # THE REGISTRY-PREDICATE ORACLE, over LOCAL fixture files (ADR-0050 call-site A, .github#1202). The
      # verdict logic is unit-tested pure; this drives the COMPILED binary's file edge — reading
      # registry/skills.yml, locating and parsing the owning producer's manifest, and the 0/3/4 exit
      # contract — and refutes the #1194 instance (`fs-gg-playtest mirrored: true`) end to end.
      - name: The predicate oracle refutes a wrong cross-repo request — over local files
        run: bash tests/registry-predicate/run.sh

      - name: Test — the wire contract, and the residue rule
        run: dotnet test tests/FS.GG.Coord.Cli.Tests/FS.GG.Coord.Cli.Tests.fsproj -c Release --logger "console;verbosity=normal"

      # A SUITE THAT CANNOT FAIL IS NOT A SUITE (#266, #436). A runner that discovers nothing exits 0.
      - name: Non-vacuity — the run must have executed tests
        run: |
          set -euo pipefail
          out="$(dotnet test tests/FS.GG.Coord.Cli.Tests/FS.GG.Coord.Cli.Tests.fsproj --no-build -c Release 2>&1)"
          printf '%s\n' "$out"
          passed="$(printf '%s' "$out" | grep -oE 'Passed:[[:space:]]+[0-9]+' | grep -oE '[0-9]+' | head -1 || echo 0)"
          if [ "${passed:-0}" -lt 20 ]; then
            echo "::error title=coord-engine: the suite audited nothing::Only ${passed:-0} tests ran. The codec is a fail-open surface and these are the assertions that hold it shut; a green gate over an untested one is the bug this engine exists to end (#266)."
            exit 1
          fi
          echo "coord-engine: $passed test(s) passed" >> "$GITHUB_STEP_SUMMARY"
