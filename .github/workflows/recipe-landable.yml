# A recipe NAMES the merge-gate command; it never EMBEDS the gate (.github#724).
#
# The rollup that answers "is this PR safe to merge?" was wrong FOUR times — #547 (unpaginated: a red
# check on page 2 was invisible), #606 (zero checks read as green), #698 (a superseded run read as
# red), #710 (the same, in the autofix bot), #720 (the same, in `pr_landable`, where it made `adopt`
# refuse the finished work it exists to land). Every fix edited a COPY, because nothing executes a
# recipe and so nothing tests one. `scripts/check-recipe-landable.py` makes a FIFTH copy unwritable.
#
# THE `paths:` FILTER IS PART OF THE GATE. Every entry below is an INPUT, and a gate that cannot fire
# on its own subject is #508's mistake:
#
#   scripts/check-recipe-landable.py  — the rule itself.
#   tests/recipe-landable/**          — the fixture that proves the rule still fires.
#   .claude/skills/**, .agents/skills/**, docs/coordination/**
#                                     — the RECIPES it governs. This is the one that matters: a PR
#                                       that hand-rolls a merge gate touches ONLY a SKILL.md, and if
#                                       that did not trigger this workflow the rule would be decorative.
#   src/FS.GG.Coord.Cli/**            — the engine that IMPLEMENTS `landable` (ADR-0040 D.4 deleted the bash
#                                       monolith this gate used to grep; `scripts/fsgg-coord` is the shim
#                                       that execs the engine). If `landable` is removed or renamed, every
#                                       recipe's instruction to call it becomes a lie, and this gate says so.
name: recipe-landable

on:
  pull_request:
    paths:
      - "scripts/check-recipe-landable.py"
      - "tests/recipe-landable/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "docs/coordination/**"
      - "src/FS.GG.Coord.Cli/Options.fs"
      - "src/FS.GG.Coord.Cli/Client.fs"
      # EVERY workflow, since #737 — the rule now reaches `jobs.*.steps[*].run`, and the last
      # hand-rolled copy of the gate lived in a workflow, not a recipe. Watching only this file would
      # leave the new root ungated on the exact PR that re-grows a copy: the gate would be correct and
      # would never run, which is #266 wearing the fix for #266.
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/check-recipe-landable.py"
      - "tests/recipe-landable/**"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "docs/coordination/**"
      - "src/FS.GG.Coord.Cli/Options.fs"
      - "src/FS.GG.Coord.Cli/Client.fs"
      # EVERY workflow, since #737 — the rule now reaches `jobs.*.steps[*].run`, and the last
      # hand-rolled copy of the gate lived in a workflow, not a recipe. Watching only this file would
      # leave the new root ungated on the exact PR that re-grows a copy: the gate would be correct and
      # would never run, which is #266 wearing the fix for #266.
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      # The gate PARSES workflows since #737 (a recipe is fence-scanned; a workflow's shell lives in
      # `run:` blocks, and its comments are prose that must stay legal). That needs PyYAML.
      - uses: ./.github/actions/setup-policy-python
      - name: Run the recipe-landable fixture
        run: bash tests/recipe-landable/run.sh
      # The fixture drives the gate against throwaway recipes AND against this repo's real ones. This
      # step is the plain, unmediated verdict on the tree as it stands — so a PR that hand-rolls a gate
      # fails on a line that names the file and the remedy, not inside a fixture's output.
      - name: Assert no recipe hand-rolls the merge gate
        run: python3 scripts/check-recipe-landable.py

      # `landable` is what every recipe now tells the worker to run. If it stops existing, the
      # instruction becomes a lie and this gate is where that surfaces (#266: assert the subject, do
      # not assume it).
      - name: Assert the command the recipes name still exists
        run: |
          # ADR-0040 D.4 deleted the bash monolith this gate used to grep; `scripts/fsgg-coord` is now the
          # shim that execs the compiled engine, which is the ONE implementation of `landable`. This is the
          # source-level analog of the old two-grep check — it needs no build and asserts the command is both
          # PARSEABLE (a subcommand token routed to `Command = Landable`) and REACHABLE (that command is
          # dispatched to a handler). Rename or drop `landable` in either place and every recipe that tells a
          # worker to run it becomes a lie; this gate says so (#266: assert the subject, do not assume it).
          # Whitespace-robust (grep -E with [[:space:]]*), so a formatter reflow of the match arm does not
          # red the gate on a `landable` that is in fact still wired.
          grep -qE '"landable"[[:space:]]*::[[:space:]]*rest' src/FS.GG.Coord.Cli/Options.fs \
            && grep -qE 'Command[[:space:]]*=[[:space:]]*Landable' src/FS.GG.Coord.Cli/Options.fs \
            || { echo "::error::src/FS.GG.Coord.Cli/Options.fs does not route the 'landable' subcommand token to Command = Landable, but every recipe tells workers to call it."; exit 1; }
          grep -qE '\|[[:space:]]*Landable[[:space:]]*->[[:space:]]*landable' src/FS.GG.Coord.Cli/Client.fs \
            || { echo "::error::'landable' is not dispatched to a handler in src/FS.GG.Coord.Cli/Client.fs."; exit 1; }
