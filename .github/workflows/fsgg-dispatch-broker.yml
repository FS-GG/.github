# GS2-08.9 retirement boundary: the former broker cannot reach a mutation effect.
name: fsgg-dispatch-broker (retired writer; validation only)

on:
  workflow_dispatch:
    inputs:
      item: {description: "owner/repo#N", type: string, required: true}
      generation: {description: "Claim generation", type: string, required: true}
      receiver: {description: "owner/repo", type: string, required: true}
      op: {description: "Expected dispatch:<event-type>", type: string, required: true}
      opkey: {description: "Historical operation key", type: string, required: true}
      grant: {description: "Historical grant id", type: string, required: true}
      event-type: {description: "Event type", type: string, required: true}
      version: {description: "Version", type: string, required: true}

permissions:
  contents: read

jobs:
  validate:
    name: Dispatch request grammar validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate the retired request without reading or writing GitHub state
        shell: bash
        env:
          ITEM: ${{ inputs.item }}
          GENERATION: ${{ inputs.generation }}
          RECEIVER: ${{ inputs.receiver }}
          OP: ${{ inputs.op }}
          OPKEY: ${{ inputs.opkey }}
          GRANT: ${{ inputs.grant }}
          EVENT_TYPE: ${{ inputs.event-type }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$ITEM" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+#[1-9][0-9]*$ ]]
          [[ "$RECEIVER" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]
          [[ "$GENERATION" =~ ^[1-9][0-9]*$ ]]
          [[ "$GRANT" =~ ^[1-9][0-9]*$ ]]
          [ "$OP" = "dispatch:$EVENT_TYPE" ]
          [ -n "$OPKEY" ] && [ -n "$VERSION" ]
          echo "GS2-08.9: broker request is well formed but retired; no authorization receipt or dispatch was written."
