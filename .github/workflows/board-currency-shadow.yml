name: board-currency-shadow

# SHADOW MODE (Refs #4730). Design: docs/coordination/2026-10-31-board-currency-gate.md, phase 1.
#
# Evaluates the deterministic board-currency rule set (fsgg:board-currency-rules/v1, R1-R9 and U) over a
# read-only snapshot of Project 3 and writes the counts to this run's job summary. It writes NOTHING
# else: no issue, no comment, no board field, no artifact. Findings never fail the job; a failed or
# partial read does (red is the only honest answer to "could not read", .github#266).
#
# WHY workflow_run: GitHub drops scheduled runs, so fdev dispatches board-drift-observer hourly. Chaining
# on that workflow's completion gives this report the same cadence without a second schedule, a second
# dispatcher or a change to the drift observer's own jobs. One light job per observer run.
#
# The summary names only subjects in repositories whose visibility is an explicit `false`; private and
# unknown-visibility findings are counted, never named (scripts/board-currency-rules.py, PRIVACY).
on:
  workflow_run:
    workflows: [board-drift-observer]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: board-currency-shadow
  cancel-in-progress: false

jobs:
  board-currency-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Org-owned Project 3 is invisible to GITHUB_TOKEN. Same App installation and the same three read
      # scopes as board-drift-read; no write scope at all.
      - name: Mint a read-only installation token for Project 3, issues and pull requests
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          owner: FS-GG
          permission-organization-projects: read
          permission-issues: read
          permission-pull-requests: read

      - name: Create a private scratch directory
        id: scratch
        shell: bash
        run: |
          set -euo pipefail
          dir="$(mktemp -d "$RUNNER_TEMP/board-currency.XXXXXX")"
          chmod 700 "$dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Read Project 3 with hierarchy, blockers and PRs (read-only)
        shell: bash
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SCRATCH: ${{ steps.scratch.outputs.dir }}
        run: |
          set -euo pipefail
          python3 scripts/board-currency-fetch.py --owner FS-GG --project 3 --out "$SCRATCH/snapshot.json"

      - name: Evaluate the board-currency rules (pure)
        shell: bash
        env:
          SCRATCH: ${{ steps.scratch.outputs.dir }}
        run: |
          set -euo pipefail
          python3 scripts/board-currency-rules.py check --snapshot "$SCRATCH/snapshot.json" --out "$SCRATCH/findings.json"

      - name: Write the shadow report to the job summary
        shell: bash
        env:
          SCRATCH: ${{ steps.scratch.outputs.dir }}
        run: |
          set -euo pipefail
          python3 scripts/board-currency-rules.py report --findings "$SCRATCH/findings.json" >> "$GITHUB_STEP_SUMMARY"
