# Self-test for the reusable skill-union assertion (FS-GG/.github#111, ADR-0014 P3.G3.1).
#
# Runs tests/skill-union/run.sh, which proves scripts/skill-union-assert.sh PASSES on a
# byte-identical union and FAILS on each violation class (divergent / partitioned / dangling /
# manifest-drift). This is the "a fixture proves it fails" acceptance line of #111 — it guards the
# reusable assertion the same way coherence.yml guards this repo's own registry.
name: skill-union-selftest

on:
  pull_request:
    paths:
      - "scripts/skill-union-assert.sh"
      - "tests/skill-union/**"
      - ".github/workflows/skill-union-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/skill-union-assert.sh"
      - "tests/skill-union/**"
      - ".github/workflows/skill-union-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run the skill-union fixture
        run: bash tests/skill-union/run.sh
