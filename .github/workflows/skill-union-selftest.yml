# Self-test for the reusable skill-union assertion (FS-GG/.github#111, ADR-0014 P3.G3.1).
#
# Runs tests/skill-union/run.sh, which proves scripts/skill-union-assert.sh PASSES on a
# byte-identical union and FAILS on each violation class (divergent / partitioned / dangling /
# manifest-drift). This is the "a fixture proves it fails" acceptance line of #111 — it guards the
# reusable assertion the same way coherence.yml guards this repo's own registry.
#
# `scripts/lib/**` IS PART OF THE SUBJECT (#843). The assertion SOURCES lib/args.sh (#358) and
# lib/roots.sh (#524), so a change to either changes what this fixture tests — but the filter listed
# only the script, and an edit to a lib did not re-run the suite that covers it. That is #332's class,
# hand-repaired five times before #880 gated the narrower half of it (the two paths copies agreeing).
# A filter can agree with itself and still omit the subject's own dependencies.
name: skill-union-selftest

# The fixture asserts current truth about the skills themselves (tests/skill-union/check-current-truth.py), so a
# skill edit must run it: #4680/#4711 changed skills without touching a listed path and the fixture sat red on
# main until this repair (#4730). The fixture's link check also reads the ADRs and the one roadmap the publishing
# skill links to, so those are listed too; no wider docs/roadmaps/** wildcard, which changes constantly.
on:
  pull_request:
    paths:
      - "scripts/skill-union-assert.sh"
      - "scripts/lib/**"
      - "tests/skill-union/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "docs/adr/**"
      - "docs/roadmaps/utel-release-successor.md"
      - ".github/workflows/skill-union-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/skill-union-assert.sh"
      - "scripts/lib/**"
      - "tests/skill-union/**"
      - ".agents/skills/**"
      - ".claude/skills/**"
      - "docs/adr/**"
      - "docs/roadmaps/utel-release-successor.md"
      - ".github/workflows/skill-union-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: skill-union-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Run the skill-union fixture
        run: bash tests/skill-union/run.sh
