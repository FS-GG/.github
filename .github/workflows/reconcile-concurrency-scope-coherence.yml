name: reconcile-concurrency-scope-coherence

# This gate now validates the exact ADR-0091 retirement shape. The historical writer's concurrency
# safety is preserved as a negative fixture; the active workflow has no automatic trigger or writer
# to serialize.
on:
  pull_request:
    paths:
      - ".github/workflows/coord-board-reconcile.yml"
      - "scripts/check-reconcile-concurrency-scope.py"
      - "tests/reconcile-concurrency-scope/**"
      - ".github/workflows/reconcile-concurrency-scope-coherence.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/coord-board-reconcile.yml"
      - "scripts/check-reconcile-concurrency-scope.py"
      - "tests/reconcile-concurrency-scope/**"
      - ".github/workflows/reconcile-concurrency-scope-coherence.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reconcile-concurrency-scope-coherence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Exercise retirement shape and legacy-writer fault controls
        run: bash tests/reconcile-concurrency-scope/run.sh

  scope-fan-out-safe:
    runs-on: ubuntu-latest
    needs: fixture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Validate the exact retired board-projection diagnostic
        run: python scripts/check-reconcile-concurrency-scope.py --root .
