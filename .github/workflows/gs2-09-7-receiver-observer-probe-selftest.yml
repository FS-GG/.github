name: GS2-09.7 receiver observer probe self-test

on:
  pull_request:
    paths:
      - 'scripts/gs2-09-7-receiver-observer.py'
      - 'scripts/gs2-09-7-receiver-observer-host.py'
      - 'tests/gs2-09-7-receiver-observer-probe/**'
      - '.github/workflows/gs2-09-7-receiver-observer-probe.yml'
      - '.github/workflows/gs2-09-7-receiver-observer-probe-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gs2-09-7-receiver-observer.py'
      - 'scripts/gs2-09-7-receiver-observer-host.py'
      - 'tests/gs2-09-7-receiver-observer-probe/**'
      - '.github/workflows/gs2-09-7-receiver-observer-probe.yml'
      - '.github/workflows/gs2-09-7-receiver-observer-probe-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: gs2-09-7-receiver-observer-probe-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise secret-free observer refusals and isolation boundary
        run: python3 tests/gs2-09-7-receiver-observer-probe/test_receiver_observer_probe.py
