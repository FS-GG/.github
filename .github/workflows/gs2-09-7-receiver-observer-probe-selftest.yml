name: GS2-09.7 receiver observer probe self-test

on:
  pull_request:
    paths:
      - 'scripts/gs2-09-7-receiver-observer.py'
      - 'scripts/gs2-09-7-receiver-observer-host.py'
      - 'tests/gs2-09-7-receiver-observer-probe/**'
      - '.github/workflows/gs2-09-7-receiver-observer-probe.yml'
      - '.github/workflows/gs2-09-7-receiver-observer-probe-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/gs2-09-7-receiver-observer.py'
      - 'scripts/gs2-09-7-receiver-observer-host.py'
      - 'tests/gs2-09-7-receiver-observer-probe/**'
      - '.github/workflows/gs2-09-7-receiver-observer-probe.yml'
      - '.github/workflows/gs2-09-7-receiver-observer-probe-selftest.yml'
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: gs2-09-7-receiver-observer-probe-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise secret-free observer refusals and isolation boundary
        run: python3 tests/gs2-09-7-receiver-observer-probe/test_receiver_observer_probe.py
