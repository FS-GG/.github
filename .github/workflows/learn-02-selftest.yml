name: learn-02-selftest
on:
  pull_request:
    paths:
      - 'scripts/learn-dispatch.py'
      - 'scripts/learn-projection.py'
      - 'scripts/learn-calibration.py'
      - 'scripts/learn-calibration-join.sql'
      - 'tests/learn-dispatch/**'
      - 'scripts/learn-history-*'
      - 'scripts/requirements-learn-history.txt'
      - 'tests/learn-history/**'
      - 'scripts/learn-classifier-pilot.py'
      - 'scripts/learn-classifier-statistics.py'
      - 'scripts/learn-classifier-requirements.txt'
      - 'tests/learn-classifier/**'
      - 'contracts/learn/semantic-hardness-v1.schema.json'
      - '.agents/skills/assess-task-hardness/**'
      - '.claude/skills/assess-task-hardness/**'
      - 'reports/learn-03-semantic-classifier-protocol-v1.md'
      - '.github/workflows/learn-02-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/learn-dispatch.py'
      - 'scripts/learn-projection.py'
      - 'scripts/learn-calibration.py'
      - 'scripts/learn-calibration-join.sql'
      - 'tests/learn-dispatch/**'
      - 'scripts/learn-history-*'
      - 'scripts/requirements-learn-history.txt'
      - 'tests/learn-history/**'
      - 'scripts/learn-classifier-pilot.py'
      - 'scripts/learn-classifier-statistics.py'
      - 'scripts/learn-classifier-requirements.txt'
      - 'tests/learn-classifier/**'
      - 'contracts/learn/semantic-hardness-v1.schema.json'
      - '.agents/skills/assess-task-hardness/**'
      - '.claude/skills/assess-task-hardness/**'
      - 'reports/learn-03-semantic-classifier-protocol-v1.md'
      - '.github/workflows/learn-02-selftest.yml'
permissions:
  contents: read
concurrency:
  group: learn-02-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  offline-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # Fixed synthetic snapshots and mocked native/receiver IO; no live credentials or store effects.
      - run: python3 -m unittest discover -s tests/learn-dispatch -p 'test_*.py'
  offline-history-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.15.1'
      - run: python3 -m pip install --disable-pip-version-check -r scripts/requirements-learn-history.txt -r scripts/learn-classifier-requirements.txt
      # Synthetic controls only; no historical data, native API or telemetry store access.
      - run: python3 -m unittest discover -s tests/learn-history -p 'test_*.py'
      - run: python3 scripts/learn-history-multiverse.py --self-test
      - run: python3 -m unittest discover -s tests/learn-classifier -p 'test_*.py'
