name: Callable isolated operation executor readiness

on:
  workflow_dispatch:
    inputs:
      phase:
        description: Exact protected operation phase
        required: true
        type: choice
        options: [creation, identity-bound-operation]
      plan_seal:
        description: Exact prepared plan seal
        required: true
        type: string
      authorization_run_id:
        description: Exact completed authorization run id
        required: true
        type: string
      authorization_run_attempt:
        description: Exact completed authorization run attempt
        required: true
        type: string
      grant_artifact_id:
        description: Exact grant artifact id
        required: true
        type: string
      grant_artifact_sha256:
        description: Exact grant artifact digest
        required: true
        type: string
      grant_payload_sha256:
        description: Exact canonical grant payload digest
        required: true
        type: string
      grant_artifact_expires_at:
        description: Exact server-observed artifact expiry in canonical UTC seconds
        required: true
        type: string
      plan_run_id:
        description: Exact prepared plan run id
        required: true
        type: string
      plan_run_attempt:
        description: Exact prepared plan run attempt
        required: true
        type: string
      plan_artifact_id:
        description: Exact prepared plan artifact id
        required: true
        type: string
      plan_artifact_sha256:
        description: Exact prepared plan artifact digest
        required: true
        type: string
      creation_receipt_run_id:
        description: Phase-two creation receipt run id; empty for creation
        required: false
        type: string
      creation_receipt_run_attempt:
        description: Phase-two creation receipt run attempt; empty for creation
        required: false
        type: string
      creation_receipt_artifact_id:
        description: Phase-two creation receipt artifact id; empty for creation
        required: false
        type: string
      creation_receipt_artifact_sha256:
        description: Phase-two creation receipt digest; empty for creation
        required: false
        type: string
      checkpoint_run_id:
        description: Recovery checkpoint run id; all checkpoint fields empty for a fresh attempt
        required: false
        type: string
      checkpoint_run_attempt:
        description: Recovery checkpoint run attempt
        required: false
        type: string
      checkpoint_artifact_id:
        description: Recovery checkpoint artifact id
        required: false
        type: string
      checkpoint_artifact_sha256:
        description: Recovery checkpoint digest
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: callable-isolated-operation-execute
  cancel-in-progress: false

jobs:
  readiness:
    name: callable-isolated-operation-execution-unavailable
    environment: callable-isolated-operation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the exact authority revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Check out the exact reviewed Coordination source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FS-GG/FS.GG.Coordination
          ref: d46aa238d0f169c85a5822e62e49ab9df1ebf37d
          fetch-depth: 1
          persist-credentials: false
          path: coordination
      - name: Verify immutable source and build sealed readiness
        id: readiness
        env:
          AUTHORIZATION_RUN_ATTEMPT: ${{ inputs.authorization_run_attempt }}
          AUTHORIZATION_RUN_ID: ${{ inputs.authorization_run_id }}
          CHECKPOINT_ARTIFACT_ID: ${{ inputs.checkpoint_artifact_id }}
          CHECKPOINT_ARTIFACT_SHA256: ${{ inputs.checkpoint_artifact_sha256 }}
          CHECKPOINT_RUN_ATTEMPT: ${{ inputs.checkpoint_run_attempt }}
          CHECKPOINT_RUN_ID: ${{ inputs.checkpoint_run_id }}
          CREATION_RECEIPT_ARTIFACT_ID: ${{ inputs.creation_receipt_artifact_id }}
          CREATION_RECEIPT_ARTIFACT_SHA256: ${{ inputs.creation_receipt_artifact_sha256 }}
          CREATION_RECEIPT_RUN_ATTEMPT: ${{ inputs.creation_receipt_run_attempt }}
          CREATION_RECEIPT_RUN_ID: ${{ inputs.creation_receipt_run_id }}
          GRANT_ARTIFACT_ID: ${{ inputs.grant_artifact_id }}
          GRANT_ARTIFACT_SHA256: ${{ inputs.grant_artifact_sha256 }}
          GRANT_ARTIFACT_EXPIRES_AT: ${{ inputs.grant_artifact_expires_at }}
          GRANT_PAYLOAD_SHA256: ${{ inputs.grant_payload_sha256 }}
          PHASE: ${{ inputs.phase }}
          PLAN_ARTIFACT_ID: ${{ inputs.plan_artifact_id }}
          PLAN_ARTIFACT_SHA256: ${{ inputs.plan_artifact_sha256 }}
          PLAN_RUN_ATTEMPT: ${{ inputs.plan_run_attempt }}
          PLAN_RUN_ID: ${{ inputs.plan_run_id }}
          PLAN_SEAL: ${{ inputs.plan_seal }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = 'FS-GG/.github'
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(git -C coordination rev-parse HEAD)" = 'd46aa238d0f169c85a5822e62e49ab9df1ebf37d'
          test "$(sha256sum coordination/eng/callable-cli-isolated-operation-contract.json | cut -d ' ' -f 1)" = 'cc51765dd011672f0af4b4a1c7fb6c26f5d436b53e1e9d12104831bfe7914815'
          test "$(sha256sum coordination/eng/callable-cli-isolated-operation.py | cut -d ' ' -f 1)" = 'b5a20b2c511bf37833dac99c35eb1fa420f410f5b324fd26883e5af928cb145c'
          workflow_sha256="$(sha256sum .github/workflows/callable-isolated-operation-execute.yml | cut -d ' ' -f 1)"
          python3 tools/callable-isolated-operation-executor.py \
            --phase "$PHASE" --plan-seal "$PLAN_SEAL" \
            --grant-run-id "$AUTHORIZATION_RUN_ID" --grant-run-attempt "$AUTHORIZATION_RUN_ATTEMPT" \
            --grant-artifact-id "$GRANT_ARTIFACT_ID" --grant-artifact-sha256 "$GRANT_ARTIFACT_SHA256" \
            --grant-payload-sha256 "$GRANT_PAYLOAD_SHA256" --grant-artifact-expires-at "$GRANT_ARTIFACT_EXPIRES_AT" \
            --plan-run-id "$PLAN_RUN_ID" --plan-run-attempt "$PLAN_RUN_ATTEMPT" \
            --plan-artifact-id "$PLAN_ARTIFACT_ID" --plan-artifact-sha256 "$PLAN_ARTIFACT_SHA256" \
            --creation-receipt-run-id "$CREATION_RECEIPT_RUN_ID" --creation-receipt-run-attempt "$CREATION_RECEIPT_RUN_ATTEMPT" \
            --creation-receipt-artifact-id "$CREATION_RECEIPT_ARTIFACT_ID" --creation-receipt-artifact-sha256 "$CREATION_RECEIPT_ARTIFACT_SHA256" \
            --checkpoint-run-id "$CHECKPOINT_RUN_ID" --checkpoint-run-attempt "$CHECKPOINT_RUN_ATTEMPT" \
            --checkpoint-artifact-id "$CHECKPOINT_ARTIFACT_ID" --checkpoint-artifact-sha256 "$CHECKPOINT_ARTIFACT_SHA256" \
            --workflow-revision "$GITHUB_SHA" --workflow-sha256 "$workflow_sha256" \
            --output "$RUNNER_TEMP/callable-isolated-operation-readiness.json"
          echo 'available=false' >> "$GITHUB_OUTPUT"
      - name: Install and verify the exact public CLI only after every blocker is removed
        if: ${{ steps.readiness.outputs.available == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          echo 'executor source must be revised and requalified before this step can become reachable' >&2
          exit 1
      - name: Retain sealed unavailable disposition
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: callable-isolated-operation-readiness-${{ inputs.phase }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/callable-isolated-operation-readiness.json
          retention-days: 30
          if-no-files-found: error
      - name: Refuse execution while preparation is unavailable
        shell: bash
        run: |
          test '${{ steps.readiness.outputs.available }}' = false
          test "$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' "$RUNNER_TEMP/callable-isolated-operation-readiness.json")" = prepared-not-authorized
          echo 'execution-unavailable:prepared-not-authorized' >&2
          exit 1
