name: kit-auto-publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Observe and decide only; never tag or open/update a PR.'
        type: boolean
        default: true

# A single queue is the concurrency contract.  It covers the read, tag and
# evidence-PR transaction; cancellation would strand a half-observed release.
concurrency:
  group: kit-auto-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: read
      packages: read
      issues: write
    steps:
      # The App token is intentional: a GITHUB_TOKEN-created tag cannot start
      # release-kit.yml.  The same identity authors the evidence PR, so its CI
      # is not suppressed by Actions' recursion guard either.
      - name: Mint the release coordinator App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-organization-packages: read
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test the fail-closed state machine
        run: bash tests/kit-auto-publish/run.sh
      - name: Authenticated read-only observation
        id: observe
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/FS.GG.Kit/FS.GG.Kit.csproj -getProperty:Version | tr -d '[:space:]')"
          [ -n "$version" ] || { echo '::error::version unreadable'; exit 1; }
          package="fs.gg.kit.${version}.nupkg"
          org_url="https://nuget.pkg.github.com/FS-GG/download/FS.GG.Kit/${version}/FS.GG.Kit.${version}.nupkg"
          nuget_url="https://api.nuget.org/v3-flatcontainer/fs.gg.kit/${version}/${package}"
          observe_feed() {
            local name="$1" url="$2" auth="$3" code
            if [ "$auth" = yes ]; then code="$(curl --retry 2 --connect-timeout 10 -sS -u "x-access-token:${GH_TOKEN}" -o "${name}.nupkg" -w '%{http_code}' "$url" || true)"; else code="$(curl --retry 2 --connect-timeout 10 -sS -o "${name}.nupkg" -w '%{http_code}' "$url" || true)"; fi
            case "$code" in 200) printf present;; 404) rm -f "${name}.nupkg"; printf absent;; *) rm -f "${name}.nupkg"; printf unknown;; esac
          }
          org="$(observe_feed org "$org_url" yes)"; nuget="$(observe_feed nuget "$nuget_url" no)"
          # Frontiers are independently observed, not inferred from candidate
          # absence.  A listing/read failure remains `unknown` and refuses.
          org_latest="$(gh api 'orgs/FS-GG/packages/nuget/FS.GG.Kit/versions?per_page=100' --paginate --jq '[.[].name | select(test("^0\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty' 2>/dev/null || true)"
          nuget_latest="$(curl --retry 2 --connect-timeout 10 -fsS 'https://api.nuget.org/v3-flatcontainer/fs.gg.kit/index.json' 2>/dev/null | jq -r '[.versions[] | select(test("^0\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty' || true)"
          [ -n "$org_latest" ] || org_latest=unknown; [ -n "$nuget_latest" ] || nuget_latest=unknown
          tag="kit/v${version}"; tag_exists=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && tag_exists=true || true
          # Find the merged PR that introduced the evaluated version, rather
          # than assuming main's latest commit is that PR.  Every candidate is
          # checked at its immutable merge commit and PR head.
          provenance='{}'
          while IFS=$'\t' read -r number merge head; do
            [ -n "$number" ] || continue
            introduced="$(git show "$merge:src/FS.GG.Kit/FS.GG.Kit.csproj" 2>/dev/null | sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' | tail -1)"
            base="$(git show "$merge^:src/FS.GG.Kit/FS.GG.Kit.csproj" 2>/dev/null | sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' | tail -1)"
            [ "$introduced" = "$version" ] && [ "$base" != "$version" ] || continue
            # This is provenance for the already-merged authoring PR, not a
            # replacement merge gate.  Read the named workflow run and its
            # `pr-arm` job rather than re-implementing the check-run rollup;
            # PR merging itself remains exclusively `fsgg-coord landable`.
            run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow kit-published-coherence.yml --commit "$head" --event pull_request --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$run_id" ] || continue
            gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "pr-arm" and .conclusion == "success") | .databaseId' | grep -q . || continue
            git merge-base --is-ancestor "$merge" origin/main || continue
            provenance="$(jq -n --arg n "$number" --arg merge "$merge" --arg head "$head" --arg version "$introduced" '{number:($n|tonumber),mergeCommit:$merge,head:$head,mergedReachable:true,introducedVersion:$version,prArm:"pass"}')"; break
          done < <(gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 100 --json number,mergeCommit,headRefOid --jq '.[] | [.number, .mergeCommit.oid, .headRefOid] | @tsv')
          source_sha="$GITHUB_SHA"
          # Artifact identity is the commit the tag will point at; authoring
          # provenance remains separately bound in `.provenance.mergeCommit`.
          source_sha="$GITHUB_SHA"
          release='null'
          if [ "$org" = present ] && [ "$nuget" = present ]; then
            org_commit="$(unzip -p org.nupkg '*.nuspec' 2>/dev/null | sed -n 's/.*repository[^>]*commit="\([^"]*\)".*/\1/p' | head -1)"
            nuget_commit="$(unzip -p nuget.nupkg '*.nuspec' 2>/dev/null | sed -n 's/.*repository[^>]*commit="\([^"]*\)".*/\1/p' | head -1)"
            if [ -n "$org_commit" ] && [ "$org_commit" = "$nuget_commit" ]; then
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-kit.yml --status success --limit 100 --json databaseId,url,headSha | jq -c --arg sha "$org_commit" '.[] | select(.headSha == $sha) | {id:(.databaseId|tostring),url:.url}' | head -1 || true)"
              [ -n "$run" ] && release="$(jq -c --arg commit "$org_commit" '. + {nuspecCommit:$commit}' <<<"$run")"
            fi
          fi
          jq -n --arg version "$version" --arg sha "$source_sha" --argjson provenance "$provenance" --arg org "$org" --arg nuget "$nuget" --arg orgLatest "$org_latest" --arg nugetLatest "$nuget_latest" --argjson tag "$tag_exists" --argjson release "$release" '{version:$version,sourceSha:$sha,provenance:$provenance,orgFeed:$org,nugetFeed:$nuget,orgLatest:$orgLatest,nugetLatest:$nugetLatest,tagExists:$tag,releaseRun:$release}' > facts.json
          python3 scripts/kit-auto-publish.py --facts facts.json --json | tee decision.json
          echo "action=$(jq -r .action decision.json)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Tag the sole eligible state
        if: steps.observe.outputs.action == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          VERSION: ${{ steps.observe.outputs.version }}
        run: |
          set -euo pipefail
          tag="kit/v${VERSION}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo '::error::tag appeared after observation; refusing'; exit 1; }
          git tag -a "$tag" -m "Auto-publish FS.GG.Kit ${VERSION} after merged pr-arm evidence"
          git push origin "refs/tags/$tag"
      - name: Escalate a non-eligible or partial state once
        if: steps.observe.outputs.action == 'refuse' || steps.observe.outputs.action == 'stickyEscalate'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ steps.observe.outputs.action }}
        run: |
          set -euo pipefail
          marker='<!-- fsgg:kit-auto-publish-escalation -->'; issue=2106
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --paginate)"
          existing="$(jq -r '.[] | select(.body | startswith("<!-- fsgg:kit-auto-publish-escalation -->")) | .id' <<<"$comments" | head -1)"
          previous=/tmp/previous-escalation.json
          if [ -n "$existing" ]; then jq -r '.[] | select(.id == '"$existing"') | .body' <<<"$comments" | sed -n '/^```json$/,/^```$/p' | sed '1d;$d' > "$previous"; fi
          args=()
          if [ -n "$existing" ]; then
            [ -s "$previous" ] || { echo '::error::existing sticky marker has no typed JSON state'; exit 1; }
            args+=(--previous-escalation "$previous")
          fi
          python3 scripts/kit-auto-publish.py --facts facts.json --json --run "$GITHUB_RUN_ID" "${args[@]}" > escalation-decision.json
          state="$(jq -c .escalation escalation-decision.json)"
          jq -e '.valid == true' <<<"$state" >/dev/null || { echo '::error::sticky marker state malformed; refusing to overwrite'; exit 1; }
          body="$marker\n\n```json\n$state\n```\n\nAuto-publish performed no tag, feed, or evidence-PR write. [Run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)."
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label blocked
          if [ -n "$existing" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null; else gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="$body" >/dev/null; fi
      - name: Open or update the publish evidence PR
        if: steps.observe.outputs.action == 'openEvidencePr' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.observe.outputs.version }}
          SOURCE_SHA: ${{ steps.observe.outputs.source-sha }}
          BRANCH: bot/kit-auto-publish-evidence
        run: |
          set -euo pipefail
          run="$(jq -r '.releaseRun.url' facts.json)"; org="https://nuget.pkg.github.com/FS-GG/download/FS.GG.Kit/${VERSION}/FS.GG.Kit.${VERSION}.nupkg"; nuget="https://api.nuget.org/v3-flatcontainer/fs.gg.kit/${VERSION}/fs.gg.kit.${VERSION}.nupkg"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "297630107+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          entry="$(printf '%s' "- **$(date -u +%F)** — **auto-publish evidence: FS.GG.Kit ${VERSION}** (owner github; refs [.github#2106](https://github.com/FS-GG/.github/issues/2106)): [release run](${run}) published the structurally single-packed artifact to [GitHub Packages](${org}) and [nuget.org](${nuget}). Both served nuspecs record repository commit ${SOURCE_SHA}.")"
          grep -Fq "auto-publish evidence: FS.GG.Kit ${VERSION}" registry/CHANGELOG.md || sed -i "2i\\${entry}" registry/CHANGELOG.md
          git add registry/CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: record FS.GG.Kit ${VERSION} auto-publish evidence"
          git push --force-with-lease origin "$BRANCH"
          body="Automated evidence for FS.GG.Kit ${VERSION}.\n\n- release run: ${run}\n- GitHub Packages: ${org}\n- nuget.org: ${nuget}\n- both served nuspecs: ${SOURCE_SHA}\n\nHuman/critic review is required before merge.\n\nCloses #2106"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "docs: record FS.GG.Kit ${VERSION} publish evidence" --body "$body"; fi
