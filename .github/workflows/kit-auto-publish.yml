name: kit-auto-publish

# GS2-08.9 sealed the legacy automatic publisher after the immutable 0.90 bridge completed.
# This retained entry point is qualification-only: it has no scheduled/push trigger, write
# permission, credential mint, artifact upload, tag, release, dispatch, or evidence-write edge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Qualify retired kit auto-publisher locally
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test the retained fail-closed decision engine
        run: python3 tests/release-effect-sealing/run.py
      - name: Confirm the coherent set remains the completed bridge version
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/FS.GG.Kit/FS.GG.Kit.csproj -getProperty:Version | tr -d '[:space:]')"
          [ "$version" = 0.90.0 ] || {
            echo '::error::the sealed legacy publisher cannot prepare a successor version'
            exit 1
          }
          echo "Legacy auto-publication is sealed; local qualification passed for $version."
