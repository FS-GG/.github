name: kit-auto-publish

on:
  push:
    branches: [main]
  schedule:
    - cron: '11 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Observe and decide only; never tag or open/update a PR.'
        type: boolean
        default: true

# A single queue is the concurrency contract.  It covers the read, tag and
# evidence-PR transaction; cancellation would strand a half-observed release.
concurrency:
  group: kit-auto-publish
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  decide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write
      actions: read
      packages: read
      issues: write
    steps:
      # The App token is intentional, and it is intentional ONLY FOR THE WRITES:
      # a GITHUB_TOKEN-created tag cannot start release-kit.yml, and the same
      # identity authors the evidence PR so its CI is not suppressed by Actions'
      # recursion guard either.  Every READ below uses the run-scoped
      # GITHUB_TOKEN instead — see the observation step.
      #
      # A mint requests permissions; it does not receive a subset.  GitHub
      # refuses the WHOLE mint with 422 "The permissions requested are not
      # granted to this installation" if any ONE requested scope is ungranted,
      # so the three below must stay a subset of what fs-gg-cross-repo-dispatch
      # actually grants (`gh api /orgs/FS-GG/installations`):
      #
      #   administration:write  contents:write  issues:write  metadata:read
      #   organization_administration:read  packages:read  pull_requests:write
      #
      # This step is UNCONDITIONAL, which is what makes an ungranted scope
      # unrecoverable here.  Do not read it as the fail-closed
      # dormant-until-configured pattern of .github#157 / FS.GG.Templates#83:
      # those steps are variable-gated and skip cleanly when unprovisioned, so
      # releases keep working.  This one cannot skip.  If it 422s, the workflow
      # is dead on every push and every hour until a scope is removed here or
      # granted to the installation by an org owner — as it was for all 56 runs
      # between 2026-08-03 and .github#2234, none of which ever reached a step
      # past this one.  `permission-organization-packages: read` was the scope
      # that did it: the installation carries repository-scoped `packages`, and
      # the organization-scoped permission was never granted at all.
      - name: Mint the release coordinator App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Test the fail-closed state machine
        run: bash tests/kit-auto-publish/run.sh
      # Read-only, so it uses the LEAST-privileged token that can do the job:
      # the run-scoped GITHUB_TOKEN carrying this job's own `permissions:` block
      # (actions: read, packages: read, contents: write, pull-requests: write).
      # That block existed before this step could use it — `packages: read` had
      # no consumer at all while the App token held GH_TOKEN.
      #
      # The App token is not merely unnecessary here, it is INSUFFICIENT: an
      # installation token is 403 on the GitHub Packages registry
      # (nuget.pkg.github.com), where the run-scoped token succeeds.  Measured
      # side by side on 2026-08-05, actions/runs/30984500498:
      #
      #   nuget.pkg.github.com/FS-GG/download/…  App 403   GITHUB_TOKEN 302→200
      #   orgs/FS-GG/packages/nuget/…/versions   App 200   GITHUB_TOKEN 200
      #   repos/…/actions/workflows/…/runs       App 200   GITHUB_TOKEN 200
      #   repos/…/pulls?state=closed             App 200   GITHUB_TOKEN 200
      #
      # So no grant of `organization_packages` would have fixed the download
      # either; swapping the token is the fix, and dropping the scope is safe
      # because nothing minted here reads packages any more.
      - name: Authenticated read-only observation
        id: observe
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(dotnet msbuild src/FS.GG.Kit/FS.GG.Kit.csproj -getProperty:Version | tr -d '[:space:]')"
          [ -n "$version" ] || { echo '::error::version unreadable'; exit 1; }
          package="fs.gg.kit.${version}.nupkg"
          org_url="https://nuget.pkg.github.com/FS-GG/download/FS.GG.Kit/${version}/FS.GG.Kit.${version}.nupkg"
          nuget_url="https://api.nuget.org/v3-flatcontainer/fs.gg.kit/${version}/${package}"
          # `-L` is load-bearing, not tidying.  Both feeds answer a nupkg
          # download with a 302 to presigned blob storage, and `%{http_code}`
          # without `-L` reports that 302 — which is neither 200 nor 404, so a
          # PUBLISHED package was observed as `unknown` and refused.  curl drops
          # the credentials on a cross-host redirect, which is correct here: the
          # storage URL carries its own signature.
          observe_feed() {
            local name="$1" url="$2" auth="$3" code
            if [ "$auth" = yes ]; then code="$(curl --retry 2 --connect-timeout 10 -sSL -u "x-access-token:${GH_TOKEN}" -o "${name}.nupkg" -w '%{http_code}' "$url" || true)"; else code="$(curl --retry 2 --connect-timeout 10 -sSL -o "${name}.nupkg" -w '%{http_code}' "$url" || true)"; fi
            case "$code" in 200) printf present;; 404) rm -f "${name}.nupkg"; printf absent;; *) rm -f "${name}.nupkg"; printf unknown;; esac
          }
          org="$(observe_feed org "$org_url" yes)"; nuget="$(observe_feed nuget "$nuget_url" no)"
          # Frontiers are independently observed, not inferred from candidate
          # absence.  A listing/read failure remains `unknown` and refuses.
          org_latest="$(gh api 'orgs/FS-GG/packages/nuget/FS.GG.Kit/versions?per_page=100' --paginate --jq '[.[].name | select(test("^0\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty' 2>/dev/null || true)"
          nuget_latest="$(curl --retry 2 --connect-timeout 10 -fsS 'https://api.nuget.org/v3-flatcontainer/fs.gg.kit/index.json' 2>/dev/null | jq -r '[.versions[] | select(test("^0\\.[0-9]+\\.[0-9]+$"))] | sort_by(split(".") | map(tonumber)) | last // empty' || true)"
          [ -n "$org_latest" ] || org_latest=unknown; [ -n "$nuget_latest" ] || nuget_latest=unknown
          tag="kit/v${version}"; tag_exists=false
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && tag_exists=true || true
          # Resolve <Version> at a given commit/path, following ONE level of MSBuild property
          # indirection through Directory.Build.props.  .github#2410 (coherent-set versioning) made
          # FS.GG.Kit.csproj's <Version> a property REFERENCE, `$(FsggCoherentSetVersion)`, not a
          # literal.  A raw regex over the csproj alone reads that reference as its own literal text,
          # which never matches the msbuild-resolved `$version` computed above — so the provenance
          # search below found no match for ANY candidate merge from that commit forward, `provenance`
          # stayed `{}` on every run, and the state machine refused every version forever
          # (.github#2435).  Extracted between the BEGIN/END markers by tests/kit-auto-publish/run.sh.
          # BEGIN kit-csproj-version
          csproj_version() {
            local commit="$1" path="$2" raw prop
            raw="$(git show "$commit:$path" 2>/dev/null | sed -n 's:.*<Version>\([^<]*\)</Version>.*:\1:p' | tail -1)"
            case "$raw" in
              '$('*')')
                prop="${raw#\$\(}"; prop="${prop%\)}"
                git show "$commit:Directory.Build.props" 2>/dev/null | sed -n 's:.*<'"$prop"'>\([^<]*\)</'"$prop"'>.*:\1:p' | tail -1
                ;;
              *)
                printf '%s' "$raw"
                ;;
            esac
          }
          # END kit-csproj-version
          # BEGIN kit-provenance-search
          # Mirrors `observe_feed()`'s `curl --retry 2 --connect-timeout 10` convention (above in
          # this same step) for the `gh` CLI calls this loop makes, none of which carried ANY retry
          # before .github#2443: a single transient network/TLS blip on `gh run view` (observed live
          # at 4bb788e6, https://github.com/FS-GG/.github/actions/runs/31588955946) fell straight
          # through this loop's `|| continue` and read exactly like a verified-absent pr-arm job,
          # escalating the wrong refusal reason (`merged-pr-provenance-missing` instead of the real,
          # differently-refusing state). A call that RECOVERS on retry now gets its real answer
          # instead of being silently read as absent; a call that is genuinely, persistently
          # unreachable still returns non-zero once retries exhaust, so a REAL absence is unchanged.
          #
          # `gh_retry` keeps only the LAST attempt's stderr (earlier retries' noise is discarded) — a
          # genuinely exhausted failure must still print the real diagnostic (the TLS error text this
          # very issue quotes as evidence), or a future recurrence of this or any other persistent `gh`
          # failure here leaves no trace in the job log (round-1 review repair 2).
          #
          # Emits `$out` WITH a trailing newline (round-2 review repair 3), even though `$(...)`
          # already stripped whatever the wrapped command originally ended with. `gh_retry` is piped
          # directly into `find_provenance`'s `while read` loop at the bottom of this file
          # (`gh_retry gh pr list ... | find_provenance "$version"`), and bash's `read` silently drops
          # the FINAL record of its input when that input's last line has no trailing newline — it
          # still populates the loop variables for that partial line, but returns failure, so the loop
          # body never runs for it. A bare `printf '%s' "$out"` reproduced that missing-newline shape
          # on EVERY call, silently discarding whichever PR happened to be listed last — which, in the
          # single-candidate case (exactly one merged PR introduced the evaluated version — the common
          # case), is the one and only real match: `find_provenance` would see nothing at all and
          # complete normally with `provenance={}`, rather than failing loudly OR finding the evidence.
          gh_retry() {
            local attempt=0 max_retries=2 rc=0 out err_file
            err_file="$(mktemp)"
            while :; do
              if out="$("$@" 2>"$err_file")"; then
                rm -f "$err_file"
                printf '%s\n' "$out"
                return 0
              else
                # NOT a bare `rc=$?` after the `if ...; fi` above — bash's own `if` exits 0 in that
                # shape whenever the then-branch does not run, regardless of the condition's real
                # status, so `rc` would silently stay 0 on every failure and this function would
                # never actually report one. Capturing inside `else` is what makes the real exit
                # code visible (the same fix as `provenance_evidence`/`find_provenance` below).
                rc=$?
              fi
              attempt=$((attempt + 1))
              if [ "$attempt" -gt "$max_retries" ]; then
                cat "$err_file" >&2
                rm -f "$err_file"
                return "$rc"
              fi
              sleep 1
            done
          }
          # Evidence for ONE already version-matched candidate PR: is its
          # `kit-published-coherence.yml` run's `pr-arm` job a success, and is the merge commit
          # reachable from `origin/main`?  Split out of the calling while-loop below so it is
          # unit-testable against a stubbed `gh` in isolation from PR listing and `csproj_version`
          # matching — see tests/kit-auto-publish/run.sh.
          #
          # Returns 0 with the evidence JSON on stdout when found; 1 when this candidate is
          # POSITIVELY VERIFIED to lack evidence (a `gh`/`git` call answered and the answer was
          # negative); 2 when a `gh` call could not be completed even after retry. An INCONCLUSIVE
          # check (2) must never be folded into the same outcome as a verified absence (1) — that IS
          # the loud-crash-to-silent-refusal regression round 1 of review caught in this fix's first
          # draft: wrapping `gh run list`'s previously-UNGUARDED, previously loudly `set -e`-crashing
          # call in a uniform `|| return 1` made a persistent failure on it indistinguishable from
          # "provenance genuinely absent" — a call for which that ambiguity did not exist before this
          # fix (round-1 review repair 1). Every assignment below that can fail is inside an `if`/`||`
          # guard specifically so a failure is inspectable rather than tripping this step's own
          # `set -e` before the distinction can be drawn.
          provenance_evidence() {
            local number="$1" merge="$2" head="$3" version="$4" run_id run_view_out
            # This is provenance for the already-merged authoring PR, not a
            # replacement merge gate.  Read the named workflow run and its
            # `pr-arm` job rather than re-implementing the check-run rollup;
            # PR merging itself remains exclusively `fsgg-coord landable`.
            if ! run_id="$(gh_retry gh run list --repo "$GITHUB_REPOSITORY" --workflow kit-published-coherence.yml --commit "$head" --event pull_request --status success --limit 20 --json databaseId --jq '.[0].databaseId // empty')"; then
              echo "::error::gh run list failed for PR #$number after retries; refusing to fold an UNCHECKED candidate into a verified-absent refusal (.github#2443)" >&2
              return 2
            fi
            [ -n "$run_id" ] || return 1
            if ! run_view_out="$(gh_retry gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json jobs --jq '.jobs[] | select(.name == "pr-arm" and .conclusion == "success") | .databaseId')"; then
              echo "::error::gh run view failed for run $run_id (PR #$number) after retries; refusing to fold an UNCHECKED candidate into a verified-absent refusal (.github#2443)" >&2
              return 2
            fi
            printf '%s' "$run_view_out" | grep -q . || return 1
            git merge-base --is-ancestor "$merge" origin/main || return 1
            jq -n --arg n "$number" --arg merge "$merge" --arg head "$head" --arg version "$version" '{number:($n|tonumber),mergeCommit:$merge,head:$head,mergedReachable:true,introducedVersion:$version,prArm:"pass"}'
          }
          # Walks candidate merged PRs (TSV on stdin: number, merge-commit, head — already MERGED,
          # per `gh pr list --state merged`), matching each against `$1` (the evaluated version) via
          # `csproj_version`, and prints the first one `provenance_evidence` confirms, or `{}` when
          # every checked candidate genuinely lacked evidence. A candidate that matched the version but
          # could NOT be checked (`provenance_evidence` rc 2) exits this whole step LOUDLY (annotated,
          # non-zero) instead of silently moving on — see the rc-2 doc comment above.
          find_provenance() {
            local version="$1" number merge head introduced base evidence ev_rc
            while IFS=$'\t' read -r number merge head; do
              [ -n "$number" ] || continue
              introduced="$(csproj_version "$merge" src/FS.GG.Kit/FS.GG.Kit.csproj)"
              base="$(csproj_version "$merge^" src/FS.GG.Kit/FS.GG.Kit.csproj)"
              [ "$introduced" = "$version" ] && [ "$base" != "$version" ] || continue
              if evidence="$(provenance_evidence "$number" "$merge" "$head" "$introduced")"; then
                printf '%s' "$evidence"
                return 0
              else
                # NOT `ev_rc=$?` after a bare `if ...; fi` with no matching branch — bash's own `if`
                # exits 0 in that shape regardless of the condition's real status (only the taken
                # branch's status propagates). Capturing inside `else` is what makes 1 vs 2 visible.
                ev_rc=$?
              fi
              if [ "$ev_rc" -eq 2 ]; then
                echo "::error::provenance check for the matching candidate PR #$number could not complete after retries — refusing rather than reporting a possibly-wrong refuse reason (.github#2443)" >&2
                exit 1
              fi
            done
            printf '{}'
          }
          # END kit-provenance-search
          # Find the merged PR that introduced the evaluated version, rather
          # than assuming main's latest commit is that PR.  Every candidate is
          # checked at its immutable merge commit and PR head.
          provenance="$(gh_retry gh pr list --repo "$GITHUB_REPOSITORY" --state merged --limit 100 --json number,mergeCommit,headRefOid --jq '.[] | [.number, .mergeCommit.oid, .headRefOid] | @tsv' | find_provenance "$version")"
          # Artifact identity is the commit the tag will point at; authoring
          # provenance remains separately bound in `.provenance.mergeCommit`.
          # For an ALREADY-tagged version that is what the tag already points
          # at, which is the commit the served nuspecs record — not $GITHUB_SHA,
          # which is merely whatever main happens to be when this run fires.
          # Comparing the nuspec commit against $GITHUB_SHA made every run after
          # a release report `published-nuspec-commit-disagrees` about two feeds
          # that agree exactly.  Where the tag does not exist yet the fallback is
          # $GITHUB_SHA, which is precisely the commit the tag step will create
          # it at, so the irreversible `tag` edge is unchanged.
          source_sha="$(git rev-parse -q --verify "refs/tags/${tag}^{commit}" 2>/dev/null || echo "$GITHUB_SHA")"
          release='null'
          if [ "$org" = present ] && [ "$nuget" = present ]; then
            org_commit="$(unzip -p org.nupkg '*.nuspec' 2>/dev/null | sed -n 's/.*repository[^>]*commit="\([^"]*\)".*/\1/p' | head -1)"
            nuget_commit="$(unzip -p nuget.nupkg '*.nuspec' 2>/dev/null | sed -n 's/.*repository[^>]*commit="\([^"]*\)".*/\1/p' | head -1)"
            if [ -n "$org_commit" ] && [ "$org_commit" = "$nuget_commit" ]; then
              run="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow release-kit.yml --status success --limit 100 --json databaseId,url,headSha | jq -c --arg sha "$org_commit" '.[] | select(.headSha == $sha) | {id:(.databaseId|tostring),url:.url}' | head -1 || true)"
              [ -n "$run" ] && release="$(jq -c --arg commit "$org_commit" '. + {nuspecCommit:$commit}' <<<"$run")"
            fi
          fi
          jq -n --arg version "$version" --arg sha "$source_sha" --argjson provenance "$provenance" --arg org "$org" --arg nuget "$nuget" --arg orgLatest "$org_latest" --arg nugetLatest "$nuget_latest" --argjson tag "$tag_exists" --argjson release "$release" '{version:$version,sourceSha:$sha,provenance:$provenance,orgFeed:$org,nugetFeed:$nuget,orgLatest:$orgLatest,nugetLatest:$nugetLatest,tagExists:$tag,releaseRun:$release}' > facts.json
          python3 scripts/kit-auto-publish.py --facts facts.json --json | tee decision.json
          echo "action=$(jq -r .action decision.json)" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source-sha=$source_sha" >> "$GITHUB_OUTPUT"
      - name: Tag the sole eligible state
        if: steps.observe.outputs.action == 'tag' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          VERSION: ${{ steps.observe.outputs.version }}
        run: |
          set -euo pipefail
          tag="kit/v${VERSION}"
          git rev-parse -q --verify "refs/tags/$tag" >/dev/null && { echo '::error::tag appeared after observation; refusing'; exit 1; }
          git tag -a "$tag" -m "Auto-publish FS.GG.Kit ${VERSION} after merged pr-arm evidence"
          git push origin "refs/tags/$tag"
      - name: Escalate a non-eligible or partial state once
        if: steps.observe.outputs.action == 'refuse' || steps.observe.outputs.action == 'stickyEscalate'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ACTION: ${{ steps.observe.outputs.action }}
        run: |
          set -euo pipefail
          marker='<!-- fsgg:kit-auto-publish-escalation -->'; issue=2106; streak_fail_threshold=3
          # A refusal is not a failure: every step above leaves this job's own exit code at 0, so a
          # persistent refusal is invisible to anything that reads run conclusions, and a sticky
          # comment nobody is watching on a CLOSED issue is the only trace (.github#2435). Two
          # independent fixes below close that gap: the escalation target is kept OPEN so it is
          # reachable from an open-issue view, and a sustained streak fails THIS job so the refusal is
          # visible without reading any issue at all. A one-off refusal staying green is intentional —
          # only a streak at or beyond the bound reds.
          issue_state="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue" | jq -r .state)"
          [ "$issue_state" = "open" ] || gh issue reopen "$issue" --repo "$GITHUB_REPOSITORY"
          comments="$(gh api "repos/$GITHUB_REPOSITORY/issues/$issue/comments" --paginate)"
          existing="$(jq -r '.[] | select(.body | startswith("<!-- fsgg:kit-auto-publish-escalation -->")) | .id' <<<"$comments" | head -1)"
          previous=/tmp/previous-escalation.json
          if [ -n "$existing" ]; then jq -r '.[] | select(.id == '"$existing"') | .body' <<<"$comments" | sed -n '/^```json$/,/^```$/p' | sed '1d;$d' > "$previous"; fi
          args=()
          if [ -n "$existing" ]; then
            [ -s "$previous" ] || { echo '::error::existing sticky marker has no typed JSON state'; exit 1; }
            args+=(--previous-escalation "$previous")
          fi
          python3 scripts/kit-auto-publish.py --facts facts.json --json --run "$GITHUB_RUN_ID" "${args[@]}" > escalation-decision.json
          state="$(jq -c .escalation escalation-decision.json)"
          jq -e '.valid == true' <<<"$state" >/dev/null || { echo '::error::sticky marker state malformed; refusing to overwrite'; exit 1; }
          # A refusal reason can be permanent and expected BY DESIGN (.github#2442:
          # `candidate-not-next-patch` on a coherent-set minor bump keeps the frontier rail intact on
          # purpose) rather than a defect — `scripts/kit-auto-publish.py`'s `SCOPE_NOTES` attaches the
          # explanation to the decision itself, so it is empty for an ordinary/actionable refusal and
          # non-empty only for a reason known in advance to recur without being a bug (.github#2435).
          note="$(jq -r '.note // empty' escalation-decision.json)"
          # A double-quoted one-liner here has two independent quoting defects (.github#2346): the
          # fence backticks open command substitution inside double quotes, and `\n` inside double
          # quotes is a literal backslash-n, not a newline. Both crashed this step at exit 127 before
          # it ever wrote the sticky marker or the `blocked` label, so a correct refusal was silent.
          # `printf`'s FORMAT is single-quoted, so the fence backticks are inert literal text (single
          # quotes admit no command substitution, nested or not) and its own `\n` escapes become real
          # newlines; `$marker`/`$state`/`$note` are supplied as `%s` DATA arguments, never re-parsed
          # as shell.
          note_suffix=""
          [ -z "$note" ] || note_suffix="$(printf '\n\n%s' "$note")"
          body="$(printf '%s\n\n```json\n%s\n```\n\nAuto-publish performed no tag, feed, or evidence-PR write. [Run](%s/%s/actions/runs/%s).%s' "$marker" "$state" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$note_suffix")"
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label blocked
          if [ -n "$existing" ]; then gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -f body="$body" >/dev/null; else gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$issue/comments" -f body="$body" >/dev/null; fi
          # The sticky comment and label above are written FIRST, unconditionally — they are the
          # durable record and must land even on a bounded-streak failure below. Only after they are
          # written does a sustained streak fail the job itself, which is the mechanism a human or
          # agent reading `gh pr checks` / run conclusions actually notices without opening #2106.
          streak="$(jq -r '.streak' <<<"$state")"
          if [ "$streak" -ge "$streak_fail_threshold" ]; then
            note_annotation=""
            [ -z "$note" ] || note_annotation=" $note"
            echo "::error::kit-auto-publish streak bound reached: '$(jq -r .action <<<"$state")/$(jq -r .reason <<<"$state")' for $streak consecutive runs (>= $streak_fail_threshold) — failing this job so the refusal is visible without reading issue #$issue's comments. See the sticky comment above for the typed state.${note_annotation}"
            exit 1
          fi
      - name: Open or update the publish evidence PR
        if: steps.observe.outputs.action == 'openEvidencePr' && (github.event_name != 'workflow_dispatch' || inputs.dry-run != true)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ steps.observe.outputs.version }}
          SOURCE_SHA: ${{ steps.observe.outputs.source-sha }}
          BRANCH: bot/kit-auto-publish-evidence
        run: |
          set -euo pipefail
          run="$(jq -r '.releaseRun.url' facts.json)"; org="https://nuget.pkg.github.com/FS-GG/download/FS.GG.Kit/${VERSION}/FS.GG.Kit.${VERSION}.nupkg"; nuget="https://api.nuget.org/v3-flatcontainer/fs.gg.kit/${VERSION}/fs.gg.kit.${VERSION}.nupkg"
          git config user.name "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "297630107+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          entry="$(printf '%s' "- **$(date -u +%F)** — **auto-publish evidence: FS.GG.Kit ${VERSION}** (owner github; refs [.github#2106](https://github.com/FS-GG/.github/issues/2106)): [release run](${run}) published the structurally single-packed artifact to [GitHub Packages](${org}) and [nuget.org](${nuget}). Both served nuspecs record repository commit ${SOURCE_SHA}.")"
          grep -Fq "auto-publish evidence: FS.GG.Kit ${VERSION}" registry/CHANGELOG.md || sed -i "2i\\${entry}" registry/CHANGELOG.md
          git add registry/CHANGELOG.md
          git diff --cached --quiet || git commit -m "docs: record FS.GG.Kit ${VERSION} auto-publish evidence"
          git push --force-with-lease origin "$BRANCH"
          body="Automated evidence for FS.GG.Kit ${VERSION}.\n\n- release run: ${run}\n- GitHub Packages: ${org}\n- nuget.org: ${nuget}\n- both served nuspecs: ${SOURCE_SHA}\n\nHuman/critic review is required before merge.\n\nCloses #2106"
          existing="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then gh pr edit "$existing" --repo "$GITHUB_REPOSITORY" --body "$body"; else gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$BRANCH" --title "docs: record FS.GG.Kit ${VERSION} publish evidence" --body "$body"; fi
