name: release-new-sdd-workspace

# GS2-08.9 retired this direct package publisher. The manual route remains useful for a local
# pack qualification, but it carries no package/OIDC credential and has no publish edge.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify:
    name: Pack new-sdd-workspace locally
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Pack without publication credentials
        run: dotnet pack scripts/NewSddWorkspace/NewSddWorkspace.fsproj -c Release -o artifacts/packages
      - name: Report the sealed route
        run: echo 'Legacy new-sdd-workspace publication is sealed; the package was prepared only on the runner.'
