name: release-new-sdd-workspace

# TSDD-KNOWLEDGE-01.4: retain the existing NuGet Trusted Publishing filename.
# GS2-08.9's no-effect seal is superseded only for this exact-source, protected-
# journal wizard 0.13.0 successor. Default dispatch remains read-only.
on:
  workflow_dispatch:
    inputs:
      candidate_run_id:
        description: Successful first-attempt Wizard candidate run ID
        required: true
        type: string
      candidate_artifact_id:
        description: Exact retained Wizard candidate artifact ID
        required: true
        type: string
      candidate_archive_sha256:
        description: SHA-256 of the raw Actions candidate artifact archive
        required: true
        type: string
      verify_nuget_login:
        description: Verify this workflow and environment's NuGet OIDC policy without publishing
        required: true
        default: false
        type: boolean
      publish:
        description: Publish only after passing exact-source preflight and authority setup
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release-new-sdd-workspace-successor-publish
  cancel-in-progress: false

jobs:
  publish:
    name: new-sdd-workspace-013-publisher
    if: github.ref == 'refs/heads/main' && github.actor == 'EHotwagner'
    runs-on: ubuntu-latest
    environment: release-successor
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Qualify admitted Wizard effect ordering and protected journal
        run: |
          set -euo pipefail
          python3 tests/release-successor-execution/run.py
          python3 tests/release-successor-journal/run.py
          python3 tests/new-sdd-workspace-successor/run.py
      - name: Mint the ordinary protected-journal writer token
        id: ledger
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.FSGG_ORDINARY_LEDGER_APP_ID }}
          private-key: ${{ secrets.FSGG_ORDINARY_LEDGER_APP_PRIVATE_KEY }}
          owner: FS-GG
          repositories: FS.GG.Coordination.Authority
          permission-contents: write
      - name: Bind the proved installation
        env:
          ACTUAL_INSTALLATION_ID: ${{ steps.ledger.outputs.installation-id }}
          EXPECTED_INSTALLATION_ID: ${{ secrets.FSGG_ORDINARY_LEDGER_INSTALLATION_ID }}
        run: test "$ACTUAL_INSTALLATION_ID" = "$EXPECTED_INSTALLATION_ID"
      - name: Exchange nuget.org trusted publishing identity
        if: inputs.publish || inputs.verify_nuget_login
        id: nuget
        uses: NuGet/login@v1
        with:
          user: Paradigma11
      - name: Verify nuget.org credential preflight
        if: inputs.verify_nuget_login
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: test -n "$NUGET_API_KEY"
      - name: Preflight or publish exact retained Wizard candidate
        env:
          GH_TOKEN: ${{ github.token }}
          ORDINARY_LEDGER_TOKEN: ${{ steps.ledger.outputs.token }}
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          CANDIDATE_RUN_ID: ${{ inputs.candidate_run_id }}
          CANDIDATE_ARTIFACT_ID: ${{ inputs.candidate_artifact_id }}
          CANDIDATE_ARCHIVE_SHA256: ${{ inputs.candidate_archive_sha256 }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          set -euo pipefail
          mode=--preflight-only
          if test "$PUBLISH" = true; then mode=--publish; fi
          python3 scripts/new-sdd-workspace-successor-publish.py \
            "$mode" \
            --candidate-run-id "$CANDIDATE_RUN_ID" \
            --candidate-artifact-id "$CANDIDATE_ARTIFACT_ID" \
            --candidate-archive-sha256 "$CANDIDATE_ARCHIVE_SHA256" \
            --workdir "$RUNNER_TEMP/new-sdd-workspace-successor"
