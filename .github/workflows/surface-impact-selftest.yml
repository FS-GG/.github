# Self-test for scripts/fsgg-surface-impact — the consumer-impact enumerator for the
# shipped-surface-mutation event (ADR-0025, .github#236). Runs tests/surface-impact/run.sh, which
# proves the tool lists declared consumers, finds carrying edges by a token match (no prefix bleed),
# emits stable --json, lists ids, and fails loudly on an unknown id — off a temp registry, no
# network. Mirrors repos-audit-selftest.yml; needs PyYAML like the coherence gate.
name: surface-impact-selftest

on:
  pull_request:
    paths:
      - "scripts/fsgg-surface-impact"
      - "tests/surface-impact/**"
      - ".github/workflows/surface-impact-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fsgg-surface-impact"
      - "tests/surface-impact/**"
      - ".github/workflows/surface-impact-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: surface-impact-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run the surface-impact fixture
        run: bash tests/surface-impact/run.sh
