# harness-identity — a test harness that drives the coord engine with `--worker` must decide the
# identity ladder itself, or the lock verbs refuse over whatever the launching shell happened to export.
#
# .github#1817. Three shell harnesses (tests/coord-engine-e2e/writes.sh,
# tests/coord-engine-parity/run.sh, tests/coord-engine-parity/shim.sh) and two in-process F# fixtures
# (ApplicationServiceTests.fs's `runQueue`, `runReconcileWith`) carried this defect independently, each
# found by a worker who happened to trip over it under an agent shell — invisibly, because CI exports
# none of `CLAUDE_CODE_SESSION_ID`/`OPENCODE_SESSION_ID`/`FSGG_AGENT_SESSION_ID`/`FSGG_AGENT_HARNESS`, so
# a CI-only run of this gate would report every one of them green. That is why this workflow's FIRST job
# is the fixture — proof this gate can still say NO — before the second job believes it when it says yes.
#
# No `schedule:` — the subject is committed files in this repo, so `paths:` sees every change that
# could falsify it, and a nightly re-run would prove only that the tree did not change on its own.
name: harness-identity

on:
  pull_request:
    paths:
      - "tests/**"
      - "scripts/check-harness-identity.py"
      - ".github/workflows/harness-identity.yml"
  push:
    branches: [main]
    paths:
      - "tests/**"
      - "scripts/check-harness-identity.py"
      - ".github/workflows/harness-identity.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: harness-identity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline, and first: prove the gate can still say NO before believing it when it says yes. The
  # fixture builds synthetic compliant/defective surfaces for BOTH the shell and F# populations, replays
  # the real shipped tree and requires it green, and MUTATES a copy of that real tree to reintroduce the
  # two historical regressions (writes.sh's missing unset, runQueue's missing scrub) — a fixture that
  # only ever fed this gate clean input would never notice it stopped being able to fail.
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Run the harness-identity fixture (no network)
        run: bash tests/harness-identity/run.sh

  ladder-decided:
    runs-on: ubuntu-latest
    needs: fixture
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Assert every --worker-driven harness decided the identity ladder for itself
        id: check
        run: |
          rc=0
          out="$(python scripts/check-harness-identity.py --root . 2>&1)" || rc=$?
          [ -z "$out" ] || printf '%s\n' "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      # One named step per exit code: "I could not check" must never be mistaken for "I checked, and
      # it's fine" (#266), nor for "I checked, and it's broken" (#320). The exit code is the contract;
      # nothing here greps the gate's prose.
      #
      # There is no exit-2 leg because this gate is PURE — working tree only, no API, no network — so it
      # has no retryable failure to report. A leg for a verdict the gate can never mean would be a lie
      # about the contract; the INCONCLUSIVE leg below catches a 2 if one ever appears.
      - name: 'OK: every identity-dependent harness decided the ladder'
        if: ${{ !cancelled() && steps.check.outputs.rc == '0' }}
        run: |
          echo "harness-identity: OK" >> "$GITHUB_STEP_SUMMARY"

      - name: 'FINDING: a harness leaves the identity ladder inherited'
        if: ${{ !cancelled() && steps.check.outputs.rc == '1' }}
        run: |
          {
            echo "### harness-identity: a test harness left the identity ladder undecided"
            echo
            echo "A shell fixture invokes the engine with \`--worker\` without first unsetting"
            echo "\`CLAUDE_CODE_SESSION_ID\`/\`OPENCODE_SESSION_ID\`/\`FSGG_AGENT_SESSION_ID\`/"
            echo "\`FSGG_AGENT_HARNESS\` (or deciding both halves per invocation), or an in-process F#"
            echo "fixture isolates \`FSGG_COORD_CACHE\` without also scrubbing the four \`Identity.resolve\`"
            echo "variables. Either way, the id \`Identity.resolve\` DERIVES from the launching shell can"
            echo "silently disagree with the id the fixture asked for — and \`claim\`/\`release\`/"
            echo "\`heartbeat\`/\`widen\` refuse that disagreement (#1646), differently depending on who"
            echo "runs the suite."
            echo
            echo "Three shell harnesses and two F# fixtures have already carried this defect, each found"
            echo "by hand. See the job log for the exact file:line."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=harness-identity: the ladder is undecided::A test harness drives the engine with --worker but never decided the identity ladder. See the job log."
          exit 1

      - name: 'NO VERDICT (permanent): the population could not be established'
        if: ${{ !cancelled() && steps.check.outputs.rc == '3' }}
        run: |
          {
            echo "### harness-identity: no verdict"
            echo
            echo "\`tests/\` is missing, or contains not one shell or F# file at all — the walk that"
            echo "finds this gate's subject is broken, not the tree. Examining nothing is a failure to"
            echo "audit, not a clean audit. Retrying will not help."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=harness-identity: no verdict (permanent)::check-harness-identity.py could not establish its subject. See the job log."
          exit 1

      - name: 'INCONCLUSIVE: the gate produced no exit code this workflow understands'
        if: ${{ !cancelled() && !contains(fromJSON('["0","1","3"]'), steps.check.outputs.rc) }}
        run: |
          echo "::error title=harness-identity: inconclusive::check-harness-identity.py exited ${{ steps.check.outputs.rc }}, which this workflow does not classify. Treating as a failure."
          exit 1
