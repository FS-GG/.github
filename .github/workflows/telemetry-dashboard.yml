name: telemetry-dashboard

on:
  pull_request:
    paths:
      - "docs/2026-09-07-154210-fs-gg-unified-development-roadmap.md"
      - "docs/roadmaps/**"
      - "telemetry-dashboard/**"
      - "tools/telemetry-dashboard.py"
      - "scripts/telemetry-dashboard-refresh.py"
      - "tests/telemetry-dashboard/**"
      - "tests/telemetry-local-journey/**"
      - "contracts/process-efficiency/**"
      - "tests/process-efficiency/**"
      - "tests/learn-01-responses-source/**"
      - "tests/responses-static-producer/**"
      - "tests/process-efficiency-requirements.txt"
      - "tools/process-efficiency-assessment.py"
      - "tools/process-efficiency-evaluate.py"
      - "tools/learn_01_responses_source.py"
      - "tools/process-efficiency-responses-static.py"
      - ".github/workflows/telemetry-dashboard.yml"
      - "docs/roadmaps/utel-telemetry-dashboard.md"
  push:
    branches: [main]
    paths:
      - "docs/2026-09-07-154210-fs-gg-unified-development-roadmap.md"
      - "docs/roadmaps/**"
      - "telemetry-dashboard/**"
      - "tools/telemetry-dashboard.py"
      - "scripts/telemetry-dashboard-refresh.py"
      - "tests/telemetry-dashboard/**"
      - "tests/telemetry-local-journey/**"
      - "contracts/process-efficiency/**"
      - "tests/process-efficiency/**"
      - "tests/learn-01-responses-source/**"
      - "tests/responses-static-producer/**"
      - "tests/process-efficiency-requirements.txt"
      - "tools/process-efficiency-assessment.py"
      - "tools/process-efficiency-evaluate.py"
      - "tools/learn_01_responses_source.py"
      - "tools/process-efficiency-responses-static.py"
      - ".github/workflows/telemetry-dashboard.yml"
      - "docs/roadmaps/utel-telemetry-dashboard.md"
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:
    inputs:
      host_revision:
        description: "Frozen historical host commit SHA; leave empty for an Actions/delivery refresh"
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: read

concurrency:
  group: telemetry-dashboard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Install pinned process efficiency validator
        run: python3 -m pip install --disable-pip-version-check -r tests/process-efficiency-requirements.txt
      - name: Verify process efficiency contracts, assessment and evaluation
        run: python3 -m unittest discover -s tests/process-efficiency -p 'test_*.py'
      - name: Verify Responses source and static artifact contracts
        run: |
          python3 tests/learn-01-responses-source/test_responses_source.py
          python3 tests/responses-static-producer/test_static_producer.py
      - name: Verify local journey helper environment isolation
        run: python3 -m unittest discover -s tests/telemetry-local-journey -p 'test_*.py'
      - name: Verify feed and dashboard behavior
        env:
          FSGG_DASHBOARD_SKIP_BROWSER: ${{ github.event_name == 'schedule' }}
        run: bash tests/telemetry-dashboard/run.sh

  build:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should_deploy: ${{ steps.refresh.outputs.build }}
      host_revision: ${{ steps.refresh.outputs.revision }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: Select frozen historical Host revision
        id: refresh
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_HOST_REVISION: ${{ inputs.host_revision }}
        run: |
          # Select the immutable snapshot carried by this checked-out main revision.
          current="$(python3 - <<'PYHOST'
          import hashlib, json
          from pathlib import Path
          manifest = json.loads(Path("telemetry-dashboard/historical-host.provenance.json").read_text())
          raw = Path(manifest["snapshotPath"]).read_bytes()
          if hashlib.sha256(raw).hexdigest() != manifest["snapshotSha256"]:
              raise SystemExit("historical snapshot hash mismatch")
          print(manifest["sourceCommit"])
          PYHOST
          )"
          deployed=""
          pages_rc=0
          pages_url="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq .html_url 2>/dev/null)" || pages_rc=$?
          if [ "$pages_rc" -ne 0 ] && [ -n "$REQUESTED_HOST_REVISION" ]; then
            echo "Pages metadata unavailable for revision-bound dispatch" >&2
            exit "$pages_rc"
          fi
          if [ -n "$pages_url" ]; then
            data_rc=0
            deployed_data="$(curl --fail --silent --show-error --max-time 10 --max-filesize 1048576 "${pages_url%/}/data/dashboard.json?revision=$current" 2>/dev/null)" || data_rc=$?
            if [ "$data_rc" -eq 0 ]; then
              deployed="$(jq -er 'select(.schema == "fsgg.telemetry.dashboard/2") | .hostRevision // empty' <<< "$deployed_data" 2>/dev/null)" || data_rc=$?
              if [ "$data_rc" -eq 4 ] && jq -e '.schema == "fsgg.telemetry.dashboard/2" and .hostRevision == null' <<< "$deployed_data" >/dev/null 2>&1; then
                data_rc=0
                deployed=""
              fi
            fi
            if [ "$data_rc" -ne 0 ] && [ -n "$REQUESTED_HOST_REVISION" ]; then
              echo "Deployed Pages revision unavailable for revision-bound dispatch" >&2
              exit "$data_rc"
            fi
          fi
          decision="$(python3 scripts/telemetry-dashboard-refresh.py --current "$current" --requested "$REQUESTED_HOST_REVISION" --deployed "$deployed")"
          echo "build=$(jq -r .build <<< "$decision")" >> "$GITHUB_OUTPUT"
          echo "revision=$(jq -r .revision <<< "$decision")" >> "$GITHUB_OUTPUT"
          echo "reason=$(jq -r .reason <<< "$decision")" >> "$GITHUB_OUTPUT"
          echo "$decision"
      - name: Collect bounded public Actions data
        if: steps.refresh.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/telemetry-dashboard.py collect-actions --repo "$GITHUB_REPOSITORY" --cap 1000 --output actions.json
      - name: Collect bounded public merged deliveries
        if: steps.refresh.outputs.build == 'true'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tools/telemetry-dashboard.py collect-deliveries --repo "$GITHUB_REPOSITORY" --cap 200 --output deliveries.json
      - name: Read frozen historical host snapshot from this source revision
        if: steps.refresh.outputs.build == 'true'
        id: host
        run: |
          cp telemetry-dashboard/historical-host.json host.json
          echo "revision=${{ steps.refresh.outputs.revision }}" >> "$GITHUB_OUTPUT"
      - name: Compose exact-revision site data
        if: steps.refresh.outputs.build == 'true'
        run: |
          args=(--actions actions.json --deliveries deliveries.json --source-revision "$GITHUB_SHA" --output telemetry-dashboard/data/dashboard.json)
          args+=(--host host.json --host-revision '${{ steps.host.outputs.revision }}')
          python3 tools/telemetry-dashboard.py compose "${args[@]}"
      - uses: actions/configure-pages@v6
        if: steps.refresh.outputs.build == 'true'
      - uses: actions/upload-pages-artifact@v5
        if: steps.refresh.outputs.build == 'true'
        with:
          path: telemetry-dashboard

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.should_deploy == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check dispatch against the frozen revision used by the built artifact
        id: latest
        env:
          REQUESTED_HOST_REVISION: ${{ inputs.host_revision }}
          BUILT_HOST_REVISION: ${{ needs.build.outputs.host_revision }}
        run: |
          if [ -z "$REQUESTED_HOST_REVISION" ] || [ "$REQUESTED_HOST_REVISION" = "$BUILT_HOST_REVISION" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping dispatch for a different historical revision"
          fi
      - name: Deploy exact built artifact
        if: steps.latest.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v5
