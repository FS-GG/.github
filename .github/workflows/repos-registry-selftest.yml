# Self-test + gate for the org repo roster (registry/repos.yml) and its validator (ADR-0019).
#
# Runs tests/repos-registry/run.sh, which proves scripts/repos.sh validate PASSES on a well-formed
# roster and FAILS on each violation class (unknown capability, duplicate id, bad role, not-exactly-
# one-authority, authority-receives-kit, kit digest drift, missing source, malformed name), that
# `list`/`digest` behave, and — the gate on the real file — that the checked-in registry/repos.yml
# validates. Because the paths below include registry/repos.yml, any edit to the roster re-runs this,
# so a bad row (or a stale kit sha256) fails the PR. Mirrors skill-union-selftest.yml.
name: repos-registry-selftest

on:
  pull_request:
    paths:
      - "scripts/repos.sh"
      - "registry/repos.yml"
      # the GENERATED half (#527). A stale lock must re-run this gate, or the digests it exists to
      # guard rot with nothing to say so — the #334 shape: the check is fine, its TRIGGER fails open.
      - "registry/repos.lock"
      - "scripts/apply-labels.sh"
      # A capability's DETECTOR SUBJECT (#628). `validate` proves the subject exists, so renaming or
      # deleting it makes the roster invalid — and if this filter does not cover it, that rename never
      # fires this gate and the roster sits invalid AND green. True of `capabilities[].workflow` (all
      # of .github/workflows/** is already covered below) and equally of `capabilities[].script`.
      - "scripts/sync-build-config.sh"
      - "tests/repos-registry/**"
      - ".github/workflows/repos-registry-selftest.yml"
      # kit sources — an edit here changes the content-addressed digest, so re-validate that
      # registry/repos.yml's kit sha256 still matches (ADR-0019). The skill roots are wildcards, not
      # a per-skill list: a hand-maintained list silently omitted intra-repo-parallel-work, so
      # editing it never re-checked its sha256 (#334). A wildcard over-triggers on a non-kit skill;
      # a stale list fails open, which is strictly worse. tests/repos-registry/run.sh asserts every
      # kit: source is matched here, on both triggers — a gate on the gate.
      - "scripts/fsgg-coord"
      - "scripts/fsgg-coord-report"
      - ".claude/skills/**"
      - ".agents/skills/**"
      # the kit's `kind: config` source — the engine manifest (#1077). A plain file, so it is named
      # exactly (no wildcard). run.sh's coverage assertion checks it is here on both triggers.
      - "dist/dotnet/.config/dotnet-tools.json"
      # ADR-0067 §9's replacement and the two libraries it sources at startup (#1696). Named exactly,
      # for the same reason as the manifest above: they are plain files, not a root. `scripts/lib/**`
      # would over-trigger on gate.py and sparse.py, which are NOT kit sources — and the wildcards
      # above are wildcards only because a per-SKILL list went stale (#334); a two-file list that
      # `repos.sh validate` and run.sh both re-derive from the roster cannot.
      - "scripts/skill-view"
      - "scripts/lib/args.sh"
      - "scripts/lib/roots.sh"
      # capability workflows — `capabilities:` names the reusable workflow that audits each one, and
      # validate now proves it EXISTS and really carries a `workflow_call:` trigger (#503). That makes
      # registry/repos.yml's validity depend on these files, so renaming, deleting, or un-reusing one
      # must re-run this gate — otherwise the roster silently goes invalid and merges green, which is
      # #334 exactly: the check is fine, its trigger is what fails open. A wildcard for the same
      # reason as the skill roots above; run.sh asserts every capabilities[].workflow is matched here.
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "scripts/repos.sh"
      - "registry/repos.yml"
      # the GENERATED half (#527). A stale lock must re-run this gate, or the digests it exists to
      # guard rot with nothing to say so — the #334 shape: the check is fine, its TRIGGER fails open.
      - "registry/repos.lock"
      - "scripts/apply-labels.sh"
      # A capability's DETECTOR SUBJECT (#628). `validate` proves the subject exists, so renaming or
      # deleting it makes the roster invalid — and if this filter does not cover it, that rename never
      # fires this gate and the roster sits invalid AND green. True of `capabilities[].workflow` (all
      # of .github/workflows/** is already covered below) and equally of `capabilities[].script`.
      - "scripts/sync-build-config.sh"
      - "tests/repos-registry/**"
      - ".github/workflows/repos-registry-selftest.yml"
      - "scripts/fsgg-coord"
      - "scripts/fsgg-coord-report"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "dist/dotnet/.config/dotnet-tools.json"   # the kit's engine-manifest config source (#1077)
      - "scripts/skill-view"                      # ADR-0067 §9's replacement (#1696)
      - "scripts/lib/args.sh"                     # ...and the two libraries it sources at startup
      - "scripts/lib/roots.sh"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The fixture's paths:-coverage assertion parses this workflow with PyYAML. Declare it rather
      # than inheriting whatever the runner image happens to ship: a gate that asserts other gates
      # cannot itself rest on an undeclared dependency. Mirrors repos-audit-selftest.yml.
      - uses: ./.github/actions/setup-policy-python
      - name: Run the repos-registry fixture
        run: bash tests/repos-registry/run.sh
