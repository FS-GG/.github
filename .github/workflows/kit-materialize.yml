# Reusable kit-materialize (ADR-0062, FS-GG/.github#1262).
#
# The consume-side companion to release-kit.yml. A `coordination-kit` receiver that has switched to
# `kit-delivery: package` (registry/repos.yml) no longer takes the kit by byte-copy sync PR — it
# REFERENCES the versioned FS.GG.Kit package (.config/kit/FS.GG.Kit.receiver.proj) and MATERIALIZES the
# kit onto disk from its pin. Those materialized files (the coordination skills, scripts/fsgg-coord,
# .config/dotnet-tools.json, and for a build-config receiver Directory.Build.props / Directory.Packages.props)
# are COMMITTED, because the agent harness loads skills as real files (ADR-0011) and coordination-coherence
# checks the committed bytes against canonical.
#
# THE GAP THIS CLOSES is the exact analogue of lockfile-sync (#145): Renovate bumps the FS.GG.Kit
# <PackageVersion> in Directory.Packages.local.props WITHOUT running the materialize, so the committed
# kit would stay at the OLD version's bytes while the pin says the new one — and coordination-coherence
# (which still runs against every receiver, package-delivery or not) would see the committed kit drift
# from canonical. This job re-runs the materialize on the bump PR and pushes the refreshed kit back to
# the branch, so the receiver's committed kit tracks its pin with no human in the loop. It is the
# package-fabric replacement for the `coordination-propagate` sync PR that `--kit-delivery byte-copy`
# now skips for these repos (#1287).
#
# RE-TRIGGER + PROVISIONING mechanics are identical to lockfile-sync.yml, and are shared with it rather
# than restated (ADR-0058):
#   * The commit is authored with the org `fs-gg-cross-repo-dispatch` GitHub *App* installation token,
#     NOT GITHUB_TOKEN. App-token pushes re-run `on: pull_request` workflows, so the caller's
#     coordination-coherence re-evaluates the freshened kit; a GITHUB_TOKEN push would not. Self-limiting:
#     the second pass materializes 0-written -> no diff -> no commit -> no push, so there is no loop.
#   * PROVISIONING (the fs-gg-cross-repo-dispatch App secrets resolve AND this repo is in the App
#     installation with contents:write) is CONTINUOUSLY asserted by lockfile-sync.yml's `preflight` job,
#     which runs UNGATED on every PR in ALL SEVEN repos that adopt this workflow (#1724). This argument
#     used to say "exactly the four repos (SDD, Rendering, Governance, Templates — the confirmed-
#     provisioned set, #145 header)". The count was four when it was written and has been SEVEN since;
#     measured 2026-07-29, every one of SDD, Rendering, Governance, Templates, Game, Audio and Net
#     carries BOTH `kit-materialize.yml` and `lockfile-sync.yml`, and all seven are `kit-delivery:
#     package` in registry/repos.yml. The composition the argument rests on therefore holds more widely
#     than it claimed, not less — the roster was stale, the safety property was not.
#
#     PROVISIONING IS ALSO NOW MEASURED DIRECTLY ON ALL SEVEN, not only inferred from the preflight.
#     On 2026-07-29 a `workflow_dispatch` materialize was run on each receiver's default branch
#     (#1853): every one MINTED the App installation token and reported `materialize` as
#     `conclusion: success` — which is the provisioning assertion performed rather than delegated.
#
#     That gate names the repo, the secret, and the fix on the FIRST PR after adoption, months before
#     any bump PR. Re-implementing it here would be a 340-line restatement of a check that already
#     fires on the same PRs; instead this job's own token mint is the backstop — if a repo were somehow
#     de-provisioned, lockfile-sync's preflight on the same PR reds it with the full remedy, and this
#     mint fails loud rather than silent. A receiver that adopts kit-materialize WITHOUT lockfile-sync
#     must not rely on that composition — none exists today (all SEVEN adopters carry both), and the
#     fan-out keeps them paired.
#
# Restore/materialize is anonymous: FS.GG.Kit ships to PUBLIC nuget.org (release-kit.yml dual-publishes,
# ADR-0012/0013), and the receiver's hermetic nuget.config resolves it there — no org-feed credential.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THE SECOND JOB, `bump-shape`, IS THE RECEIVER-SIDE KIT-BUMP REPORTER (.github#1713).
#
# WHY IT LIVES HERE AND NOWHERE ELSE. It has to report on a RECEIVER's pull request, where the diff
# and the restored target package both exist. Every route to a receiver was considered and all but
# one is forbidden:
#   * hand-copying a workflow into seven repos is the defect class #1507/#1510/#1515/#1528/#1538
#     closed, and ADR-0067 §5 forbids adding a new copy while the copying is being retired;
#   * materializing a workflow FILE through the kit cannot work — the App installation token that
#     pushes the materialize commit has `contents: write` and not `workflows: write`, so the push
#     that carried it would be rejected;
#   * a receiver cannot add a step to a `uses:` job (a caller job that invokes a reusable workflow
#     takes no steps at all).
# All seven receivers ALREADY call this workflow, ungated, on `pull_request` into `main`. A job added
# here therefore reaches all seven with ZERO receiver-side edits — the same route `kit / coordination-kit`
# and `lock-ranges / lock-ranges` already take.
#
# THE RULE IS FETCHED AT THE COMMIT THE RECEIVER'S OWN PIN NAMES, NEVER AT `main` (.github#1772, #1584).
#
# ADR-0067 §2: a gate's verdict MUST be a pure function of (tree under test, pinned ref). #1713 shipped
# this job with `actions/checkout … ref: main` for the rule, and said so out loud — fine for a report,
# a #1584 violation the moment the context is required. #1584 is not hypothetical: `FS.GG.SDD#724`
# passed on merged SHA `0376309` at 08:15Z and FAILED ON BYTE-IDENTICAL CONTENT at 08:21Z, because the
# hub had moved underneath a verdict that read it at check time. A required context with that property
# is not a gate; it is a clock.
#
# So the ref is DERIVED, exactly as #1584's own remedy derives it — read the receiver's pin, restore
# THAT package version, judge against what that version ships:
#
#     restore the receiver's project  ->  project.assets.json names the resolved FS.GG.Kit version
#     that version                    ->  the immutable hub tag `kit/v<version>` (release-kit.yml)
#     that tag                        ->  peeled to a 40-hex COMMIT, and the rule is checked out THERE
#
# `release-kit.yml` refuses to publish a version that has no matching tag on the published commit, so
# "the pin names a real, immutable hub commit" is an invariant that gate keeps rather than a hope this
# one holds — forward. The tag is still MUTABLE and two already-published versions (0.1.0, 0.4.0)
# have none; #1784 is the coherence check and the tag protection that close that.
#
# WHAT IS STILL NOT PINNED, SAID PLAINLY (#1783). THE RULE is pinned; THIS FILE is not. Receivers
# call it as `kit-materialize.yml@main`, so the probe below, the `x.y.z` grammar, the tag scheme and
# the exit-code -> conclusion mapping all still move with the hub. Editing THOSE can still flip a
# receiver's report with no change to the receiver — a smaller surface than a 678-line rule, and one
# whose every line is now a #266 decision rather than a verdict, but not zero. Do not read this
# header as "the reporter is a pure function of the receiver": it says the RULE is. Closing the rest
# means receivers pinning this workflow at a sha, which is a fleet-wide change and is #1783.
#
# One consequence is load-bearing enough to state here, because it is the trap that shape sets: the
# pinned rule may be OLDER than this file. An argument this file passes that the pinned rule does not
# accept makes `argparse` exit 2 — the same code as an abstention. The verdict step therefore demands
# the word ABSTAINS before it believes one; see there.
#
# AND IT NEVER GUESSES. A version that is not a bare `x.y.z`, a tag that does not exist, or a tagged
# release that predates the rule are all REFUSALS that name the remedy (#266) — never an abstention,
# never a pass. `tests/kit-bump-shape/run.sh` asserts this job resolves the rule from a step output and
# not from a literal ref, and mutating that `ref:` back to `main` fires the leg.
#
# THE CONTEXT NAMES ARE A CONTRACT, AND THIS IS THE ONE PLACE THEY ARE DEFINED. THERE ARE TWO,
# BECAUSE A CHECK RUN CARRIES ONE BOOLEAN AND THIS JOB REACHES FIVE VERDICTS (#1815):
#
#     materialize / kit-bump-shape          materialize / kit-bump-mechanical
#     ^^^^^^^^^^^   ^^^^^^^^^^^^^^                        ^^^^^^^^^^^^^^^^^^
#     |             the `name:` of the `bump-shape` job   the `name:` of the `bump-mechanical`
#     |             below — DEFINED HERE, ONCE.           job below — DEFINED HERE, ONCE.
#     the caller job id, `materialize`, in all seven receivers' .github/workflows/kit-materialize.yml
#
# THEY ASK DIFFERENT QUESTIONS, AND THAT IS THE WHOLE OF #1815:
#
#     kit-bump-shape       "is this bump CONTAMINATED?"     green = no.  Green on 0, 2 AND 4.
#     kit-bump-mechanical  "does this bump NEED A HUMAN?"   green = no.  Green on 0 and 2 ONLY.
#
# #1726's sketch was `mechanical` (automergeable) vs `mechanical + repair` (**green, not automerged**).
# The verdict WAS split — both halves are green on `kit-bump-shape`, faithfully — and "not automerged"
# was never given a mechanism, because once automerge fires on a boolean, green IS automerged. The
# second context is that mechanism. It does NOT change what the first one means, and it does NOT red
# class 4 org-wide: `kit-bump-shape` still says a repair-carrying bump is clean, which is why
# FS.GG.Rendering#1088 was right to merge. The second says it still wants reading. Neither is armed.
#
# GitHub names a reusable-workflow check `<caller job display> / <callee job display>`, and a job's
# display name is its `name:` if it has one, else its id — so the right-hand half is this file's job
# `name:` and nothing else. Whatever eventually ARMS this (`scripts/repos.sh require-context --context
# 'materialize / kit-bump-shape' --receives coordination-kit`) must be handed that exact string; it
# cannot be guessed from convention, because the receivers' existing contexts show both shapes (bare
# job names like `Deterministic gate`, and `workflow / job` like `kit / coordination-kit`).
# `check-reusable-job-ids.py` already makes renaming the callee half a loud breaking change, and
# `tests/kit-bump-shape/run.sh` asserts the literal, so the documented string and the workflow cannot
# drift apart in silence. Recorded for a reader in docs/coordination/reusable-workflow-contract.md.
#
# NOTHING HERE ARMS ANYTHING, AND ARMING IT TODAY WOULD BE THE OUTAGE THIS JOB EXISTS TO PREVENT.
# `scripts/repos.sh require-context --apply` for a context WITH NO PRODUCER holds every pull request
# in six repositories at "Expected — waiting for status to be reported", permanently (#1713's founding
# measurement; #1508 is the checker that would have reported it, after the damage). The ordering is:
# land the producer, watch it REPORT on real bumps, and only then consider requiring it — with the
# dry run, which needs only `administration: read`, as the proof that a producer exists. That
# sequence is written down in docs/coordination/reusable-workflow-contract.md, where the next person
# to reach for `--apply` will hit it.
#
# IT REPORTS; IT GATES NOTHING. The context is required in no repository, so a `failure` conclusion
# here blocks no merge — it is how a reviewer sees, in a check list, which of seven fanned-out bump
# PRs need reading. #1587's automerge is deferred and re-decided separately; it would fire on the
# `mechanical` verdict ALONE, and this job never makes that decision for it.
#
# ─────────────────────────────────────────────────────────────────────────────────────────────────
# THE ON-DEMAND ARM (.github#1845), AND WHY A MATERIALIZE STILL NEVER WRITES `main`.
#
# THE MEASUREMENT THAT FORCED IT (#1834, `4fadc88`). Every receiver's caller triggered on
# `pull_request` ALONE — no `workflow_dispatch` in any of the seven — and the `materialize` job below
# was further gated to `renovate/*` same-repo heads. **Across 842 runs in all seven receivers, ZERO
# ran on `main`.** Meanwhile `kit / coordination-kit` runs 9-69 times a DAY in the same repos and has
# gone red 534 times in ~24 days, and its DRIFT summary told the reader to *"re-run the materialize
# on this branch"*. There was no button. A remedy naming an action nobody can perform is #842's
# `lockfile-sync` hole one fabric over, and the heal tail it left was the interval between merged
# `renovate/*` pull requests: mean 27-84h, p90 70-265h, **max 167-312h (7-13 days)**.
#
# SO THE `materialize` JOB NOW HAS TWO ARMS, and `github.event_name` is the ONLY thing that selects
# between them. The dispatch arm is UNCONDITIONAL — see the `if:` on the job, where the reason is
# spelled out, because a conditional dispatch arm is the #1815 fail-open in the one place an operator
# would never look for it.
#
# WHAT IT MAY WRITE, WHICH IS THE WHOLE OF THE DESIGN:
#
#   dispatched on the repository's DEFAULT branch   ->  a NEW branch `kit-materialize/repair-<run>`,
#                                                       never the default branch itself
#   dispatched on ANY OTHER branch                  ->  that branch, in place
#   `pull_request` on a `renovate/*` same-repo head ->  that head, in place (UNCHANGED)
#
# `main` IS NOT REFUSED BECAUSE IT IS PROTECTED. It is refused because a materialize WRITES, so it is
# a repair and not a check — and `kit / coordination-kit` is a REQUIRED CONTEXT precisely so that the
# kit's bytes are graded BEFORE they reach `main`. A bot that pushed the repair straight to `main`
# would bypass the very gate whose red caused the repair, and land ungraded bytes into the branch
# every other receiver's contexts have already passed on. Routing the repair through a branch is not
# a concession to branch protection; it is the gate continuing to do its job. (It is also the only
# arm this workflow can PROVE it may take: the App installation token holds `contents: write` — #1713,
# and lockfile-sync.yml's preflight asserts exactly that and nothing more — which is enough to CREATE
# a ref and push to it, and says nothing about `pull_requests: write`. So this workflow pushes a branch
# and prints the compare URL rather than opening the pull request itself. Per #266 an unasserted scope
# is not a scope.)
#
# AND IT NEVER WRITES A REF IT DID NOT CREATE, on the repair arm: if `kit-materialize/repair-<run>`
# somehow already exists on the remote, that is a REFUSAL, not a force-push. `github.run_id` is unique
# per run, so this cannot fire on any ordinary run — it is there so that the one rule the repair arm
# has ("the default branch is never touched") cannot be defeated by a collision.
#
# #1533 IS UNTOUCHED BY THIS. The repair branch is `kit-materialize/repair-*`, never `renovate/*`, so
# Renovate never sees a foreign-authored commit on a branch it owns and the `gitIgnoredAuthors` trap
# below is not reached from this arm at all.
#
# WHO CAN PRESS IT: `workflow_dispatch` requires WRITE access to the receiver. A fork contributor has
# no path here and must run the materialize locally — which is why `coordination-coherence.yml`'s
# DRIFT summary now names BOTH routes and says which reader each one is for, rather than naming one
# that most readers cannot take (#1845 AC5).
#
# THE REPORTER JOBS ARE `pull_request`-ONLY, AND THAT IS NOT A #1508 GATE. `bump-shape` reports on a
# pull request's DIFF; a dispatched run has no pull request, so the probe would refuse (correctly, and
# loudly) and every on-demand repair would come back RED on two contexts that had nothing to say. An
# operator who learns to ignore red on the repair button is the failure this avoids. The `if:` used is
# `github.event_name == 'pull_request'`, which is TRUE ON EVERY PULL REQUEST WITHOUT EXCEPTION — so the
# check run is still created on 100% of them and the #1508 deadlock remains impossible. That property
# was previously asserted STRUCTURALLY ("the job carries no `if:`"); `tests/kit-bump-shape/run.sh` now
# asserts it SEMANTICALLY instead, by evaluating the real expression against every pull-request shape,
# which is a strict superset of the old leg and is mutation-proven in both directions.

name: kit-materialize

on:
  workflow_call:
    inputs:
      receiver-project:
        description: "The FS.GG.Kit receiver project to materialize from."
        type: string
        default: .config/kit/FS.GG.Kit.receiver.proj
      dotnet-version:
        description: "SDK to install — must match the caller's gate.yml band (Feature 211 uses 10.0.x)."
        type: string
        default: "10.0.x"
    secrets:
      app-id:
        description: "GitHub App id (org fs-gg-cross-repo-dispatch App; provisioned by .github#21)."
        required: true
      app-private-key:
        description: "GitHub App private key (PEM) for the same App."
        required: true

# contents:read here; the App installation token performs the git WRITE (contents:write on the repo).
permissions:
  contents: read

jobs:
  # ── the reporter (.github#1713) ────────────────────────────────────────────────────────────────
  # NO `paths:` ANYWHERE ON THE ROUTE, and an `if:` that is TRUE ON EVERY PULL REQUEST: GitHub creates
  # NO check run for a job a filter excluded, and branch protection cannot tell that from "has not
  # reported yet" (#1508). A context anyone might one day require must therefore report on EVERY pull
  # request, including the ones this has nothing to say about — which it answers with an ABSTENTION,
  # never a pass (#266).
  #
  # `github.event_name == 'pull_request'` DOES NOT NARROW THAT (.github#1845). It is a tautology on
  # the event this job reports about, so the check run is still created on 100% of pull requests and
  # the #1508 deadlock stays impossible. What it excludes is the on-demand `workflow_dispatch` run the
  # `materialize` job below now serves, where there IS no pull request: this job's probe would refuse
  # for want of a base/head — the right answer to the wrong question — and every operator-triggered
  # repair would come back red on two contexts that had nothing to say about it. Branch protection is
  # never waiting on a dispatched run, so nothing can deadlock on the skip; the only thing it changes
  # is that a repair run is not spuriously red.
  #
  # THIS IS THE ONE `if:` ON THIS JOB AND IT MUST STAY A TAUTOLOGY OVER `pull_request`. Narrowing it
  # by head ref, base branch, author, label or paths reintroduces #1508 exactly. That is asserted
  # SEMANTICALLY rather than structurally — `tests/kit-bump-shape/run.sh` evaluates this real
  # expression against every pull-request shape the fixture can build and fails if ANY of them skips —
  # which is a strict superset of the "carries no `if:`" leg it replaced, and is mutation-proven.
  #
  # It mints no App token and reads no secret, deliberately. The `materialize` job below needs one
  # because it PUSHES; this one only reads, and a job that runs on any pull request — a fork head
  # included — must not be the place a credential is handled.
  bump-shape:
    name: kit-bump-shape
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # THE VERDICT, HANDED TO `bump-mechanical` BELOW SO THE TWO CONTEXTS CANNOT DISAGREE (#1815).
    # One evaluation, two renderings of it — never two evaluations that might drift.
    #
    # EXACTLY TWO STEPS WRITE IT: `probe` (its own refusals, and the abstention) and `report` (the
    # pinned rule's own exit code). `report` wins when it ran, because it is the later and better
    # answer. Every OTHER way this job can end — a failed restore, a multi-line step output, an
    # unresolvable `kit/v<version>` tag, a runner that died — writes NOTHING, so this evaluates to
    # the EMPTY STRING. That is deliberate and it is the #266 default: the consumer reds on empty,
    # so a job that reached no verdict can never be read as one that reached `mechanical`. A new
    # failure path added below inherits that safety WITHOUT being listed here.
    outputs:
      verdict: ${{ steps.report.outputs.verdict || steps.probe.outputs.verdict }}
    steps:
      # The PR's real head, not the synthetic merge commit: the subject is what the author pushed.
      # fetch-depth 0 so `base...head` has a merge base to resolve against.
      - name: Check out the receiver at the pull request's head
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      # PASS ONE — A GIT DIFF, AND NOTHING ELSE. Cheaper than #1713's first pass, which paid for a
      # second checkout and a Python install on EVERY pull request in seven repositories before it
      # could ask this. The rule cannot answer it here any more, because WHICH rule to run is itself
      # decided by the restore below — so this pass asks the one question that needs no rule:
      #
      #   could the rule possibly reach a verdict on this diff?
      #
      # SOUND BY CONSTRUCTION, and that is the whole argument — this must be a strict SUPERSET of
      # "the rule does not abstain", or a bump would silently report an abstention (#266). The rule
      # declines to abstain for exactly two reasons, and both are asked here:
      #
      #   1. IT FOUND A PIN FILE — a changed line matching `Include\s*=\s*"FS.GG.Kit"`
      #      (check-kit-bump-shape.py `PIN_INCLUDE`). The ERE below is that same pattern, and the
      #      fixture DERIVES the expected spelling from the Python source and fails if they diverge,
      #      so this is a translation of the rule's own predicate rather than a second opinion.
      #   2. IT REFUSED ON THE DIFF'S SHAPE — `changed_paths()` refuses any status outside A/M/D
      #      (a typechange, a copy, an unmerged path), and that needs no kit content at all. Asked
      #      separately below, because a `T`-status pull request that mentions nothing kit-related
      #      would otherwise abstain here where the rule refuses — turning a red into a green.
      #
      # Over-triggering is free and safe: a diff that satisfies either test but that the rule then
      # abstains on gets the rule's own abstention, which reds nothing. Under-triggering is the
      # fail-open, and it is what the two questions above exist to make impossible.
      - name: Could the rule reach a verdict on this diff?
        id: probe
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -uo pipefail
          # check-kit-bump-shape.py PIN_INCLUDE, as an ERE (`\s` -> `[[:space:]]`). Kept honest by
          # tests/kit-bump-shape/run.sh, which builds this string FROM the Python and compares.
          PIN_INCLUDE='Include[[:space:]]*=[[:space:]]*"FS\.GG\.Kit"'
          if [ -z "$BASE" ] || [ -z "$HEAD" ]; then
            { echo "### kit-bump-shape: REFUSED — no verdict could be reached"; echo
              echo "This job had no pull-request base/head to diff. It reports on pull requests and"
              echo "cannot say anything about any other event. This is not a pass."; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kit-bump-shape: no pull-request base/head; refusing rather than abstaining." >&2
            echo "verdict=3" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if ! diff_out="$(git diff -U0 --no-renames "$BASE...$HEAD" 2>&1)"; then
            { echo "### kit-bump-shape: REFUSED — no verdict could be reached"; echo
              echo "The diff \`$BASE...$HEAD\` could not be read, so this job cannot tell a kit bump"
              echo "from anything else. This is not a pass and not a failure of the pull request."
              echo; echo '```'; printf '%s\n' "$diff_out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kit-bump-shape: could not read the diff $BASE...$HEAD." >&2
            echo "verdict=3" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # COUNTED, NOT `grep -q`. `-q` exits on the first match and closes the pipe, which SIGPIPEs
          # the greps upstream of it — and under `pipefail` that 141 becomes the pipeline's status, so
          # a diff that DID match would read as "no match" and abstain. A fail-open that fires only on
          # large diffs is the worst kind (#266). `-c` consumes its whole input.
          hits="$(printf '%s\n' "$diff_out" \
                    | grep -E '^[+-]' | grep -vE '^(\+\+\+|---)' | grep -cE "$PIN_INCLUDE")" || hits=0
          # The rule's other non-abstention: a diff status it refuses on. -z so a newline in a path
          # cannot forge a status field; --no-renames so R/C never appear for that reason alone.
          exotic="$(git diff --name-status -z --no-renames "$BASE...$HEAD" \
                      | tr '\0' '\n' | awk 'NR%2==1' | grep -cvE '^[AMD]$')" || exotic=0
          if [ "${hits:-0}" -gt 0 ] || [ "${exotic:-0}" -gt 0 ]; then
            echo "moved=true" >> "$GITHUB_OUTPUT"
            echo "pin-declaration lines changed: $hits; diff entries outside A/M/D: $exotic."
            echo "Resolving the pinned rule and letting it decide."
          else
            echo "moved=false" >> "$GITHUB_OUTPUT"
            # THE ABSTENTION, AS A VERDICT CODE — the same `2` the pinned rule would have returned,
            # reached here for free. `bump-mechanical` reads it and stays GREEN, because "no pin
            # moved" is a real finding from a real diff, not a failure to evaluate: it says this
            # pull request is not a kit bump, so there is no bump here for a human to read. That is
            # NOT a claim that the pull request is mergeable, and nothing merges on it — see the
            # `bump-mechanical` job for why greening it is what keeps arming from wedging a repo.
            echo "verdict=2" >> "$GITHUB_OUTPUT"
            { echo "### kit-bump-shape: abstains — no FS.GG.Kit pin declaration changed (this is not a pass)"; echo
              echo "No line added or removed by this pull request declares an \`FS.GG.Kit\` package"
              echo "version, and every entry in the diff is a plain add/modify/delete — so no pin moved"
              echo "and there is nothing here the shape rule could reach a verdict on. Abstention is not"
              echo "a pass: nothing here says this pull request is mergeable, only that this reporter has"
              echo "nothing to say about it."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up .NET
        if: steps.probe.outputs.moved == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # The two derived inputs. RECEIVER_PROJECT is env-passed, never interpolated into the script —
      # the org's uniform anti-injection pattern. `-getProperty` is the RECEIVER's own evaluation of
      # the target package, so a receiver that overrides a root set is judged by what it declares;
      # and the package location + version come from the restore's own assets file rather than from
      # a guess about which version happens to be in the runner's package cache.
      - name: Restore the target package and evaluate the receiver's root declarations
        if: steps.probe.outputs.moved == 'true'
        id: inputs
        env:
          RECEIVER_PROJECT: ${{ inputs.receiver-project }}
        run: |
          set -euo pipefail
          dotnet restore "$RECEIVER_PROJECT" -v minimal
          assets="$(dirname "$RECEIVER_PROJECT")/obj/project.assets.json"
          version="$(jq -r '.libraries | keys[] | select(startswith("FS.GG.Kit/"))' "$assets" | cut -d/ -f2)"
          folder="$(jq -r '.packageFolders | keys[0]' "$assets")"
          [ -n "$version" ] && [ -n "$folder" ] || { echo "::error::kit-bump-shape: $assets names no restored FS.GG.Kit." >&2; exit 1; }
          # BOTH ARE PULL-REQUEST-CONTROLLED — `folder` is the receiver's own `globalPackagesFolder`,
          # which a fork's `nuget.config` chooses and XML lets carry a literal newline (`&#xA;`). A
          # multi-line value written with a plain `echo` forges extra `key=value` lines into this
          # step's outputs. Reject anything that is not a single plain line before writing either.
          # THE PATTERN IS `$'\n'`, NOT `"$(printf '\n')"`, AND THAT IS THE WHOLE OF .github#1797.
          # Command substitution STRIPS TRAILING NEWLINES, so `$(printf '\n')` is the EMPTY STRING and
          # the arm `*""*` is `*` — it matched every possible input, and this guard refused every bump
          # PR in every receiver from 12:30Z to 15:0xZ on 2026-07-28. A check that cannot PASS, shipped
          # inside the PR that was hardening this very block (#1772/#1780). Note `$(printf '\r')` does
          # survive (length 1) — only the newline arm was degenerate, and `|` made that enough.
          #
          # `$'…'` is ANSI-C quoting: bash-only, and safe here because GitHub runs a `run:` block with
          # no `shell:` as `bash --noprofile --norc -eo pipefail {0}` on ubuntu-latest. Do not "port"
          # it back to a command substitution — that is the bug — and do not reach for `wc -l`, which
          # counts NEWLINES and would not see a lone `\r`.
          case "$version$folder" in
            *$'\n'*|*$'\r'*)
              echo "::error::kit-bump-shape: the restored package version or folder spans more than one line; refusing to write it as a step output." >&2; exit 1 ;;
          esac
          echo "kit-dir=${folder%/}/fs.gg.kit/${version}" >> "$GITHUB_OUTPUT"
          # THE PIN, as the receiver itself resolved it — this is what selects the rule below.
          echo "kit-version=${version}" >> "$GITHUB_OUTPUT"
          dotnet msbuild "$RECEIVER_PROJECT" \
            -getProperty:FsggKitSkillRoots,FsggKitRetiredSkillRoots,FsggKitViewSkillRoots,FsggKitMaterializeBuildConfig \
            > "$RUNNER_TEMP/kit-props.json"

      # THE PINNED REF (.github#1772). `kit/v<version>` is the tag release-kit.yml releases from and
      # refuses to publish without, so a restored version names exactly one immutable hub commit. It
      # is PEELED here — an annotated tag's own object id is not a commit and `actions/checkout` would
      # be resolving a name rather than a commit — and the resolved 40-hex sha is what the checkout
      # below is given. Nothing about this reads `main`.
      #
      # The version is attacker-adjacent (a fork's pull request chooses what it pins), so it is
      # validated to a bare `x.y.z` BEFORE it is ever composed into a ref. Everything that can go
      # wrong here is a REFUSAL that names its remedy — never a pass, never an abstention (#266).
      - name: Resolve the hub commit the receiver's pin names
        if: steps.probe.outputs.moved == 'true'
        id: rule-ref
        env:
          KIT_VERSION: ${{ steps.inputs.outputs.kit-version }}
        run: |
          set -uo pipefail
          refuse() {
            { echo "### kit-bump-shape: REFUSED — no verdict could be reached"; echo
              printf '%s\n' "$1"
              echo
              echo "This is not a pass and not a failure of the bump. The rule must come from the kit"
              echo "release this receiver pins, never from the hub's moving \`main\` (.github#1772, #1584)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kit-bump-shape: $1" >&2
            exit 1
          }
          case "$KIT_VERSION" in
            '') refuse "the restore named no FS.GG.Kit version, so there is no pinned rule to fetch." ;;
            *[!0-9.]*|.*|*.|*..*) refuse "the restored FS.GG.Kit version '$KIT_VERSION' is not a bare x.y.z, so it cannot name a release ref. Refusing rather than resolving a ref a pull request chose." ;;
          esac
          tag="kit/v$KIT_VERSION"
          url="https://github.com/FS-GG/.github.git"
          refs="$(git ls-remote "$url" "refs/tags/$tag" "refs/tags/$tag^{}")" \
            || refuse "could not list \`$tag\` on $url."
          peeled="$(printf '%s\n' "$refs" | awk -v t="refs/tags/$tag^{}" '$2==t {print $1; exit}')"
          plain="$(printf  '%s\n' "$refs" | awk -v t="refs/tags/$tag"     '$2==t {print $1; exit}')"
          sha="${peeled:-$plain}"
          case "$sha" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]) : ;;
            *) refuse "FS-GG/.github has no tag \`$tag\`, so FS.GG.Kit $KIT_VERSION names no immutable hub commit. Remedy: tag the commit that released it — \`git tag $tag <sha> && git push origin $tag\` — then re-run. (release-kit.yml refuses to publish untagged, so only versions released before that gate can be missing one.)" ;;
          esac
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "Rule pinned to FS-GG/.github@$sha ($tag), chosen by this receiver's own pin."

      - name: Check out the shape rule at that commit
        if: steps.probe.outputs.moved == 'true'
        uses: actions/checkout@v7
        with:
          repository: FS-GG/.github
          ref: ${{ steps.rule-ref.outputs.sha }}
          path: .kit-bump-shape
          persist-credentials: false

      - uses: actions/setup-python@v7
        if: steps.probe.outputs.moved == 'true'
        with:
          python-version: "3.x"

      # PASS TWO — the verdict, from the rule the receiver's own pin selected. The exit code is the
      # contract (0 mechanical, 1 not mechanical, 2 abstain, 3 refused, 4 mechanical + receiver-side
      # repair) and this step's only job is to render it where a reviewer will see it, then choose a
      # conclusion:
      #
      #   0 / 4  success — 0 needs no reading at all; 4 needs exactly the files it names.
      #   1 / 3  failure — read this one. It BLOCKS NOTHING: the context is required nowhere.
      #
      # 4 is a success on purpose. FS.GG.Rendering#1088 is the measured instance of it and merging it
      # was right; redding that class is exactly the "the guard parks the bumps a human most wants
      # automated" failure that re-scoped #1587.
      - name: Report the shape
        id: report
        if: steps.probe.outputs.moved == 'true'
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          KIT_DIR: ${{ steps.inputs.outputs.kit-dir }}
          RULE_SHA: ${{ steps.rule-ref.outputs.sha }}
        run: |
          set -uo pipefail
          rule=.kit-bump-shape/scripts/check-kit-bump-shape.py
          # A kit release that predates the rule. The checkout succeeded and the commit is the right
          # one — the release simply does not carry a rule, so there is nothing to judge this bump
          # WITH. Refuse and say which commit was looked in; never fall back to `main`, which is the
          # entire defect #1772 closes.
          if [ ! -f "$rule" ]; then
            { echo "### kit-bump-shape: REFUSED — no verdict could be reached"; echo
              echo "FS-GG/.github@\`$RULE_SHA\` — the commit this receiver's FS.GG.Kit pin names —"
              echo "carries no \`scripts/check-kit-bump-shape.py\`, so that release predates the rule."
              echo "Bump to a kit released after it, or judge this pull request by hand. This is not a"
              echo "pass; and it deliberately does NOT fall back to the hub's \`main\` (.github#1772)."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kit-bump-shape: FS-GG/.github@$RULE_SHA carries no shape rule." >&2
            echo "verdict=3" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          rc=0
          out="$(python3 "$rule" \
                   --repo . --base "$BASE" --head "$HEAD" \
                   --kit-dir "$KIT_DIR" --properties "$RUNNER_TEMP/kit-props.json" 2>&1)" || rc=$?
          printf '%s\n' "$out"
          case "$rc" in
            0) headline="mechanical — pin plus materializer output only; no human need read this bump" ;;
            4) headline="mechanical + receiver-side repair — read ONLY the receiver-authored files named below" ;;
            1) headline="NOT mechanical — this bump changes kit territory in a way the materializer would not; read it in full" ;;
            # REACHABLE HERE since #1772, and it must not red — pass one is a strict superset, so a
            # pull request it sent on may still be nothing the rule has an opinion about, and that is
            # the same non-verdict pass one reports for free.
            #
            # BUT EXIT 2 IS ALSO WHAT `argparse` EXITS ON A BAD COMMAND LINE, and the rule is pinned
            # while THIS FILE tracks the hub's `main` — so the day someone adds a flag here, every
            # receiver on an older `kit/v*` runs a rule that rejects the argv and exits 2. Mapping
            # that to "abstains" would report a green non-verdict for a rule that never ran: #266
            # exactly. An abstention says so in words; a usage error does not. Demand the word.
            2) case "$out" in
                 *ABSTAINS*) headline="abstains — no FS.GG.Kit pin change (this is not a pass)" ;;
                 *) headline="REFUSED — the pinned rule exited 2 without abstaining, which is what argparse does when it rejects a command line. The rule at this receiver's pin does not accept the arguments this workflow passes. This is not a pass"
                    rc=3 ;;
               esac ;;
            3) headline="REFUSED — no verdict could be reached. This is not a pass and not a failure of the bump" ;;
            *) headline="unknown verdict code $rc" ;;
          esac
          { echo "### kit-bump-shape: $headline"; echo; echo '```'; printf '%s\n' "$out"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          # THE VERDICT CODE, PUBLISHED FOR `bump-mechanical` — written BEFORE the exit below, because
          # `exit 1` ends the step and an output written after it would never exist. `$rc` here is the
          # code AFTER the 2 -> 3 remap above, so a rule that rejected the argv is a REFUSAL to both
          # contexts and an abstention to neither (#266).
          echo "verdict=$rc" >> "$GITHUB_OUTPUT"
          case "$rc" in
            0|2|4) exit 0 ;;
            *)     exit 1 ;;
          esac

  # ── the automerge boolean (.github#1815) ──────────────────────────────────────────────────────
  # `kit-bump-shape` above is green on `mechanical`, on `mechanical + repair` AND on `abstain`, so a
  # required context built on it cannot express #1587's "automerge the mechanical class only". A check
  # run carries ONE BOOLEAN across the branch-protection / automerge boundary: `automergeType: pr`
  # merges through GitHub's merge API, which reads that boolean, and Renovate's own pre-merge poll
  # reads the same one. Neither can see an exit code, a step summary, or an annotation. So the
  # decision needs a SECOND boolean, and this job is it.
  #
  # IT RE-EVALUATES NOTHING. It reads `bump-shape`'s verdict code and renders it. Two consequences,
  # both deliberate:
  #
  #   * THE TWO CONTEXTS CANNOT DISAGREE. One rule ran, once, at one pinned commit. A second job that
  #     re-derived the verdict could grade the same pull request two ways, and the day it did, the
  #     one a human read would not be the one automerge obeyed.
  #   * ABSTENTION STAYS CHEAP (#1508). This job installs nothing, checks nothing out, and reads no
  #     credential. A non-bump pull request in seven repositories pays a runner and a `case`. The
  #     alternative — an independent job repeating pass one — would make every pull request in the
  #     fleet pay a second `fetch-depth: 0` checkout, and every real bump a second SDK and restore.
  #
  # `if: ${{ !cancelled() }}` IS LOAD-BEARING AND IS NOT A #1508 GATE. `needs:` alone SKIPS this job
  # when `bump-shape` fails — and GitHub reports a skipped job as `conclusion: skipped`, which branch
  # protection counts as SATISFIED. So without this line the mapping inverts itself exactly where it
  # matters: `not mechanical` and `REFUSED`, the two classes that MUST never automerge, would be
  # the two that report green. That is the "ten checks that could not fail" class, and it is the one
  # mutation in tests/kit-bump-shape/run.sh that this job most needs. It is not the `if:` #1508
  # forbids: that one SUPPRESSES the check run on some pull requests, and this one exists to make the
  # job run on MORE of them. The only input it excludes is a cancelled run, where no verdict exists to
  # report and the pull request gets a fresh run anyway.
  #
  # NOTHING HERE IS ARMED. `materialize / kit-bump-mechanical` is required in ZERO repositories, and
  # `scripts/repos.sh require-context` was not invoked in any mode by the change that added it (#1815
  # is deliberately not #1587). Read the arming trade in
  # docs/coordination/reusable-workflow-contract.md before it is: a RED non-required context already
  # stops Renovate's automerge, because Renovate polls the branch's COMBINED status and not the
  # required subset — so #1587 can enforce the decision with nothing armed at all, and arming buys
  # branch protection as a second enforcer at the price of making class 4 need an admin.
  # `github.event_name == 'pull_request'` IS CARRIED HERE FOR THE SAME REASON AND WITH THE SAME
  # PROPERTY (.github#1845): it is a tautology on the event this context reports about, so the check
  # run is still created on 100% of pull requests, and it stops a dispatched repair run from reporting
  # `REFUSED — kit-bump-shape published no verdict` about a pull request that does not exist. It is
  # ANDed with `!cancelled()` rather than replacing it — dropping `!cancelled()` is still the
  # inversion described above, and the fixture drives both terms separately.
  bump-mechanical:
    name: kit-bump-mechanical
    needs: bump-shape
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Does this bump need a human?
        env:
          VERDICT: ${{ needs.bump-shape.outputs.verdict }}
        run: |
          set -uo pipefail
          # THE MAPPING. `kit-bump-shape` answers "is this contaminated?"; this answers "does this
          # need a human?". They are different questions and they differ on exactly one class — 4 —
          # which is the whole reason this job exists.
          #
          #   0  mechanical            SUCCESS  pin plus materializer output; nothing to read.
          #   2  abstains              SUCCESS  evaluated, and NOT A KIT BUMP: no pin declaration
          #                                     changed, so there is no bump for a human to read.
          #                                     This is the #1508 property that makes arming SAFE —
          #                                     it is why a docs pull request in an armed receiver is
          #                                     not blocked forever by a guard that has nothing to
          #                                     say about it. It asserts nothing about the pull
          #                                     request's mergeability and nothing automerges on it:
          #                                     #1587's rule matches FS.GG.Kit alone, and a diff that
          #                                     moves the FS.GG.Kit pin CANNOT reach this arm (pass
          #                                     one is a strict superset of the rule's non-abstention,
          #                                     asserted by tests/kit-bump-shape/run.sh legs 34/35).
          #   4  mechanical + repair   FAILURE  clean, and a person must still read the receiver-
          #                                     authored files it names. `kit-bump-shape` stays GREEN
          #                                     here — merging FS.GG.Rendering#1088 was CORRECT — and
          #                                     this is #1726's "green, not automerged", as a boolean.
          #   1  not mechanical        FAILURE  read it in full.
          #   3  REFUSED               FAILURE  no verdict was reached. Never a pass (#266).
          #   ''/other                 FAILURE  `bump-shape` ended without publishing a verdict at
          #                                     all — a failed restore, an unresolvable kit/v tag, a
          #                                     dead runner, or a path added later that writes none.
          #                                     "I could not evaluate this" is not "it passed" (#266),
          #                                     and this arm is what makes that the DEFAULT.
          case "$VERDICT" in
            0) { echo "### kit-bump-mechanical: MECHANICAL — no human need read this bump"; echo
                 echo "The pinned shape rule graded this pull request \`mechanical\` (exit 0): the"
                 echo "FS.GG.Kit pin, plus what the materializer produces, and nothing else. This is"
                 echo "the one class #1587 automerges. See \`kit-bump-shape\` for the itemised report."
               } >> "$GITHUB_STEP_SUMMARY"
               echo "kit-bump-mechanical: verdict 0 (mechanical) — automergeable."
               exit 0 ;;
            2) { echo "### kit-bump-mechanical: not a kit bump — nothing to automerge (this is not a pass)"; echo
                 echo "No line added or removed by this pull request declares an \`FS.GG.Kit\` package"
                 echo "version, so this reporter has no bump to grade. That is not a statement that"
                 echo "this pull request is mergeable, correct, or reviewed — only that the question"
                 echo "this context answers (\"does this kit bump need a human?\") does not arise here."
               } >> "$GITHUB_STEP_SUMMARY"
               echo "kit-bump-mechanical: verdict 2 (abstains) — no kit bump to grade."
               exit 0 ;;
            4) { echo "### kit-bump-mechanical: NEEDS A HUMAN — mechanical + receiver-side repair"; echo
                 echo "The pinned shape rule graded this \`mechanical + repair\` (exit 4). The bump is"
                 echo "not contaminated — \`kit-bump-shape\` is GREEN and merging this may well be"
                 echo "exactly right — but it carries receiver-authored files that ride the bump, and"
                 echo "\`kit-bump-shape\` names them. Read those, then merge it yourself."
                 echo; echo "This context is RED so that automerge does not do it for you (#1815)."
               } >> "$GITHUB_STEP_SUMMARY"
               echo "::error::kit-bump-mechanical: verdict 4 (mechanical + receiver-side repair) — a person must read the receiver-authored files kit-bump-shape names. Not automergeable." >&2
               exit 1 ;;
            1) { echo "### kit-bump-mechanical: NEEDS A HUMAN — not mechanical"; echo
                 echo "The pinned shape rule graded this \`not mechanical\` (exit 1): it changes kit"
                 echo "territory in a way the materializer would not produce. \`kit-bump-shape\` is red"
                 echo "too, and names what decided it. Read this bump in full."
               } >> "$GITHUB_STEP_SUMMARY"
               echo "::error::kit-bump-mechanical: verdict 1 (not mechanical) — read this bump in full. Not automergeable." >&2
               exit 1 ;;
            3) { echo "### kit-bump-mechanical: REFUSED — no verdict could be reached (this is not a pass)"; echo
                 echo "The shape rule reached no verdict on this pull request, so nothing here says it"
                 echo "is mechanical. \`kit-bump-shape\` carries the refusal and its remedy. A refusal"
                 echo "is not an abstention and is never a pass (#266) — so this context is RED, and"
                 echo "an unevaluated bump cannot be automerged."
               } >> "$GITHUB_STEP_SUMMARY"
               echo "::error::kit-bump-mechanical: verdict 3 (refused) — the rule reached no verdict, so this bump is not known to be mechanical. Not automergeable." >&2
               exit 1 ;;
            *) { echo "### kit-bump-mechanical: REFUSED — kit-bump-shape published no verdict (this is not a pass)"; echo
                 echo "The \`kit-bump-shape\` job ended without publishing a verdict code — it received"
                 printf '%s\n' "\`${VERDICT:-<empty>}\`. That is a job that failed before it could grade"
                 echo "anything (a failed restore, an unresolvable \`kit/v<version>\` tag, a runner that"
                 echo "died), or a new failure path in it that writes no verdict. Read that job's log."
                 echo; echo "Reporting this as a pass would be \"I could not evaluate it\" spelled as \"I"
                 echo "evaluated it and it passed\", which is what #266 forbids. So it is RED."
               } >> "$GITHUB_STEP_SUMMARY"
               echo "::error::kit-bump-mechanical: kit-bump-shape published no verdict (got '${VERDICT:-<empty>}'), so this pull request is not known to be a mechanical bump. Not automergeable." >&2
               exit 1 ;;
          esac

  # ── the receiver-side authorization validation (.github#2721) ─────────────────────────────────
  # Slice 6 of the GitHub-native executor fencing design
  # (`docs/reports/2026-08-04-github-native-executor-fencing-design.md` §5.3 for the shape and the
  # route, §6.3 for the checks, §9.1 for why it lands unarmed), under `.github#1858` — Critical, open
  # since 2026-07-28: two workers ran `.github#1853` to completion concurrently under ONE claim
  # marker, and the second executor MERGED pull requests in six repositories.
  #
  # WHY IT LIVES HERE, WHICH IS §5.3's WHOLE ARGUMENT. The harm landed in the RECEIVERS —
  # `FS.GG.Net#58` and `FS.GG.Audio#220` were merged by an executor holding nothing (§8.3) — and
  # measured on 2026-08-16, NO receiver carries any fence at all: all seven have exactly
  # `coordination-coherence`, `gate`, `kit-materialize`, `lockfile-sync` and `release`-family
  # workflows, and none of `fsgg-claim-fence.yml` (slice 4) or `coherence.yml`'s `claim-generation`
  # (`.github#2342`), both of which are hub-local and run only on `FS-GG/.github`'s own pull requests.
  # Every route to a receiver but one is forbidden — hand-copying is the defect class #1507/#1510/
  # #1515/#1528/#1538 closed and ADR-0067 §5 forbids re-opening; the kit cannot ship a workflow FILE
  # because the App installation token that pushes the materialize commit has `contents: write` and
  # not `workflows: write`; and a receiver cannot add a step to a `uses:` job. All seven receivers
  # ALREADY call this workflow, ungated, on `pull_request` into `main`, so a job added here reaches
  # all seven with ZERO receiver-side edits. That is the same route `bump-shape` above takes and the
  # same one §5.3 names. ZERO RECEIVER EDITS IS A HARD CONSTRAINT, not a convenience: the design chose
  # this shape precisely so enrolment cannot drift per repository.
  #
  # ============================================================================================
  # WHAT IT VALIDATES, AND WHY THAT SUBJECT IS REACHABLE RATHER THAN HYPOTHETICAL
  # ============================================================================================
  #
  # This parent has already absorbed TWO fencing readers that landed INERT — slice 3 wrote the
  # `fsgg:pr-authorization` marker but not the merge election, so slice 4's check 4 has no producer;
  # and slice 2 landed `Client.OpLock.acquire` with no reachable caller, so no dispatch grant can
  # exist. Both are CLOSED rows that pass every test written against them, because the tests supply
  # the subject the production path never will. So the producer here is stated as a MEASUREMENT, not
  # as an assumption:
  #
  #   the marker      `<!-- fsgg:pr-authorization v=1 item=<owner/repo#N> gen=<comment id>
  #                    head=<40-hex> -->`, in the pull request BODY
  #   the producer    `Client.ensureAuthorization`, `src/FS.GG.Coord.Cli/Client.fs:1743-1753` — the
  #                   exact four-field body that function composes
  #   the caller      the live `delivery <ref> --pr <n>` call `pnext-item` §6 makes MANDATORY for
  #                   every item in every repository, receivers included (`.github#2488`)
  #   measured live   2026-08-16, on receiver pull requests and not merely on the hub's:
  #                   FS-GG/FS.GG.Rendering#1244 and #1241, FS-GG/FS.GG.SDD#882 and #877 each carry
  #                   one, fully qualified `owner/repo#N`, on an `item/<n>-*` branch.
  #   the refusable   FS-GG/FS.GG.Net#68 (`item/67-adopt-coord-cli`) and #66 (`item/65-…`) are
  #   subject         `item/<n>-*` branches carrying NO marker at all — `.github#1858`'s own shape,
  #                   live, in the very repository the incident reached.
  #
  # THE FOUR-FIELD FORM IS DELIBERATE AND IS NOT A NARROWING. `scripts/check-claim-fence.py` requires
  # SIX (`v item gen opkey grant head`) because §6.3 checks 4 and 5 need the election; nothing writes
  # those two fields today, which is why that gate is observe-only and says so. This job grades the
  # form the production path actually emits — checks 1, 2, 3 and 6 of §6.3, the same slice
  # `coherence.yml`'s already-armed `claim-generation` grades in the hub — so its findings are about
  # pull requests rather than about a field nobody writes. It also accepts a marker that carries the
  # future `opkey=`/`grant=` fields, which is `authorizationMarker`'s own stated forward-compatibility
  # (`Client.fs`): the day slice 3's successor writes them, this gate does not have to change first.
  #
  # ============================================================================================
  # WHAT IT DELIBERATELY DOES **NOT** CHECK, AND WHY THAT IS A REFUSAL RATHER THAN AN OMISSION
  # ============================================================================================
  #
  # §5.3's first sentence asks a receiver to "re-read the grant on its own op-lock issue … and accept
  # only on an exact live match". THIS JOB DOES NOT DO THAT, and adding it would be a defect the
  # design already names. The dispatch grant is an ordinary lease-bearing `fsgg:claim` marker (§4.1)
  # and `release` DELETES it — "Once it is gone the lease is dropped", `src/FS.GG.Coord.GitHub/
  # Writes.fs:822`. §4.2 states the consequence directly: "a lease-based lock can only be verified by
  # a reader that runs INSIDE the lease. The broker does. A CI job does not." A `pull_request`-
  # triggered job re-reading a grant would therefore red every CORRECTLY-behaving worker that released
  # on schedule — `#463`'s fail-ALWAYS shape, which §8.2 commits against — and would red it hardest on
  # the dispatches that completed properly. The grant's synchronous re-read belongs to a receiver-side
  # `repository_dispatch` handler, and adding one to seven receivers is exactly the receiver edit the
  # hard constraint above forbids. This boundary is REPORTED, not silently absorbed.
  #
  # ============================================================================================
  # OBSERVE-ONLY, AND #1508
  # ============================================================================================
  #
  # §9.1 step 1: "Land the producer in observe-only. The fence workflow reports `success`
  # unconditionally and writes its real verdict to the job summary. Required in ZERO repositories."
  # That is exactly where `kit-bump-shape` and `kit-bump-mechanical` above already sit, and arming is
  # slice 8's job (`.github#2723`), never a workflow file's. Concretely: the verdict step's LAST
  # statement is `exit 0`, and the real code is published as its `verdict` output. Arming this before
  # a producer has been observed reporting is the measured outage `#1713` was founded on.
  #
  # `if: github.event_name == 'pull_request'` IS A TAUTOLOGY OVER THE EVENT THIS JOB REPORTS ABOUT,
  # carried for the same reason and with the same property as `bump-shape` and `bump-mechanical`
  # above (.github#1845): the check run is still created on 100% of pull requests, so the #1508
  # deadlock stays impossible, and what it excludes is only the on-demand `workflow_dispatch` repair
  # run, where there is no pull request to grade. NARROWING IT by head ref, base branch, author, label
  # or `paths:` reintroduces #1508 exactly — applicability is decided INSIDE the job, from the branch
  # shape and the marker's presence, so an unrelated pull request gets a real, reported abstention
  # rather than silence. `tests/receiver-validate/run.sh` evaluates this REAL expression against every
  # pull-request shape its fixture can build, the same semantic assertion `tests/kit-bump-shape/run.sh`
  # makes about the two jobs above, and is mutation-proven in both directions.
  #
  # ============================================================================================
  # CREDENTIALS: NOTHING BEYOND WHAT THE CALLER ALREADY GRANTS
  # ============================================================================================
  #
  # A reusable workflow can only ever DOWNGRADE its caller's `GITHUB_TOKEN`, never raise it, and every
  # receiver's caller declares `permissions: contents: read`. So this job cannot ask for `issues:
  # read` and does not: all eight roster repositories are PUBLIC (measured live 2026-08-16, `gh api
  # repos/FS-GG/<r>` → `"visibility":"public"` for `.github` and all seven receivers), so the item's
  # comments are public data that `github.token` can read cross-repo. It mints no App token and reads
  # no secret — deliberately, for the same reason `bump-shape` does not: a job that runs on any pull
  # request, a fork head included, must not be the place a credential is handled.
  #
  # AND IF THAT READ EVER FAILS, THE ANSWER IS A NO-VERDICT AND NEVER A PASS (§6.3 check 6, §8.2).
  # That is what makes the credential argument safe to hold rather than something to be right about:
  # a repository turned private, a rate limit, or an outage produces code 2/3 with the reason named,
  # not a green. §9.1 step 2 — "observe it REPORT on a real pull request" — is the step that measures
  # this in production, and observe-only is what makes that measurement free.
  #
  # THE VERDICT CONTRACT IS THE ORG'S SHARED ONE, `scripts/lib/gate.py`'s `ExitCode`: 0 OK — the ONLY
  # green code — 1 FINDING, 2 NO-VERDICT (retryable), 3 NO-VERDICT (permanent). It is restated inline
  # rather than imported because this job runs in the RECEIVER's checkout, where `scripts/lib/` does
  # not exist and no checkout of it is taken; `tests/receiver-validate/run.sh` parses `gate.py` and
  # reds on any divergence, so the two cannot drift.
  receiver-validate:
    name: receiver-validate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      verdict: ${{ steps.validate.outputs.verdict }}
    steps:
      # NO CHECKOUT. The subject is the pull request's own body and GitHub's live state, neither of
      # which is in the tree — and a receiver's tree carries no rule for this job to run. Skipping the
      # checkout also keeps a fork-head pull request from ever materialising untrusted files here.
      #
      # EVERY UNTRUSTED VALUE ARRIVES THROUGH `env:` AND THE SCRIPT BODY CONTAINS NO `${{ }}` AT ALL.
      # `closing-keywords.yml:97-105` states the rule and the reason — "A PR body is attacker-
      # controlled text: `${{ github.event.pull_request.body }}` pasted into a `run:` block is a
      # script-injection sink" — and here it is not theoretical: the body IS the input. Design §6.2
      # carries the same clause. `tests/receiver-validate/run.sh` asserts the absence of `${{` in this
      # block so the property cannot be edited away quietly.
      - name: Validate this pull request's coordination authorization against GitHub-held facts
        id: validate
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SELF_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          rc=0
          python3 - <<'PY' || rc=$?
          import json
          import os
          import re
          import subprocess
          import sys
          from datetime import datetime, timezone

          # ---------------------------------------------------------------------------------------
          # `scripts/lib/gate.py`'s ExitCode, transcribed. 0 is the ONLY green code; an inability to
          # establish the answer is a NO-VERDICT and never a pass (#266, #421).
          # ---------------------------------------------------------------------------------------
          OK, FINDING, NO_VERDICT_RETRYABLE, NO_VERDICT_PERMANENT = 0, 1, 2, 3

          # THE PR AUTHORIZATION MARKER. Anchored on the OPEN of the HTML comment so a body that merely
          # QUOTES the marker's text in prose cannot forge one — the discipline
          # `src/FS.GG.Coord.GitHub/Reads.fs:220-226` applies to `fsgg:claim`, and the reason it gives:
          # an un-anchored pattern lets a body that quotes a marker "forge a lock on the item it is
          # posted" on. `\s+` after the prefix is load-bearing on its own: without it,
          # `fsgg:pr-authorization-note` and every other `fsgg:pr-authorization<suffix>` would be read
          # as this marker.
          AUTH_RE = re.compile(r"<!--\s*fsgg:pr-authorization\s+(?P<fields>.*?)-->", re.DOTALL)
          # The `fsgg:claim` marker on the ITEM. Anchored TWICE and deliberately: `re.match` anchors at
          # position 0, and the leading `^` anchors at position 0 with no MULTILINE, so each is
          # individually redundant and jointly they are defence in depth. This is the marker every
          # verdict below is grounded in, and a comment that merely quotes one — a review note, a
          # design excerpt — must not be able to hold a lock it never took.
          CLAIM_RE = re.compile(r"^<!--\s*fsgg:claim\s(?P<fields>.*?)-->", re.DOTALL)
          FIELD_RE = re.compile(r"(?P<k>[A-Za-z]+)=(?P<v>\S+)")
          ITEM_BRANCH_RE = re.compile(r"^item/(?P<n>[0-9]+)-")
          HEAD_SHA_RE = re.compile(r"^[0-9a-f]{40}$")
          REQUIRED = ("v", "item", "gen", "head")
          SUPPORTED_VERSION = "1"
          # `Options.fs`'s default claim lease. Only ever a FALLBACK: a marker's own `lease=` wins, so
          # a worker that took an item with a non-default `--lease` is not declared dead by CI
          # (`.github#2656`).
          DEFAULT_LEASE_MIN = 120

          notes: "list[str]" = []


          class NoVerdict(Exception):
              """A definite reason this gate cannot reach a verdict.

              Raised — never returned alongside a real answer — so that no call site can accidentally
              read a failed read as an empty result. `verdict()`'s caller maps it to the code it
              carries, which is NEVER `OK`. This is `scripts/lib/gate.py`'s `GateError` discipline,
              reached without being able to import it.
              """

              def __init__(self, code: int, headline: str) -> None:
                  super().__init__(headline)
                  self.code = code
                  self.headline = headline


          def fields_of(raw: str) -> "dict[str, str]":
              out: "dict[str, str]" = {}
              for m in FIELD_RE.finditer(raw):
                  out.setdefault(m.group("k"), m.group("v"))
              return out


          def server_assigned(value: str) -> bool:
              # A canonical server-assigned comment id: ASCII digits, no leading zero. Excludes `0`,
              # excludes `0012` (one generation keyed two ways), and excludes the engine's `released`
              # sentinel (`Client.fs:1723`).
              return len(value) > 0 and value[0] != "0" and all("0" <= ch <= "9" for ch in value)


          def qualified_item(value: str) -> "tuple[str, int] | None":
              # `owner/repo#N` and nothing else. The board's `<repo>#N` shorthand is NOT GitHub
              # grammar (`.github#2107`), and it is refused BY NAME below rather than silently
              # resolved against this repository's owner — guessing the owner is how a marker naming
              # somebody else's item would be graded against ours.
              repo, sep, number = value.partition("#")
              if not sep or not server_assigned(number):
                  return None
              halves = repo.split("/")
              if len(halves) != 2:
                  return None
              if not all(h and not any(c.isspace() or c == "#" for c in h) for h in halves):
                  return None
              return repo, int(number)


          def verdict() -> "tuple[int, str, list[str]]":
              body = os.environ.get("PR_BODY") or ""
              head = os.environ.get("PR_HEAD") or ""
              branch = os.environ.get("PR_BRANCH") or ""
              self_repo = os.environ.get("SELF_REPO") or ""

              matches = [fields_of(m.group("fields")) for m in AUTH_RE.finditer(body)]
              on_item_branch = bool(ITEM_BRANCH_RE.match(branch))

              # APPLICABILITY, DECIDED INSIDE THE JOB. A pull request that is neither on an
              # `item/<n>-*` branch nor presenting an authorization is not something this gate has an
              # opinion about — a Renovate bump, a docs change, a fork contribution. It ABSTAINS, and
              # the abstention says in words that it is not a pass. This is the #1508 property that
              # makes arming safe later: an unrelated pull request in an armed receiver is never
              # blocked forever by a guard with nothing to say about it.
              if not on_item_branch and not matches:
                  return (
                      OK,
                      "abstains — this pull request presents no coordination authorization and is not "
                      "on an `item/<n>-*` branch, so there is nothing here to fence (this is not a pass)",
                      [],
                  )

              if not matches:
                  return (
                      FINDING,
                      "no `fsgg:pr-authorization` marker in the pull request body",
                      [
                          "This branch is `%s`, so it claims to deliver a claimed board item — but its "
                          "body carries no authorization marker at all. That is `.github#1858`'s own "
                          "shape: an executor that never called a coordination verb holds nothing and "
                          "so writes nothing." % branch,
                          "Remedy: the worker holding this item's live claim runs "
                          "`scripts/fsgg-coord delivery <ref> --pr %s` from its own credentialed shell "
                          "(`pnext-item` §6). Nothing else in the documented flow writes this marker."
                          % (os.environ.get("PR_NUMBER") or "<n>"),
                      ],
                  )
              if len(matches) > 1:
                  return (
                      FINDING,
                      "%d `fsgg:pr-authorization` markers in the pull request body — exactly one is "
                      "required" % len(matches),
                      [
                          "Declarations are not append-only: an old marker remains parsed, so adding a "
                          "second one cannot supersede the first and the gate cannot tell which "
                          "authorization is meant. Edit the existing marker in place, or delete it "
                          "before posting a replacement.",
                      ],
                  )

              auth = matches[0]
              missing = [f for f in REQUIRED if f not in auth]
              if missing:
                  return (
                      FINDING,
                      "the `fsgg:pr-authorization` marker is missing required field(s): %s"
                      % ", ".join(missing),
                      [],
                  )
              if auth["v"] != SUPPORTED_VERSION:
                  return (
                      FINDING,
                      "the marker names `v=%s`, which this gate does not understand (it grades `v=%s`)"
                      % (auth["v"], SUPPORTED_VERSION),
                      [
                          "A version this gate cannot read is refused rather than graded on the fields "
                          "it happens to recognise: a newer marker may mean something different by the "
                          "same field name.",
                      ],
                  )

              parsed_item = qualified_item(auth["item"])
              if parsed_item is None:
                  return (
                      FINDING,
                      "the marker's `item=%s` is not `owner/repo#N`" % auth["item"],
                      [
                          "The board's `<repo>#N` shorthand is not GitHub's grammar, and "
                          "`.github#2107` records what it costs when it reaches a field GitHub parses. "
                          "This gate refuses it rather than resolving the owner by assumption.",
                      ],
                  )
              item_repo, item_number = parsed_item
              if not server_assigned(auth["gen"]):
                  return (
                      FINDING,
                      "the marker's `gen=%s` is not a canonical server-assigned comment id" % auth["gen"],
                      [
                          "A released claim has no generation, and a leading-zero spelling would key "
                          "one tenancy two ways.",
                      ],
                  )
              if not HEAD_SHA_RE.match(auth["head"]):
                  return (
                      FINDING,
                      "the marker's `head=%s` is not a 40-character lowercase hex commit id"
                      % auth["head"],
                      [],
                  )

              # CHECK 2 (§6.3). A force-push after authorization means the authorization is for a
              # DIFFERENT artifact. This is the rule `delivery` already enforces client-side, where a
              # merge is refused because "the PR is no longer at the inspected head"
              # (`src/FS.GG.Coord.Cli/Client.fs:1096`).
              if not head:
                  return (
                      NO_VERDICT_PERMANENT,
                      "this run carries no pull-request head SHA, so the marker's `head=` cannot be "
                      "compared against anything",
                      [],
                  )
              if auth["head"] != head:
                  return (
                      FINDING,
                      "the marker authorizes head `%s`, but this pull request is now at `%s`"
                      % (auth["head"], head),
                      [
                          "The authorization is bound to the artifact it was written for. A push after "
                          "it was written leaves it naming a commit that is no longer what would "
                          "merge. Re-issue `delivery <ref> --pr <n>`; against an already-current "
                          "marker that call is a no-op PATCH-skip, so it is always safe to repeat.",
                      ],
                  )

              # CHECK 3 (§6.3). `gen=` must equal the LIVE winning `fsgg:claim` comment id on `item`,
              # re-read here rather than trusted from the marker. This is the one field the pull
              # request cannot satisfy by typing: the id is server-assigned and the winner is decided
              # by a CAS.
              comments = read_comments(item_repo, item_number)

              # A QUERY THAT CAN RETURN EMPTY FOR TWO DIFFERENT REASONS IS NOT EVIDENCE. An issue with
              # NO comments at all is indistinguishable from a read that reached the wrong subject — a
              # renumbered item, a transferred issue, a 200 with an empty page. A claimed item always
              # carries at least the claim marker, so zero comments is a NO-VERDICT and never the
              # finding "this item is unclaimed".
              if not comments:
                  return (
                      NO_VERDICT_PERMANENT,
                      "%s#%d returned NO comments at all, so this gate cannot tell an unclaimed item "
                      "from a read that reached the wrong subject" % (item_repo, item_number),
                      [
                          "A claimed item carries at least its own `fsgg:claim` marker, so an empty "
                          "comment list is not the finding 'nobody holds this'. Reporting it as one "
                          "would be an empty result set read as a negative finding.",
                      ],
                  )

              found = claim_markers(comments, "%s#%d" % (item_repo, item_number))
              if not found:
                  # The read SUCCEEDED and the item carries comments but no `fsgg:claim` marker at
                  # all: the claim was released or reaped away, so there is no tenancy for `gen=` to
                  # name. §8.1 — released => RED.
                  return (
                      FINDING,
                      "%s#%d carries no `fsgg:claim` marker, so generation `%s` names a tenancy that "
                      "has ended" % (item_repo, item_number, auth["gen"]),
                      [
                          "The item was released or reaped since this authorization was written. "
                          "Recovery is authoring, not retry: re-take the claim and re-authorize, "
                          "which mints a new generation (design §8.1).",
                      ],
                  )

              live = [m for m in found if not m["stale"]]
              if not live:
                  # EXPIRED IS NOT EVICTED, and reporting the two as one reads as a lost race
                  # (`.github#2656`). Nobody stole or reaped anything; the holder stopped renewing.
                  oldest = min(found, key=lambda m: m["id"])
                  return (
                      FINDING,
                      "every `fsgg:claim` marker on %s#%d has outlived its own declared lease — the "
                      "lowest is comment %d (worker '%s', lease %d min)"
                      % (item_repo, item_number, oldest["id"], oldest["worker"], oldest["lease"]),
                      [
                          "This is an EXPIRED lease, not an eviction: nothing stole or reaped this "
                          "item, the holder simply stopped renewing. Repaired by `heartbeat`, or by "
                          "re-taking the item if the holder is gone — not by re-running this gate.",
                      ],
                  )

              winner = min(live, key=lambda m: m["id"])
              if str(winner["id"]) != auth["gen"]:
                  return (
                      FINDING,
                      "generation `%s` is stale for %s#%d: the live claim is comment %d (worker '%s')"
                      % (auth["gen"], item_repo, item_number, winner["id"], winner["worker"]),
                      [
                          "The item was released, reaped, stolen or re-claimed since this "
                          "authorization was written, so it belongs to a tenancy that has ended. "
                          "Comment ids are monotone, so a re-claimed item can never reproduce its old "
                          "generation. Re-authorize under the current claim (design §8.1).",
                      ],
                  )

              return (
                  OK,
                  "authorized — `%s` names the live claim on %s#%d (comment %d, worker '%s') and is "
                  "bound to this pull request's current head `%s`"
                  % (auth["gen"], item_repo, item_number, winner["id"], winner["worker"], head[:12]),
                  [],
              )


          def read_comments(repo: str, number: int) -> list:
              """Every comment on `repo#number`. Raises `NoVerdict`; never returns [] on failure."""
              proc = subprocess.run(
                  ["gh", "api", "--paginate", "repos/%s/issues/%d/comments" % (repo, number)],
                  capture_output=True,
                  text=True,
              )
              if proc.returncode != 0:
                  detail = (proc.stderr or "").strip() or "the read failed with no diagnostic"
                  notes.append(
                      "A read that did not complete is a NO-VERDICT, never a pass (design §6.3 check "
                      "6, §8.2). All eight roster repositories are public, so this token can normally "
                      "read them cross-repo; a repository turned private, a rate limit or an outage "
                      "lands here."
                  )
                  raise NoVerdict(
                      NO_VERDICT_RETRYABLE,
                      "could not read `repos/%s/issues/%d/comments`: %s" % (repo, number, detail),
                  )
              raw = (proc.stdout or "").strip() or "[]"
              try:
                  parsed = json.loads(raw) if raw.startswith("[") else None
              except json.JSONDecodeError as exc:
                  raise NoVerdict(
                      NO_VERDICT_PERMANENT,
                      "the comment read for %s#%d did not parse as JSON: %s" % (repo, number, exc),
                  )
              if not isinstance(parsed, list):
                  raise NoVerdict(
                      NO_VERDICT_PERMANENT,
                      "the comment read for %s#%d did not return a list of comments" % (repo, number),
                  )
              return parsed


          def claim_markers(payload: list, where: str) -> list:
              """Every anchored `fsgg:claim` marker, with its staleness. Raises `NoVerdict`.

              AN UNPARSEABLE MARKER REFUSES THE WHOLE SCAN rather than shortening the list
              (`src/FS.GG.Coord.GitHub/Reads.fs:283`, `:473-486`). Dropping one would let a malformed
              marker — the exact thing a forger would produce — silently promote the next candidate to
              winner.
              """
              env_lease = os.environ.get("FSGG_CLAIM_LEASE_MIN") or ""
              fallback = int(env_lease) if env_lease.isdigit() and int(env_lease) > 0 else DEFAULT_LEASE_MIN
              now = datetime.now(timezone.utc)
              found = []
              for comment in payload:
                  body = comment.get("body") or ""
                  m = CLAIM_RE.match(body)
                  if not m:
                      continue
                  fields = fields_of(m.group("fields"))
                  cid = comment.get("id")
                  updated = comment.get("updated_at")
                  if not isinstance(cid, int) or not isinstance(updated, str):
                      raise NoVerdict(
                          NO_VERDICT_PERMANENT,
                          "an `fsgg:claim` marker on %s has no readable id/updated_at — refusing the "
                          "whole scan rather than dropping it, because dropping one promotes the next "
                          "candidate to winner" % where,
                      )
                  try:
                      at = datetime.fromisoformat(updated.replace("Z", "+00:00"))
                  except ValueError:
                      raise NoVerdict(
                          NO_VERDICT_PERMANENT,
                          "an `fsgg:claim` marker on %s carries an unparseable updated_at (%r) — "
                          "refusing the whole scan rather than dropping it, because dropping one "
                          "promotes the next candidate to winner" % (where, updated),
                      )
                  declared = fields.get("lease", "")
                  lease = int(declared) if declared.isdigit() and int(declared) > 0 else fallback
                  age = (now - at).total_seconds()
                  # A NEGATIVE age means the marker's age could not be established and it is NOT
                  # stale: reading an unreadable age as an expired lease would break a live lock on a
                  # field we failed to parse (`Reads.fs`'s own rule).
                  found.append(
                      {
                          "id": cid,
                          "worker": fields.get("worker", "unparsed-marker"),
                          "lease": lease,
                          "stale": age >= 0 and age > lease * 60,
                      }
                  )
              return found


          try:
              code, headline, detail = verdict()
          except NoVerdict as refusal:
              code, headline, detail = refusal.code, refusal.headline, []
          label = {
              OK: "OK",
              FINDING: "FINDING",
              NO_VERDICT_RETRYABLE: "NO VERDICT (retryable)",
              NO_VERDICT_PERMANENT: "NO VERDICT",
          }[code]
          lines = ["### receiver-validate: %s — %s" % (label, headline or "see the annotations"), ""]
          for extra in list(detail) + notes:
              lines.append(extra)
              lines.append("")
          lines.append(
              "This context is OBSERVE-ONLY (design §9.1 step 1) and is required in no repository, so "
              "this verdict blocks no merge. It reports; it gates nothing."
          )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fh:
                  fh.write("\n".join(lines) + "\n")
          stream = sys.stdout if code == OK else sys.stderr
          kind = "notice" if code == OK else "warning"
          print("::%s::receiver-validate: %s" % (kind, headline or label), file=stream)
          for extra in list(detail) + notes:
              print(extra, file=stream)
          sys.exit(code)
          PY
          # THE REAL VERDICT, PUBLISHED. `$rc` is the script's own exit status, captured above and
          # written here before the observe-only `exit 0` below neutralises it — so the code a reader
          # (and `tests/receiver-validate/run.sh`) sees is the one the rule actually reached, not a
          # rendering of it.
          printf 'verdict=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          # OBSERVE-ONLY IS A HARD BOUNDARY, NOT A SOFT START (design §9.1 step 1, and slice 4's
          # `fsgg-claim-fence.yml` header). ARMING IS SLICE 8's JOB (`.github#2723`). This job runs in
          # SEVEN repositories it does not own, so a verdict that failed here would red pull requests
          # across the fleet on the first push — before anyone has watched the context report once,
          # which is precisely what §9.1 step 2 exists to do first. `tests/receiver-validate/run.sh`
          # asserts this line structurally AND by execution, in both directions: a mutated copy that
          # propagates the finding must be CAUGHT, or the boundary is a promise rather than a test.
          exit 0

  materialize:
    name: Materialize the kit from its pin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # TWO ARMS, SELECTED BY `github.event_name` AND BY NOTHING ELSE.
    #
    # ARM 1 — `pull_request`, UNCHANGED. Bot branches that move the FS.GG.Kit pin without
    # re-materializing, same-repo only (never fork heads — a fork push would 403, and we never
    # auto-commit to an untrusted head). Renovate is the only bot that edits the receiver's central
    # <PackageVersion>; it is the byte-copy sync PR's replacement, so the branch prefix is `renovate/`.
    # Evaluated in the caller's event context. Non-kit renovate/* PRs are harmless: the materialize is
    # idempotent (0 written -> no diff -> no push).
    #
    # ARM 2 — `workflow_dispatch`, AND IT IS UNCONDITIONAL. THAT IS THE POINT (.github#1845, #1815).
    # A skipped job reports `conclusion: skipped`, which branch protection counts as SATISFIED and
    # which a human reads as a tick. So the ONE thing a repair button must never do is skip: an
    # operator who followed the DRIFT summary, pressed Run workflow, and got a green run in which this
    # job silently did nothing would be strictly worse off than with no button at all — they would
    # believe the repair had happened. Every refusal on this arm is therefore made INSIDE the job,
    # where it is an `exit 1` that says why, and never by this expression. If you are tempted to add
    # `&& <anything>` to the dispatch term, that is the mutation `tests/kit-bump-shape/run.sh` exists
    # to catch, and it will.
    #
    # `github.event_name == 'pull_request' &&` is spelled on arm 1 for precision, not for safety:
    # `pull_request_target` also populates `github.event.pull_request`, and no receiver should be able
    # to reach an App-token push from that event by adding a trigger. The `plan` step below refuses
    # any event that is neither, so loosening this expression cannot open that door in silence either.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      ( github.event_name == 'pull_request' &&
        startsWith(github.event.pull_request.head.ref, 'renovate/') &&
        github.event.pull_request.head.repo.full_name == github.repository )
    steps:
      # WHAT THIS RUN IS ALLOWED TO WRITE, DECIDED BEFORE A CREDENTIAL IS MINTED AND IN ONE PLACE.
      #
      # The whole `main` decision is the four lines under `workflow_dispatch)` below: if the dispatched
      # ref IS the repository's default branch, the push target is a NEW branch and the default branch
      # is not written. See the file header for why that is the gate doing its job rather than a
      # concession to branch protection.
      #
      # `github.event.repository.default_branch` is read from the event payload — no API call, no
      # extra scope. An EMPTY value is a refusal and never a guess: `main` is not hardcoded anywhere
      # here, because a receiver whose default branch were something else would then have this job
      # push straight to it while believing it had not (#266).
      - name: Decide what this run may write
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          PR_HEAD: ${{ github.event.pull_request.head.ref }}
          DISPATCH_REF: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -uo pipefail
          refuse() {
            { echo "### kit-materialize: REFUSED — nothing was materialized and nothing was written"; echo
              printf '%s\n' "$1"; } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kit-materialize: $1" >&2
            exit 1
          }
          case "$EVENT" in
            pull_request)
              [ -n "$PR_HEAD" ] || refuse "this is a \`pull_request\` run with no head ref, so there is no branch to materialize onto."
              printf 'checkout-ref=%s\n' "$PR_HEAD"  >> "$GITHUB_OUTPUT"
              printf 'push-target=%s\n'  "$PR_HEAD"  >> "$GITHUB_OUTPUT"
              printf 'in-place=true\n'               >> "$GITHUB_OUTPUT"
              echo "pull_request arm: materializing onto the bump branch \`$PR_HEAD\` in place."
              ;;
            workflow_dispatch)
              [ -n "$DISPATCH_REF" ] || refuse "this dispatched run names no ref, so there is nothing to check out."
              [ -n "$DEFAULT_BRANCH" ] || refuse "the event payload carries no \`repository.default_branch\`, so this job cannot tell whether \`$DISPATCH_REF\` IS the default branch. It refuses rather than assuming it is not — assuming would push a repair straight to the branch this job must never write (.github#1845, #266)."
              printf 'checkout-ref=%s\n' "$DISPATCH_REF" >> "$GITHUB_OUTPUT"
              if [ "$DISPATCH_REF" = "$DEFAULT_BRANCH" ]; then
                printf 'push-target=kit-materialize/repair-%s\n' "$RUN_ID" >> "$GITHUB_OUTPUT"
                printf 'in-place=false\n' >> "$GITHUB_OUTPUT"
                echo "workflow_dispatch arm on the DEFAULT branch \`$DISPATCH_REF\`: any repair goes to a new branch, and \`$DISPATCH_REF\` is not written."
              else
                printf 'push-target=%s\n' "$DISPATCH_REF" >> "$GITHUB_OUTPUT"
                printf 'in-place=true\n' >> "$GITHUB_OUTPUT"
                echo "workflow_dispatch arm on \`$DISPATCH_REF\` (not the default branch, which is \`$DEFAULT_BRANCH\`): materializing in place."
              fi
              ;;
            *)
              # UNREACHABLE THROUGH THE `if:` ABOVE, AND HERE ANYWAY. This is the arm that makes
              # loosening that expression a loud failure instead of a silent App-token push from an
              # event nobody reviewed — `pull_request_target` above all, which carries a
              # `github.event.pull_request` and would otherwise walk straight into arm 1's shape.
              refuse "this workflow was reached from a \`$EVENT\` event. It materializes and PUSHES with an App installation token, and the only two events it will do that from are \`pull_request\` (a same-repo \`renovate/*\` head) and \`workflow_dispatch\`. Refusing." ;;
          esac

      - name: Mint App installation token (contents:write on this repo)
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.app-id }}
          private-key: ${{ secrets.app-private-key }}

      - name: Check out the ref this run materializes
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.plan.outputs.checkout-ref }}
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      # Re-materialize from the (now bumped) pin. RECEIVER_PROJECT is env-passed, never interpolated into
      # the run script — the org's uniform anti-injection pattern (cf. lockfile-sync.yml / contract-coherence.yml).
      # The materialize is content-addressed and fails LOUD on a missing/tampered kit member (ADR-0014),
      # so a malformed package reds this job rather than committing a broken kit.
      - name: Materialize
        env:
          RECEIVER_PROJECT: ${{ inputs.receiver-project }}
        run: |
          set -euo pipefail
          dotnet build "$RECEIVER_PROJECT" -t:FsggKitMaterialize -v minimal

      - name: Commit and push if the kit changed
        env:
          EVENT: ${{ github.event_name }}
          IN_PLACE: ${{ steps.plan.outputs.in-place }}
          PUSH_TARGET: ${{ steps.plan.outputs.push-target }}
          CHECKOUT_REF: ${{ steps.plan.outputs.checkout-ref }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          # The materialize writes ONLY managed kit files; the receiver project's obj/ and bin/ are
          # gitignored, so anything unignored here is a kit member the bump legitimately refreshed. If
          # nothing drifted (a non-kit renovate PR, or the pin already matched), there is no commit.
          if [ -z "$(git status --porcelain)" ]; then
            echo "Kit already matches the pin — nothing to materialize."
            # ON THE ON-DEMAND ARM THIS IS AN ANSWER, NOT A NO-OP, and it has to say so. An operator
            # got here because `kit / coordination-kit` was red and its summary sent them; "nothing to
            # repair" tells them the drift is not the committed kit against its pin — which is a real
            # finding about their tree, and the opposite of "I repaired it" (#266).
            if [ "$EVENT" = "workflow_dispatch" ]; then
              { echo "### kit-materialize: NOTHING TO REPAIR on \`$CHECKOUT_REF\`"; echo
                echo "The materialize ran and wrote no file: the committed kit on \`$CHECKOUT_REF\`"
                echo "already matches the \`FS.GG.Kit\` version this repository pins. **No commit was"
                echo "made and no branch was written.**"; echo
                echo "This is not \"the repair succeeded\" — it is \"there was nothing here to repair\"."
                echo "If \`kit / coordination-kit\` is red, re-read its annotations: an INCONCLUSIVE"
                echo "verdict (a feed outage, or a pin the feed does not serve) is not drift, and a"
                echo "\`DRIFT\` on a branch other than this one is not fixed from here."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # The App pushed this branch, so the App authors the commit. GitHub links a bot commit to its
          # account ONLY via `<BOT_USER_ID>+<slug>[bot]@users.noreply.github.com`, and BOT_USER_ID is the
          # id of the `[bot]` USER (297630107), NOT the App id — the same trap #514 fixed in
          # skill-registry-autofix.yml and lockfile-sync.yml. Literal, because no step output carries it.
          #
          # THIS ADDRESS IS ALSO LOAD-BEARING FOR RENOVATE, AND CHANGING IT HERE ALONE SILENTLY BREAKS
          # EVERY RECEIVER (.github#1533). A commit on Renovate's branch authored by anyone else is read
          # as "the user edited this PR": Renovate renames the PR `... - abandoned`, parks it under
          # PR Edited (Blocked), and NEVER updates that branch again. Since `renovate/<dep>-<major>.x` is
          # long-lived, the FIRST bump lands and every later one freezes — silently, because a bump that
          # is never proposed is not an error. That is what froze FS.GG.Kit 0.3.0-0.7.0 across the org and
          # cost a day of hand-advancing (FS.GG.Governance#315/#331/#332, FS.GG.Game#512).
          #
          # What stops it is `gitIgnoredAuthors` in the org-shared preset (default.json), which must name
          # this EXACT string. Renovate matches it by Set.delete on the commit author/committer email —
          # an exact match, not a login, not a regex, not case-insensitive — so `fs-gg-cross-repo-dispatch[bot]`
          # would match nothing and look identical to a working fix until the next kit release froze.
          # If you change this line, change default.json's gitIgnoredAuthors IN THE SAME PR. Nothing in CI
          # compares them yet; .github#1538 is the gate that will.
          #
          # Note this is NOT a fight with Renovate: once ignored, Renovate force-pushes the branch on
          # update, this job re-runs on the new head, and its second pass materializes 0 files -> no diff
          # -> no commit. The loop is the designed one and it terminates.
          #
          # ON THE REPAIR ARM THIS PARAGRAPH IS NOT REACHED IN THE SENSE THAT MATTERS: the branch is
          # `kit-materialize/repair-*`, never `renovate/*`, so Renovate never sees a foreign-authored
          # commit on a branch it owns and cannot mark anything abandoned. The identity is kept
          # identical anyway — one bot, one author, one address to keep in step with default.json.
          git config user.name  "${{ steps.app-token.outputs.app-slug }}[bot]"
          git config user.email "297630107+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"
          git add -A
          if [ "$IN_PLACE" = "true" ]; then
            git commit -m 'chore: materialize FS.GG.Kit (dotnet build -t:FsggKitMaterialize)'
            git push
            if [ "$EVENT" = "workflow_dispatch" ]; then
              { echo "### kit-materialize: repaired \`$CHECKOUT_REF\` in place"; echo
                echo "\`$CHECKOUT_REF\` is not this repository's default branch, so the refreshed kit"
                echo "was committed and pushed straight to it. \`kit / coordination-kit\` re-runs on the"
                echo "new head; that run, not this one, is the verdict on the repair."
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 0
          fi
          # ── THE REPAIR ARM: the default branch is never written (.github#1845) ──────────────────
          # `--exit-code` is the whole guard: this run pushes ONLY to a ref it created. `run_id` is
          # unique per run so a collision is not something an ordinary run can reach — it is here so
          # that "the default branch is not written" cannot be defeated by one, and so that a
          # collision is a refusal rather than a force-push over somebody's branch.
          if git ls-remote --exit-code --heads origin "$PUSH_TARGET" >/dev/null 2>&1; then
            { echo "### kit-materialize: REFUSED — the repair branch already exists"; echo
              echo "\`$PUSH_TARGET\` is already a branch on this remote. This job pushes only to a ref"
              echo "it creates, so it will not write over one. Delete that branch, or re-run this"
              echo "workflow (the branch name carries the run id, so a fresh run picks a fresh name)."
              echo "**\`$CHECKOUT_REF\` was not written.**"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error::kit-materialize: refusing to write the existing branch $PUSH_TARGET; $CHECKOUT_REF was not written." >&2
            exit 1
          fi
          git commit -m "chore: materialize FS.GG.Kit on demand (repair for ${CHECKOUT_REF})"
          git push origin "HEAD:refs/heads/$PUSH_TARGET"
          { echo "### kit-materialize: REPAIR READY ON A BRANCH — \`$CHECKOUT_REF\` WAS NOT WRITTEN"; echo
            echo "\`$CHECKOUT_REF\` is this repository's **default branch**. A materialize WRITES, so it"
            echo "is a repair and not a check, and \`kit / coordination-kit\` is a required context"
            echo "precisely so the kit's bytes are graded *before* they reach it. Pushing the repair"
            echo "straight there would bypass the gate whose red sent you here, so the repair is on a"
            echo "branch instead and the gate grades it on the way back in (.github#1845)."; echo
            echo "**Open the pull request:**"; echo
            echo "  $REPO_URL/compare/${CHECKOUT_REF}...${PUSH_TARGET}?expand=1"; echo
            echo "Branch: \`$PUSH_TARGET\` — the refreshed kit, committed by this workflow, and nothing"
            echo "else. If \`kit / coordination-kit\` is green on that pull request, the drift is gone."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Repair pushed to $PUSH_TARGET; $CHECKOUT_REF was not written."
