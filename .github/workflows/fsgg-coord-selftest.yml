# Self-test for scripts/fsgg-coord-bash — the GraphQL-budget-thrifty Coordination-board client.
#
# ADR-0040 D.2 cut `scripts/fsgg-coord` down to the ~40-line engine shim; the ~7,000-line bash monolith
# this corpus certifies is preserved at `scripts/fsgg-coord-bash` and driven here (bash exact + the
# shadow/flip differential) until D.4 deletes it. The `paths:` filter watches that file, not the shim.
#
# Runs tests/fsgg-coord/run-cases.sh, which drives the TIERED fixture: each case in
# tests/fsgg-coord/cases/ builds its OWN world (fixtures + a PATH-shim `gh` stub that COUNTS calls +
# an isolated cache) from tests/fsgg-coord/lib/harness.sh, asserts, and ends in `harness_report`.
#
# WHY TIERED. The former run.sh was one 5,808-line file sharing a single cache and one gh-stub across
# 847 assertions in FILE ORDER, so a case could only be reached through the side effects of every case
# above it. That hid real defects — the empty-RC_FILE fail-open (#344, reopened) is UNREACHABLE in the
# monolith, because the publish window is always already spent by the time its assertions run. A case
# that owns its world reaches it on the first call. The split is coverage, not tidiness.
#
# THE CORPUS IS THE CUT-OVER GATE (ADR-0034 §5). One case per historical defect, named for it. The
# engine that replaces bash is judged against every path that has ACTUALLY BROKEN — which is why this
# workflow BUILDS THE ENGINE and sets FSGG_SHADOW_REQUIRE_ENGINE=1: a fixture that quietly skips the
# half of itself that does the comparing is the silent no-op this whole effort exists to end.
name: fsgg-coord-selftest

on:
  pull_request:
    paths:
      - "scripts/fsgg-coord-bash"
      - "tests/fsgg-coord/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Core/**"
      - ".github/workflows/fsgg-coord-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fsgg-coord-bash"
      - "tests/fsgg-coord/**"
      - "src/FS.GG.Coord.Cli/**"
      - "src/FS.GG.Coord.Core/**"
      - ".github/workflows/fsgg-coord-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fsgg-coord-selftest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      # The engine is built FROM SOURCE here and never from the feed. That asymmetry is deliberate
      # (ADR-0034 §4.3): fixing coord would otherwise require publishing, and publishing would require
      # coord to schedule the fix.
      - name: Build the engine
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # FSGG_SHADOW_REQUIRE_ENGINE turns "no engine" from a SKIP into a FAILURE. Without it, a broken
      # build path degrades the shadow case to a no-op that still reports green.
      - name: The corpus — against BASH (the escape hatch must stay exact)
        env:
          FSGG_SHADOW_REQUIRE_ENGINE: "1"
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
        run: bash tests/fsgg-coord/run-cases.sh

      # THIS IS THE CUT-OVER GATE (ADR-0038). The same corpus, decided by the TYPED CORE. It replaces the
      # three-day fleet-divergence clock, which could not tick (worktree workers bank no evidence, #728)
      # and whose own taxonomy classified as "not a bug" the three real defects this sweep found: a prose
      # blocker that vanished and made its item schedulable, a swept item that silently ceased to exist,
      # and the lease window and holder dropped from every collision line.
      - name: The corpus — against FS (the flip)
        env:
          FSGG_SHADOW_REQUIRE_ENGINE: "1"
          FSGG_COORD_ENGINE: fs
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
        run: bash tests/fsgg-coord/run-cases.sh

      # A SUITE THAT CANNOT FAIL IS NOT A SUITE (#266, #436). A runner that discovers no cases exits 0
      # and reads as green. Assert the corpus is actually there before believing it passed.
      - name: Non-vacuity — the corpus must not be empty
        run: |
          set -euo pipefail
          n="$(find tests/fsgg-coord/cases -maxdepth 1 -name '*.sh' | wc -l)"
          echo "cases discovered: $n"
          [ "$n" -ge 25 ] || { echo "::error::the corpus collapsed to $n case(s) — refusing to call that green"; exit 1; }
