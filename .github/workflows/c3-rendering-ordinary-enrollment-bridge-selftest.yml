name: C3 Rendering ordinary enrollment bridge self-test

on:
  pull_request:
    paths:
      - ".github/workflows/c3-rendering-ordinary-enrollment-bridge.yml"
      - ".github/workflows/c3-rendering-ordinary-enrollment-bridge-selftest.yml"
      - "tools/c3-rendering-ordinary-enrollment-bridge.py"
      - "tools/c3-rendering-ordinary-enrollment-submit.py"
      - "tests/c3-rendering-ordinary-enrollment-bridge/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/c3-rendering-ordinary-enrollment-bridge.yml"
      - ".github/workflows/c3-rendering-ordinary-enrollment-bridge-selftest.yml"
      - "tools/c3-rendering-ordinary-enrollment-bridge.py"
      - "tools/c3-rendering-ordinary-enrollment-submit.py"
      - "tests/c3-rendering-ordinary-enrollment-bridge/**"

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: c3-rendering-ordinary-enrollment-bridge-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    name: c3-rendering-ordinary-enrollment-bridge-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Exercise bridge and submission refusal controls
        run: |
          python3 tests/c3-rendering-ordinary-enrollment-bridge/run.py
          python3 tests/c3-rendering-ordinary-enrollment-bridge/submit.py
