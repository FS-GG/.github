# Reusable lock-range coherence gate (FS-GG/.github#495, epic #266; ADR-0006).
#
# The blind spot: `dotnet restore --locked-mode` validates package entries — id, version, contentHash.
# It NEVER looks at the dependency ranges under a `"type": "Project"` entry. So a release bump that
# edits a version without regenerating the locks leaves every sibling project reference recording the
# OLD version, and every gate — including the cold locked restore — stays green over it. FS.GG.Audio
# carried six stale ranges through its whole v0.2.0 cycle; FS.GG.Game's `main` has carried one since
# `release: v0.4.0` (Game#128), which bumped <Version> and touched no lock file.
#
# Harmless at runtime — project references resolve from the project graph, not the lock — and that is
# exactly why it survives. The cost is a POISONED LOCK DIFF, at the one moment the repo can least
# afford noise: the reviewer scrutinising a contentHash reads it mixed with release-bump residue.
#
# This is the reusable arm of the guard FS.GG.Audio proved in Audio#52, generalised so every receiver
# can call it instead of hand-rolling 30 lines of bash. The check itself lives in ONE script authored
# here (scripts/check-lock-ranges.py) and sourced from public FS-GG/.github — the same
# `contract-coherence` / `skill-union-assert` pattern, so the gate cannot drift per repo.
#
# STATIC. Committed files only: no restore, no SDK, no network, no feed, no NuGet auth. It needs none
# of them, so it installs none of them and runs in seconds. Callers wire it with one `uses:` block and
# need grant nothing beyond `contents: read`.
#
# The version-of-truth is each project's OWN effective <Version>, not a central property. That is not a
# stylistic choice — it is the only rule true of all three receivers, which declare it three different
# ways (a $(FsGgAudioVersion) property in Audio, a per-project literal in Rendering, an inherited
# Directory.Build.local.props value in Game). A gate keyed on one central property would be a gate only
# Audio could call. See the script's docstring.
#
# WHICH RANGES ARE SUBJECTS COMES OUT OF THE LOCK, NOT OUT OF THE NAMES. A `"type": "Project"` entry's
# dependencies mix projects this repo BUILDS with packages it CONSUMES, and `FS.GG.UI.Scene` does not
# look any different from `FS.GG.Audio.Core` — so the gate keys on the fact that NuGet gives every project
# in the restore closure its own `"type": "Project"` entry. A dependency that has one is a project
# reference and is checked; one that does not is a consumption pin (#263's question, not this gate's) and
# is ignored. A project reference that resolves to none of your project files is DRIFT and goes red: it
# used to be skipped in silence, which let subjects vanish one at a time behind a green tick (.github#545).
#
# WHY THIS FETCHES A DIRECTORY AND NOT A LIST OF FILES (.github#1515). The authority checkout below used
# to name ONE file, `scripts/check-lock-ranges.py`, and that enumeration was CORRECT the day it was
# written — the script imports stdlib only. That is what made it a trap rather than a bug: a
# sparse-checkout is a HAND-MAINTAINED COPY OF A DEPENDENCY LIST, kept in a file that cannot execute the
# thing it lists, so nothing compares it to the script's real import lines. It drifts silently the moment
# the script gains a sibling, and this repo has hoisted shared helpers into scripts/lib/ three times
# already (#358, #524, #525).
#
# .github#1510 is the same list one language over, after the drift had already happened:
# skill-union-assert.yml enumerated its script plus ONE of the two libs it sources, #525 hoisted the
# second, the list was never updated, and EVERY receiver caller died at load in ~7s having asserted
# nothing — confirmed independently from FS.GG.SDD#718 and FS.GG.Governance#327. It went unseen because
# no receiver existed until one did. This was the unsprung version of the same trap, closed before it
# fired; the remedy shape is #1510's, deliberately, so that the two do not diverge into two dialects.
#
# AND THE TRIGGER WAS ALREADY SCHEDULED, which is what moved this off "someday". scripts/lib/ holds
# `gate.py`, the shared gate harness (#1158/#1159), which shipped with a STAGED MIGRATION of this repo's
# ~25 `scripts/check-*.py` gates onto it — pin-coherence first (it already does
# `sys.path.insert(0, dirname(__file__))` and imports `lib`), "the rest opportunistically".
# check-lock-ranges.py is one of the rest. The day it takes that import, a one-file checkout kills every
# receiver of this workflow at load while this repo's own CI stays green, because the migration would be
# exercised from a full checkout.
#
# Taking the DIRECTORY fixes the CLASS rather than one entry: any future `import`, `from lib … import`,
# sourced helper or data file the script grows under scripts/ arrives with no edit here, because there is
# no longer a list to keep in step. The invariant it rests on is one the script already obeys — every
# load-time dependency of a scripts/ gate lives under scripts/ — and unlike the enumeration, that
# invariant is ASSERTED: tests/lock-range-coherence/run.sh materialises this pattern set with real git
# and loads the script out of the result, so a narrowing reds the selftest here instead of a receiver's
# CI months from now.
#
# THE LEADING SLASH IS LOAD-BEARING. Under `sparse-checkout-cone-mode: false` these are gitignore-style
# patterns, so an unanchored `scripts/` matches a directory of that name at ANY depth — and this repo has
# four, in the skill bundles (`.agents|.claude/skills/work-{board,roadmap}/scripts/`). Both forms
# fix the bug; only `/scripts/` makes the claim "this checkout is scoped to scripts/" a true one.
# Measured: `/scripts/` selects exactly the repo's tracked contents of scripts/, scripts/lib/* included,
# and nothing else.
name: lock-range-coherence

on:
  workflow_call:
    inputs:
      working-directory:
        description: "Directory to check, relative to the caller's repo root."
        type: string
        default: "."
      min-ranges:
        description: >-
          Fail if fewer than this many project-reference ranges are inspected. The default of 1 is the
          fail-closed floor from epic #266: a check that inspects nothing and reports green is the
          defect, not the guard. Pass 0 ONLY for a repo whose projects genuinely do not reference each
          other, so that "zero" is a decision someone made rather than an omission nobody noticed.

          This floor is NO LONGER the only thing standing between you and a silent collapse of the
          subject set (.github#545). It never could be: a floor catches a fall to zero, and the way
          subjects vanish is one at a time. The gate now reads which dependencies are project references
          out of the lock's own `"type": "Project"` entries, so a reference it cannot resolve to one of
          your project files is an ERROR that names itself, not a range that quietly stops being checked.
          You therefore do NOT need to declare your true range count to be safe on that.

          Declaring it is still worth doing, for the one thing a floor is actually good at: catching a
          DELIBERATE reduction. Set it to the count the gate reports and a removed ProjectReference has
          to be an explicit decision rather than a number nobody looked at. It cannot cry wolf on growth
          — adding a project, a reference or a TFM only raises the count.
        type: number
        default: 1
      github-ref:
        description: "Ref of FS-GG/.github to source the check script from."
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  lock-ranges:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7
        with:
          path: caller

      - name: Checkout FS-GG/.github (check-script authority)
        uses: actions/checkout@v7
        with:
          repository: FS-GG/.github
          ref: ${{ inputs.github-ref }}
          path: dotgithub
          # THE DIRECTORY, NEVER A LIST OF FILES, and the leading slash is load-bearing. The argument
          # is in the file header under "WHY THIS FETCHES A DIRECTORY"; both halves are asserted by
          # tests/lock-range-coherence/run.sh. Do NOT narrow this back to named files (.github#1515).
          sparse-checkout: |
            /scripts/
          sparse-checkout-cone-mode: false

      - name: Assert every project-reference range tracks its project's declared version
        shell: bash
        env:
          # Passed via env, never interpolated into the run script — `workflow_call` inputs are
          # caller-controlled, and this is the org's uniform anti-injection pattern (cf.
          # skill-union-assert.yml, architecture-map.yml).
          WORKING_DIRECTORY: ${{ inputs.working-directory }}
          MIN_RANGES: ${{ inputs.min-ranges }}
        run: |
          set -euo pipefail
          python3 dotgithub/scripts/check-lock-ranges.py \
            --root "caller/${WORKING_DIRECTORY}" \
            --min-ranges "${MIN_RANGES}"
