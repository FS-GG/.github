# Does the PUBLISHED FS.GG.Kit still carry canonical's coordination-kit bytes? (.github#1291, epic #266)
#
# FS.GG.Kit (ADR-0062) ships the coordination kit as one versioned package; a `kit-delivery: package`
# receiver MATERIALIZES it onto disk from a pinned version, so the PACKAGE'S CONTENT is what the fleet
# restores. verify-package.sh proves the kit is derived-correct at PACK time, and coordination-coherence
# checks each RECEIVER — but nothing rechecked the PUBLISHED artifact as the canonical staged tree
# moved. `registry/repos.lock` remains the declared-source integrity gate; the staged tree manifest is
# the exact multi-file comparison point (.github#1469). The original gap was .github#1291:
# fs.gg.coord.cli 0.6.0 -> 0.7.0 (#660) advanced the manifest on main,
# every pack-time gate stayed green, and the published FS.GG.Kit 0.1.0 still carried the 0.6.0 bytes, so
# the first from-scratch materialize (FS.GG.Net) drifted and coordination-coherence red.
#
# This is engine-pin-coherence one layer up: engine-pin-coherence guards the PIN the fleet copies; this
# guards the PACKAGE the fleet materializes. Same #266 lesson — a subject nothing watches goes stale in
# silence — so this mirrors engine-pin-coherence's shape exactly.
#
# WHY THE LIVE CHECK IS NOT A pull_request gate. The staleness is a property of MAIN (repos.lock) plus
# the FEED (the published kit), not of any PR's diff: #660 touched the manifest and nothing under
# src/FS.GG.Kit/, so no path-filtered PR trigger could ever see it, and it is fixed by REPUBLISHING
# (release-kit.yml), not by editing some other PR. So the live check runs on main, on a schedule, and on
# demand; a PR runs the fixture, whose subject IS the diff.
#
# ...AND WHY THERE IS NOW A DIFFERENT PR ARM ANYWAY (.github#1597). The paragraph above is about the
# LIVE check, and it is still true. What it did not cover is the AUTHORING obligation: a PR that edits
# a `kit:` source merged green here and reddened `main` seconds later — twice in one morning (`edc8404`
# / #1581, then `0e1c5d0` / #1591) — because by the time the only arm that looks runs, the kit is
# already stale and every receiver is already carrying it. `pr-arm` below asks the one question that
# IS a property of the diff: does this PR edit a kit source while shipping a `<Version>` the fleet can
# already restore? It does not replace the `published` job, which stays the verdict of record that the
# release actually happened. See the checker's docstring for why the naive "bump the version" rule
# scores the FIRST of those two incidents green.
#
# The gate FAILS CLOSED (epic #266): an unreadable/stale lock, a canonical stage failure, an
# unreachable feed, or a missing/malformed manifest is an ERROR, never "coherent". So this workflow
# must never gain a `continue-on-error` or a conditional that lets the live job be skipped into green —
# "nothing to check" and "checked, and it's fine" must not share an exit code.
name: kit-published-coherence

on:
  pull_request:
    # DELIBERATELY UNFILTERED (.github#1597), and this is a change from the list that used to sit here.
    # That list named only this gate's OWN files, so a PR editing `.claude/skills/pnext-item/**` — a
    # `kit:` source, and the exact shape of `edc8404` — did not start this workflow at all. That is
    # .github#1606's defect inverted: the gate's subject was not in its trigger set.
    #
    # The repair cannot be "add the kit sources to this list": the list would be a RESTATEMENT of
    # `registry/repos.yml`'s `kit:` block, stale the day a new kit row lands, which is precisely what
    # #1597 AC2 forbids. YAML `paths:` cannot read another file. So the filter goes, `pr-arm` reads the
    # roster itself, and a PR touching no kit source exits 0 without reading the network.
    #
    # It also makes both PR jobs REPORTABLE ON EVERY PULL REQUEST, which is the only shape a required
    # context may have (.github#1508 / check-required-contexts): GitHub creates no check run at all for
    # a workflow its `paths:` filter excluded, so a path-filtered producer of a required context holds
    # every other PR at "Expected — waiting for status to be reported" forever. Neither job is required
    # today; this simply stops the filter from being the reason it could never become one.
  push:
    branches: [main]
    # DELIBERATELY UNFILTERED, like engine-pin-coherence. The verdict is a function of main's repos.lock
    # AND the feed, and both move without touching any one path: a kit-source bump changes repos.lock,
    # and a republish changes the feed while touching no file here. A paths filter would leave a red
    # standing for up to a day after the merge/publish that fixed it.
  schedule:
    # Daily, offset from feed-coherence (06:17), engine-freshness/pin-coherence (06:43) and
    # engine-pin-coherence (06:53) so the feed reads do not contend. This trigger catches a kit-source
    # bump nobody republished: it touches no file here, so no push can see it, and the published kit
    # grows stale in silence until something periodic reads the feed.
    - cron: "37 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kit-published-coherence-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Offline. Proves the gate reds on drift and fails-closed on every unreadable-subject condition
  # before we trust its green.
  fixture:
    name: fixture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Was a bare `actions/setup-python`, on the grounds that the fixture was pure stdlib. The
      # `pr-arm` legs (.github#1597) read `registry/repos.yml` — including the legs that prove a
      # MALFORMED roster is a no-verdict rather than an empty kit-source set — so the fixture now needs
      # the same pinned YAML dependency the live arms declare. Taking it from the shared action rather
      # than a second hand-rolled step is what `check-policy-checker-inventory` asserts: an unpinned
      # or hand-installed PyYAML is how a policy gate ends up depending on a runner-image accident.
      - uses: ./.github/actions/setup-policy-python
      - name: Run the kit-published-coherence fixture (no network)
        run: bash tests/kit-published-coherence/run.sh

  # PR-only. The AUTHORING obligation, asked while it can still be met (.github#1597): if this diff
  # edits a `kit:` source declared in registry/repos.yml, FS.GG.Kit.csproj <Version> must already be
  # ahead of the newest published kit on nuget.org. Not a substitute for `published` below — that one
  # observes the RELEASE; this one observes the PR.
  pr-arm:
    name: pr-arm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: fixture
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      # For the obligation arm below: `fsgg:delivery-obligation` declarations live in the PR's ISSUE
      # comments, so the arm's subject is an API read. Read-only, and a `pull_request` event from a
      # fork gets a read-only token anyway — nothing here writes.
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          # The subject is `git diff --name-only <base>...HEAD`, so the MERGE BASE has to resolve. The
          # default shallow fetch has no common ancestor with the base branch and the diff fails —
          # which this gate reports as a no-verdict RED, not a green, so a shallow checkout here would
          # be a self-inflicted permanent red rather than a silent pass.
          fetch-depth: 0
      # Reads registry/repos.yml with PyYAML, exactly as scripts/repos.sh validate does. Declare the
      # pinned dependency rather than inheriting a runner-image accident (the #1469 review lesson that
      # made the `published` job deterministically red on a clean runner).
      - uses: ./.github/actions/setup-policy-python
      - name: Does this PR edit the kit without getting ahead of the published one?
        run: |
          python scripts/check-kit-published-coherence.py --pr-arm \
            --base "refs/remotes/origin/${{ github.base_ref }}"

      # .github#2533. A DIFFERENT SUBJECT ON THE SAME PR: not the version this PR ships, but the
      # post-merge obligation its author declares for shipping it. `.github#2512` declared a manual
      # coherent-set release, had it reviewed by two independent critics across three rounds and
      # explicitly host-gated as the session's only irreversible act — and `kit-auto-publish.yml`
      # (`on: push: branches: [main]`) had cut all three tags 8 seconds after the merge. The
      # declaration looked like a control and was inert.
      #
      # It runs HERE rather than in its own workflow because the two arms share this file's question
      # — what does merging this PR oblige, and who performs it — and because a second workflow with
      # its own view of the release automation is how two gates end up disagreeing (#263).
      #
      # `!cancelled()` so a red from the version step above does not ABORT this one: a stale kit
      # version and a misdeclared obligation are independent defects with independent remedies, and
      # the first would otherwise mask the second for as long as it stands. It is NOT
      # `continue-on-error` — this step's own failure still reds the job.
      - name: Does this PR declare a post-merge obligation the merge itself performs?
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The subject is READ from the PR, never handed in as a literal: a step that typed its own
          # declarations would be measuring itself.
          COMMENTS_URL: repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments
        run: |
          gh api "$COMMENTS_URL" --paginate --jq '[.[] | {body}]' \
            | jq -s 'add // []' > pr-comments.json
          python scripts/check-kit-published-coherence.py --obligation-arm \
            --obligations pr-comments.json

  # Online. The actual coherence signal: newest published FS.GG.Kit against main's validated lock +
  # exact pack-time staged manifest (destinations, bytes, modes, and closed set).
  published:
    name: published
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: fixture
    # The live read is about main's repos.lock + the feed, not about a PR's diff (see the header). On a
    # PR the fixture above is the whole subject.
    if: github.event_name != 'pull_request'
    # No token: the kit is read anonymously from public nuget.org (ADR-0039 — where receivers restore
    # it), so the gate needs no feed credential.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      # The live path invokes scripts/repos.sh validate before staging canonical. That validator reads
      # registry/repos.yml with yq or PyYAML; declare the pinned dependency rather than inheriting a
      # runner-image accident. The fixture stays pure stdlib.
      - uses: ./.github/actions/setup-policy-python
      - name: Is the newest published FS.GG.Kit coherent with canonical?
        run: python scripts/check-kit-published-coherence.py

      # .github#1784, WIDENED TO EVERY RELEASE NAMESPACE BY .github#1790. `#1772` made
      # `kit/v<version>` the ref the receiver-side `materialize / kit-bump-shape` reporter resolves
      # its RULE from — so a release marker became a trust anchor. A tag is a MUTABLE ref and
      # `release-kit.yml`'s gate is publish-time only, so a tag deleted or force-moved AFTERWARDS
      # silently recreates the defect #1772 closed and nothing would notice.
      #
      # THIS STEP'S SUBJECT IS NOT THE KIT'S, and that is worth reading twice given the workflow it
      # sits in. `#1784` was 21-for-21 clean on `kit/v*` — it caught nothing on its own subject. The
      # same method applied to the four namespaces it did not reach found a real disagreement in each
      # of two of them (`coord-engine/v0.1.0`, `new-sdd-fullstack/v0.1.1-preview.1`) and a published
      # version with no tag at all (`drivers/v0.5.0`). The clean control is what made those findings
      # rather than noise. It runs here because it shares this file's feed reader and nuspec parse;
      # splitting it into its own gate is how two gates end up disagreeing about the feed (#263).
      #
      # It belongs on THIS job for the same reason everything else here does: the subject is the feed
      # plus a hub ref, and both move without any pull request touching a file. A `paths:` filter or a
      # PR-only arm could never see a tag someone moved by hand.
      #
      # The comparand is the published .nuspec's `<repository commit=...>`, not a list — see the
      # checker's docstring. A repository TAG RULESET ("release-tags-are-immutable", id 19899954 —
      # RENAMED from "kit-release-tags-are-immutable" by #1790 because it now covers refs/tags/kit/v*,
      # coord-engine/v*, drivers/v*, new-sdd-workspace/v* and new-sdd-fullstack/v*; rules: deletion +
      # non_fast_forward + update, no bypass actors, `creation` deliberately NOT a rule so releases
      # can still push tags) shuts the hole at the source; this is the detection that proves the
      # ruleset is still there and still doing its job, because a ruleset is itself a mutable setting
      # with no history in this repository.
      #
      # `if: ${{ !cancelled() }}` so a red from the staleness step above does not ABORT this one.
      # The two subjects are independent — a stale kit and a moved tag are different defects with
      # different remedies — and a stale kit is exactly the state most likely to coincide with
      # someone doing tag surgery. Without this, the first red masks the second for as long as it
      # stands. It is NOT `continue-on-error`: this step's own failure still reds the job.
      - name: Do the release tags still resolve to the commits their packages were packed from?
        if: ${{ !cancelled() }}
        run: python scripts/check-kit-published-coherence.py --tag-arm
