name: release-coord-engine

# Publishes FS.GG.Coord.Cli — the typed coordination engine (`fsgg-coord-engine`; ADR-0034) — to the
# org GitHub Packages feed. `.github` does not normally own a release workflow; this is the second
# exception, on the same grounds as the first (release-new-sdd-workspace.yml): the tool lives here, so
# its publish does too.
#
# THIS PUBLISH IS THE DISTRIBUTION PATH FOR THE ONLY IMPLEMENTATION, which is what makes it load-bearing.
#
# ADR-0040 Phase D.4 deleted the bash monolith and the shadow that compared against it. The engine is the
# sole implementation, and `scripts/fsgg-coord` is now a resolver shim that finds this very package via
# the receivers' `.config/dotnet-tools.json` and `exec`s it. So a receiver repo that cannot restore it has
# no coordination tool at all — there is no second engine to fall back to, and nothing to shadow with.
#
# What gated the cut-over was the DEFECT CORPUS, not a clock (ADR-0038). ADR-0034 §5 staged the flip
# behind "zero divergence across the LIVE FLEET for three consecutive days", and that clock could never
# tick: the shadow only ran where an engine existed, an engine only existed where someone had BUILT it
# (`.github`, and nowhere else), and distributing it was gated on the criterion it was needed to meet
# (.github#617). The corpus — `tests/coord-engine-parity/` and `tests/coord-engine-e2e/` — replaced it,
# and `shim.sh` re-running that corpus THROUGH the shim is how the swap was proven transparent.
#
# `.github` builds the engine FROM SOURCE and never restores it from the feed — the asymmetry ADR-0034
# §4.4 relies on. A broken feed therefore cannot prevent the coordination tool from being fixed.
#
# Version is the EVALUATED fsproj <Version> (msbuild -getProperty), never a grep and never a value
# pinned in this header. A tag is a COHERENCE CHECK against it, never the source of truth.
#
# Release by pushing a tag `coord-engine/v<version>` matching the fsproj <Version>. Manual dispatch is
# exact-source recovery from an existing prepared manifest.
#
# THIS RELEASE DOES NOT `repository_dispatch`, AND THAT PART IS DECIDED (.github#1776). This workflow
# does not call `dispatch-sender.yml`, and should not: no receiver has an `on: repository_dispatch`
# listener for an engine or kit release, so the POST would take a 204 from every target and change
# nothing; and Renovate — which does carry these releases — is the hosted Mend App, not a self-hosted
# runner, so a dispatch cannot make it re-scan in the first place.
#
# THAT IS A VERDICT ON THE MECHANISM, NOT ON THE GAP. The push half #1776 was filed about was real
# and missing: on 2026-07-29 FS.GG.Net sat behind an unticked `unlimit-branch=renovate/
# fs.gg.coord.cli-0.x` box on its own Dependency Dashboard while v0.15.0 was published. The mechanism
# that reaches it is that dashboard, not a dispatch, it is .github#1923, and the job below IS it.
#
# THE FULL RECORD — the measurement, both halves, what this can and cannot see, and the credential
# question — is in `release-kit.yml`'s header, stated ONCE there rather than copied here. Deciding
# differently means changing both files; nothing re-checks the listener premise, which is filed as
# .github#1919.

on:
  push:
    tags: ['coord-engine/v*']
  workflow_dispatch:
    inputs:
      source_sha:
        description: "Exact prepared source SHA for manifest-bound recovery"
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-coord-engine-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Pack & publish fsgg-coord-engine
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.repository == 'FS-GG/.github'
    # Least-privilege: only this job gains packages: write, and the push uses the run-scoped
    # GITHUB_TOKEN, never a PAT.
    permissions:
      contents: write     # durable per-package saga journal assets on the prepared draft release
      packages: write
      id-token: write      # ADR-0013: mint the GitHub OIDC token for nuget.org Trusted Publishing
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Resolve version and prepared source
        id: v
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref_name }}
          DISPATCH_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          proj=src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj
          version="$(dotnet msbuild "$proj" -getProperty:Version | tr -d '[:space:]')"
          if [ -z "$version" ]; then
            echo "::error::could not read <Version> from $proj (build defect); refusing to publish."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

          source_sha="$GITHUB_SHA"
          if [ "$EVENT" = workflow_dispatch ]; then
            [[ "$DISPATCH_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::manual publish recovery requires an exact 40-character lowercase source_sha."; exit 1; }
            source_sha="$DISPATCH_SOURCE_SHA"
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

          # A `-preview` engine would be INVISIBLE to the shared Renovate preset (ignoreUnstable: true),
          # so receivers would never be bumped — and Renovate-invisibility is one of the stated reasons
          # ADR-0034 §4.4 rejected the self-contained-binary option. Shipping a tool the update fabric
          # cannot see would defeat the point of shipping it, so refuse rather than ship it silently.
          case "$version" in
            *-*) echo "::error::version '$version' is a prerelease. The org's Renovate preset sets ignoreUnstable=true, so receivers would never see it. Publish a stable 0.x version."; exit 1 ;;
          esac

          # SIBLING-TAG PRECONDITION (.github#2409 DEC-004). coord-engine, FS.GG.Kit and FS.GG.Drivers
          # are a coherent set (.github#2402, $(FsggCoherentSetVersion)): their <Version> values can no
          # longer diverge, but before this the RELEASE EVENTS still could — nothing stopped a
          # maintainer tagging `coord-engine/v$version` alone. This closes that: refuse to publish
          # unless BOTH siblings' own tags, at this SAME version, already resolve to this SAME commit.
          # Push all three tags in one `git push` (kit/v$version, drivers/v$version,
          # coord-engine/v$version) — no new tag namespace, no renamed workflow, so nuget.org's
          # per-filename OIDC policy binding for THIS package — the one the entire fleet restores
          # `fsgg-coord` from — is untouched. See release-kit.yml's header for the full reasoning
          # (kept once there).
          check_sibling_tag() {
            local sibling_tag="$1"
            local tagged
            tagged="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" \
                        "refs/tags/$sibling_tag" "refs/tags/$sibling_tag^{}" \
                      | awk -v p="refs/tags/$sibling_tag^{}" -v b="refs/tags/$sibling_tag" \
                          '$2==p {peeled=$1} $2==b {plain=$1} END {print (length(peeled) ? peeled : plain)}')"
            if [ -z "$tagged" ]; then
              echo "::error::refusing to publish FS.GG.Coord.Cli $version: sibling tag $sibling_tag does not exist yet. coord-engine, FS.GG.Kit and FS.GG.Drivers are a coherent set (.github#2402) and release together (.github#2409) — push all three tags (kit/v$version, drivers/v$version, coord-engine/v$version) at the same commit."
              exit 1
            fi
            if [ "$tagged" != "$source_sha" ]; then
              echo "::error::refusing to publish FS.GG.Coord.Cli $version: sibling tag $sibling_tag points at $tagged, not the immutable prepared source ($source_sha). All three coherent-set tags must name the same commit."
              exit 1
            fi
          }
          check_sibling_tag "kit/v$version"
          check_sibling_tag "drivers/v$version"

          if [ "$EVENT" = "push" ]; then
            # The tag is a coherence check against the evaluated version, never the source of truth.
            tag_version="${REF#coord-engine/v}"
            if [ "$tag_version" != "$version" ]; then
              echo "::error::tag $REF ($tag_version) does not match fsproj <Version> ($version)."
              exit 1
            fi
          else
            check_sibling_tag "coord-engine/v$version"
          fi

      # #1762 — 0.13.0 moved Version and shipped 0.12.0's notes. Evaluate both properties through
      # MSBuild and refuse before restore/pack/push if the listing would announce another release.
      #
      # .github#2579 — the same checker now also refuses notes longer than nuget.org's 35,000
      # characters, for EVERY member of the coherent set, and reports each package's remaining
      # headroom in this job's log. THIS ARM IS THE BACKSTOP, NOT THE GATE: it runs after
      # `release-kit` and `release-drivers` have already been started by their own sibling tags, so
      # by the time it refuses, the siblings may have published — which is exactly how 0.52.0 left
      # FS.GG.Coord.Cli on the org feed and absent from nuget.org. The arm that actually prevents
      # that is the PR-time one in `engine-release-notes.yml`, whose filter selects every project
      # whose notes this scores. Keep both; this one is what makes an already-tagged tree fail
      # loudly rather than silently mis-publish.
      - name: Require PackageReleaseNotes to announce this version and fit nuget.org's limit
        run: python3 scripts/check-engine-release-notes.py

      - name: Restore (locked)
        run: dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode

      # THE ENGINE IS NEVER PUBLISHED UNTESTED. Its whole claim is that it encodes rules the org has
      # already paid for once; a publish that skipped them would be shipping the claim without the
      # evidence. The core suite IS the incident log.
      - name: Test — the incident log, and the wire contract
        run: |
          set -euo pipefail
          dotnet test tests/FS.GG.Coord.Core.Tests/FS.GG.Coord.Core.Tests.fsproj -c Release
          dotnet test tests/FS.GG.Coord.Cli.Tests/FS.GG.Coord.Cli.Tests.fsproj -c Release

      - name: Use the saga-prepared package
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p artifacts/packages
          gh release download "coherent-set/v$VERSION" --repo "$GITHUB_REPOSITORY" \
            --pattern "*.nupkg" --pattern release-manifest.json --dir artifacts/packages
          bash scripts/release-saga-ci.sh init FS.GG.Coord.Cli "$VERSION" "${{ steps.v.outputs.source_sha }}"

      # A TOOL THAT PACKS BUT DOES NOT RUN IS THE FAILURE MODE HERE — the payload is a private
      # ProjectReference (FS.GG.Coord.Core) plus FSharp.Core, and package creation succeeding says nothing
      # about whether the installed tool can actually resolve them. So install the real .nupkg into a
      # throwaway tool-path and drive it end to end, exactly as a receiver will.
      - name: Smoke — install the real package and DECIDE with it
        run: |
          set -euo pipefail
          # ABSOLUTE, and it has to be: a NuGet source path in a config file resolves RELATIVE TO THAT
          # FILE. This config lives in /tmp, so `./artifacts/packages` would resolve to
          # /tmp/artifacts/packages — which does not exist, and the install fails with a "not found in
          # NuGet feeds" that reads exactly like a broken package. Prepared-package smoke catches it
          # before any irreversible write.
          cat > /tmp/isolated.config <<CFG
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources><clear /><add key="local" value="${{ github.workspace }}/artifacts/packages" /></packageSources>
          </configuration>
          CFG
          dotnet tool install --tool-path /tmp/toolhome --configfile /tmp/isolated.config \
            FS.GG.Coord.Cli --version "${{ steps.v.outputs.version }}"

          cat > /tmp/snap.json <<'SNAP'
          { "schema": "fsgg.coord.snapshot/1", "allowBacklog": false, "items": [
            {"owner":"FS-GG","repo":".github","number":1,"status":"Ready","state":"OPEN","body":"Paths: src/A.fs"},
            {"owner":"FS-GG","repo":".github","number":2,"status":"Ready","state":"OPEN","body":"Paths: src/A.fs"} ] }
          SNAP

          out="$(/tmp/toolhome/fsgg-coord-engine decide < /tmp/snap.json)"
          printf '%s\n' "$out"
          route_verdict="$(printf '%s' "$out" | jq -r '.decisions[0].verdict')"
          if [ "$route_verdict" != "awaiting-delivery-route-decision" ]; then
            echo "::error title=the packaged tool does not enforce delivery routing::expected the source-free snapshot to refuse scheduling without an explicit current delivery-route receipt; got '$route_verdict'."
            exit 1
          fi
          echo "packaged engine: installed and fail-closed on the mandatory delivery-route boundary" >> "$GITHUB_STEP_SUMMARY"

      # RECORDED-BOARD REPLAY, BEFORE EVERY CUT (.github#2401 AC5). Same leg `coord-engine.yml` runs on
      # every PR, run here against the freshly-built engine one more time before it ships: a cut cannot
      # proceed on a projection whose recorded verdicts moved unexplained. Runs against the just-built
      # prepared Release package output, not the installed tool-path package, since it drives the raw
      # executable exactly as tests/coord-engine-e2e/run.sh already does in the PR gate.
      - name: Recorded-board replay — the engine reproduces facts it was actually asked, not invented ones
        run: bash tests/coord-engine-replay/run.sh

      - name: Resume manifest-bound org push and await the complete org set
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-saga-ci.sh github FS.GG.Coord.Cli "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.source_sha }}"

      # NUGET.ORG IS NOT A NICE-TO-HAVE HERE — IT IS THE ONLY ROAD INTO THE RECEIVERS.
      #
      # The org GitHub Packages feed requires AUTHENTICATION even to read, and only 1 of the 6 receiver
      # repos configures it as a NuGet source. The other five restore every FS.GG.* package they use
      # from PUBLIC NUGET.ORG — which is why they need no org-feed credential at all. So an engine that
      # exists only on the org feed cannot reach them: every receiver restores its own repo-root
      # `.config/dotnet-tools.json`, and five of them have no org-feed credential at all.
      #
      # And the receivers are the whole point. `scripts/fsgg-coord` resolves this package and `exec`s it,
      # so a receiver that cannot restore it has no coordination tool at all — not a slower one, none.
      # The fleet is those six repos.
      #
      # ADR-0012 dual-publish, ADR-0013 auth (Trusted Publishing OIDC — no stored key). Pushes the
      # BYTE-IDENTICAL org-feed .nupkg, no re-pack. Gated on `vars.NUGET_ORG_PUBLISH` so it stays
      # DORMANT — org-feed releases keep working — until an org-owner creates the policy. Without it,
      # NuGet/login fail-closes with a 401, which is the correct direction: never a silent no-op, never
      # a half-published set.
      #
      # ⚠ THE POLICY IS BOUND TO BOTH THIS WORKFLOW'S FILENAME AND THE PACKAGE ID. An org-owner must
      # create it for: Repository Owner `FS-GG` · Repository `.github` · Workflow file
      # `release-coord-engine.yml` · package `FS.GG.Coord.Cli` — and then set
      # `vars.NUGET_ORG_PUBLISH=true`. Renaming either afterwards invalidates the token exchange.
      # See .github#624.
      - name: Observe public feed before any push
        id: public
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-saga-ci.sh nuget-probe FS.GG.Coord.Cli "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.source_sha }}"

      - name: NuGet login (OIDC → short-lived key)
        if: steps.public.outputs.push == 'true'
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push byte-identical package to nuget.org
        if: steps.public.outputs.push == 'true'
        run: |
          dotnet nuget push "artifacts/packages/FS.GG.Coord.Cli.${{ steps.v.outputs.version }}.nupkg" \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.login.outputs.NUGET_API_KEY }}

      - name: Record externally served public package
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-saga-ci.sh nuget-record FS.GG.Coord.Cli "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.source_sha }}"

      - name: Persist failed release step for exact resume
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        # After promotion the journal asset is immutable. The shared adapter validates that exact
        # journal read-only, preserving reachability of the receiver dashboard step on replay
        # instead of attempting an asset clobber that GitHub rejects (.github#2820).
        run: bash scripts/release-saga-ci.sh failure FS.GG.Coord.Cli "${{ steps.v.outputs.version }}" "${{ steps.v.outputs.source_sha }}"

      # ─────────────────────────────────────────────────────────────────────────────────────────
      # THE PUSH HALF (.github#1923). The mechanism, the refusal of `repository_dispatch`, and what
      # this can and cannot see are recorded ONCE, in release-kit.yml's header. This is the same job
      # over a different package id, and it is deliberately not `continue-on-error`: a release that
      # reaches zero receivers must go RED (#1923 AC4, from #1776 AC4).
      - name: Mint the cross-repo token the push half writes with
        id: tick-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          # No `repositories:` — the subject set is the ROSTER, read by the script. See
          # dashboard-tick-selftest.yml for why a list here could only be a drifting second copy.
          owner: FS-GG
          permission-issues: write

      # The subject set is the SAME seven repos as the kit's, and that is not a copy-paste slip: each
      # receiver's own repo-root `.config/dotnet-tools.json` pins `fs.gg.coord.cli`. `.github`'s
      # `dist/dotnet/.config/dotnet-tools.json` is its canonical manifest only; ADR-0068 / .github#1615
      # stopped distributing it. Thus `receives: coordination-kit` + `kit-delivery: package` is exactly
      # who needs the release notification, while .github#2249 verifies their pins.
      - name: Tell every engine receiver the release exists
        env:
          DASHBOARD_TICK_TOKEN: ${{ steps.tick-token.outputs.token }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set +eu
          python3 scripts/dashboard-tick.py --package FS.GG.Coord.Cli --version "$VERSION" \
            --journal artifacts/packages/journal-FS.GG.Coord.Cli.json \
            --receipt-dir artifacts/receiver-receipts
          rc=$?
          set -eu
          # By EXIT CODE, never by prose (#335). Every non-zero is red; the arms differ so the
          # operator reads the right sentence. 2 = a receiver could not be GRADED; 3 = nothing was
          # ATTEMPTED at all. See release-kit.yml's copy for the full reasoning.
          case "$rc" in
            0) echo "delivery: every engine receiver was reached." >> "$GITHUB_STEP_SUMMARY" ;;
            2) echo "::error title=release-coord-engine: delivery not verified::At least one receiver could not be graded. The engine IS published; some receivers may not have been told. See the job log." ; exit 1 ;;
            3) echo "::error title=release-coord-engine: delivery never ran::scripts/dashboard-tick.py exited 3 — a permanent no-verdict (the roster would not read, or the credential was empty). NOTHING was attempted, so no receiver was told. The engine IS published." ; exit 1 ;;
            *) echo "::error title=release-coord-engine: the release told nobody, or a write was refused::scripts/dashboard-tick.py exited $rc. The engine IS published — this is a DELIVERY failure, not a publish failure." ; exit 1 ;;
          esac

      - name: Persist append-only receiver receipts outside immutable release assets
        uses: actions/upload-artifact@v6
        with:
          name: receiver-receipts-FS.GG.Coord.Cli-${{ steps.v.outputs.version }}
          path: artifacts/receiver-receipts/*.json
          if-no-files-found: error
          retention-days: 90
      # ─────────────────────────────────────────────────────────────────────────────────────────

      # `always()`: a DELIVERY failure above must not suppress the record that the package reached
      # the feeds. See release-kit.yml.
      - name: Summary
        if: always()
        run: |
          {
            echo "### fsgg-coord-engine ${{ steps.v.outputs.version }}"
            echo "Published the manifest-bound \`FS.GG.Coord.Cli\` **${{ steps.v.outputs.version }}** payload through the release saga."
          } >> "$GITHUB_STEP_SUMMARY"
