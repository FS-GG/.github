name: Done retention dry run for the Coordination board

# WHAT THIS IS (#5119)
# ====================
#
# The user limited Coordination Project 3 and its readers to 500 items. When Done holds more than 200 cards, every
# Done card older than the newest 200 (by close time) is archived. `scripts/coord-board-archive.py` plans that and,
# with --execute, archives with a preimage re-read, one send and a readback per card, keeping private custody.
#
# THIS WORKFLOW ONLY EVER RUNS A DRY RUN. It reports the board size against the 500-item limit, the Done count and
# the cards the policy would archive. A real run is a separate, owner-run invocation with the private enrollment
# binding and an exact project id. The schedule gains --execute only after Root accepts the first real run.
#
# WHY THE PREVIOUS WORKFLOW AT THIS PATH WAS RETIRED (Root, 2026-10-31)
# =====================================================================
#
# It swept Project 1, not the Coordination V2 board, with a 30-day / 100-visible policy that contradicts the user's
# rule. It failed every day since at least 2026-10-24, because its typed archive route is refused by the engine's
# v1 admission. That refusal was the only thing that stopped it from archiving 211 rows a day. Root disabled it
# (disabled_manually) before this replacement.

on:
  schedule:
    # Daily, off the hour. A dry run: it reads the board and sends nothing.
    - cron: '43 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coord-board-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # THE ENGINE IS BUILT HERE, NOT ASSUMED (Refs #4730). The project id is resolved through the typed
      # engine (`scripts/fsgg-coord graphql project-id`), which has no other build on a hosted runner;
      # `check-scheduled-engine-provisioning.py` refuses this job without the build.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build the typed coordination engine
        run: |
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # A dry run only reads the org-owned board, which `GITHUB_TOKEN` cannot; the App token carries
      # organization Projects read and nothing else.
      - name: Mint an installation token with Projects v2 read access
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          owner: FS-GG
          permission-organization-projects: read

      - name: Resolve the Coordination V2 project id
        id: project
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Resolved through the typed engine and passed to the archiver as the expected identity, so the
          # report can never describe the wrong board.
          id="$(scripts/fsgg-coord graphql project-id FS-GG 3 | jq -r '.id // empty')"
          case "$id" in
            PVT_*) ;;
            *) echo "::error::could not resolve the Coordination V2 project id (got '${id:-empty}')"; exit 1 ;;
          esac
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Plan Done retention (dry run, counts only)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          # Counts only: this is a public repository's log, and the board carries private-repository cards.
          python3 scripts/coord-board-archive.py --project 3 --expect-project-id '${{ steps.project.outputs.id }}' \
            --counts-only | tee "$RUNNER_TEMP/retention.log"
          {
            echo '### Coordination board Done retention (dry run)'
            echo
            echo '```'
            cat "$RUNNER_TEMP/retention.log"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
