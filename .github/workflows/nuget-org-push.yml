# Reusable public-nuget.org push (FS-GG/.github#103, ADR-0012 dual-publish).
#
# A producer repo's release workflow calls this via `workflow_call` AFTER it has pushed the
# coherent set to the org GitHub Packages feed and all publish gates are green (ADR-0012 §4:
# gated ordering — org feed first, then the identical .nupkg to nuget.org). It pushes the
# BYTE-IDENTICAL .nupkg files (the same artifact that passed ApiCompat / the G1–G7
# reference-gate-set guard — ADR-0012 §3, no re-pack) to https://api.nuget.org/v3/index.json
# with `--skip-duplicate` so a retry is idempotent and a partial coherent set can be
# completed without corrupting the org feed (which stays authoritative — ADR-0012 §1/§4).
#
# The .nupkg files are supplied as an uploaded ARTIFACT (the producer's pack job uploads it;
# workflow_call runs as its own job, so the files must cross the job boundary). This is the
# code half of the ADR-0012 §6 "forward-guardrail": it FAILS CLOSED when the org secret
# NUGET_ORG_API_KEY is absent, pointing at ADR-0012 / #103 — never a silent no-op, never a
# half-published coherent set. The org secret + the reserved `FS.GG.` ID prefix + the FS-GG
# nuget.org org are provisioned by org-admin in FS-GG/.github#103 (BLOCKS this at runtime).
# This workflow is authored ahead of that so a producer just wires the `uses:` call and the
# admin just sets one org secret — it stays dormant and fails closed until the secret exists.
name: nuget-org-push

on:
  workflow_call:
    inputs:
      artifact-name:
        description: "Name of the uploaded artifact holding the byte-identical .nupkg set already pushed to the org feed + gated."
        type: string
        required: true
      package-glob:
        description: "Glob (relative to the downloaded artifact root) selecting the .nupkg files to push."
        type: string
        default: "**/*.nupkg"
      nuget-source:
        description: "Target feed. Defaults to public nuget.org; overridable for testing."
        type: string
        default: "https://api.nuget.org/v3/index.json"
      dotnet-version:
        description: "SDK used to run `dotnet nuget push` (the push itself is SDK-version agnostic)."
        type: string
        default: "10.0.x"
    secrets:
      nuget-org-api-key:
        description: "Push key for the reserved `FS.GG.` prefix on nuget.org (org secret NUGET_ORG_API_KEY; provisioned by .github#103)."
        required: true

permissions:
  contents: read   # the nuget.org API key — not GITHUB_TOKEN — authenticates the push.

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Preflight — nuget.org push key present (fail closed, ADR-0012 §6)
        shell: bash
        env:
          NUGET_ORG_API_KEY: ${{ secrets.nuget-org-api-key }}
        run: |
          set -euo pipefail
          if [[ -z "${NUGET_ORG_API_KEY}" ]]; then
            echo "::error::nuget-org-push: the org secret NUGET_ORG_API_KEY is not set." >&2
            echo "::error::It is provisioned by org-admin in FS-GG/.github#103 (nuget.org org + reserved FS.GG. prefix + push key), per ADR-0012 §6. Until then this push is dormant and fails closed." >&2
            exit 1
          fi

      - name: Download the gated .nupkg artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: nupkgs

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Push the byte-identical set to nuget.org (--skip-duplicate)
        shell: bash
        env:
          NUGET_ORG_API_KEY: ${{ secrets.nuget-org-api-key }}
          NUGET_SOURCE: ${{ inputs.nuget-source }}
          PACKAGE_GLOB: ${{ inputs.package-glob }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          cd nupkgs
          # nullglob → the array is EMPTY (not a literal glob) when nothing matches.
          pkgs=( ${PACKAGE_GLOB} )
          if [[ ${#pkgs[@]} -eq 0 ]]; then
            # A matched-nothing push would silently ship an empty coherent set — fail loud instead
            # (the caller's artifact/glob is wrong, or the pack job produced nothing).
            echo "::error::nuget-org-push: no .nupkg matched '${PACKAGE_GLOB}' in artifact '${{ inputs.artifact-name }}'." >&2
            exit 1
          fi
          echo "Pushing ${#pkgs[@]} package(s) to ${NUGET_SOURCE}:"
          printf '  %s\n' "${pkgs[@]}"
          for pkg in "${pkgs[@]}"; do
            dotnet nuget push "$pkg" \
              --source "${NUGET_SOURCE}" \
              --api-key "${NUGET_ORG_API_KEY}" \
              --skip-duplicate
          done
          echo "nuget.org push complete (${#pkgs[@]} package(s), --skip-duplicate)."
