# GS2-08.9 retirement boundary. The check still reads the PR and linked issue and publishes its
# verdict in the job log/summary. The former sticky-comment mutation has been removed.
name: touch-set-drift (read-only)

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: touch-set-drift-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build the read-only coordination client
        run: |
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release
      - name: Check the PR against its declared touch set
        env:
          GH_TOKEN: ${{ github.token }}
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
          PR: ${{ github.event.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          bash scripts/fsgg-coord verify-paths --pr "$PR" --repo "$REPO" --warn | tee drift.txt
          grep -Eq 'FSGG-PATHS (DRIFT|INVALID|OK|SKIP)' drift.txt
          { echo '### Touch-set drift'; echo; echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
