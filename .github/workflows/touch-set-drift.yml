# Advisory touch-set drift check (ADR-0027 §8, over ADR-0021's `Paths:` declaration).
#
# A parallelizable item declares the file subtrees it intends to touch as a `Paths:` line in its issue
# body, and `fsgg-coord batch` schedules items whose declarations are DISJOINT. That guarantee is only
# as good as the declaration: a PR that quietly edits outside its touch-set is exactly how two items
# the scheduler called "safe to run in parallel" end up as a merge conflict.
#
# This reports that drift. The drift VERDICT does NOT block. ADR-0021 is explicit that the touch-set is
# "a declaration, not an enforced boundary", and ADR-0027 keeps it that way — late-discovered work is
# legitimate; silently *unannounced* late-discovered work is the problem. The remedy the comment points
# at is `fsgg-coord widen`, which re-declares, re-checks against every live claim, and notifies the
# workers it now collides with.
#
# Being unable to REACH a verdict is a different thing, and it fails the job (.github#318). "The
# touch-set was checked and is fine" and "the touch-set was never checked" are not the same green.
#
# Scope: PRs whose head branch is `item/<n>-…` (the ADR-0021 isolation branch) or which close an issue.
# Anything else has no touch-set to verify and exits clean.
#
# Fork PRs: `pull_request` grants a read-only token to forks, so the comment step is best-effort and
# `continue-on-error`. We deliberately do NOT use `pull_request_target` — running against the base with
# a write token on untrusted head code is not worth an advisory comment.
name: touch-set-drift

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # ADR-0040 Phase C/D. This is the ONE workflow in the org that EXECUTES the coordination client on
      # a CI runner — `bash scripts/fsgg-coord verify-paths`, below. Every other `fsgg-coord` reference in
      # CI is a comment, a path filter, or `coordination-sync` byte-COPYING the client (never running it).
      # The D.2 swap cut `scripts/fsgg-coord` to the §4.4 shim that execs a compiled `fsgg-coord-engine`,
      # so THIS is the runner that would otherwise break — and it is the whole of the C2 rollout, not the
      # ten-workflows-across-six-receivers the ADR assumed.
      #
      # `setup-dotnet` landed FIRST under C2 (before the shim, not with it) so the swap did not also have to
      # touch runner setup. With the shim now in place, this job BUILDS the engine from source (.github never
      # restores it from the feed, ADR-0034 §4.3) and hands the shim its path via `FSGG_COORD_ENGINE_BIN`
      # (tier 1) — the same wiring the corpus/e2e gates use, so `verify-paths` resolves an engine here rather
      # than dying #266-loud on a runner with no built binary.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build the engine (the shim execs it, ADR-0040 D.2)
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      - name: Check the PR against its issue's declared touch-set
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FSGG_COORD_ENGINE_BIN: ${{ github.workspace }}/src/FS.GG.Coord.Cli/bin/Release/net10.0/fsgg-coord-engine
        run: |
          set -euo pipefail
          # --warn: report drift, exit 0. The gate is advisory by decision, not by accident. Under
          # --warn EVERY verdict exits 0, so rc does not carry one: a non-zero rc means verify-paths
          # never reached a verdict at all (gh auth, a rate-limited or 5xx API, absent jq/python3, a
          # crash in fsgg-coord). Keep the rc instead of `|| true`-ing it away.
          rc=0
          bash scripts/fsgg-coord verify-paths \
            --pr "${{ github.event.number }}" \
            --repo "${{ github.repository }}" \
            --warn > drift.txt 2>&1 || rc=$?
          cat drift.txt
          # Record the output BEFORE classifying, so a fail-closed exit below still leaves the stack
          # trace or HTTP error in the summary — that text is the whole diagnostic.
          { echo '### Touch-set drift'; echo; echo '```'; cat drift.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

          # "I could not compute a verdict" is not "the verdict is: nothing to check" (.github#318,
          # the same asymmetry #315 fixed in coordination-sync's roster gate). Both used to land in
          # the `skip` bucket, which DELETES the sticky comment and passes green — so a transient 502
          # across a busy merge window left the scheduler's disjointness guarantee unenforced on every
          # concurrent PR, with nothing red and nothing commented to say so.
          if [ "$rc" -ne 0 ]; then
            echo "::error::verify-paths exited $rc without reaching a verdict — this PR's touch-set was NOT checked."
            exit 1
          fi

          # Four verdicts, each matched EXPLICITLY — nothing falls through to a default. SKIP (no
          # linked issue, or no declaration) must not read as a clean pass, and neither must INVALID
          # (.github#273: the issue declared a `Paths:` token that can never match a file, so it
          # reserved nothing and `batch` cleared the item against everything). An rc-0 run that
          # printed no `FSGG-PATHS *` marker did not check anything either: fail closed.
          if   grep -q 'FSGG-PATHS DRIFT'   drift.txt; then verdict=drift
          elif grep -q 'FSGG-PATHS INVALID' drift.txt; then verdict=invalid
          elif grep -q 'FSGG-PATHS OK'      drift.txt; then verdict=ok
          elif grep -q 'FSGG-PATHS SKIP'    drift.txt; then verdict=skip
          else
            echo "::error::verify-paths exited 0 but printed no FSGG-PATHS verdict — this PR's touch-set was NOT checked."
            exit 1
          fi
          echo "verdict=$verdict" >> "$GITHUB_OUTPUT"

      # One sticky comment, addressed by its MARKER. `gh pr comment --edit-last` picks the actor's most
      # recent comment regardless of what it says, so in a repo where another GITHUB_TOKEN workflow also
      # comments (coverage, build) it would overwrite that bot's comment — and be overwritten in turn.
      # We find our own comment by the `fsgg:touch-set-drift` marker and PATCH exactly that one.
      #
      # This step runs on EVERY verdict, including `skip`: a PR that drifted and then had its `Paths:`
      # declaration removed must not keep a stale ⚠️ asserting a violation of a declaration that no
      # longer exists. `skip` deletes the comment rather than leaving it to rot.
      #
      # It does NOT run when the check step above fails closed — no `if:`, so `success()` is implied,
      # and that is load-bearing. An uncomputable verdict must never reach the deletion path: keeping
      # a previous ⚠️ we can no longer re-verify beats erasing it on the strength of a 502.
      - name: Comment the verdict
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERDICT: ${{ steps.check.outputs.verdict }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.number }}
        run: |
          set -euo pipefail
          MARKER='<!-- fsgg:touch-set-drift -->'

          # No `gh | head`: under `pipefail` a closed pipe would fail the step. Collect, then take the
          # first line from a shell builtin instead.
          matches="$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
                       --jq '.[] | select(.body | startswith("'"$MARKER"'")) | .id')"
          existing="${matches%%$'\n'*}"

          if [ "$VERDICT" = "skip" ]; then
            [ -n "$existing" ] && gh api -X DELETE "repos/$REPO/issues/comments/$existing" >/dev/null \
              && echo "healed: removed a stale touch-set comment (no declaration to check)."
            exit 0
          fi

          if [ "$VERDICT" = "drift" ]; then
            {
              printf '%s\n' "$MARKER"
              printf '⚠️ **This PR changes files outside the touch-set its issue declared.**\n\n'
              printf 'The scheduler (`fsgg-coord batch`) used that declaration to decide this item could run\n'
              printf 'in parallel with others. Files outside it were never checked for overlap.\n\n'
              printf '```\n'; cat drift.txt; printf '```\n\n'
              printf 'Re-declare and re-check against everything in flight (this also notifies any worker it\n'
              printf 'now collides with):\n\n```sh\nfsgg-coord widen <issue> --paths "<paths>"\n```\n\n'
              printf '_Advisory — this check never blocks a merge (ADR-0021: the touch-set is a declaration,\n'
              printf 'not an enforced boundary)._\n'
            } > comment.md
          elif [ "$VERDICT" = "invalid" ]; then
            # An unmatchable declaration is WORSE than drift: drift means the touch-set was checked and
            # exceeded, INVALID means it never reserved anything, so `batch` cleared this item against
            # every other. Never render it with the ✅ branch below.
            {
              printf '%s\n' "$MARKER"
              printf '⛔ **This PR'"'"'s issue declares a `Paths:` touch-set that can never match a file.**\n\n'
              printf 'A token that matches nothing conflicts with nothing, so the scheduler\n'
              printf '(`fsgg-coord batch`) read this item as **disjoint from everything** and may have run it\n'
              printf 'in parallel with work touching the very same files (.github#273).\n\n'
              printf '```\n'; cat drift.txt; printf '```\n\n'
              printf 'Re-declare with exact paths / directory prefixes:\n\n```sh\nfsgg-coord widen <issue> --paths "<paths>"\n```\n\n'
              printf '_Advisory — this check never blocks a merge (ADR-0021: the touch-set is a declaration,\n'
              printf 'not an enforced boundary)._\n'
            } > comment.md
          else
            { printf '%s\n' "$MARKER"
              printf '✅ This PR stays inside the touch-set its issue declared.\n'; } > comment.md
          fi

          if [ -n "$existing" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$existing" -F body=@comment.md >/dev/null
          else
            gh api -X POST "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
