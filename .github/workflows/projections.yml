# The protocol is stated ONCE, and every document that repeats it is GENERATED (ADR-0034 §4.5).
#
# A coordination rule used to live in up to six places — the ADR, the canonical doc, the tool, and four
# `SKILL.md` bodies across two skill roots — then content-addressed into `repos.lock` and byte-copied
# into six receivers: 54 vendored copies. The propagation edge cost a second issue and a second PR every
# time (#309 → #502, #481 → #531), and the collision attractor was removed BY HAND twice (#532, #551)
# before #570 gated it.
#
# `fsgg-coord` was ALREADY the model — it just was not the SOURCE. So the rules now live in
# `FS.GG.Coord.Core/Protocol.fs`, the prose is emitted from them, and this gate fails on any drift. A
# rule cannot land in one tier and not the others, because there are no tiers.
#
# Until ADR-0040 D.4 there was a SECOND copy of the touch-set grammar — bash's `TOUCHSET_GRAMMAR` — and this
# gate asserted it agreed with the engine's. D.4 deleted the bash monolith, so the grammar now has one home
# (`FS.GG.Coord.Core/Protocol.fs`) and there is nothing to cross-check it against.
name: projections

on:
  pull_request:
    paths:
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "scripts/generate-projections"
      - "docs/coordination/parallel-work.md"
      - "docs/architecture.md"
      - "registry/dependencies.yml"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/workflows/projections.yml"
  push:
    branches: [main]
    paths:
      - "src/FS.GG.Coord.Core/**"
      - "src/FS.GG.Coord.Cli/**"
      - "scripts/generate-projections"
      - "docs/coordination/parallel-work.md"
      - "docs/architecture.md"
      - "registry/dependencies.yml"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".github/workflows/projections.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: projections-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # From SOURCE, never the feed (ADR-0034 §4.3): fixing coord would otherwise require publishing,
      # and publishing would require coord to schedule the fix.
      - name: Build the engine
        run: |
          set -euo pipefail
          dotnet restore src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --locked-mode
          dotnet build src/FS.GG.Coord.Cli/FS.GG.Coord.Cli.fsproj --no-restore -c Release

      # The `versions` region is emitted from registry/dependencies.yml, so the generator reads YAML.
      # Without this the generator dies on `import yaml` — loudly, and before it renders anything.
      - name: Install PyYAML
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Every projection is current
        run: bash scripts/generate-projections --check

      # A GATE THAT CANNOT FAIL IS NOT A GATE (#266, #436). If the region markers were deleted, the
      # regenerator would have nothing to compare and would pass over a document that is now, once again,
      # a hand-maintained copy of the protocol. Assert the regions are actually there.
      #
      # WHICH documents comes from `--list`, so the generator and this gate cannot disagree about the
      # target set. HOW MANY is hardcoded HERE and nowhere else, deliberately: a count derived from the
      # same list it checks would be satisfied by deleting a target — the vacuity this step exists to
      # refuse. Adding a projection is meant to cost this line.
      - name: Non-vacuity — the generated regions exist
        run: |
          set -euo pipefail
          # 8 → 10: `filing-rules` in both cross-repo-coordination roots (#889).
          expected=10

          list="$(bash scripts/generate-projections --list)"
          n="$(printf '%s\n' "$list" | grep -c .)"
          echo "declared projection regions:"
          printf '%s\n' "$list"

          [ "$n" -eq "$expected" ] || {
            echo "::error::expected $expected declared projection regions, found $n — if you added or removed one, say so by editing 'expected' in this gate"
            exit 1
          }

          # Every DECLARED region is actually PRESENT in its document. `--check` alone cannot catch a
          # deleted marker pair on a target it no longer knows about.
          #
          # THE MARKER COMES FROM `--list`, not from a case statement here. This gate used to re-derive
          # it — a second copy of a mapping the generator already owns, which is the exact drift this
          # whole fabric refuses. It survived two kinds agreeing by luck; the third would not have
          # (#913's `versions` region is `fsgg-versions`, NOT `fsgg-protocol:versions`, because it is
          # emitted from the registry rather than the engine). The generator states the marker once.
          while IFS="$(printf '\t')" read -r kind path marker; do
            [ -n "$kind" ] || continue

            # THE MARKER MUST BE NON-EMPTY, AND THIS LINE IS NOT DEFENSIVE PROGRAMMING. Taking the
            # marker from `--list` means taking it from INPUT, and `grep -qxF ''` matches any blank
            # line — so a `--list` that ever emitted a short row would make this gate pass VACUOUSLY
            # on a document carrying no region at all. That is the exact #266 failure this gate was
            # built to refuse, and the case statement that used to live here could not express it
            # (it built the marker locally, so it was never empty). Trusting a source means checking it.
            [ -n "$path" ] && [ -n "$marker" ] || {
              echo "::error::generate-projections --list emitted a malformed row for kind '$kind' (path='$path', marker='$marker') — refusing to check a region against an empty pattern"
              exit 1
            }

            grep -qxF "$marker" "$path" || {
              echo "::error::$path carries no '$kind' region — nothing holds it in step with its source any more, so it is a hand-maintained copy again (run scripts/generate-projections, which names the source for that kind)"
              exit 1
            }
          done <<< "$list"

          echo "all $n projection regions present."
