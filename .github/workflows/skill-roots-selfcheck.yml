# Dogfood the skill-union assertion on THIS repo's own agent-skill roots (review M10, #132).
#
# skill-union-selftest.yml proves scripts/skill-union-assert.sh works (synthetic fixtures);
# this proves *this* repo actually holds the byte-identical union it preaches. ADR-0065 extends the
# root invariant to kit consumers — TWO roots since ADR-0067 §5 (.github#1636) retired `.codex/skills`,
# which is Codex's other native root and only ever produced a duplicate catalog entry. So this repo
# declares `.claude/.agents` and runs the BARE
# command with no --roots. That is deliberate (.github#517): the command CI runs is now character-
# for-character the command a worker runs before pushing a kit edit, so this gate can never again be
# green on a root set the worker's local run doesn't check.
# Until this gate existed, root identity held by manual discipline.
name: skill-roots-selfcheck

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agent-skill-roots"
      - "registry/repos.yml"
      - "registry/driver-skill-manifest.json"
      - "registry/coordination-kit-skill-manifest.json"
      - "scripts/skill-union-assert.sh"
      - "scripts/generate-driver-manifest"
      - "tests/skill-registry/catalog-triggers.json"
      - ".github/workflows/skill-roots-selfcheck.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agent-skill-roots"
      - "registry/repos.yml"
      - "registry/driver-skill-manifest.json"
      - "registry/coordination-kit-skill-manifest.json"
      - "scripts/skill-union-assert.sh"
      - "scripts/generate-driver-manifest"
      - "tests/skill-registry/catalog-triggers.json"
      - ".github/workflows/skill-roots-selfcheck.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: skill-roots-selfcheck-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  roots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate routing metadata and catalog budget
        run: python3 scripts/generate-driver-manifest --catalog-report
      # No --roots, no --product: exactly what a worker types. The roots come from .agent-skill-roots.
      - name: Assert own skill roots are the byte-identical union
        run: bash scripts/skill-union-assert.sh
