# Dogfood the skill-union assertion on THIS repo's own agent-skill roots (review M10, #132).
#
# skill-union-selftest.yml proves scripts/skill-union-assert.sh works (synthetic fixtures);
# this proves *this* repo actually holds the byte-identical union it preaches. .codex/skills
# doesn't exist here (ADR-0011/0014 scope the three-root invariant to scaffolded products) — this
# repo's two roots are declared in `.agent-skill-roots`, which the script reads, so we run the BARE
# command with no --roots. That is deliberate (.github#517): the command CI runs is now character-
# for-character the command a worker runs before pushing a kit edit, so this gate can never again be
# green on a root set the worker's local run doesn't check.
# Until this gate existed, .claude/skills ≡ .agents/skills held by manual discipline.
name: skill-roots-selfcheck

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agent-skill-roots"
      - "scripts/skill-union-assert.sh"
      - ".github/workflows/skill-roots-selfcheck.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - ".agents/skills/**"
      - ".agent-skill-roots"
      - "scripts/skill-union-assert.sh"
      - ".github/workflows/skill-roots-selfcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No --roots, no --product: exactly what a worker types. The roots come from .agent-skill-roots.
      - name: Assert own skill roots are the byte-identical union
        run: bash scripts/skill-union-assert.sh
