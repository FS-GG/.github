# Dogfood the skill-union assertion on THIS repo's own agent-skill roots (review M10, #132).
#
# skill-union-selftest.yml proves scripts/skill-union-assert.sh works (synthetic fixtures);
# this proves *this* repo actually holds the byte-identical union it preaches. ADR-0065 extends the
# three-root invariant to kit consumers, so this repo declares `.claude/.codex/.agents` and runs the BARE
# command with no --roots. That is deliberate (.github#517): the command CI runs is now character-
# for-character the command a worker runs before pushing a kit edit, so this gate can never again be
# green on a root set the worker's local run doesn't check.
# Until this gate existed, root identity held by manual discipline.
name: skill-roots-selfcheck

on:
  pull_request:
    paths:
      - ".claude/skills/**"
      - ".codex/skills/**"
      - ".agents/skills/**"
      - ".agent-skill-roots"
      - "scripts/skill-union-assert.sh"
      - "scripts/generate-driver-manifest"
      - "tests/skill-registry/catalog-triggers.json"
      - ".github/workflows/skill-roots-selfcheck.yml"
  push:
    branches: [main]
    paths:
      - ".claude/skills/**"
      - ".codex/skills/**"
      - ".agents/skills/**"
      - ".agent-skill-roots"
      - "scripts/skill-union-assert.sh"
      - "scripts/generate-driver-manifest"
      - "tests/skill-registry/catalog-triggers.json"
      - ".github/workflows/skill-roots-selfcheck.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roots:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Validate routing metadata and catalog budget
        run: python3 scripts/generate-driver-manifest --catalog-report
      # No --roots, no --product: exactly what a worker types. The roots come from .agent-skill-roots.
      - name: Assert own skill roots are the byte-identical union
        run: bash scripts/skill-union-assert.sh
