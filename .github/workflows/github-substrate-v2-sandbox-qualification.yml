name: GitHub substrate v2 sandbox qualification

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-hex FS.GG.Coordination commit to qualify
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Shared by every workflow that writes the registered Q4 / GS2-09.7 sandbox.
  # Keep this fixed across candidate revisions and workflow names.
  group: github-substrate-v2-registered-sandbox
  queue: max
  cancel-in-progress: false

jobs:
  qualify:
    name: gs2-04-9-live-sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: github-substrate-v2-sandbox
    env:
      FSGG_PROTECTED_SHA: ${{ github.sha }}
      FSGG_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
      FSGG_SANDBOX_ACTOR: fs-gg-cross-repo-dispatch[bot]
      FSGG_SANDBOX_ACTOR_ID: '297630107'
      FSGG_SANDBOX_OWNER: FS-GG
      FSGG_SANDBOX_REPOSITORY: FS.GG.GitHub.Substrate.Sandbox
      FSGG_SANDBOX_REPOSITORY_NODE_ID: R_kgDOUKXpqQ
      FSGG_SANDBOX_PROJECT_NUMBER: '2'
      FSGG_SANDBOX_PROJECT_NODE_ID: PVT_kwDOEYAWY84BiESo
      FSGG_SANDBOX_PURPOSE: fsgg-sandbox-gs2-04-9
      FSGG_SANDBOX_MODE: live
      FSGG_SANDBOX_RUN_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}-${{ inputs.candidate_sha }}
      FSGG_SANDBOX_EVIDENCE_DIR: /tmp/fsgg-${{ github.run_id }}-${{ github.run_attempt }}-sandbox
    steps:
      - name: Validate the exact candidate input
        shell: bash
        run: |
          set -euo pipefail
          test '${{ github.ref }}' = refs/heads/main
          [[ "$FSGG_CANDIDATE_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo 'candidate_sha must be one full lowercase 40-hex Git commit' >&2
            exit 1
          }

      - name: Check out the protected mint implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          path: host

      - name: Bind the protected mint revision
        shell: bash
        run: test "$(git -C host rev-parse HEAD)" = "$FSGG_PROTECTED_SHA"

      - name: Check out the exact product candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: FS-GG/FS.GG.Coordination
          ref: ${{ inputs.candidate_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: coordination

      - name: Prove the checked-out object
        shell: bash
        run: test "$(git -C coordination rev-parse HEAD)" = "$FSGG_CANDIDATE_SHA"

      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: coordination/global.json

      - name: Exercise secret-free mint grant controls
        run: python3 host/tests/gs2-09-7-mint-proof/run.py

      - name: Mint and attest the exact sandbox App grant
        id: mint
        env:
          FSGG_DISPATCH_APP_ID: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          FSGG_DISPATCH_APP_PRIVATE_KEY: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
        run: python3 host/scripts/gs2-09-7-mint-sandbox-token.py

      - name: Authoritatively bind the App and sandbox targets before writes
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FSGG_SANDBOX_EVIDENCE_DIR"
          viewer="$(gh api graphql -f query='{viewer{login id databaseId}}' --jq '.data.viewer')"
          repository="$(gh api "repos/$FSGG_SANDBOX_OWNER/$FSGG_SANDBOX_REPOSITORY")"
          project="$(gh api graphql -f query='query($owner:String!,$number:Int!){organization(login:$owner){projectV2(number:$number){id title closed public}}}' -F owner="$FSGG_SANDBOX_OWNER" -F number="$FSGG_SANDBOX_PROJECT_NUMBER" --jq '.data.organization.projectV2')"

          jq -n --argjson viewer "$viewer" --argjson repository "$repository" --argjson project "$project" \
            --arg candidate "$FSGG_CANDIDATE_SHA" --arg nonce "$FSGG_SANDBOX_RUN_NONCE" \
            '{schema:"fsgg.github-substrate-v2.sandbox-preflight/1",candidateSha:$candidate,runNonce:$nonce,viewer:$viewer,repository:{node_id:$repository.node_id,full_name:$repository.full_name,private:$repository.private,description:$repository.description},project:$project}' \
            > "$FSGG_SANDBOX_EVIDENCE_DIR/preflight.json"

          # Retain the authoritative observations before any mismatch exits.
          # Every assertion remains before the product harness receives a token.
          test "$(jq -r .login <<<"$viewer")" = "$FSGG_SANDBOX_ACTOR"
          test "$(jq -r .databaseId <<<"$viewer")" = "$FSGG_SANDBOX_ACTOR_ID"
          test "$(jq -r .node_id <<<"$repository")" = "$FSGG_SANDBOX_REPOSITORY_NODE_ID"
          test "$(jq -r .private <<<"$repository")" = true
          test "$(jq -r .description <<<"$repository")" = 'fsgg-sandbox-gs2-04-9 disposable qualification target; never production'
          test "$(jq -r .id <<<"$project")" = "$FSGG_SANDBOX_PROJECT_NODE_ID"
          test "$(jq -r .title <<<"$project")" = "$FSGG_SANDBOX_PURPOSE"
          test "$(jq -r .closed <<<"$project")" = false
          test "$(jq -r .public <<<"$project")" = false
          proof="$FSGG_SANDBOX_EVIDENCE_DIR/mint-grants.json"
          test -s "$proof"
          test "$(printf '%s' "$GH_TOKEN" | sha256sum | cut -d' ' -f1)" = "$(jq -r .tokenSha256 "$proof")"
          test "$(jq -r .repository.nodeId "$proof")" = "$FSGG_SANDBOX_REPOSITORY_NODE_ID"
          test "$(jq -r .permissions.organization_projects "$proof")" = write

      - name: Execute the signed live operation plan
        id: execute
        continue-on-error: true
        env:
          FSGG_SANDBOX_TOKEN: ${{ steps.mint.outputs.token }}
          FSGG_SANDBOX_MINT_PROOF: ${{ env.FSGG_SANDBOX_EVIDENCE_DIR }}/mint-grants.json
          FSGG_SANDBOX_PHASE: execute
        working-directory: coordination
        shell: bash
        run: bash eng/qualify-github-sandbox-closure.sh .

      - name: Compensate and authoritatively verify cleanup
        id: cleanup
        if: ${{ always() }}
        continue-on-error: true
        env:
          FSGG_SANDBOX_TOKEN: ${{ steps.mint.outputs.token }}
          FSGG_SANDBOX_MINT_PROOF: ${{ env.FSGG_SANDBOX_EVIDENCE_DIR }}/mint-grants.json
          FSGG_SANDBOX_PHASE: cleanup
        working-directory: coordination
        shell: bash
        run: bash eng/qualify-github-sandbox-closure.sh .

      - name: Revoke the scoped token
        id: revoke
        if: ${{ always() && steps.mint.outputs.token != '' }}
        env:
          GH_TOKEN: ${{ steps.mint.outputs.token }}
        run: gh api --method DELETE installation/token

      - name: Retain exact-candidate Q4 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: gs2-04-9-${{ inputs.candidate_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.FSGG_SANDBOX_EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 90

      - name: Preserve execution and cleanup verdicts
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.execute.outcome }}' = success
          test '${{ steps.cleanup.outcome }}' = success
          test '${{ steps.revoke.outcome }}' = success
          test -s "$FSGG_SANDBOX_EVIDENCE_DIR/closure.json"
          test "$(jq -r .cleanup.disposition "$FSGG_SANDBOX_EVIDENCE_DIR/closure.json")" = complete
