name: provisioned-podman-source
on:
  pull_request:
    paths:
      - 'deployment/provisioned-podman/**'
      - 'tests/provisioned-podman/**'
      - '.github/workflows/provisioned-podman-source.yml'
  push:
    branches: [main]
    paths:
      - 'deployment/provisioned-podman/**'
      - 'tests/provisioned-podman/**'
      - '.github/workflows/provisioned-podman-source.yml'
permissions:
  contents: read
# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: provisioned-podman-source-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Check the common-base source and actual pretransaction guards
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python3 tests/provisioned-podman/test_source_contract.py
