name: work-programme
# Preserve the existing native check identity; execute the canonical coordinator controls.
on:
  pull_request:
    paths:
      - '.agents/skills/work-board/**'
      - '.claude/skills/work-board/**'
      - '.agents/skills/work-programme/**'
      - '.claude/skills/work-programme/**'
      - '.agents/skills/routine-decisions/**'
      - '.claude/skills/routine-decisions/**'
      - 'tests/work-programme/**'
      - '.github/workflows/work-programme.yml'
  push:
    branches: [main]
    paths:
      - '.agents/skills/work-board/**'
      - '.claude/skills/work-board/**'
      - '.agents/skills/work-programme/**'
      - '.claude/skills/work-programme/**'
      - '.agents/skills/routine-decisions/**'
      - '.claude/skills/routine-decisions/**'
      - 'tests/work-programme/**'
      - '.github/workflows/work-programme.yml'
permissions:
  contents: read
# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: work-programme-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Run canonical coordinator and historical-entry controls
        run: bash tests/work-programme/run.sh > "$RUNNER_TEMP/work-programme-result.json"
      - name: Display the result independently of the runner exit
        if: always()
        run: cat "$RUNNER_TEMP/work-programme-result.json"
      - name: Retain the result independently of display
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: work-programme-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/work-programme-result.json
          if-no-files-found: error
          retention-days: 14
