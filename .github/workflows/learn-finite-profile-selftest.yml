# Gates for the LEARN finite-profile baseline (deployment/learn-finite-profile), Refs #4647.
#
# The baseline holds the admitted, installed bytes of the #4745 finite profile. This suite hashes every
# imported file against BASELINE.json, refuses unlisted, missing, symlinked or altered files, re-runs the
# secrets and identifier scan, and drives the install-journal comparison and the recorded-redaction rule
# against synthetic trees. stdlib only; no credential, no network, no container.
#
# The two `paths:` lists are identical on purpose; `check-paths-coherence.py` rule (a) reds a divergence.
name: learn-finite-profile-selftest

on:
  pull_request:
    paths:
      - "deployment/learn-finite-profile/**"
      - "tests/learn-finite-profile/**"
      - ".github/workflows/learn-finite-profile-selftest.yml"
  push:
    branches: [main]
    paths:
      - "deployment/learn-finite-profile/**"
      - "tests/learn-finite-profile/**"
      - ".github/workflows/learn-finite-profile-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: learn-finite-profile-selftest-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Verify the baseline and run its gates
        run: |
          python3 deployment/learn-finite-profile/verify_baseline.py
          python3 tests/learn-finite-profile/run.py
