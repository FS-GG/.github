name: Coordination CLI host installer self-test

on:
  pull_request:
    paths:
      - ".github/workflows/update-fsgg-coord-cli-selftest.yml"
      - "scripts/update-fsgg-coord-cli"
      - "scripts/update_fsgg_coord_cli.py"
      - "scripts/board_v2_native_results.py"
      - "tests/update-fsgg-coord-cli/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-fsgg-coord-cli-selftest.yml"
      - "scripts/update-fsgg-coord-cli"
      - "scripts/update_fsgg_coord_cli.py"
      - "scripts/board_v2_native_results.py"
      - "tests/update-fsgg-coord-cli/**"

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: update-fsgg-coord-cli-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    name: update-fsgg-coord-cli-fixture
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-policy-python
      - name: Exercise the source installer with disposable fake commands
        run: python3 tests/update-fsgg-coord-cli/test_update.py
