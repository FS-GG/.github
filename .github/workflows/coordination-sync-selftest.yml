# Self-test for scripts/coordination-sync — the coordination-kit distributor/coherence gate (ADR-0019
# slice 2). Runs tests/coordination-sync/run.sh, which proves apply writes the full kit (client +
# EVERY registered skill in each root, client executable), --check passes when coherent and fails
# (exit 1) on a drifted/missing kit file, and that both the --repo roster gate and the registry-derived
# skill list fail closed rather than skipping green. Also triggers on kit-source edits (the skills /
# fsgg-coord) and on the registry that names them, since those change what the gate distributes.
# Mirrors repos-registry-selftest.yml / skill-union-selftest.yml.
name: coordination-sync-selftest

on:
  pull_request:
    paths:
      - "scripts/coordination-sync"
      - "scripts/fsgg-coord"
      # The skill roots are wildcards, not a per-skill list: naming one skill left every other kit
      # skill's edits ungated, and a stale list fails open (.github#338, and #334 before it).
      - ".claude/skills/**"
      - ".agents/skills/**"
      # The distributed skill set is now READ from the registry via repos.sh, so both are inputs to
      # what this gate distributes — an edit to either changes the fixture's subject.
      - "registry/repos.yml"
      - "scripts/repos.sh"
      - "tests/coordination-sync/**"
      - ".github/workflows/coordination-sync-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/coordination-sync"
      - "scripts/fsgg-coord"
      - ".claude/skills/**"
      - ".agents/skills/**"
      - "registry/repos.yml"
      - "scripts/repos.sh"
      - "tests/coordination-sync/**"
      - ".github/workflows/coordination-sync-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Run the coordination-sync fixture
        run: bash tests/coordination-sync/run.sh
