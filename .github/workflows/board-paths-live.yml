name: board-paths-live
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  issues: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate 'repos/${{ github.repository }}/issues?state=open&per_page=100' > items.json
          python3 scripts/check-board-paths-live.py --items items.json
