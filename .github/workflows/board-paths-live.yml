name: board-paths-live
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
permissions:
  issues: read
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Rename evidence is part of the detector's verdict. A depth-1 checkout makes every moved
      # token look indistinguishable from a planned new path, so production must carry full history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --paginate emits one JSON array per page. Slurp those pages and flatten them into the
          # single list the detector accepts, so rows after page one cannot disappear silently.
          gh api --paginate --slurp 'repos/${{ github.repository }}/issues?state=open&per_page=100' |
            jq 'add' > items.json
          python3 scripts/check-board-paths-live.py --items items.json
