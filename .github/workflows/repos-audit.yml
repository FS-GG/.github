# Roster participation audit (ADR-0019 follow-up) — the AUTHORITY-side check.
#
# registry/repos.yml declares who SHOULD participate in each fabric (`receives: <cap>`); the fabrics
# themselves are opt-in receiver contracts. This runs scripts/repos-audit.sh on a schedule to verify
# every declared receiver ACTUALLY wired its capability's detector: a reusable workflow call, an
# authority script call, a package-materializer opt-in plus CI drift enforcement, or a receiver-caller
# contract aimed at a particular subject. For example, `coordination-kit` calls
# coordination-coherence.yml; `build-config` opts into the FS.GG.Kit materializer and reruns it under a
# managed-props diff gate; `skill-union` calls skill-union-assert.yml against the receiver's OWN
# committed skill roots, on a trigger that fires when any of them changes (#1504 — a bare `uses:` cannot
# tell that call from one aimed at a generated product). A declared-but-unwired repo fails the audit.
# Complements the per-receiver pull coherence gate: this is .github auditing the whole roster centrally.
# Reads the (public) FS-GG repos with the run-scoped token.
#
# The script distinguishes four outcomes, and this workflow must not collapse them (#327, #335):
#   0  every declared receiver is wired, and every coordination-kit receiver pins the published kit
#   1  a real finding — the roster and the real wiring disagree. Either a declared receiver is not
#      wired (a gap), or a repo wires a fabric it never declared (an unrostered adopter, #503) — or a
#      cross-repo `sparse-checkout` in some rostered repo enumerates a file (#1529) — or a
#      coordination-kit receiver's FS.GG.Kit pin is behind the newest published one (#1540) — or a
#      receiver declares a generated view skill root that NOTHING generates before the kit asserts
#      it (#1759), or a receiver whose real branch protection contradicts the roster's historical
#      `absence-cover:` word for whether its unexcused view-root assertion/materialize path is
#      required (#1785/#1869)
#   2  no verdict, RETRYABLE — a receiver artifact or a rostered repo's cross-repo git tree could
#      not be read (rate limit, auth, outage), nuget.org would not say which FS.GG.Kit version is
#      published (#1540), or a receiver's branch protection would not read (#1785 — unread
#      protection cannot establish path requiredness)
#   3  no verdict, PERMANENT — the roster will not parse, a capability names no receiver, a
#      cross-repo `sparse-checkout` has a shape the closure rule refuses to grade, a
#      coordination-kit receiver's FS.GG.Kit pin cannot be located or contradicts itself, a
#      receiver's view-root generate cannot be ORDERED against the kit's assertion (#1759), or a
#      receiver's view-root path requirement cannot be graded at all — most often because this run holds no
#      `administration: read` credential, so the required set could be read from only one of the two
#      stores GitHub keeps it in, and a half-read is #574's vacuous green (#1785)
#      (#316, #320, #503, #1529, #1540, #1759)
#
# The audit also carries #1522's sparse-checkout closure rule across the whole roster (#1529), which
# is why 1 and 3 each gained a cause. The rule is IMPORTED from scripts/check-sparse-checkout-
# closure.py rather than restated, so the two readers cannot drift.
#
# AND IT SWEEPS EVERY coordination-kit RECEIVER'S FS.GG.Kit PIN AGAINST nuget.org (#1540, #1560),
# which is why 1, 2 and 3 each gained one more. That sweep is why this runs DAILY rather than weekly
# — see the schedule below.
#
# Both no-verdicts stay RED: "I could not check" must never render as "I checked, and it's fine"
# (#266). Neither may render as "I checked, and it's broken", so each outcome gets its own, and
# differently NAMED, step — the name of the step that goes red is what an operator reads in the
# notification and the run's step list, without opening a log.
#
# 2 and 3 are separate codes because only one of them is worth waiting out. This workflow used to
# tell them apart by grepping the script's prose for `could not determine wiring for`; a reword of
# that sentence silently stopped the retry, or started retrying a malformed roster for 15 minutes
# before going red anyway. The exit code is the contract now (#335).
name: repos-audit

on:
  # DAILY, not weekly (#1540). Roster WIRING changes when somebody edits a workflow, which is rare
  # and self-announcing, and a weekly cadence was right for it. KIT-PIN FRESHNESS changes when the
  # kit is REPUBLISHED — an event in a different repository that touches no file here and no file in
  # any receiver — so the audit's answer can go from true to false with nobody committing anything.
  # On the weekly cadence the org could sit up to seven days with every receiver stale and every
  # check green, which is a slower version of the exact blindness #1540 is about: FS.GG.Audio's own
  # coherence gate read green across two kit republishes purely because it had not pushed.
  #
  # Daily is chosen against the observed rate of the thing being watched, not picked for tidiness:
  # FS.GG.Kit shipped 0.6.0, 0.7.0 and 0.8.0 inside 25 hours on 2026-07-26/27. An hourly cron would
  # buy little more — a kit bump still needs a human PR in each receiver — and would multiply a
  # cross-repo API sweep by 24 against the rate limit this script treats as its main adversary.
  schedule:
    - cron: "17 8 * * *"   # daily, 08:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  # The bump-offer sweep (#1768) reads each BEHIND receiver's open pull requests, to tell "behind, and
  # a bump is open" apart from "behind, and nobody ever proposed one". Those need different actions
  # from different people and the freshness sweep alone cannot distinguish them.
  #
  # Declared even though every rostered repo is public and the run-scoped token can already read a
  # public repo's PR list without it. The grant is the DOCUMENTATION of what this job reads, and the
  # day a receiver goes private the failure should be a 403 on a permission this workflow asked for,
  # not a silent 404 that the sweep would have to interpret. It stays read-only: this audit reports,
  # and has never written anything anywhere.
  pull-requests: read
  # `administration: read` is DELIBERATELY ABSENT and cannot be added: it is not a valid scope for a
  # GITHUB_TOKEN, and declaring it is a startup validation error that produces no check run at all
  # (#478/#1575). The historical absence-cover sweep's protection read goes through the App token
  # minted in the
  # job below, never through this token. Said here because this is where a reader looks for it.

env:
  # Re-audit once before believing a no-verdict. Exit 2's dominant cause is an API rate limit, whose
  # window resets on the hour; repos-audit.sh's own retry (REPOS_AUDIT_TRIES, a few seconds of
  # backoff) deliberately does not try to outlast that, so the waiting belongs here. A wiring gap is
  # not transient, and is never retried.
  REPOS_AUDIT_RETRY_AFTER_S: "900"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # Gathers the exit code; decides nothing. The classification is the named steps below, so the
      # step that goes red is the one that says what happened.
      #
      # Only the authoritative pass is echoed. A discarded first pass emits per-repo `::error::`
      # annotations of its own, and replaying them over a clean retry would hang red annotations on a
      # green run — the annotation list is a surface too, and the whole point here is that it not lie.
      # THE ONE READ THIS AUDIT MAKES THAT GITHUB_TOKEN CANNOT (#1785/#1869). The historical
      # absence-cover sweep asks whether an unexcused view-root assertion/materialize path is
      # REQUIRED, and
      # `branches/<b>/protection` needs `administration: read`
      # — which is NOT a valid `permissions:` scope for a workflow's GITHUB_TOKEN. Declaring it is a
      # startup validation error that produces no check run at all (the #478 blind spot, hit for real
      # by #1575), so no amount of editing the block above can grant it. The org dispatch App holds
      # the scope (#574's org grant, 2026-07-17) and required-context-coherence.yml already mints it
      # per receiver on the same roster, green today; this mints ONE token over the whole set.
      #
      # `continue-on-error`, and that is not a shrug. Without the token the sweep refuses every
      # receiver and the run exits 3 with a diagnostic naming the credential — the honest outcome —
      # so a mint failure must not kill the four sweeps that need no credential before they report.
      # The audit's own exit code stays the verdict.
      - name: Mint the App token the view-root path requirement sweep needs
        id: absentok-token
        continue-on-error: true
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.FSGG_DISPATCH_APP_ID }}
          private-key: ${{ secrets.FSGG_DISPATCH_APP_PRIVATE_KEY }}
          owner: FS-GG
          # The roster is the subject list everywhere else in this workflow, and it cannot be one
          # here: `create-github-app-token` resolves its input before any step has read a file. These
          # are the repos the App is installed on, and a receiver MISSING from this list is not a
          # silent pass — its protection read 403s and the sweep refuses it BY NAME (#266).
          repositories: |
            FS.GG.SDD
            FS.GG.Rendering
            FS.GG.Governance
            FS.GG.Templates
            FS.GG.Game
            FS.GG.Audio
            FS.GG.Net
          permission-administration: read

      - name: Audit roster participation
        id: audit
        env:
          GH_TOKEN: ${{ github.token }}
          # Handed to the historical absence-cover sweep ALONE. Every other read this script makes is a
          # public-repo read the run-scoped token makes correctly, and a repo-scoped installation
          # token would 404 the authority itself — so the two are not interchangeable and the script
          # does not treat them as such.
          ABSENTOK_TOKEN: ${{ steps.absentok-token.outputs.token }}
        run: |
          audit() { rc=0; out="$(bash scripts/repos-audit.sh 2>&1)" || rc=$?; }

          audit
          # Exit 2 is the retryable no-verdict: an API failure — a rate limit, an outage — and worth
          # waiting out. Exit 3 is the permanent one — a roster that will not parse, or that names no
          # receiver — a deterministic read of a file in this checkout, so a second identical pass
          # returns an identical answer. Retrying 3 would hold a runner for 15 minutes and still go
          # red. Ask by exit code: the reason string is a diagnostic, not an interface (#335).
          if [ "$rc" -eq 2 ]; then
            echo "::notice::repos-audit: no verdict on the first pass — re-auditing once in ${REPOS_AUDIT_RETRY_AFTER_S}s, in case that was a rate limit. The first pass's output is superseded and not reported."
            sleep "$REPOS_AUDIT_RETRY_AFTER_S"
            audit
          fi
          [ -z "$out" ] || printf '%s\n' "$out"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"

      - name: Every declared receiver is wired and current
        if: steps.audit.outputs.rc == '0'
        run: |
          echo "### ✅ repos-audit: every declared receiver is wired, and every coordination-kit receiver pins the published FS.GG.Kit" >> "$GITHUB_STEP_SUMMARY"

      # Exit 1 covers BOTH directions of the same disagreement, because they are one class: the audit
      # ran to completion, and the roster does not describe the org. Naming only the gap here — as
      # this step used to — would send an operator hunting for an unwired receiver when what the run
      # actually found was an unrostered adopter, which is a red step that names the wrong subject:
      # the defect this workflow's own comments exist to prevent, re-created in the step that reports.
      - name: 'FINDING: the roster and the real wiring disagree'
        if: steps.audit.outputs.rc == '1'
        run: |
          {
            echo "### ❌ repos-audit: the roster does not describe the org"
            echo "Either a repo whose \`receives:\` declares a fabric does not satisfy that"
            echo "capability's receiver detector (**a gap**), or a repo adopts one without declaring"
            echo "it (**an unrostered adopter** — invisible to every fabric that iterates the"
            echo "roster), or a \`coordination-kit\` receiver's **FS.GG.Kit pin is behind** the"
            echo "newest version published on nuget.org (#1540) — its materialized kit is stale"
            echo "now, and its own \`coordination-coherence\` will only say so on its next push —"
            echo "or a receiver **declares a generated view skill root that nothing generates**"
            echo "before \`FsggKitCheckSkillView\` (#1759). That last one is absent in every fresh"
            echo "checkout by construction (ADR-0067 §6), so that receiver's next Renovate kit bump"
            echo "reds on a tree nobody touched — under \`kit-materialize.yml\`, a \`uses:\` it"
            echo "cannot add a step to (#1715 blocker B5)."
            echo "The audit step's annotations name the repo, capability, missing evidence,"
            echo "and which side is wrong."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=repos-audit: the roster and the real wiring disagree::The audit ran to completion and found a declared receiver that is not wired, a repo that wires a capability it does not declare, or a coordination-kit receiver pinning a stale FS.GG.Kit. This is a real finding — act on it."
          exit 1

      - name: 'INCONCLUSIVE: a required external read failed (transient — re-run)'
        if: steps.audit.outputs.rc == '2'
        run: |
          {
            echo "### ⚠️ repos-audit: inconclusive — nothing was proven"
            echo "The audit could not read a receiver artifact, a rostered repo's cross-repo git"
            echo "tree, nuget.org's published FS.GG.Kit version, or a receiver's branch protection"
            echo "(rate limit, auth, outage), and re-auditing after"
            echo "${REPOS_AUDIT_RETRY_AFTER_S}s did not clear it."
            echo "**No wiring gap was found, and none was ruled out.** This is transient: re-run this"
            echo "workflow before treating the roster as audited."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=repos-audit: INCONCLUSIVE — a required external read failed::The audit never reached a verdict, so its result means nothing. This is an external read failure, NOT a wiring gap. It is transient — re-run the workflow."
          exit 1

      # Split from exit 2 (#335). Same "nothing was proven" verdict, opposite remedy: re-running this
      # cannot help, because every cause is a deterministic property of this checkout or this runner.
      # Naming them alike would send an operator to the re-run button for a defect only a commit fixes.
      #
      # Do NOT name a single cause here. Exit 3 is every `die()` — an unparseable roster, a roster
      # that names no receiver, a missing `gh`, a missing repos.sh, a bad flag — AND, since #1529, a
      # cross-repo `sparse-checkout` whose SHAPE the closure rule refuses to grade. Announcing "fix
      # the roster" for a missing binary is this item's own defect — a red step that names the wrong
      # subject — relocated into the step that reports it. The annotation names the actual cause;
      # this step's job is to say the class, and to say it is not a wiring gap.
      #
      # NOR MAY IT SAY *WHEN* THE AUDIT STOPPED. It used to open "the audit never examined a
      # receiver", which was true of every `die()` (they all fire while reading the roster, before
      # the first API call) and became false the moment exit 3 gained a cause that is COLLECTED
      # across a completed sweep. What the two causes share is the verdict — nothing was proven, and
      # a re-run reproduces it — so that is what this says.
      - name: 'INCONCLUSIVE: the audit reached no verdict (permanent — a re-run will not help)'
        if: steps.audit.outputs.rc == '3'
        run: |
          {
            echo "### ⚠️ repos-audit: inconclusive — the audit reached no verdict"
            echo "**No wiring gap was found, and none was ruled out.** The cause is deterministic —"
            echo "an unparseable \`registry/repos.yml\`, an audited capability that names no receiver"
            echo "(roster its real adopters, or record \`receivers: none\` with a reason), a missing"
            echo "\`gh\`, a bad invocation, or a cross-repo \`sparse-checkout\` whose shape the"
            echo "closure rule refuses to grade (#1529) — so re-running this workflow will reproduce"
            echo "it exactly. **The \`::error::repos-audit:\` annotations on the audit step name the"
            echo "actual cause.**"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=repos-audit: INCONCLUSIVE — the audit reached no verdict::The audit did not reach a verdict, so its result means nothing. This is NOT a wiring gap, and NOT transient: a re-run reproduces it. See the ::error::repos-audit: annotations above for the cause."
          exit 1

      # The `if:` conditions above are a scoping predicate, and an ungated one fails open: an exit code
      # they do not enumerate — a crash, an OOM kill, a step that never ran — matches none of them and
      # would leave the job green having audited nothing. So gate the predicate itself (#266).
      - name: 'INCONCLUSIVE: the audit produced no exit code this workflow understands'
        if: ${{ !cancelled() && !contains(fromJSON('["0","1","2","3"]'), steps.audit.outputs.rc) }}
        run: |
          echo "### ⚠️ repos-audit: inconclusive — the audit did not report" >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=repos-audit: INCONCLUSIVE — no exit code::The audit step reported exit code '${{ steps.audit.outputs.rc }}', which this workflow does not classify. It crashed, was killed, or never ran. Nothing was audited."
          exit 1
