# Reusable skill-union assertion gate (FS-GG/.github#111, epic #110, ADR-0014 P3.G3.1).
#
# A consumer repo's CI calls this via `workflow_call` to assert a scaffolded product's agent-skill
# roots are the byte-identical union of process + product skills — content, not presence. It is
# the CONSUMER-side arm of ADR-0014: producers (SDD `mirror` / the fs-gg-ui template's single
# materialize) write the roots; this proves they did so correctly, in EVERY lane.
#
# THE LIVE CALLERS, MEASURED 2026-07-28 (.github#1643, re-measured #1715) — NOT A PLAN. These lines
# used to read "The first caller is the FS.GG.Templates composition gate (FS.GG.Templates#49 / roadmap
# T3.2), which will call it for both the orchestrated and standalone lanes." That was a prediction
# written in the present tense before the subject existed, and it is wrong in three directions at once:
# Templates is not the first caller, is not a caller of THIS workflow at all, and is not becoming one.
# What is true:
#
#   * FS.GG.Rendering's template-base-skill-union.yml (product-path: template/base, manifest: supplied)
#     is the ONLY live caller of this workflow, org-wide, and it is the generated-product-shaped kind.
#     Its subject is a COMMITTED subdirectory, which is why a `uses:` can reach it — and why the B5
#     measurement below does not touch it.
#   * THERE ARE NO RECEIVER CALLERS ANY MORE. The receiver kind (product-path at its default, over a
#     repo's own committed roots) is RETIRED: .github#1715 decided it on 2026-07-28 (ADR-0067 §9 phase
#     4, blocker B5, shape (b)) and deleted the three that existed — FS.GG.SDD, FS.GG.Rendering and
#     FS.GG.Governance. THE REASON IS THAT THE ASSERTION STOPS BEING ONE under the layout phase 4
#     retires into. Measured on all three of those trees at a dry-run retirement:
#
#         --roots ".agents/skills"                 -> exit 2, "no skills found under any root"
#         --roots ".claude/skills .agents/skills"  -> exit 0, in-every-root=N/N, byte-identical=N/N
#
#     `union_ids()` enumerates with `find` and no `-L` (see the note at its definition), so a root that
#     IS a generated view contributes ZERO ids — the first line, on its own. Every id in the second came
#     from the tracked root alone, and the view root passed presence only because presence is `[ -d ]`
#     THROUGH the symlink and cannot fail. Both headline invariants become tautologies, on a context
#     that was REQUIRED under enforce_admins. The replacement is each receiver's own
#     `scripts/skill-view check --source <live root>`, which asserts ADR-0067 §8's absence classes and
#     is mutation-proven to fail; the decision, the run ids and the per-repo swap order are in
#     docs/coordination/skill-apparatus-retirement-order.md §5.1.
#
#     DO NOT WIRE A NEW RECEIVER CALLER, and do not "restore" one for a repo that looks unguarded. The
#     roster's skill-union capability row says the same thing from the other side.
#   * FS.GG.Templates#49 WAS delivered — 2026-07-02, PR Templates#51, commit 574e90c, both the
#     orchestrated and standalone lanes — but via the pinned, content-addressed dist/skill-union-assert.sh
#     bundle from inside its composition job, NOT via a `uses:` of this file. That is deliberate and
#     decided (Templates#313): this workflow is CHECKOUT-SCOPED — it checks the caller out into `caller/`
#     and asserts `caller/${product-path}` — while Templates' subject is packed -> installed ->
#     scaffolded -> built into a temp workdir during the run. A separate `uses:` job gets a clean runner
#     with no such tree, and this workflow has no artifact input to receive one.
#
# SO STATE THE LIMIT PLAINLY: this workflow can audit a COMMITTED tree (a runtime root or a
# subdirectory); it CANNOT audit a tree generated during the run. A caller in that position asserts the
# union with the dist/ bundle instead. Adding an artifact input to lift that limit is a decision, not a
# tidy-up — do not infer it from this note.
#
# Do not restore a caller PREDICTION here. This banner is the file every wiring reader opens first, and
# a plan stated in the present tense in it has now had to be repaired twice (#1559, then #1643).
#
# It mirrors the `contract-coherence` / `dispatch-sender` reusable pattern: the check lives in one
# script authored here (scripts/skill-union-assert.sh), sourced from public FS-GG/.github, and this
# thin workflow wraps it so any caller wires it with one `uses:` block. See
# docs/coordination/skill-union-assertion.md.
#
# Checks 1-2 (present ∧ byte-identical-across-roots) enforce with nothing but the product tree.
# Check 3 (matches a producer's skill-manifest digests) activates when `manifest` is supplied,
# in the PRODUCERS' shipped semantics (.github#120): SKILL.md canonical-body sha256, superset
# catalog, undeclared co-tenant ids admitted via `co-tenants` globs.
# Check 4 (condition-aware, ADR-0017) activates when `params` (a scaffold-provenance.json) is also
# supplied: it evaluates each declared skill's materializes-when against that document's
# .effectiveParameters PLUS the facts the gate derives from the same document (.github#2576 — today
# just `template`, from .templateRef, because .effectiveParameters is forwarded verbatim to
# `dotnet new` and so can never carry that axis), and adds [missing] (declared∧true∧absent) /
# [unexpected] (present∧false). Without `params` the gate keeps the superset semantics of check 3
# exactly, so adoption is opt-in per caller.
#
# TWO KINDS OF CALLER, AND THE ROSTER TELLS THEM APART (.github#1504). This workflow is
# SUBJECT-PARAMETERISED — it audits whatever `product-path:` names — so a `uses:` of it says nothing at
# all about WHAT was audited:
#
#   * a GENERATED-PRODUCT caller passes `product-path: <subdir>` and audits some tree OTHER than the
#     repo's own runtime roots (FS.GG.Rendering's template-base-skill-union.yml over template/base).
#     Legitimate, and it proves nothing about the caller's OWN committed skill roots. The name describes
#     the caller's SHAPE relative to the receiver contract, not a claim that the subject was generated
#     during the run — per the limit above, this workflow cannot audit such a subject.
#   * a COMMITTED-ROOT caller — the receiver contract behind `receives: skill-union` — leaves
#     `product-path` at its default (or writes `.`), leaves `roots` at the default set (ADR-0065's two,
#     as amended by ADR-0067 §5 — this said "ADR-0011's three" while the input default 12 lines below
#     already listed two), and lives in a
#     workflow whose `pull_request` trigger fires when any of those roots changes. The canonical shape is
#     in docs/coordination/skill-union-assertion.md; `repos-audit`'s `caller: skill-union` detector
#     requires both halves in ONE workflow file, because a trigger cannot arm a workflow it is not in.
#
# The roster capability is therefore `caller:`, not `workflow:`: a bare `uses:` detector would certify
# the full-union capability off the first kind of call, which is a green nobody earned (#628) with the
# receiver's own roots left ungated. Do NOT add an input that lets a caller narrow the audited root set
# without saying so — narrowing is a declared decision (see #517 below), not a default.
#
# ROOTS ARE ALWAYS PASSED EXPLICITLY (.github#517). skill-union-assert.sh will read a product's own
# checked-in `.agent-skill-roots` declaration when no roots are given — right for a repo asserting
# ITSELF (a kit repo; see skill-roots-selfcheck.yml), wrong here. The tree this gate audits is
# producer-GENERATED (fsgg-sdd + the fs-gg-ui template write it), while `roots:` is human-authored
# by the consumer repo. Letting the artifact under test declare the scope of its own audit is a
# fail-open: a template that emitted a one-root declaration into a scaffolded product would make
# this gate skip .agents/skills and go green on a partitioned product — ADR-0011's origin bug, the
# exact thing this gate exists to catch. So the roots come from the caller, never from the subject.
name: skill-union-assert

on:
  workflow_call:
    inputs:
      product-path:
        description: "Path within the caller's checkout of the scaffolded product to assert."
        type: string
        default: "."
      roots:
        description: >-
          Space-separated AGENT_SKILL_ROOTS to check, relative to product-path. Defaults to ADR-0065's
          two (as amended by ADR-0067 §5), and this gate ALWAYS passes it explicitly — a product's own
          `.agent-skill-roots` is deliberately NOT consulted here (see the note above). A tree
          intentionally supporting fewer runtimes must say so explicitly, for example:
          roots: ".claude/skills".
        type: string
        default: ".claude/skills .agents/skills"
      manifest:
        description: "Optional path (in the caller's checkout) to a producer skill-manifest JSON; enables the digest cross-check."
        type: string
        default: ""
      co-tenants:
        description: "Space-separated globs of co-tenant skill ids (e.g. 'fs-gg-sdd-* speckit-*') the manifest legitimately does not declare; only used with manifest."
        type: string
        default: ""
      params:
        description: "Optional path (in the caller's checkout) to a scaffold-provenance.json; enables the condition-aware check (ADR-0017) — [missing]/[unexpected] from materializes-when. Requires manifest."
        type: string
        default: ""
      github-ref:
        description: "Ref of FS-GG/.github to source the assertion script from."
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  skill-union:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7
        with:
          path: caller

      - name: Checkout FS-GG/.github (assertion-script authority)
        uses: actions/checkout@v7
        with:
          repository: FS-GG/.github
          ref: ${{ inputs.github-ref }}
          path: dotgithub
          # FETCH THE DIRECTORY, NEVER A LIST OF FILES (.github#1510). skill-union-assert.sh sources
          # its helpers from scripts/lib/ at load, so they must be present or the job dies before
          # parsing a single argument. This list used to ENUMERATE them — the script + lib/args.sh —
          # and an enumeration of a dependency set drifts silently the moment a `source` is added:
          # lib/roots.sh was hoisted here by #525 and never added, so EVERY receiver caller of this
          # reusable workflow failed at load in ~7s having asserted nothing (#1510; hit independently
          # by FS.GG.SDD#718 and FS.GG.Governance#327). #843 is the same defect class one hop over.
          #
          # `scripts/` fixes the CLASS, not lib/roots.sh: a fourth `source` is covered with no edit
          # here. The invariant it rests on — every load-time dependency lives under scripts/ — is the
          # one scripts/generate-skill-union-bundle already enforces, since it inlines scripts/lib/*
          # to build the self-contained dist/ artifact and skill-union-bundle.yml fails a bundle that
          # still sources a sibling. Do NOT narrow this back to named files.
          #
          # ANCHOR THE PATTERN. Non-cone mode is gitignore-style, where a pattern with no leading or
          # interior slash matches at ANY depth: a bare `scripts/` also drags in every nested scripts/
          # dir, which here means the work-board and work-roadmap skills' copies under all three
          # ADR-0011 skill roots. Harmless to the assertion, but this job has no business checking out
          # the skill roots of the authority repo while auditing somebody else's. The leading slash
          # pins it to the repo root. Verified against this repo: `/scripts/` yields scripts/
          # recursively — scripts/lib/{args,roots,gate}.* all land — and not one file outside it.
          sparse-checkout: |
            /scripts/
          sparse-checkout-cone-mode: false

      - name: Assert the skill union is byte-identical across roots
        shell: bash
        env:
          # Passed via env (never interpolated into the run script) to avoid injection — the org's
          # uniform pattern (cf. architecture-map.yml). `workflow_call` inputs are caller-controlled.
          PRODUCT_PATH: ${{ inputs.product-path }}
          ROOTS: ${{ inputs.roots }}
          MANIFEST: ${{ inputs.manifest }}
          CO_TENANTS: ${{ inputs.co-tenants }}
          PARAMS: ${{ inputs.params }}
        run: |
          set -euo pipefail
          args=(--product "caller/${PRODUCT_PATH}" --roots "${ROOTS}")
          if [ -n "${MANIFEST}" ]; then
            args+=(--manifest "caller/${MANIFEST}")
          fi
          if [ -n "${CO_TENANTS}" ]; then
            args+=(--co-tenants "${CO_TENANTS}")
          fi
          if [ -n "${PARAMS}" ]; then
            args+=(--params "caller/${PARAMS}")
          fi
          bash dotgithub/scripts/skill-union-assert.sh "${args[@]}"
