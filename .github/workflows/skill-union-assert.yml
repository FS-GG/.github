# Reusable skill-union assertion gate (FS-GG/.github#111, epic #110, ADR-0014 P3.G3.1).
#
# A consumer repo's CI calls this via `workflow_call` to assert a scaffolded product's agent-skill
# roots are the byte-identical union of process + product skills — content, not presence. It is
# the CONSUMER-side arm of ADR-0014: producers (SDD `mirror` / the fs-gg-ui template's single
# materialize) write the roots; this proves they did so correctly, in EVERY lane. The first caller
# is the FS.GG.Templates composition gate (FS.GG.Templates#49 / roadmap T3.2), which will call it
# for both the orchestrated and standalone lanes.
#
# It mirrors the `contract-coherence` / `dispatch-sender` reusable pattern: the check lives in one
# script authored here (scripts/skill-union-assert.sh), sourced from public FS-GG/.github, and this
# thin workflow wraps it so any caller wires it with one `uses:` block. See
# docs/coordination/skill-union-assertion.md.
#
# Checks 1-2 (present ∧ byte-identical-across-roots) enforce with nothing but the product tree.
# Check 3 (matches a producer's skill-manifest digests) activates when `manifest` is supplied,
# in the PRODUCERS' shipped semantics (.github#120): SKILL.md canonical-body sha256, superset
# catalog, undeclared co-tenant ids admitted via `co-tenants` globs.
# Check 4 (condition-aware, ADR-0017) activates when `params` (a scaffold-provenance.json) is also
# supplied: it evaluates each declared skill's materializes-when against .effectiveParameters and
# adds [missing] (declared∧true∧absent) / [unexpected] (present∧false). Without `params` the gate
# keeps the superset semantics of check 3 exactly, so adoption is opt-in per caller.
name: skill-union-assert

on:
  workflow_call:
    inputs:
      product-path:
        description: "Path within the caller's checkout of the scaffolded product to assert."
        type: string
        default: "."
      roots:
        description: "Space-separated AGENT_SKILL_ROOTS to check, relative to product-path."
        type: string
        default: ".claude/skills .codex/skills .agents/skills"
      manifest:
        description: "Optional path (in the caller's checkout) to a producer skill-manifest JSON; enables the digest cross-check."
        type: string
        default: ""
      co-tenants:
        description: "Space-separated globs of co-tenant skill ids (e.g. 'fs-gg-sdd-* speckit-*') the manifest legitimately does not declare; only used with manifest."
        type: string
        default: ""
      params:
        description: "Optional path (in the caller's checkout) to a scaffold-provenance.json; enables the condition-aware check (ADR-0017) — [missing]/[unexpected] from materializes-when. Requires manifest."
        type: string
        default: ""
      github-ref:
        description: "Ref of FS-GG/.github to source the assertion script from."
        type: string
        default: "main"

permissions:
  contents: read

jobs:
  skill-union:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@v7
        with:
          path: caller

      - name: Checkout FS-GG/.github (assertion-script authority)
        uses: actions/checkout@v7
        with:
          repository: FS-GG/.github
          ref: ${{ inputs.github-ref }}
          path: dotgithub
          # skill-union-assert.sh sources scripts/lib/args.sh (shared need_val) at load, so the
          # sparse checkout must fetch it too — a lone script would die before parsing any arg.
          sparse-checkout: |
            scripts/skill-union-assert.sh
            scripts/lib/args.sh
          sparse-checkout-cone-mode: false

      - name: Assert the skill union is byte-identical across roots
        shell: bash
        env:
          # Passed via env (never interpolated into the run script) to avoid injection — the org's
          # uniform pattern (cf. architecture-map.yml). `workflow_call` inputs are caller-controlled.
          PRODUCT_PATH: ${{ inputs.product-path }}
          ROOTS: ${{ inputs.roots }}
          MANIFEST: ${{ inputs.manifest }}
          CO_TENANTS: ${{ inputs.co-tenants }}
          PARAMS: ${{ inputs.params }}
        run: |
          set -euo pipefail
          args=(--product "caller/${PRODUCT_PATH}" --roots "${ROOTS}")
          if [ -n "${MANIFEST}" ]; then
            args+=(--manifest "caller/${MANIFEST}")
          fi
          if [ -n "${CO_TENANTS}" ]; then
            args+=(--co-tenants "${CO_TENANTS}")
          fi
          if [ -n "${PARAMS}" ]; then
            args+=(--params "caller/${PARAMS}")
          fi
          bash dotgithub/scripts/skill-union-assert.sh "${args[@]}"
