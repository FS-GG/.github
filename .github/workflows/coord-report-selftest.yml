# The failure legs of the coordination session reporter (.github#2556, epic #266).
#
# `scripts/fsgg-coord-report` is a PUBLISHED client: `registry/repos.yml` ships it in the kit,
# `src/FS.GG.Kit/verify-package.sh` asserts it materializes executable, and the product board skill
# instructs its driver to report live item state through it. Organization consumers use owning/native
# evidence instead. Its fixture landed with it (f6321969) and no
# workflow has ever run a line of it — the reporter that tells a human what the board is doing had no
# CI opinion at all. It was HALF-BLOCKED on .github#2555 until that row put `python3` into
# `scripts/test`'s scrape vocabulary; before then a `run:` step here would have executed the suite and
# still reported it UNWIRED, which is why it waited.
#
# Per epic #266's ratified rule — A GATE THAT CANNOT FAIL ON ITS SUBJECT IS NOT A GATE — the fixture
# drives the client black-box, through its real entry point, over the properties a reporter can lose
# silently: the JSON document is authoritative and both text projections retain every scalar in it;
# rich is plain plus SGR and nothing else; a caller's terminal control bytes are visibly ENCODED
# rather than emitted, and that encoding stays injective, so a raw control byte and a caller who typed
# its six-character escape spelling never collapse into the same cell; display width, not code-point
# count, is what `--width` bounds; the append-only ledger deduplicates a retried heartbeat, survives a
# corrupt derived cache without losing an event, and serializes concurrent `emit`/`show` on its lock;
# and a foreign Coordination scope receipt is REFUSED even when the supplied snapshot is entirely
# self-consistent about being foreign.
#
# WHY THE SKILL BODIES ARE IN THE FILTER. The fixture also asserts the product reporter contract,
# organization owning/native reporting boundary, and that each routed variant still
# inherits its canonical driver rather than growing a sixth reporting recipe — in BOTH runtime roots.
# Those are SKILL.md reads, so an edit to one is a change to this suite's corpus and must re-run it.
# The glob covers `drive-board`, `work-board` and their four routed variants in one line rather than
# twelve; it also selects `check-board`, which is a cheap over-trigger and not a wrong one.
#
# Hermetic: the client imports no GitHub client and reads no credential, and the fixture supplies
# every lane snapshot and scope receipt from a temp dir. stdlib only — no shared policy bootstrap.
#
# The two `paths:` lists are identical on purpose; `check-paths-coherence.py` rule (a) reds a
# divergence.
name: coord-report-selftest

on:
  pull_request:
    paths:
      - "scripts/fsgg-coord-report"
      - "tests/coord-report/**"
      - ".claude/skills/*-board*/SKILL.md"
      - ".agents/skills/*-board*/SKILL.md"
      - ".github/workflows/coord-report-selftest.yml"
  push:
    branches: [main]
    paths:
      - "scripts/fsgg-coord-report"
      - "tests/coord-report/**"
      - ".claude/skills/*-board*/SKILL.md"
      - ".agents/skills/*-board*/SKILL.md"
      - ".github/workflows/coord-report-selftest.yml"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. The key
# falls back to `github.sha` (not `github.ref`) for push / merge_group / workflow_dispatch so each of
# those keeps its own group and `cancel-in-progress` is false there: GitHub also discards a PENDING run
# in a shared group even without cancel-in-progress, which `refs/heads/main` would do to main pushes.
concurrency:
  group: coord-report-selftest-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Run the coordination session reporter fixture
        run: python3 tests/coord-report/run.py
