# GS2-08.9 retirement boundary. The redrive writer is removed; its hermetic oracle continues to
# prove the derivation refuses moved or unclassifiable vectors.
name: skillmirror-redrive (validation only)

on:
  pull_request:
    paths:
      - "scripts/skillmirror-redrive.py"
      - "scripts/lib/gate.py"
      - "tests/skill-union/skillmirror.fixtures.json"
      - "tests/skill-union/skillmirror-oracle.sh"
      - "tests/skill-union/skillmirror-oracle.fsx"
      - "tests/skillmirror-redrive/**"
      - ".github/workflows/skillmirror-redrive.yml"
  push:
    branches: [main]
    paths:
      - "scripts/skillmirror-redrive.py"
      - "scripts/lib/gate.py"
      - "tests/skill-union/skillmirror.fixtures.json"
      - "tests/skill-union/skillmirror-oracle.sh"
      - "tests/skill-union/skillmirror-oracle.fsx"
      - "tests/skillmirror-redrive/**"
      - ".github/workflows/skillmirror-redrive.yml"
  schedule:
    - cron: "41 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# PR-keyed concurrency (#4730 CI-load): a newer run for the same pull request cancels the superseded
# one, so a push or body edit no longer leaves the old head's run to finish and hold a runner. Any
# other event keys on `github.run_id`, which is unique to the run: GitHub discards an older PENDING run
# in a shared group even without cancel-in-progress, so a key that two events can share (the branch ref
# for pushes, or the commit sha for dispatches and issue events at one commit) would drop a run.
concurrency:
  group: skillmirror-redrive-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-policy-python
      - name: Run the hermetic redrive oracle
        run: bash tests/skillmirror-redrive/run.sh
      - name: Assert the validation checkout stayed unchanged
        run: git diff --exit-code
