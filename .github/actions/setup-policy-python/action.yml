name: Set up policy Python
description: Install the shared Python runtime and pinned YAML dependency used by policy checks.

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.x"
    - name: Install pinned policy dependencies
      shell: bash
      run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
