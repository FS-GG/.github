name: Cross-repo request
description: Ask another FS-GG repo's maintainers/agents for a change, decision, or release. Open this in the TARGET repo.
title: "[cross-repo] "
labels: ["cross-repo", "cross-repo:request"]
body:
  - type: markdown
    attributes:
      value: |
        Open this issue **in the repo you are requesting from** (the target). Responses
        are comments on this issue; resolution closes it. See the
        [cross-repo coordination protocol](https://github.com/FS-GG/.github/blob/main/docs/coordination/README.md).
  - type: input
    id: from
    attributes:
      label: From (requesting repo / agent)
      placeholder: "FS.GG.SDD"
    validations:
      required: true
  - type: input
    id: blocking
    attributes:
      label: Blocking work (issue/PR/commit this unblocks)
      placeholder: "FS-GG/FS.GG.Templates#12, commit 68dccc9"
  - type: textarea
    id: request
    attributes:
      label: Request
      description: What do you need, and why? Be specific about the contract/version/file involved.
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Affected contract / registry entry
      description: Name the contract or registry id (e.g. `scaffold-provider@1`, `governance-handoff@1`, `fs-gg-ui-version`). Link the registry entry if one exists.
  - type: markdown
    attributes:
      value: |
        **Registry assertion (optional).** If this request asks `.github` to set a `registry/skills.yml`
        field to a value, state it *structurally* below — id, field, value — rather than only in the
        prose above. A filing-time check re-verifies the triple against the OWNING producer's manifest
        (`owner:` decides whose word is law) and auto-comments the owner-declared value if they disagree,
        before triage — the ADR-0050 predicate oracle. A machine cannot tell a fenced YAML *quotation*
        from an *assertion* (#683), so the claim lives in these fields, not in the body. Leave blank
        if the request asserts no registry value. Today only `mirrored` is checked.
  - type: input
    id: assert-id
    attributes:
      label: Asserted registry id
      description: The `registry/skills.yml` row id, e.g. `fs-gg-playtest`.
      placeholder: "fs-gg-playtest"
  - type: input
    id: assert-field
    attributes:
      label: Asserted registry field
      description: The field being asserted, e.g. `mirrored`.
      placeholder: "mirrored"
  - type: input
    id: assert-value
    attributes:
      label: Asserted registry value
      description: The value you are asserting the field has, e.g. `true`.
      placeholder: "true"
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - blocking
        - high
        - normal
        - low
    validations:
      required: true
  - type: input
    id: refs
    attributes:
      label: Other references
      placeholder: "schema files, prior decisions, ADRs"
