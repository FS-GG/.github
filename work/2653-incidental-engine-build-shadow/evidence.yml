      digest: "sha256:368a75b5ba78c02c7bc53739d388b40691f5be0a8aa7c6e8fbb22530cb1f59d0"
      digestContract: exact-bytes-v1
      outcome: passed
      passed: 86
      failed: 0
      skipped: 0
    notes: ["Discharged by tests/coord-engine-parity/shim.sh — 86 assertion(s), 0 failed, exit 0, run through the shared checkout's current engine at tier 1 so no build was created in this worktree. Section 3g (seven new legs) covers the repair: g1 an incidental stale build writes the board through the SHARED engine; g2 the same leg stops holding once that shared engine is removed; g3 an AUTHORED stale build still keeps tier 2a and is still REFUSED with neither engine reached; g4 the refusal names the worktree, says it is not the shared checkout, and reports the observed reason; g5 a stale shared engine does not attract the swap; g6 an unanswerable authorship probe takes the status-quo branch; g7 a FAILING dirt probe (corrupt index, exit 128, empty stdout) is read as unanswerable rather than as a clean tree, so no engine runs and the caller's own build is kept (review round 1, repair 1). The pre-existing 79 assertions are unchanged and green, including the tier-2b legs of section 5 and the receivers'-shape legs of sections 3, 3e and 7. Receipt: work/2653-incidental-engine-build-shadow/test-results/shim-parity.junit.xml", "GATE INVERSION, subject mutated, observed red — six mutations, one per new leg, each run against a scratch copy of the resolver and the module so no reviewed head moved. M1 removes the tier-2a precondition from scripts/fsgg-coord (the pre-.github#2653 resolver) -> g1 RED, 5 passed 1 failed. M4 deletes the `stale_detail` conjunct from engine_shadows_shared so the swap may land on a stale shared engine -> g5 RED, 5 passed 1 failed. M5 flips authored_engine_source's no-default-branch-ref path from `return 0` to `return 1` (the fail-open direction) -> g6 RED, 5 passed 1 failed. M6 replaces the 'WHY YOUR OWN BUILD WAS PREFERRED' heading -> g4 RED, 5 passed 1 failed. M7 drops the authorship conjunct entirely so the swap is unconditional -> g3, g4, g6 and g7 RED, 3 passed 4 failed. M8 restores review round 1's defect verbatim — the dirt probe stops consulting its exit status, so a failed `git status` reads as a clean tree -> g7 RED, 6 passed 1 failed, and ONLY g7, which is what makes g7 the leg that owns probe 1. Unmutated control NONE -> 7 passed, 0 failed. Non-vacuity is additionally a standing leg rather than a one-off mutation: g2 empties the fixture's fall-through target and requires g1's condition to stop holding, so 'found a current shared engine' and 'looked at no shared engine' cannot share an exit code. Receipt: work/2653-incidental-engine-build-shadow/test-results/gate-inversion.junit.xml", "The defect was reproduced hermetically BEFORE the repair, against the unmodified resolver: a shared checkout at its origin default branch with a current engine, plus a linked worktree cut one engine commit earlier with its own build, authoring nothing. `scripts/fsgg-coord release <ref>` from that worktree exited 69 with 'REFUSED ... the engine is STALE / BEHIND refs/remotes/origin/main by 1 commit(s)'. The same fixture after the repair exits 0 and runs the SHARED engine. That reproduction is leg g1 of section 3g, so it is a standing gate rather than a one-time observation."]
