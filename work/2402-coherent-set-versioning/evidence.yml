 so renaming either the workflow files or the tag namespaces would have silently broken the fleet's sole coord-engine distribution path). Its own residual gap (a maintainer could still `workflow_dispatch` exactly one of the three files) was named explicitly rather than silently closed, and filed/closed as `#2445`'s `release-coherence.yml` post-publish completion gate. Whether the literal AC2 architecture (true consolidation or thin callers) is still worth doing later, now that the substitute is proven in production by a real release, is an open judgement call this item does not resolve either way — it is neither claimed done nor filed as further work by this entry. This worker's own judgement: the substitute is a complete, evidenced answer to the RISK AC2 named (three release events able to diverge), verified in production by the real cut (EV007's own AC7 evidence), and re-litigating the architecture choice DEC-004's critic already reviewed is out of this item's scope — but that is this worker's assessment, not a fact silently substituted for AC2's literal text."
