deferrals:
  - id: DEF-001
    source: work/2312-dispatch-lock-merge-election/clarifications.md
    disposition: accepted
    reason: >-
      A behavioural ordering leg for reap and adopt requires widening the shared ApplicationServiceTests
      world fixture, which models one holder per issue and is depended on by many unrelated items. The
      structural gate pair (no second implementation, and at least three call sites consuming the exported
      rule) covers the routing; the behavioural gap is stated in the PR body rather than left implicit.
  - id: DEF-002
    source: work/2312-dispatch-lock-merge-election/clarifications.md
    disposition: accepted
    reason: >-
      FSGG_COORD_OP_LOCKS environment injection is not added until a caller needs it. The opLockRef shape
      already carries the injected-roster parameter, so adding the variable later is additive.

