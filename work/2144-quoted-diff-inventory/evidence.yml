      - >-
        The no-receipt live path measured the occurrence threshold with the changed-FILE count.
        SemanticDiff.discoverRenames/discoveredOccurrences now recover the rename tokens from the
        live base/head blobs, so the count is occurrences. The production-route theory in
        ApplicationServiceTests drives Client.driver twice over a ONE-file PR with a
        `diff-audit-required: false` chain and no receipt; six quoted occurrences yield
        reviewEvidence 0 (audit mechanically required, opt-out rejected) and one occurrence yields
        reviewEvidence 1. The changed-file count is 1 in both, so it cannot explain the difference.
      - >-
        Unreadable base/head blobs require the receipt rather than disproving the threshold; only a
        404 is read as absent-at-that-ref, and only a successful empty prFiles read is a zero.
