    profiles:
      game:
        type: "choice (app|headless-scene|governed|sample-pack|game)"
        added: "Feature 220 (FS.GG.Rendering#31, 2026-06-30) — RELEASED @ 0.1.54-preview.1 (Feature 222, FS.GG.Rendering#33, 2026-06-30; release run 28468936061)"
        notes: >
