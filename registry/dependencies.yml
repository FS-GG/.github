      a product (SDD fs-gg-sdd-* process skills ∪ provider fs-gg-* UI skills) so the Claude / Codex /
      generic runtimes are interchangeable. `fsgg-sdd` (the orchestrator, ADR-0008) is the SOLE mirror
      authority: after provider invocation, scaffold computes the union and MATERIALIZES real files into
      all three roots (not symlinks — generated products ship build.cmd so Windows is in scope, and
      scaffold-provenance hashes file bodies). Providers stay confined to .agents/skills/; the SDD
      intrusion guard (isSddTree, providerWroteSddTree) stays STRICT.
