    # `satisfied`. On THIS contract that shows up in exactly one place: the blocking diagnostic id
    # `ship.unobservedEvidence` becomes reachable in `readiness.blockingDiagnosticIds[]` (and is
    # counted in `readiness.counts.blocking`), with `readiness.shipDisposition: "blocked"` — an
    # EXISTING value, for a new reason. Additive: a new member of an open id vocabulary. A consumer
    # that does not recognise the id ignores it exactly as it ignores any other; nothing it parses
    # today changes shape, and no field is removed or re-typed.
    #
    # WHAT DOES *NOT* CHANGE — AND THE ADR SAYS OTHERWISE. ADR-0035's registry obligation reads
    # "`governance-handoff` … gains the `unobserved` disposition". Taken literally that is WRONG, and
    # believing it would send the next reader hunting a handoff enum that does not exist. `unobserved`
    # is a `TD-` *test*-disposition state in `verify.json`; it is NOT persisted here. The handoff's
    # two enums are unmoved: `readiness.shipDisposition` stays {shipReady, blocked} and
    # `evidence.nodes[].state` stays {pending, real, synthetic, failed, skipped}. FS.GG.SDD#422
    # withheld the state from the `ED-` ladder ON PURPOSE and said so in the code — "giving `ED-` an
    # `unobserved` STATE would instead change a persisted enum on the governance-handoff surface — a
    # schema change this stage deliberately does not make". `ED-` keeps saying `supported` and carries
    # the basis in its `observed` boolean (the #398 disclosure split). So: `schemaVersion` stays 1,
    # this is a MINOR and not a major, and the bump is earned by the diagnostic id, not by an enum.
    #
    # OPT-IN, DEFAULT-OFF. Reachable only under `--require-observed`, accepted by BOTH `verify` and
    # `ship` (`ship` re-asserts the receipt because a blocked `verify` writes nothing and leaves the
    # previous green, still-digest-current `verify.json` on disk). With the flag absent the emitted
    # handoff is byte-identical to 1.0.0, so no Governance consumer can meet the new id today. It is
    # declared here BEFORE the default flips — the schema major ADR-0035 gates on "once the fleet is
    # green" — so that a consumer validating against the declared contract never meets an undeclared
    # value. That ordering is the entire point of the bump.
    #
    # GOVERNANCE OWNS THE VERDICT, NOT THE FACT (ADR-0035 §3): SDD reports `unobserved`; what it costs
    # at a merge boundary, and receipt freshness, are Governance's to decide.
    #
    # COHERENT WITH THE EMITTED ARTIFACT since 2026-07-14 (FS.GG.SDD#427); UNGATED — see coherence id
    # `governance-handoff-emitted-version`, and .github#1085 for the gate that is still owed.
    #
    # THIS COMMENT SAID THE OPPOSITE UNTIL .github#1082, and it was WRONG for three days: it read "SDD
    # stamps a HARDCODED contractVersion and it is still 1.0.0 ... the value is hardcoded TWICE,
    # independently ... Move BOTH." Every clause of that was true when written and none of it survived
    # #427. Measured in FS.GG.SDD @ 7c6c78a: `GovernanceHandoff.fs:261` and `ReleaseContract.fs:590-592`
    # both READ `Fsgg.Schemas.governanceHandoffContractVersion` (`src/FS.GG.Contracts/Schemas.fs:185` =
    # "1.1.0", anchored by `SchemaVersionConstantTests.fs:55-58`). There is now ONE literal, not two, so
    # the emitter and the constant CANNOT drift — the hand-kept mirror this comment warned about is gone,
    # and the durable fix it asked for was achieved structurally rather than by a check.
    #
    # WHAT IS STILL TRUE, AND IS OURS: nothing compares SDD's constant to the `version:` on the next
    # line. Nothing in SDD can see this document, so SDD's own gate cannot catch it — this row is free to
    # advance here while SDD stamps something older, which is the same silent drift one level up. SDD's
    # source says so from its side too (`Schemas.fs:180-183` names this repo as the owner and asks that
    # the value change "only alongside the registry"). BOTH repos wrote the gap down; NEITHER built the
    # gate. Until .github#1085 lands, the two are kept in step BY HAND — so change this value only
    # alongside SDD's constant.
    #
    # → 1.2.0 (2026-07-26, additive MINOR; SDD#687 / PR#699, merge
    # ca60cf57f522462259aa73a682f0f719cab0d0ec): performance-evidence-v1 extends the emitted
    # governance handoff with independently verifiable, workload-bound performance evidence. The
    # single emitter-owned literal in FS.GG.Contracts/Schemas.fs is now 1.2.0. This registry flip
    # lands atomically with fsgg-contracts 6.0.0 and fs-gg-net 0.5.0 because the mandatory aggregate
    # source/feed gates cannot be green for a proper subset. Tracked by .github#1454.
    # → 2.0.0 (2026-07-26, declared MAJOR; SDD#700 / PR#701): the handoff carries the exact
    # producer-owned PerformanceIntentDeclaration beside independently verifiable performance
    # evidence. Legacy handoffs may emit intent: null, but governed interactive/render-loop consumers
    # must adopt the 2.x shape and independently recompute the verdict.
    version: "2.0.0"
    range: "2.x"
    owner: sdd
    surface: "readiness/<id>/governance-handoff.json"
    consumers: [governance]
  - id: governance-policy
    version: "1"
    owner: governance
    surface: ".fsgg/policy.yml"
    consumers: [templates]
  - id: governance-capabilities
    version: "2"
    owner: governance
    surface: ".fsgg/capabilities.yml"
    consumers: [templates]
