  - id: skill-mirror-verified
    coherent: true
    owner: github
    summary: >
      Decision recorded 2026-07-01 (ADR-0014, extends ADR-0011): the skill-vendoring IMPLEMENTATION is
      consolidated and made VERIFIABLE. ADR-0011's invariants stand (byte-identical union in every root;
      single mirror authority; providers confined to .agents/skills/; strict isSddTree; materialized copies,
      not symlinks) — but the mechanism collapses from FOUR hand-maintained fan-outs (SDD scaffold/refresh +
      doctor expected-set + the fs-gg-ui template's Feature 230 standalone 36-twin matrix) to ONE shared,
      content-addressed algorithm. Skills become content-addressed data: each producer declares a
      skill-manifest ({id, scope: process|product, sha256, body}); a single `mirror`/`verify` library in
      FS.GG.Contracts (root-set parameterized via AGENT_SKILL_ROOTS) is consumed by every lane — orchestrated
      (fsgg-sdd scaffold/refresh/doctor/upgrade) and standalone spec-kit (template ships the manifest + one
      thin materialize step). scaffold-provenance gains a per-skill sha256 (additive contract minor bump) and
      the drift/composition guards assert present-in-each-root ∧ byte-identical-across-roots ∧ matches-manifest
      for BOTH process and product skills — closing the presence-only gap (doctor/upgrade checked existence
      only; composition asserted nothing; provenance had no digest, so ADR-0011's sha256 rationale was
      counterfactual). A declared product/dev boundary + a no-dangling-route guard remove the ~13 dev-surface
      wrappers the fs-gg-ui template vendors into products.
    note: >
      RESOLVED 2026-07-02 (coherent:false -> true) — every flip condition of the ADR-0014 rollout
      (roadmap §3, epic .github#110) is delivered and verified end-to-end: (P0/P1, SDD#60/#61) ONE
      materialize-and-verify library `Fsgg.SkillMirror` in FS.GG.Contracts 1.4.0 (fsgg-sdd 0.5.0 on the feed,
      SDD#63) owns all four orchestrated verbs; the three bespoke fan-outs are deleted and drift is
      content-aware over process+product skills with per-skill sha256 in scaffold-provenance. (P2,
      Rendering#43 / Feature 231) fs-gg-ui-template 0.1.61-preview.1 ships the product skill-manifest in
      every lifecycle, replaces the 36-twin standalone matrix with ONE vendored-byte-equivalent materialize
      step (content-parity gated), and drops the dev-surface vendoring — zero dangling wrappers, no-dangling
      release guard. (P3, .github#111 + Templates#49) the reusable skill-union assertion is published and the
      Templates composition gate asserts the byte-identical 3-root union HARD in BOTH lanes (orchestrated
      fsgg-sdd scaffold + standalone spec-kit materialize --enforce), with the manifest digest/dangling
      cross-check in producer semantics; the former providerWroteSddTree grep-and-SKIP is retired. (P4,
      Templates#51 merged 574e90c) re-pin 0.1.60->0.1.61-preview.1 + minimumFsggSdd 0.3.0->0.4.0; both lanes
      green locally (45/45) and in CI (run 28585460049). Residual known gap RESOLVED 2026-07-02
      (.github#120): the shared assertion's --manifest arm is aligned with the shipped producer semantics —
      digest = canonical-body sha256 of SKILL.md (Fsgg.SkillMirror's algorithm; multi-file remainder covered
      by cross-root identity), superset-catalog set semantics, and a --co-tenants allowlist for undeclared
      co-tenant process skills; Templates can now swap its inline producer-semantics manifest arm for
      --manifest (follow-up filed in FS.GG.Templates). Contract touched:
      scaffold-provenance (minor, +sha256), fs-gg-ui-template, scaffold-provider.
    resolved_by: "FS-GG/FS.GG.Templates#49 (PR Templates#51, 574e90c, 2026-07-02) — the last child of epic .github#110; this registry PR flips the id. Decision: ADR-0014."
    impact: "One content-addressed algorithm materializes and verifies the skill union across both lanes; the interchangeable-runtime invariant is machine-checked where skills are produced (doctor) and consumed (composition, enforcing); products ship no dangling skills; adding a runtime root is a one-line change."
    tracking: "FS-GG/.github ADR-0014 + docs/reports/2026-07-01-skill-vendoring-robustness-roadmap.md (§7 issue map) + Coordination epic .github#110 (all children closed). Superseded the #47 lockstep (closed by Templates#51). Follow-up .github#120 (--manifest arm alignment) RESOLVED 2026-07-02."
  - id: nuget-org-published
    coherent: true
    owner: github
    summary: >
      Decision recorded 2026-07-01 (ADR-0012): FS-GG DUAL-PUBLISHES all currently-published packages
      to the PUBLIC nuget.org (https://api.nuget.org/v3/index.json) IN ADDITION to the org GitHub
      Packages feed — the org feed stays the coherence source of truth (Renovate, the contract-coherence
      gate, and registry `package-version` keep reading it), nuget.org is an ADDITIVE public
      distribution target. Scope = everything: the two global tools (FS.GG.SDD.Cli, FS.GG.Governance.Cli),
      FS.GG.Contracts, the FS.GG.UI.* coherent set + the FS.GG.UI BOM + FS.GG.UI.Template, the
      content-only FS.GG.Governance.ReferenceGateSet, and FS.GG.Templates (the governance-overlay
      template package); the -preview channel is preserved. Each producer's
      release job pushes the BYTE-IDENTICAL .nupkg (the one that passed ApiCompat / the G1–G7 guard) to
      nuget.org with `--skip-duplicate` ONLY AFTER the org-feed push + gates are green; a failed
      nuget.org push fails the release loud but never corrupts coherence (org feed authoritative, retry
      safe). Listing metadata (PackageLicenseExpression, PackageReadmeFile, RepositoryUrl, icon) is a
      one-time per-repo packaging add. NB: a nuget.org ID is claimed PERMANENTLY (unlist != delete),
      so this freezes the current FS.GG.* IDs as the public identities (no rename — ADR-0003 discipline).
    note: >
      COHERENT since 2026-07-01 (FS.GG.Templates added 2026-07-04): all 23 in-scope packages resolve on nuget.org. Because each producer
      release pushes to nuget.org only AFTER the org-feed push (below), nuget.org TRACKS the org feed —
      the current authoritative versions live in the contract entries above (fsgg-contracts,
      fs-gg-ui-template, …), NOT in this note. At the 2026-07-01 flip the resolving set was FS.GG.Contracts
      1.2.0, FS.GG.SDD.Cli 0.4.0, FS.GG.Governance.Cli 1.2.0, FS.GG.Governance.ReferenceGateSet 1.2.1.1,
      and the FS.GG.UI.* coherent set (17 libs) + FS.GG.UI BOM + FS.GG.UI.Template @ 0.1.58-preview.1 (all
      since advanced) — dual-published via Trusted Publishing (OIDC), byte-identical
      to the org-feed artifacts. Delivered end-to-end: the ADMIN gate (.github#103) is satisfied (packages
      owned by nuget.org account Paradigma11; four Active per-producer Trusted Publishing policies
      fs-gg-sdd-release / fs-gg-rendering-release / fs-gg-governance-publish / fs-gg-Templates-publishing)
      and all four producer
      release workflows wire `id-token: write` + NuGet/login@v1 + `dotnet nuget push` to
      https://api.nuget.org/v3/index.json AFTER the org-feed push (SDD#58, Rendering#41, Governance#42, Templates#84,
      merged; SDD v0.4.0 + Governance v1.2.0 releases and a Rendering 0.1.58-preview.1 dispatch all pushed
      green). Consumer docs dropped the `--add-source` requirement (docs/consumer/*). The FS.GG. prefix
      reservation remains an optional anti-squat follow-on (the IDs are now claimed under Paradigma11).
      AUTH MECHANISM = TRUSTED PUBLISHING (OIDC) per ADR-0013, which SUPERSEDES ADR-0012 §6 — there is NO
      long-lived NUGET_ORG_API_KEY secret. The prior standing request (now resolved): (ADMIN/.github) own an
      FS-GG nuget.org account, reserve the ID prefix `FS.GG.`
      (anti-squat — STILL required; trusted publishing replaces the key, not the prefix), and create ONE
      Trusted Publishing POLICY PER PRODUCER repo (Repository Owner FS-GG; Repository FS.GG.SDD /
      FS.GG.Rendering / FS.GG.Governance / FS.GG.Templates; Workflow File = that repo's release workflow filename only,
      e.g. release.yml), optionally set the non-sensitive NUGET_USER (nuget.org profile name) — until a
      matching policy exists NuGet/login returns 401 and the release FAILS CLOSED/loud (never a silent
      no-op, never a half-published set); (SDD/Rendering/Governance/Templates) each release.yml adds, IN ITS OWN
      WORKFLOW (a cross-repo reusable workflow trips the OIDC policy match — NuGet/login#6, so the
      .github#104 reusable nuget-org-push.yml was RETIRED), `id-token: write` + NuGet/login@v1 (short-
      lived key) + `dotnet nuget push … --skip-duplicate` to https://api.nuget.org/v3/index.json AFTER
      the org-feed push + gates are green (ADR-0012 §4), pushing the BYTE-IDENTICAL gate-verified .nupkg
      (§3) + listing metadata (§5): SDD = FS.GG.SDD.Cli + FS.GG.Contracts; Rendering = the FS.GG.UI.* set
      + BOM + Template (one coherent set); Governance = FS.GG.Governance.Cli + FS.GG.Governance.ReferenceGateSet;
      Templates = FS.GG.Templates (the governance-overlay template package, added 2026-07-04 — Templates#83/#84).
      Flipped coherent:true 2026-07-01 — every in-scope package resolves on nuget.org at its current version. No
      contract surface/version change (auth-mechanism swap on an already-registered additive distribution target).
    resolved_by: "FS-GG/.github ADR-0013 (trusted publishing; supersedes ADR-0012 §6) — decision layer; ADR-0012 registers the dual-publish coherence id"
    impact: "Public consumers install FS-GG with no --add-source (dotnet tool install -g FS.GG.SDD.Cli / dotnet add package FS.GG.Contracts) and discover the packages on nuget.org; the org feed remains the -preview coherence feed and the auto-update fabric is unchanged. Producers publish keylessly (OIDC) — no long-lived push secret to store or rotate."
    tracking: "RESOLVED — FS-GG/.github#103 (admin: policies Active) + FS.GG.SDD#56 (PR SDD#58) + FS.GG.Rendering#40 (PR Rendering#41) + FS.GG.Governance#41 (PR Governance#42) + FS.GG.Templates#83 (PR Templates#84), all merged; all 23 packages live on nuget.org. Optional follow-on: reserve the FS.GG. prefix + ADR-0012 §5 listing metadata."

