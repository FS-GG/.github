    # ADR-0002: lifecycle is a template parameter (choice symbol).
    parameters:
      productName:
        type: "string (product name); additive ALIAS of the canonical `name` (ADR-0005)"
        default: ""
        notes: >
          Feature 217 (FS.GG.Rendering#27): the fs-gg-ui template now ACCEPTS --productName
          (the SDD scaffold-provider convention) in addition to the canonical --name/-n, so
          `dotnet new fs-gg-ui --productName Acme` (no -n) instantiates instead of exit-127.
          Wiring: a coalesce(productNameTrimmed ?? name) generated symbol drives the `Product`
          rename (top-level sourceName REMOVED -> single driver); projectSlug sources the
          effective name; effectiveNameLower reproduces sourceName's case-aware lowercase
          `product` content replace. ADDITIVE / backward-compatible: when productName is
          absent every existing path is BYTE-IDENTICAL (SC-003, real `dotnet new` byte-diff,
          M1..M4 = 0 diffs); --productName Acme == -n Acme (SC-004 = 0 diffs); the Acme product
          builds -c Release 0 warn/0 err (SC-002). Non-empty productName takes precedence over
          -n; empty/whitespace falls back to -n (FR-005/FR-006). Canonical param STAYS `name`
          (ADR-0005) -- productName is an accepted alias, not a replacement. RELEASED in
          0.1.53-preview.1 (Feature 218, FS.GG.Rendering#29): the org feed now serves
          0.1.53-preview.1, which honors --productName (verified live — clean feed install +
          `dotnet new fs-gg-ui --productName Acme` exit 0, no 127). Cross-ref #27 <-> SDD#35;
          published + made consumer-readable by #29/#26.
      lifecycle:
        type: "choice (spec-kit|sdd|none)"
        default: "spec-kit"   # byte-identical to pre-ADR-0002 output; existing profile tests unchanged
        notes: >
          sdd -> app-only product + SDD skeleton; none -> emits neither .specify/ nor a
          constitution. Gates ONLY the lifecycle WORKSPACE: .specify/, constitution, the
          .agents//.claude/ agent-context tree, the blanket authoring-skills copy + speckit-*
          command skills, .template.config/generated/, and docs/skillist-reference.md (the
