    # src/FS.GG.Coord.Core src/FS.GG.Coord.GitHub` = 30, and <Version> was UNCHANGED since that tag).
    # 0.4.0 released 36 of them and reset the counter to zero; it did not retire the condition, and
    # #1067 — the reason this row exists — is closed while the gap it names is not.
    #
    # WHY A GREEN ROW CANNOT SEE IT. This engine's <Version> moves only AT RELEASE TIME, by hand. Every
    # other producer's source version moves with the CHANGE (SDD#387 put `fsproj <Version> ==
    # Fsgg.ContractVersion.value` in SDD itself, so a surface edit that skips the bump reds SDD's own
    # PR). So for them `version` drifting ahead of `package-version` is the legible "merged, not yet
    # published" signal. Here that signal DOES NOT EXIST: source-outran-feed holds <Version> CONSTANT,
    # so version == package-version is precisely the state the bug lives in.
    #
    # So this row buys the PUBLISHED-BUT-REGISTRY-STALE direction (real: the .github#250 class has hit
    # other rows 7+ times — publish 0.4.0 without flipping this and feed-coherence reds, correctly).
    #
    # THAT SENTENCE CAME TRUE THE SAME DAY IT WAS WRITTEN, VERBATIM AND DOWN TO THE VERSION NUMBER.
    # 0.4.0 published at ~15:44Z; this row still said 0.3.0; `feed-coherence` went red on main — the
    # row predicting its own next red, correctly, and then being the thing that produced it. It is the
    # best evidence the row is worth having, and it is also the whole of what the row buys: the red was
    # CORRECT and nothing acted on it. `feed-autofix` is the actor for exactly this (#934) and has
    # never landed a PR (.github#1081); the flip below is the 9th by hand.
    #
    # It does NOT buy the direction this engine actually fails in. Nothing does yet: .github#1075 is
    # the detector, and it measures COMMITS SINCE THE RELEASE TAG rather than comparing two scalars
    # that are equal by construction while the defect is happening. Do not read this row's green as
    # "the fleet is running current code" — those are different facts (epic #266).
    surface: "the `fsgg-coord-engine` CLI verb surface (claim/take/batch/who/widen/set-paths/say/landable/done/release/flush/…) + its exit-code contract, emitted from src/FS.GG.Coord.Core/Protocol.fs; shipped as the FS.GG.Coord.Cli dotnet tool"
    consumers: [sdd, rendering, governance, templates, game, audio, net]   # All SEVEN coordination-kit receivers (registry/repos.yml `receives: coordination-kit`). `scripts/fsgg-coord` resolves and execs this package, so every receiver is a real TOOL consumer edge. `.github` itself is not listed because it resolves the engine from source.
  - id: new-sdd-workspace
    version: "0.8.0"          # SOURCE SemVer 0.8.0: product workspace skill propagation and idempotent coordination retrofit, released from new-sdd-workspace/v0.8.0 at 8f09f1d445bdf803605aeb258425e60d8e62a192.
    package-version: "0.8.0"  # FEED newest, independently verified on GitHub Packages and nuget.org after release run 30563750400; the 26 non-signature payload entries are byte-identical. Tag new-sdd-workspace/v0.8.0 points to 8f09f1d445bdf803605aeb258425e60d8e62a192. publish-before-flip FR-007 satisfied. PRIOR 0.7.0.
    owner: github             # Registry.fs resolves owner against repoIds + the literal `github`. `.github` owns the scaffolder: ADR-0016 retired FS.GG.Templates' local `new-fullstack` for this single org CLI, and its release workflow lives here because the tool does (mirrors coord-engine).
    # ADR-0016's single org scaffolder (renamed new-sdd-fullstack → new-sdd-workspace, package
    # FS.GG.NewSddFullstack → FS.GG.NewSddWorkspace). A `dotnet new`-style CLI humans install
    # (`dotnet tool install --global FS.GG.NewSddWorkspace`) that wraps the FS.GG.Templates `rendering`
    # provider to scaffold a full-stack SDD workspace in one command. Dual-published (org feed +
    # nuget.org via ADR-0012/0013 OIDC), release-new-sdd-workspace.yml.
    #
    # WHY consumers: [] AND WHY THAT IS NOT A DEFECT (.github#1067 → SDD#508, the decision this row
    # completes). Nothing RESTORES this package — it is installed by a human, and this repo's own
    # fixture builds it from SOURCE, not the feed — so it has no in-graph consumer, and `consumers: []`
    # is the HONEST value. Until schemaVersion 2 the typed validator refused it (`MissingField:
    # …missing a non-empty 'consumers'`), which forced a false choice: invent a consuming repo (a lie
    # `fsgg-surface-impact` would then enforce as a real edge) or drop the row (how the inventory went
    # off by two). The human RESOLVED it (SDD#508): this registry is the org's package INVENTORY, where
    # a consumerless-but-published package MUST appear — not a pure contract GRAPH, where it would not.
    # The three-state `ConsumerDeclaration` (absent=error / empty=this / non-empty) makes "deliberately
    # no consumer" distinct from "forgot one", mirroring `MirrorDeclaration`. So: do NOT add a consumer
    # here to make a gate happy — the empty list IS the recorded decision.
    surface: "the `new-sdd-workspace` scaffolder CLI (package FS.GG.NewSddWorkspace) — one-command full-stack SDD workspace creation, wrapping the FS.GG.Templates `rendering` provider (ADR-0016); shipped as a dotnet tool"
    consumers: []             # DELIBERATELY EMPTY — see the block above. A `dotnet new` tool humans install; nothing in the graph restores it, so it has no consumer edge. schemaVersion 2 (.github#1114) makes this a legal, honest value distinct from an OMITTED `consumers`.

