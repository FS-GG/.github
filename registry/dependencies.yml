        type: "choice (spec-kit|sdd|none)"
        default: "sdd"   # ADR-0056 (2026-07-20) FLIPS the default spec-kit -> sdd and reclassifies spec-kit as a LEGACY lane (frozen, scheduled for removal); amends ADR-0002 §Decision.2. publish-before-flip FR-007: the default-carrying template is LIVE FIRST — FS.GG.UI.Template 0.15.0 (org feed, published 2026-07-20T07:19:58Z) ships content/.template.config/template.json lifecycle.defaultValue == "sdd" (verified in the published nupkg) — and this row flips AFTER. The version/package-version/package-tag above ADVANCED 0.14.0 -> 0.15.0 in the SAME flip, so the coherent-set version this row asserts is the one that actually carries the sdd default (0.14.0 scaffolds spec-kit — flipping the default without the pin would leave the registry asserting sdd while its own pin points at a spec-kit template). Flipped by .github#1246 (from ADR-0056 / #1244; producer FS.GG.Rendering#944/#946). PRIOR default "spec-kit" (byte-identical to pre-ADR-0002 output; existing profile tests unchanged).
        notes: >
          sdd -> app-only product + SDD skeleton; none -> emits neither .specify/ nor a
          constitution. Gates ONLY the lifecycle WORKSPACE: .specify/, constitution, the
          .agents//.claude/ agent-context tree, the blanket authoring-skills copy + speckit-*
          command skills, .template.config/generated/, and docs/skillist-reference.md (the
          full-registry catalog). Feature 219 (FS.GG.Rendering#30, additive / surface-neutral):
          the framework product-usage skills under .agents/skills/fs-gg-* and
          .claude/skills/fs-gg-* are NOT lifecycle-gated — they follow the product PROFILE and
          emit under EVERY lifecycle (spec-kit|sdd|none), so the recommended SDD path and the
          full-stack composition now carry the profile-appropriate fs-gg-* skills. spec-kit stays
          byte-identical (no parameter add/remove/rename; the sdd/none paths gain skills, no file
          removed). Feature 223 (FS.GG.Rendering#35, RELEASED @ 0.1.55-preview.1): fs-gg-symbology
          is now VENDORED — sourced into the ship list for the fs-gg-scene profile set (app,
          headless-scene, governed, sample-pack, game) on both .agents/.claude surfaces, plus the
