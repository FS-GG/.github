      consumer-action: >
        SDD scaffold path must stop relying on template auto-init and own repo-init + chmod as
        explicit post-instantiation steps (contract §5 S1–S3). Direct callers that passed
        `--skipGitInit true` simply drop the flag; callers that relied on auto-init pass
        `--initGit true`.
      contract-doc: "FS.GG.Rendering specs/205-scaffold-git-init-chmod/contracts/fs-gg-ui-template-generation.md (Accepted)"
      tracking: "https://github.com/FS-GG/FS.GG.SDD/issues/1 (cross-repo follow-up for the scaffold-path execution)"
  - id: shared-build-config
    version: "1.1.0"
    owner: github   # the FS-GG/.github org repo is the source of truth
    # #592 / ADR-0036 (1.0.0 -> 1.1.0): THE DRIFT CHECK NOW COMPARES AGAINST A PIN, NOT AGAINST main.
    # Every receiver's gate.yml checks .github out at `ref: main` and runs sync-build-config.sh --check,
    # so the verdict of a REQUIRED check was a function of another repo's moving branch at CI time: a
    # receiver could not make it green from its own PR, and any edit to dist/dotnet/ red-lit EVERY open
    # PR in EVERY adopting repo. It fired twice — #499 froze FS.GG.SDD for hours (SDD#379), and #536
    # then red-lit a green in-flight PR by editing an XML COMMENT (SDD#380). The push arm (#626)
    # shortened that freeze but left it indefinitely reachable (a sync PR whose own gate is red never
    # auto-merges). The receiver now commits `.config/fsgg-build-config.sha` — the .github commit its
    # managed files came from — and --check diffs against THAT commit's dist/dotnet/. Verdict becomes a
    # pure function of the receiver's own tree: BEHIND is green (bot-remediated, loudly noticed),
    # HAND-EDITED is red (fixable from the author's branch).
    # ADDITIVE / backward-compatible, hence minor: an UNPINNED receiver is bit-for-bit unchanged
    # (absent pin == legacy compare-against-main), so the rollout cannot merge-freeze anyone — which
    # matters more than usual, a migration that froze the org being this very defect committed by its
    # own fix. No receiver gate.yml change is needed: the script is distributed from .github@main too,
    # so --check's semantics are ours to define. Additive growth is still growth (ADR-0015), so the
    # minor bumps rather than riding along silently.
    # ADR-0006 / .github#19 (H3, Pillar 5): the canonical org-shared .NET build config —
    # Directory.Build.props (determinism, CPM + transitive pinning, lockfile-restore-enforcement
    # gate, NU1603/NU1608->error) and Directory.Packages.props (CPM + org FSharp.Core 10.1.301 pin).
    # Distributed verbatim via scripts/sync-build-config.sh; repo-specific settings live in the imported
    # *.local.props. (.config/dotnet-tools.json LEFT this surface in #1077: the engine tool manifest — the
    # thing that lets a repo restore fs.gg.coord.cli — now rides the coordination-kit, so it reaches all
    # six kit receivers instead of build-config's four. Surface reduction only; receivers still get the
    # file, via the kit, so no consumer breaks and no version bump.)
    # The script's --check mode is the drift gate consumed by the reusable coherence workflow
    # (#18, LANDED): consumer repos call contract-coherence.yml with check-build-config: true.
    # #29: --check compares byte-for-byte (not XML-aware), so a malformed-but-verbatim source could
    # pass the gate yet fail every adopter's build (MSB4024); the script now asserts source .props
    # XML well-formedness before distributing/checking.
    # #20 (H3, Pillar 5): the config now also carries the OPT-IN api-breaking-change-gate —
    # PublicApiAnalyzers (pinned 3.3.4) + SDK Package Validation/ApiCompat, gated on FsggApiGate and
    # OFF by default so a re-sync stays non-breaking under locked restore. Surface unchanged (same 3
    # files + script); no shared-build-config version bump. Per-repo adoption: coherence id
    # apicompat-publicapi-gate.
    # #125 (H1 bug fix): the api-breaking-change-gate PropertyGroup was evaluated BEFORE the
    # *.local.props import, so a Condition reading $(FsggApiGate)-set-in-local.props never fired —
    # EnablePackageValidation + the RS00xx WarningsNotAsErrors demotion stayed dead while the ItemGroup
    # (later item pass) STILL injected the analyzer PackageReference, so an adopter with
    # TreatWarningsAsErrors got a broken build and `required` never got package validation. The gate now
    # sits AFTER the import (proven via `dotnet msbuild -getProperty`). Latent-only: no repo drives the
    # shared FsggApiGate knob today (F# packables use a dedicated api-compatibility-gate job). Byte
    # change to Directory.Build.props → adopters re-sync via the --check drift gate; surface unchanged,
    # no version bump. Also documents the M7 F# no-op (PublicApiAnalyzers is C#/VB-only) in the props
    # header, catching the props guidance up to the mechanism already recorded on apicompat-publicapi-gate.
    surface: "dist/dotnet/{Directory.Build.props,Directory.Packages.props} + scripts/sync-build-config.sh"
    consumers: [rendering, sdd, governance, templates]
