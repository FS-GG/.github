  - id: registry-schema
    version: "2"            # == THIS file's top-level `schemaVersion` — the on-disk registry-document schema contract. → 2 (.github#1114, SDD#508 step 3): `consumers` grew to "required, may be empty" (three-state ConsumerDeclaration), the FIRST schema growth since this contract was registered. Publish-before-flip (ADR-0037): FS.GG.SDD.Cli 0.13.0 (the accepting validator) went live FIRST (SDD#516), the pin below advanced with this bump. PRIOR "1": the registered-but-never-bumped state.
    owner: sdd              # Fsgg.Registry (in FS.GG.Contracts) is the typed authority: RegistryDocument model + validateDocument.
    # .github#135 (review §6.9, epic #124): register the registry's OWN schema as a governed contract — the one
    # contract in the system that previously wasn't. Rationale (H2 + M5 together): the typed-validator investment
    # only pays off if the schema is versioned AND the gate's validator pin advances with it. H2 (.github#127) found
    # the pin frozen at FS.GG.SDD.Cli 0.2.1 for three minors while the registry grew one-off fields under additive
    # tolerance (M5), degrading the typed gate toward a YAML-parses check. Registering the schema makes schema growth
    # a tracked contract-change: bump this `version` (and the file's top-level schemaVersion), and advance the gate's
    # FS.GG.SDD.Cli pin to a CLI carrying that Fsgg.Registry version.
    # Decision recorded in ADR-0015; state in coherence id `registry-schema-governed`.
    #
    # NOTE (.github#686): ADR-0015 §3 words that obligation as "in the SAME PR that teaches Fsgg.Registry". THAT PR
    # CANNOT EXIST — for THIS contract exactly as for `skill-registry`: the schema DOCUMENT is this file (in .github)
    # and the VALIDATOR (Fsgg.Registry, in FS.GG.Contracts) lives in FS.GG.SDD, and no PR spans two repos. Nor can
    # the pin advance to a CLI that has not been published yet. The real sequence is the org's own
    # publish-before-flip (FR-007), two ORDERED PRs:
    #   1. FS.GG.SDD teaches Fsgg.Registry the field/rule and PUBLISHES a CLI carrying it;
    #   2. .github THEN bumps this `version` + the top-level schemaVersion and advances the pin to that CLI.
    # RUN ONCE, EXACTLY THIS WAY (.github#1114, the schemaVersion 1→2 bump): SDD published FS.GG.Contracts 3.0.0 +
    # FS.GG.SDD.Cli 0.13.0 (the three-state `consumers` validator, SDD#512/#516) FIRST, then this PR bumped and
    # advanced the pin. The hazard above did not bite: 0.13.0 was measured to ACCEPT the un-bumped document too,
    # so the pin could lead the bump on Renovate's PR without reddening step 2 (ADR-0037).
    # And note what counts as growth in the first place: an OPTIONAL, ADDITIVE, back-compatible field IS schema
    # growth (.github#686) — M5 above IS that defect, so "no consumer breaks" is its MECHANISM, not an exemption.
    #
    # AMENDED IN THE CANONICAL SOURCE: ADR-0037 (.github#689) supersedes ADR-0015 §3's "same change" clause — an
    # Accepted ADR is amended by a NEW ADR, never rewritten in place. ADR-0037 also adds the obligation that makes
    # the two-PR order SAFE, and which is stated nowhere above: the validator published in step 1 MUST still accept
    # the document as it stands at .github HEAD — the new rule may REJECT NOTHING the current document does, and is
    # enforced only once the document DECLARES the new schemaVersion. This is not hygiene: pin-coherence.yml
    # hard-fails when a pin is behind feed-newest, so publishing the CLI reds .github@main (via the daily cron — a
    # CLI release touches no file here) and the pin advances AHEAD of step 2's bump, on Renovate's own PR. The window
    # in which the validator knows more than the document declares is therefore OPENED BY THE ORG'S OWN ANTI-FREEZE
    # MACHINERY, and a validator that rejected the un-bumped document would red the very gate step 2 has to pass.
    surface: >
      registry/dependencies.yml DOCUMENT schema — the top-level `schemaVersion` scalar plus the field-vocabulary
      block (the schema-of-record comment near the head of this file). Modeled + validated by FS.GG.Contracts'
      Fsgg.Registry (RegistryDocument.load + validateDocument), shipped in the fsgg-sdd CLI (`fsgg-sdd registry
      validate`). `version` tracks the on-disk schemaVersion (currently 2); the Fsgg.Registry code that reads it is
      a facet of the `fsgg-contracts` package version (advancing the schema advances both).
    consumers: [github]     # .github's own contract-coherence gate validates THIS file against the schema.
    validator: >
      FS.GG.SDD.Cli pin in .github/workflows/contract-coherence.yml (`fsgg-sdd registry validate`). Coupled to the
      newest published CLI via the org Renovate preset's annotation manager (`# renovate: datasource=nuget
      depName=FS.GG.SDD.Cli`, .github#127), so a schema/validator advance cannot silently freeze the gate (the H2 defect).

  - id: skill-registry
    version: "3"            # == registry/skills.yml top-level `schemaVersion` — the skill-catalog document schema.
                            # BUMPED "1" → "2" (ADR-0054 step 2, .github#1230): the owed `mirrored` bump PAID
                            # alongside the `scope: driver` growth — see "THE OWED BUMP" below.
                            # BUMPED "2" → "3" (ADR-0057 step 2): adds the `operator` skill class — a
                            # `.github`-authored, never-materialized scope. Same publish-before-flip rail:
                            # FS.GG.SDD.Cli 0.18.x teaches Fsgg.Registry `operator`, this pin advances onto it.
    owner: github
    # ADR-0017 (.github#163/#168): the org's single authoritative skill catalog (process + product),
    # condition-aware. Registered as a governed contract per ADR-0015 (mirrors `registry-schema`): the
    # typed validator (Fsgg.Registry, SDD CLI) owns it, and schema growth is a tracked contract-change.
    # State in coherence id `skill-registry-published`.
    #
    # IS AN OPTIONAL, ADDITIVE FIELD "SCHEMA GROWTH"? YES. DECIDED .github#686; do not re-litigate.
    #
    # The tempting answer is no — the field is optional, every reader ignores unknown keys, no consumer
    # breaks. That reasoning is exactly backwards, and ADR-0015 says so in its own Context. Its
    # motivating defect (M5) WAS additive growth: the registry "grew one-off fields" (`minimum-fsgg-sdd`,
    # `package-tag`, `profiles`) and, "because the typed validator treats most fields as optional
    # (ADDITIVE TOLERANCE), a stale validator silently degrades toward a YAML-parses check." Every one of
    # those was optional, additive and back-compatible. "No consumer breaks" is not an EXEMPTION from
    # schema growth — it is the MECHANISM of the defect: it is precisely why the drift is SILENT, and
    # therefore precisely why it must be TRACKED. ADR-0015's Consequences make back-compat the ambient
    # condition rather than the test, in as many words: "unknown fields are still tolerated".
    #
    # So the test is NOT "does a reader break". The test is: DOES THE ON-DISK SCHEMA NOW CARRY A FIELD OR
    # RULE THE PINNED VALIDATOR DOES NOT KNOW? If yes, it is schema growth, and it bumps. This governs
    # every future additive field on this contract, not just `mirrored`.
    #
    # THE OWED BUMP — NOW PAID (ADR-0054 step 2, .github#1230). `mirrored:` (.github#658, PR #687) grew
    # this schema and landed UNBUMPED. Under the decision above that was schema growth, so `version` "1"
    # → "2" + skills.yml `schemaVersion` 1 → 2 was OWED. It was deliberately UNPAID while Fsgg.Registry
    # did not assert over skills.yml — a bump then would have versioned a schema NO validator read and
    # pinned a CLI carrying nothing (the .github#416 ornament). ADR-0054 then added a SECOND growth to
    # the same scalar — `scope: driver` + a non-producer `owner: .github` (the third skill class) — and
    # SDD published the CLI that teaches Fsgg.Registry BOTH: FS.GG.SDD.Cli 0.17.0 (SDD#595). With a
    # validator that reads the file and knows both growths, the debt is paid here: `version` "1" → "2",
    # skills.yml `schemaVersion` 1 → 2, pin advanced to 0.17.0. An unpaid debt recorded is honest; so is
    # paying it once the thing that made paying dishonest — a schema no validator reads — is gone.
    #
    # THE BUMP PROCEDURE, CORRECTED. ADR-0015 §3 obliges the bump "in the SAME PR that teaches the
    # validator". THAT IS UNSATISFIABLE — for this contract and for `registry-schema` alike — because the
    # schema DOCUMENT lives in .github (skills.yml / this file) and the VALIDATOR (Fsgg.Registry, in
    # FS.GG.Contracts) lives in FS.GG.SDD. No PR spans two repos. The clause has never bitten only because
    # neither schemaVersion has ever been bumped; `mirrored` is the FIRST real schema growth since
    # ADR-0015 and it exposed that the procedure cannot be run as written. The real sequence is the org's
    # own publish-before-flip (FR-007), two ORDERED PRs:
    #   1. FS.GG.SDD teaches Fsgg.Registry the field/rule and PUBLISHES a CLI carrying it.
    #   2. .github THEN bumps skills.yml `schemaVersion` + this `version` and advances the
    #      contract-coherence.yml FS.GG.SDD.Cli pin to that CLI — one .github PR, after the CLI is live.
    # ADR-0015 no longer sends a reader into the unsatisfiable clause unwarned: its header marks §3
    # SUPERSEDED and §3 itself carries a dated ADR-0037 amendment stating the two-PR procedure above. The
    # clause's TEXT remains, deliberately — ADR-0037 (.github#689) amends §3, and this repo does not
    # rewrite an Accepted ADR in place (cf. ADR-0027, which amends ADR-0021 §1 with a NEW ADR), so
    # correcting it was its own change. ADR-0037 §3 also binds the VALIDATOR: the CLI published in step 1
    # must still ACCEPT skills.yml AS IT STANDS — the new rule may reject nothing the current document does,
    # and is enforced only once the document DECLARES the new schemaVersion. pin-coherence.yml hard-fails on a
    # pin behind feed-newest, so the pin advances AHEAD of the bump (on Renovate's own PR) and the new validator
    # meets the un-bumped document on a required gate. THE TRAP THAT WAS ARMED — skills.yml carrying `mirrored`
    # (and a `scope: driver` row) at schemaVersion 1 — was DISARMED as ADR-0037 §3 requires: FS.GG.SDD.Cli
    # 0.17.0 (SDD#595, the CLI this flip pins) ACCEPTS skills.yml as it STOOD at schemaVersion 1 (valid, 0
    # diagnostics — measured before this flip), rejecting nothing the live document did; the new rules bind
    # only against the declared `2`. The SDD half shipped as SDD#595 (not the earlier-planned #420).
    surface: >
      registry/skills.yml — the authoritative catalog of every process + product + driver + operator
      skill ({id, scope, owner, source, canonical-body sha256, materializes-when predicate, mirrored}).
      `scope` is one of process | product | driver | operator. GENERATED/RECONCILED from the producer
      skill-manifests
      (Rendering's template/skill-manifest/skill-manifest.json; SDD's emitted process manifest
      .agents/skills/skill-manifest.json — SDD#111 closing #109; and, since ADR-0054, `.github`'s OWN
      driver manifest registry/driver-skill-manifest.json — emitted by scripts/generate-driver-manifest
      for the `.github`-authored `scope: driver` (product-materialized, e.g. work-roadmap) AND, since
      ADR-0057, `scope: operator` (never-materialized, e.g. drive-board) classes), never
      hand-authored bytes. `materializes-when` is the ADR-0017
      predicate grammar the union gate (scripts/skill-union-assert.sh --params) evaluates against a
      scaffold's scaffold-provenance.json effectiveParameters. `mirrored` (OPTIONAL boolean, .github#658)
      is the ADR-0022 §6 frozen-mirror OBLIGATION the owner asserts — "FS.GG.Rendering is required to ship
      a byte-identical copy of this body" — never an observation that a same-named file exists in both
      trees. ABSENT MEANS "NOT CLASSIFIED", NEVER `false`: a reader that coerces absent → false answers
      "not mirrored" for every body of a manifest predating the field, confidently, and leaves every real
      mirror unguarded — the fail-open .github#658 exists to close. Projected to
      docs/registry/compatibility.md (§Skill registry); changelog registry/skills.CHANGELOG.md.
    consumers: [github]     # .github's union gate + registry validation; Templates (P4, Templates#49) via provenance.
    validator: >
      Typed Fsgg.Registry validator (fsgg-sdd) — asserts registry = producer manifest = materialized bytes,
      condition-aware. Product rows are producer-reconciled from Rendering's and Game's current manifests;
      the generated Skill-registry row-counts block in docs/registry/compatibility.md is the authoritative
      per-owner total. The 16 PROCESS rows come from SDD's EMITTED process manifest
      (.agents/skills/skill-manifest.json; SDD#111 closing #109) — registry = manifest = bytes for every
      owner. Rendering's predicate-grammar alignment (Rendering#77) has LANDED, so no producer
      condition gates the enforcing flip; it now waits on the typed validator assertion shipping and a
      green skill-registry-coherence. See coherence id `skill-registry-published`.
