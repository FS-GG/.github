# FS-GG cross-repo contract & dependency registry.
# The machine-readable source of truth for who depends on whom and which contract
# versions are coherent. A `contract-change` issue MUST update this file as part of
# its resolution. Human projection: docs/registry/compatibility.md.
schemaVersion: 2   # → 2 (.github#1114, SDD#508 step 3): `consumers` becomes "required, may be EMPTY" — a present-but-empty `consumers: []` is now a legal, honest value for a package-bearing contract that nothing restores (the `new-sdd-workspace` scaffolder). Schema growth under #686 / ADR-0015; the FS.GG.SDD.Cli validator pin in contract-coherence.yml advances to 0.13.0 with this bump (publish-before-flip, ADR-0037: SDD published the three-state validator FIRST, in SDD#512/#516).
updated: "2026-08-02"   # Changelog moved to registry/CHANGELOG.md (.github#129 / review M4): prepend one dated entry there per change and set this date to match. Kept short deliberately — the typed validator does not read this comment.

repos:
  sdd:        { name: FS.GG.SDD,        role: "Lifecycle CLI to scaffold a workspace and drive it from charter to ship; ships the typed cross-repo contracts" }
  rendering:  { name: FS.GG.Rendering,  role: "The UI framework — MVU over SkiaSharp/OpenGL with layout, input, controls and themes, plus the fs-gg-ui template" }
  governance: { name: FS.GG.Governance, role: "Optional tooling that checks your artifacts against rules you control — advisory by default" }
  templates:  { name: FS.GG.Templates,  role: "Wires SDD, Rendering and Governance into one ready-to-run workspace at scaffold time" }
  github:     { name: FS-GG/.github,    role: "cross-repo contract registry, org-shared build config, coordination + decision docs" }   # .github#135: now a first-class consumer/edge node (registry-schema) — not just a contract owner (shared-build-config).
  game:       { name: FS.GG.Game,       role: "Game-simulation libraries — a render-independent simulation core with a companion renderer, usable as plain F# libraries" }   # the platform's sixth repo (P2 stand-up, .github#216); registered here at P5 as a contract owner + edge node.
  audio:      { name: FS.GG.Audio,      role: "Audio-engine libraries — synthesis, playback and mixing (buses, fades, ducking, 3D), with an optional Elmish adapter" }   # the platform's seventh repo; standalone SDD-driven component, transferred into the org + first release 0.1.0-preview.1.
  net:        { name: FS.GG.Net,        role: "Networking/transport libraries — protobuf messaging over WebSocket or gRPC, render-independent, with an optional Elmish adapter" }   # the platform's eighth repo; standalone component, rostered at creation (.github#1223), first release 0.1.0 (v0.1.0, 2026-07-19).

# Versioned contracts and where they are owned/consumed.
#
# FIELD VOCABULARY (M5 — .github#131, review §3). The typed validator (`fsgg-sdd registry validate`,
# Fsgg.Registry) treats most fields as OPTIONAL because they are entry-specific; this block documents
# the intended meaning so a future validator can tighten. This schema is ITSELF a governed contract now
# (report §6.9 / .github#135 → the `registry-schema` contract below + ADR-0015): growing it — a new field
# or a tightened rule — is a registered contract-change (bump `registry-schema.version` + the top-level
# `schemaVersion`, and advance the gate's FS.GG.SDD.Cli pin to a CLI carrying that Fsgg.Registry version).
# An OPTIONAL, ADDITIVE field COUNTS as growth (.github#686): "the validator tolerates unknown fields" is
# why the drift is SILENT — the mechanism of the M5 defect ADR-0015 exists to stop — not an exemption from
# it. The two steps happen in TWO ORDERED PRs, not one (publish-before-flip, FR-007): FS.GG.SDD teaches
# Fsgg.Registry and PUBLISHES a CLI, then .github bumps + pins to it. ADR-0015 §3 says "the SAME PR"; that
# PR cannot exist, because this document is in .github and Fsgg.Registry is in FS.GG.SDD (.github#689).
# This comment remains the schema-of-record for reviewers.
#   contract entries (`contracts:` list):
#     id            (required) contract id, referenced by dependency edges + coherence rows.
#     version       (required) SemVer of the contract SURFACE/SOURCE — EXCEPT `fs-gg-ui-template`, where
#                   `version` is the FRAMEWORK pin (FsGgUiVersion, the generated product's FS.GG.UI.* pin)
#                   and is DISTINCT from `package-version` (the template package). For fsgg-contracts,
#                   `version` == the FS.GG.Contracts SOURCE SemVer ON `FS-GG/FS.GG.SDD@main` (fsproj
#                   <Version> == Fsgg.ContractVersion.value) and is the ONE gate-coupled scalar —
#                   asserted by source-coherence.yml (scripts/check-source-coherence.py, .github#741).
#                   IT IS A SOURCE VERSION, NOT A PACKAGE VERSION, and the two are genuinely different
#                   facts: `package-version` below is what is LIVE ON THE FEED. Read them together —
#                   `version` alone never tells you what a consumer can restore.
#                   THE GATE THAT ASSERTS THIS IS `.github`-LOCAL, DELIBERATELY (.github#741). It used
#                   to live in the REUSABLE contract-coherence.yml, which six repos call — so this
#                   scalar disagreeing with SDD's `main` for even a minute wedged every PR in the org,
#                   and no landing order avoided it (no PR spans both repos; FS.GG.SDD#432). Keeping
#                   the assertion here, where the registry lives, means a bump reds only the repo that
#                   can fix it. Do not move it back into a reusable workflow.
#     owner         (required) the repo key (see repos:) that is the source of truth for the surface.
#     surface       (required) prose/one-line description of the on-disk or package surface.
#     consumers     (required, MAY BE EMPTY as of schemaVersion 2 / .github#1114) repo keys that depend on
#                   the contract. A present-but-EMPTY `consumers: []` is a legal, honest value — it says
#                   "this contract has no in-graph consumer", the true state of a package-bearing contract
#                   that nothing restores (`new-sdd-workspace`: a `dotnet new` tool humans install). It is
#                   NOT the same as OMITTING the field (still an error). The three-state distinction
#                   (absent / empty / non-empty) is modelled in Fsgg.Registry as `ConsumerDeclaration`
#                   (SDD#508, mirroring `MirrorDeclaration`); do NOT invent a fictional consumer to avoid
#                   an empty list — `fsgg-surface-impact` would then enforce an edge that does not exist.
#     package-version  present ONLY where the contract ships as a NuGet package (fsgg-contracts,
#                   governance-reference-gate-set, fs-gg-ui-template, game-sim-core, game-scene-adapter,
#                   fs-gg-audio) — the NEWEST version LIVE on the org feed (publish-before-flip FR-007:
#                   it never leads `version`). Since .github#267 this is ENFORCED against the live feed
#                   by scripts/check-feed-coherence.py (coherence id registry-feed-coherence), which also
#                   maps each of these ids to its package id(s). Adding a `package-version` to a contract
#                   means adding it to that gate's CONTRACT_PACKAGES table — the gate fails until you do.
#                   MUST be a QUOTED string: unquoted, YAML coerces `1.10` to the float 1.1.
#     package-tag   present ONLY for fs-gg-ui-template — the immutable coherent-set release tag.
#     range         accepted SemVer range for consumers (scaffold-provenance, governance-handoff).
#     bundles       contract ids a meta/content package subsumes (governance-reference-gate-set).
#     parameters / profiles / minimum-fsgg-sdd / root-buildable / behavior-break — contract-specific
#                   structured sub-blocks (scaffold-provider, fs-gg-ui-template); each is documented inline.
#     validator     present ONLY for `registry-schema` — the gate pin (FS.GG.SDD.Cli in contract-coherence.yml)
#                   that validates THIS document; couples a schema-version advance to a validator-pin advance
#                   (.github#135 / ADR-0015), so the additive-tolerance degradation of H2/#127 cannot recur.
#   coherence entries (`coherence:` list):
#     id, coherent (bool — the assertion), owner  (required); `coherent:false` is a standing cross-repo request.
#     summary / note / impact / resolved_by / tracking / enforcement / unified_by — OPTIONAL prose;
#                   date-stamp or past-tense historical claims (report §6.6) so present-tense text does not rot.
contracts:
  - id: scaffold-provider
    version: "1.1.0"   # 1.1.0 (2026-07-05, additive): optional identifierParameter sink (SDD feature 080; Fsgg.Provider.ProviderDescriptor.IdentifierParameter). Backward-compatible — a descriptor that omits it parses to None and behaves as 1.0.0. PRIOR 1.0.0.
    owner: sdd
    surface: ".fsgg/providers.yml + provider invocation protocol (dotnet new wrapper)"
    consumers: [templates, rendering]   # rendering authors a provider descriptor; templates registers one
    # ADR-0005: the canonical product-name parameter is `name` (was `productName`); invocation passes --param name=<product>.
    parameters:
      name:
        type: "string (product name)"
        notes: "Canonical scaffold product-name param. Supersedes the drifted `productName` spelling (ADR-0005)."
      identifierParameter:
        type: "string (optional; the forwarded param key that receives the SDD-derived valid-F# identifier)"
        notes: >
          1.1.0 (SDD feature 080, FS.GG.Rendering#142). Optional descriptor field: names the parameter
          into which `fsgg-sdd scaffold` forwards a name already derived into a legal F# namespace, so a
          product whose name is a legal product name but an illegal F# identifier (e.g. hyphenated
          `Roquelike-DungeonCrawler`) compiles. `None` ⇒ no derivation, identical to 1.0.0. Rendering
          declares `identifierParameter: rootNamespace` (FS.GG.Templates rendering.providers.yml). The
          derived value fills namespace/module/open positions; nameParameter keeps the raw name in
          string/path/.fsproj/.slnx. See coherence id `scaffold-provider-identifier`.
