    note: >
      NOTHING GATES THESE TWO AGAINST EACH OTHER, which is the reason this row exists rather than a
      red check. The contract-coherence workflow asserts the declared `fsgg-contracts` version against
      the FS.GG.Contracts PACKAGE version; no gate compares a contract's declared `version` against the
      `contractVersion` its own emitter stamps. The drift is therefore SILENT — instance (j) of epic
      .github#266's own signature: a green tick over a divergence nobody declared. Recorded, not
      discovered later.
    impact: >
      Bounded today, and unbounded at the flip. A Governance consumer that pins on the artifact's
      self-declared `contractVersion` reads 1.0.0 and cannot know the new id is reachable — but the id
      is unreachable in practice while `--require-observed` stays default-off (FS.GG.SDD#422), so no
      consumer can currently meet an undeclared value. That protection ENDS when the default flips (the
      schema major ADR-0035 gates on "once the fleet is green"): at that point an unbumped emitter
      hands Governance a `ship.unobservedEvidence` under a `contractVersion` that never declared it,
      which is precisely the failure the ADR ordered this bump to prevent.
