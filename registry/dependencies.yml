      producer content (template/product-skills + skill-manifest; the skill bytes are byte-identical,
      P4 / FS.GG.Game#4). Distinct from game-extraction: that flips at P5 (packages published, majors
      released); THIS persists past P5 until the sequel provider epic exists.
    impact: >
      No consumer contract changes between the two copies — the skill bodies are byte-identical (equal
      sha256) and Rendering's `--profile game` behaviour is unchanged (frozen). The only cost is the
      duplicated maintenance surface: a game-skill body edit must land in both repos until the freeze is
      retired. Tracked so it can't be silently forgotten (ADR-0022 §6).
    resolved_by: >
      Flips coherent:true when the sequel provider epic (P6, named future work — NOT this plan) ships
      the consumer `game` scaffold provider (Templates descriptor + FS.GG.Game.Template provider +
      composition lane) and RETIRES Rendering's frozen `--profile game`, leaving a single source of the
      game starter + skills in FS.GG.Game.
    tracking: "https://github.com/FS-GG/.github/issues/213 (epic); https://github.com/FS-GG/.github/issues/218 (P4 freeze); ADR-0022 §6 (freeze) / §2.1 (provider deferred to P6)"
  - id: registry-feed-coherence
    coherent: true
    owner: github
    summary: >
      .github#267 (epic #266, fails-open coherence gates): every contract carrying a
      `package-version` now has that literal compared against the newest version LIVE on the org
      GitHub Packages feed (nuget.pkg.github.com/FS-GG). Before this, contract-coherence.yml
      validated the registry against its SCHEMA and its PROJECTION but never against REALITY, so
      publish-before-flip (FR-007) was a convention with no enforcement: step 1 (publish) was gated
      hard, step 2 (flip) was gated by nobody noticing. It drifted three times — .github#250
      (fs-gg-ui-template 0.3.0-preview.1 published 2026-07-07, registry advertised 0.2.0 for a day,
      two registry PRs landing on the stale row); the 0.4.0-preview.1 flip that was never made at
      all (reconciled in .github#265); and .github#263 (the same shape one layer up, the gate's own
      FS.GG.SDD.Cli pin frozen at 0.5.0 across three published CLIs). Each drift was in the SAFE
      direction (feed ahead of registry), which is luck, not design.
    enforcement: >
      2026-07-09 (.github#267): scripts/check-feed-coherence.py, run by
      .github/workflows/feed-coherence.yml on every PR touching registry/dependencies.yml, on push
      to main, and DAILY on a schedule — the schedule is the load-bearing trigger, because a release
      that publishes without flipping the registry touches no file in this repo and so no
      path-filtered trigger can see it. Both drift directions fail with distinct messages: BEHIND
      the feed (a release published, the registry was never flipped — the observed failure) and
      AHEAD of it (the registry advertises a version consumers cannot restore — the FR-007
      inversion, never yet observed and equally undetected). Per the epic's rule the gate FAILS
      CLOSED: an unreadable feed, a 404 package, a missing token, an unrecognised feed response, a
      zero-version package, an unparsable literal, or a package-bearing contract with no mapped
      package id is an ERROR, not a skip. Versions compare by NuGet ORDER, never by substring (the
      .github#268 defect class, where `0.4.0` matches inside `0.4.0-preview.1`), admitting the
      4-segment grammar (governance-reference-gate-set 1.2.1.1, ADR-0007). The gate reads the NuGet
      v3 flat-container index — what a `dotnet restore` actually resolves against — rather than the
      packages REST API, which does not accept the run-scoped GITHUB_TOKEN. Its own fixture
      (tests/feed-coherence/) proves each failure leg fires for its stated reason, so the gate
      cannot decay into the vacuous "must fail" test the epic also names (SDD#299); it is
      mutation-tested against 17 deliberate fails-open regressions. Two further surfaces are closed
      by construction: an UNQUOTED `package-version` fails (YAML coerces 1.10 -> the float 1.1), and
      the `--fixture` flag that serves a canned feed refuses to run unless the test harness sets
      FSGG_FEED_FIXTURE_OK=1, so a stray `--fixture` in CI fails instead of no-opping the gate.
    impact: >
      A PR that flips `package-version` to a version not on the feed fails CI, and a release that
      publishes without flipping the registry turns .github@main red within a day. The six
      package-bearing contracts (fsgg-contracts, governance-reference-gate-set, fs-gg-ui-template,
      game-sim-core, game-scene-adapter, fs-gg-audio) are covered; fs-gg-audio's four packages are
      each compared, so a partial coherent-set publish is reported rather than hidden behind .Core.
      A NEW package-bearing contract must be mapped in the gate's CONTRACT_PACKAGES table, and
      forgetting to fails the gate rather than silently narrowing its coverage. Verified live at
      adoption: all six equal the feed's newest (1.4.0 / 1.2.1.1 / 0.4.0 / 0.2.0 / 0.2.0 /
      0.1.0-preview.1).
    resolved_by: FS-GG/.github#267 (gate + fixture + workflow; this registry PR registers the coherence id)
    tracking: "https://github.com/FS-GG/.github/issues/267 (child of the fails-open epic https://github.com/FS-GG/.github/issues/266)"
  - id: pin-feed-coherence
    coherent: true
    owner: github
    summary: >
      .github#263 (epic #266, fails-open coherence gates): the EMBEDDED version pins in this repo —
      the literals carrying a `# renovate: datasource=.. depName=..` annotation — are now compared
      against the newest version LIVE on the org feed, and the Renovate mechanism that is supposed to
      bump them is itself gated. registry-feed-coherence (.github#267) does this for the registry's
      `package-version` rows; this is the same question one layer up, for the pins the gates
      themselves run on. The subject: contract-coherence.yml installs the TYPED registry validator at
      a pinned FS.GG.SDD.Cli version, and the registry row `registry-validator-typed` asserts
      coherent:true on the strength of that pin tracking feed-newest — because under the registry's
      additive tolerance a frozen typed validator silently degrades toward a "does the YAML parse"
      check. Nothing enforced it. The pin froze at 0.2.1 while the org shipped 0.5.0 (.github#127,
      "H2"), was advanced by hand, and froze AGAIN at 0.5.0 while the org shipped 0.6.0, 0.7.0 and
      0.8.0 (.github#263) — found by eye during the v0.9.0 release, three minors late, both times.
      ROOT CAUSE (found in .github#263, previously three unverified hypotheses): `.github`'s own
      renovate.json carried NO feed `hostRules` token. FS.GG.* resolves only from the private org
      GitHub Packages feed, and Renovate does not substitute `{{ secrets }}` inside a preset pulled
      via `extends`, so the token must live in each repo's OWN config. All four product repos carry
      it; `.github` — which AUTHORS the preset and dogfoods it — never adopted its own requirement,
      on the recorded belief that "the FS.GG.* rules are inert here (no FS.GG.* PackageReferences)".
      An annotated tool pin is an FS.GG.* dependency too. Every FS.GG.* lookup therefore 401'd, no
      versions could be enumerated, and no bump PR could ever open. The symptom was recorded twice —
      "only third-party Renovate PRs observed so far", in this registry and in the fabric guide — and
      read as a pending milestone rather than as a fault.
    enforcement: >
      2026-07-09 (.github#263): scripts/check-pin-coherence.py, run by
      .github/workflows/pin-coherence.yml on every PR touching the pins, the preset, the gate or its
      fixture, on push to main, and DAILY on a schedule — the schedule is the load-bearing trigger,
      exactly as for registry-feed-coherence: a CLI release that leaves the pin behind touches no file
      in this repo, which is why three minors passed unseen. It asserts BOTH halves of "this pin can
      move, and it has moved": FRESHNESS (every annotated pin equals feed-newest, failing in both
      directions — behind = the freeze; ahead = a version no consumer can restore) and MECHANISM (this
      repo's Renovate config carries a `hostRules` token for nuget.pkg.github.com, without which no
      FS.GG.* pin can ever be bumped). The gate's SUBJECT is the org preset's own annotation regex,
      read from default.json rather than re-specified, over the manager's own managerFilePatterns,
      minus the paths Renovate's ignorePaths excludes (config:recommended -> :ignoreModulesAndTests):
      gate and bot cannot disagree about what a pin is, so a reformat that blinds the manager also
      reds the gate, and the gate never reds over a pin the bot was never going to bump. That last
      clause is not theoretical — the gate's own fixture is a `.sh` file matching the manager's
      patterns, and its heredoc test data reddened the first live run. Per the epic's rule it FAILS
      CLOSED: a missing/empty/wrong-host token, no Renovate config, a preset with no annotation
      manager, ZERO pins matched repo-wide, a pin named in REQUIRED_PINS gone invisible to that regex,
      an unresolvable datasource or non-FS.GG package, an unreadable feed, a 404, zero versions, or an
      unparsable literal is an ERROR, not a skip. Versions compare by NuGet ORDER, never by substring
      (.github#268). REQUIRED_PINS is the fail-closed answer to the case a scan cannot see: a gate
      that scans with the regex under suspicion sees exactly the nothing the bot sees, so the pins
      this repo is known to carry are named explicitly and a DISAPPEARANCE is red. Feed reads and
      NuGet ordering are shared with check-feed-coherence.py via scripts/fsgg_feed.py, so the two
      gates cannot drift into disagreeing about version order. Its fixture (tests/pin-coherence/)
      asserts every failure leg fires for its stated REASON, not merely non-zero — the vacuous
      "must fail" defect the epic also names (SDD#299) — and is mutation-tested against 7 deliberate
      fails-open regressions (mechanism check never raises; freshness always OK; required-pin assert
      no-op; substring compare instead of order; zero-pins tripwire removed; a non-FS.GG package
      silently skipped; the ignorePaths guard disabled; Renovate's config-resolution order reversed),
      all caught. The config it reads is the one Renovate WOULD read (documented resolution order):
      a token-bearing `.renovaterc` masking a token-less `.github/renovate.json` would otherwise
      report green while the bot went on 401'ing — this epic's defect class rebuilt inside the gate
      meant to close it.
    impact: >
      The .github#127 / .github#263 freeze cannot recur undetected: a CLI publish that leaves the pin
      behind turns .github@main red within a day, and a PR that drops the feed token fails CI. The
      pin is bot-managed again rather than a release-runbook chore, which is what .github#263's ask 2
      proposed while the mechanism was still unproven — enforcement at the point of use, not prose in
      a runbook. `registry-validator-typed`'s coherent:true is now EARNED rather than assumed: the
      typed validator can no longer silently degrade toward a YAML-parses check. A NEW annotated pin
      is discovered by the scan and checked like any other; naming it in REQUIRED_PINS additionally
      buys detection of its disappearance. Verified live at adoption: the one annotated pin
      (FS.GG.SDD.Cli 0.9.0 in contract-coherence.yml) equals the feed's newest, and renovate.json now
      carries the token. NB this does NOT by itself flip cross-repo-auto-update, which awaits an
      OBSERVED green FS.GG.* Renovate sweep; it removes the one blocker known to have prevented one
      in this repo.
    resolved_by: FS-GG/.github#263 (gate + fixture + workflow + the renovate.json hostRules fix; this registry PR registers the coherence id)
    tracking: "https://github.com/FS-GG/.github/issues/263 (child of the fails-open epic https://github.com/FS-GG/.github/issues/266)"
