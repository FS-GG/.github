    # 1.5.0 (Governance#324/PR#325, merge 9243c07): MINOR adds the canonical fail-closed
    # production-journey evidence floor. Governance release run 30215484433 published the package.
    # Feed: PUBLISHED — live at 1.5.0 on GitHub Packages (record 1068393740) and nuget.org;
    # all 13 non-signature payload paths and bytes match across feeds. Templates#305 owns the
    # downstream overlay adoption, so the historical Templates edge below remains at its real pin.
    surface: >
      FS.GG.Governance.ReferenceGateSet content package —
      contentFiles/any/any/.fsgg/{governance,capabilities,policy,tooling}.yml, byte-identical to
      samples/sdd-reference-gate-set/.fsgg/; version-derivation rule per ADR-0055.
    consumers: [templates]   # Templates#14 overlay drift gate (git diff --exit-code)
    bundles: [governance-policy, governance-capabilities, governance-tooling, governance-descriptor]
  - id: fs-gg-ui-template
    # CURRENT PACKAGE — TEMPLATE 0.24.0 / FRAMEWORK PIN 0.21.1
    # (Rendering#1084/PR#1087, merge e2d860bc): completes `template/base/` to all three ADR-0011
    # skill roots, so a scaffolded consumer now receives `template/base/.codex/skills/fs-gg-project`
    # where 0.23.0 gave only `.claude` and `.agents`. New content in scaffolded output is additive,
    # which is why it is a MINOR and not 0.23.1: a patch would drop new directories into projects
    # pinned to 0.23.x. This is a template-only cut; no FS.GG.UI framework member moved.
    version: "0.21.1"   # FRAMEWORK PATCH 0.21.1 (Rendering#1072/PR#1077, merge 9b1824e1): fail-closed representative-workload provenance and independent critic binding. HELD AT 0.21.1 ACROSS THE 0.24.0 TEMPLATE CUT, AND THAT IS AN EXPLICIT DECISION, NOT AN OMISSION (.github#1604 criterion 3 / .github#1561): this scalar is the FRAMEWORK pin (`FsGgUiVersion`, the generated product's FS.GG.UI.* pin), a DIFFERENT AXIS from the template package beside it, so it does not track a template-only cut. Decided against the PACKED BYTES, not against the release note — the published FS.GG.UI.Template 0.24.0 .nupkg was fetched from nuget.org's flat container and read: `content/template/base/Directory.Packages.props` declares `<FsGgUiVersion>0.21.1</FsGgUiVersion>`, and all thirteen `FS.GG.UI.*` `PackageVersion` entries in that file resolve through that single property. Corroborating and NOT relied on alone: FS.GG.Rendering's newest framework tag is still `fs-gg-ui/v0.21.1` (matching-refs `tags/fs-gg-ui/v0.2` lists v0.2.0-preview.1, v0.20.0, v0.21.0, v0.21.1 and nothing above), and `pin <= package` still holds (0.21.1 <= 0.24.0). PRIOR — 0.21.0.
    package-version: "0.25.1" # TEMPLATE-ONLY 0.25.1, Rendering#1155/#1157 and PRs #1156/#1158; published by release-tags run 30568765092 from dcd1c55c. The attempted 0.25.0 cut failed its pre-publish package gate, so no 0.25.0 tag or package exists; 0.25.1 is the first published release in this sequence. Independent verification opened both feeds and compared all 1,914 payload files byte-for-byte. The packed template pins FS.GG.UI.* at 0.21.1 and FS.GG.Contracts at 7.5.2. PRIOR — 0.24.0.
    package-tag: "fs-gg-ui-template/v0.25.1" # Ordered template-only tags fs-gg-ui-template/v0.25.1 -> v0.25.1 both resolve to dcd1c55c637ebb9d8ad8ff39698e59d613a7a127. No framework tag was re-cut because FsGgUiVersion remains 0.21.1. PRIOR — fs-gg-ui-template/v0.24.0.
    # visibility: PUBLIC — Feature 218 (FS.GG.Rendering#26): the whole coherent set (template + 16 FS.GG.UI.* libs) flipped private→PUBLIC so consumer-CI tokens install+restore without exit-103 (internal unavailable — FS-GG is a free, non-enterprise org; public matches the FS.GG.*.Cli norm)
    owner: rendering
    surface: "dotnet new fs-gg-ui (template/base) + FS.GG.UI.* framework packages"
    consumers: [templates, sdd]
    # ADR-0008 (.github#87, sub-issue of #85): the ORCHESTRATOR axis. A scaffolded product on this
    # pin has TWO inputs — template@<pin> (governed here) AND the fsgg-sdd CLI@<installed> (was
    # ungoverned). The CLI seeds artifacts a product on this pin is EXPECTED to contain: the
    # fs-gg-sdd-* process skills (FS.GG.SDD Feature 051) and .fsgg/early-stage-guidance.md (Feature
    # 049). The coherent set therefore carries a MINIMUM coherent fsgg-sdd version — the oldest CLI
    # that seeds them. See coherence id `fsgg-sdd-orchestrator-axis`.
    minimum-fsgg-sdd:
      version: "0.6.0"         # PINNED (FR-007 satisfied): FS.GG.SDD released v0.6.0 (2026-07-04;
                               # FS.GG.SDD.Cli 0.6.0 on the org feed + nuget.org), shipping feature 073
                               # (transient-artifact taxonomy): fsgg-sdd now SEEDS a .gitignore for
                               # regenerable output into scaffolded products. Per the maintainer decision
                               # that a product on this pin MUST contain the seeded .gitignore, this grew
                               # the expected seeded-artifact surface, so per FR-011 the minimum coherent
                               # CLI ADVANCES 0.4.0->0.6.0 (0.6.0 is the oldest published CLI that seeds
                               # the .gitignore; 0.5.0 did not). Advancing the minimum FLIPS the coherence
                               # row `fsgg-sdd-orchestrator-axis` coherent:true->false until the Templates
                               # provider descriptor re-mirrors this (minimumFsggSdd 0.4.0->0.6.0 — standing
                               # request FS.GG.Templates#99). PRIOR advances: 0.3.0->0.4.0 (feature 056
                               # 3-root skill union; re-cohered via Templates#49/PR#51, 574e90c, 2026-07-02)
                               # and the original 0.3.0 lockstep (epic #85).
      requires: "FS.GG.SDD Feature 049 (early-stage-guidance) + Feature 051 (seeded fs-gg-sdd-* process skills) + Feature 056 (3-root byte-identical skill union) + Feature 073 (seeded .gitignore for regenerable output)"
      adr: "docs/adr/0008-fsgg-sdd-cli-first-class-member-of-coherent-set.md"
      tracking: "https://github.com/FS-GG/FS.GG.Templates/issues/99 (provider re-mirror 0.4.0->0.6.0 — THIS advance); https://github.com/FS-GG/FS.GG.SDD/issues/49 (CLI stamps used+minimum in scaffold-provenance + warns)"
      provider-descriptor: "FS.GG.Templates providers/rendering.providers.yml (FS.GG.Templates#99)"
    # Feature 212 (FS.GG.Rendering#9), released as the coherent set 0.1.52-preview.1 (Feature 215):
    # the template now GUARANTEES a root-buildable generated product. Additive (no behavior break);
    # emitted for every profile × lifecycle, byte-neutral across designSystem. SDD composition-
