    # or schema (content-only >= PATCH; a change a consumer drift gate must re-pin to absorb >= MINOR;
    # a break >= MAJOR) = 1.5.0 today. It no longer encodes the contained schemaVersions; those move
    # INTO the package as a machine-readable schema-manifest.json ({governance, capabilities, policy,
