# FS-GG org repo roster — the single authoritative list of the framework repos the org-level
# fabrics iterate, and the capabilities each one participates in. Sibling of
# registry/dependencies.yml (cross-repo contracts) and registry/skills.yml (skills). ADR-0019.
#
# WHY THIS EXISTS. The same set of framework repos was redeclared by hand in ~10 places
# (scripts/apply-labels.sh, the dispatch/coherence/lockfile-sync/contract-coherence/skill-union
# workflows, the NewSddWorkspace scaffolder). Adding or retiring a repo meant editing all of them,
# and they drifted. This roster is the ONE place that list lives; every fabric reads it, so growth
# is a data change (one row + a changelog line + re-sync) gated by a coherence check — never a code
# edit. It is the participant-side analog of skills.yml: where skills.yml gates skill EMISSION per
# scaffold profile via `materializes-when`, this gates repo PARTICIPATION per fabric via `receives`.
#
# AUTHORITY. `.github` is the producer/authority — it holds the canonical fabrics and the
# coordination kit and mirrors them out (it is the analog of `fsgg-sdd` for product skills). The
# authority repo is therefore the SOURCE of the coordination kit, not a receiver of it.
#
# GOVERNANCE. Schema growth (a new field or a new `receives` capability) is a governed change:
# bump `schemaVersion` when the SHAPE changes, always set `updated:` to match the newest change,
# and prepend one dated entry to registry/repos.CHANGELOG.md. Validated by scripts/repos.sh
# (shell + jq; kept self-contained in .github, deliberately not the SDD-owned typed validator).
# This file is the authoritative form and is read directly — the former docs/registry/repos.md
# projection was removed as an ungated hand-authored duplicate (D4 of #1158, #1163).
#
# `receives` VOCABULARY (the controlled set the validator admits). Every word here MUST have a
# `capabilities:` row declaring how it is DETECTED at a receiver — a word that is legal to receive and
# impossible to check is a green nobody earned (#628):
#   labels             — the shared cross-repo labels (scripts/apply-labels.sh)      [push:     authority-pushed]
#   coordination-kit   — coordination skills, the fsgg-coord client + the engine manifest [workflow: coordination-coherence.yml]
#   build-config       — the org-shared .NET build config from FS.GG.Kit [materializer: build-config]
#   lockfile-sync      — the reusable lockfile-sync workflow                          [workflow: lockfile-sync.yml]
#   contract-coherence — the reusable contract-coherence gate                         [workflow: contract-coherence.yml]
#   skill-union        — the FULL three-root skill union over the repo's OWN committed roots [caller: skill-union]
#
# A `receives` row is a CLAIM ABOUT REALITY, and it goes stale silently. `lockfile-sync` is the
# proof: six repos really wired the reusable workflow, nobody added the rows, and `repos-audit`
# went right on reporting green over a capability it believed had no receivers (#503). The audit
# now closes that loop in BOTH directions — a rostered repo that is not wired is a gap, and a wired
# repo that is not rostered is drift — so this list can no longer rot without a red check. Do not
# hand-maintain it against intent; maintain it against what the callers actually do.
#
# `kit-delivery` (per repo; ADR-0062 / #1287) — HOW a coordination-kit receiver takes the kit. It once
# decoupled the byte-copy PUSH from the drift CHECK that `receives: coordination-kit` used to fuse:
#   package   — the receiver references the versioned `FS.GG.Kit` package and MATERIALIZES the kit from
#             its pin; a Renovate bump + `kit-materialize.yml` refresh the committed kit ON A BRANCH.
#             `coordination-coherence` checks the materialized bytes against canonical (pin==latest, so
#             the check is undisturbed). THIS PATH IS AUTOMATIC UP TO THE MERGE AND MANUAL AT IT — see
#             the next paragraph, which is the part this sentence used to leave to the reader.
#   byte-copy (the schema default when the field is ABSENT) — the RETIRED path: the authority opened a
#             sync PR via `coordination-propagate`; the receiver committed the bytes. Every receiver now
#             reads `package`, so `coordination-propagate` (the byte-copy PUSH) was retired in #1262
#             step 3. `coordination-coherence` (the CHECK) and `scripts/coordination-sync` + its selftest
#             STAY — the check still verifies each receiver's materialized kit against canonical.
# Legal only on a coordination-kit receiver, and only ever WRITTEN as `package` (absent == byte-copy).
# `repos.sh validate` enforces the vocabulary and the receiver requirement.
#
# `package` DOES NOT SELF-LAND, AND THAT IS THE DECISION, NOT AN OMISSION (#1565). The bullet above
# once read "they replace the sync PR", which is true of the BRANCH and false of the LANDING, and the
# difference is the whole delivery lag. What the fabric does on its own: Renovate proposes the pin
# bump, `kit-materialize.yml` re-materializes on that branch and pushes, `coordination-coherence`
# re-evaluates the freshened tree. What it never does: merge. NOBODY AND NOTHING MERGES A KIT BUMP PR.
#
# MEASURED 2026-07-27, not inferred. 16 `renovate/fs.gg.kit-*` PRs exist org-wide all-time (SDD 3,
# Rendering 5, Game 4, Governance 4; Templates/Net/Audio 0 — see #1564 and #1552 for why those three
# could not open one). FOUR have ever merged: FS.GG.SDD#671, FS.GG.Rendering#1027, FS.GG.Game#484,
# FS.GG.Governance#303, all of them 0.8.0, all within 28 minutes of each other (07:21:23Z-07:49:04Z),
# all `mergedBy` a HUMAN account, all with `autoMergeRequest: null` and zero reviews. Each carries the
# `chore: materialize FS.GG.Kit` commit from `kit-materialize.yml`, so the automatic half demonstrably
# worked on every one of them and stopped exactly where it was built to stop. The remaining three
# (Rendering#1088, Game#514, Governance#333, all 0.10.0) are open as this lands.
#
# IT IS NOT BRANCH PROTECTION AND NOT A RED GATE, which are the two things anyone checks first.
# `required_pull_request_reviews` is null on main in all three of those repos, and Game#514 and
# Governance#333 both report `mergeStateStatus: CLEAN` with every check green — mergeable right now,
# by anyone with write, and unmerged. It is not the materialize commit re-triggering either: that is
# `gitIgnoredAuthors` (#1533), which parks the BRANCH, and these branches are not parked. The cause is
# the plain one: no automation is armed and no human is assigned. `automerge` appears ZERO times in the
# org preset (default.json) and zero times in all seven receivers' Renovate configs, and no workflow in
# this repo merges anything except `skill-registry-autofix.yml`, a different fabric.
#
# DO NOT "FIX" THIS BY ARMING `automerge`, and the counterexample is live rather than hypothetical.
# Renovate's `automerge` and `gh pr merge --auto` both merge on REQUIRED contexts only. FS.GG.Rendering
# requires four ("Deterministic gate", "API compatibility gate (breaking-change -> SemVer major)",
# "kit / coordination-kit", "skill-union / skill-union"); Rendering#1088's one failing check, "Template
# payload restore gate (scaffolded pins resolve, stable)", is in none of them. Arming automerge would
# have landed #1088 over a red gate — the #425 inversion that `skill-registry-autofix.yml`'s header
# already refuses `--auto` for at length. Six of the seven receivers have `allow_auto_merge: true` (Net
# is false), so the capability is present and DELIBERATELY UNARMED. If the org ever does want the kit
# to self-land, the prerequisite is making the red gates required, not lowering the bar to the ones
# that already are.
#
# SO THE TWO SIDES ARE DIFFERENTLY POWERED, and that is why the queue grows instead of oscillating:
# production is forced (`kit-published-coherence` reds main until a kit-source change is republished,
# so every item touching a kit member emits a bump) while consumption is a human clicking merge. The
# DETECTOR for the resulting lag is already live and is not this file: `scripts/repos-audit.sh`'s
# kit-pin freshness sweep (#1540) grades every receiver's pin against the newest stable FS.GG.Kit on
# nuget.org and reds daily while any receiver is behind. Nothing has to push for it to fire.

schemaVersion: 8
updated: 2026-07-27
authority: FS-GG/.github

repos:
  - { id: .github,     full: FS-GG/.github,          role: authority, receives: [labels] }                                                                                          # NOT skill-union — the AUTHORITY asserts its own roots with skill-roots-selfcheck.yml, its own workflow. See the capability row.
  - { id: sdd,         full: FS-GG/FS.GG.SDD,        role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }
  - { id: rendering,   full: FS-GG/FS.GG.Rendering,  role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }
  - { id: governance,  full: FS-GG/FS.GG.Governance, role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }
  - { id: templates,   full: FS-GG/FS.GG.Templates,  role: framework, receives: [labels, coordination-kit, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }  # NOT build-config — see below.
  - { id: game,        full: FS-GG/FS.GG.Game,       role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }
  - { id: audio,       full: FS-GG/FS.GG.Audio,      role: framework, receives: [labels, coordination-kit, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }  # NOT build-config — see below. (The org's 7th repo: in dependencies.yml since its transfer, but never rostered — so no fabric ever iterated it and no gate could say so.)
  - { id: net,         full: FS-GG/FS.GG.Net,        role: framework, receives: [labels, coordination-kit, lockfile-sync, contract-coherence, skill-union], kit-delivery: package }  # NOT build-config — has its OWN hand-authored Directory.Build.props, like audio/templates. The org's 8th repo: a render-independent transport component (protobuf over WebSocket/gRPC), onboarded under ADR-0052. Rostered at creation (unlike audio, which sat unrostered for weeks — the exact gap #269 closed). No dependencies.yml contract row yet: publish-before-flip (FR-007) — it ships one when it cuts its first release + the wire-contract schema lands (SDD#589).

# `build-config` was a legal word in `KNOWN_CAPS` that NO repo said (#626).
#
# FOUR repos — sdd, rendering, governance, game — run a `build-config-drift` job in their own
# `gate.yml`. Each explicitly enables `<FsggKitMaterializeBuildConfig>true</…>` in its
# `.config/kit/FS.GG.Kit.receiver.proj`; CI reruns `FsggKitMaterialize`, then fails if
# Directory.Build.props or Directory.Packages.props changed. Both halves are required: the opt-in
# without the diff gate can rewrite committed build inputs unnoticed, while the gate without the
# opt-in materializes no build config and passes vacuously.
#
# So the fabric was a RATCHET. Every edit to `dist/dotnet/` red-lit those four until a human hand-synced
# each one — and because the coordination kit's sync PR is a rolling branch, the red landed on the kit's
# own delivery vehicle. #627 added the coord engine to the shared tool manifest; a day later FS.GG.SDD's
# kit-sync PR was STILL blocked by the resulting drift, and the coordination kit — the one distribution
# fabric in this org that demonstrably runs — was frozen out of the largest repo. #634 found it stuck.
# The enforcement arm had taken the delivery arm hostage.
#
# The four rows above USED to be what `build-config-propagate.yml` iterated as a byte-copy PUSH; that arm
# was RETIRED in #1262 (ADR-0062). Build config now ships as the FS.GG.Kit package — each of the four
# materializes Directory.Build.props / Directory.Packages.props from a pinned FS.GG.Kit
# (FsggKitMaterializeBuildConfig), and its own `build-config-drift` job asserts the committed .props match
# that package. `build-config` is still RECEIVED (via the package), it is simply no longer pushed.
#
# TEMPLATES AND AUDIO ARE DELIBERATELY NOT RECEIVERS, and this is a REVIEWED CLAIM, not an oversight:
#   * templates has NO `Directory.Build.props` at all — it never adopted the shared config, and it does
#     not enforce it either. A bot that wrote one into it would be changing how it builds.
#   * audio HAS a `Directory.Build.props`, and it is its OWN — hand-authored and unmarked. `#387`'s guard
#     exists precisely so a re-sync REFUSES to overwrite that. Onboarding it means running
#     `sync-build-config.sh --adopt`, which moves the existing file to an imported `*.local.props`. That
#     is a deliberate call about somebody else's build, and it is not a propagate bot's to make.
#
# THE COORDINATION ENGINE IS NO LONGER COUPLED TO THIS DECISION (#1077). The `.config/dotnet-tools.json`
# that lets a repo restore `fs.gg.coord.cli` (the engine `scripts/fsgg-coord` execs) used to ride
# build-config — so templates and audio, kept off build-config for the reasons above (all about how they
# BUILD), held the `fsgg-coord` shim (a `coordination-kit` row → 6 receivers) with NO engine to exec.
# That manifest is now a `coordination-kit` row too (see `kit:` below), so it reaches every kit receiver
# regardless of build-config adoption, and `repos.sh validate` refuses to let the shim and the manifest
# ride different fabrics again. The engine question was asked and answered HERE, not silently inherited
# from the build decision above.
#
# So the claim this roster makes is falsifiable and exactly as strong as reality: **a repo receives
# build-config iff it explicitly enables package materialization AND enforces its generated result in
# CI.** #628 first closed that symmetry with the then-current `script:` detector. #1395 moves the
# detector with the delivery contract: `materializer: build-config` proves both package-era halves and
# sweeps them in both directions. A rostered repo missing either half is a GAP; an unrostered repo adding
# either half is DRIFT. Whether templates, audio, or net SHOULD adopt is a separate decision, not answered
# here by quietly listing them.

# The receiver capabilities and the detectors that make them AUDITED (scripts/repos-audit.sh). This
# is the ONE place that mapping lives. The audit used to hardcode reusable-workflow mappings
# in a `wf_for_cap` case statement and an `AUDITED_CAPS` string — the redeclared-by-hand disease
# this registry exists to cure, one layer down.
#
# Each row is audited INDEPENDENTLY. A capability that examines zero receiver-repo pairs fails the
# audit ON ITS OWN NAME, because `for repo in ∅` proves nothing: the guard used to sum the pairs
# across all capabilities, so `coordination-kit`'s six satisfied it while `lockfile-sync` and
# `contract-coherence` each iterated nothing, and the gate reported green having checked one third
# of its own mandate (#503).
#
# `receivers: none` is how a capability says it HAS no receiver, out loud and with a reason — a
# reviewed claim, exactly like `outside-fabric`. It is NOT a mute button: the audit still scans
# every rostered repo for a real caller, and a capability that claims no receivers while somebody
# actually wires it FAILS. The claim is falsifiable, so it cannot quietly become a lie.
#
# A row declares EXACTLY ONE DETECTOR — how a receiver's participation is verifiable (#628):
#   workflow:  the receiver calls .github's reusable workflow (a `uses:` of it)
#   script:    the receiver INLINES a job that runs .github's script — there is no reusable workflow
#              to `uses:`, so the workflow detector cannot see it at all
#   materializer: the receiver explicitly opts into an FS.GG.Kit materializer AND CI reruns it and
#                 fails on generated-file drift; `build-config` is the supported compound detector
#   caller:    the receiver calls one of .github's reusable workflows AGAINST A PARTICULAR SUBJECT,
#              and the `uses:` alone cannot say which subject; `skill-union` is the supported compound
#              detector. Use it when a `workflow:` row would certify a call aimed somewhere else.
#   push:      the AUTHORITY writes it into the receiver; nothing is wired receiver-side to detect
#
# AND NOTHING MAY BE `receives:`d THAT HAS NO ROW HERE. That closure is what makes the promise above
# ("this list can no longer rot without a red check") actually TRUE. It was not: `build-config` and
# `labels` were legal `receives:` words with no row, so they were swept in NEITHER direction — not
# findable as unwired, not findable as adopted-but-unrostered — and the guarantee held for three of
# five capabilities while reading, to the next person, as if it held for all five. #626 read exactly
# that way, shipped `544433a` on it, and four repos went red within twenty minutes.
capabilities:
  - { id: coordination-kit, workflow: coordination-coherence.yml }
  - { id: lockfile-sync,    workflow: lockfile-sync.yml }

  # PACKAGE-MATERIALIZED. #628's `script:` detector was correct for the old inline
  # sync-build-config.sh check, but ADR-0062/#1262 retired that wiring. The package-era contract has
  # two independently necessary halves: explicit receiver-project opt-in and CI materialize+diff
  # enforcement. The compound detector requires both and treats either unrostered half as drift.
  - id: build-config
    materializer: build-config
    reason: >-
      Delivered by the pinned FS.GG.Kit package. A receiver opts in with
      FsggKitMaterializeBuildConfig=true and its CI reruns FsggKitMaterialize, then diffs the two
      managed props. Both are required: either half alone can pass without protecting committed build
      inputs. #1395 moves the detector that #628 introduced from the retired script to this contract.

  # PUSH. `labels` is not pulled by anybody: scripts/apply-labels.sh reads THIS roster and pushes the
  # labels into each repo. So the `receives: labels` row is the INPUT to the push, not a claim about
  # the receiver's config — there is no receiver-side artifact that could falsify it, and there never
  # will be. That is a real and permanent asymmetry, and the only honest thing to do with it is SAY so
  # in a row a validator refuses to leave blank, rather than leave it a hole that reads like a licence.
  - id: labels
    push: true
    reason: >-
      Authority-PUSHED, not receiver-wired: scripts/apply-labels.sh reads this roster and creates the
      shared labels in each repo via the API (idempotent, --force). A receiver wires nothing, so there
      is no receiver-side artifact to detect and repos-audit deliberately does not sweep it. The row is
      what DRIVES the push, so it cannot go stale the way a pull capability's can — add a repo here and
      it gets labels. Recorded rather than omitted, because an omission is indistinguishable from the
      build-config hole that #628 exists to close.

  # THE FULL SKILL UNION (#1504, ADR-0065, ADR-0011). `coordination-kit`'s detector above proves the
  # KIT-OWNED SUBSET of the root invariant — the four skills the `kit:` block names, and only
  # those. This row is the capability that proves the WHOLE runtime-visible union: every skill in a
  # repo's committed `.claude/skills` and `.agents/skills`, present in every root and
  # byte-identical across them. The two are not the same claim, and the gap between them was invisible.
  #
  # THE ROOT SET IS TWO since 2026-07-28 (ADR-0067 §5, #1636); the measurement below predates that and
  # its `.codex` column is history, not a live column. The gap it records is unaffected: `.codex` and
  # `.agents` were BOTH Codex-native, so a repo short on `.agents` was short on skills for Codex either
  # way, and retiring `.codex` removes a copy rather than a runtime.
  #
  # MEASURED ON `origin/main`, 2026-07-27, and this is why the row exists: Governance holds
  # `.claude=15 .codex=4 .agents=4`; Rendering `.claude=50 .codex=4 .agents=50`; SDD
  # `.claude=32 .codex=21 .agents=4`. Every skill present in more than one root is byte-identical, so
  # nothing had DRIFTED — projections were simply MISSING, for 11, 46 and 28 skills respectively. Codex
  # and agent runtimes were handed materially smaller instruction sets than Claude while
  # `coordination-coherence` stayed green on all three, because the four kit skills really are coherent
  # in all three roots. ADR-0065's receiver rollout (#1016, Governance#298, SDD#669) then described that
  # subset result as restored three-root coherence: the co-tenant process and product skills those trees
  # were populated with by earlier writers were outside the materializer AND outside its acceptance
  # check, so they survived the migration unexamined.
  #
  # WHY `caller:` AND NOT `workflow: skill-union-assert.yml`. The reusable assertion is
  # SUBJECT-PARAMETERISED — it audits whatever `product-path:` names — and FS.GG.Templates legitimately
  # calls it against GENERATED composition products (FS.GG.Templates#49). A bare `uses:` detector cannot
  # tell "this repo gates its OWN committed roots" from "this repo gates an artifact it produced", so it
  # would hand this capability a green off a call that never looks at the receiver's roots. For this row
  # the detector's subject is not the workflow, it is what the workflow was POINTED AT — so both halves
  # are required, in ONE workflow file: a call with `product-path` absent (or `.`/`./`) and `roots`
  # absent-or-all-three, and a `pull_request` trigger that fires when any of the three roots changes. An
  # unarmed gate is not a gate (#332/#334/#880 are four hand-repairs of that exact shape), and a narrowed
  # `roots:` is a smaller audit than this capability claims. Either half alone is drift, not adoption.
  #
  # The detector PARSES the receiver's workflow YAML — it does not grep it. It began as a line scanner and
  # a review broke it with five legal YAML shapes in one sitting, two of them fail-open (a flow
  # `with: {product-path: …}`, and `with:` written before `uses:`, both of which made the subject read as
  # "absent, therefore the default, therefore the repository root"). `paths:` and `with:` are STRUCTURE,
  # and so is the question this row asks.
  #
  # THE AUTHORITY IS NOT A RECEIVER, and that is the same asymmetry as `coordination-kit`: `.github` is
  # the SOURCE of the assertion, and it asserts its own roots with `skill-roots-selfcheck.yml` — its own
  # workflow, running the bare command a worker runs. Running your own gate is not participating in
  # somebody else's fabric, so the detector deliberately does not match it and this roster does not
  # claim it. `.github`'s own coherence is proven, it is simply proven HERE.
  #
  # THIS ROW GOES RED BEFORE IT GOES GREEN, AND THAT IS THE POINT. No framework repo has wired the
  # receiver caller yet (measured 2026-07-27: zero `uses:` of skill-union-assert.yml in any of the
  # seven), so the scheduled `repos-audit` reports seven gaps until they do — and three of them cannot
  # even go green on a caller alone, because Governance, Rendering and SDD must first rematerialize
  # their partitioned roots from their authoritative producers. Those three repairs are filed and
  # sequenced as cross-repo requests; #1504's own completion bar says the rollout is not complete until
  # `scripts/skill-union-assert.sh --product <fresh tree>` passes for every audited tree AND every
  # receiver check is green. Rostering the receivers is what makes that bar VISIBLE instead of a
  # sentence in a closed issue. The alternative — `receivers: none` until somebody wires it — would have
  # recorded that nobody receives the full union, which is exactly the claim the org has now rejected.
  - id: skill-union
    caller: skill-union
    reason: >-
      The FULL three-root union over a repo's OWN committed skill roots, asserted by a
      skill-union-assert.yml caller aimed at the repository root with all three ADR-0011 roots, on a
      trigger that fires when any of them changes. Compound because the assertion is
      subject-parameterised: a call aimed at a generated product, or narrowed with roots:, proves
      nothing about the committed roots, so a bare uses: detector would be a green nobody earned
      (#628). Distinct from coordination-kit, which proves only the kit-owned four-skill subset — the
      subset was green on three partitioned trees for as long as they existed (#1504).

  # ADOPTED (#519). Was `receivers: none` + a reason, on the grounds that "whether the six
  # framework repos SHOULD adopt it is a live org question". That question was decided YES, and
  # every framework repo's CI now calls it. The claim deleted itself exactly as it said it would:
  # "When one wires it, the audit's unrostered-adopter check goes red and tells you to roster it
  # and delete this claim." The four `build-config` receivers call it with the drift leg ON (its
  # default); templates and audio pass `check-build-config: false` because they are not
  # build-config adopters — a value READ OFF the `receives:` rows above, not chosen per repo.
  - { id: contract-coherence, workflow: contract-coherence.yml }

# Repos that exist in the GitHub org and are DELIBERATELY outside every fabric. The roster is a
# closed-world assumption, and `scripts/check-roster-closure.py` (.github#269) is what asserts the
# world is actually closed: any repo live in the org but absent from BOTH `repos:` and this list
# fails CI. That is the FS.GG.Audio defect — the org's 7th repo sat outside the roster for weeks
# because "deliberately outside" and "accidentally outside" were indistinguishable to every gate.
#
# This list is what makes the distinction sayable. An entry is a REVIEWED claim, not a mute button:
# `reason` is required, a repo may not be both rostered and exempt, and an exemption naming a repo
# that no longer exists in the org fails as a stale exemption. Nothing is auto-exempt — an archived
# or forked repo still needs a row here, because "archive it" must never be a way to leave the gate.
#
# Empty today: the org's seven live repos are all rostered above.
outside-fabric: []

# The coordination kit every `coordination-kit` receiver must hold. The slice-2 sync
# (scripts/coordination-sync) writes these into each receiver; the coherence gate asserts the bytes.
#
# THE DIGESTS LIVE IN `repos.lock`, NOT HERE (#527). They used to be a `sha256:` field on each row,
# and that made this file a chokepoint: a kit source is content-addressed, so editing ANY skill — or
# `scripts/fsgg-coord`, which is itself a kit row — obliged the worker to re-pin a hash *in the middle
# of the authored roster*. Every kit edit therefore had to reserve `repos.yml` in its `Paths:`
# touch-set, and so serialised against every other kit edit AND against anyone genuinely authoring a
# roster row. Three workers deadlocked on it in one afternoon (#428).
#
# #309's rule — *a generated, CI-gated artifact must not be reserved in a touch-set* — could not reach
# it, because the rule classifies a FILE and the generated thing was a FIELD inside an authored one.
# Splitting the field out of the file is what lets the existing rule apply: `repos.lock` is emitted by
# a generator, guarded by a regeneration gate, and authored by nobody. This block is now purely
# authored — a row here is a decision, and reserving it means something again.
kit:
  - { id: cross-repo-coordination, kind: skill,  source: .claude/skills/cross-repo-coordination }
  - { id: intra-repo-parallel-work, kind: skill, source: .claude/skills/intra-repo-parallel-work }
  # Command skills — the two driver skills over the protocol the three items above define.
  # `check-board` reconciles the board against issue state; `pnext-item` drives the worker loop.
  # They hold no protocol of their own, so they carry no ADR: each cites the skill it drives.
  - { id: check-board,             kind: skill,  source: .claude/skills/check-board }
  - { id: pnext-item,              kind: skill,  source: .claude/skills/pnext-item }
  - { id: fsgg-coord,              kind: client, source: scripts/fsgg-coord }
  # The engine tool manifest (#1077). `scripts/fsgg-coord` execs `fs.gg.coord.cli` — the typed engine —
  # and THIS `.config/dotnet-tools.json` is what lets a receiver `dotnet tool restore` it. It rode
  # `build-config` (4 receivers) while the shim above rode this kit (6), so templates and audio held a
  # shim they could not run. Carrying it here makes "receives the tool ⇒ can run the tool" STRUCTURAL,
  # and `validate` asserts the shim row and this row never separate onto different fabrics again.
  # A `kind: config` row names its own `dest`: the client's destination IS its source path, a config's
  # is not (canonical under dist/dotnet/ so pin-coherence still finds it; delivered to .config/).
  - { id: coord-engine-manifest,   kind: config, source: dist/dotnet/.config/dotnet-tools.json, dest: .config/dotnet-tools.json }
