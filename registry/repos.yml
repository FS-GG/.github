# FS-GG org repo roster — the single authoritative list of the framework repos the org-level
# fabrics iterate, and the capabilities each one participates in. Sibling of
# registry/dependencies.yml (cross-repo contracts) and registry/skills.yml (skills). ADR-0019.
#
# WHY THIS EXISTS. The same set of framework repos was redeclared by hand in ~10 places
# (scripts/apply-labels.sh, the dispatch/coherence/lockfile-sync/contract-coherence/skill-union
# workflows, the NewSddWorkspace scaffolder). Adding or retiring a repo meant editing all of them,
# and they drifted. This roster is the ONE place that list lives; every fabric reads it, so growth
# is a data change (one row + a changelog line + re-sync) gated by a coherence check — never a code
# edit. It is the participant-side analog of skills.yml: where skills.yml gates skill EMISSION per
# scaffold profile via `materializes-when`, this gates repo PARTICIPATION per fabric via `receives`.
#
# AUTHORITY. `.github` is the producer/authority — it holds the canonical fabrics and the
# coordination kit and mirrors them out (it is the analog of `fsgg-sdd` for product skills). The
# authority repo is therefore the SOURCE of the coordination kit, not a receiver of it.
#
# GOVERNANCE. Schema growth (a new field or a new `receives` capability) is a governed change:
# bump `schemaVersion` when the SHAPE changes, always set `updated:` to match the newest change,
# and prepend one dated entry to registry/repos.CHANGELOG.md. Validated by scripts/repos.sh
# (shell + jq; kept self-contained in .github, deliberately not the SDD-owned typed validator).
# This file is the authoritative form and is read directly — the former docs/registry/repos.md
# projection was removed as an ungated hand-authored duplicate (D4 of #1158, #1163).
#
# `receives` VOCABULARY (the controlled set the validator admits). Every word here MUST have a
# `capabilities:` row declaring how it is DETECTED at a receiver — a word that is legal to receive and
# impossible to check is a green nobody earned (#628):
#   labels             — the shared cross-repo labels (scripts/apply-labels.sh)      [push:     authority-pushed]
#   coordination-kit   — coordination skills, the fsgg-coord client + the engine manifest [workflow: coordination-coherence.yml]
#   build-config       — the org-shared .NET build config (scripts/sync-build-config.sh)  [script: sync-build-config.sh]
#   lockfile-sync      — the reusable lockfile-sync workflow                          [workflow: lockfile-sync.yml]
#   contract-coherence — the reusable contract-coherence gate                         [workflow: contract-coherence.yml]
#
# A `receives` row is a CLAIM ABOUT REALITY, and it goes stale silently. `lockfile-sync` is the
# proof: six repos really wired the reusable workflow, nobody added the rows, and `repos-audit`
# went right on reporting green over a capability it believed had no receivers (#503). The audit
# now closes that loop in BOTH directions — a rostered repo that is not wired is a gap, and a wired
# repo that is not rostered is drift — so this list can no longer rot without a red check. Do not
# hand-maintain it against intent; maintain it against what the callers actually do.
#
# `kit-delivery` (OPTIONAL, per repo; ADR-0062 / #1287) — HOW a coordination-kit receiver takes the
# kit, decoupling the byte-copy PUSH from the drift CHECK that `receives: coordination-kit` used to
# fuse:
#   byte-copy (the DEFAULT when the field is ABSENT) — the authority opens a sync PR via
#             `coordination-propagate`; the receiver commits the bytes; `coordination-coherence`
#             checks them against canonical.
#   package   — the receiver references the versioned `FS.GG.Kit` package and MATERIALIZES the kit
#             from its pin (a Renovate bump replaces the sync PR). `coordination-propagate` SKIPS it
#             (`repos.sh list ... --kit-delivery byte-copy`); `coordination-coherence` STILL checks
#             it (materialized bytes == canonical at pin==latest, so the check is undisturbed).
# Legal only on a coordination-kit receiver, and only ever WRITTEN as `package` (absent == byte-copy),
# so a row carries it exactly while that receiver is migrated. When every receiver reads `package`,
# `coordination-propagate` + the `*-selftest` family retire (#1262 step 3). `repos.sh validate`
# enforces the vocabulary and the receiver requirement.

schemaVersion: 6
updated: 2026-07-17
authority: FS-GG/.github

repos:
  - { id: .github,     full: FS-GG/.github,          role: authority, receives: [labels] }
  - { id: sdd,         full: FS-GG/FS.GG.SDD,        role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence], kit-delivery: package }
  - { id: rendering,   full: FS-GG/FS.GG.Rendering,  role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence] }
  - { id: governance,  full: FS-GG/FS.GG.Governance, role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence] }
  - { id: templates,   full: FS-GG/FS.GG.Templates,  role: framework, receives: [labels, coordination-kit, lockfile-sync, contract-coherence] }               # NOT build-config — see below.
  - { id: game,        full: FS-GG/FS.GG.Game,       role: framework, receives: [labels, coordination-kit, build-config, lockfile-sync, contract-coherence] }
  - { id: audio,       full: FS-GG/FS.GG.Audio,      role: framework, receives: [labels, coordination-kit, lockfile-sync, contract-coherence] }               # NOT build-config — see below. (The org's 7th repo: in dependencies.yml since its transfer, but never rostered — so no fabric ever iterated it and no gate could say so.)
  - { id: net,         full: FS-GG/FS.GG.Net,        role: framework, receives: [labels, coordination-kit, lockfile-sync, contract-coherence] }               # NOT build-config — has its OWN hand-authored Directory.Build.props, like audio/templates. The org's 8th repo: a render-independent transport component (protobuf over WebSocket/gRPC), onboarded under ADR-0052. Rostered at creation (unlike audio, which sat unrostered for weeks — the exact gap #269 closed). No dependencies.yml contract row yet: publish-before-flip (FR-007) — it ships one when it cuts its first release + the wire-contract schema lands (SDD#589).

# `build-config` was a legal word in `KNOWN_CAPS` that NO repo said (#626).
#
# FOUR repos — sdd, rendering, governance, game — run a `Shared-build-config drift check` in their own
# `gate.yml`: they check out `.github` and run `sync-build-config.sh --check`, so a managed file that
# diverges from `dist/dotnet/` fails the PR. That ENFORCEMENT has been live for months. Nothing ever
# PUSHED them an update, because this capability had no receivers and no propagate arm.
#
# So the fabric was a RATCHET. Every edit to `dist/dotnet/` red-lit those four until a human hand-synced
# each one — and because the coordination kit's sync PR is a rolling branch, the red landed on the kit's
# own delivery vehicle. #627 added the coord engine to the shared tool manifest; a day later FS.GG.SDD's
# kit-sync PR was STILL blocked by the resulting drift, and the coordination kit — the one distribution
# fabric in this org that demonstrably runs — was frozen out of the largest repo. #634 found it stuck.
# The enforcement arm had taken the delivery arm hostage.
#
# The four rows above are what `build-config-propagate.yml` iterates. The push arm now exists.
#
# TEMPLATES AND AUDIO ARE DELIBERATELY NOT RECEIVERS, and this is a REVIEWED CLAIM, not an oversight:
#   * templates has NO `Directory.Build.props` at all — it never adopted the shared config, and it does
#     not enforce it either. A bot that wrote one into it would be changing how it builds.
#   * audio HAS a `Directory.Build.props`, and it is its OWN — hand-authored and unmarked. `#387`'s guard
#     exists precisely so a re-sync REFUSES to overwrite that. Onboarding it means running
#     `sync-build-config.sh --adopt`, which moves the existing file to an imported `*.local.props`. That
#     is a deliberate call about somebody else's build, and it is not a propagate bot's to make.
#
# THE COORDINATION ENGINE IS NO LONGER COUPLED TO THIS DECISION (#1077). The `.config/dotnet-tools.json`
# that lets a repo restore `fs.gg.coord.cli` (the engine `scripts/fsgg-coord` execs) used to ride
# build-config — so templates and audio, kept off build-config for the reasons above (all about how they
# BUILD), held the `fsgg-coord` shim (a `coordination-kit` row → 6 receivers) with NO engine to exec.
# That manifest is now a `coordination-kit` row too (see `kit:` below), so it reaches every kit receiver
# regardless of build-config adoption, and `repos.sh validate` refuses to let the shim and the manifest
# ride different fabrics again. The engine question was asked and answered HERE, not silently inherited
# from the build decision above.
#
# So the claim this roster makes is falsifiable and exactly as strong as reality: **a repo receives
# build-config iff it enforces build-config.** As of #628 that symmetry IS verified: the capability now
# declares a `script:` detector, so repos-audit sweeps it in both directions like any other — a rostered
# repo that stopped running the drift check is a GAP, and a repo that starts running it without saying so
# is DRIFT. Whether templates and audio SHOULD adopt is a live question, filed there — it is not answered
# here by quietly listing them, and if either one wires the check, the audit will now say so out loud.

# The capabilities that map to a reusable `.github` workflow, and are therefore AUDITED
# (scripts/repos-audit.sh). This is the ONE place that mapping lives. The audit used to hardcode it
# in a `wf_for_cap` case statement and an `AUDITED_CAPS` string — the redeclared-by-hand disease
# this registry exists to cure, one layer down.
#
# Each row is audited INDEPENDENTLY. A capability that examines zero receiver-repo pairs fails the
# audit ON ITS OWN NAME, because `for repo in ∅` proves nothing: the guard used to sum the pairs
# across all capabilities, so `coordination-kit`'s six satisfied it while `lockfile-sync` and
# `contract-coherence` each iterated nothing, and the gate reported green having checked one third
# of its own mandate (#503).
#
# `receivers: none` is how a capability says it HAS no receiver, out loud and with a reason — a
# reviewed claim, exactly like `outside-fabric`. It is NOT a mute button: the audit still scans
# every rostered repo for a real caller, and a capability that claims no receivers while somebody
# actually wires it FAILS. The claim is falsifiable, so it cannot quietly become a lie.
#
# A row declares EXACTLY ONE DETECTOR — how a receiver's participation is verifiable (#628):
#   workflow:  the receiver calls .github's reusable workflow (a `uses:` of it)
#   script:    the receiver INLINES a job that runs .github's script — there is no reusable workflow
#              to `uses:`, so the workflow detector cannot see it at all
#   push:      the AUTHORITY writes it into the receiver; nothing is wired receiver-side to detect
#
# AND NOTHING MAY BE `receives:`d THAT HAS NO ROW HERE. That closure is what makes the promise above
# ("this list can no longer rot without a red check") actually TRUE. It was not: `build-config` and
# `labels` were legal `receives:` words with no row, so they were swept in NEITHER direction — not
# findable as unwired, not findable as adopted-but-unrostered — and the guarantee held for three of
# five capabilities while reading, to the next person, as if it held for all five. #626 read exactly
# that way, shipped `544433a` on it, and four repos went red within twenty minutes.
capabilities:
  - { id: coordination-kit, workflow: coordination-coherence.yml }
  - { id: lockfile-sync,    workflow: lockfile-sync.yml }

  # SCRIPT-DELIVERED, and therefore invisible to the `uses:` detector until #628 gave it one of its
  # own. sdd/rendering/governance/game each inline a `Build-config drift check` job in their gate.yml
  # that checks .github out and runs this script — governance from `_org-build/`, the others from
  # `.github/`, which is why the detector matches the BASENAME and not a path.
  - id: build-config
    script: sync-build-config.sh
    reason: >-
      Delivered as a script, not a reusable workflow: receivers wire it by inlining a job that checks
      FS-GG/.github out and runs `sync-build-config.sh --check`. For as long as that was true it was
      outside repos-audit's mandate entirely — four repos enforced it (SDD's as a REQUIRED status
      check) while `receives:` said zero, and the audit reported green over all of them. #628.

  # PUSH. `labels` is not pulled by anybody: scripts/apply-labels.sh reads THIS roster and pushes the
  # labels into each repo. So the `receives: labels` row is the INPUT to the push, not a claim about
  # the receiver's config — there is no receiver-side artifact that could falsify it, and there never
  # will be. That is a real and permanent asymmetry, and the only honest thing to do with it is SAY so
  # in a row a validator refuses to leave blank, rather than leave it a hole that reads like a licence.
  - id: labels
    push: true
    reason: >-
      Authority-PUSHED, not receiver-wired: scripts/apply-labels.sh reads this roster and creates the
      shared labels in each repo via the API (idempotent, --force). A receiver wires nothing, so there
      is no receiver-side artifact to detect and repos-audit deliberately does not sweep it. The row is
      what DRIVES the push, so it cannot go stale the way a pull capability's can — add a repo here and
      it gets labels. Recorded rather than omitted, because an omission is indistinguishable from the
      build-config hole that #628 exists to close.

  # ADOPTED (#519). Was `receivers: none` + a reason, on the grounds that "whether the six
  # framework repos SHOULD adopt it is a live org question". That question was decided YES, and
  # every framework repo's CI now calls it. The claim deleted itself exactly as it said it would:
  # "When one wires it, the audit's unrostered-adopter check goes red and tells you to roster it
  # and delete this claim." The four `build-config` receivers call it with the drift leg ON (its
  # default); templates and audio pass `check-build-config: false` because they are not
  # build-config adopters — a value READ OFF the `receives:` rows above, not chosen per repo.
  - { id: contract-coherence, workflow: contract-coherence.yml }

# Repos that exist in the GitHub org and are DELIBERATELY outside every fabric. The roster is a
# closed-world assumption, and `scripts/check-roster-closure.py` (.github#269) is what asserts the
# world is actually closed: any repo live in the org but absent from BOTH `repos:` and this list
# fails CI. That is the FS.GG.Audio defect — the org's 7th repo sat outside the roster for weeks
# because "deliberately outside" and "accidentally outside" were indistinguishable to every gate.
#
# This list is what makes the distinction sayable. An entry is a REVIEWED claim, not a mute button:
# `reason` is required, a repo may not be both rostered and exempt, and an exemption naming a repo
# that no longer exists in the org fails as a stale exemption. Nothing is auto-exempt — an archived
# or forked repo still needs a row here, because "archive it" must never be a way to leave the gate.
#
# Empty today: the org's seven live repos are all rostered above.
outside-fabric: []

# The coordination kit every `coordination-kit` receiver must hold. The slice-2 sync
# (scripts/coordination-sync) writes these into each receiver; the coherence gate asserts the bytes.
#
# THE DIGESTS LIVE IN `repos.lock`, NOT HERE (#527). They used to be a `sha256:` field on each row,
# and that made this file a chokepoint: a kit source is content-addressed, so editing ANY skill — or
# `scripts/fsgg-coord`, which is itself a kit row — obliged the worker to re-pin a hash *in the middle
# of the authored roster*. Every kit edit therefore had to reserve `repos.yml` in its `Paths:`
# touch-set, and so serialised against every other kit edit AND against anyone genuinely authoring a
# roster row. Three workers deadlocked on it in one afternoon (#428).
#
# #309's rule — *a generated, CI-gated artifact must not be reserved in a touch-set* — could not reach
# it, because the rule classifies a FILE and the generated thing was a FIELD inside an authored one.
# Splitting the field out of the file is what lets the existing rule apply: `repos.lock` is emitted by
# a generator, guarded by a regeneration gate, and authored by nobody. This block is now purely
# authored — a row here is a decision, and reserving it means something again.
kit:
  - { id: cross-repo-coordination, kind: skill,  source: .claude/skills/cross-repo-coordination }
  - { id: intra-repo-parallel-work, kind: skill, source: .claude/skills/intra-repo-parallel-work }
  # Command skills — the two driver skills over the protocol the three items above define.
  # `check-board` reconciles the board against issue state; `pnext-item` drives the worker loop.
  # They hold no protocol of their own, so they carry no ADR: each cites the skill it drives.
  - { id: check-board,             kind: skill,  source: .claude/skills/check-board }
  - { id: pnext-item,              kind: skill,  source: .claude/skills/pnext-item }
  - { id: fsgg-coord,              kind: client, source: scripts/fsgg-coord }
  # The engine tool manifest (#1077). `scripts/fsgg-coord` execs `fs.gg.coord.cli` — the typed engine —
  # and THIS `.config/dotnet-tools.json` is what lets a receiver `dotnet tool restore` it. It rode
  # `build-config` (4 receivers) while the shim above rode this kit (6), so templates and audio held a
  # shim they could not run. Carrying it here makes "receives the tool ⇒ can run the tool" STRUCTURAL,
  # and `validate` asserts the shim row and this row never separate onto different fabrics again.
  # A `kind: config` row names its own `dest`: the client's destination IS its source path, a config's
  # is not (canonical under dist/dotnet/ so pin-coherence still finds it; delivered to .config/).
  - { id: coord-engine-manifest,   kind: config, source: dist/dotnet/.config/dotnet-tools.json, dest: .config/dotnet-tools.json }
