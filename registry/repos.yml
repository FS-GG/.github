# The coordination kit every `coordination-kit` receiver must hold. The slice-2 sync
# (scripts/coordination-sync) writes these into each receiver; the coherence gate asserts the bytes.
#
# THE DIGESTS LIVE IN `repos.lock`, NOT HERE (#527). They used to be a `sha256:` field on each row,
# and that made this file a chokepoint: a kit source is content-addressed, so editing ANY skill — or
# `scripts/fsgg-coord`, which is itself a kit row — obliged the worker to re-pin a hash *in the middle
# of the authored roster*. Every kit edit therefore had to reserve `repos.yml` in its `Paths:`
# touch-set, and so serialised against every other kit edit AND against anyone genuinely authoring a
# roster row. Three workers deadlocked on it in one afternoon (#428).
#
# #309's rule — *a generated, CI-gated artifact must not be reserved in a touch-set* — could not reach
# it, because the rule classifies a FILE and the generated thing was a FIELD inside an authored one.
# Splitting the field out of the file is what lets the existing rule apply: `repos.lock` is emitted by
# a generator, guarded by a regeneration gate, and authored by nobody. This block is now purely
# authored — a row here is a decision, and reserving it means something again.
kit:
  - { id: cross-repo-coordination, kind: skill,  source: .claude/skills/cross-repo-coordination }
  - { id: intra-repo-parallel-work, kind: skill, source: .claude/skills/intra-repo-parallel-work }
  # Command skills — the two driver skills over the protocol the three items above define.
  # `check-board` reconciles the board against issue state; `pnext-item` drives the worker loop.
  # They hold no protocol of their own, so they carry no ADR: each cites the skill it drives.
  - { id: check-board,             kind: skill,  source: .claude/skills/check-board }
  - { id: pnext-item,              kind: skill,  source: .claude/skills/pnext-item }
  - { id: fsgg-coord,              kind: client, source: scripts/fsgg-coord }
  # THE ENGINE TOOL MANIFEST IS NO LONGER A KIT ROW (#1615, 2026-07-28, ADR-0068). Read that ADR
  # before re-adding it — this is a decision, not an omission.
  #
  # It WAS one, from #1077 until today, and the reasoning was good: `scripts/fsgg-coord` execs
  # `fs.gg.coord.cli`, and `.config/dotnet-tools.json` is what lets a receiver `dotnet tool restore`
  # it. The manifest rode `build-config` (4 receivers) while the shim above rode this kit (6), so
  # FS.GG.Templates and FS.GG.Audio held a shim with no engine to exec. Putting both on one fabric
  # made *"receives the tool ⇒ can run the tool"* STRUCTURAL, and `repos.sh validate` refused to let
  # the two rows separate again.
  #
  # WHAT IT COST, counted rather than argued. The pin is a HASHED kit source, so bumping
  # `fs.gg.coord.cli` by one integer edited kit content, staled `registry/repos.lock`, reddened
  # `kit-published-coherence` on `main`, and obliged a full FS.GG.Kit republish plus a seven-receiver
  # fan-out. Of the nine kit republishes measured on 2026-07-27/28, FOUR went through this row alone
  # (#1507, #1517, #1523, and kit 0.16.0) and not one of the nine carried a change to a skill. It also
  # made Renovate PR #1340 structurally unmergeable for five days: Renovate cannot run `repos.sh
  # relock`, so a +1/-1 bump to this file could never go green.
  #
  # THE INVARIANT IS NOT DROPPED — IT IS ASSERTED INSTEAD OF ARRANGED FOR. #1077's rule constrained
  # THIS repo's roster: two rows must share a fabric. Its replacement constrains the RECEIVERS' actual
  # trees: `scripts/repos-audit.sh`'s engine-manifest sweep reds daily unless every repo with
  # `receives: coordination-kit` has a `.config/dotnet-tools.json` declaring `fs.gg.coord.cli`. That is
  # strictly stronger — a receiver that deletes its manifest by hand was invisible to the fabric rule
  # and is caught by the sweep. Delivery of the VERSION is now Renovate's nuget manager, which already
  # reads `/(^|/)dotnet-tools\.json$/` as one of its four shipped `managerFilePatterns`.
  #
  # `dist/dotnet/.config/dotnet-tools.json` REMAINS in this repo as `.github`'s own canonical manifest
  # and as `pin-coherence`'s subject. It is simply no longer copied into anybody else's tree.
  #
  # ADR-0067 §9's REPLACEMENT, and the two library files without which it does not start (#1696).
  #
  # `scripts/skill-view` is the phase-2 generated view + §8's loud absence check (#1635). §9 forbids
  # retiring the old apparatus in a repo whose replacement is not present, and until this row existed
  # NO published FS.GG.Kit carried it — 0.14.0 included — so precondition 1 of the retirement order
  # (docs/coordination/skill-apparatus-retirement-order.md §4) failed on all seven receivers for a
  # reason no amount of BUMPING would have fixed. A perfectly current receiver still had no replacement.
  #
  # The two `lib/` rows are not padding and not a convenience. `skill-view` SOURCES both at startup
  # (lines 87-89) and dies on the missing one, so a kit that delivered the tool alone would deliver a
  # tool that cannot run — #1077's shim-without-its-engine-manifest defect, one tool over. They ride
  # as `kind: config` because a config row names its own dest and a client's dest IS its source
  # basename: `kind: client` would land `scripts/lib/roots.sh` at `scripts/roots.sh`, where nothing
  # sources it. `repos.sh validate` asserts the three never separate again — and since #1615 took the
  # engine manifest off this fabric (ADR-0068), this is the ONLY co-fabric rule `validate` still
  # carries. It survives for a reason the manifest's did not: `skill-view` sources these two files at
  # startup from ITS OWN delivered directory, so the coupling is internal to one kit payload and a
  # receiver-side sweep could not observe it any earlier than the tool's first invocation.
  #
  # TWO COSTS, both real and both accepted. (1) These are the first kit rows under `scripts/lib/`, a
  # directory four receivers already keep their own files in — checked 2026-07-28, and no receiver
  # holds an `args.sh` or a `roots.sh`, so nothing is clobbered today. A future kit row landing under
  # that path must re-check. (2) `scripts/lib/args.sh` and `scripts/lib/roots.sh` are shared by most
  # of this repo's own scripts, so editing EITHER now obliges an FS.GG.Kit republish and a seven-
  # receiver fan-out. `kit-published-coherence` enforces that; do not be surprised by it.
  - { id: skill-view,              kind: client, source: scripts/skill-view }
  - { id: skill-view-lib-args,     kind: config, source: scripts/lib/args.sh,  dest: scripts/lib/args.sh }
  - { id: skill-view-lib-roots,    kind: config, source: scripts/lib/roots.sh, dest: scripts/lib/roots.sh }
  #
  # THE SESSIONSTART HOOK IS NOT A KIT ROW (.github#1700, 2026-07-29). Read this before adding one:
  # it is a decision with a named blocker, not an omission nobody noticed.
  #
  # ADR-0067 §8 requires the loud absence check *"at checkout AND in CI"*. #1696 made the CI half
  # structural for every receiver through the kit materializer. The CHECKOUT half is
  # `.claude/hooks/skill-view-check.sh`, and #1700 repaired the hole in it — it now asks
  # `scripts/skill-view` for the root's CLASS instead of re-deriving a weaker `-d` test that read
  # "dangling" as "not here" and exited 0 in silence. THAT REPAIR IS `.github`-ONLY. So on the fleet,
  # §8's checkout half is `.github`-only today; the three rows above deliver the tool, not the hook
  # that runs it at session start.
  #
  # WHY THE ROW WAS NOT ADDED BY #1700, in the order the two reasons bind:
  #   1. Shipping the script alone RESTORES NOTHING on any receiver. A hook does not run because it
  #      is on disk — it runs because `.claude/settings.json` names it under `SessionStart`, and that
  #      file is receiver-AUTHORED. Overwriting it would destroy their hooks: the #387 class, which
  #      the materializer already refuses to do for `.props`. So the wiring is per-receiver stage-1
  #      work (docs/coordination/skill-apparatus-retirement-order.md) either way, and a row here only
  #      pre-positions the script so that change is a settings-only edit instead of authoring a script.
  #   2. A new row changes kit CONTENT, so `kit-published-coherence`'s `pr-arm` requires
  #      `src/FS.GG.Kit/FS.GG.Kit.csproj` `<Version>` to move ahead of the newest published kit in the
  #      SAME diff. That file sat in another worker's declared touch-set for the whole of #1700
  #      (`.github#1680`), so the bump could not ride that PR without the overlap the claim protocol
  #      forbids. This is a scheduling fact with a date on it, not a property of the row.
  #
  # Adding it later is cheap and correct. It costs one FS.GG.Kit republish and a seven-receiver
  # fan-out, exactly like the three rows above, and it must not be added by a PR that cannot also
  # bump the version — see `.github/workflows/kit-published-coherence.yml`'s header on #1581/#1591
  # for what that costs `main` when the row lands without it.
