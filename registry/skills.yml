  # fs-gg-project was formerly gated `lifecycle == spec-kit`, so under the `sdd`/`none` lanes NEITHER
  # producer supplied it (SDD's SeededSkills deliberately EXCLUDES the product-internal project skill)
  # — a genuine supply gap the "declared ∧ absent" tolerance hid (§C2). Rendering chose Option A:
  # widen the producer condition to be profile-scoped and lifecycle-INDEPENDENT, so the
  # product-orientation umbrella now materializes on EVERY lane whose profile matches. This row is now
  # an ordinary profile-gated product skill (same predicate as fs-gg-scene above); SDD's SeededSkills
