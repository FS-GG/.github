  # (`always`). The one binding clause used to be fs-gg-feedback-capture's
  # `feedback == true and lifecycle == spec-kit`, but ADR-0056 D3 froze capture and Rendering#951
  # removed it, so the driver no longer ANDs against the retired skill (step 4 is report-only);
  # the AND-of-producers collapses to `always`, and the driver finally materializes on the `sdd` lane
  # it was built for. registry = manifest = bytes: sha256 is the canonical-body digest of the authored
  # SKILL.md, reconciled from the driver manifest (predicate flip + re-digest: .github#1247).
