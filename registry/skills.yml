  #
  # The THIRD skill class. `process`/`product` rows are reconciled from a *producer* repo's manifest;
  # a `driver` row is reconciled from `.github`'s OWN producer manifest (registry/driver-skill-manifest.json,
  # emitted by scripts/generate-driver-manifest) — `.github` is a producer of its own authored drivers.
  # This is the schema growth ADR-0054 pays for (schemaVersion 1→2 below); it buys the quadrant
  # `.github`-authored → product trees, which neither the coordination kit (→ framework repos) nor the
  # producer catalog (producer-owned → product trees) occupies. Authorship stays in `.github`'s two
  # ADR-0011 skill roots; the `driver` class is precisely what lets a `.github`-authored skill ride the
  # product-materialization fabric without pretending a producer owns it.
