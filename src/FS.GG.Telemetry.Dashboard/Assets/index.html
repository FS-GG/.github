<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>FS-GG private telemetry</title><link rel="stylesheet" href="/private/dashboard/styles.css"><script defer src="/private/dashboard/app.js"></script></head>
<body><header><p>FS-GG</p><h1>Private telemetry</h1><button id="logout" type="button" hidden>Sign out</button></header><main>
<form id="login"><h2>Sign in</h2><label>Principal <input name="principalId" required maxlength="128" autocomplete="username"></label><label>Access key <input name="accessKey" required type="password" autocomplete="current-password"></label><button type="submit">Sign in</button><p id="login-error" role="alert" hidden>Sign-in failed.</p></form><p id="local-ended" role="alert" hidden>This local session ended. Restart telemetry dashboard serve for a fresh URL.</p>
<div id="dashboard" hidden><section aria-labelledby="workspace-heading"><h2 id="workspace-heading">Workspace</h2><label>Select workspace <select id="workspace"></select></label><p id="freshness"></p></section><section aria-labelledby="health-heading"><h2 id="health-heading">Storage</h2><p id="health">Loading…</p></section><section aria-labelledby="items-heading"><h2 id="items-heading">Observed items</h2><div id="items" role="list"></div></section><p id="error" role="alert" hidden></p></div>
</main></body></html>
