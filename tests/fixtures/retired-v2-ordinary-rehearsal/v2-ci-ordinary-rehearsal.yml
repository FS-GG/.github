name: V2 ordinary settlement isolated rehearsal

on:
  workflow_dispatch:
    inputs:
      fault:
        description: Bounded sandbox fault or refusal control
        required: true
        type: choice
        default: none
        options: [none, lost-ref-reply, ref-conflict, wrong-authorizer, wrong-app-id, stale-receipt, wrong-workflow]

permissions:
  actions: read
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: v2-ci-ordinary-rehearsal-${{ github.sha }}
  cancel-in-progress: false

jobs:
  preflight:
    name: ordinary-v2-rehearsal-secret-free-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      receipt_sha256: ${{ steps.receipt.outputs.sha256 }}
      activation: ${{ steps.receipt.outputs.activation }}
    steps:
      - name: Check out exact protected rehearsal source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Observe native source and required-check evidence
        id: receipt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          python3 tools/v2-ci-ordinary-observe.py produce-rehearsal "$RUNNER_TEMP/ordinary-v2-rehearsal-preflight.json"
          digest="$(sha256sum "$RUNNER_TEMP/ordinary-v2-rehearsal-preflight.json" | cut -d ' ' -f 1)"
          activation="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["activation"]).lower())' "$RUNNER_TEMP/ordinary-v2-rehearsal-preflight.json")"
          echo "sha256=$digest" >> "$GITHUB_OUTPUT"
          echo "activation=$activation" >> "$GITHUB_OUTPUT"
      - name: Retain public exact-run rehearsal receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ordinary-v2-rehearsal-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ordinary-v2-rehearsal-preflight.json
          retention-days: 30
          if-no-files-found: error

  rehearse:
    name: ordinary-v2-isolated-credential-rehearsal
    needs: [preflight]
    if: needs.preflight.outputs.activation == 'true'
    environment: ordinary-v2-rehearsal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PACKAGE_VERSION: 0.1.2
      PACKAGE_SHA256: 627d9f54d038d47ef59635f92bd4fd4af2da7bfc971a938b6de1292503b0307e
    permissions:
      actions: read
      contents: read
      checks: read
      pull-requests: read
    steps:
      - name: Check out exact protected rehearsal source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Download only this run's rehearsal receipt
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ordinary-v2-rehearsal-preflight-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ordinary-v2-rehearsal-receipt
      - name: Recheck the receipt and current public rehearsal authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          EXPECTED_RECEIPT_SHA256: ${{ needs.preflight.outputs.receipt_sha256 }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ordinary-v2-rehearsal-receipt/ordinary-v2-rehearsal-preflight.json"
          test "$(sha256sum "$receipt" | cut -d ' ' -f 1)" = "$EXPECTED_RECEIPT_SHA256"
          python3 tools/v2-ci-ordinary-observe.py verify-rehearsal "$receipt"
      - name: Set up the pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Install only the pinned public Coordination CLI archive
        shell: bash
        run: |
          set -euo pipefail
          package_dir="$RUNNER_TEMP/ordinary-v2-package"
          mkdir "$package_dir"
          package="$package_dir/FS.GG.Coordination.Cli.$PACKAGE_VERSION.nupkg"
          curl --fail --location --silent --show-error \
            "https://api.nuget.org/v3-flatcontainer/fs.gg.coordination.cli/$PACKAGE_VERSION/fs.gg.coordination.cli.$PACKAGE_VERSION.nupkg" \
            --output "$package"
          test "$(sha256sum "$package" | cut -d ' ' -f 1)" = "$PACKAGE_SHA256"
          config="$RUNNER_TEMP/ordinary-v2-local-only.config"
          cat > "$config" <<CFG
          <?xml version="1.0" encoding="utf-8"?><configuration><packageSources><clear/><add key="pinned" value="$package_dir"/></packageSources></configuration>
          CFG
          dotnet tool install FS.GG.Coordination.Cli --version "$PACKAGE_VERSION" \
            --tool-path "$RUNNER_TEMP/ordinary-v2-cli" --configfile "$config" --no-cache
      - name: Prove fresh sandbox aggregate before a fault rehearsal
        if: inputs.fault != 'none'
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/v2-ci-ordinary-rehearsal-readback.py absent \
            "$RUNNER_TEMP/ordinary-v2-rehearsal-receipt/ordinary-v2-rehearsal-preflight.json"
      - name: Execute one bounded sandbox settlement attempt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          FSGG_V2_REHEARSAL_PREFLIGHT_RECEIPT: ${{ runner.temp }}/ordinary-v2-rehearsal-receipt/ordinary-v2-rehearsal-preflight.json
          FSGG_V2_REHEARSAL_FAULT: ${{ inputs.fault }}
          V2_ORDINARY_REHEARSAL_APP_ID: ${{ secrets.V2_ORDINARY_REHEARSAL_APP_ID }}
          V2_ORDINARY_REHEARSAL_APP_PRIVATE_KEY: ${{ secrets.V2_ORDINARY_REHEARSAL_APP_PRIVATE_KEY }}
          V2_ORDINARY_REHEARSAL_AUTHORIZER_PRIVATE_KEY: ${{ secrets.V2_ORDINARY_REHEARSAL_AUTHORIZER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$V2_ORDINARY_REHEARSAL_APP_ID" || exit 1
          test -n "$V2_ORDINARY_REHEARSAL_APP_PRIVATE_KEY" || exit 1
          test -n "$V2_ORDINARY_REHEARSAL_AUTHORIZER_PRIVATE_KEY" || exit 1
          selected_fault="$FSGG_V2_REHEARSAL_FAULT"
          case "$selected_fault" in
            wrong-authorizer)
              synthetic_key="$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null)"
              test -n "$synthetic_key"
              export V2_ORDINARY_REHEARSAL_AUTHORIZER_PRIVATE_KEY="$synthetic_key"
              unset synthetic_key
              export FSGG_V2_REHEARSAL_FAULT=none
              ;;
            wrong-app-id)
              export V2_ORDINARY_REHEARSAL_APP_ID=1
              export FSGG_V2_REHEARSAL_FAULT=none
              ;;
            stale-receipt)
              python3 - "$FSGG_V2_REHEARSAL_PREFLIGHT_RECEIPT" <<'PY'
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          receipt = json.loads(path.read_text(encoding="utf-8"))
          receipt["sourceSha"] = "0" * 40
          path.write_text(json.dumps(receipt), encoding="utf-8")
          PY
              export FSGG_V2_REHEARSAL_FAULT=none
              ;;
            wrong-workflow)
              export EXPECTED_WORKFLOW_SHA=0000000000000000000000000000000000000000
              export FSGG_V2_REHEARSAL_FAULT=none
              ;;
          esac
          set +e
          "$RUNNER_TEMP/ordinary-v2-cli/fsgg-coordination" ordinary-settlement rehearse \
            > "$RUNNER_TEMP/ordinary-v2-rehearsal-outcome.json" \
            2> "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt"
          status=$?
          set -e
          if test "$status" -ne 0; then
            python3 - "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt" <<'PY'
          import pathlib
          import re
          import sys
          value = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8", errors="replace")
          words = re.findall(r"[A-Za-z][A-Za-z0-9-]*", value)
          public_codes = [word for word in words[:6] if len(word) <= 48]
          print("ordinary-v2-rehearsal-refusal-codes=" + ",".join(public_codes))
          PY
          fi
          case "$selected_fault" in
            none)
              test "$status" -eq 0 || exit 1
              grep -Eq 'Settlement(Succeeded|AlreadyComplete)' "$RUNNER_TEMP/ordinary-v2-rehearsal-outcome.json" || exit 1
              ;;
            lost-ref-reply)
              test "$status" -eq 3 || exit 1
              grep -Fq 'SettlementPending "effect-response-unknown"' "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt" || exit 1
              ;;
            ref-conflict)
              test "$status" -eq 3 || exit 1
              grep -Fq 'ordinary-settlement-refused:SettlementJournalConflict' "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt" || exit 1
              ;;
            wrong-authorizer)
              test "$status" -eq 3 || exit 1
              grep -Fq 'SettlementProviderUnavailable "authorizer-spki"' "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt" || exit 1
              ;;
            wrong-app-id)
              test "$status" -eq 3 || exit 1
              grep -Fq 'SettlementProviderUnavailable "app-id-anchor"' "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt" || exit 1
              ;;
            stale-receipt|wrong-workflow)
              test "$status" -eq 3 || exit 1
              grep -Fq 'SettlementProviderUnavailable "current-source-observer-refused"' "$RUNNER_TEMP/ordinary-v2-rehearsal-error.txt" || exit 1
              ;;
            *) exit 1 ;;
          esac
          printf 'fault=%s expected-outcome-observed=true\n' "$selected_fault"
      - name: Read back the sandbox after the first attempt without credentials
        shell: bash
        env:
          FAULT: ${{ inputs.fault }}
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ordinary-v2-rehearsal-receipt/ordinary-v2-rehearsal-preflight.json"
          case "$FAULT" in
            none) mode=complete ;;
            lost-ref-reply) mode=pending-effect ;;
            ref-conflict|wrong-authorizer|wrong-app-id|stale-receipt|wrong-workflow) mode=absent ;;
            *) exit 1 ;;
          esac
          for attempt in 1 2 3 4 5 6; do
            if python3 tools/v2-ci-ordinary-rehearsal-readback.py "$mode" "$receipt"; then exit 0; fi
            if test "$mode" = absent || test "$attempt" -eq 6; then exit 1; fi
            sleep 2
          done
      - name: Replay the durable unknown result with no fault
        if: inputs.fault == 'lost-ref-reply'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_WORKFLOW_SHA: ${{ github.workflow_sha }}
          FSGG_V2_REHEARSAL_PREFLIGHT_RECEIPT: ${{ runner.temp }}/ordinary-v2-rehearsal-receipt/ordinary-v2-rehearsal-preflight.json
          FSGG_V2_REHEARSAL_FAULT: none
          V2_ORDINARY_REHEARSAL_APP_ID: ${{ secrets.V2_ORDINARY_REHEARSAL_APP_ID }}
          V2_ORDINARY_REHEARSAL_APP_PRIVATE_KEY: ${{ secrets.V2_ORDINARY_REHEARSAL_APP_PRIVATE_KEY }}
          V2_ORDINARY_REHEARSAL_AUTHORIZER_PRIVATE_KEY: ${{ secrets.V2_ORDINARY_REHEARSAL_AUTHORIZER_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/ordinary-v2-cli/fsgg-coordination" ordinary-settlement rehearse \
            > "$RUNNER_TEMP/ordinary-v2-rehearsal-replay.json"
          grep -Eq 'Settlement(Succeeded|AlreadyComplete)' "$RUNNER_TEMP/ordinary-v2-rehearsal-replay.json"
      - name: Read back the completed replay without credentials
        if: inputs.fault == 'lost-ref-reply'
        shell: bash
        run: |
          set -euo pipefail
          receipt="$RUNNER_TEMP/ordinary-v2-rehearsal-receipt/ordinary-v2-rehearsal-preflight.json"
          for attempt in 1 2 3 4 5 6; do
            if python3 tools/v2-ci-ordinary-rehearsal-readback.py complete "$receipt"; then exit 0; fi
            if test "$attempt" -eq 6; then exit 1; fi
            sleep 2
          done
