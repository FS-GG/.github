# Pending coherent adoption: provider v2 requires published, installed SDD >=2.1.0 before activation.
# Provisional knowledge-CI successor source: publication and public installed adoption remain pending.
# PRODUCT SKILLS THIS PROVIDER DELIVERS (FS.GG.Templates#347). A product scaffolded through this
# provider receives, in `.agents/skills/`, the owner-sourced generic Fable skills selected for
# `fs-gg-fable-bindings` — `fable-project`, `fable-interop`, `fable-testing`, `fable-bindings` —
# plus the producer manifest `.agents/skills/skill-manifest.json` that declares and digests them.
#
# `fable-bindings` here SUPERSEDES the short Babylon-specific SKILL.md this template used to carry
# as a checked-in copy (`skills/fable-bindings/SKILL.md` and the twin under the template tree: two
# files, one blob, kept equal by a `cmp` in the composition lane). The template is parameterized
# over `npmPackage`/`npmVersion`/`bindingTarget`, so guidance naming one npm package was wrong for
# every other instantiation of it; the owner-sourced skill is generic, as #347 requires.
#
# The claim is executable, not schema: the scaffold-provider contract (1.1.0) has no delivered-skill
# field, so what holds it up is the `assert-product` arm of scripts/generate-skill-manifest.fsx,
# run against a product instantiated from the packed archive in tests/composition/fable-bindings/run.sh.
