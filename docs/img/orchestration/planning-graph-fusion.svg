<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Six planning graphs fused into one canonical snapshot</title>
  <desc id="desc">Product contract, work, coordination, evidence, CI, and resource graphs remain distinct inputs. Typed joins combine them into a canonical PlanningSnapshot used by bounded planners and an independent verifier.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#475569"/></marker><style>.h{font:700 18px system-ui;fill:#0f172a}.p{font:14px system-ui;fill:#334155}.id{font:700 12px ui-monospace,monospace;fill:#475569}.e{stroke:#475569;stroke-width:2;fill:none;marker-end:url(#a)}.n{rx:12;stroke-width:2}</style></defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="55" y="42" class="id">TYPED GRAPH FUSION — EDGES KEEP THEIR SEMANTICS</text>
  <g transform="translate(55 80)"><rect class="n" width="245" height="90" fill="#dbeafe" stroke="#2563eb"/><text x="20" y="34" class="h">Product / contract</text><text x="20" y="60" class="p">behavior · compatibility · owner</text></g>
  <g transform="translate(55 205)"><rect class="n" width="245" height="90" fill="#e0e7ff" stroke="#4f46e5"/><text x="20" y="34" class="h">Work</text><text x="20" y="60" class="p">precedence · mode · rework</text></g>
  <g transform="translate(55 330)"><rect class="n" width="245" height="90" fill="#f3e8ff" stroke="#9333ea"/><text x="20" y="34" class="h">Coordination</text><text x="20" y="60" class="p">touch conflict · communication</text></g>
  <g transform="translate(900 80)"><rect class="n" width="245" height="90" fill="#dcfce7" stroke="#16a34a"/><text x="20" y="34" class="h">Evidence</text><text x="20" y="60" class="p">proves · invalidates · supersedes</text></g>
  <g transform="translate(900 205)"><rect class="n" width="245" height="90" fill="#fef3c7" stroke="#d97706"/><text x="20" y="34" class="h">CI</text><text x="20" y="60" class="p">requires · consumes · produces</text></g>
  <g transform="translate(900 330)"><rect class="n" width="245" height="90" fill="#fee2e2" stroke="#dc2626"/><text x="20" y="34" class="h">Resources</text><text x="20" y="60" class="p">capacity · calendar · budget</text></g>
  <rect class="n" x="410" y="155" width="380" height="195" fill="#fff" stroke="#0f766e" stroke-width="3"/><text x="445" y="198" class="id">CANONICAL</text><text x="445" y="232" class="h">PlanningSnapshot</text><text x="445" y="263" class="p">stable IDs + schema versions</text><text x="445" y="289" class="p">completeness + estimate provenance</text><text x="445" y="315" class="p">resource state + policy identity</text>
  <rect class="n" x="350" y="480" width="220" height="90" fill="#ecfeff" stroke="#0891b2"/><text x="374" y="515" class="h">Bounded planners</text><text x="374" y="542" class="p">candidate alternatives</text>
  <rect class="n" x="630" y="480" width="220" height="90" fill="#f0fdf4" stroke="#16a34a"/><text x="654" y="515" class="h">Verifier</text><text x="654" y="542" class="p">recompute constraints</text>
  <path class="e" d="M300 125L400 190"/><path class="e" d="M300 250H400"/><path class="e" d="M300 375L400 315"/><path class="e" d="M900 125L800 190"/><path class="e" d="M900 250H800"/><path class="e" d="M900 375L800 315"/><path class="e" d="M550 350L485 470"/><path class="e" d="M650 350L715 470"/><path class="e" d="M570 525H620"/>
  <text x="55" y="470" class="p">Matrix view: DSM / conflicts</text><text x="900" y="470" class="p">Graph view: dependency / flow</text>
</svg>
