<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 500" role="img" aria-labelledby="title desc">
  <title id="title">Claim-before-spawn admission pipeline</title><desc id="desc">A nine-stage left-to-right pipeline begins with complete observation and ends with a sandboxed agent. A local reservation is not authority. The externally verified claim generation is the grant boundary. Lost races release the reservation, and lost generations revoke the running attempt.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker><style>.t{font:700 15px system-ui;fill:#0f172a}.s{font:12px system-ui;fill:#475569}.k{font:700 12px ui-monospace;fill:#475569}.b{rx:10;stroke-width:2}.e{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.d{stroke:#dc2626;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1400" height="500" fill="#f8fafc"/><text x="45" y="42" class="k">WRITE-CAPABLE ATTEMPT — CLAIM BEFORE SPAWN</text>
  <g transform="translate(35 105)"><rect class="b" width="135" height="100" fill="#dbeafe" stroke="#2563eb"/><text x="14" y="31" class="t">1 Observe</text><text x="14" y="57" class="s">complete facts</text><text x="14" y="76" class="s">fresh fingerprint</text></g>
  <g transform="translate(190 105)"><rect class="b" width="135" height="100" fill="#e0e7ff" stroke="#4f46e5"/><text x="14" y="31" class="t">2 Decide</text><text x="14" y="57" class="s">checked candidate</text><text x="14" y="76" class="s">bounded mode</text></g>
  <g transform="translate(345 105)"><rect class="b" width="135" height="100" fill="#fef3c7" stroke="#d97706"/><text x="14" y="31" class="t">3 Reserve</text><text x="14" y="57" class="s">local capacity</text><text x="14" y="76" class="s">short TTL</text></g>
  <g transform="translate(500 105)"><rect class="b" width="135" height="100" fill="#f3e8ff" stroke="#9333ea"/><text x="14" y="31" class="t">4 Plan claim</text><text x="14" y="57" class="s">typed transition</text><text x="14" y="76" class="s">touch set</text></g>
  <g transform="translate(655 105)"><rect class="b" width="135" height="100" fill="#fee2e2" stroke="#dc2626"/><text x="14" y="31" class="t">5 Journal</text><text x="14" y="57" class="s">protected ref</text><text x="14" y="76" class="s">generation G42</text></g>
  <g transform="translate(810 105)"><rect class="b" width="135" height="100" fill="#dcfce7" stroke="#16a34a"/><text x="14" y="31" class="t">6 Verify</text><text x="14" y="57" class="s">read accepted</text><text x="14" y="76" class="s">claim + fence</text></g>
  <g transform="translate(965 105)"><rect class="b" width="135" height="100" fill="#ccfbf1" stroke="#0f766e"/><text x="14" y="31" class="t">7 Grant</text><text x="14" y="57" class="s">WorkGranted</text><text x="14" y="76" class="s">durable event</text></g>
  <g transform="translate(1120 105)"><rect class="b" width="135" height="100" fill="#e0f2fe" stroke="#0284c7"/><text x="14" y="31" class="t">8 Prepare</text><text x="14" y="57" class="s">isolated worktree</text><text x="14" y="76" class="s">signed receipt</text></g>
  <g transform="translate(1275 105)"><rect class="b" width="100" height="100" fill="#ecfccb" stroke="#65a30d"/><text x="12" y="31" class="t">9 Spawn</text><text x="12" y="57" class="s">sandbox</text><text x="12" y="76" class="s">G42 token</text></g>
  <path class="e" d="M170 155h10"/><path class="e" d="M325 155h10"/><path class="e" d="M480 155h10"/><path class="e" d="M635 155h10"/><path class="e" d="M790 155h10"/><path class="e" d="M945 155h10"/><path class="e" d="M1100 155h10"/><path class="e" d="M1255 155h10"/>
  <line x1="955" y1="72" x2="955" y2="240" stroke="#0f766e" stroke-width="4"/><text x="968" y="78" class="k">AUTHORITY / GRANT BOUNDARY</text>
  <rect class="b" x="345" y="315" width="240" height="95" fill="#fff" stroke="#dc2626"/><text x="365" y="348" class="t">Claim loses race</text><text x="365" y="375" class="s">release reservation; do not spawn</text><path class="d" d="M722 205C690 275 585 280 535 305"/>
  <rect class="b" x="1035" y="315" width="290" height="95" fill="#fff" stroke="#dc2626"/><text x="1055" y="348" class="t">Generation later lost</text><text x="1055" y="375" class="s">revoke capability; freeze runner; inspect</text><path class="d" d="M1325 205v100"/>
  <text x="45" y="460" class="s">Speculative read-only work follows a separate lane: no shared branch, provider mutation, delivery reservation, or promotion without re-entering at step 1.</text>
</svg>
