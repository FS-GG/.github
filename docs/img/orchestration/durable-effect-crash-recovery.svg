<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1320 650" role="img" aria-labelledby="title desc">
  <title id="title">Durable effect protocol and crash recovery</title><desc id="desc">A command is deduplicated, then the domain event and effect intent commit atomically before acknowledgement. Dispatch re-reads authority, applies a fenced provider effect, verifies post-state, and atomically records the receipt and settlement. Crashes after provider acceptance recover by observing before retrying.</desc>
  <defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0v6l9-3z" fill="#334155"/></marker><style>.h{font:700 17px system-ui;fill:#0f172a}.s{font:13px system-ui;fill:#475569}.k{font:700 12px ui-monospace;fill:#475569}.b{rx:10;stroke-width:2}.e{stroke:#334155;stroke-width:2;fill:none;marker-end:url(#a)}.x{stroke:#dc2626;stroke-width:3;stroke-dasharray:7 5}</style></defs>
  <rect width="1320" height="650" fill="#f8fafc"/><text x="45" y="42" class="k">AT-LEAST-ONCE RECOVERY — OBSERVE UNKNOWN OUTCOMES BEFORE RETRY</text>
  <rect class="b" x="45" y="95" width="180" height="90" fill="#dbeafe" stroke="#2563eb"/><text x="65" y="129" class="h">Command</text><text x="65" y="156" class="s">validate + deduplicate</text>
  <rect class="b" x="285" y="75" width="225" height="130" fill="#e0e7ff" stroke="#4f46e5"/><text x="305" y="109" class="h">Atomic commit A</text><text x="305" y="138" class="s">domain event</text><text x="305" y="162" class="s">+ effect intent</text><text x="305" y="186" class="s">+ inbox position</text>
  <rect class="b" x="570" y="95" width="180" height="90" fill="#fef3c7" stroke="#d97706"/><text x="590" y="129" class="h">Acknowledge</text><text x="590" y="156" class="s">durable position only</text>
  <rect class="b" x="810" y="95" width="180" height="90" fill="#f3e8ff" stroke="#9333ea"/><text x="830" y="129" class="h">Dispatch</text><text x="830" y="156" class="s">re-read authority</text>
  <rect class="b" x="1050" y="95" width="225" height="90" fill="#fee2e2" stroke="#dc2626"/><text x="1070" y="129" class="h">Provider effect</text><text x="1070" y="156" class="s">fenced + idempotent</text>
  <rect class="b" x="1050" y="300" width="225" height="90" fill="#dcfce7" stroke="#16a34a"/><text x="1070" y="334" class="h">Verify post-state</text><text x="1070" y="361" class="s">complete fresh observation</text>
  <rect class="b" x="735" y="280" width="255" height="130" fill="#ccfbf1" stroke="#0f766e"/><text x="755" y="314" class="h">Atomic commit B</text><text x="755" y="343" class="s">verified receipt</text><text x="755" y="367" class="s">+ outbox settlement</text><text x="755" y="391" class="s">one aggregate transition</text>
  <path class="e" d="M225 140h50"/><path class="e" d="M510 140h50"/><path class="e" d="M750 140h50"/><path class="e" d="M990 140h50"/><path class="e" d="M1162 185v105"/><path class="e" d="M1050 345h-50"/>
  <line class="x" x1="1018" y1="65" x2="1018" y2="225"/><text x="980" y="245" class="k">CRASH WINDOW</text>
  <rect class="b" x="405" y="500" width="510" height="105" fill="#fff" stroke="#dc2626"/><text x="430" y="535" class="h">Recovery of unsettled intent</text><text x="430" y="564" class="s">Re-observe GitHub → AlreadyApplied | Conflict | StillEligible</text><text x="430" y="588" class="s">Only StillEligible may retry; charts and journal state cannot infer success.</text>
  <path class="e" d="M1018 225C1018 450 900 470 850 490"/><path class="e" d="M475 490C320 430 320 250 385 215"/>
  <text x="45" y="630" class="s">Invariant: projection tables and background queues may accelerate dispatch, but the authoritative intent remains recoverable from committed aggregate events.</text>
</svg>
