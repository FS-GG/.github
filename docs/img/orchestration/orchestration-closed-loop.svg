<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Operations-research orchestration closed loop</title>
  <desc id="desc">Complete observations enter a canonical planning snapshot. Feasibility, planners, and uncertainty models produce a checked decision plan. Durable execution drives agents, CI, review, and provider effects. Verified outcomes return as new observations. GitHub, Git, and the typed engine remain the external authority.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <style>
      .box{rx:14;stroke-width:2}.t{font:600 18px system-ui,sans-serif;fill:#0f172a}.s{font:14px system-ui,sans-serif;fill:#334155}.k{font:700 12px system-ui,sans-serif;letter-spacing:.08em;fill:#475569}.edge{fill:none;stroke:#334155;stroke-width:2.5;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="560" fill="#f8fafc"/>
  <text x="55" y="45" class="k">AUTHENTICATED, REPLAYABLE DECISION LOOP</text>
  <rect class="box" x="55" y="80" width="235" height="100" fill="#dbeafe" stroke="#2563eb"/>
  <text x="78" y="116" class="t">Complete observations</text><text x="78" y="143" class="s">provider facts + event history</text><text x="78" y="164" class="s">accepted policy + completeness</text>
  <rect class="box" x="360" y="80" width="235" height="100" fill="#e0e7ff" stroke="#4f46e5"/>
  <text x="383" y="116" class="t">PlanningSnapshot</text><text x="383" y="143" class="s">canonical bytes + fingerprint</text><text x="383" y="164" class="s">graphs, estimates, resources</text>
  <rect class="box" x="665" y="60" width="210" height="78" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="688" y="94" class="t">Feasibility</text><text x="688" y="119" class="s">authority + constraints</text>
  <rect class="box" x="665" y="158" width="210" height="78" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="688" y="192" class="t">OR planners</text><text x="688" y="217" class="s">schedule + allocate + shape</text>
  <rect class="box" x="665" y="256" width="210" height="78" fill="#f3e8ff" stroke="#9333ea"/>
  <text x="688" y="290" class="t">Uncertainty</text><text x="688" y="315" class="s">estimates + scenarios</text>
  <rect class="box" x="945" y="158" width="210" height="100" fill="#dcfce7" stroke="#16a34a"/>
  <text x="968" y="194" class="t">Checked plan</text><text x="968" y="221" class="s">independent verification</text><text x="968" y="242" class="s">bounded commitment horizon</text>
  <rect class="box" x="945" y="330" width="210" height="100" fill="#ffedd5" stroke="#ea580c"/>
  <text x="968" y="366" class="t">Durable execution</text><text x="968" y="393" class="s">agents · CI · review</text><text x="968" y="414" class="s">fenced provider effects</text>
  <rect class="box" x="565" y="405" width="285" height="105" fill="#fee2e2" stroke="#dc2626"/>
  <text x="588" y="441" class="t">Verified outcomes</text><text x="588" y="468" class="s">post-state receipts · failures · waits</text><text x="588" y="489" class="s">prediction error · resource changes</text>
  <rect class="box" x="55" y="365" width="380" height="145" fill="#f1f5f9" stroke="#475569"/>
  <text x="78" y="401" class="t">External coordination authority</text><text x="78" y="430" class="s">GitHub + protected Git refs</text><text x="78" y="455" class="s">typed transition legality + generation fencing</text><text x="78" y="480" class="s">never inferred from a chart, actor, or LLM</text>
  <path class="edge" d="M290 130 H350"/><path class="edge" d="M595 130 C625 130 625 99 655 99"/><path class="edge" d="M595 130 C625 130 625 197 655 197"/><path class="edge" d="M595 130 C625 130 625 295 655 295"/>
  <path class="edge" d="M875 99 C910 99 910 183 935 183"/><path class="edge" d="M875 197 H935"/><path class="edge" d="M875 295 C910 295 910 233 935 233"/><path class="edge" d="M1050 258 V320"/><path class="edge" d="M945 380 H860"/><path class="edge" d="M565 457 H445"/>
  <path class="edge" d="M565 430 C475 350 350 260 245 190"/><path class="edge" d="M435 410 C610 365 760 350 935 365"/>
</svg>
