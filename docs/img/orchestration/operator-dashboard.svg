<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Illustrative operations-research orchestration dashboard</title><desc id="desc">A dashboard mockup with global freshness and authority status, bottleneck cards, a queue and work grid, an interactive dependency pipeline, a WIP and cycle-time chart, and a selected decision receipt. Concrete sample values show one blocked review queue, two quarantined items, and a selected plan with snapshot and policy identifiers.</desc>
